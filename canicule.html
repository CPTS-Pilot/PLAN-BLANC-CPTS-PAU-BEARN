  const opts = { method: methode, headers: { 'X-Code-Acces': codeAcces } };
  if(corps){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(corps);
  }
  const r = await fetch(API, opts);
  let d = null;
  try{ d = await r.json(); }catch(e){}
  return { ok: r.ok, statut: r.status, corps: d };
}

function appliquerDistant(d){
  versionServeur = d && d.version ? d.version : 0;
  const src = (d && d.donnees) || {};
  if(Array.isArray(src.diffusions)) diffusionsHeritees = src.diffusions;

  /* Le carnet de coordonnées ne se remplace pas, il se complète.
     Un numéro saisi ici et pas encore connu du serveur survit donc à
     la relève, et repart au prochain enregistrement : c'est ce qui
     manquait quand les numéros des pilotes disparaissaient. En cas de
     saisie concurrente sur la même personne, c'est la plus récente
     qui l'emporte, champ par champ — voir fusionnerCarnet. */
  normaliserPersonnes();
  const carnetLocal = fusionnerCarnet(carnetSecours, etat.personnes);

  for(const k in etatInitial){ if(src[k] !== undefined) etat[k] = src[k]; }
  /* Ce qui vient d'arriver du serveur, avant qu'on y ajoute quoi que
     ce soit : c'est à cette copie-là qu'on se compare plus bas. */
  const recu = {};
  RUBRIQUES.forEach(k => { recu[k] = empreinteDe(k); });
  fusionnerNouveautes();
  normaliserPersonnes();

  const carnetServeur = etat.personnes;
  etat.personnes = fusionnerCarnet(carnetLocal, carnetServeur);
  /* Ce que le serveur ignore encore — une fiche entière comme un
     simple numéro — doit repartir : on marque la rubrique comme à
     envoyer plutôt que comme synchronisée. */
  const aDeposer = JSON.stringify(etat.personnes) !== JSON.stringify(carnetServeur);
  /* Le filet se remet à jour sur le carnet fusionné : il ne garde
     jamais moins que ce qui est connu, et suit les effacements
     volontaires faits ailleurs, qui portent une date plus récente. */
  carnetSecours = copie(etat.personnes);
  marquerSynchronise();
  if(aDeposer) empreinte.personnes = null;
  /* Même règle pour ce que l'ouverture du cockpit vient d'écrire de
     lui-même : entrées de main courante posées après coup pour un
     besoin, une collecte ou une remontée déjà saisis, fiches de
     l'amorçage, champs comblés. Sans ça, marquerSynchronise() les
     déclarait déjà partagées alors qu'elles n'avaient jamais quitté
     ce navigateur : elles s'affichaient ici, chez personne d'autre,
     et disparaissaient avec la copie locale. */
  RUBRIQUES.forEach(k => { if(empreinteDe(k) !== recu[k]) empreinte[k] = null; });
}

/* Renvoie 'ok', 'code' (code d'accès à fournir) ou 'absent'
   (pas d'hébergement en face : on reste en local). */
async function joindreServeur(){
  try{
    const r = await appelApi('GET');
    if(r.statut === 401) return 'code';
    if(!r.ok || !r.corps) return 'absent';
    appliquerDistant(r.corps);
    return 'ok';
  }catch(e){ return 'absent'; }
}

async function charger(){
  try{
    const p = await window.storage.get('cpts_identite', false);
    if(p && p.value) dernierNom = p.value;
  }catch(e){}
  try{
    const c = localStorage.getItem('cpts64_code');
    if(c) codeAcces = c;
  }catch(e){}

  const etatLocal = await lireLocal();
  /* Le carnet gardé sur l'appareil est relu même quand le serveur
     répond : c'est lui qui rattrape les numéros que le serveur n'a
     jamais reçus, ou qu'il a perdus. Il ne sert qu'à compléter — la
     fusion champ par champ décide du reste. */
  if(etatLocal && etatLocal.personnes) carnetSecours = enDico(etatLocal.personnes);

  let issue = await joindreServeur();

  if(issue === 'code'){
    majBandeau(); rendre();
    return demanderCode();
  }
  if(issue === 'ok'){
    modeServeur = true;
    stockageActif = true;
    /* Serveur vierge : on l'amorce avec l'état de référence,
       appels aux CPTS compris. */
    if(versionServeur === 0){ empreinte = {}; await sauver(); }
    lancerSondage();
  }else{
    if(etatLocal){
      if(Array.isArray(etatLocal.diffusions)) diffusionsHeritees = etatLocal.diffusions;
      for(const k in etatInitial){ if(etatLocal[k] !== undefined) etat[k] = etatLocal[k]; }
    }
    fusionnerNouveautes();
    normaliserPersonnes();
    marquerSynchronise();
    stockageActif = true;
  }
  majBandeau(); rendre();
  demanderIdentite(true);
}

async function lireLocal(){
  try{
    const r = await window.storage.get(CLE, true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return null;
}

function demanderCode(){
  verrouModale = true;
  document.getElementById('modale').innerHTML = `<h3>Code d'accès</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Ce cockpit contient des coordonnées de professionnels de santé et le détail des échanges de crise. Le code vous a été communiqué par la coordination.</p>
    <label><span class="k">Code</span><input id="in-code" type="password" placeholder="Code d'accès" onkeydown="if(event.key==='Enter')validerCode()"></label>
    <div class="actions"><button class="btn" onclick="validerCode()">Entrer</button></div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('in-code'); if(i) i.focus({preventScroll:true}); }, 60);
}
async function validerCode(){
  const v = document.getElementById('in-code').value.trim();
  if(!v){ toast("Saisissez le code d'accès"); return; }
  codeAcces = v;
  const issue = await joindreServeur();
  if(issue === 'code'){ toast("Code d'accès incorrect"); return; }
  try{ localStorage.setItem('cpts64_code', v); }catch(e){}
  verrouModale = false;
  if(issue === 'ok'){
    modeServeur = true;
    if(versionServeur === 0){ empreinte = {}; await sauver(); }
    lancerSondage();
  }
  stockageActif = true;
  fermer(); majBandeau(); rendre();
  demanderIdentite(true);
}

/* Relève régulière des modifications des autres postes. On
   s'abstient pendant une saisie ou tant qu'il reste quelque
   chose à envoyer, pour ne rien écraser sous les doigts. */
function lancerSondage(){
  if(sondage) clearInterval(sondage);
  sondage = setInterval(async () => {
    if(!modeServeur) return;
    if(document.getElementById('rideau').classList.contains('on')) return;
    if(rubriquesModifiees().length) return;
    try{
      const r = await appelApi('GET');
      if(!r.ok || !r.corps) return;
      if((r.corps.version || 0) === versionServeur) return;
      appliquerDistant(r.corps);
      majBandeau(); rendre();
      toast("Cockpit actualisé — saisie de " + (r.corps.par || 'un membre du copil'));
    }catch(e){}
  }, 15000);
}

/* Les rubriques amorcées depuis l'état de référence. Une fiche
   n'y est ajoutée que si son identifiant est inconnu du cockpit
   et qu'elle n'a pas été retirée à la main : ce qui a été saisi
   par le copil n'est jamais touché. C'est par là qu'arrivent les
   éléments consignés hors ligne, au téléphone notamment. */
const SEEDS = ['missions','veille','ars','sources','rubriques','salleVisio','visios','lignes','offre','cpts','courante','contacts','referents','pharmacies','procedures'];
function fusionnerNouveautes(){
  etat.retires = etat.retires || [];
  SEEDS.forEach(k => {
    if(!Array.isArray(etat[k]) || !Array.isArray(etatInitial[k])) return;
    const vus = new Set(etat[k].map(x => x.id));
    etatInitial[k].forEach(o => {
      if(!vus.has(o.id) && !etat.retires.includes(o.id)) etat[k].push(JSON.parse(JSON.stringify(o)));
    });
  });
  reprendreEbauche();
  poserConsignesProcedure();
  apparierVisioARS();
  consignerRegistresHerites();
  completerVeille();
}

/* Les consignes tirées des deux procédures de réhydratation à
   domicile, posées une fois sur un cockpit déjà en service. Les
   consignes n'ont pas d'identifiant — la comparaison se fait donc
   sur le texte, et le marqueur « consProc » garantit qu'un poste ne
   les repose pas après qu'on les a retirées à la main. */
function poserConsignesProcedure(){
  if(etat.consProc) return;
  const c = etat.consignes || (etat.consignes = {faire:[], eviter:[]});
  ['faire','eviter'].forEach(k => {
    c[k] = Array.isArray(c[k]) ? c[k] : [];
    CONSIGNES_PROC[k].forEach(x => { if(!c[k].includes(x)) c[k].push(x); });
  });
  etat.consProc = true;
}

/* La première version de ce cockpit n'avait que deux rubriques :
   une situation et une main courante. Elle rangeait le bandeau
   sous « situation » là où la charpente reprise des incendies le
   range sous « entete ». Ce qui a été écrit dans l'ébauche est
   donc repris ici, une fois, et seulement si personne n'a encore
   touché au bandeau — sans quoi on écraserait une saisie récente
   par une plus ancienne. Les entrées de main courante, elles, ont
   la même forme des deux côtés : elles n'ont rien à reprendre.

   Cette fonction n'a plus d'objet une fois l'ébauche oubliée de
   tous les postes ; elle ne coûte rien à laisser. */
function reprendreEbauche(){
  const a = etat.situation;
  if(!a || typeof a !== 'object') return;
  const b = etat.entete || (etat.entete = {});
  const vierge = (!b.niveau || b.niveau === etatInitial.entete.niveau)
              && (!b.phrase || b.phrase === etatInitial.entete.phrase);
  if(!vierge) return;
  if(a.niveau) b.niveau = a.niveau;
  if(a.phrase) b.phrase = a.phrase;
}

/* Les fiches enregistrées avant l'arrivée du poste de veille n'ont
   ni rythme, ni impact, ni suite. On ne remplit que les champs
   absents — jamais ceux qui portent déjà une saisie du copil. */
function completerVeille(){
  const combler = (o, defauts) => {
    for(const c in defauts) if(o[c] === undefined || o[c] === null) o[c] = defauts[c];
  };
  const refSrc = new Map((etatInitial.sources||[]).map(o => [o.id, o]));
  (etat.sources||[]).forEach(o => {
    const r = refSrc.get(o.id);
    combler(o, {rythme: r ? r.rythme : 'Chaque tour', quoi: r ? r.quoi : ''});
    /* Le carnet était rangé par catégorie libre ; il l'est désormais
       par famille de canal. Les sources déjà enregistrées récupèrent
       leur famille et leur point de situation à la volée. */
    if(!o.famille) o.famille = r ? r.famille : familleDeCat(o.cat);
    if(o.point === undefined) o.point = r ? r.point : '';
  });
  const refV = new Map((etatInitial.veille||[]).map(o => [o.id, o]));
  (etat.veille||[]).forEach(o => {
    const r = refV.get(o.id);
    combler(o, {
      impact:    r ? r.impact    : 'contexte',
      suite:     r ? r.suite     : 'rien',
      suiteEtat: r ? r.suiteEtat : 'traite',
      suiteNote: r ? r.suiteNote : ''
    });
    if(o.rubrique === undefined) o.rubrique = r ? (r.rubrique || '') : '';
  });
  etat.rubriques = etat.rubriques || [];
  const refR = new Map((etatInitial.rubriques||[]).map(o => [o.id, o]));
  etat.rubriques.forEach(o => {
    const r = refR.get(o.id);
    combler(o, {quoi: r ? r.quoi : '', ou: r ? r.ou : '', etat:'', maj:'', par:''});
  });
  /* La salle de visio a été ouverte avant que le rythme des
     séances puisse se déclarer : elle n'a ni horaire ni cadence.
     On les pose une fois — jeudi 12 h, ce que l'ARS tient sur la
     canicule — sans toucher à ce qui aurait déjà été déposé par
     le copil. */
  const sv = (etat.salleVisio || [])[0];
  if(sv){
    if(!sv.horaire) sv.horaire = '12:00';
    if(sv.recurrence === undefined || sv.recurrence === null || sv.recurrence === '') sv.recurrence = '4';
  }
}
/* Rattrapage des anciennes catégories saisies à la main. */
function familleDeCat(c){
  c = (c || '').toLowerCase();
  if(c.indexOf('ars') === 0 || c.indexOf('institutionnel') === 0) return "ARS et autorités sanitaires";
  if(c.indexOf('préfecture') === 0 || c.indexOf('prefecture') === 0) return 'Préfecture et collectivités';
  if(c.indexOf('collectivité') === 0 || c.indexOf('collectivite') === 0) return 'Préfecture et collectivités';
  if(c.indexOf('urps') === 0 || c.indexOf('ordre') === 0) return 'URPS et ordres';
  if(c.indexOf('météo') === 0 || c.indexOf('meteo') === 0 || c.indexOf('environnement') === 0) return 'Météo et qualité de l\'air';
  if(c.indexOf('établissement') === 0 || c.indexOf('etablissement') === 0) return 'Établissements et médico-social';
  if(c.indexOf('presse') === 0 || c.indexOf('média') === 0) return 'Presse';
  return 'Autres canaux';
}

async function sauver(){
  etat.entete.maj = new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  majBandeau();

  /* Copie locale systématique : même en mode partagé, elle sert
     de filet si l'hébergement devient injoignable. */
  try{ await window.storage.set(CLE, JSON.stringify(etat), true); }catch(e){}

  if(modeServeur) return sauverServeur();
  if(!stockageActif) toast("Modification enregistrée dans cette session seulement");
  return 'local';
}

async function sauverServeur(reste){
  if(reste === undefined) reste = 4;
  const modifiees = rubriquesModifiees();
  if(!modifiees.length) return;

  const corps = { version: versionServeur, par: moi, donnees: {} };
  modifiees.forEach(k => corps.donnees[k] = etat[k]);

  let r;
  try{
    r = await appelApi('POST', corps);
  }catch(e){
    toast("Serveur injoignable — saisie conservée sur cet appareil");
    return 'local';
  }

  if(r.ok && r.corps){
    versionServeur = r.corps.version;
    marquerSynchronise();
    return 'ok';
  }

  /* Quelqu'un a enregistré entre-temps. On repart de sa version et
     on y réapplique nos seules modifications, fiche par fiche. */
  if(r.statut === 409 && r.corps && reste > 0){
    versionServeur = r.corps.version || 0;
    const src = r.corps.donnees || {};
    RUBRIQUES.forEach(k => {
      if(src[k] === undefined) return;
      etat[k] = modifiees.indexOf(k) === -1 ? src[k] : fusionner(instantane[k], etat[k], src[k]);
      instantane[k] = copie(src[k]);
    });
    RUBRIQUES.forEach(k => { empreinte[k] = modifiees.indexOf(k) === -1 ? empreinteDe(k) : null; });
    majBandeau(); rendre();
    return sauverServeur(reste - 1);
  }

  if(r.statut === 401){
    modeServeur = false;
    toast("Session expirée — code d'accès à ressaisir");
    demanderCode();
    return 'local';
  }
  toast("Enregistrement sur le serveur impossible — copie locale conservée");
  return 'local';
}

function editerEntete(){
  document.getElementById('modale').innerHTML = `<h3>État affiché en haut du cockpit</h3>
    <label style="margin-bottom:12px"><span class="k">Pastille — court</span><input id="en-niveau" value="${esc(etat.entete.niveau)}"></label>
    <label style="margin-bottom:12px"><span class="k">Phrase de situation</span><textarea id="en-phrase">${esc(etat.entete.phrase)}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerEntete()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}
async function validerEntete(){
  etat.entete.niveau = document.getElementById('en-niveau').value.trim() || etat.entete.niveau;
  etat.entete.phrase = document.getElementById('en-phrase').value.trim();
  await sauver(); fermer(); majBandeau(); toast("État mis à jour");
}

function majBandeau(){
  document.getElementById('niveau').textContent = etat.entete.niveau;
  document.getElementById('phrase').textContent = etat.entete.phrase;
  document.getElementById('maj').textContent = etat.entete.maj ? 'Dernière saisie ' + etat.entete.maj : '';
  const etatSync = modeServeur
    ? 'Cockpit partagé — le copil voit vos saisies'
    : 'Enregistré sur cet appareil seulement';

    'Connecté·e comme ' + esc(moi) + '<br><span style="opacity:.7">' + etatSync + '</span>';
}

/* =========================================================
   OUTILS
   ========================================================= */
/* L'onglet où une mission se travaille. Sans mention explicite sur
   la mission, c'est la main courante — et tant que les rubriques
   d'action de la canicule ne sont pas ouvertes, c'est le cas de
   toutes. */
const ESPACES = {};
const espaceDe = m => m.espace || ESPACES[m.id] || 'courante';
const nomEspace = id => (ONGLETS.find(o => o.id === id) || {}).nom || 'Main courante';
const cleP = n => (n||'').trim().toLowerCase();

function noterRetrait(id){
  etat.retires = etat.retires || [];
  if(!etat.retires.includes(id)) etat.retires.push(id);
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aujourdhui = () => new Date().toISOString().slice(0,10);
const maintenant = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function frdate(d){ if(!d) return '—'; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1] : d; }
/* Les listes se lisent en « 27/07 » ; une mention qui fait foi
   sur un bordereau porte l'année. */
function frdateL(d){ if(!d) return '—'; const p = String(d).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d; }

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove('on'), 2600);
}
let verrouModale = false;
/* Le recensement en ligne des généralistes s'ouvre en fenêtre :
   quand elle est ouverte, ses propres boutons la redessinent au
   lieu de redessiner la page qui est dessous. */
let modaleRecens = false;
/* Une question posée en fenêtre attend une réponse : si la fenêtre
   se referme autrement — Échap, clic à côté — c'est un renoncement,
   et celui qui attendait doit l'apprendre plutôt que rester en
   suspens. Voir demanderOuverture(). */
let repondreOuv = null;
/* Une fenêtre qui s'ouvre commence par son titre. Le rideau et la
   modale sont uniques : on n'en crée pas une par formulaire, on
   remplace ce qu'il y a dedans. Quand une fenêtre s'ouvre depuis
   une autre — modifier depuis une fiche, confirmer depuis une
   saisie — la modale est déjà déroulée là où on lisait, et le
   nouveau formulaire s'ouvrirait au milieu de lui-même. On la
   remet en haut à chaque ouverture. */
function ouvrirRideau(){
  document.getElementById('rideau').classList.add('on');
  const m = document.getElementById('modale');
  if(m) m.scrollTop = 0;
}

function fermer(){
  if(verrouModale) return;
  if(repondreOuv){ const r = repondreOuv; repondreOuv = null; r(null); }
  modaleRecens = false;
  document.getElementById('rideau').classList.remove('on');
  document.getElementById('modale').classList.remove('large');
}
document.getElementById('rideau').addEventListener('click', e => { if(e.target.id === 'rideau') fermer(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fermer(); });

/* Le carnet de coordonnées est un dictionnaire, pas une liste :
   les fiches y sont rangées par nom. Or un objet vide part en JSON
   `{}` et revient du serveur en `[]` — PHP ne distingue pas les
   deux. Et une fois devenu tableau, il avale les numéros sans
   jamais les rendre : JSON.stringify ignore les clés nommées d'un
   tableau, si bien que la saisie disparaît au rafraîchissement
   suivant. On le remet donc en dictionnaire à chaque fois qu'il
   entre dans le cockpit. */
function enDico(p){
  if(p && typeof p === 'object' && !Array.isArray(p)) return p;
  const v = {};
  if(Array.isArray(p)) p.forEach(x => { if(x && x.nom) v[cleP(x.nom)] = x; });
  return v;
}
function normaliserPersonnes(){
  etat.personnes = enDico(etat.personnes);
}

function coord(nom){
  normaliserPersonnes();
  return etat.personnes[cleP(nom)] || {};
}
/* Un seul carnet pour tout le monde. La case « cellule de crise »
   remplace le bloc des référents, qui tenait sa propre liste de
   noms et de numéros en tête de l'onglet : la même personne y
   figurait deux fois, avec deux téléphones à saisir. */
function editerContact(nom){
  const neuf = !nom;
  const c = neuf ? {} : coord(nom);
  const r = neuf ? null : referentDe(nom);
  const nEsc = esc(nom || '').replace(/'/g, "\\'");
  document.getElementById('modale').innerHTML = `<h3>${neuf ? "Ajouter quelqu'un" : 'Fiche de ' + esc(nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Renseignée une fois, utilisable par tout le monde en un clic depuis l'organigramme.</p>
    ${neuf ? `<label style="margin-bottom:12px"><span class="k">Prénom et nom *</span>
      <input id="ct-nom" placeholder="Prénom et nom"></label>` : ''}
    <label style="margin-bottom:12px"><span class="k">Profession</span>
      <input id="ct-prof" value="${esc(c.profession || (r && r.profession) || '')}" placeholder="Ex. infirmière libérale"></label>
    <label style="margin-bottom:12px"><span class="k">Statut dans l'association — s'il y en a un</span>
      <input id="ct-statut" list="statuts-asso" value="${esc(c.statut || '')}" placeholder="Ex. vice-présidente"></label>
    <datalist id="statuts-asso">${
      ['Présidente','Président','Vice-présidente','Vice-président','Trésorière','Trésorier',
       'Secrétaire','Membre du bureau','Référente de groupe de travail','Référent de groupe de travail',
       'Coordinatrice','Coordinateur','Adhérente','Adhérent']
      .map(s => `<option value="${esc(s)}">`).join('')}</datalist>
    <label style="margin-bottom:12px"><span class="k">Téléphone</span>
      <input id="ct-tel" type="tel" value="${esc(c.tel || (r && r.tel) || '')}" placeholder="06 12 34 56 78"></label>
    <label style="margin-bottom:12px"><span class="k">Mail</span>
      <input id="ct-mail" type="email" value="${esc(c.mail || '')}" placeholder="prenom.nom@exemple.fr"></label>
    <label class="coche"><input type="checkbox" id="ct-cellule" ${r ? 'checked' : ''}>
      <span>Fait partie de la cellule de crise<span class="d">Apparaît en tête de l'organigramme, avec sa profession.</span></span></label>
    <div class="actions"><button class="btn" onclick="validerContact('${nEsc}')">Enregistrer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById(neuf ? 'ct-nom' : 'ct-prof'); if(i) i.focus({preventScroll:true}); }, 60);

async function validerContact(nom){
  normaliserPersonnes();
  const champ = document.getElementById('ct-nom');
  const n = champ ? champ.value.trim() : nom;
  if(!n){ toast("Le nom est obligatoire"); return; }
  const prof = document.getElementById('ct-prof').value.trim();
  const tel  = document.getElementById('ct-tel').value.trim();
  /* La fiche se complète, elle ne se remplace pas : un champ laissé
     vide ici ne doit pas effacer ce qui est déjà connu, sauf à
     vider volontairement un champ qui était rempli — auquel cas la
     date de saisie dit que c'est bien la version la plus récente. */
  const avant = etat.personnes[cleP(n)] || {};
  etat.personnes[cleP(n)] = Object.assign({}, avant, {
    nom: n, tel: tel,
    mail: document.getElementById('ct-mail').value.trim(),
    profession: prof,
    statut: document.getElementById('ct-statut').value.trim(),
    maj: new Date().toISOString(), par: moi
  });
  /* L'appartenance à la cellule de crise se coche ici : c'est la
     seule chose que le registre des référents retient encore. */
  etat.referents = etat.referents || [];
  const dedans = document.getElementById('ct-cellule').checked;
  const r = etat.referents.find(x => cleP(x.nom) === cleP(n));
  if(dedans && r) Object.assign(r, {nom:n, profession:prof, tel:tel, modifiePar:moi});
  else if(dedans) etat.referents.push({id:uid(), nom:n, profession:prof, tel:tel,
                                       auteur:moi, quand:new Date().toISOString()});
  else if(r){ noterRetrait(r.id); etat.referents = etat.referents.filter(x => x !== r); }
  /* Ce carnet a déjà été perdu une fois : on force son envoi au lieu
     de s'en remettre à la détection de changement, et on dit ce qui
     s'est réellement passé plutôt qu'un « enregistré » de principe. */
  empreinte.personnes = null;
  const issue = await sauver();
  fermer(); rendre();
  toast(issue === 'ok' ? "Fiche enregistrée et partagée avec le copil"
                       : "Fiche conservée sur cet appareil — le serveur n'a pas répondu");
}

/* Toute personne dont le nom figure déjà dans le cockpit : l'équipe de
   gestion de crise, les pilotes, suppléants et renforts des missions,
   mais aussi les auteurs d'un appel ou d'une saisie. C'est la liste
   proposée en un clic à l'ouverture, et celle qu'on retrouve partout
   où il faut désigner quelqu'un — main courante comprise. */
function nomsMissionnes(){
  const v = new Map();
  /* Un même champ peut nommer deux personnes — « Anne Latisnère et Eva
     Poulmarch » quand une action a été portée à deux. Ce sont deux
     personnes distinctes : chacune entre dans la liste pour elle-même, et
     aucune paire ne s'y présente comme une identité à part entière. */
  const ajouter = n => (n||'').split(/\s*(?:,|;|&|\+|\bet\b)\s*/i).forEach(p => {
    const t = p.trim();
    if(t && t !== 'Anonyme') v.set(cleP(t), t);
  });
  (etat.referents||[]).forEach(r => ajouter(r.nom));
  normaliserPersonnes();
  Object.values(etat.personnes||{}).forEach(p => ajouter(p.nom));
  etat.missions.forEach(m => {
    ajouter(m.pilote); ajouter(m.suppleant);
    (Array.isArray(m.renforts) ? m.renforts : []).forEach(r => ajouter(r.nom));
  });
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a => ajouter(a.par)));
  /* Un nom saisi à la main en main courante n'est plus à ressaisir la
     fois suivante : il entre dans la liste au même titre que les autres. */
  (etat.courante||[]).forEach(o => ajouter(o.qui));
  ['veille','ars'].forEach(k =>
    (etat[k]||[]).forEach(o => { ajouter(o.auteur); ajouter(o.modifiePar); }));
  return [...v.values()].sort((a,b)=>a.localeCompare(b,'fr'));
}

/* Passage obligé à chaque ouverture : rien n'est saisi sous « Anonyme ».
   En mode porte (ouverture du lien), la fenêtre ne peut pas être fermée
   sans avoir donné un nom. */
function demanderIdentite(porte){
  const m = document.getElementById('modale');

    <p style="color:var(--texte-2);margin:0 0 14px">Votre nom est associé à chacune de vos saisies. Il est demandé à chaque ouverture du cockpit, pour que tout ce qui est consigné reste traçable.</p>`;
  if(noms.length){
    h += `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà missionné·e ou déjà intervenu·e — un clic suffit&nbsp;:</p>
      <div class="choixnom">` + noms.map(n =>
      `<button onclick="choisirNom('${esc(n).replace(/'/g,"\\'")}')"${cleP(n)===cleP(dernierNom)?' style="border-color:var(--marque);font-weight:600"':''}>${esc(n)}</button>`).join('') + `</div>
      <p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Vous n'êtes pas dans cette liste&nbsp;?</p>`;
  }
  h += `<label><span class="k">Prénom et nom</span><input id="in-moi" value="${esc(moi === 'Anonyme' ? dernierNom : moi)}" placeholder="Prénom et nom" onkeydown="if(event.key==='Enter')validerIdentite()"></label>
    <div class="actions"><button class="btn" onclick="validerIdentite()">Entrer dans le cockpit</button>${porte?'':'<button class="btn sec" onclick="fermer()">Annuler</button>'}</div>`;
  m.innerHTML = h;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('in-moi'); if(i && !noms.length) i.focus({preventScroll:true}); }, 60);
}

function csvVal(v){ return '"' + String(v ?? '').replace(/"/g,'""') + '"'; }
function telechargerCSV(nom, rows){
  const txt = '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');
  const b = new Blob([txt], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = nom.toLowerCase().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'') + '-' + aujourdhui() + '.csv';
  a.click();
  toast("Fichier téléchargé");
}
function exporterCSV(k){
  const cfg = CHAMPS[k];
  const ch   = champsSaisie(cfg.f);
  const cols = ['date', ...ch.map(f => f.c), 'auteur', 'modifiePar'];
  const ent  = ['Date', ...ch.map(f => f.l), 'Saisi par', 'Modifié par'];
  const src  = chrono(k, etat[k]);
  const lig  = src.map(o => cols.map(c => csvVal(o[c])));
  /* La main courante porte de même une colonne qui n'est pas un
     champ de saisie : la nature de l'entrée, c'est-à-dire la page du
     cockpit d'où elle vient. C'est par elle qu'on trie un registre
     qui reçoit tout. */
  if(k === 'courante'){
    ent.splice(0, 0, "Nature");
    src.forEach((o, i) => lig[i].splice(0, 0, csvVal(typeMC(o))));
  }
  telechargerCSV(cfg.titre, [ent.map(csvVal), ...lig]);
}
/* Tout ce que la CPTS a tracé, en un fichier : c'est la main
   courante, puisqu'elle reçoit désormais ce que chaque page
   enregistre. Elle remplace la recomposition à la volée qui lisait
   tous les registres sans rien garder — celle-là exportait un
   ordre que personne ne pouvait retrouver à l'écran. */
function exporterTout(){
  const rows = [['Nature','Date','Heure','Venu du dehors','Le fait','Suite donnée','Qui s\'en est chargé','Saisi par'].map(csvVal)];
  chrono('courante', etat.courante).forEach(o => rows.push(
    [typeMC(o), o.date || '', o.heure || '', o.source || '', o.evenement || '',
     o.suite || '', o.qui || '', o.auteur || ''].map(csvVal)));
  telechargerCSV('Traçabilité complète', rows);
}

function importer(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(Array.isArray(d.diffusions)) diffusionsHeritees = d.diffusions;
      for(const k in etatInitial){ if(d[k] !== undefined) etat[k] = d[k]; }
      fusionnerNouveautes();

}

/* --- Ce qui n'est pas encore ouvert à l'équipe --------------
   Un onglet peut être terminé sans être en ligne : on le travaille
   en maquette, et sa mise en service se décide à part. Sans
   l'interrupteur, l'équipe ne voit rien — ni l'onglet, ni les
   gestes qui l'alimentent ailleurs dans le cockpit. Ce qui aurait
   déjà été saisi reste enregistré et ressort intact le jour de
   l'ouverture : on ne cache que l'affichage.

   S'ouvre en ajoutant ?maquette=1 à l'adresse, se referme avec
   ?maquette=0. Le choix tient sur l'appareil et non sur le
   serveur : deux personnes n'ont donc pas à voir la même chose, et
   personne n'ouvre le chantier à toute l'équipe par mégarde. */
const EN_CONSTRUCTION = ['rapports'];
let maquette = (() => {
  try{
    const p = new URLSearchParams(location.search).get('maquette');
    if(p === '1' || p === 'oui'){ localStorage.setItem('cpts64_maquette', 'on'); return true; }
    if(p === '0' || p === 'non'){ localStorage.removeItem('cpts64_maquette'); return false; }
    return localStorage.getItem('cpts64_maquette') === 'on';
  }catch(e){ return false; }
})();
const enChantier = id => EN_CONSTRUCTION.indexOf(id) >= 0 && !maquette;

/* Le compteur au bout de l'onglet ne sert que là où le nombre
   dit vraiment quelque chose : ce qu'on a consigné, ce qu'on a
   échangé avec l'ARS. Ailleurs, un chiffre n'apprend rien. */

  {id:'missions',  nom:'Missions & organigramme', groupe:'Pilotage', cpt:null},

  {id:'rapports',  nom:'Rapports',           groupe:'Suivi', cpt:null},
  {id:'courante',  nom:'Main courante',      groupe:'Traçabilité', cpt:'courante'},
  {id:'ars',       nom:'Échanges avec l\'ARS', groupe:'Traçabilité', cpt:'ars'},
  /* Première action métier de la canicule, arrêtée avec la
     vice-présidence : la réhydratation à domicile. Les incendies
     logent dans ce groupe la collecte de matériel, l'appel au
     renfort et les patients évacués — aucune des trois ne se
     transpose telle quelle. Ce qui s'y ajoutera se décide de la
     même façon ; d'ici là, tout ce qui arrive se consigne en main
     courante. */
  {id:'rehydratation', nom:'Réhydratation à domicile', groupe:'Actions', cpt:'rehyd'},
  {id:'offre',     nom:'Offre de soins du territoire', groupe:'Ressources', cpt:null},

/* « Engagement en ligne » : le donateur a accepté les conditions
/* Qui, au dehors, nous a communiqué quelque chose. Ces pastilles
   ne sont que des suggestions — le champ reste libre, et une
   pharmacie se nomme mieux qu'elle ne se catégorise. Celles déjà
   employées passent devant : au troisième appel du même
   interlocuteur, il est à portée de doigt. */
const SOURCES_DEHORS = ["L'ARS", "SOS Médecins Pau", "CMSI de Billère",
  "Une pharmacie du territoire", "Un établissement de santé", "Un professionnel de santé",
  "Une CPTS", "Une collectivité", "La préfecture"];
function sourcesCourante(){
  const vues = [...new Set((etat.courante || []).map(o => String(o.source||'').trim()).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,'fr'));
  return [...vues, ...SOURCES_DEHORS.filter(s => vues.indexOf(s) === -1)];
}

/* --- Réhydratation à domicile : les listes fermées ------------
   Une pharmacie passe d'un état à l'autre dans cet ordre, et la
   carte reprend ces mêmes états en couleurs. */
const PH_STATUTS  = ['À contacter','Contactée','Partenaire','Ne participe pas'];
const PH_ET       = {'Partenaire':'e-cours','Contactée':'e-attente',
                     'À contacter':'e-lancer','Ne participe pas':'e-fini'};
const PH_PORTAGE  = ['À préciser','Oui','Non'];
/* Ce que les officines tiennent le plus souvent : des pastilles qui
   s'additionnent, sur un champ qui reste libre. */
const PH_STOCK    = ["Sachets de réhydratation orale","Solution prête à l'emploi",
                     "Eau en bouteille","Compléments d'électrolytes","Brumisateurs"];
const RH_STATUTS  = ['À orienter','Cabinet IDEL désigné','Passage assuré','Sans suite'];
const RH_ET       = {'À orienter':'e-attente','Cabinet IDEL désigné':'e-lancer',
                     'Passage assuré':'e-cours','Sans suite':'e-fini'};
const RH_MOTIFS   = ["Personne âgée isolée","Pathologie chronique",
                     "Traitement sensible à la chaleur","Perte d'autonomie",
                     "Logement mal ventilé","Signes de déshydratation débutante"];
/* Les cabinets infirmiers déjà nommés sur une fiche, et les
   médecins qui ont déjà déclaré : au deuxième signalement du même
   cabinet ou du même médecin, le nom est à portée de doigt. */
const dejaVus = (k, c) => [...new Set((etat[k] || [])
  .map(o => String(o[c] || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b,'fr'));

/* Le carnet des médecins qui ont orienté : un nom, l'adresse et le
   numéro qu'on avait notés pour le joindre, et combien de personnes
   il a signalées. Il ne se saisit nulle part — il se relit à chaque
   fois depuis les signalements eux-mêmes, ce qui évite d'avoir un
   fichier de médecins à tenir à jour en plus du registre.

   Les signalements sont parcourus du plus ancien au plus récent :
   pour un même médecin, c'est la dernière adresse et le dernier
   numéro renseignés qui restent, et un champ laissé vide n'efface
   pas ce qui avait été noté la fois d'avant. */
function carnetMedecins(){
  const quand = o => String(o.date || '') + ' ' + cleHeure(o.heure);
  const par = new Map();
  [...(etat.rehyd || [])].sort((a,b) => quand(a).localeCompare(quand(b))).forEach(o => {
    const nom = String(o.decNom || '').trim();
    if(!nom) return;
    const cle = nom.toLowerCase();
    /* L'orthographe retenue est celle du premier signalement : c'est
       elle que le champ propose ensuite, et « dr untel » tapé vite un
       soir ne vient pas remplacer le nom écrit proprement. */
    const m = par.get(cle) || {nom, adresse:'', tel:'', n:0, dernier:'', patients:[]};
    const a = String(o.decAdresse || '').trim(), t = String(o.decTel || '').trim();
    if(a) m.adresse = a;
    if(t) m.tel = t;
    m.n++;
    if(o.date) m.dernier = o.date;
    m.patients.push(o);
    par.set(cle, m);
  });
  return [...par.values()].sort((x,y) => x.nom.localeCompare(y.nom,'fr'));
}

/* Un nom repris dans le carnet ramène avec lui ce qu'on avait noté
   pour joindre ce médecin. Deux règles, et elles tiennent en une
   phrase : on ne réécrit jamais par-dessus ce qui a été tapé à la
   main, et ce que le carnet a rempli lui-même se corrige tout seul
   si on change de médecin en cours de saisie. */
function reprendreCarnet(k, c, el){
  const f = (CHAMPS[k].f || []).find(x => x.c === c);
  if(!f || !f.carnet) return;
  const saisi = String(el.value || '').trim().toLowerCase();
  const fiche = saisi ? f.carnet.liste().find(x => String(x.nom || '').trim().toLowerCase() === saisi) : null;
  Object.keys(f.carnet.remplit).forEach(champ => {
    const cible = document.getElementById(`f-${k}-${champ}`);
    if(!cible) return;
    /* Saisi à la main : intouchable, même si le carnet dit autre
       chose. C'est celui qui remplit la fiche qui a le dernier mot. */
    if(cible.value && cible.dataset.carnet !== '1') return;
    const v = fiche ? String(fiche[f.carnet.remplit[champ]] || '') : '';
    cible.value = v;
    if(v){
      cible.dataset.carnet = '1';
      /* Dès qu'on y touche, le champ cesse d'appartenir au carnet. */
      cible.oninput = () => { delete cible.dataset.carnet; };
    }else delete cible.dataset.carnet;
  });
}

function ouvrirAjout(k, mode){
  document.getElementById('modale').innerHTML = formulaire(k, null, mode);
  majDependances();
  ouvrirRideau();
}

/* --- Un champ qui dépend d'une réponse précédente -------------
   « Cabinet IDEL : oui / non » ne se contente pas d'être noté :
   répondre oui ouvre le nom du cabinet à renseigner, répondre non
   affiche ce qu'il reste à faire — rappeler le médecin. Un champ
   qu'une réponse rend sans objet se retire du formulaire et se
   vide : sans cela, un nom de cabinet saisi puis désavoué par un
   « non » repartirait quand même au registre. */
function majDependances(){
  document.querySelectorAll('.form [data-dep]').forEach(el => {
    const src = document.getElementById(el.dataset.dep);
    const attendu = String(el.dataset.depv || '').split('|');
    const montrer = !!src && attendu.indexOf(String(src.value ?? '').trim()) >= 0;
    el.hidden = !montrer;
    if(!montrer) el.querySelectorAll('input,select,textarea').forEach(c => { c.value = ''; });
  });
}

/* Les champs retenus selon le mode de saisie : en saisie manuelle on
   ne demande pas qui a mené l'appel, puisqu'il n'y a pas eu d'appel.
   Un champ marqué « hors » n'est plus proposé à la frappe : il garde
   sa place dans la configuration pour le tableau et l'export, et se
   renseigne ailleurs — par le formulaire en ligne, le plus souvent.
   Ne pas l'afficher, c'est aussi ne jamais l'écraser : l'enregistrement
   ne relit que les champs visibles. */
function champsVisibles(cfg, mode){
  return cfg.f.filter(f => !f.hors && (mode === 'manuel' ? !f.appel : !f.manuel));
}

/* Les intertitres du formulaire ne sont pas des champs : ils n'ont ni
   colonne, ni valeur à enregistrer. */
const champsSaisie = l => l.filter(f => f.c);

/* ---------- les entrées d'échappement des listes fermées -------
   « Autre », « Autre profession de santé », « À préciser » : ces
   entrées disent qu'aucune des réponses proposées ne convient.
   Les choisir sans pouvoir dire ce qu'il en est enregistre le
   constat qu'il y avait quelque chose à préciser, et rien de la
   précision — la ligne part telle quelle au tableau et à l'export.

   Leur place dans la liste dit laquelle est laquelle. En tête,
   c'est la valeur par défaut d'une fiche neuve : « on ne sait pas
   encore », et il n'y a rien à saisir — ouvrir un champ sous
   « Peut dormir sur place : à préciser » à chaque nouvelle fiche
   n'aiderait personne. Ailleurs, c'est bien l'échappatoire, et un
   champ libre s'ouvre dessous. Ce qu'on y écrit devient la valeur
   enregistrée : c'est elle qu'on relit au tableau, pas l'étiquette
   de la liste. */
const estEchappe = v => /^(Autre|À préciser)/.test(String(v ?? '').trim());
const echappesDe = liste => liste.filter((x, i) => i > 0 && estEchappe(x));

/* Le champ libre lui-même, replié tant qu'on n'a pas choisi
   l'entrée qui l'appelle. Une précision déjà enregistrée y revient
   telle quelle, pour rester modifiable au lieu d'être à retaper. */
const champPrecision = (id, echs, ouvert, v) => !echs.length ? '' :
  `<input class="precision" id="${id}-p" data-ech="${esc(JSON.stringify(echs))}"` +
  `${ouvert ? '' : ' hidden'} value="${esc(ouvert ? v : '')}" placeholder="Précisez">`;

/* Ce qui vient d'être choisi ouvre ou referme le champ. Refermé,
   il se vide : une précision restée là après qu'on a changé d'avis
   s'enregistrerait à la place de la réponse choisie. */
function bascPrecision(id){
  const s = document.getElementById(id), p = document.getElementById(id + '-p');
  if(!s || !p) return;
  let echs = []; try{ echs = JSON.parse(p.dataset.ech || '[]'); }catch(e){}
  const ouvrir = echs.indexOf(s.value) !== -1;
  p.hidden = !ouvrir;
  if(!ouvrir) p.value = ''; else p.focus();
}

/* La valeur retenue : la précision si elle a été saisie, sinon
   l'entrée choisie dans la liste. */
function valPrecisee(id){
  const s = document.getElementById(id);
  if(!s) return '';
  const p = document.getElementById(id + '-p');
  return (p && !p.hidden ? p.value.trim() : '') || String(s.value ?? '').trim();
}

/* Répartit une valeur déjà enregistrée entre la liste et son champ
   libre. Absente de la liste, elle est soit une précision saisie
   ici — elle retourne dans le champ libre, son entrée à nouveau
   choisie — soit une réponse venue d'ailleurs, du formulaire en
   ligne le plus souvent, qui s'ajoute en tête plutôt que de
   disparaître à la première modification. */
function repartir(val, valeurs, echs){
  const hors = !!val && valeurs.indexOf(val) === -1;
  const libre = hors && echs.length > 0;
  return {libre, ajout: hors && !libre, sel: libre ? echs[echs.length - 1] : val};
}


/* Les pastilles de suggestion écrivent dans le champ libre qui
   les surmonte, sans repasser par un rendu complet : ce qui est
   déjà tapé plus bas dans le formulaire ne doit pas s'effacer
   parce qu'on a touché un motif. Retoucher la même pastille la
   désélectionne — c'est le geste attendu quand on s'est trompé. */
function choisirSugg(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const val = btn.dataset.v || '';
  const meme = el.value.trim() === val;
  el.value = meme ? '' : val;
  Array.prototype.forEach.call(btn.parentNode.children,
    b => b.classList.toggle('on', b === btn && !meme));
  /* Une pastille « Autre » appelle sa précision comme le ferait
     une liste déroulante. Sur un champ libre à suggestions, il n'y
     a pas de champ de précision et l'appel ne fait rien. */
  bascPrecision(cible);
  /* Et la réponse qui vient d'être donnée peut en ouvrir ou en
     fermer d'autres, plus bas dans le formulaire. */
  majDependances();
}
/* `val` allume d'emblée la pastille qui correspond à ce qui est déjà
   dans le champ : en modification, on voit ce qui avait été choisi. */
/* Les mêmes pastilles, mais cumulatives : chacune s'ajoute au champ
   ou s'en retire, séparées par des virgules. Le champ reste un champ
   libre — ce qui a été tapé à la main et ne figure dans aucune
   pastille y reste, et repart tel quel au tableau comme à l'export. */
const listeVirgules = v => String(v || '').split(',').map(x => x.trim()).filter(Boolean);
function basculerSugg(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const v = btn.dataset.v || '';
  const l = listeVirgules(el.value), i = l.indexOf(v);
  if(i >= 0) l.splice(i, 1); else l.push(v);
  el.value = l.join(', ');
  btn.classList.toggle('on', i < 0);
}
const pastillesMulti = (cible, liste, val) => {
  const l = listeVirgules(val);
  return `<div class="sugg">${liste.filter(Boolean).map(x =>
    `<button type="button" data-v="${esc(x)}"${l.indexOf(x) >= 0 ? ' class="on"' : ''} onclick="basculerSugg('${cible}',this)">${esc(x)}</button>`
  ).join('')}</div>`;
};

const pastilles = (cible, liste, cls, val) => `<div class="sugg ${cls||''}">${liste.filter(Boolean)
  .map(x => {
    const c = [cls === 'urg' && x === 'Non urgent' ? 'calme' : '', x === val ? 'on' : ''].filter(Boolean).join(' ');
    return `<button type="button" data-v="${esc(x)}"${c ? ` class="${c}"` : ''} onclick="choisirSugg('${cible}',this)">${esc(x)}</button>`;
  }).join('')}</div>`;

/* --- « Et pour nous, ça veut dire quoi ? » --------------------
   C'est la question à laquelle personne ne répond spontanément en
   recopiant un communiqué : on note ce que l'ARS a dit, et le champ
   qui demande ce que ça change pour la CPTS reste vide. Les amorces
   ci-dessous ne remplissent rien à la place de qui écrit — elles
   posent le début de la phrase, et la phrase se finit à la main.
   Elles s'ajoutent les unes aux autres au lieu de se remplacer :
   une mise à jour appelle souvent deux suites, un relais aux
   adhérents et une question à poser. */
const IMPLIQUE_CPTS = [
  "Rien à faire de notre côté pour l'instant.",
  "À relayer aux adhérents :",
  "À porter au prochain copil :",
  "Une mission à lancer ou à rouvrir :",
  "Une question à poser à l'ARS :",
  "Des renforts à mobiliser :",
  "Une consigne à afficher en cabinet :",
  "Ce qui change pour les patients :"
];

function amorcer(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const t = btn.dataset.v || '';
  const cur = el.value.replace(/\s+$/,'');
  /* Retoucher la même amorce quand elle est seule dans le champ la
     retire : c'est le geste attendu quand on s'est trompé de bouton
     et qu'on n'a encore rien écrit derrière. */
  if(cur === t){ el.value = ''; btn.classList.remove('on'); el.focus(); return; }
  el.value = cur ? cur + '\n' + t + ' ' : t + ' ';
  btn.classList.add('on');
  el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
  el.scrollTop = el.scrollHeight;
}
const amorces = (cible, liste) => `<div class="sugg amorces">${liste.map(x =>
  `<button type="button" data-v="${esc(x)}" onclick="amorcer('${cible}',this)">${esc(x)}</button>`).join('')}</div>`;

/* Les attributs qui rattachent un bloc du formulaire à la réponse
   qui le commande. Posé masqué : c'est majDependances(), appelée
   dès l'ouverture, qui décide de le montrer. */
const dep = (k, f) => f.dep
  ? ` data-dep="f-${k}-${f.dep}" data-depv="${esc(f.depV)}" hidden`
  : '';

function formulaire(k, o, mode){
  const cfg = CHAMPS[k];
  const ed = !!o;
  if(!mode && ed && o.source === 'saisie') mode = 'manuel';
  const man = mode === 'manuel';
  let h = `<h3>${esc(cfg.titre)} — ${ed ? 'modifier' : (man ? 'saisie manuelle' : 'nouvelle entrée')}</h3>`;
  if(man) h += `<p class="chapo" style="margin:-6px 0 14px">Pour reporter au registre une réponse obtenue autrement que par un appel de la CPTS — une réponse au formulaire en ligne, un message reçu. La ligne compte comme les autres ; elle porte la mention « saisie à la main » au lieu du nom de l'appelant.</p>`;
  h += `<div class="form">`;
  h += `<label><span class="k">Date</span><input type="date" id="f-${k}-date" value="${esc(ed ? (o.date||'') : aujourdhui())}"></label>`;
  champsVisibles(cfg, mode).forEach(f => {
    /* Un intertitre : il ne saisit rien, il découpe le formulaire en
       temps successifs — le même repère qu'au recueil d'un patient. */
    if(f.t === 'titre'){
      h += `<div class="sous-t"${dep(k, f)}>${esc(f.l)}${f.sous ? `<span class="d">${esc(f.sous)}</span>` : ''}</div>`;
      return;
    }
    /* Ni un champ ni un intertitre : ce qu'il reste à faire, écrit là
       où la réponse l'appelle. Rien à saisir, rien à enregistrer. */
    if(f.t === 'note'){
      h += `<div class="note-dep"${dep(k, f)}>${f.h}</div>`;
      return;
    }
    const val = ed ? (o[f.c] ?? '') : (typeof f.d === 'function' ? f.d() : '');
    const id = `f-${k}-${f.c}`;
    const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
    h += `<label class="${f.large?'large':''}"${dep(k, f)}><span class="k">${esc(man && f.lm ? f.lm : f.l)}${f.req?' *':''}</span>`;
    if(f.t === 'textarea') h += `<textarea id="${id}"${ph}>${esc(val)}</textarea>`;
    else if(f.t === 'select'){
      /* Certaines listes se construisent à la volée : les lieux de
         stockage déjà saisis, par exemple. */
      const opts = typeof f.o === 'function' ? f.o() : f.o;
      const echs = echappesDe(opts);
      const r = repartir(val, opts, echs);
      const liste = r.ajout ? [val, ...opts] : opts;
      h += `<select id="${id}"${echs.length ? ` onchange="bascPrecision('${id}')"` : ''}>${
        liste.map(x=>`<option ${x===r.sel?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
      h += champPrecision(id, echs, r.libre, val);
    }
    /* Un choix court se pose en pastilles plutôt qu'en liste
       déroulante : les réponses possibles se lisent sans ouvrir, et
       se donnent d'un doigt — les mêmes pastilles qu'au recueil d'un
       patient. Une option peut porter un libellé distinct de ce qui
       est enregistré : « Oui » à l'écran, « Volontaire » au registre,
       pour que le vocabulaire du cockpit et celui du formulaire en
       ligne restent le même. Une valeur déjà posée qui ne figure pas
       dans la liste — une réponse du formulaire en ligne, rédigée à
       sa façon — s'ajoute en tête plutôt que de disparaître à la
       première modification. */
    else if(f.t === 'choix'){
      const brut = typeof f.o === 'function' ? f.o() : f.o;
      const opts = brut.map(x => typeof x === 'string' ? {v:x, l:x} : x);
      const echs = echappesDe(opts.map(x => x.v));
      const r = repartir(val, opts.map(x => x.v), echs);
      const liste = r.ajout ? [{v:val, l:val}, ...opts] : opts;
      h += `<input type="hidden" id="${id}" value="${esc(r.sel)}">`
        +  `<div class="sugg">${liste.map(x =>
             `<button type="button" class="${x.v===r.sel?'on':''}" data-v="${esc(x.v)}" onclick="choisirSugg('${id}',this)">${esc(x.l)}</button>`
           ).join('')}</div>`;
      h += champPrecision(id, echs, r.libre, val);
    }
    /* Désigner quelqu'un ne doit obliger ni à choisir dans une liste
       fermée, ni à tout retaper : le champ propose les personnes déjà
       recensées — équipe de crise, pilotes, suppléants, renforts — et
       accepte un nom qui n'y figure pas encore, qui rejoint alors la
       liste pour les saisies suivantes. */
    /* Un nom déjà passé par le registre : il se propose à la frappe,
       sans fermer le champ — un médecin qui déclare pour la première
       fois s'y écrit comme avant, et rejoint le carnet du même coup.
       Le reprendre ramène ce qu'on avait noté pour le joindre. */
    else if(f.t === 'carnet'){
      const l = f.carnet.liste();
      h += `<input type="text" id="${id}" list="${id}-l" value="${esc(val)}" autocomplete="off"${ph}`
        +  ` oninput="reprendreCarnet('${k}','${f.c}',this)">`
        +  `<datalist id="${id}-l">${l.map(x => `<option value="${esc(x.nom)}"></option>`).join('')}</datalist>`;
    }
    else if(f.t === 'personne'){
      const noms = nomsMissionnes();
      h += `<input type="text" id="${id}" list="${id}-l" value="${esc(val)}" autocomplete="off"${ph || ' placeholder="Prénom et nom"'}>`
        +  `<datalist id="${id}-l">${noms.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`;
    }
    else h += `<input type="${f.t}" id="${id}" value="${esc(val)}"${ph}>`;
    /* Un champ libre peut porter ses réponses les plus fréquentes en
       pastilles : on touche plutôt que de taper, sans que le champ
       cesse d'accepter n'importe quoi d'autre. */
    if(f.sugg) h += pastilles(id, typeof f.sugg === 'function' ? f.sugg() : f.sugg, '', val);
    /* Et quand les réponses s'additionnent au lieu de se remplacer —
       la même personne trie, charge et transporte — les pastilles
       s'ajoutent au champ à la suite, sans l'empêcher d'accepter ce
       qui n'est pas proposé. */
    if(f.multi) h += pastillesMulti(id, typeof f.multi === 'function' ? f.multi() : f.multi, val);
    if(f.aide) h += `<span class="aide">${esc(f.aide)}</span>`;
    h += `</label>`;
  });
  h += `</div><div class="actions"><button class="btn" onclick="enregistrer('${k}',${ed?`'${o.id}'`:'null'},'${mode||''}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  return h;
}

function ouvrirEdition(k, id){
  const o = (etat[k]||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = formulaire(k, o);
  majDependances();
  ouvrirRideau();
}

async function enregistrer(k, id, mode){
  const cfg = CHAMPS[k];
  const existant = id ? (etat[k]||[]).find(x => x.id === id) : null;
  const o = existant || {id:uid(), auteur:moi, quand:new Date().toISOString()};
  if(!existant && mode === 'manuel') o.source = 'saisie';
  let manque = null;
  const dEl = document.getElementById(`f-${k}-date`);
  o.date = dEl ? dEl.value : aujourdhui();
  /* Seuls les champs affichés sont relus : sinon un champ masqué par
     le mode de saisie serait effacé à chaque enregistrement. */
  champsSaisie(champsVisibles(cfg, mode || (o.source === 'saisie' ? 'manuel' : ''))).forEach(f => {
    const v = valPrecisee(`f-${k}-${f.c}`);
    if(f.req && !v && !manque) manque = f.l;
    o[f.c] = v;
  });
  if(manque){ toast(`Champ obligatoire : ${manque}`); return; }
  /* Ce qu'une réponse entraîne d'elle-même : nommer le cabinet
     infirmier affecte la personne, sans qu'on ait à le redire dans
     la liste des statuts. */
  if(cfg.apres) cfg.apres(o, !!existant);
  if(existant){
    o.modifiePar = moi;
  }else{
    /* Registre classé à la main : la nouvelle entrée passe devant
       toutes les autres plutôt que de se perdre au milieu. */
    if(estManuel(k)) o.rang = Math.min(...etat[k].map(x => typeof x.rang === 'number' ? x.rang : 0)) - 1;
    etat[k].unshift(o);
  }
  /* Règle du cockpit : ce qui est renseigné quelque part se
     consigne en main courante, en plus de sa rubrique. */
  consignerRegistreEnCourante(k, o);
  const enCourante = !!MC_REG[k];
  await sauver(); fermer(); rendre();
  toast(enCourante ? (existant ? "Modifié, et repris en main courante" : "Enregistré et consigné en main courante")
                   : (existant ? "Modifié" : "Enregistré"));
}

async function supprimer(k, id){
  noterRetrait(id);
  etat[k] = etat[k].filter(x => x.id !== id);
  await sauver(); rendre(); toast("Ligne supprimée");
}

/* Les registres de traçabilité se lisent du plus récent au plus ancien :
   ce qui vient d'arriver est la première chose qu'on doit voir en ouvrant
   la page, et on remonte le temps en descendant. Le tri se fait à
   l'affichage seulement — l'ordre de stockage n'est pas touché, et les
   lignes saisies sans heure se rangent en fin de journée. */
const CHRONO = ['ars','courante'];

/* L'heure est ramenée à HH:MM avant d'être comparée : une entrée saisie
   « 9h05 » ou « 9:05 » doit se ranger avant 14:01, pas après. Une entrée
   sans heure se range en fin de journée, faute de mieux. */
function cleHeure(v){
  const m = String(v || '').match(/^\s*(\d{1,2})\s*[:hH.]\s*(\d{1,2})/);
  return m ? m[1].padStart(2,'0') + ':' + m[2].padStart(2,'0') : '';
}
function antechrono(lignes){
  const cle = o => (o.date || '') + ' ' + cleHeure(o.heure);
  return [...(lignes || [])].sort((a,b) => cle(b).localeCompare(cle(a)));
}

/* Le classement à la main l'emporte sur le tri par date dès qu'une
   entrée porte un rang. Le rang est posé sur la fiche elle-même, et
   non déduit de l'ordre du tableau : c'est ce qui lui permet de
   survivre à la fusion avec le serveur quand deux postes saisissent
   en même temps — un simple déplacement de ligne serait sinon repris
   par la version d'en face, qui ne l'aurait pas vu passer.
   Une entrée sans rang — celle qui vient d'arriver d'un autre poste,
   ou d'un amorçage — se place en tête, là où le plus récent se lit. */
function estManuel(k){ return (etat[k] || []).some(o => typeof o.rang === 'number'); }

function chrono(k, lignes){
  if(!CHRONO.includes(k)) return [...(lignes || [])];
  const l = antechrono(lignes);
  if(!estManuel(k)) return l;
  /* le tri est stable : à rang égal ou absent, l'ordre chronologique
     ci-dessus fait le départage */
  return l.sort((a,b) => (typeof a.rang === 'number' ? a.rang : -1) -
                         (typeof b.rang === 'number' ? b.rang : -1));
}

/* Numérote les entrées dans l'ordre où elles sont affichées à
   l'instant : bascule un registre en classement manuel sans que rien
   ne bouge sous les yeux de celle qui vient de cliquer. */
function assurerRangs(k){
  chrono(k, etat[k]).forEach((o, i) => { o.rang = i; });
}

async function deplacer(k, id, sens){
  assurerRangs(k);
  const l = chrono(k, etat[k]);
  const i = l.findIndex(o => o.id === id), j = i + sens;
  if(i < 0 || j < 0 || j >= l.length) return;
  const r = l[i].rang; l[i].rang = l[j].rang; l[j].rang = r;
  await sauver(); rendre();
}

async function retablirTri(k){
  (etat[k] || []).forEach(o => { delete o.rang; });
  await sauver(); rendre();
  toast("Tri par date et heure rétabli");
}

/* Le bandeau n'apparaît qu'une fois le registre passé en manuel :
   tant qu'on n'a rien déplacé, il n'y a rien à expliquer. */
function barreOrdre(k){
  if(!CHRONO.includes(k) || !estManuel(k)) return '';
  return `<div class="note ordre-manuel">
    <strong>Ordre manuel.</strong> Ces entrées sont classées à la main : le tri par date et heure ne s'applique plus, et une entrée nouvelle se place en tête.
    <button class="btn sec" onclick="retablirTri('${k}')">Revenir au tri par date et heure</button></div>`;
}

function tableau(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;
  const ent = cfg.cols.map(c => {
    if(c === 'date') return 'Date';
    if(c === 'auteur') return 'Saisi par';
    const f = cfg.f.find(x => x.c === c);
    return f ? f.l : c;
  });
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  lignes.forEach((l, i) => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel' || c === 'rdvle' || c === 'infoLe' || c === 'apartir'
         || c === 'verifieLe') v = frdate(v);
      if(typeof v === 'string' && /^https?:\/\//.test(v))
        return `<td><a href="${esc(v)}" target="_blank" rel="noopener">Ouvrir</a></td>`;
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + `<td class="act">${fleches(k, l.id, i, lignes.length)}<button title="Modifier" onclick="ouvrirEdition('${k}','${l.id}')">✎</button><button title="Supprimer" onclick="supprimer('${k}','${l.id}')">×</button></td></tr>`;
  });
  return h + '</tbody></table></div>';
}

/* Les flèches ne sont proposées que là où un ordre a un sens, et
   restent visibles en tri automatique : le premier déplacement fait
   lui-même basculer le registre en classement manuel, sans qu'il y
   ait de réglage à comprendre au préalable. */
function fleches(k, id, i, n){
  if(!CHRONO.includes(k) || n < 2) return '';
  return `<button title="Monter" onclick="deplacer('${k}','${id}',-1)"${i === 0 ? ' disabled' : ''}>↑</button>` +
         `<button title="Descendre" onclick="deplacer('${k}','${id}',1)"${i === n-1 ? ' disabled' : ''}>↓</button>`;
}

/* ---------------------------------------------------------
   Les registres de traçabilité se lisent comme un journal :
   une carte par entrée, regroupée par jour, plutôt qu'un
   tableau à dix colonnes qu'il faut faire défiler pour lire
   une phrase. Le tableau reste dans le dossier de traçabilité,
   où il sert à l'impression et à l'export.
   --------------------------------------------------------- */
/* La main courante n'y figure plus : elle reçoit désormais tout ce
   que le cockpit enregistre, et une carte par entrée n'aurait plus
   tenu à l'écran. Elle se lit en fil — une ligne par fait, le
   détail à la demande — dans vueCourante(). */
const JOURNAL = {
  ars: {
    titre:'objet', etiq:['sens','statut'],
    chips:[{c:'canal', l:"Canal"},{c:'interlocuteur', l:"Interlocuteur"}],
    blocs:[{c:'demande', l:"Ce qui est demandé ou annoncé"},{c:'reponse', l:"Notre réponse ou action"},
           {c:'attendu', l:"Ce que ça implique pour la CPTS"}],
    lien:'lien', lienL:"Ouvrir le document"
  }
};

const ETIQ_REG = {
  'En cours':'e-cours', 'Clos':'e-fini', 'Terminé':'e-fini',
  'À suivre':'e-attente', 'À faire':'e-attente', 'En attente':'e-attente',
  "Reçu de l'ARS":'e-lancer', "Envoyé à l'ARS":'e-cours', 'À envoyer':'e-attente',
  'Faible':'e-fini', 'Moyenne':'e-attente', 'Élevée':'e-bloque',
  'Sans suite':'e-fini'
};

/* Le liseré de gauche donne l'état d'un coup d'œil, sans lire :
   rouge si la remontée est critique, ambre si ça attend, vert si
   c'est en cours, gris si c'est clos. */
function classeReg(o){
  if(o.criticite === 'Élevée') return 't-bloque';
  if(o.statut === 'En cours') return 't-cours';
  if(['À faire','En attente','À suivre'].includes(o.statut)) return 't-attente';
  if(['Clos','Terminé'].includes(o.statut)) return 't-fini';
  return '';
}

/* Les initiales d'un nom pour la pastille de signature. Deux
   lettres suffisent ; « Anne Latisnère et Eva Poulmarch » en donne
   AL, et l'on lit le nom entier juste à côté. */
function initialesDe(nom){
  const m = String(nom || '').trim().split(/[\s'’-]+/).filter(Boolean);
  return (m.slice(0,2).map(x => x[0]).join('') || '?').toUpperCase();
}

/* L'horodatage que le cockpit pose lui-même à l'enregistrement, en
   clair : « 29/07 à 17:15 ». Les entrées de l'amorçage n'en ont pas
   — elles ont été écrites à la main, pas saisies. */
function horodateSaisie(iso){
  if(!iso) return '';
  const t = new Date(iso);
  if(isNaN(t.getTime())) return '';
  const p = n => String(n).padStart(2,'0');
  return `${p(t.getDate())}/${p(t.getMonth()+1)} à ${p(t.getHours())}:${p(t.getMinutes())}`;
}

function frdateJour(d){
  if(!d) return "Date non précisée";
  const t = new Date(d + 'T12:00:00');
  if(isNaN(t.getTime())) return d;
  const s = t.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function journal(k){
  const cfg = JOURNAL[k], lignes = chrono(k, etat[k]);
  if(!lignes.length)
    return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;

  /* Classé à la main, l'ordre ne suit plus les jours : les
     intertitres de journée n'ont plus rien à séparer, et chaque
     carte porte alors sa date entière. */
  const manuel = estManuel(k);
  let h = '', jour = null;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }

    const quand = manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' à ') : o.heure;

    const etiqs = (cfg.etiq || []).map(c => o[c]).filter(Boolean)
      .map(v => `<span class="etiq ${ETIQ_REG[v] || 'e-lancer'}">${esc(v)}</span>`).join('');

    const chips = (cfg.chips || []).filter(x => o[x.c])
      .map(x => `<span><span class="k">${esc(x.l)}</span>${esc(o[x.c])}</span>`).join('');

    const blocs = (cfg.blocs || []).filter(x => o[x.c])
      .map(x => `<div class="bloc"><span class="k">${esc(x.l)}</span><div class="v">${esc(o[x.c])}</div></div>`).join('');

    const lien = cfg.lien && o[cfg.lien]
      ? `<a class="lien" href="${esc(o[cfg.lien])}" target="_blank" rel="noopener">${esc(cfg.lienL || 'Ouvrir')} ↗</a>` : '';

    /* Une entrée née d'une visio garde le chemin vers son compte
       rendu : le registre atteste que la séance a eu lieu, le détail
       point par point reste là où il a été écrit. */
    const versV = o.visio
      ? `<button class="lien lien-v" onclick="ouvrirVisioDepuisARS('${o.visio}')">Voir le compte rendu de la séance</button>` : '';

    /* Une entrée sans heure de fait n'est pas pour autant sans
       repère : le cockpit horodate chaque enregistrement, et ce
       repère-là se lit au pied de la carte. Il ne dit pas quand la
       chose est arrivée — il dit quand elle a été écrite, ce qui est
       exactement ce qu'un dossier de traçabilité doit pouvoir
       attester. */
    const saisiLe = horodateSaisie(o.quand);
    const pied = [o.auteur ? 'Saisi par ' + o.auteur + (saisiLe ? ' le ' + saisiLe : '')
                           : (saisiLe ? 'Saisi le ' + saisiLe : ''),
                  o.modifiePar ? 'Modifié par ' + o.modifiePar : '',
                  o.echeance ? 'Échéance ' + frdateL(o.echeance) : '']
      .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

    const venu = cfg.venu && String(o[cfg.venu]||'').trim()
      ? `<span class="venu"><span class="p">Venu du dehors</span>${esc(o[cfg.venu])}</span>` : '';

    /* Celle ou celui qui s'en est chargé se signe : ses initiales en
       pastille, son nom à côté. C'est la contrepartie du bandeau de
       provenance — l'entrée dit d'un coup d'œil si elle vient de nous
       ou du dehors. */
    const perso = cfg.personne && String(o[cfg.personne]||'').trim()
      ? `<span class="par"><span class="av">${esc(initialesDe(o[cfg.personne]))}</span>
           <span class="nn"><span class="k">Pris en charge par</span>${esc(o[cfg.personne])}</span></span>` : '';

    h += `<article class="ent-r ${cfg.marque || ''} ${classeReg(o)}${venu ? ' dehors' : ''}">
      <div class="haut">
        ${quand ? `<span class="hr">${esc(quand)}</span>` : ''}${etiqs}${venu}
        <span class="outils">
          ${fleches(k, o.id, i, lignes.length)}
          ${SOURCES_RET[k] ? boutonRetenu(k, o) : ''}
          <button title="Modifier" onclick="ouvrirEdition('${k}','${o.id}')">✎</button>
          <button title="Supprimer" onclick="supprimer('${k}','${o.id}')">×</button>
        </span>
      </div>
      <div class="ti">${esc(o[cfg.titre]) || '—'}</div>
      ${perso}
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${blocs}${lien}${versV}${marqueRetenue(o)}
      ${pied ? `<div class="pied">${pied}</div>` : ''}
    </article>`;
  });
  return h;
}

/* =========================================================
   VUES
   ========================================================= */
function vueCockpit(){
  const c = etat.consignes;
  const derniers = chrono('courante', etat.courante).slice(0,6);
  const missionsSansPilote = etat.missions.filter(m => !m.pilote).length;

  let h = `<h1>Cockpit</h1>
  <p class="chapo">Ce que la CPTS Pau Béarn fait, qui le porte, et ce qui remonte du terrain. Une page pour savoir quoi faire en arrivant.</p>

  <h2>Consignes du moment</h2>
  <div class="consignes">
    <div class="bloc-consigne faire"><h3>Ce qu'on fait</h3><ul>${
      c.faire.map((x,i)=>`<li>${esc(x)}<button title="Modifier" onclick="modifierConsigne('faire',${i})">✎</button><button title="Retirer" onclick="retirerConsigne('faire',${i})">×</button></li>`).join('') || '<li class="vide">Aucune consigne active.</li>'
    }</ul><div class="actions"><button class="btn sec" onclick="ajouterConsigne('faire')">Ajouter</button></div></div>
    <div class="bloc-consigne eviter"><h3>Ce qu'on ne fait pas</h3><ul>${
      c.eviter.map((x,i)=>`<li>${esc(x)}<button title="Modifier" onclick="modifierConsigne('eviter',${i})">✎</button><button title="Retirer" onclick="retirerConsigne('eviter',${i})">×</button></li>`).join('') || '<li class="vide">Aucune consigne active.</li>'
    }</ul><div class="actions"><button class="btn sec" onclick="ajouterConsigne('eviter')">Ajouter</button></div></div>
  </div>

  <h2 style="margin-top:26px">Où on en est</h2>
  <div class="compteurs">
    <div class="compteur"><div class="n">${etat.missions.filter(m=>m.statut==='En cours').length}</div><div class="l">missions en cours</div></div>
    <div class="compteur"><div class="n">${missionsSansPilote}</div><div class="l">missions sans pilote désigné</div></div>
    <div class="compteur"><div class="n">${etat.ars.filter(a=>a.statut==='À faire'||a.statut==='En attente').length}</div><div class="l">échanges ARS en attente</div></div>
    <div class="compteur"><div class="n">${etat.courante.length}</div><div class="l">entrées en main courante</div></div>
    <div class="compteur"><div class="n">${(etat.cpts||[]).filter(c => (c.appels||[]).length).length}</div><div class="l">CPTS contactées</div></div>
    <div class="compteur"><div class="n">${venuesDuDehors().length}</div><div class="l">remontées venues du terrain</div></div>
  </div>`;

  if(missionsSansPilote){
    h += `<div class="note" style="margin-top:18px"><strong>${missionsSansPilote} mission${missionsSansPilote>1?'s':''} sans pilote.</strong> Une mission sans nom en face ne se fait pas. <a href="#" onclick="aller('missions');return false;">Désigner les pilotes</a></div>`;
  }

  const arsOuvert = chrono('ars', etat.ars).filter(a => a.statut === 'À faire' || a.statut === 'En attente');
  if(arsOuvert.length){
    h += `<h2 style="margin-top:26px">En suspens avec l'ARS</h2><div class="carte"><ul class="fil">` +
      arsOuvert.map(a => `<li><div class="h">${frdate(a.date)}</div><div class="c">
        <div class="t">${esc(a.objet)}</div>
        ${a.attendu?`<div class="d">${esc(a.attendu)}</div>`:''}
        <div class="s">${esc(a.sens)} · ${esc(a.interlocuteur||'—')} · ${esc(a.statut)}</div></div></li>`).join('') +
      `</ul><div class="actions"><button class="btn sec" onclick="aller('ars')">Ouvrir le suivi ARS</button></div></div>`;
  }

  h += `<h2 style="margin-top:26px">Missions en un coup d'œil</h2>`;
  etat.missions.forEach(m => {
    h += `<div class="mission"><div class="haut">
      <div class="titre">${esc(m.titre)}</div>
      <span class="etiq ${classeStatut(m.statut)}">${esc(m.statut)}</span></div>
      <div class="meta">
        <div><span class="k">Pilote</span>${esc(m.pilote) || '<em style="color:var(--braise)">à désigner</em>'}</div>
        <div><span class="k">Suppléant</span>${esc(m.suppleant) || '—'}</div>
        <div style="flex:1 1 100%"><span class="k">Prochaine action</span>${esc(m.prochaine) || '<em style="color:var(--texte-2)">à écrire</em>'}</div>
      </div></div>`;
  });

  h += `<h2 style="margin-top:26px">Dernières entrées en main courante</h2><div class="carte">`;
  if(!derniers.length){
    h += `<p class="vide">Rien de consigné pour l'instant. <a href="#" onclick="aller('courante');return false;">Ouvrir la main courante</a></p>`;
  }else{
    /* Le même coup d'œil qu'en main courante, en six lignes : la
       nature en pastille, le fait en une phrase, qui s'en est
       chargé. Le détail se lit là où il est écrit. */
    h += `<ul class="fil">` + derniers.map(e =>

       <div class="t">${esc(resumeMC(e.evenement))}</div>
       <div class="s">${esc([e.qui || 'personne nommée',
