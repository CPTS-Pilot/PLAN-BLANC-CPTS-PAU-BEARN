/* --- Le geste : une étoile, cinq sorties ------------------
   Deux étoiles séparées — une pour le point de situation, une pour
   le RETEX — et plus personne ne marque rien. Il n'y en a donc
   qu'une, et c'est au clic qu'on dit ce que l'entrée doit devenir. */
const RETENUS = [
  {id:'fait',     l:"Fait marquant",     ou:"Point de situation", d:"Ce qui a changé la situation, ou ce que la CPTS a engagé."},
  {id:'marche',   l:"Ce qui a marché",   ou:"RETEX",              d:"Un circuit, un réflexe ou un appui qui a tenu."},
  {id:'manque',   l:"Ce qui a manqué",   ou:"RETEX",              d:"Une information, un moyen ou un interlocuteur qui a fait défaut."},
  {id:'changer',  l:"À changer",         ou:"RETEX",              d:"Ce qu'on ferait autrement la prochaine fois."},
  {id:'doctrine', l:"Point de doctrine", ou:"Plan SSE",           d:"Une règle apprise ici, qui doit figurer dans une fiche."}
];
const RETENU_DE = id => RETENUS.find(x => x.id === id) || null;

/* Les collections où l'étoile se pose. Chacune dit seulement où
   lire son titre : le reste du module ne connaît plus que cette
   forme-là, et une nouvelle collection s'y ajoute en une ligne. */
const SOURCES_RET = {
  courante: {l:"Main courante",           titre:o => o.evenement},
  ars:      {l:"Échange avec l'ARS",      titre:o => o.objet},
  visios:   {l:"Visio de crise de l'ARS", titre:o => o.instance || "Visio de crise de l'ARS"}
};

/* Tout ce qui a été retenu, à plat et dans l'ordre des faits.
   La marque vit sur l'entrée elle-même : rien n'est recopié, et
   supprimer une entrée emporte sa marque — il n'y a pas d'orphelin
   à gérer. */
function marquesRetenues(genres){
  const out = [];
  Object.keys(SOURCES_RET).forEach(k => {
    (etat[k] || []).forEach(o => {
      const r = o.retenu;
      if(!r || !r.genre) return;
      if(genres && genres.indexOf(r.genre) < 0) return;
      out.push({k, id:o.id, source:SOURCES_RET[k].l, titre:SOURCES_RET[k].titre(o) || '—',
        date:o.date || '', heure:o.heure || '', genre:r.genre,
        note:r.note || '', par:r.par || '', quand:r.quand || ''});
    });
  });
  return out.sort((a,b) => (a.date + ' ' + a.heure).localeCompare(b.date + ' ' + b.heure));
}

function boutonRetenu(k, o){
  if(enChantier('rapports')) return '';
  const on = !!(o.retenu && o.retenu.genre);
  const g = on ? RETENU_DE(o.retenu.genre) : null;
  return `<button class="ret-b${on ? ' on' : ''}" title="${on
    ? 'Retenu — ' + esc(g ? g.l : '') : "Retenir pour les rapports"}"
    onclick="ouvrirRetenu('${k}','${o.id}')">${on ? '★' : '☆'}</button>`;
}

function marqueRetenue(o){
  if(enChantier('rapports')) return '';
  const r = o && o.retenu;
  if(!r || !r.genre) return '';
  const g = RETENU_DE(r.genre);
  const dit = String(r.note || '').trim();
  return `<div class="ret-m">
    <span class="g">${esc(g ? g.l : r.genre)}</span>
    <span class="t">${dit ? esc(dit) : `Retenu pour « ${esc(g ? g.ou : '')} »`}${
      r.par ? ' <span style="color:var(--texte-2)">— ' + esc(r.par) + '</span>' : ''}</span></div>`;
}

function ouvrirRetenu(k, id){
  const o = (etat[k] || []).find(x => x.id === id);
  const cfg = SOURCES_RET[k];
  if(!o || !cfg) return;
  const r = o.retenu || {};
  genreChoisi = r.genre || '';
  document.getElementById('modale').innerHTML = `<h3>Retenir pour les rapports</h3>
    <p style="color:var(--texte-2);margin:0 0 8px;font-size:13px">${esc(cfg.l)}${o.date ? ' · ' + frdateL(o.date) : ''}</p>
    <div class="rappel" style="margin-bottom:14px">${esc(cfg.titre(o) || '—')}</div>
    <p style="color:var(--texte-2);margin:0 0 10px;font-size:13.5px">Ce que cette entrée doit devenir. Elle n'est recopiée nulle part : elle reste écrite ici, et le rapport vient la chercher.</p>
    <div class="gen-l">${RETENUS.map(x => `<label class="${genreChoisi === x.id ? 'sel' : ''}" onclick="choisirGenre('${x.id}')">
      <input type="radio" name="gen-ret" value="${x.id}"${genreChoisi === x.id ? ' checked' : ''}>
      <span><b>${esc(x.l)}</b><span class="ou">${esc(x.d)} → ${esc(x.ou)}</span></span>
    </label>`).join('')}</div>
    <label class="large"><span class="k">Ce qu'il faut en retenir</span>
      <textarea id="ret-note" rows="3" placeholder="Facultatif, mais c'est ce qui fera la valeur du rapport : une phrase pour qui le lira sans avoir vécu la scène.">${esc(r.note || '')}</textarea></label>
    <div class="actions">
      <button class="btn" onclick="validerRetenu('${k}','${id}')">Retenir</button>
      ${r.genre ? `<button class="btn sec" onclick="retirerRetenu('${k}','${id}')">Ne plus retenir</button>` : ''}
      <button class="btn sec" onclick="fermer()">Annuler</button>
    </div>`;
  ouvrirRideau();
}

function choisirGenre(g){
  genreChoisi = g;
  document.querySelectorAll('.gen-l label').forEach(l => l.classList.remove('sel'));
  const i = document.querySelector('.gen-l input[value="' + g + '"]');
  if(i){ i.checked = true; i.closest('label').classList.add('sel'); }
}

async function validerRetenu(k, id){
  if(!genreChoisi){ toast("Choisissez ce que cette entrée doit devenir"); return; }
  const o = (etat[k] || []).find(x => x.id === id); if(!o) return;
  const n = document.getElementById('ret-note');
  o.retenu = {genre:genreChoisi, note:(n ? n.value : '').trim(), par:moi, quand:new Date().toISOString()};
  const g = RETENU_DE(genreChoisi);
  await sauver(); fermer(); rendre();
  toast("Retenu pour « " + (g ? g.ou : '') + " »");
}

async function retirerRetenu(k, id){
  const o = (etat[k] || []).find(x => x.id === id); if(!o) return;
  delete o.retenu;
  await sauver(); fermer(); rendre();
  toast("L'entrée ne part plus dans les rapports");
}

/* --- La page d'entrée -------------------------------------- */
/* Le bandeau de chantier. Il n'est pas décoratif : cet onglet écrit
   en main courante et dans un état partagé par toute l'équipe, et
   personne d'autre ne le voit pour l'instant. Ce qui s'y fait doit
   donc se savoir. */
function bandeauChantier(){
  return `<div class="chantier">
    <span class="p">En construction</span>
    <span class="t">Cet onglet est ouvert en maquette, sur cet appareil seulement — le reste de l'équipe ne le voit pas, et les étoiles de marquage n'apparaissent nulle part ailleurs dans le cockpit. Ce qui est enregistré ici l'est pour de bon et part sur le serveur : un point de situation arrêté s'inscrit en main courante comme n'importe quelle autre entrée. Pour refermer le chantier sur cet appareil, ajouter <code>?maquette=0</code> à l'adresse.</span>
  </div>`;
}

function vueRapports(){
  const ch = bandeauChantier();
  if(rapport === 'situations') return ch + vueSituations();
  if(rapport === 'retex')      return ch + vueRetex();
  if(rapport === 'sse')        return ch + vueSSE();

  const sit = situationsTriees();
  const der = sit[0] || null;
  const neufs = faitsDepuis(der ? der.quand : '').length;
  const rx = marquesRetenues(['marche','manque','changer']).length;
  const doc = marquesRetenues(['doctrine']).length;

  const carte = (id, nom, d, e, vierge) => `<button class="rapp${vierge ? ' vierge' : ''}" onclick="ouvrirRapport('${id}')">
    <div class="n">${nom}</div><div class="d">${d}</div><div class="e">${e}</div></button>`;

  return ch + `<h1>Rapports</h1>
  <p class="chapo">Ce que cette crise laisse derrière elle. Quatre documents tirés du même fonds : le point de situation qu'on arrête à une date, la matière du retour d'expérience, les projets de fiches pour le plan SSE, et le dossier de traçabilité complet. Aucun ne se rédige de zéro — ils se remplissent de ce qui est déjà consigné, et de ce que vous marquez d'une étoile au fil de l'eau.</p>

  <div class="note">L'étoile ☆ est posée sur chaque entrée de la <a href="#" onclick="aller('courante');return false;">main courante</a>, des <a href="#" onclick="aller('ars');return false;">échanges avec l'ARS</a> et des visios de crise. Un clic, cinq secondes : on dit si l'entrée est un fait marquant, ce qui a marché, ce qui a manqué, ce qu'on changera, ou un point de doctrine. Les quatre rapports se remplissent seuls à partir de là.</p></div>

  <div class="rapports">
    ${carte('situations', "Points de situation",
      "Le rapport détaillé, arrêté à une date et signé : la situation, les consignes, les chiffres, l'état de chaque mission avec sa prochaine action, ce qui reste en suspens, et les faits marquants depuis le point précédent. Export PDF et Word.",
      sit.length
        ? `${sit.length} point${sit.length>1?'s':''} arrêté${sit.length>1?'s':''} · dernier le ${frdateL(der.quand.slice(0,10))}${neufs ? ` · ${neufs} fait${neufs>1?'s':''} marquant${neufs>1?'s':''} depuis` : ''}`
        : (neufs ? `Aucun point arrêté · ${neufs} fait${neufs>1?'s':''} marquant${neufs>1?'s':''} en attente` : "Aucun point arrêté"),
      !sit.length)}

    ${carte('retex', "Matière pour le RETEX",
      "Ce qui s'oublie en deux semaines et qu'aucun compteur ne retrouvera : ce qui a marché, ce qui a manqué, ce qu'on fera autrement. La chronologie et les délais se calculent seuls ; ces trois colonnes-là ne peuvent venir que de vous.",
      rx ? `${rx} élément${rx>1?'s':''} versé${rx>1?'s':''} au retour d'expérience` : "Rien versé au RETEX pour l'instant",
      !rx)}

    ${carte('sse', "Pour le plan SSE",
      "Les fiches mission, déjà écrites à quatre cinquièmes dans le cockpit, et les fiches réflexes rangées par déclencheur — non par action, pour qu'elles servent aussi à la canicule. Export Word, à coller dans le plan en cours de rédaction.",
      `${(etat.missions||[]).length} fiche${(etat.missions||[]).length>1?'s':''} mission · ${DECLENCHEURS.length} déclencheurs${doc ? ` · ${doc} point${doc>1?'s':''} de doctrine` : ''}`,
      !doc)}
  </div>`;
}

/* --- Points de situation ----------------------------------- */
function situationsTriees(){
  return (etat.situations || []).slice().sort((a,b) => String(b.quand||'').localeCompare(String(a.quand||'')));
}
function faitsDepuis(depuis){
  return marquesRetenues(['fait']).filter(x => !depuis || String(x.quand || '') > depuis);
}

function vueSituations(){
  const sit = situationsTriees();
  const der = sit[0] || null;
  const neufs = faitsDepuis(der ? der.quand : '');

  let h = `<button class="retour-r" onclick="aller('rapports')">Revenir à tous les rapports</button>
  <h1>Points de situation</h1>
  <p class="chapo">Un point de situation dit où en est la CPTS à une date, pour quelqu'un qui n'a pas suivi. On l'arrête quand on veut : il se fige, il s'archive, et le suivant repart de là. C'est la succession de ces points qui montre le chemin parcouru — et c'est elle, bien plus que le dernier état, qui servira au retour d'expérience.</p>
  <div class="barre-h">
    <span class="cpt-h">${sit.length} point${sit.length>1?'s':''} arrêté${sit.length>1?'s':''}${
      neufs.length ? ` · ${neufs.length} fait${neufs.length>1?'s':''} marquant${neufs.length>1?'s':''} depuis le dernier` : ''}</span>
    <button class="btn" onclick="preparerSituation()">Préparer un point de situation</button>
  </div>`;

  if(!neufs.length){
    h += `<div class="note">Aucun fait marquant retenu ${der ? 'depuis le point du ' + frdateL(der.quand.slice(0,10)) : 'pour l\'instant'}. Le point se prépare quand même — il portera les chiffres, l'état des missions et ce qui reste en suspens — mais il ne dira pas ce qu'il faut en retenir. C'est l'étoile ☆ posée en main courante qui lui donne son corps.</div>`;
  }

  if(!sit.length){
    h += `<div class="carte"><p class="vide">Aucun point de situation arrêté. Le premier fixera le point de départ : tout ce qui sera retenu ensuite se comptera à partir de sa date.</p></div>`;
  }else{
    h += `<div class="carte"><ul class="fil">` + sit.map(s => `<li>
      <div class="h">${frdate(s.quand.slice(0,10))}<br><span style="font-family:var(--mono);font-size:10.5px">${esc(s.ref)}</span></div>
      <div class="c">
        <div class="t">${esc(s.phrase) || 'Point de situation'}</div>
        <div class="d">${s.faits.length} fait${s.faits.length>1?'s':''} marquant${s.faits.length>1?'s':''} · ${
          s.missions.filter(m => m.statut === 'En cours').length} mission${s.missions.filter(m => m.statut === 'En cours').length>1?'s':''} en cours · ${
          s.suspens.length} point${s.suspens.length>1?'s':''} en suspens</div>
        <div class="s">Arrêté le ${frdateL(s.quand.slice(0,10))} à ${esc(s.quand.slice(11,16))}${s.par && s.par !== 'Anonyme' ? ' par ' + esc(s.par) : ''}</div>
        <div class="actions" style="margin-top:8px">
          <button class="btn sec" onclick="voirSituation('${s.id}')">Ouvrir le document</button>
          <button class="btn sec" onclick="exporterSituationWord('${s.id}')">Word</button>
        </div>
      </div></li>`).join('') + `</ul></div>`;
  }
  return h;
}

/* Le brouillon se construit à l'ouverture, jamais avant : il ne
   peut donc pas être en retard sur ce qui a été saisi entre-temps. */
function brouillonSituation(){
  const sit = situationsTriees();
  const der = sit[0] || null;
  const depuis = der ? der.quand : '';

  const ch = [
    {n: etat.missions.filter(m => m.statut === 'En cours').length, l:"missions en cours"},
    {n: etat.missions.filter(m => !m.pilote).length,               l:"missions sans pilote désigné"},
    {n: (etat.cpts || []).length,                                  l:"CPTS contactées"},
    {n: venuesDuDehors().length,                                   l:"remontées de terrain"},
    {n: (etat.courante || []).length,                              l:"entrées en main courante"}
  ];
  const suspens = [];
  (etat.ars || []).filter(a => a.statut === 'À faire' || a.statut === 'En attente').forEach(a =>
    suspens.push({quoi:"ARS — " + (a.objet || '—'),
      detail:[a.sens, a.interlocuteur, a.statut, a.attendu].filter(Boolean).join(' · ')}));
  etat.missions.filter(m => !m.pilote).forEach(m =>
    suspens.push({quoi:"Mission sans pilote — " + m.titre, detail:m.prochaine || "Prochaine action à écrire."}));
  etat.missions.filter(m => m.statut === 'Bloqué').forEach(m =>
    suspens.push({quoi:"Mission bloquée — " + m.titre, detail:m.prochaine || ''}));

  return {
    id: uid(),
    ref: 'PS-2026-' + String((etat.situations || []).length + 1).padStart(2, '0'),
    quand: new Date().toISOString(),
    par: moi,
    depuis, depuisRef: der ? der.ref : '',
    niveau: etat.entete.niveau, phrase: etat.entete.phrase,
    faire: etat.consignes.faire.slice(), eviter: etat.consignes.eviter.slice(),
    chiffres: ch,
    missions: etat.missions.map(m => ({titre:m.titre, pilote:m.pilote, suppleant:m.suppleant,
      statut:m.statut, prochaine:m.prochaine})),
    faits: faitsDepuis(depuis).map(f => ({date:f.date, heure:f.heure, source:f.source,
      titre:f.titre, note:f.note, par:f.par})),
    suspens,
    analyse: ''
  };
}

/* Le document lui-même. Une seule écriture pour l'écran et pour
   Word : ce qui s'imprime est exactement ce qui s'exporte. */
function corpsSituation(s, mode){
  const ecran = mode !== 'word';
  const modifiable = ecran && !s.fige;
  const nb = s.faits.length;

  const lignesFaits = nb ? s.faits.map(f => `<tr>
    <td style="white-space:nowrap">${frdateL(f.date)}${f.heure ? '<br>' + esc(f.heure) : ''}</td>
    <td>${esc(f.source)}</td>
    <td><b>${esc(f.titre)}</b>${f.note ? '<br>' + esc(f.note) : ''}</td>
  </tr>`).join('') : `<tr><td colspan="3" class="vide">Aucun fait marquant retenu sur la période. Les chiffres et l'état des missions ci-dessus restent valables ; ce que la période a appris n'a pas été consigné.</td></tr>`;

  return `<div class="ent">
    <div class="g">
      <div class="org">CPTS Pau Béarn</div>
      <div class="sub">Plan canicule — territoire de la CPTS Pau Béarn</div>
    </div>
    <div class="d">
      <div class="ref">Réf. ${esc(s.ref)}</div>
      <div class="sub">${frdateL(s.quand.slice(0,10))} à ${esc(s.quand.slice(11,16))}</div>
    </div>
  </div>

  <h1 class="ttl">Point de situation</h1>
  <div class="ss">Arrêté au ${frdateL(s.quand.slice(0,10))} à ${esc(s.quand.slice(11,16))}${
    s.par && s.par !== 'Anonyme' ? ' par ' + esc(s.par) : ''}${
    s.depuis ? ` · couvre la période depuis le point ${esc(s.depuisRef)} du ${frdateL(s.depuis.slice(0,10))}` : ' · premier point de situation de la crise'}</div>

  <h2>1 · La situation</h2>
  <div class="ctx"><b>${esc(s.niveau)}</b><br>${esc(s.phrase)}</div>

  <h2>2 · Ce que la CPTS fait, et ce qu'elle ne fait pas</h2>
  <table>
    <thead><tr><th style="width:50%">Ce qu'on fait</th><th style="width:50%">Ce qu'on ne fait pas</th></tr></thead>
    <tbody><tr>
      <td>${s.faire.length ? '<ul>' + s.faire.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<span class="vide">Aucune consigne active.</span>'}</td>
      <td>${s.eviter.length ? '<ul>' + s.eviter.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<span class="vide">Aucune consigne active.</span>'}</td>
    </tr></tbody>
  </table>

  <h2>3 · Les chiffres à cette date</h2>
  <table>
    <thead><tr><th style="width:16%">Nombre</th><th>Ce qu'il compte</th></tr></thead>
    <tbody>${s.chiffres.map(c => `<tr><td style="text-align:right;font-weight:700">${c.n}</td><td>${esc(c.l)}</td></tr>`).join('')}</tbody>
  </table>

  <h2>4 · Où en est chaque mission</h2>
  <table>
    <thead><tr><th style="width:34%">Mission</th><th style="width:14%">État</th><th style="width:20%">Pilote</th><th>Prochaine action</th></tr></thead>
    <tbody>${s.missions.map(m => `<tr>
      <td><b>${esc(m.titre)}</b></td>
      <td>${esc(m.statut)}</td>
      <td>${esc(m.pilote) || '<span class="vide">à désigner</span>'}${m.suppleant ? '<br><span style="font-size:9pt;color:#5A6A7C">appui : ' + esc(m.suppleant) + '</span>' : ''}</td>
      <td>${esc(m.prochaine) || '<span class="vide">à écrire</span>'}</td>
    </tr>`).join('')}</tbody>
  </table>

  <h2>5 · Faits marquants${s.depuis ? ' de la période' : ' depuis le début de la mobilisation'}</h2>
  <table>
    <thead><tr><th style="width:13%">Date</th><th style="width:20%">Provenance</th><th>Ce qui s'est passé</th></tr></thead>
    <tbody>${lignesFaits}</tbody>
  </table>

  <h2>6 · Ce qui reste en suspens</h2>
  ${s.suspens.length ? `<table>
    <thead><tr><th style="width:42%">Objet</th><th>Où ça en est</th></tr></thead>
    <tbody>${s.suspens.map(x => `<tr><td><b>${esc(x.quoi)}</b></td><td>${esc(x.detail) || '—'}</td></tr>`).join('')}</tbody>
  </table>` : `<p class="vide">Rien en suspens : aucune mission sans pilote, aucun échange en attente auprès de l'ARS.</p>`}

  <h2>7 · Ce qu'on en retient</h2>

    ? `<div id="ps-analyse" contenteditable="true" style="min-height:76px;border:1px dashed #98A6BA;border-radius:6px;padding:10px 12px;font-size:13px">${esc(s.analyse || '')}</div>`
    : (String(s.analyse || '').trim()
        ? `<p>${esc(s.analyse).replace(/\n/g, '<br>')}</p>`

    s.fige ? '' : ' Document en préparation : il n\'est pas encore arrêté.'}</div>`;
}

function preparerSituation(){
  brouillonSit = brouillonSituation();
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<div class="acte">${corpsSituation(brouillonSit, 'ecran')}</div>
  <div class="actions">
    <button class="btn" onclick="arreterSituation()">Arrêter ce point de situation</button>
    <button class="btn sec" onclick="imprimerModale()">Imprimer ou enregistrer en PDF</button>
    <button class="btn sec" onclick="exporterSituationWord('')">Word</button>
    <button class="btn sec" onclick="fermer()">Fermer sans arrêter</button>
  </div>`;
  ouvrirRideau();
  toast("Le paragraphe « Ce qu'on en retient » s'écrit directement à l'écran");
}

function voirSituation(id){
  const s = (etat.situations || []).find(x => x.id === id); if(!s) return;
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<div class="acte">${corpsSituation(s, 'ecran')}</div>
  <div class="actions">
    <button class="btn" onclick="imprimerModale()">Imprimer ou enregistrer en PDF</button>
    <button class="btn sec" onclick="exporterSituationWord('${s.id}')">Word</button>
    <button class="btn sec" onclick="fermer()">Fermer</button>
  </div>`;
  ouvrirRideau();
}

/* Arrêter, c'est figer. Le document ne se recalculera plus : il
   restera ce que la CPTS savait ce jour-là, y compris si ce qu'elle
   savait était faux. C'est précisément ce qu'un REX cherche. */
async function arreterSituation(){
  if(!brouillonSit) return;
  const el = document.getElementById('ps-analyse');
  const s = brouillonSit;
  s.analyse = el ? el.innerText.trim() : '';
  s.fige = true;
  s.par = moi;
  s.quand = new Date().toISOString();

  etat.situations = etat.situations || [];
  etat.situations.push(s);

  const n = s.faits.length, sp = s.suspens.length;
  etat.courante.unshift({
    id: uid(), type: 'Rapport', date: aujourdhui(), heure: new Date().toTimeString().slice(0,5), source:'',
    evenement: `Point de situation ${s.ref} arrêté : ${n} fait${n>1?'s':''} marquant${n>1?'s':''} retenu${n>1?'s':''}, ${
      s.missions.filter(m => m.statut === 'En cours').length} missions en cours, ${sp} point${sp>1?'s':''} en suspens.`,
    suite: "Le document est figé et archivé dans « Rapports », feuillet « Points de situation ». Il ne se recalcule plus : le prochain point repartira de cette date.",
    qui: '', auteur: moi, quand: new Date().toISOString()
  });

  brouillonSit = null;
  await sauver(); fermer(); rendre();
  toast("Point de situation arrêté et consigné en main courante");
}

function exporterSituationWord(id){
  let s;
  if(id){ s = (etat.situations || []).find(x => x.id === id); }
  else {
    s = brouillonSit;
    const el = document.getElementById('ps-analyse');
    if(s && el) s.analyse = el.innerText.trim();
  }
  if(!s) return;
  telechargerWord("Point de situation " + s.ref, "Point de situation — CPTS Pau Béarn",
    corpsSituation(s, 'word'));
}

/* --- Word sans bibliothèque --------------------------------

   Rien à charger depuis un CDN, rien à installer : le cockpit doit
   pouvoir sortir un document depuis un poste qui n'a que son
   navigateur. */

<head><meta charset="utf-8"><title>${esc(titre)}</title>

<style>

body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#101820;line-height:1.4}

  const b = new Blob(['\uFEFF' + html], {type:'application/msword'});

}

/* --- Matière pour le RETEX ---------------------------------
   Trois colonnes que la machine ne saura jamais remplir seule, et
   une chronologie qu'elle est seule à pouvoir tenir sans rien
   oublier. Le document fini viendra ; ce qui presse, c'est que la
   matière ne se perde pas. */
function vueRetex(){
  const cols = [
    {g:'marche',  t:"Ce qui a marché",  s:"Les circuits, les réflexes et les appuis qui ont tenu. À reconduire tels quels dans le plan."},
    {g:'manque',  t:"Ce qui a manqué",  s:"Les informations, les moyens et les interlocuteurs qui ont fait défaut, et à quel moment."},
    {g:'changer', t:"À changer",        s:"Ce qu'on ferait autrement. C'est ce qui deviendra une ligne du plan SSE."}
  ];
  const tout = marquesRetenues(['marche','manque','changer']);

  let h = `<button class="retour-r" onclick="aller('rapports')">Revenir à tous les rapports</button>
  <h1>Matière pour le RETEX</h1>
  <p class="chapo">Le retour d'expérience s'écrira à froid, en septembre. Ce qui ne peut pas attendre, c'est la matière : ce qui a marché, ce qui a manqué, ce qu'on fera autrement. Ça s'oublie en deux semaines, et aucun compteur ne le retrouvera. Cette page ne rédige rien — elle ramasse, pendant que c'est encore chaud.</p>
  <div class="barre-h">
    <span class="cpt-h">${tout.length} élément${tout.length>1?'s':''} versé${tout.length>1?'s':''} au retour d'expérience</span>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn sec" onclick="exporterRetexWord()">Word</button>
  </div>`;

  h += `<div class="note">La chronologie complète, les décisions et les délais se calculent seuls à partir de la main courante — ils seront repris dans le document final sans que personne n'ait à les ressaisir. Les trois colonnes ci-dessous sont les seules qui dépendent de vous.</div>`;

  cols.forEach(c => {
    const l = marquesRetenues([c.g]);
    h += `<h2 style="margin-top:24px">${c.t} <span class="cpt-h">${l.length}</span></h2>
    <p class="sous-h">${c.s}</p><div class="carte">`;
    if(!l.length){
      h += `<p class="vide">Rien de versé sous cette entrée. L'étoile ☆ d'une entrée de main courante permet de l'y ranger.</p>`;
    }else{
      h += `<ul class="fil">` + l.map(x => `<li>
        <div class="h">${frdate(x.date)}${x.heure ? '<br>' + esc(x.heure) : ''}</div>
        <div class="c">
          <div class="t">${esc(x.titre)}</div>
          ${x.note ? `<div class="d">${esc(x.note)}</div>` : ''}
          <div class="s">${esc(x.source)}${x.par ? ' · retenu par ' + esc(x.par) : ''}</div>
        </div></li>`).join('') + `</ul>`;
    }
    h += `</div>`;
  });
  return h;
}

    const l = marquesRetenues([g]);

      ? `<table><thead><tr><th style="width:13%">Date</th><th style="width:20%">Provenance</th><th>Ce qu'on en retient</th></tr></thead><tbody>` +
        l.map(x => `<tr><td style="white-space:nowrap">${frdateL(x.date)}</td><td>${esc(x.source)}</td>
          <td><b>${esc(x.titre)}</b>${x.note ? '<br>' + esc(x.note) : ''}</td></tr>`).join('') + `</tbody></table>`
      : `<p class="vide">Rien de versé sous cette entrée à ce jour.</p>`);

  telechargerWord("Matiere RETEX", "Matière pour le RETEX — CPTS Pau Béarn",
    `<div class="ent"><div class="g"><div class="org">CPTS Pau Béarn</div>
      <div class="sub">Plan canicule — territoire de la CPTS Pau Béarn</div></div>

    <h1 class="ttl">Matière pour le retour d'expérience</h1>

/* --- Pour le plan SSE --------------------------------------
   Deux documents, deux découpes. Les fiches mission suivent ce que
   la CPTS porte durablement — elles existent déjà mot pour mot.
   Les fiches réflexes suivent le déclencheur, pas l'action : c'est
   ce qui leur permet de servir d'un épisode à l'autre, et d'une
   crise à l'autre.

   Les déclencheurs ci-dessous sont ceux de la canicule. Le champ
   `m` désigne la mission qui a déjà défriché la question ; il
   reste vide tant que les missions de cet épisode ne sont pas
   arrêtées. */
const DECLENCHEURS = [
  {id:'d1', q:"Météo-France place le département en vigilance orange ou rouge canicule",
   s:"La première heure : qui est prévenu, qui ouvre le cockpit, qui parle à l'ARS, et ce qu'on diffuse aux adhérents dès le premier jour.", m:''},
  {id:'d2', q:"Un professionnel signale une personne fragile isolée",
   s:"Où ça se consigne, qui rappelle, ce qu'on peut faire nous-mêmes et à partir de quand ça relève du CCAS, du 15 ou de l'ARS.", m:''},
  {id:'d3', q:"Un EHPAD ou une résidence autonomie signale une tension",
   s:"Ce qu'on demande avant de proposer quoi que ce soit : nombre de résidents, locaux rafraîchis, personnel présent, médecin coordonnateur joignable.", m:''},
  {id:'d4', q:"Une officine signale des ruptures ou des demandes inhabituelles",
   s:"Ce qui se remonte à l'ARS, ce qui se relaie aux confrères, et ce qui n'est qu'un fait isolé.", m:''},
  {id:'d5', q:"Les urgences ou le SAS signalent un afflux lié à la chaleur",
   s:"Ce que la médecine de ville peut absorber, et comment on le fait savoir sans promettre des créneaux qui n'existent pas.", m:''},
  {id:'d6', q:"L'ARS demande à la CPTS de relayer une consigne",
   s:"Distinguer ce qui est mandaté de ce que la CPTS entreprend d'elle-même. Qui valide avant diffusion, et par quel canal.", m:''},
  {id:'d7', q:"Un adhérent ou la presse demande une position",
   s:"Qui parle au nom de la CPTS, et ce qui ne sort pas sans validation de la gouvernance.", m:''}
];

function vueSSE(){
  const doc = marquesRetenues(['doctrine']);
  const vides = DECLENCHEURS.filter(d => !d.m).length;

  let h = `<button class="retour-r" onclick="aller('rapports')">Revenir à tous les rapports</button>
  <h1>Pour le plan SSE</h1>
  <p class="chapo">La mission « Traçabilité » pose comme limite qu'on ne rédige pas de fiches réflexes pendant la crise. Cette page ne les rédige pas : elle ramasse la matière pendant qu'elle est encore chaude, pour que la rédaction se fasse à froid sans avoir rien oublié.</p>
  <div class="barre-h">
    <span class="cpt-h">${(etat.missions||[]).length} fiches mission · ${DECLENCHEURS.length} déclencheurs · ${doc.length} point${doc.length>1?'s':''} de doctrine</span>
    <button class="btn sec" onclick="exporterFichesMissionWord()">Fiches mission en Word</button>
  </div>

  <h2 style="margin-top:24px">Fiches mission <span class="cpt-h">déjà écrites</span></h2>
  <p class="sous-h">La trame <em>but · ce qu'on fait · avec qui · pour qui · ce qu'on ne fait pas</em> que vous avez remplie pour chaque mission est exactement celle d'une fiche mission de plan SSE. Il n'y a rien à réécrire — seulement à extraire.</p>
  <div class="carte">`;

  h += (etat.missions || []).map(m => {
    const f = m.fiche || {};
    const remplie = ['but','faire','avec','pour','limite'].filter(c => String(f[c]||'').trim()).length;
    return `<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--trait)">
      <div style="font-family:var(--display);font-weight:700;font-size:14.5px">${esc(m.titre)}</div>
      <div style="font-size:12.5px;color:var(--texte-2);margin:3px 0 5px">${remplie}/5 rubriques renseignées${
        m.pilote ? ' · pilote : ' + esc(m.pilote) : ' · pilote à désigner'}</div>
      ${f.limite ? `<div style="font-size:13px;color:var(--braise)"><b>Ce qu'on ne fait pas :</b> ${esc(f.limite)}</div>`
        : `<div style="font-size:13px;color:var(--texte-2)"><em>Aucune limite écrite — c'est pourtant la ligne qui compte le plus dans une fiche.</em></div>`}
    </div>`;
  }).join('') + `</div>`;

  h += `<h2 style="margin-top:26px">Fiches réflexes <span class="cpt-h">rangées par déclencheur</span></h2>
  <p class="sous-h">Une fiche réflexe ne répond pas à « comment on fait une collecte », mais à « il est 14 h, voilà ce qui arrive — qu'est-ce que je fais ? ». C'est pourquoi elle se range par déclencheur : découpée par action, elle ne servirait qu'à cette crise-ci.</p>`;

  if(vides) h += `<div class="note"><strong>${vides} déclencheurs n'ont pas d'onglet dans le cockpit.</strong> Ils se sont joués à l'instinct, dans les premières heures et au téléphone, et rien n'en a été consigné. Ce sont ceux qui manqueront le plus au plan : l'étoile ☆ « point de doctrine » est le seul moyen d'en garder quelque chose.</div>`;

  h += `<div class="carte">` + DECLENCHEURS.map(d => {
    const m = d.m ? (etat.missions || []).find(x => x.id === d.m) : null;
    return `<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--trait)">
      <div style="font-family:var(--display);font-weight:700;font-size:14.5px">${esc(d.q)}</div>
      <div style="font-size:13px;margin:4px 0 5px">${esc(d.s)}</div>
      <div style="font-size:12.5px;color:${m ? 'var(--texte-2)' : 'var(--braise)'}">${m
        ? 'Matière disponible — mission « ' + esc(m.titre) + ' »'
        : "Aucune matière dans le cockpit : ce déclencheur n'a jamais été formalisé."}</div>
    </div>`;
  }).join('') + `</div>`;

  h += `<h2 style="margin-top:26px">Points de doctrine retenus <span class="cpt-h">${doc.length}</span></h2>
  <p class="sous-h">Les règles apprises dans cette crise, qui devront figurer dans une fiche. Elles se rattacheront à leur déclencheur au moment de la rédaction.</p><div class="carte">`;
  if(!doc.length){
    h += `<p class="vide">Aucun point de doctrine retenu pour l'instant. Chaque fois qu'une règle se dégage — « aucun enlèvement sans lieu de livraison nommé », « on recense, on n'affecte pas » — l'étoile ☆ de l'entrée permet de la mettre de côté.</p>`;
  }else{
    h += `<ul class="fil">` + doc.map(x => `<li>
      <div class="h">${frdate(x.date)}</div>
      <div class="c"><div class="t">${esc(x.titre)}</div>
      ${x.note ? `<div class="d">${esc(x.note)}</div>` : ''}
      <div class="s">${esc(x.source)}${x.par ? ' · retenu par ' + esc(x.par) : ''}</div></div></li>`).join('') + `</ul>`;
  }
  return h + `</div>`;
}

      <div class="d"><div class="sub">Édité le ${frdateL(aujourdhui())}</div></div></div>
    <h1 class="ttl">Fiches pour le plan SSE</h1>
    <div class="ss">Projets de fiches extraits du cockpit de crise. Les fiches mission sont préremplies par ce qui a réellement été fait ; les fiches réflexes restent à rédiger, rangées par déclencheur pour qu'elles servent à toute crise et non à celle-ci seulement.</div>`
    + corps + decl + doctrine
    + `<div class="pied">Document de travail. Ce qui figure ici a été écrit pendant la crise, sous contrainte de temps : à relire et à trancher à froid avant intégration au plan SSE de la CPTS Pau Béarn.</div>`);
}

/* --- ce qu'une remontée de terrain est devenue --------------
   Il n'y a plus de registre « Remontées terrain » : une remontée
   est une entrée de main courante venue du dehors, et rien
   d'autre. C'était déjà le cas dans les faits — la main courante
   en portait trente et une quand le registre en comptait trois,
   et l'une recopiait l'autre. Ce qui la reconnaît tient à un seul
   champ, sa source : une décision prise entre nous n'en a pas.
   C'est ce qui se compte pour le bilan ACI et le dialogue de
   gestion. */
const venuesDuDehors = () =>
  (etat.courante || []).filter(o => String(o.source || '').trim());

/* =========================================================
   RÉHYDRATATION À DOMICILE

   Trois cartes, dans l'ordre où on les lit : la procédure, les
   officines qui délivrent, les personnes signalées. Le pilotage
   est ailleurs — dans « Missions & organigramme » — et cet espace
   ne fait que ce qu'il dit : recenser, signaler, affecter.

   La cartographie est reprise du cockpit incendies, où elle sert
   à situer les cabinets de médecins. Ici elle situe les officines
   et les personnes signalées, et répond à la seule question qu'on
   se pose devant une commune écrite dans une colonne : quelle
   pharmacie partenaire est la plus près de chez cette personne.

   Deux services publics, ni l'un ni l'autre avec une clé :
   — la Base Adresse Nationale (api-adresse.data.gouv.fr) pour
     transformer « 12 rue Carnot, Pau » en un point ;
   — les fonds de carte d'OpenStreetMap, affichés par Leaflet.

   Seules les adresses d'officine partent au géocodage, et la
   commune des personnes signalées — jamais leur adresse, qui
   n'est pas demandée, ni leurs initiales, ni leur motif.

   Si l'un des deux services est injoignable — poste hors ligne,
   réseau filtré, pare-feu d'un cabinet — la carte le dit et
   s'efface : les listes restent entières, les adresses restent
   lisibles sur chaque fiche et le lien « Itinéraire » continue
   d'ouvrir l'application de cartes du téléphone. Rien de cet
   espace ne dépend de ce qui suit.
   ========================================================= */

/* Une adresse touchée sur un téléphone doit ouvrir la carte, pas
   une page. Cette forme d'URL est celle que les deux systèmes
   reprennent : iOS propose Plans, Android ouvre Maps, et sur un
   ordinateur elle s'affiche dans le navigateur. */
function lienCarte(adresse, commune){
  const a = String(adresse || '').trim();
  const c = String(commune || '').trim();
  const q = (c && a.toLowerCase().indexOf(c.toLowerCase()) < 0 ? a + ', ' + c : a)
    + (a.toLowerCase().indexOf('france') < 0 ? ', France' : '');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

const CARTO_CSS  = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
const CARTO_JS   = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
const CARTO_BAN  = 'https://api-adresse.data.gouv.fr/search/?limit=1&q=';
/* Pau, à défaut de tout point : la carte s'ouvre sur le territoire
   plutôt que sur l'océan. */
const CARTO_CENTRE = [43.2951, -0.3708];

/* Les teintes des officines reprennent celles de leurs étiquettes :
   ce qui se lit sur la fiche se retrouve sur la carte. */
const CARTO_PH = {'Partenaire':'#2F7D62', 'Contactée':'#E8A33D',
                  'À contacter':'#0B4FA8', 'Ne participe pas':'#9AA8BC'};

/* Côté personnes signalées, la couleur ne dit pas un statut
   administratif mais où en est la personne : orange tant que
   personne n'a été désigné pour passer chez elle, bleu quand un
   cabinet l'a été, vert quand le passage a eu lieu, gris quand la
   demande est close sans suite. */
const CARTO_PAT = {attente:'#E2761B', pose:'#0B4FA8', assure:'#2F7D62', clos:'#9AA8BC'};

/* L'officine ne se pose pas en pastille mais en croix : sur la
   carte des personnes signalées, les deux populations se
   distinguent à la forme, pas à la nuance. */
const croixSVG = (teinte, t) => `<svg viewBox="0 0 24 24" width="${t}" height="${t}" aria-hidden="true">
  <path d="M9.2 2.4h5.6v6.8h6.8v5.6h-6.8v6.8H9.2v-6.8H2.4V9.2h6.8z" fill="${teinte}"
    stroke="#fff" stroke-width="1.5" stroke-linejoin="round"></path>
</svg>`;

/* Un cabinet infirmier nommé sur la fiche, c'est une personne
   affectée : c'est le seul témoin, et il vaut mieux qu'un statut
   qu'on oublie de changer. */
const estAffecte = o => !!String(o.idelNom || '').trim();
const RH_ETAT = o => o.statut === 'Sans suite' ? 'clos'
  : o.statut === 'Passage assuré' ? 'assure'
  : estAffecte(o) ? 'pose' : 'attente';
/* Ce qui attend encore quelqu'un pour passer. */
const enAttenteIdel = o => !estAffecte(o) && o.statut !== 'Sans suite';

let leafletEtat = 'absent';   // absent | charge | pret | echec
const cartesVives = {};       // les cartes montées, par identifiant de toile
const cartoDonnees = {};      // les points à poser, par identifiant de toile
const cartoPliee = {};        // les cartes repliées à la main

/* L'adresse telle qu'on la soumet : elle sert aussi de témoin.
   Tant qu'elle n'a pas changé, le point calculé reste valable. */
function cleGeo(o){
  const a = String(o.adresse || '').trim();
  const c = String(o.commune || '').trim();
  if(!a && !c) return '';
  const q = a && c && a.toLowerCase().indexOf(c.toLowerCase()) < 0 ? a + ', ' + c : (a || c);
  return q.replace(/\s+/g, ' ');
}
/* Une personne n'est jamais située à son adresse : seule sa commune
   part au service d'adresses, et c'est sur le bourg qu'elle se pose.
   Le registre porte de quoi la rappeler — il n'a pas à la faire
   sortir du cockpit pour autant, et la commune suffit largement à
   dire quelle officine est la plus près. */
const cleGeoPat = o => String(o.commune || '').trim().replace(/\s+/g, ' ');

const nombreOuNul = v => typeof v === 'number' && isFinite(v) ? v
  : (v !== '' && v !== null && v !== undefined && isFinite(Number(v)) ? Number(v) : null);

/* Ce que la carte a besoin de savoir de chaque officine — rien de
   plus que ce qui s'affiche dans la bulle. `second` marque celles
   qui ne sont pas la vedette de la carte : sur la carte des
   personnes signalées, elles sont le décor, et ne se comptent pas
   à la place des personnes. */
function pointsPharmacies(ph, second){
  return (ph || []).map(p => {
    const cle = cleGeo(p);
    const lat = nombreOuNul(p.lat), lon = nombreOuNul(p.lon);
    /* Un point calculé sur une adresse qui a changé depuis ne vaut
       plus rien : on ne l'affiche pas, il se recalculera. */
    const bon = lat !== null && lon !== null && p.geoCle === cle;
    return {
      id: p.id, nom: p.nom || 'Officine sans nom', statut: p.statut || 'À contacter',
      lieu: [p.interlocuteur, p.commune].filter(Boolean).join(' · '),
      adresse: p.adresse || '', commune: p.commune || '', tel: p.tel || '',
      telInterlocuteur: p.telInterlocuteur || '', interlocuteur: p.interlocuteur || '',
      stock: p.stock || '', horaires: p.horaires || '',
      couleur: CARTO_PH[p.statut] || CARTO_PH['À contacter'],
      lat: bon ? lat : null, lon: bon ? lon : null,
      approx: p.geoPrecision === 'municipality' || p.geoPrecision === 'locality',
      cle, echec: !!cle && p.geoEchec === cle,
      forme:'ph', croix:true, second:!!second
    };
  });
}

/* Deux personnes d'une même commune tomberaient sur le même point
   et se recouvriraient. On les écarte en spirale autour du bourg —
   angle d'or, pour que la spirale ne se recroise pas. Le rang se
   prend sur l'identifiant, jamais sur l'ordre de la liste : trier
   le registre ne doit pas faire sauter les points d'une place à
   l'autre. */
function pointsPatients(pat, vivier){
  const rangs = {};
  (pat || []).forEach(o => {
    const c = cleGeoPat(o); if(!c) return;
    (rangs[c] = rangs[c] || []).push(o.id);
  });
  for(const c in rangs) rangs[c].sort();

  return (pat || []).map(o => {
    const cle = cleGeoPat(o);
    const lat = nombreOuNul(o.lat), lon = nombreOuNul(o.lon);
    const bon = lat !== null && lon !== null && o.geoCle === cle;
    let dlat = 0, dlon = 0;
    if(bon){
      const n = (rangs[cle] || []).indexOf(o.id);
      if(n > 0){
        const ang = n * 2.399963;              // angle d'or, en radians
        const r = 0.0042 * Math.sqrt(n);       // ~450 m au premier écart
        dlat = r * Math.cos(ang);
        dlon = r * Math.sin(ang) / Math.max(.2, Math.cos(lat * Math.PI / 180));
      }
    }
    /* L'officine la plus proche ne se cherche que pour qui attend
       encore : une demande close sans suite n'a rien à se voir
       proposer. */
    const proche = bon && enAttenteIdel(o) ? plusProche(lat, lon, vivier) : null;
    return {
      id: o.id, nom: o.nom || 'Personne signalée', statut: o.statut || 'À orienter',
      lieu: [o.motif, o.commune].filter(Boolean).join(' · '),
      age: o.age || '', idelNom: o.idelNom || '', decNom: o.decNom || '',
      rappel: !estAffecte(o) && o.idel === 'Non',
      couleur: CARTO_PAT[RH_ETAT(o)], proche,
      lat: bon ? lat + dlat : null, lon: bon ? lon + dlon : null,
      cle, echec: !!cle && o.geoEchec === cle,
      forme:'pat'
    };
  });
}

/* --- la distance ---------------------------------------
   Haversine : la distance à vol d'oiseau. Ce n'est pas un temps de
   trajet — en piémont, une vallée peut doubler la route — mais pour
   ranger des officines du plus proche au plus loin d'une commune,
   elle suffit, et elle ne dépend d'aucun service. */
function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2) ** 2
    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

const fmtKm = d => d === null || d === undefined ? ''
  : d < 1 ? 'moins d\'1 km' : d.toFixed(d < 10 ? 1 : 0).replace('.', ',') + ' km';

/* L'officine partenaire la plus près d'un point, et à quelle
   distance. `vivier` est une liste de points déjà situés. */
function plusProche(lat, lon, vivier){
  let gagnant = null, mieux = Infinity;
  (vivier || []).forEach(m => {
    if(m.lat === null || m.lon === null) return;
    const d = distanceKm(lat, lon, m.lat, m.lon);
    if(d < mieux){ mieux = d; gagnant = m; }
  });
  return gagnant ? {nom: gagnant.nom, id: gagnant.id, km: mieux} : null;
}

/* --- le géocodage -------------------------------------
   En file, une adresse à la fois, un souffle entre deux : le
   service est public et gratuit, on ne le mitraille pas. Ce qui
   revient s'écrit sur la fiche et part au serveur en une seule fois
   à la fin — pas un enregistrement par adresse.

   Deux registres à situer, et pas de la même façon : l'officine
   part avec sa rue, la personne signalée part avec sa seule
   commune, et le service est prié de ne chercher qu'une commune.
   C'est la ligne de partage à ne pas franchir. */
const A_SITUER = [
  {k:'pharmacies', cle: cleGeo,    type:'',             quoi:'officine située', quoiP:'officines situées'},
  {k:'rehyd',      cle: cleGeoPat, type:'municipality', quoi:'personne située', quoiP:'personnes situées'}
];

let geoEnCours = false;
async function geocoderFiches(){
  if(geoEnCours || leafletEtat === 'echec') return;
  if(navigator.onLine === false) return;

  const files = A_SITUER.map(r => ({r, l: (etat[r.k] || []).filter(o => {
    const cle = r.cle(o);
    return cle && o.geoCle !== cle && o.geoEchec !== cle;
  })})).filter(x => x.l.length);
  if(!files.length) return;

  geoEnCours = true;
  let touche = false, coupure = false;
  const comptes = {};

  for(const {r, l} of files){
    if(coupure) break;
    for(const o of l.slice(0, 30)){
      const cle = r.cle(o);
      let d = null;
      try{
        const r2 = await fetch(CARTO_BAN + encodeURIComponent(cle)
          + (r.type ? '&type=' + r.type : ''));
        if(!r2.ok) throw new Error(r2.status);
        d = await r2.json();
      }catch(e){
        /* Service injoignable : on s'arrête là sans rien marquer, la
           prochaine ouverture de l'espace réessaiera. */
        coupure = true;
        break;
      }
      const f = d && d.features && d.features[0];
      const c = f && f.geometry && f.geometry.coordinates;
      /* Le service répond toujours quelque chose : sous un certain
         score, ce qu'il propose n'a plus grand-chose à voir avec ce
         qu'on lui a demandé. Mieux vaut pas de point qu'une officine
         posée dans la mauvaise vallée. */
      const sur = f && (f.properties || {}).score >= 0.35;
      if(c && c.length === 2 && sur){
        o.lon = c[0]; o.lat = c[1]; o.geoCle = cle;
        o.geoPrecision = (f.properties || {}).type || '';
        delete o.geoEchec;
        comptes[r.k] = (comptes[r.k] || 0) + 1;
      }else{
        /* Adresse que le service ne reconnaît pas : on le note pour
           ne pas la redemander à chaque ouverture, et la fiche le
           dira — c'est à la coordination de corriger l'adresse. */
        o.geoEchec = cle;
      }
      touche = true;
      await new Promise(r3 => setTimeout(r3, 320));
    }
  }
  geoEnCours = false;

  if(!touche) return;
  await sauver();
  rendre();
  const dit = A_SITUER.filter(r => comptes[r.k])
    .map(r => `${comptes[r.k]} ${comptes[r.k] > 1 ? r.quoiP : r.quoi}`).join(' et ');
  if(dit) toast(dit + ' sur la carte');
}

/* --- Leaflet, chargé au moment où l'on en a besoin ------
   La bibliothèque ne part chercher son fond de carte que si une
   carte est effectivement à l'écran : ouvrir le cockpit ne coûte
   rien de plus qu'avant. */
function chargerLeaflet(){
  if(leafletEtat !== 'absent') return;
  leafletEtat = 'charge';
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = CARTO_CSS;
  document.head.appendChild(css);
  const js = document.createElement('script');
  js.src = CARTO_JS;
  js.onload  = () => { leafletEtat = typeof L === 'undefined' ? 'echec' : 'pret'; monterCartes(); };
  js.onerror = () => { leafletEtat = 'echec'; monterCartes(); };
  document.head.appendChild(js);
}

/* Le cockpit reconstruit sa page entière à chaque rendu. La carte
   écrit donc un hôte vide, et la carte — bâtie une fois pour
   toutes — vient s'y replacer. Celle dont l'hôte a définitivement
   disparu se démonte, sinon Leaflet garderait ses écouteurs sur un
   élément que plus personne ne regarde. */
function monterCartes(){
  for(const id in cartesVives){
    if(document.getElementById('hote-' + id)) continue;
    try{ cartesVives[id].remove(); }catch(e){}
    delete cartesVives[id];
  }
  const hotes = [].slice.call(document.querySelectorAll('.carto-hote'));
  if(!hotes.length) return;

  geocoderFiches();

  if(leafletEtat === 'echec'){
    hotes.forEach(t => { t.innerHTML = `<div class="attente">Le fond de carte n'a pas pu être chargé — poste hors ligne, ou réseau qui n'autorise pas openstreetmap.org. Les adresses restent lisibles sur chaque fiche, et le lien « Itinéraire » ouvre l'application de cartes du téléphone.</div>`; });
    return;
  }
  if(leafletEtat !== 'pret'){ chargerLeaflet(); return; }
  hotes.forEach(dessinerCarte);
}

function dessinerCarte(hote){
  const idc = hote.dataset.carte;
  const pts = (cartoDonnees[idc] || []).filter(p => p.lat !== null && p.lon !== null);
  let carte = cartesVives[idc];

  if(carte){
    /* La carte existe déjà : on la replace dans son hôte neuf plutôt
       que d'en rebâtir une. Sans cela, le moindre rendu de la page
       rejetterait la vue à son cadrage d'origine et refermerait la
       bulle qu'on venait d'ouvrir. */
    if(carte._toile.parentNode !== hote) hote.appendChild(carte._toile);
  }else{
    const toile = document.createElement('div');
    toile.className = 'carto-toile';
    hote.appendChild(toile);
    /* La molette ne zoome pas : sur une page qui défile, une carte
       qui capture le défilement se traverse à la souris comme un
       piège. Le zoom se fait aux boutons ou à deux doigts. */
    carte = L.map(toile, {scrollWheelZoom:false}).setView(CARTO_CENTRE, 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:18,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(carte);
    carte._couche = L.layerGroup().addTo(carte);
    carte._toile = toile;
    cartesVives[idc] = carte;
  }

  /* Les points ne se redessinent que s'ils ont changé : le reste du
     temps, le re-rendu de la page ne touche pas à la carte. */
  const signe = pts.map(p =>
    [p.id, p.lat, p.lon, p.statut, p.approx, p.forme, p.croix, p.couleur, p.idelNom].join(':')).join('|');
  if(signe !== carte._signe){
    carte._couche.clearLayers();
    carte._reperes = {};
    pts.forEach(p => {
      const teinte = p.couleur || '#0B4FA8';
      /* Deux formes, pour que les deux populations ne se confondent
         pas quand elles partagent la même carte : la personne
         signalée est un disque plein, l'officine une croix. */
      let r;
      if(p.croix){
        r = L.marker([p.lat, p.lon], {
          icon: L.divIcon({className:'carto-croix', html:croixSVG(teinte, 24),
            iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12]}),
          title: p.nom
        }).addTo(carte._couche);
      }else{
        r = L.circleMarker([p.lat, p.lon], {radius:9, weight:3, color:'#fff', fillColor:teinte,
          /* Un point posé sur la commune faute d'adresse exacte se
             montre pâle : il dit « quelque part par ici », pas « là ». */
          fillOpacity: p.approx ? .42 : .95}).addTo(carte._couche);
      }
      r.bindPopup(bulleCarte(p));
      carte._reperes[p.id] = r;
    });
    /* Le cadrage se refait quand la population de points change —
       une officine qui vient d'être située doit entrer dans le
       cadre. */
    if(pts.length){
      const b = L.latLngBounds(pts.map(p => [p.lat, p.lon]));
      carte.fitBounds(b, {padding:[30,30], maxZoom: pts.length === 1 ? 15 : 14});
    }
    carte._signe = signe;
  }

  /* Le conteneur vient d'être replacé : Leaflet l'avait mesuré avant
     que la page ne prenne sa largeur définitive. */
  setTimeout(() => { try{ carte.invalidateSize(); }catch(e){} }, 80);
}

/* La bulle rend ce dont on a besoin le téléphone à la main : qui
   c'est, où ça en est, le numéro qui compose, l'itinéraire. */
const bulleCarte = p => p.forme === 'pat' ? bullePatient(p) : bullePharmacie(p);

function bullePharmacie(p){
  return `<div class="carto-popup">
    <div class="n">${esc(p.nom)}</div>
    ${p.lieu ? `<div class="l">${esc(p.lieu)}</div>` : ''}
    <div class="l">${esc(p.statut)}${p.approx ? " — située à la commune, l'adresse exacte n'a pas été retrouvée" : ''}</div>
    ${p.stock ? `<div class="l">Tient : ${esc(p.stock)}</div>` : ''}
    ${p.horaires ? `<div class="l">${esc(p.horaires)}</div>` : ''}
    ${p.tel ? `<a href="${esc(telLien(p.tel))}">Appeler l'officine — ${esc(p.tel)}</a>` : ''}
    ${p.telInterlocuteur ? `<a href="${esc(telLien(p.telInterlocuteur))}">Ligne directe${
      p.interlocuteur ? ` de ${esc(p.interlocuteur)}` : ''} — ${esc(p.telInterlocuteur)}</a>` : ''}
    ${p.adresse ? `<a href="${esc(lienCarte(p.adresse, p.commune))}" target="_blank" rel="noopener">Itinéraire ↗</a>` : ''}
    <button onclick="ouvrirEdition('pharmacies','${p.id}')">Ouvrir la fiche</button>
  </div>`;
}

/* La bulle d'une personne signalée répond à la question qu'on se
   pose en la regardant sur la carte : quelle officine partenaire
   est la plus près d'elle, et à quelle distance. Le nom est donné
   là, avec de quoi désigner le cabinet sans quitter la carte. */
function bullePatient(p){
  return `<div class="carto-popup">
    <div class="n">${esc(p.nom)}${p.rappel ? `<span class="urg">Médecin à rappeler</span>` : ''}</div>
    ${p.lieu ? `<div class="l">${esc(p.lieu)}${p.age ? ` · ${esc(p.age)} ans` : ''}</div>` : ''}
    <div class="l">${esc(p.statut)}</div>
    ${p.idelNom ? `<div class="l">Cabinet IDEL : ${esc(p.idelNom)}</div>` : ''}
    ${p.proche ? `<div class="pres"><span class="k">Pharmacie partenaire la plus proche</span>
        ${esc(p.proche.nom)} — ${esc(fmtKm(p.proche.km))} à vol d'oiseau</div>` : ''}
    <button onclick="fermerBulles();ouvrirIdel('${p.id}')">${
      p.idelNom ? 'Changer le cabinet IDEL' : 'Désigner le cabinet IDEL'}</button>
  </div>`;
}

/* La fenêtre d'affectation s'ouvre par-dessus la carte : la bulle
   dessous doit se refermer, sinon elle reste ouverte derrière et se
   retrouve là au retour, sur une personne déjà traitée. */
function fermerBulles(){
  for(const id in cartesVives){ try{ cartesVives[id].closePopup(); }catch(e){} }
}

/* Le bloc tel qu'il s'écrit dans une carte. Les points sont déposés
   au passage dans cartoDonnees : c'est la carte montée après le
   rendu qui viendra les y chercher. */
function blocCarte(idc, pts, o){
  cartoDonnees[idc] = pts;
  const vedettes = pts.filter(p => !p.second);   // ce que la carte est censée montrer
  const situes = pts.filter(p => p.lat !== null);
  const attente = vedettes.filter(p => p.lat === null && p.cle && !p.echec).length;
  const plie = !!cartoPliee[idc];
  const court = o.court ? ' court' : '';

  let corps;
  if(plie) corps = '';
  else if(situes.length || attente) corps = `<div class="carto-hote${court}" id="hote-${idc}" data-carte="${idc}"></div>`;
  else corps = `<div class="carto-vide${court}">${esc(vedettes.length ? o.videSansPoint : o.videSansFiche)}</div>`;

  /* La légende ne montre que ce qui est effectivement posé : une
     carte où personne n'est encore affecté n'a pas à porter une
     pastille bleue qui ne correspond à rien. La forme compte autant
     que la teinte : une personne est un disque, une officine une
     croix, et la légende ne montre l'un ou l'autre que si la carte
     le porte vraiment. */
  const forme = p => (p.couleur || '#0B4FA8') + (p.croix ? '|croix' : '|disque');
  const cles = new Set(situes.map(forme));
  const legende = (o.legende || []).filter(x => cles.has(forme({couleur:x.c, croix:x.croix})));

  return `<div class="carto">
    <div class="tete-c">
      <div class="t">${esc(o.titre)}</div>
      ${o.sous ? `<p class="s">${o.sous}</p>` : '<span class="ecart"></span>'}
      <button class="plier" onclick="plierCarte('${idc}')">${plie ? 'Afficher la carte' : 'Replier'}</button>
    </div>
    ${corps}
    ${plie || !situes.length ? '' : `<div class="legende">
      <span><strong>${vedettes.filter(p => p.lat !== null).length}</strong> ${esc(o.compte)}</span>
      ${legende.map(x => `<span>${x.croix
        ? `<i class="croix">${croixSVG(x.c, 15)}</i>`
        : `<i style="background:${x.c}"></i>`}${esc(x.l)}</span>`).join('')}
      ${vedettes.some(p => p.lat !== null && p.approx) ? `<span><i class="approx" style="background:#0B4FA8"></i>Situé à la commune seulement</span>` : ''}
    </div>`}
    ${plie || !o.alerte ? '' : `<div class="manquants">${o.alerte}</div>`}
    ${plie || (!situes.length && !attente) ? '' : `<div class="source">${esc(o.source)} Fond de carte OpenStreetMap, adresses situées par la Base Adresse Nationale — deux services publics, sans compte ni clé.</div>`}
  </div>`;
}

/* Ce que la carte des officines signale d'incomplet, sous elle. */
function alertePharmacies(pts){
  const attente = pts.filter(p => p.lat === null && p.cle && !p.echec).length;
  const introuvables = pts.filter(p => p.echec);
  const sansAdresse = pts.filter(p => !p.cle);
  if(!attente && !introuvables.length && !sansAdresse.length) return '';
  return [
    attente ? `${attente} adresse${attente > 1 ? 's sont' : ' est'} en cours de localisation.` : '',
    introuvables.length ? `<strong>${introuvables.length}</strong> adresse${introuvables.length > 1 ? 's n\'ont' : ' n\'a'} pas été retrouvée${introuvables.length > 1 ? 's' : ''} : ${introuvables.map(p => esc(p.nom)).join(', ')} — à corriger sur la fiche.` : '',
    sansAdresse.length ? `${sansAdresse.length} officine${sansAdresse.length > 1 ? 's sont' : ' est'} sans adresse ni commune et ne peu${sansAdresse.length > 1 ? 'vent' : 't'} pas être située${sansAdresse.length > 1 ? 's' : ''}.` : ''
  ].filter(Boolean).join(' ');
}

/* Et ce que signale la carte des personnes : ici le manque est
   toujours le même — la commune n'a pas été renseignée au recueil,
   ou elle n'existe pas sous ce nom. */
function alertePatients(pts){
  const attente = pts.filter(p => p.lat === null && p.cle && !p.echec).length;
  const introuvables = pts.filter(p => p.echec);
  const sansCommune = pts.filter(p => !p.cle);
  if(!attente && !introuvables.length && !sansCommune.length) return '';
  return [
    attente ? `${attente} commune${attente > 1 ? 's sont' : ' est'} en cours de localisation.` : '',
    introuvables.length ? `<strong>${introuvables.length}</strong> commune${introuvables.length > 1 ? 's n\'ont' : ' n\'a'} pas été retrouvée${introuvables.length > 1 ? 's' : ''} : ${introuvables.map(p => esc(p.nom)).join(', ')} — vérifier l\'orthographe sur la fiche.` : '',
    sansCommune.length ? `${sansCommune.length} personne${sansCommune.length > 1 ? 's sont' : ' est'} sans commune au registre et ne peu${sansCommune.length > 1 ? 'vent' : 't'} pas être située${sansCommune.length > 1 ? 's' : ''} : c\'est la question à poser au prochain appel.` : ''
  ].filter(Boolean).join(' ');
}

function plierCarte(idc){ cartoPliee[idc] = !cartoPliee[idc]; rendre(); }

/* Depuis une fiche du registre : la carte se déplie s'il le faut,
   remonte sous les yeux, se centre sur le point et ouvre sa bulle.
   C'est le geste qu'on fait quand quelqu'un demande « et elle, elle
   est où ? ». */
function situerSur(idc, id, absent){
  if(cartoPliee[idc]){ cartoPliee[idc] = false; rendre(); setTimeout(() => situerSur(idc, id, absent), 500); return; }
  const carte = cartesVives[idc];
  const rep = carte && carte._reperes ? carte._reperes[id] : null;
  if(!rep){ toast(absent); return; }
  try{ carte.getContainer().scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
  carte.setView(rep.getLatLng(), 15);
  rep.openPopup();
}
function situerPharma(id){
  situerSur('carte-pharmacies', id, "Cette officine n'est pas encore située sur la carte.");
}
function situerPatient(id){
  situerSur('carte-patients', id, "Cette personne n'est pas encore située sur la carte : sa commune manque, ou elle n'a pas été retrouvée.");
}

/* =========================================================
   L'ESPACE, EN TROIS MODULES

   Le palier fait choisir : la procédure, les officines, les
   personnes signalées. Chaque carte dit déjà où en est son module —
   on entre en connaissance de cause, et on ne défile pas à travers
   deux écrans pour atteindre le troisième.
   ========================================================= */

const telLien = t => `tel:${String(t || '').replace(/[^0-9+]/g,'')}`;

/* '' = le palier. Le module ouvert tient d'un rendu à l'autre :
   revenir à l'onglet, c'est retrouver l'écran qu'on y a laissé. */
let moduleRehyd = '';
function allerModuleRehyd(m){
  moduleRehyd = m; procOuverte = null; brouillonProc = null;
  rendre(); window.scrollTo(0,0);
}

function vueRehydratation(){
  const ph = etat.pharmacies || [], pat = etat.rehyd || [];
  if(moduleRehyd === 'procedure')  return retourRehyd() + carteProcedure();
  if(moduleRehyd === 'pharmacies') return retourRehyd() + cartePharmacies(ph);
  if(moduleRehyd === 'patients')   return retourRehyd() + cartePatients(pat, ph);
  if(moduleRehyd === 'medecins')   return retourRehyd() + carteMedecins();
  return palierRehyd(ph, pat);
}

const retourRehyd = () =>

/* Le palier : ce que fait le dispositif, qui le pilote, et les

   qu'on vient chercher — ce qui reste à appeler, ce qui attend

  const aFaire = ph.filter(p => !p.statut || p.statut === 'À contacter').length;

  <p class="chapo">Faire parvenir de quoi se réhydrater aux personnes qui ne peuvent pas aller le chercher, et faire passer quelqu'un chez elles. Le médecin repère la personne à risque dans sa patientèle et la signale ; la CPTS tient la liste des officines qui délivrent, désigne le cabinet infirmier qui passera, et suit ce qui a effectivement été fait.</p>
  <div class="barre-h">
    <span class="cpt-h">${pil ? `Pilote : ${esc(pil)}` : 'Pilote à désigner'}${m && m.statut ? ` · ${esc(m.statut)}` : ''}</span>
    ${m ? `<button class="btn sec" onclick="voirFiche('${m.id}')">Fiche mission</button>` : ''}
  </div>

  <div class="modules">
    <button class="module" onclick="allerModuleRehyd('procedure')">
      <div class="titre-m">Procédures en vigueur</div>
      <p class="sous-m">Les deux procédures arrêtées par la CPTS, dans leur déroulé complet : celle des demandes qui partent d'un médecin de ville, celle des demandes qui partent de SOS Médecins. Chacune se lit étape par étape, avec ce qu'on fait à chaque réponse. C'est la page à lire avant de décrocher, et celle qu'on donne à un professionnel qui demande la marche à suivre.</p>
      <div class="chiffres">
        <div><strong>${proc}</strong> procédures</div>
        <div><strong>${lesProc().reduce((n,p) => n + p.etapes.length, 0)}</strong> étapes détaillées</div>
      </div>
      <div class="entrer">Ouvrir le module →</div>
    </button>

    <button class="module" onclick="allerModuleRehyd('pharmacies')">
      <div class="titre-m">Recensement des pharmacies partenaires</div>
      <p class="sous-m">Les officines du territoire prêtes à délivrer les solutions de réhydratation orale, ce qu'elles tiennent et qui y décroche. La carte les pose sur le territoire : c'est elle qui montre les secteurs où il n'y a encore personne, et elle qui dit quelle officine est la plus proche d'une personne signalée.</p>
      <div class="chiffres">
        <div><strong>${parts}</strong> partenaires</div>
        <div><strong>${ph.length}</strong> officines recensées</div>
        ${aFaire ? `<div><strong class="alerte">${aFaire}</strong> à appeler</div>` : ''}
      </div>
      <div class="entrer">Ouvrir le module →</div>
    </button>

    <button class="module" onclick="allerModuleRehyd('patients')">
      <div class="titre-m">Patients signalés / orientés</div>
      <p class="sous-m">Chaque personne signalée par un médecin du territoire, et ce qu'elle est devenue. Le registre est tenu en initiales, sans élément clinique au-delà du motif. La carte les situe à la commune, avec les officines autour d'elles, et permet de désigner le cabinet infirmier sans quitter l'écran.</p>
      <div class="chiffres">
        <div><strong>${pat.length}</strong> personnes signalées</div>
        ${attente ? `<div><strong class="alerte">${attente}</strong> sans cabinet IDEL</div>`
                  : `<div><strong>${pat.filter(estAffecte).length}</strong> cabinets désignés</div>`}
      </div>
      <div class="entrer">Ouvrir le module →</div>
    </button>

    <button class="module" onclick="allerModuleRehyd('medecins')">
      <div class="titre-m">Liste des médecins qui ont orienté</div>
      <p class="sous-m">Les médecins du territoire qui ont signalé au moins une personne, avec leur adresse et leur téléphone. La liste ne se saisit pas : un médecin s'y ajoute de lui-même au premier signalement qu'il fait, et c'est elle qu'on ouvre pour le rappeler quand le circuit se bloque.</p>
      <div class="chiffres">
        <div><strong>${med.length}</strong> médecin${med.length>1?'s':''} déclarant${med.length>1?'s':''}</div>
        ${med.filter(m => !m.tel).length
          ? `<div><strong class="alerte">${med.filter(m => !m.tel).length}</strong> sans téléphone noté</div>`
          : `<div><strong>${med.reduce((n,m) => n + m.n, 0)}</strong> signalements</div>`}
      </div>
      <div class="entrer">Ouvrir le module →</div>
