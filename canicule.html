.stocks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));margin-bottom:20px}
.stock{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--ambre);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:9px}
.stock.confirme{border-top-color:var(--stable)}
.stock.ecarte{border-top-color:var(--trait);background:#FAFBFD}
.stock .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;color:var(--encre)}
.stock .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.stock .bl{font-size:13.5px;line-height:1.45}
.stock .horaires{white-space:pre-line;font-size:13.5px;line-height:1.45}
.stock .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:8px 10px}
/* Ce que le médecin a dit en plus ne peut pas se lire comme une
   ligne de plus : c'est ce qui fait rappeler, ou ne pas rappeler.
   Il se signale — pastille, gras, filet de braise — et se voit
   avant le reste de la fiche. */
.stock .precise{display:flex;gap:9px;align-items:flex-start;background:#FBEDE9;
  border-left:3px solid var(--braise);border-radius:0 7px 7px 0;padding:9px 11px;
  font-size:13.5px;line-height:1.45;font-weight:600;color:#8A2A1A;white-space:pre-line}
.stock .precise .ic{flex:none;width:19px;height:19px;border-radius:50%;background:var(--braise);
  color:#fff;font-family:var(--display);font-weight:700;font-size:13px;line-height:19px;
  text-align:center;margin-top:1px}
.stock .precise .k{color:var(--braise);opacity:.85;font-weight:400}
.stock .liens{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.stock .liens a{display:inline-flex;align-items:center;min-height:44px;padding:9px 13px;border-radius:8px;text-decoration:none;font-size:14px}
.stock .liens a.tel{background:var(--encre-2);color:#fff;font-weight:600;font-family:var(--display)}
/* Le second numéro se compose après le premier : il se voit, mais
   en creux — jamais deux boutons pleins qui se disputent le doigt. */
.stock .liens a.tel.second{background:var(--carte);color:var(--encre-2);border:1px solid var(--encre-2)}
.stock .liens a.tel{flex-direction:column;align-items:flex-start;justify-content:center}
.stock .liens a.tel small{font-family:var(--corps);font-weight:400;font-size:11px;opacity:.85;line-height:1.2}
.stock .liens a.adr{background:var(--cobalt-clair);color:var(--encre-2);font-size:13px}
.stock .oriente{font-family:var(--mono);font-size:11px;color:var(--stable)}
/* La tête de fiche : le nom, où il exerce, sa réponse. Les deux
   lignes du dessous ne s'écrivent que si elles ont de quoi. */
.stock .tete-m{display:flex;flex-direction:column;gap:3px}
.stock .lieu-m{font-size:13px;color:var(--texte-2);line-height:1.35}
.stock .etiq-m{margin-top:4px}
/* Modifier et retirer, au pied de la fiche, derrière un filet :
   ce sont des gestes de tenue de registre, pas des actions de
   crise — ils ne se disputent pas la place avec le bouton d'appel. */
.stock .pied-m{display:flex;gap:7px;margin-top:2px;padding-top:11px;border-top:1px solid var(--trait)}
.stock .retirer{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-size:12.5px;padding:7px 12px;cursor:pointer;min-height:36px;transition:border-color .15s,color .15s}
.stock .retirer:hover{border-color:var(--encre-2);color:var(--encre-2)}
.stock .retirer.sup:hover{border-color:var(--braise);color:var(--braise)}
/* Tâches de la collecte : des cases à cocher qui se lisent comme
   des étiquettes, cochables d'un doigt depuis la fiche. */
.stock .taches{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.stock .taches button{font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--texte-2);
  border:1px solid var(--trait);border-radius:14px;padding:6px 11px;cursor:pointer;min-height:34px}
.stock .taches button:hover{border-color:var(--encre-2);color:var(--encre-2)}
.stock .taches button.on{background:var(--cobalt-clair);border-color:var(--encre-2);color:var(--encre);font-weight:600}
.stock label.bl select{margin-top:2px}

/* ---------- pool de volontaires ----------
   Une liste, pas une grille de cartes : un volontaire tient sur une
   ligne — qui il est, ce qu'il peut faire — et on parcourt vingt
   noms d'un regard au lieu de faire défiler vingt vignettes. Ce qui
   a été recueilli en plus vient sous le nom, en clair. */
.pool{list-style:none;margin:0 0 20px;padding:0;background:var(--carte);
  border:1px solid var(--trait);border-radius:10px;overflow:hidden}
.pool li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
  padding:13px 16px;border-bottom:1px solid var(--trait)}
.pool li:last-child{border-bottom:none}
.pool li:nth-child(even){background:var(--fond-2,#F9FAFC)}
.pool .qui{flex:1 1 200px;min-width:0}
.pool .qui .n{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--encre);display:block}
.pool .qui .d{font-size:12.5px;color:var(--texte-2);line-height:1.35}
.pool .fait{flex:2 1 260px;display:flex;flex-wrap:wrap;gap:5px}
.pool .fait span{font-size:12px;background:var(--cobalt-clair);color:var(--encre-2);
  border-radius:12px;padding:3px 9px;line-height:1.4}
.pool .fait .rien{background:none;color:var(--texte-2);padding:3px 0;font-style:italic}
/* Le numéro se compose d'un doigt depuis la liste : c'est ce qu'on
   vient y chercher le jour de l'enlèvement. */
.pool .tel{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:6px 13px;
  border-radius:8px;background:var(--encre-2);color:#fff;text-decoration:none;
  font-family:var(--display);font-weight:600;font-size:13.5px;white-space:nowrap}
.pool .muet{flex:none;font-size:12.5px;color:var(--braise);font-style:italic}
.pool .actes{display:flex;gap:7px;margin-left:auto}
/* Les précisions passent sous la ligne, en pleine largeur : elles
   sont libres, souvent longues, et ne doivent pas serrer le nom. */
.pool .prec{flex:1 1 100%;font-size:12.5px;line-height:1.45;color:var(--texte-2);white-space:pre-line}
.pool .retirer{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-size:12.5px;padding:6px 11px;cursor:pointer;min-height:34px;transition:border-color .15s,color .15s}
.pool .retirer:hover{border-color:var(--encre-2);color:var(--encre-2)}
.pool .retirer.sup:hover{border-color:var(--braise);color:var(--braise)}

/* ---------- points de collecte ----------
   Un point de collecte tenu, c'est un fait daté et chiffré : la
   carte le donne d'un coup d'œil, le récapitulatif imprimable le
   détaille ligne à ligne. */
/* Une collecte se lit en une ligne — le lieu, la date, ce qu'elle
   a rapporté — et ne s'ouvre que si l'on veut le détail. Dépliée
   d'office, une seule d'entre elles occupait tout l'écran et
   repoussait les autres, et le registre avec. */
.pcs{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.pc{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--ambre);border-radius:10px;overflow:hidden}
.pc.clos{border-top-color:var(--stable)}
.pc .tete{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;padding:15px 18px;
  background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pc .tete:hover{background:var(--cobalt-pale)}
.pc .tete:focus-visible{outline:2px solid var(--encre-2);outline-offset:-2px}
.pc .tete .id{flex:1;min-width:230px}
.pc .tete .n{display:block;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;color:var(--encre)}
.pc .tete .s{display:block;font-size:13px;color:var(--texte-2);margin-top:3px}
.pc .tete .s strong{color:var(--encre);font-weight:700}
.pc .tete .chev{font-size:11px;color:var(--texte-2)}
/* Le détail reste dans la page même replié : c'est lui que le
   bouton PDF imprime, et un écran plié ne doit pas produire un
   document amputé. */
.pc .corps{display:none;padding:0 18px 17px}
.pc.ouvert .corps{display:block}
@media print{.pc .corps{display:block}.pc .tete .chev{display:none}}
.pc .chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:13px}
.pc .chiffres div{background:var(--surface);border:1px solid var(--trait);border-radius:8px;padding:11px 12px}
.pc .chiffres .v{font-family:var(--display);font-size:23px;font-weight:700;line-height:1;color:var(--encre)}
.pc .chiffres .l{font-size:11.5px;color:var(--texte-2);margin-top:4px;line-height:1.3}
.pc .chiffres .manque .v{color:var(--ambre)}
.pc .synth{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.pc .synth span{font-size:12.5px;background:#DFF0E9;color:#1E5C46;border-radius:14px;padding:5px 11px}
.pc .synth span.conso{background:#FCF0DA;color:#8A5D12}
.pc .synth span b{font-weight:700}
.pc .bl{font-size:13.5px;line-height:1.45;margin-bottom:9px}
.pc .bl .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.pc .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:9px 11px;white-space:pre-line;line-height:1.45;margin-bottom:11px}
.pc .pieces{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pc .piece{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:13px;
  background:var(--cobalt-clair);border-radius:7px;padding:8px 11px}
.pc .piece a{color:var(--encre-2);font-weight:600;text-decoration:none;border-bottom:1px solid var(--trait)}
.pc .piece a:hover{border-color:var(--encre-2)}
.pc .piece .q{font-family:var(--mono);font-size:10.5px;color:var(--texte-2)}
.pc .piece button{background:none;border:0;cursor:pointer;color:var(--texte-2);opacity:.45;font-size:14px;margin-left:auto}
.pc .piece button:hover{opacity:1;color:var(--braise)}
.pc .sanspiece{font-size:12.5px;color:var(--texte-2);border:1px dashed var(--trait);border-radius:7px;padding:9px 11px;margin-bottom:12px}
.pc .actions{margin-top:0}
/* Saisie des lignes de dépôt : un tableau qui se remplit au
   fil des dépôts, une ligne par matériel et par déposant. */
.lgd{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.lgd th{padding:7px 6px;font-size:9.5px}
.lgd td{padding:4px 4px;border-bottom:1px solid var(--trait)}
.lgd input,.lgd select{padding:6px 8px;font-size:13px}
.lgd td.sup{width:34px;text-align:center}
.lgd td.sup button{background:none;border:0;cursor:pointer;color:var(--texte-2);opacity:.4;font-size:14px}
.lgd td.sup button:hover{opacity:1;color:var(--braise)}

/* ---------- bordereau de don ---------- */
#modale.large{max-width:860px}
/* Le bandeau d'un onglet qui n'est pas encore ouvert à l'équipe.
   Hachuré, pour qu'on ne le confonde avec aucun autre message du
   cockpit et qu'on ne l'oublie pas en route. */
.chantier{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--ambre);border-radius:9px;
  padding:12px 15px;margin-bottom:18px;font-size:13px;line-height:1.5;
  background:repeating-linear-gradient(135deg,#FFFBEF,#FFFBEF 11px,#FDF4DC 11px,#FDF4DC 22px)}
.chantier .p{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:#8A6A12;background:var(--carte);border:1px solid var(--ambre);border-radius:4px;
  padding:4px 7px;white-space:nowrap}
.chantier .t{color:var(--encre)}
.chantier code{font-family:var(--mono);font-size:11.5px;background:var(--carte);
  border:1px solid var(--trait);border-radius:3px;padding:1px 4px}
@media(max-width:600px){.chantier{flex-direction:column;gap:8px}}

/* --- Rapports ------------------------------------------
   Quatre cartes d'entrée : chacune dit ce qu'elle contient et où
   elle en est, et s'ouvre sur son écran. */
.rapports{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px;margin-top:6px}
.rapp{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:17px 18px 15px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .12s,box-shadow .12s}
.rapp:hover{border-color:var(--encre-2);box-shadow:0 2px 10px rgba(16,24,32,.07)}
.rapp .n{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--encre)}
.rapp .d{font-size:13px;color:var(--texte-2);line-height:1.45;flex:1}
.rapp .e{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--encre-2);border-top:1px solid var(--trait);padding-top:8px}
.rapp.vierge .e{color:var(--texte-2)}
.retour-r{background:none;border:none;color:var(--encre-2);font-size:13px;cursor:pointer;padding:0;margin-bottom:10px}
.retour-r:hover{text-decoration:underline}

/* L'étoile de marquage : discrète tant que rien n'est retenu,
   pleine et ambrée dès que l'entrée part dans un rapport. */
.ret-b{color:var(--texte-2)}
.ret-b.on{color:var(--ambre);font-weight:700}
.ret-m{display:flex;gap:8px;align-items:flex-start;background:#FFFBEF;border:1px solid var(--ambre);border-radius:0 6px 6px 0;border-left-width:3px;padding:8px 11px;margin-top:9px;font-size:12.5px}
.ret-m .g{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:#8A6A12;white-space:nowrap;padding-top:2px}
.ret-m .t{color:var(--encre)}
.gen-l{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.gen-l label{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--trait);border-radius:7px;padding:9px 11px;cursor:pointer;font-size:13.5px}
.gen-l label:hover{border-color:var(--encre-2)}
.gen-l label.sel{border-color:var(--encre);background:var(--cobalt-clair)}
.gen-l .ou{display:block;font-size:11.5px;color:var(--texte-2);margin-top:2px}
.acte{color:#101820;font-size:13.5px;line-height:1.5}
.acte .ent{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--encre);padding-bottom:9px;margin-bottom:16px}
.acte .ent .org{font-family:var(--display);font-weight:700;font-size:15px;color:var(--encre)}
.acte .ent .sub{font-size:11px;color:var(--texte-2);margin-top:2px}
.acte .ent .d{text-align:right}
.acte .ent .ref{font-family:var(--mono);font-size:11.5px;color:var(--encre)}
.acte .ttl{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;color:var(--encre);text-transform:uppercase}
.acte .ss{font-size:12.5px;color:var(--texte-2);margin:3px 0 14px}
.acte .ctx{font-size:12.5px;background:var(--cobalt-clair);border-left:3px solid var(--encre-2);border-radius:0 6px 6px 0;padding:11px 13px;margin-bottom:16px;text-align:justify}
.acte h2{font-family:var(--display);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--encre-2);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--trait);display:block}
.acte h2::before{display:none}
.acte .lg{display:flex;gap:10px;align-items:baseline;padding:3.5px 0}
.acte .lg .e{flex:0 0 190px;font-size:12px;color:var(--texte-2)}
.acte .lg .v{flex:1;border-bottom:1px dotted #98A6BA;min-height:19px;padding:0 3px}
.acte .lg .v:focus{outline:none;background:#FFFBEF;border-bottom-color:var(--ambre)}
.acte table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.acte th{background:var(--cobalt-clair);border:1px solid var(--trait);padding:6px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--texte-2);text-align:left}
.acte td{border:1px solid var(--trait);padding:7px 8px;height:26px;vertical-align:top}
.acte td:focus{outline:none;background:#FFFBEF}
.acte ol{margin:0;padding-left:20px;font-size:12.5px}
.acte ol li{margin-bottom:5px;text-align:justify}
.acte .cachet{border:1px solid var(--stable);background:#F1F8F5;border-radius:7px;padding:11px 13px;font-size:12.5px;margin-bottom:10px;text-align:justify}
.acte .cachet b{color:#1E5C46}
.acte .sig{display:flex;gap:14px;margin-top:10px}
.acte .sig .b{flex:1;border:1px solid var(--trait);border-radius:7px;padding:10px 12px;min-height:118px}
.acte .sig .b .q{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-2);margin-bottom:6px}
.acte .sig .b .l{font-size:11.5px;color:var(--texte-2);margin-top:7px}
.acte .pied{font-size:11px;color:var(--texte-2);border-top:1px solid var(--trait);margin-top:16px;padding-top:8px;text-align:justify}
@media(max-width:600px){.acte .lg{flex-direction:column;gap:2px}.acte .lg .e{flex:none}.acte .sig{flex-direction:column}}

/* ---------- tableaux ---------- */
.tw{overflow-x:auto;background:var(--carte);border:1px solid var(--trait);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--cobalt-clair);text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);padding:10px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--trait);vertical-align:top}
tr:last-child td{border-bottom:0}
td.act{width:104px;white-space:nowrap}
td.act button{background:none;border:0;cursor:pointer;color:var(--texte-2);opacity:.4;font-size:14px;padding:0 3px}
td.act button:hover{opacity:1;color:var(--braise)}
td.act button[disabled]{opacity:.1;cursor:default;color:var(--texte-2)}

/* ---------- formulaires ---------- */
.form{display:grid;gap:12px}
@media(min-width:760px){.form{grid-template-columns:repeat(2,1fr)}.form .large{grid-column:1/-1}}
label{display:block}
label .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:4px}
input,select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--trait);border-radius:6px;background:#fff;
}
textarea{min-height:74px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ambre);outline-offset:1px;border-color:var(--ambre)}
/* Le champ libre qui s'ouvre sous une liste fermée quand on y
   choisit « Autre » ou « À préciser » : sans lui, la fiche
   enregistre qu'il y avait quelque chose à dire sans dire quoi. */
.precision{margin-top:6px;border-style:dashed}
.precision[hidden]{display:none}
.btn{
  background:var(--encre);color:#fff;border:0;border-radius:6px;padding:9px 18px;
  font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer;
}
.btn:hover{background:var(--encre-2)}
.btn.sec{background:#fff;color:var(--encre);border:1px solid var(--trait)}
.btn.sec:hover{border-color:var(--encre)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

.barre-h{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.barre-h .cpt-h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2)}
.barre-h .btn:nth-of-type(1){margin-left:auto}
.modale .form{grid-template-columns:1fr}
.modale h3{margin-bottom:16px}
/* Un intertitre posé dans la grille du formulaire tient toute la
   largeur, et respire moins qu'au milieu d'une page : la fenêtre
   est déjà étroite. */
.form .sous-t{grid-column:1/-1;margin:14px 0 2px;padding-top:14px}
.form .sous-t:first-child{margin-top:0;padding-top:0}
/* En fenêtre, les pastilles sont le champ lui-même : elles se
   posent sous leur libellé, sans le décalage prévu pour celles qui
   suggèrent un contenu à une saisie libre. */
.modale .sugg{margin-top:0}
/* Enregistrer et annuler restent sous la main quand le formulaire
   défile : on ne remonte pas une fenêtre entière pour valider. */
.modale .actions{position:sticky;bottom:0;background:#fff;margin:18px -22px -22px;
  padding:14px 22px 18px;border-top:1px solid var(--trait);z-index:1}
@media(max-width:600px){.barre-h .btn{margin-left:0;width:100%}}
.vide{color:var(--texte-2);font-style:italic;padding:18px 0}
.note{font-size:13px;color:var(--texte-2);background:var(--cobalt-clair);border:1px solid var(--trait);border-radius:7px;padding:11px 13px;margin-bottom:16px}
.note strong{color:var(--texte)}
.note.ordre-manuel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#FDF6E7;border-color:#EBD9B4}
.note.ordre-manuel .btn{margin-left:auto;padding:6px 13px;font-size:13px}
@media(max-width:600px){.note.ordre-manuel .btn{margin-left:0;width:100%}}
/* La consigne d'anonymat du registre des patients : une seule
   ligne, lue d'un coup d'œil avant de saisir. */
.note.protection{background:#F4F8F4;border-color:#CFE0D2;border-left:3px solid var(--stable);
  border-radius:8px;padding:12px 15px;font-size:13.5px;line-height:1.45}
.note.protection strong{color:var(--stable)}
/* --- Le recueil d'un patient : la voie d'abord ------------
   Le formulaire se remplit debout, au comptoir ou au
   téléphone, sur un écran de téléphone tenu d'une main. Le
   premier écran ne pose qu'une question — la personne a-t-elle
   besoin d'un médecin, ou en a-t-elle déjà un — et tout ce qui
   suit en découle : on ne fait jamais défiler un champ inutile. */
.voies{display:grid;gap:12px}
@media(min-width:760px){.voies{grid-template-columns:1fr 1fr}}
.voies button{position:relative;text-align:left;background:var(--cobalt-clair);
  border:1px solid var(--trait);border-radius:12px;padding:20px 46px 20px 20px;cursor:pointer;
  width:100%;min-height:96px;transition:border-color .12s,background .12s,transform .08s}
.voies button:hover{border-color:var(--encre-2);background:#fff}
.voies button:active{transform:scale(.99)}
.voies button:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
/* La flèche dit que le bouton ouvre la suite du formulaire, et
   non qu'il enregistre quelque chose. */
.voies button::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-52%);
  font-family:var(--display);font-size:26px;line-height:1;color:var(--encre-2);opacity:.45}
.voies button:hover::after{opacity:1}
.voies .t{display:block;font-family:var(--display);font-weight:700;font-size:19px;
  color:var(--encre);line-height:1.15;letter-spacing:.01em}
.voies .d{display:block;font-size:13.5px;color:var(--texte-2);margin-top:7px;line-height:1.4}
.retour-f{display:inline-flex;align-items:center;gap:6px;background:var(--carte);
  border:1px solid var(--trait);border-radius:20px;color:var(--texte-2);font-size:13px;
  cursor:pointer;padding:8px 15px;margin-bottom:12px;min-height:40px;text-align:left}
.retour-f:hover{color:var(--encre);border-color:var(--encre-2)}

/* --- Le feuillet de recueil, tenu d'une main ------------------
   Le formulaire se remplit debout, au téléphone, sur un écran
   étroit : des champs qu'on atteint au pouce, des sections
   qu'on repère du coin de l'œil en faisant défiler, et le
   bouton d'enregistrement qui ne quitte jamais le bas de
   l'écran une fois qu'on a commencé à saisir. */
.recueil{border-radius:13px;padding:22px 24px;border-top:3px solid var(--encre);
  box-shadow:0 1px 3px rgba(6,43,99,.06)}
.recueil .tete-r{margin-bottom:20px}
.recueil .tete-r .v{display:inline-block;font-family:var(--mono);font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--encre-2);
  background:var(--cobalt-clair);border-radius:20px;padding:4px 11px;margin-bottom:9px}
.recueil .tete-r h2{font-size:19px;margin:0 0 6px}
.recueil .tete-r h2::before{height:19px}
.recueil .sous-f{margin:0;font-size:13.5px;color:var(--texte-2);line-height:1.45;max-width:66ch}
.recueil .sous-t{margin-top:26px;padding-top:18px}
/* Le premier intertitre suit l'en-tête de la carte : pas de
   filet, il y aurait deux traits à trois lignes d'intervalle. */
.recueil .tete-r + .sous-t{margin-top:18px;padding-top:0;border-top:0}
.recueil .form label .k{font-size:10.5px;color:var(--texte-2)}
.recueil .form input,.recueil .form select,.recueil .form textarea{
  padding:10px 12px;border-radius:8px;min-height:44px;background:#fff}
.recueil .form textarea{min-height:82px;line-height:1.45}
.recueil .form input::placeholder,.recueil .form textarea::placeholder{color:#9AA8BC}
.recueil .coche{border-radius:10px;padding:13px 15px}
/* Enregistrer reste sous le pouce : la barre colle au bas de la
   carte pendant qu'on fait défiler les champs. */
.recueil .actions-r{position:sticky;bottom:0;z-index:2;gap:10px;margin:22px -24px -22px;
  padding:14px 24px;background:var(--carte);border-top:1px solid var(--trait);
  border-radius:0 0 13px 13px}
.recueil .actions-r .btn{padding:12px 22px;font-size:15px;min-height:48px}
@media(max-width:760px){
  .recueil{padding:17px 15px;border-radius:12px}
  .recueil .tete-r{margin-bottom:16px}
  .recueil .tete-r h2{font-size:17.5px}
  .recueil .tete-r h2::before{height:17px}
  .recueil .sous-t{margin-top:22px;padding-top:15px}
  .voies button{padding:17px 40px 17px 17px;min-height:84px}
  .voies .t{font-size:18px}
  /* 16px : en deçà, l'iPhone zoome à chaque champ touché et le
     formulaire part de travers. */
  .recueil .form input,.recueil .form select,.recueil .form textarea{font-size:16px;min-height:46px}
  .recueil .actions-r{margin:20px -15px -17px;padding:12px 15px;border-radius:0 0 12px 12px;
    box-shadow:0 -4px 12px rgba(6,43,99,.07)}
  .recueil .actions-r .btn{flex:1 1 100%;width:100%}
  .recueil .actions-r .btn.sec{order:2}
}
/* Les réponses les plus fréquentes en pastilles : au comptoir on
   ne tape pas, on touche. Le champ reste libre pour tout le reste. */
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.sugg button{background:var(--cobalt-clair);border:1px solid transparent;border-radius:20px;
  padding:8px 13px;font-size:13.5px;color:var(--encre-2);cursor:pointer;min-height:40px;
  text-align:left;line-height:1.2}
.sugg button.on{border-color:var(--encre-2);background:#fff;font-weight:600}
.sugg.urg button.on{border-color:var(--braise);color:var(--braise)}
.sugg.urg button.on.calme{border-color:var(--stable);color:var(--stable)}
/* Les amorces ne sont pas des réponses : elles ouvrent une phrase
   qu'on finit à la main, et s'additionnent au lieu de se remplacer.
   Le « + » le dit avant qu'on ait essayé. */
.sugg.amorces{margin-top:8px}
.sugg.amorces button{font-size:12.5px;padding:7px 12px;min-height:36px;background:var(--surface);
  border-color:var(--trait);color:var(--texte-2)}
.sugg.amorces button::before{content:"+ ";color:var(--encre-2);font-weight:700}
.sugg.amorces button:hover{background:var(--cobalt-clair);border-color:var(--encre-2);color:var(--encre-2)}
.sugg.amorces button.on{background:#fff;border-color:var(--encre-2);color:var(--encre-2)}
/* Les trois temps du formulaire : le patient, ce qu'il lui faut,
   qui le signale. Un intertitre par temps, pour savoir où l'on en
   est quand on fait défiler. */
.sous-t{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--encre);
  margin:22px 0 11px;padding-top:16px;border-top:1px solid var(--trait)}
.sous-t:first-child{margin-top:0;padding-top:0;border-top:0}
.sous-t .d{display:block;font-family:var(--corps);font-weight:400;font-size:13px;
  color:var(--texte-2);margin-top:3px;line-height:1.35}
/* Le filtrage du registre des patients. Neuf fois sur dix, on
   cherche un nom : le champ de recherche et le tri tiennent seuls
   sur une ligne, et le reste — période, statut, urgence, voie —
   dort derrière « Affiner ». Le tamis ne doit pas coûter plus de
   hauteur d'écran que les patients qu'il sert à retrouver. */
.tamis{background:var(--surface);border:1px solid var(--trait);
  border-radius:9px;padding:8px;margin-bottom:12px}
.tamis .rang{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tamis .rang .q{flex:1 1 200px;min-width:0}
.tamis .rang .tri{flex:0 1 190px}
.tamis input,.tamis select{padding:8px 10px;border:1px solid var(--trait);
  border-radius:7px;background:#fff;font-size:13.5px;font-family:inherit;color:var(--texte)}
.tamis .plus{flex:none;display:inline-flex;align-items:center;gap:6px;background:#fff;
  border:1px solid var(--trait);border-radius:7px;padding:8px 12px;font-family:inherit;
  font-size:13px;color:var(--texte-2);cursor:pointer;min-height:38px}
.tamis .plus:hover{border-color:var(--encre-2);color:var(--encre-2)}
.tamis .plus.on{background:var(--cobalt-clair);border-color:var(--encre-2);color:var(--encre)}
.tamis .plus .n{font-family:var(--mono);font-size:10px;background:var(--encre-2);color:#fff;
  border-radius:9px;padding:1px 6px}
.tamis .fins{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin-top:8px;padding-top:9px;border-top:1px solid var(--trait)}
.tamis .fins label{display:block;min-width:0}
.tamis .fins input,.tamis .fins select{width:100%}
.tamis .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--texte-2);margin-bottom:3px}
.tamis .pied{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:0;
  font-size:12px;color:var(--texte-2);margin-top:8px;padding:0}
.tamis .pied button{background:none;border:1px solid var(--trait);border-radius:6px;
  padding:6px 11px;font-family:inherit;font-size:12.5px;color:var(--encre-2);cursor:pointer;min-height:34px}
.tamis .pied button:hover{border-color:var(--encre-2)}
@media(max-width:600px){.tamis input,.tamis select{font-size:16px;padding:10px 11px}
  .tamis .rang .tri{flex:1 1 100%}}

/* ---------- le registre des patients, en cartes ----------
   Une personne, une carte. Trois par ligne sur grand écran, deux
   en tablette, une seule sur téléphone : on lit une situation
   entière sans balayer l'écran de gauche à droite.

   Le liseré du haut donne l'état sans lire — rouge si c'est
   urgent et que personne n'a été désigné, ambre si ça attend,
   vert si un médecin est là, gris si c'est clos. Une carte
   urgente sans médecin porte en plus un bandeau : c'est la seule
   chose qui doit sauter aux yeux dans une liste de trente. */
.pats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(298px,1fr));margin-bottom:14px}
.fpat{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--ambre);
  border-radius:10px;padding:0 0 13px;display:flex;flex-direction:column;overflow:hidden}
.fpat.p-oriente{border-top-color:var(--stable)}
.fpat.p-clos{border-top-color:#A7B6CA;background:#FAFBFD}
.fpat.p-urgent{border-top-color:var(--braise);border-color:#EFC6BB;
  box-shadow:0 2px 12px rgba(194,72,47,.11)}
/* Le bandeau d'urgence : pleine largeur, en tête de carte, avant
   même le nom. Il ne s'écrit que tant que personne n'a pris la
   personne en charge — une fois orientée, elle n'est plus ce
   qu'on doit regarder en premier. */
.fpat .cri{display:flex;align-items:center;gap:8px;background:var(--braise);color:#fff;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:7px 15px}
.fpat .cri::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;flex:none;
  animation:battre 1.6s ease-in-out infinite}
@keyframes battre{0%,100%{opacity:1}50%{opacity:.28}}
@media(prefers-reduced-motion:reduce){.fpat .cri::before{animation:none}}
.fpat .corps{display:flex;flex-direction:column;gap:9px;padding:12px 15px 0;flex:1}
.fpat .tete{display:flex;align-items:flex-start;gap:8px}
.fpat .qui{flex:1;min-width:0}
.fpat .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;
  color:var(--encre);word-break:break-word}
.fpat .ou{font-size:12.5px;color:var(--texte-2);margin-top:3px;line-height:1.35}
.fpat .outils{flex:none;display:flex;gap:1px;margin:-3px -5px 0 0}
.fpat .outils button{background:none;border:0;cursor:pointer;color:var(--texte-2);opacity:.4;
  font-size:15px;line-height:1;padding:4px 6px;border-radius:5px}
.fpat .outils button:hover{opacity:1;color:var(--braise);background:var(--surface)}
.fpat .outils button[disabled]{opacity:.12;cursor:default;background:none;color:var(--texte-2)}
.fpat .etats{display:flex;flex-wrap:wrap;gap:5px}
/* Le motif, c'est ce pour quoi on décroche : il se lit en gros,
   dans son propre encadré, et vire au rouge quand c'est urgent. */
.fpat .motif{background:var(--cobalt-clair);border-radius:8px;padding:9px 12px}
.fpat .motif .v{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.32;
  color:var(--encre);margin-top:2px;word-break:break-word}
.fpat.p-urgent .motif{background:#FDEDE8}
.fpat.p-urgent .motif .v{color:#9B2C0F}
.fpat.p-clos .motif{background:var(--surface)}
.fpat .faits{display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.4}
.fpat .faits > span{display:block}
.fpat .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:1px}
.fpat .bl{background:var(--surface);border-radius:7px;padding:8px 11px;font-size:13px;line-height:1.42}
.fpat .bl.vers{background:#E9F3EF}
.fpat .bl.vers strong{font-family:var(--display);font-size:14.5px;color:#1E5C46}
.fpat .bl .s{display:block;font-size:11.5px;color:var(--texte-2);margin-top:3px}
.fpat .avert{background:#FCF3E4;color:#8A5D12;border-radius:7px;padding:8px 11px;font-size:12.5px;line-height:1.4}
/* Le numéro compose l'appel d'un doigt : c'est le geste qui suit
   le signalement, et il ne doit pas se chercher. */
.fpat a.tel{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--encre-2);color:#fff;font-family:var(--display);font-weight:600;font-size:14.5px;
  border-radius:8px;padding:10px 13px;text-decoration:none;min-height:44px}
.fpat a.tel:hover{background:var(--encre)}
.fpat .sans-tel{font-size:12.5px;color:var(--texte-2);font-style:italic}
.fpat .actes{margin-top:auto;padding:11px 15px 0;display:flex;flex-direction:column;gap:8px}
.fpat .actes .btn{width:100%;justify-content:center;min-height:44px}
.fpat .actes label{display:block}
.fpat .actes select{width:100%;padding:9px 10px;border:1px solid var(--trait);border-radius:7px;
  background:#fff;font-size:13.5px;font-family:inherit;color:var(--texte)}
@media(max-width:600px){.fpat .actes select{font-size:16px;padding:11px 12px}}
.fpat .pied{margin:11px 15px 0;padding:9px 0 0;border-top:1px solid var(--trait);
  display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.05em;color:var(--texte-2)}

/* Le fléchage se fait depuis la ligne du patient : « Orienter le
   patient » est le geste le plus fréquent du feuillet, il tient
   dans un bouton pleine largeur qu'on touche sans viser. */
.flechage{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  align-items:end;margin-top:11px;padding:11px 12px;background:var(--cobalt-clair);border-radius:7px}
.flechage .k{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--texte-2);margin-bottom:4px}
.flechage select,.flechage input{width:100%;padding:8px 10px;border:1px solid var(--trait);
  border-radius:6px;background:#fff;font-size:13.5px}
.flechage>.btn{width:100%;justify-content:center;min-height:44px}
@media(max-width:600px){.flechage{grid-template-columns:1fr}
  .flechage select,.flechage input{font-size:16px;padding:11px 12px}}
/* Les créneaux cochés au calendrier du formulaire, relus jour
   par jour dans la fiche du médecin. */
/* La liste des motifs acceptés peut être longue : on la borne à
   trois lignes sur la carte, elle reste entière à l'export. */
.borne{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.agenda-l{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.agenda-l span{font-size:13px}
.agenda-l b{font-weight:600;color:var(--encre)}

/* ---------- l'agenda des créneaux ----------
   Une ligne par créneau : l'heure à gauche, le médecin au
   milieu, l'action à droite. Ce qui est libre saute aux yeux,
   ce qui reste à confirmer aussi. */
.cren{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid var(--trait);
  border-left:4px solid var(--stable);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.cren.pris{border-left-color:#A7B6CA;background:var(--surface)}
.cren.attente{border-left-color:var(--ambre)}
.cren .q{flex:0 0 74px;font-family:var(--mono);font-size:16px;color:var(--encre);line-height:1.15}
.cren .q span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-2);margin-top:3px}
.cren .qui{flex:1;min-width:0}
.cren .qui .nm{font-family:var(--display);font-weight:600;font-size:14.5px}
.cren .qui .s{font-size:12.5px;color:var(--texte-2);margin-top:1px}
.cren .qui .pat{font-size:13px;margin-top:5px;padding-left:9px;border-left:2px solid var(--cobalt-clair)}
.cren .act{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.cren .act .btn{padding:8px 14px;font-size:13.5px;min-height:0}
@media(max-width:640px){
  .cren{flex-wrap:wrap;gap:10px}
  .cren .q{flex:0 0 60px}
  .cren .qui{flex:1 1 55%}
  .cren .act{flex:1 1 100%;justify-content:flex-start}
  .cren .act .btn{flex:1;padding:11px 14px;min-height:44px}
}

/* Le choix du patient à poser sur un créneau. */
.choix-pat{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto;margin-bottom:6px}
.choix-pat button{text-align:left;background:#fff;border:1px solid var(--trait);border-radius:8px;
  padding:11px 13px;cursor:pointer;width:100%}
.choix-pat button:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.choix-pat .r{display:block;font-family:var(--display);font-weight:600;font-size:14.5px}
.choix-pat .r .deja{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--fond-2,#F1F3F6);color:var(--texte-2);border-radius:4px;padding:2px 6px;margin-left:7px;
  vertical-align:2px;font-weight:400}
/* La distance se lit avant le reste de la ligne : c'est elle qui
   fait choisir, une fois la liste rangée du plus près au plus loin. */
.choix-pat .r .km{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  background:var(--cobalt-clair);color:var(--encre-2);border-radius:4px;padding:2px 7px;margin-left:7px;
  vertical-align:2px;font-weight:500}
.choix-pat .d{display:block;font-size:12.5px;color:var(--texte-2);margin-top:2px}

/* Le contact du médecin, rendu au moment où on en a besoin. */
.contact-med{background:var(--cobalt-clair);border-radius:9px;padding:14px 15px}
.contact-med .nm{font-family:var(--display);font-weight:700;font-size:16px;color:var(--encre)}
.contact-med .s{font-size:12.5px;color:var(--texte-2);margin-top:1px}
.contact-med .voies{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:11px}
.contact-med .voie{display:block;background:#fff;border:1px solid var(--trait);border-radius:7px;
  padding:9px 11px;font-size:14px;text-decoration:none;color:var(--texte);word-break:break-word}
.contact-med a.voie:hover{border-color:var(--encre-2);color:var(--encre-2)}
.contact-med .voie .k{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--texte-2);margin-bottom:2px}
.contact-med .alerte-med{margin-top:11px;background:#FDF0EC;border:1px solid #E8C3B8;color:#8C2F1B;
  border-radius:7px;padding:10px 12px;font-size:13px}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--encre);color:#fff;padding:10px 18px;border-radius:7px;font-size:14px;
  opacity:0;transition:.25s;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.rideau{position:fixed;inset:0;background:rgba(16,32,46,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.rideau.on{display:flex}
.modale{background:#fff;border-radius:11px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 18px 48px rgba(6,43,99,.24);animation:modale-in .18s ease-out}
@keyframes modale-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modale{animation:none}}
.modale h3{font-family:var(--display);margin:0 0 6px;font-size:19px}
/* Dans une fenêtre, on saisit souvent au pouce : les champs y sont
   plus hauts et plus arrondis qu'au fil d'une page. */
.modale input,.modale select,.modale textarea{padding:10px 12px;border-radius:8px;font-size:15px}

@media(max-width:860px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex:none}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav .groupe{display:none}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .nav button .cpt{margin-left:6px}
  .contenu{padding:18px 15px}
  .bandeau{padding:12px 15px}
}
@media(max-width:600px){
  input,select,textarea{font-size:16px;padding:11px 12px}
  .btn{padding:12px 18px;min-height:46px;width:100%}
  .actions{flex-direction:column}
  .actions .btn{width:100%}
  .orga{grid-template-columns:1fr}
  .mission .meta div{min-width:100%;flex:1 1 100%}
  .compteurs{grid-template-columns:1fr 1fr}
  h1{font-size:22px}
  .pers .nom{font-size:21px}
  td,th{padding:9px 10px}
  .fil .h{flex:0 0 74px}
  .nav button{min-height:42px}
}
.entete-print{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt}
  .rail,.bandeau,.filtres,.feuillets,.barre-h,.actions,.crayon,.sup,.modif,.retirer,.pt .b,.guide,.pers .modif,.mission .barre,.toast,.carte.formulaire,.renforts .rplus,.renforts .rx,.ent-r .outils,.note.ordre-manuel .btn,.crayon-m,.confier,.neuve,.ref .b,.ref.neuf,.tamis,.retour-f,.voies,.sugg,.miss-angle,.miss-neuf,.miss-c .barre-m,.miss-pers .modif,.apourvoir li .designer,.pt .modif-p,.pt .chev,.ent-r .lien-v{display:none!important}
  td.act,th:last-child{display:none!important}
  /* Un feuillet replié à l'écran s'imprime déplié : un dossier de
     traçabilité ne tronque rien. */
  .pt .e,.pt .imp .v,.pt .q{display:block!important;-webkit-line-clamp:unset!important;overflow:visible!important}
  .contenu{padding:0;max-width:none}
  .carte,.tw,.mission,.pers,.ligne,.pt,.visio,.ent-r,.miss-pers,.miss-c,.apourvoir{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .miss-pers .manquant,.miss-eq .qn.manque{text-decoration:none;color:#555}
  .visio .tete .chev{display:none}
  .reg-jour,.fil .jour{break-after:avoid}
  /* La main courante imprimée dit tout : les outils de l'écran
     disparaissent, le nom de qui s'en est chargé reste, et le texte
     replié se déplie. */
  .fil .out,.fil .plus{display:none!important}
  .fil .qui{border-bottom:0;color:#333}
  .fil .qui::after{content:""}
  .fil .plein.plie{display:block!important}
  .entete-print{display:block!important;border-bottom:2px solid #062B63;padding-bottom:8px;margin-bottom:16px}
  .entete-print .t{font-family:var(--display);font-weight:700;font-size:15pt;color:#062B63}
  .entete-print .d{font-family:var(--mono);font-size:9pt;color:#555;margin-top:3px}
  table{font-size:9pt;width:100%}
  th{background:#EEF3FA!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,li,h2{break-inside:avoid}
  h2{break-after:avoid}
  a{color:#062B63;text-decoration:none}
  .tw{overflow:visible}
  body.print-modale .zone,body.print-modale .rail{display:none!important}
  body.print-modale .rideau{position:static;display:block!important;background:none;padding:0}
  body.print-modale .modale{max-width:none;max-height:none;overflow:visible;padding:0;border-radius:0}
  .acte{font-size:10pt;line-height:1.42}
  .acte .ttl{font-size:16pt}
  .acte .ctx{background:#EEF3FA!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:9pt}
  .acte h2{font-size:9pt;margin:11pt 0 5pt}
  .acte table,.acte ol,.acte .sig,.acte .sig .b,.acte .cachet{break-inside:avoid}
  .acte .cachet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .acte .lg{padding:2pt 0}
  .acte .lg .e{font-size:8.5pt}
  .acte ol{font-size:9pt}
  .acte .pied{font-size:8pt}
}
/* ---------- cartographie ----------
   Une commune écrite dans une colonne ne dit pas si le cabinet est
   à dix minutes de la pharmacie qui appelle. La carte le dit. Elle
   ne remplace pas la liste : elle se lit à côté d'elle, et se
   replie quand on n'en a pas besoin. */
.carto{background:var(--carte);border:1px solid var(--trait);border-radius:9px;margin-bottom:16px;overflow:hidden}
.carto .tete-c{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}
.carto .tete-c .t{font-family:var(--display);font-weight:700;font-size:16px;color:var(--encre);line-height:1.2}
.carto .tete-c .s{font-size:12.5px;color:var(--texte-2);flex:1 1 220px;line-height:1.35;margin:0}
/* Une carte qui se passe de phrase d'explication garde ses boutons
   à droite : l'écart tient la place que le texte occupait. */
.carto .tete-c .ecart{flex:1 1 auto}
.carto .tete-c .plier{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-family:inherit;font-size:12.5px;padding:7px 12px;cursor:pointer;min-height:36px}
.carto .tete-c .plier:hover{border-color:var(--encre-2);color:var(--encre-2)}
.carto .tete-c .plier.on{background:var(--ambre-clair);border-color:var(--ambre-fonce);
  color:var(--encre);font-weight:600}
/* z-index:0 enferme les couches de Leaflet — elles montent jusqu'à
   800 — sous les fenêtres du cockpit, qui sont à 50. Sans cela, la
   carte passerait par-dessus la modale de saisie. */
.carto-hote,.carto-vide{height:330px;border-top:1px solid var(--trait);background:var(--ambre-clair);
  position:relative;z-index:0;isolation:isolate}
.carto-hote.court,.carto-vide.court{height:260px}
.carto-toile{height:100%}
.carto-vide,.carto .attente{display:flex;align-items:center;justify-content:center;height:100%;
  font-size:13px;color:var(--texte-2);font-style:italic;text-align:center;padding:22px;line-height:1.45}
.carto .legende{display:flex;flex-wrap:wrap;gap:7px 15px;padding:11px 16px;border-top:1px solid var(--trait);
  font-size:12px;color:var(--texte-2)}
.carto .legende span{display:inline-flex;align-items:center;gap:6px}
.carto .legende i{width:11px;height:11px;border-radius:50%;display:inline-block;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.22)}
.carto .legende i.approx{opacity:.45}
/* La légende reprend la forme de l'officine sur la carte : une
   croix, quand la personne signalée est un disque plein. */
.carto .legende i.croix{width:15px;height:15px;border:none;border-radius:0;box-shadow:none;
  display:inline-flex;align-items:center}
/* Le repère d'une officine est une image, pas une pastille : la boîte
   que Leaflet lui donne ne doit ni fond ni cadre, juste une ombre
   portée qui le décolle du fond de carte. */
.carto-croix{background:none;border:none;line-height:0;
  filter:drop-shadow(0 1px 2px rgba(58,42,16,.42))}
.carto .manquants{padding:11px 16px;border-top:1px solid var(--trait);font-size:12.5px;
  color:#8A5D12;background:#FCF3E4;line-height:1.45}
.carto .source{padding:9px 16px;border-top:1px solid var(--trait);font-size:11px;color:var(--texte-2);line-height:1.4}
.carto-popup{font-family:var(--corps);font-size:13.5px;line-height:1.45;min-width:180px}
.carto-popup .n{font-family:var(--display);font-weight:700;font-size:15px;color:var(--encre);line-height:1.2}
.carto-popup .l{color:var(--texte-2);font-size:12.5px;margin-top:2px}
.carto-popup .n .urg{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  background:#F7E3DE;color:var(--braise);border-radius:4px;padding:2px 6px;margin-left:7px;
  vertical-align:2px;font-weight:400}
/* L'officine la plus proche est la réponse qu'on vient chercher en
   touchant un point : elle se détache du reste de la bulle. */
.carto-popup .pres{margin-top:9px;background:var(--ambre-clair);border-radius:7px;padding:8px 10px;
  font-size:13px;line-height:1.4;color:var(--encre)}
.carto-popup .pres .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:2px}
.carto-popup a{display:block;margin-top:7px;color:var(--encre-2);font-weight:600;text-decoration:none}
.carto-popup button{margin-top:9px;background:none;border:1px solid var(--trait);border-radius:7px;
  color:var(--texte-2);font-family:inherit;font-size:12.5px;padding:6px 11px;cursor:pointer}
.carto-popup button:hover{border-color:var(--encre-2);color:var(--encre-2)}
@media print{.carto{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================
   L'AMBRE DE LA CANICULE

   Même charpente que le cockpit des incendies, à la couleur près.
   Le rail et le bandeau passent de l'encre à l'ambre : c'est le
   seul signal, mais il est permanent et occupe le bord gauche de
   l'écran — impossible de se croire dans l'autre cockpit. Tout le
   reste garde ses couleurs, pour qu'on ne réapprenne rien en
   passant de l'un à l'autre.
   ========================================================= */
:root{
  --ambre-fonce:#B87516;
  --brou:#3A2A10;          /* le brun du rail */
  --ambre-clair:#FBF0DC;   /* l'équivalent ambré du cobalt clair */
}
.rail{background:var(--brou);color:#E4D3B4}
.marque .sous{color:#C8A464}
.marque .crise{background:var(--ambre);color:#3B2A08}
.nav button{color:#D9C4A0}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.actif{background:var(--ambre-fonce);color:#fff}
.nav button .cpt{color:#C8A464}
.nav button.actif .cpt{color:#F6E6C8}
.nav .groupe{color:#A88B58}
.pied{color:#C8A464}
.pied button{border-color:rgba(255,255,255,.2);color:#E4D3B4}
.pied .version{color:#9B7F4E}
.mesmissions .t{color:#A88B58}
.mesmissions button{color:#F0E2C6}
.mesmissions .r{color:#C8A464}
.bandeau{background:var(--ambre-fonce)}
.bandeau .maj{color:#F3DFBB}
.bandeau .crayon{color:#F6E6C8}
/* Le feuillet actif du rail garde le brun du rail, et son liseré
   ambre reste lisible dessus. */
.feuillets{border-top-color:var(--brou)}
.feuillets button.on{background:var(--brou);border-color:var(--brou)}
/* Les cartes d'un palier prennent l'ambre plutôt que le cobalt :
   c'est la seule chose qui change d'un cockpit à l'autre, et elle
   se voit du coin de l'œil. Le bouton de retour, lui, reste bleu
   comme tous les boutons du cockpit. */
.module{border-left-color:var(--ambre)}
.module:hover{border-color:var(--ambre);border-left-color:var(--ambre-fonce);
  box-shadow:0 2px 16px rgba(58,42,16,.13)}
.module:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
.module .entrer{color:var(--ambre-fonce)}
/* Un chiffre qui appelle un geste — ce qui reste à appeler, ce qui
   attend quelqu'un — se détache des totaux qui n'appellent rien. */
.module .chiffres strong.alerte{color:var(--ambre-fonce)}

/* ---------- réhydratation à domicile ----------
   Trois cartes qui se lisent dans l'ordre : ce qu'on fait, avec
   quelles officines, et pour qui. */
/* ---------- les deux procédures en vigueur ----------
   Le module « Procédure » ne porte pas un texte, il porte deux
   documents : celui des demandes qui partent d'un médecin de ville,
   celui des demandes qui partent de SOS Médecins. On choisit
   d'abord, on lit ensuite — et ce qu'on lit doit se comprendre du
   premier coup, à une heure où l'on décroche un téléphone.

   Le déroulé reprend la forme des schémas validés : une colonne
   d'étapes, et à chaque question un embranchement OUI / NON qu'on
   distingue de loin — le vert continue, le rouge sort du circuit. */
.pr-choix{display:flex;flex-direction:column;gap:12px}
.pr-choix .pr-b{text-align:left;font-family:inherit;cursor:pointer;background:var(--carte);
  border:1px solid var(--trait);border-left:4px solid var(--ambre);border-radius:10px;
  padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.pr-choix .pr-b:hover{border-color:var(--ambre);border-left-color:var(--ambre-fonce);
  box-shadow:0 2px 16px rgba(58,42,16,.13)}
.pr-choix .pr-b:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
.pr-choix .rang{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ambre-fonce)}
.pr-choix .nom{font-family:var(--display);font-weight:700;font-size:17px;color:var(--encre);line-height:1.25}
.pr-choix .quand{font-size:13.5px;line-height:1.5;color:var(--texte)}
.pr-choix .quand b{color:var(--encre)}
.pr-choix .pied-b{display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--texte-2)}
.pr-choix .entrer{color:var(--ambre-fonce);font-weight:700;font-size:13px}

/* Ce qu'on fait de la procédure — l'emporter, la corriger,
   l'imprimer — se pose sous l'encart d'en-tête, là où le regard
   arrive après avoir lu de quoi il s'agit, et non au bas d'un
   déroulé qu'il faut d'abord traverser. */
.pr-actes{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 16px}

/* --- l'écran de modification ---------------------------------
   Le déroulé avec des champs à la place du texte : même ordre,
   mêmes intitulés, rien derrière un onglet. Une étape est un bloc,
   ses deux réponses sont deux encadrés de la couleur qu'elles ont
   à la lecture — on corrige le vert dans le vert, le rouge dans le
   rouge. */
.pe-bloc{margin-bottom:14px}
.pe-t{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);margin:0 0 12px}
.pe-haut{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pe-outils{display:flex;gap:5px;margin-top:-2px}
.pe-o{font-family:inherit;font-size:15px;line-height:1;width:30px;height:30px;cursor:pointer;
  background:var(--surface);border:1px solid var(--trait);border-radius:6px;color:var(--texte-2)}
.pe-o:hover:not(:disabled){border-color:var(--encre-2);color:var(--encre-2)}
.pe-o:disabled{opacity:.32;cursor:default}
.pe-o.ret:hover{border-color:var(--braise);color:var(--braise)}
/* La case qui ouvre les deux réponses : elle commande la forme du
   bloc, elle ne se range donc pas parmi les champs. */
.pe-pose{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--trait);font-size:14px;color:var(--texte);cursor:pointer}
.pe-pose input{width:17px;height:17px;flex:0 0 auto;margin:0;accent-color:var(--encre-2)}
.pe-q{margin-top:13px;display:flex;flex-direction:column;gap:11px}
.pe-rep{border-radius:9px;padding:12px 14px;border:1px solid var(--trait)}
.pe-rep.oui{background:#F4FAF7;border-color:#BFDDCF}
.pe-rep.non{background:#FDF6F4;border-color:#EAC4BB}
.pe-r{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;margin-bottom:9px}
.pe-rep.oui .pe-r{color:#1F5B47}
.pe-rep.non .pe-r{color:#8C3020}
.pe-rep .form{gap:10px}
.pe-ajout{display:flex;margin:2px 0 4px}
/* Enregistrer reste sous la main : un formulaire de cette longueur
   ne doit pas obliger à remonter ou redescendre pour valider. */
@media(min-width:760px){
  .pr-actes-fixe{position:sticky;top:0;z-index:5;background:var(--surface);
    padding:10px 0;margin-bottom:14px;border-bottom:1px solid var(--trait)}
}
@media print{.pr-actes{display:none}}

/* Le déroulé lui-même. */
.pr-tete{background:var(--ambre-clair);border:1px solid #EBD6AC;border-radius:10px;
  padding:15px 17px;margin-bottom:16px;display:flex;flex-direction:column;gap:9px}
.pr-tete .rang{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8A5D12}
.pr-tete .l{font-size:13.5px;line-height:1.5;color:#4A3208}
.pr-tete .l .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#8A5D12;display:block;margin-bottom:2px}
.pr-tete a{color:#6E4A0E;font-weight:700;text-decoration:none}

.pr-flux{display:flex;flex-direction:column;align-items:stretch;gap:0}
.pr-fl{align-self:center;color:var(--texte-2);font-size:17px;line-height:1;padding:5px 0}
.pr-et{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--encre-2);
  border-radius:9px;padding:13px 16px;display:flex;gap:13px;align-items:flex-start}
.pr-et .n{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--cobalt-clair);
  color:var(--encre);font-family:var(--mono);font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.pr-et .c{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.pr-et .qui{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--encre-2);background:var(--cobalt-clair);border-radius:4px;padding:2px 7px;align-self:flex-start}
.pr-et .t{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--encre);line-height:1.25}

  border:1px solid #EBD6AC;border-radius:6px;padding:8px 10px}
/* L'étape qui pose une question se signale avant qu'on la lise. */
.pr-et.q{border-left-color:var(--ambre)}
.pr-et.q .qui{background:var(--ambre-clair);color:#8A5D12}

/* Les deux réponses, côte à côte tant que la place le permet. */
.pr-br{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  margin:9px 0 0 40px}
.pr-r{border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;
  border:1px solid var(--trait);background:var(--carte)}
.pr-r .rep{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.pr-r .t{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.25}
.pr-r .d{font-size:13px;line-height:1.5}
.pr-r .d a{font-weight:700;text-decoration:none;color:inherit}
.pr-r.oui{background:#EAF4EF;border-color:#BFDDCF;color:#1F5B47}
.pr-r.oui .rep,.pr-r.oui .t{color:#1F5B47}
.pr-r.non{background:#FBEDEA;border-color:#EAC4BB;color:#8C3020}
.pr-r.non .rep,.pr-r.non .t{color:#8C3020}
/* Une branche qui s'arrête : la mention se lit sans la chercher. */
.pr-r .fin{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  border-top:1px dashed currentColor;padding-top:7px;margin-top:1px;opacity:.85}
.pr-r .fin.vers::before{content:'▼ '}
/* Le rattrapage d'une branche « non » qui rebondit avant de sortir. */
.pr-r .suite{border-top:1px solid currentColor;border-color:inherit;padding-top:8px;margin-top:2px;
  display:flex;flex-direction:column;gap:4px}
.pr-r .suite .st{font-weight:700;font-size:13px}
.pr-r .suite .sd{font-size:12.5px;line-height:1.45}

/* Un déroulé sur papier ne se coupe pas au milieu d'une étape. */
@media print{
  .pr-et,.pr-r,.pr-tete,.pr-choix .pr-b{break-inside:avoid;page-break-inside:avoid}
  .pr-choix .entrer{display:none}
}

/* ---------- la fiche de synthèse d'une procédure ----------
   Une page, et une seule : c'est la contrainte qui commande tout
   le reste. On garde de chaque étape son intitulé — celui du
   schéma, déjà écrit en langue d'action — et on laisse le détail
   à l'écran. Ce qui reste tient dans une colonne étroite qu'on
   parcourt du doigt, pliée dans une poche ou punaisée au mur.

   Les tailles sont en points, pas en pixels : elles ne valent que
   sur du papier, et un point reste un point d'une imprimante à
   l'autre. Rien de cette feuille ne s'affiche à l'écran. */
.feuille-proc{display:none}
@media print{
  body.impr-proc > .shell,
  body.impr-proc > .toast,
  body.impr-proc > .rideau{display:none!important}
  body.impr-proc > .feuille-proc{display:block!important}
  body.impr-proc{background:#fff}

  /* Une page, mais pas une page illisible : la plus longue des deux
     procédures tient sur un peu plus de la moitié d'un A4 à ces
     tailles. Le reste est de l'air, et l'air ne se rogne pas tant
     qu'on n'en a pas besoin — la fiche se lit debout, souvent mal
     éclairée, parfois par-dessus l'épaule de quelqu'un. */
  .fp{font-family:var(--corps);color:#000;font-size:10pt;line-height:1.32}
  .fp + .fp{page-break-before:always}
  .fp .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    border-bottom:1.8pt solid #062B63;padding-bottom:3.5pt;margin-bottom:6pt}
  .fp .ch .org{font-family:var(--display);font-weight:700;font-size:9pt;letter-spacing:.06em;
    text-transform:uppercase;color:#062B63}
  .fp .ch .cr{font-family:var(--mono);font-size:7.6pt;letter-spacing:.05em;text-transform:uppercase;color:#555}
  .fp h1{font-family:var(--display);font-weight:700;font-size:17pt;line-height:1.15;
    color:#062B63;margin:0 0 3pt}
  .fp .st{font-size:9.6pt;color:#333;margin:0 0 7pt}
  /* Les deux ou trois choses à savoir avant de suivre le déroulé.
     Sur une feuille unique, elles ne peuvent pas être ailleurs. */
  .fp .cadre{border:.7pt solid #999;border-left:3pt solid #E8A33D;border-radius:2pt;
    padding:6pt 8pt;margin-bottom:8pt;display:flex;flex-direction:column;gap:4pt}
  .fp .cadre .k{font-family:var(--mono);font-size:7pt;letter-spacing:.07em;text-transform:uppercase;
    color:#666;display:block;margin-bottom:1pt}
  .fp .cadre .l{font-size:9.4pt;line-height:1.3}
  /* Le numéro est ce qu'on cherche du regard en premier : il tient
     sa ligne, et la réserve qui l'accompagne passe dessous. */
  .fp .cadre .tel{font-family:var(--display);font-weight:700;font-size:14pt;color:#062B63;
    letter-spacing:.02em;display:block;line-height:1.15}
  .fp .cadre .tel + .l{font-size:8.4pt;color:#666;margin-top:1pt}

  .fp .e{display:grid;grid-template-columns:13pt 1fr;gap:0 6pt;
    padding:3.4pt 0;border-top:.4pt solid #DDD;break-inside:avoid;page-break-inside:avoid}
  .fp .e:first-of-type{border-top:0}
  .fp .e .n{font-family:var(--mono);font-size:8.6pt;font-weight:600;color:#062B63;padding-top:.8pt}
  .fp .e .qui{font-family:var(--mono);font-size:7pt;letter-spacing:.07em;text-transform:uppercase;
    color:#0B4FA8}
  .fp .e .t{font-size:10.4pt;font-weight:600;line-height:1.25;color:#111}
  /* Les deux issues d'une question : la colonne de gauche reste
     vide, elles se lisent comme un retrait sous leur étape. */
  .fp .b{grid-column:2;display:grid;grid-template-columns:19pt 1fr;gap:2.5pt 5pt;margin-top:3pt}
  .fp .b .r{font-family:var(--mono);font-size:8pt;font-weight:700;letter-spacing:.05em;padding-top:.8pt}
  .fp .b .r.o{color:#1F5B47}
  .fp .b .r.n{color:#8C3020}
  .fp .b .v{font-size:9.6pt;line-height:1.3}
  .fp .b .v .o{color:#1F5B47;font-weight:600}
  .fp .b .v .n{color:#8C3020;font-weight:600}
  .fp .b .v .s{color:#8C3020}
  .fp .b .v .f{font-family:var(--mono);font-size:7.6pt;letter-spacing:.05em;text-transform:uppercase;
    color:#444;white-space:nowrap}
  .fp .nb{font-size:8.2pt;line-height:1.32;color:#8A5D12;border-top:.4pt solid #DDD;
    margin-top:7pt;padding-top:5pt}
  .fp .pied{font-size:7.8pt;line-height:1.3;color:#555;border-top:.8pt solid #062B63;
    margin-top:7pt;padding-top:4.5pt;display:flex;justify-content:space-between;gap:12px}
}

/* =========================================================

   3. Fichier ouvert ailleurs — stockage du navigateur, propre
      à l'appareil.

   Le stockage du navigateur est alimenté dans tous les cas :
   il sert de filet si le serveur devient injoignable.
   ========================================================= */
/* Le cloisonnement des deux crises tient à ce paramètre, et à lui
   seul : le serveur range les données de la canicule dans son
   propre fichier. Rien de ce qui s'écrit ici n'atteint le cockpit
   des incendies, et réciproquement. */

   sert de filet à chaque relève : un numéro connu de cet appareil
   ne peut plus disparaître parce que le serveur l'ignore. */
let carnetSecours = {};

const stockageNavigateur = {
  async get(cle){ const v = localStorage.getItem('cpts64_' + cle); return v === null ? null : {value:v}; },
  async set(cle, val){ localStorage.setItem('cpts64_' + cle, val); }
};

const RUBRIQUES = Object.keys(etatInitial);
let instantane = {};   // état des rubriques au dernier échange avec le serveur
function copie(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function empreinteDe(k){ try{ return JSON.stringify(etat[k]); }catch(e){ return ''; } }
function rubriquesModifiees(){ return RUBRIQUES.filter(k => empreinteDe(k) !== empreinte[k]); }
function marquerSynchronise(){
  RUBRIQUES.forEach(k => { empreinte[k] = empreinteDe(k); instantane[k] = copie(etat[k]); });
}

/* Deux personnes qui travaillent sur la même rubrique — deux
   membres appelant deux CPTS différentes, typiquement — ne
   doivent pas s'écraser. On repart donc de la version du
   serveur et on n'y réapplique que les fiches réellement
   touchées de notre côté, repérées par leur identifiant. */
function fusionner(base, mien, serveur){
  /* Un dictionnaire — le carnet de coordonnées — ne se fusionne pas
     fiche par fiche mais champ par champ : voir fusionnerCarnet. Une
     fiche du serveur sans numéro ne doit jamais écraser le numéro
     saisi ici. */
  const dico = o => o && typeof o === 'object' && !Array.isArray(o);
  if(dico(base) && dico(mien) && dico(serveur)) return fusionnerCarnet(mien, serveur);

  const tableauIdentifie = a => Array.isArray(a) && a.every(x => x && typeof x === 'object' && x.id !== undefined);
  if(!tableauIdentifie(base) || !tableauIdentifie(mien) || !tableauIdentifie(serveur)) return mien;

  const avant = new Map(base.map(x => [x.id, x]));
  const apres = new Map(mien.map(x => [x.id, x]));
  const resultat = copie(serveur);

  apres.forEach((fiche, id) => {
    const initiale = avant.get(id);
    if(initiale && JSON.stringify(initiale) === JSON.stringify(fiche)) return;  // intacte chez nous
    const i = resultat.findIndex(x => x.id === id);
    if(i >= 0) resultat[i] = fiche; else resultat.push(fiche);
  });

  const supprimees = [...avant.keys()].filter(id => !apres.has(id));
  return resultat.filter(x => supprimees.indexOf(x.id) === -1);
}

/* Les numéros de téléphone ont déjà disparu plusieurs fois : ils
   se perdaient quand une fiche venue du serveur, plus pauvre que
   celle d'ici, remplaçait la fiche entière. On fusionne donc champ
   par champ, avec deux règles :

   — un champ rempli n'est jamais écrasé par un champ vide ;
   — quand les deux sont remplis, la saisie la plus récente
     l'emporte, et elle seule peut vider un champ volontairement.

   Les fiches d'avant cette règle n'ont pas de date de saisie : elles
   ne peuvent donc rien effacer, seulement compléter. */
function fusionnerCarnet(local, distant){
  const dico = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  const a = dico(local), b = dico(distant);
  const r = {};
  const vide = v => v === '' || v === null || v === undefined;
  new Set(Object.keys(a).concat(Object.keys(b))).forEach(cle => {
    const ici = a[cle], la = b[cle];
    if(!ici || typeof ici !== 'object'){ r[cle] = la || ici; return; }
    if(!la  || typeof la  !== 'object'){ r[cle] = ici; return; }
    const recent = (ici.maj || '') >= (la.maj || '') ? ici : la;
    const autre  = recent === ici ? la : ici;
    const f = Object.assign({}, autre);
    Object.keys(recent).forEach(k => {
      /* Vider un champ ne vaut que si la fiche est datée : sans date,
         on ne sait pas si c'est un effacement voulu ou une fiche
         écrite avant que le champ existe. */
      if(!vide(recent[k]) || recent.maj) f[k] = recent[k];
    });
    r[cle] = f;
  });
  return r;
}
