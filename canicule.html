        <div class="v">${maj
          ? `<b>${frdate(maj.quand.slice(0,10))} à ${esc(maj.quand.slice(11,16))}</b><br>${esc(maj.quoi)}${maj.par ? ' · ' + esc(maj.par) : ''}`
          : `<b>Jamais</b><br>Rien n'a encore été écrit sur cette page`}</div>
      </div>
    </div>
  </div>`;

  /* --- le mode d'emploi, pour qui prend la page en cours de route --- */
  h += `<div class="repli guide">
    <button class="tete" onclick="basculerGuide()">
      <div>
        <div class="t">Tenir cette page : quatre gestes</div>
        <div class="s">${guideVeille ? "À replier une fois la main prise" : "Déplier si vous prenez la veille pour la première fois"}</div>
      </div>
      <span class="chev">${guideVeille ? '▾' : '▸'}</span>
    </button>
    ${guideVeille ? `<div class="dedans"><ol class="gestes-g">
      <li><b>Se positionner sur le créneau du jour.</b> En tête de page, le lien permanent du salon et le créneau de la séance : posez-y votre prénom avant l'heure, pour que l'équipe sache qui l'y représente — et pour que la CPTS n'y soit ni à deux sans le savoir, ni absente en croyant qu'un autre y est.</li>
      <li><b>Consigner la visio de l'ARS.</b> Après chaque séance, « Consigner une visio » en haut de page : un point par sujet abordé, dans l'ordre. Le copier-coller de vos notes suffit. Une séance à laquelle on a assisté sans rien en rapporter reste signalée en rouge.</li>
      <li><b>Reprendre les points qui ont bougé.</b> Ouvrir le feuillet concerné, coller ce qu'on a trouvé — communiqué, compte rendu, mail — et enregistrer. Pas besoin de reformuler : mieux vaut le texte brut de la source qu'un résumé approximatif.</li>
      <li><b>Laisser le reste tranquille.</b> Un point qui n'a pas bougé depuis ${SEUIL_POINT_H} h passe en orange : c'est un rappel, pas un reproche. Rien ne part aux adhérents depuis cette page — la diffusion se décide au copil.</li>
    </ol>
    <p class="apres">Chaque enregistrement laisse sa trace en <a href="#" onclick="aller('courante');return false;">Main courante</a>. Les échanges avec l'ARS — mails, appels, questions posées — ont leur propre onglet, <a href="#" onclick="aller('ars');return false;">Échanges avec l'ARS</a>.</p>
    </div>` : ''}
  </div>`;

  /* --- les points de situation --- */
  h += vuePoints(arafraichir.length);

  return h;
}

/* Les feuillets de la situation régionale. Chacun porte ce qu'on
   sait à l'instant, ce qu'on y suit, et où on va le chercher :
   prendre la veille, c'est reprendre ceux qui ont vieilli.
   `pointSitOuvert` : celui qu'on a déplié. Nom distinct de
   `pointOuvert`, qui appartient aux points de collecte — deux
   variables du même nom dans la même page se seraient mangées
   l'une l'autre. */
let pointSitOuvert = null;
function ouvrirPointSit(id){ pointSitOuvert = (pointSitOuvert === id) ? null : id; rendre(); }

function vuePoints(nbRafraichir){
  const l = rubriques();
  let h = `<h2 style="margin-top:26px">Les points de situation
    <span class="cpt-h">${l.length} feuillet${l.length > 1 ? 's' : ''}${nbRafraichir ? ' · ' + nbRafraichir + ' à rafraîchir' : ' · tous à jour'}</span></h2>
  <p class="sous-h">C'est ce qui se lit au copil. Chaque point se réécrit à partir de ce que la veille a retenu — au présent, en quelques lignes.</p>
  <div class="points">`;

  h += l.map(r => {
    const vieux = pointARafraichir(r);
    const ouvert = pointSitOuvert === r.id;
    return `<div class="pt ${r.etat ? '' : 'vierge'} ${vieux && r.etat ? 'vieux' : ''} ${ouvert ? 'ouvert' : ''}">
      <div class="tete-p">
        <button class="bascule" onclick="ouvrirPointSit('${r.id}')" aria-expanded="${ouvert}">
          <span class="n">${esc(r.nom)}</span>
          <span class="chev">${ouvert ? '▴' : '▾'}</span>
        </button>
        <button class="modif-p" title="${r.etat ? 'Mettre à jour ce point' : 'Écrire le point'}"
          onclick="ouvrirPointSituation('${r.id}')">✎</button>
      </div>
      <div class="e ${r.etat ? '' : 'rien'}">${r.etat
        ? esc(r.etat).replace(/\n/g,'<br>')
        : "Point encore vierge — rien n'y a été écrit depuis le début de la crise."}</div>
      ${r.implique
        ? `<div class="imp"><span class="k">Ce que ça implique pour nous</span><div class="v">${esc(r.implique).replace(/\n/g,'<br>')}</div></div>`
        : (r.etat ? `<div class="imp manque"><div class="v">Ce que ça implique pour la CPTS n'a pas été dit.</div></div>` : '')}
      <div class="q"><span class="k">Ce qu'on y suit</span>${esc(r.quoi)}</div>
      ${r.ou ? `<div class="q"><span class="k">Où on le trouve</span>${esc(r.ou)}</div>` : ''}
      <div class="meta">${r.maj
        ? `Mis à jour ${frdate(r.maj.slice(0,10))} à ${esc(r.maj.slice(11,16))}${r.par ? ' par ' + esc(r.par) : ''}${vieux ? ' · à rafraîchir' : ''}`
        : 'Jamais renseigné'}</div>
      <div class="b">
        <button class="maj" onclick="ouvrirPointSituation('${r.id}')">${r.etat ? 'Mettre à jour ce point' : 'Écrire le point'}</button>
      </div>
    </div>`;
  }).join('');

  return h + `</div>`;
}

/* ---------- les points de situation ---------- */
function ouvrirPointSituation(id){
  const r = rubriqueDe(id);
  if(!r) return;
  brouillonPoint = id;
  document.getElementById('modale').innerHTML = `<h3>${esc(r.nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">${esc(r.quoi)}${r.ou ? ' <em>Où on le trouve : ' + esc(r.ou) + '</em>' : ''}</p>
    <div class="rappel">Le copier-coller fait l'affaire : collez le passage utile du communiqué, du compte rendu ou du mail. Mieux vaut le texte brut de la source qu'un résumé approximatif.</div>
    <div class="form">
      <label class="large"><span class="k">Ce qu'on sait à cet instant</span>
        <textarea id="p-etat" rows="8" placeholder="Ce qui est établi, ce qui a changé depuis hier, ce qui reste incertain. Dater ce qui est daté.">${esc(r.etat)}</textarea>
        <span class="aide">Ce texte remplace le précédent — la version d'avant reste tracée en main courante.</span></label>
      <label class="large"><span class="k">Ce que ça implique pour la CPTS Pau Béarn</span>
        <textarea id="p-implique" rows="3" placeholder="En une phrase : ce que ce point change pour nous, ou rien du tout.">${esc(r.implique || '')}</textarea>
        <span class="aide">Un point de situation qui ne dit pas ce qu'il change pour nous se lit et s'oublie. Une amorce pose le début de la phrase, à finir en quelques mots. Répondre « rien à faire » est une réponse : elle évite qu'on se repose la question demain.</span>
        ${amorces('p-implique', IMPLIQUE_CPTS)}</label>
    </div>
    <div style="margin-top:14px"><label class="coche">
      <input type="checkbox" id="p-mc" checked>
      <span>Consigner la mise à jour en main courante
        <span class="d">Coché par défaut : toute information recueillie se retrouve dans la main courante, en plus de sa rubrique.</span></span>
    </label></div>
    <div class="actions">
      <button class="btn" onclick="validerPointSituation()">Enregistrer le point</button>
      <button class="btn sec" onclick="fermer()">Annuler</button>
    </div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('p-etat'); if(i) i.focus({preventScroll:true}); }, 60);
}
async function validerPointSituation(){
  const r = rubriqueDe(brouillonPoint);
  if(!r) return;
  const v = document.getElementById('p-etat').value.trim();
  if(!v){ toast("Le point est vide"); document.getElementById('p-etat')?.focus(); return; }
  const imp = (document.getElementById('p-implique') || {}).value?.trim() || '';
  const mc = document.getElementById('p-mc').checked;
  if(v === r.etat && imp === (r.implique || '')){ fermer(); toast("Le point n'a pas changé"); return; }
  r.etat = v;
  r.implique = imp;
  r.maj = horodate();
  r.par = moi;
  if(mc) consignerPointSituationEnCourante(r, '');
  await sauver(); fermer(); rendre();
  toast(mc ? "Point mis à jour, et consigné en main courante" : "Point mis à jour");
}
/* Même règle que pour le reste du cockpit : ce qui est écrit ici se
   retrouve dans la main courante, qui garde la trace de l'état
   précédent du point. Le nom dit « point de situation » en toutes
   lettres : un point de collecte a sa propre entrée, écrite plus
   bas, et deux fonctions du même nom dans la même page se seraient
   mangées l'une l'autre — c'est ce qui est arrivé. */
function consignerPointSituationEnCourante(r, motif){
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(),
    type: 'Situation',
    date: aujourdhui(),
    heure: maintenant(),
    source: '',
    evenement: "Point de situation — " + r.nom + (motif ? " (" + motif + ")" : '') + "\n" + r.etat,
    /* Ce que le point change pour la CPTS n'est pas de la matière de
       situation : c'est une suite à donner, et elle se lit donc là
       où la main courante range les suites. */
    suite: (r.implique ? r.implique + "\n" : '')
      + "Situation régionale : le point « " + r.nom + " » a été repris. Il fait foi jusqu'à la prochaine mise à jour.",
    qui: moi,
    auteur: moi,
    quand: ''
  });
}

/* =========================================================
   LA MAIN COURANTE
   =========================================================
   Elle est le seul journal du cockpit. Le « Fil d'actualité »
   qui recomposait la même chose à côté d'elle, en lisant tous
   les registres et sans rien garder, a été supprimé : deux pages
   disaient la même journée en deux mots différents, et personne
   ne savait laquelle faisait foi. C'est la main courante qui fait
   foi — elle est écrite, exportée, imprimée, et c'est d'elle que
   les rapports tirent leur matière.

   Ce que le fil avait de juste, en revanche, c'est sa forme : une
   ligne par fait, l'heure en marge, la nature en pastille, et rien
   de plus tant qu'on n'a pas demandé à lire. La main courante la
   reprend telle quelle. Trois cents entrées se parcourent ainsi
   d'un coup d'œil, là où trois cents cartes demandaient dix
   écrans.
   --------------------------------------------------------- */

/* La nature d'une entrée : d'où elle vient dans le cockpit. Elle
   est posée à l'écriture, et sert à ne lire que les échanges avec
   l'ARS, ou que les appels aux CPTS, dans un registre qui reçoit
   tout. L'ordre ci-dessous est celui des pastilles de filtre. */
const MC_TYPES = [
  ['Consigné',  'e-lancer'],
  ['ARS',       'e-attente'],
  ['Visio ARS', 'e-attente'],
  ['Situation', 'e-fini'],
  ['CPTS',      'e-cours'],
  ['Rapport',   'e-fini']
];
const MC_COUL = t => (MC_TYPES.find(x => x[0] === t) || [,'e-lancer'])[1];

/* Les entrées écrites avant que la nature n'existe la retrouvent
   à leur identifiant : c'est lui qui dit de quel registre elles
   sont nées. Celles saisies à la main n'ont ni l'un ni l'autre —
   elles sont « consignées », et c'est exact. */
const MC_PREFIXES = [];
function typeMC(o){
  if(o.type && MC_TYPES.some(x => x[0] === o.type)) return o.type;
  const id = String(o.id || '');
  if(id.startsWith('mcr-')){
    const k = id.slice(4).split('-')[0];
    if(MC_REG[k]) return MC_REG[k].type;
  }
  const p = MC_PREFIXES.find(x => id.startsWith(x[0]));
  return p ? p[1] : 'Consigné';
}

/* Une entrée se lit en une ligne : sa première phrase, ou ce qui
   tient en cent soixante-dix signes. Les entrées venues du cockpit
   sont écrites pour tenir ainsi ; celles écrites à la main sont
   parfois des paragraphes entiers, et c'est le dépliage qui les
   rend. On ne coupe pas sur un point trop précoce — « Dr. Martin »
   n'est pas une fin de phrase. */
function resumeMC(t){
  const s = String(t || '').replace(/\s+/g, ' ').trim();
  if(!s) return '—';
  const m = s.match(/^.{40,}?[.!?](?=\s|$)/);
  let r = m ? m[0] : s;
  if(r.length > 170) r = r.slice(0, 168).replace(/\s+\S*$/, '') + '…';
  return r;
}
/* Y a-t-il quelque chose de plus à lire que la ligne ? Sans quoi
   le bouton « Détail » ne mènerait nulle part. */
const plusQueLeResumeMC = o =>
  String(o.suite || '').trim() !== '' ||
  resumeMC(o.evenement) !== String(o.evenement || '').replace(/\s+/g, ' ').trim();

function vueCourante(){
  const toutes = chrono('courante', etat.courante);
  const presents = MC_TYPES.map(x => x[0]).filter(t => toutes.some(o => typeMC(o) === t));
  if(filtreMC !== 'Tout' && presents.indexOf(filtreMC) < 0) filtreMC = 'Tout';
  const lignes = filtreMC === 'Tout' ? toutes : toutes.filter(o => typeMC(o) === filtreMC);
  const dh = venuesDuDehors().length;
  const n = toutes.length;

  let h = `<h1>Main courante</h1>
  <p class="chapo">${CHAMPS.courante.chapo}</p>
  <div class="barre-h">
    <span class="cpt-h">${n} entrée${n > 1 ? 's' : ''} · de la plus récente à la plus ancienne${
      dh ? ` · ${dh} venue${dh > 1 ? 's' : ''} du dehors` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('courante')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('courante')">Ajouter une entrée</button>
  </div>`;

  if(presents.length > 1)
    h += `<div class="filtres">${['Tout', ...presents].map(t =>
      `<button class="${filtreMC === t ? 'on' : ''}" onclick="filtrerMC('${esc(t)}')">${esc(t)}${
        t === 'Tout' ? '' : ` <span style="opacity:.6">${toutes.filter(o => typeMC(o) === t).length}</span>`
      }</button>`).join('')}</div>`;

  h += barreOrdre('courante');

  if(!lignes.length)
    return h + `<div class="carte"><p class="vide">${n
      ? "Aucune entrée de cette nature. <a href=\"#\" onclick=\"filtrerMC('Tout');return false;\">Tout afficher</a>."
      : "Rien de consigné pour l'instant. La main courante se remplit d'elle-même dès qu'une page du cockpit enregistre quelque chose ; le bouton « Ajouter une entrée » sert à ce qui n'a pas de page."}</p></div>`;

  /* Classée à la main, la main courante ne suit plus les jours :
     les intertitres de journée n'ont plus rien à séparer, et
     chaque ligne porte alors sa date entière. */
  const manuel = estManuel('courante');
  let jour = null;
  h += `<div class="carte"><ul class="fil">`;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<li class="jour"><div class="h"></div><div class="c"><span class="n">${esc(frdateJour(jour))}</span>${
        jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : ''}</div></li>`;
    }

    const t = typeMC(o);
    const src = String(o.source || '').trim();
    const ouvert = deplieesMC.has(o.id);
    const saisiLe = horodateSaisie(o.quand);

    /* Le nom de qui s'en est chargé est lui-même le bouton qui le
       corrige : personne n'a à chercher où se change une
       attribution faite automatiquement. Sans nom, le bouton le dit
       et attend qu'on le nomme. */
    const qui = String(o.qui || '').trim();
    const signature = `<button class="qui${qui ? '' : ' vide'}" onclick="ouvrirQui('${o.id}')"
      title="Changer la personne en charge">${esc(qui || 'personne nommée')}</button>`;

    const pied = [o.auteur ? 'saisi par ' + o.auteur + (saisiLe ? ' le ' + saisiLe : '')
                           : (saisiLe ? 'saisi le ' + saisiLe : ''),
                  o.modifiePar ? 'modifié par ' + o.modifiePar : '']
      .filter(Boolean).map(x => `<span class="sep">·</span>${esc(x)}`).join('');

    h += `<li><div class="h">${esc(manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' ') : (o.heure || '—'))}</div>
      <div class="c">
        <div class="tete">
          <span class="etiq ${MC_COUL(t)}">${esc(t)}</span>
          ${src ? `<span class="venu"><span class="p">Du dehors</span>${esc(src)}</span>` : ''}
          <span class="out">
            ${/* Pas de flèches ici : une main courante est datée, et
                 c'est la date qui la classe. Les monter et descendre
                 une à une au milieu de trois cents entrées ferait
                 perdre le regroupement par journée, qui est ce qu'on
                 vient lire. Le bandeau d'ordre manuel reste affiché
                 pour qui aurait déjà déplacé quelque chose, et permet
                 de revenir au tri par date. */''}
            ${boutonRetenu('courante', o)}
            <button title="Modifier l'entrée" onclick="ouvrirEdition('courante','${o.id}')">✎</button>
            <button class="sup" title="Supprimer" onclick="supprimer('courante','${o.id}')">×</button>
          </span>
        </div>
        <div class="t">${esc(resumeMC(o.evenement))}</div>
        <div class="s">${signature}${pied}${plusQueLeResumeMC(o)
          ? `<span class="sep">·</span><button class="plus" onclick="deplierMC('${o.id}')">${
              ouvert ? 'replier' : 'détail'}</button>` : ''}</div>
        ${plusQueLeResumeMC(o) ? `<div class="plein${ouvert ? '' : ' plie'}">
          <span class="k">Ce qui s'est passé</span>${esc(o.evenement || '—')}${
          String(o.suite || '').trim() ? `<span class="k">Suite donnée</span>${esc(o.suite)}` : ''}</div>` : ''}
        ${marqueRetenue(o)}
      </div></li>`;
  });
  return h + `</ul></div>`;
}

function filtrerMC(t){ filtreMC = t; rendre(); }
function deplierMC(id){
  if(deplieesMC.has(id)) deplieesMC.delete(id); else deplieesMC.add(id);
  rendre();
}

/* ---- corriger la personne en charge -----------------------
   Une entrée déposée par le cockpit porte le nom de la session
   qui l'a créée : c'est juste dans la plupart des cas, et faux
   dès qu'une personne saisit ce qu'une autre a fait. Le nom se
   change donc partout, y compris sur les entrées automatiques —
   et une fois changé à la main il ne se laisse plus réécrire par
   la fiche d'origine, ce que dit « quiFixe ». */
function ouvrirQui(id){
  const o = (etat.courante || []).find(x => x.id === id);
  if(!o) return;
  const noms = nomsMissionnes();
  document.getElementById('modale').innerHTML = `<h3>Qui s'en est chargé</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">${esc(resumeMC(o.evenement))}</p>
  <div class="form">
    <label class="large"><span class="k">Personne en charge</span>
      <input type="text" id="qui-nom" list="qui-l" autocomplete="off" value="${esc(o.qui || '')}"
        placeholder="Prénom et nom">
      <datalist id="qui-l">${noms.map(x => `<option value="${esc(x)}"></option>`).join('')}</datalist>
      <span class="aide">Laissé vide, l'entrée reste sans personne nommée. Un nom saisi ici tient : la fiche d'origine ne le réécrira plus.</span></label>
  </div>
  <div class="actions">
    <button class="btn" onclick="validerQui('${id}')">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
  </div>`;
  ouvrirRideau();
  setTimeout(() => { const i = document.getElementById('qui-nom'); if(i) i.focus({preventScroll:true}); }, 60);
}

async function validerQui(id){
  const o = (etat.courante || []).find(x => x.id === id);
  if(!o) return;
  const champ = document.getElementById('qui-nom');
  const nom = champ ? champ.value.trim() : '';
  o.qui = nom;
  o.quiFixe = true;
  o.modifiePar = moi;
  await sauver(); fermer(); rendre();
  toast(nom ? "Entrée attribuée à " + nom : "L'entrée ne nomme plus personne");
}

function vueAppels(){
  const l = etat.cpts || [];
  const ordre = {"Prioritaire":0, "À suivre":1, "Pour information":2};
  const tri = [...l].sort((a,b) => (ordre[a.priorite]??3) - (ordre[b.priorite]??3) || a.nom.localeCompare(b.nom,'fr'));
  const faits = l.filter(x => x.appels && x.appels.length).length;
  const nbApp = l.reduce((a,x) => a + ((x.appels||[]).length), 0);

  let h = `<h1>Contact avec les CPTS</h1>
  <p class="chapo">Les CPTS avec lesquelles la CPTS Pau Béarn se coordonne sur l'épisode caniculaire — l'InterCPTS des Pyrénées-Atlantiques d'abord, les voisines ensuite. On prend des nouvelles, on mutualise ce qui peut l'être, et on n'annonce pas de moyens qu'on n'a pas. Chaque échange se consigne, même quand la réponse est « rien ».</p>
  <div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${l.length}</div><div class="l">CPTS répertoriées</div></div>
    <div class="compteur"><div class="n">${faits}</div><div class="l">déjà contactées</div></div>
    <div class="compteur"><div class="n">${nbApp}</div><div class="l">appels consignés</div></div>
  </div>
  <div class="note">Les coordonnées proviennent d'annuaires publics et ne sont pas toutes à jour. Les noms des coordinatrices et des présidents ne sont pas publiés : le plus rapide est de les obtenir auprès de Claire (Agora Lib), puis de les renseigner ici.</div>
  <div class="barre-h"><button class="btn sec" onclick="exporterAppels()">Excel</button><button class="btn sec" onclick="imprimer()">PDF</button><button class="btn" onclick="ouvrirCpts()">Ajouter une CPTS</button></div>
  <div class="cptsl">`;

  tri.forEach(c => {
    const cl = c.priorite === 'Prioritaire' ? 'feu' : c.priorite === 'À suivre' ? 'proche' : '';
    const app = antechrono(c.appels);
    h += `<div class="cptsc ${cl} ${app.length?'fait':''}">
      <div><div class="nom">${esc(c.nom)}</div><div class="terr">${esc(c.territoire)}</div></div>
      <div class="rangee">
        <span class="etiq ${c.priorite==='Prioritaire'?'e-bloque':c.priorite==='À suivre'?'e-attente':'e-lancer'}">${esc(c.priorite)}</span>
        ${c.contact?`<span class="terr">Contact : ${esc(c.contact)}</span>`:''}
      </div>
      ${c.note?`<div class="obs">${esc(c.note)}</div>`:''}
      <div class="rangee">
        ${c.tel?`<a class="tel" href="tel:${esc(c.tel.replace(/[^0-9+]/g,''))}">Appeler ${esc(c.tel)}${c.telLibelle?`<small>${esc(c.telLibelle)}</small>`:''}</a>`:`<button class="btn sec" style="flex:1;min-width:150px;min-height:44px" onclick="ouvrirTel('${c.id}')">Ajouter le numéro</button>`}
        ${c.tel2?`<a class="tel second" href="tel:${esc(c.tel2.replace(/[^0-9+]/g,''))}">Appeler ${esc(c.tel2)}${c.tel2Libelle?`<small>${esc(c.tel2Libelle)}</small>`:''}</a>`:''}
        <button class="corriger" onclick="ouvrirTel('${c.id}')">Corriger le numéro</button>
      </div>
      ${c.telMaj?`<div class="telmaj">Numéro corrigé le ${frdate(c.telMaj.date)} par ${esc(c.telMaj.par||'—')}${c.telMaj.source?` · ${esc(c.telMaj.source)}`:''}</div>`:''}

/* L'entrée garde la date et l'heure du fait, pas celles de la
   frappe : une fiche corrigée le lendemain ne doit pas remonter en
   tête de la journée. Une entrée sans heure se range en fin de
   journée, ce qui vaut mieux qu'une heure inventée. */
function poserEnCourante(id, t){
  etat.courante = etat.courante || [];
  etat.retires = etat.retires || [];
  if(etat.retires.includes(id)) return;
  const deja = etat.courante.find(x => x.id === id);
  const ligne = {
    id,
    type: t.type || (deja && deja.type) || 'Consigné',
    date: t.date || (deja && deja.date) || aujourdhui(),
    /* L'heure vient de la fiche d'origine quand celle-ci en porte une
       — corriger l'heure d'une remontée corrige son entrée de main
       courante. Les fiches qui n'en portent pas laissent intacte
       l'heure notée à la main dans la main courante. */
    heure: t.heure || (deja ? deja.heure : ''),
    source: t.source || '', evenement: t.evenement, suite: t.suite,
    /* Une attribution corrigée à la main tient : la fiche d'origine
       ne la réécrit plus, même si elle est enregistrée à nouveau
       depuis une autre session. C'est ce que dit « quiFixe », posé
       par la correction et jamais par le cockpit.

       À défaut de nom sur la fiche, c'est la session qui écrit qui
       s'en est chargée — sauf quand la fiche est formelle : une
       inscription arrivée par le formulaire public n'a été menée
       par personne de la CPTS, et l'attribuer à qui ouvre le
       cockpit serait faux. « quiStrict » le dit, et l'entrée
       attend alors qu'on la nomme. */
    qui: (deja && deja.quiFixe) ? deja.qui
       : (t.qui || (deja && deja.qui)
          || (t.quiStrict ? '' : (moi === 'Anonyme' ? '' : moi))),
    auteur: (deja && deja.auteur) || (moi === 'Anonyme' ? '' : moi),
    quand: (deja && deja.quand) || ''
  };
  if(deja) Object.assign(deja, ligne);
  else etat.courante.unshift(ligne);
}
/* ---- ce que chaque registre laisse en main courante --------
   Règle du cockpit : ce qui est renseigné quelque part se retrouve
   en main courante, en plus de sa rubrique. Un registre inscrit ici
   y laisse une ligne, une seule, écrite pour tenir sur une ligne.

   Chaque registre ne dit ici que trois choses : sa nature, le nom
   de qui s'en est chargé, et la phrase qui résume la fiche. Le
   reste — l'idempotence, l'heure du fait, l'attribution corrigée à
   la main — est l'affaire de poserEnCourante().

   Les rubriques d'action de la canicule s'ajouteront ici, une clé
   chacune, le jour où elles seront arrêtées. */
const MC_REG = {
  /* Un échange né d'une visio de crise en est déjà sorti consigné,
     avec son compte rendu : on ne le réécrit pas ici, où il ne
     dirait rien de plus et ferait doublon. */
  ars: {
    type:'ARS', personne:o => o.auteur,
    phrase:o => o.visio ? '' :
      `${o.sens || "Échange avec l'ARS"} — ${o.objet || 'objet non renseigné'}`
      + (o.interlocuteur ? ` (${o.interlocuteur})` : '') + '.'
  }
};

const idMCReg = (k, o) => 'mcr-' + k + '-' + o.id;

function consignerRegistreEnCourante(k, o){
  const cfg = MC_REG[k];
  if(!cfg || !o || !o.id) return;
  let phrase = '';
  try{ phrase = cfg.phrase(o); }catch(e){ return; }
  if(!String(phrase || '').trim()) return;
  poserEnCourante(idMCReg(k, o), {
    type: cfg.type,
    date: o.date || '',
    heure: o.heure || '',
    qui: (cfg.personne ? cfg.personne(o) : '') || '',
    quiStrict: true,
    /* Pas de source : ces fiches sont notre propre recensement, pas
       une information qu'on nous a communiquée. Celles qui viennent
       vraiment du dehors — un donateur, une structure — le disent
       dans leur phrase, et non par un bandeau qui les compterait à
       tort comme remontées de terrain. */
    source: '',
    evenement: phrase,
    suite: ''
  });
}

/* Les fiches arrivées sans passer par le cockpit — le formulaire
   public en ligne, la saisie d'une autre session — n'ont pas
   déclenché leur consignation. On les y porte une fois, à
   l'ouverture, à la date du fait. Une entrée déjà là est réécrite
   plutôt que doublée ; une entrée retirée à la main ne revient
   pas. */
function consignerRegistresHerites(){
  Object.keys(MC_REG).forEach(k => {
    (etat[k] || []).forEach(o => consignerRegistreEnCourante(k, o));
  });
}
let rapport = '';
let brouillonSit = null;
let genreChoisi = '';

function ouvrirRapport(id){
  if(enChantier('rapports')) return aller('cockpit');
  onglet = 'rapports'; rapport = id; rendre(); window.scrollTo(0,0);
}

/* --- Le geste : une étoile, cinq sorties ------------------
   Deux étoiles séparées — une pour le point de situation, une pour
   le RETEX — et plus personne ne marque rien. Il n'y en a donc
   qu'une, et c'est au clic qu'on dit ce que l'entrée doit devenir. */
const RETENUS = [
  {id:'fait',     l:"Fait marquant",     ou:"Point de situation", d:"Ce qui a changé la situation, ou ce que la CPTS a engagé."},
  {id:'marche',   l:"Ce qui a marché",   ou:"RETEX",              d:"Un circuit, un réflexe ou un appui qui a tenu."},
  {id:'manque',   l:"Ce qui a manqué",   ou:"RETEX",              d:"Une information, un moyen ou un interlocuteur qui a fait défaut."},
  {id:'changer',  l:"À changer",         ou:"RETEX",              d:"Ce qu'on ferait autrement la prochaine fois."},
  {id:'doctrine', l:"Point de doctrine", ou:"Plan SSE",           d:"Une règle apprise ici, qui doit figurer dans une fiche."}
];
const RETENU_DE = id => RETENUS.find(x => x.id === id) || null;

/* Les collections où l'étoile se pose. Chacune dit seulement où
   lire son titre : le reste du module ne connaît plus que cette
   forme-là, et une nouvelle collection s'y ajoute en une ligne. */
const SOURCES_RET = {
  courante: {l:"Main courante",           titre:o => o.evenement},
  ars:      {l:"Échange avec l'ARS",      titre:o => o.objet},
  visios:   {l:"Visio de crise de l'ARS", titre:o => o.instance || "Visio de crise de l'ARS"}
};

/* Tout ce qui a été retenu, à plat et dans l'ordre des faits.
   La marque vit sur l'entrée elle-même : rien n'est recopié, et
   supprimer une entrée emporte sa marque — il n'y a pas d'orphelin
   à gérer. */
function marquesRetenues(genres){
  const out = [];
  Object.keys(SOURCES_RET).forEach(k => {
    (etat[k] || []).forEach(o => {
      const r = o.retenu;
      if(!r || !r.genre) return;
      if(genres && genres.indexOf(r.genre) < 0) return;
      out.push({k, id:o.id, source:SOURCES_RET[k].l, titre:SOURCES_RET[k].titre(o) || '—',
        date:o.date || '', heure:o.heure || '', genre:r.genre,
        note:r.note || '', par:r.par || '', quand:r.quand || ''});
    });
  });
  return out.sort((a,b) => (a.date + ' ' + a.heure).localeCompare(b.date + ' ' + b.heure));
}

function boutonRetenu(k, o){
  if(enChantier('rapports')) return '';
  const on = !!(o.retenu && o.retenu.genre);
  const g = on ? RETENU_DE(o.retenu.genre) : null;
  return `<button class="ret-b${on ? ' on' : ''}" title="${on
    ? 'Retenu — ' + esc(g ? g.l : '') : "Retenir pour les rapports"}"
    onclick="ouvrirRetenu('${k}','${o.id}')">${on ? '★' : '☆'}</button>`;
}

function marqueRetenue(o){
  if(enChantier('rapports')) return '';
  const r = o && o.retenu;
  if(!r || !r.genre) return '';
  const g = RETENU_DE(r.genre);
  const dit = String(r.note || '').trim();
  return `<div class="ret-m">
    <span class="g">${esc(g ? g.l : r.genre)}</span>
    <span class="t">${dit ? esc(dit) : `Retenu pour « ${esc(g ? g.ou : '')} »`}${
      r.par ? ' <span style="color:var(--texte-2)">— ' + esc(r.par) + '</span>' : ''}</span></div>`;
}

function ouvrirRetenu(k, id){
  const o = (etat[k] || []).find(x => x.id === id);
  const cfg = SOURCES_RET[k];
  if(!o || !cfg) return;
  const r = o.retenu || {};
  genreChoisi = r.genre || '';
  document.getElementById('modale').innerHTML = `<h3>Retenir pour les rapports</h3>
    <p style="color:var(--texte-2);margin:0 0 8px;font-size:13px">${esc(cfg.l)}${o.date ? ' · ' + frdateL(o.date) : ''}</p>
    <div class="rappel" style="margin-bottom:14px">${esc(cfg.titre(o) || '—')}</div>
    <p style="color:var(--texte-2);margin:0 0 10px;font-size:13.5px">Ce que cette entrée doit devenir. Elle n'est recopiée nulle part : elle reste écrite ici, et le rapport vient la chercher.</p>
    <div class="gen-l">${RETENUS.map(x => `<label class="${genreChoisi === x.id ? 'sel' : ''}" onclick="choisirGenre('${x.id}')">
      <input type="radio" name="gen-ret" value="${x.id}"${genreChoisi === x.id ? ' checked' : ''}>
      <span><b>${esc(x.l)}</b><span class="ou">${esc(x.d)} → ${esc(x.ou)}</span></span>
    </label>`).join('')}</div>
    <label class="large"><span class="k">Ce qu'il faut en retenir</span>
      <textarea id="ret-note" rows="3" placeholder="Facultatif, mais c'est ce qui fera la valeur du rapport : une phrase pour qui le lira sans avoir vécu la scène.">${esc(r.note || '')}</textarea></label>
    <div class="actions">
      <button class="btn" onclick="validerRetenu('${k}','${id}')">Retenir</button>
      ${r.genre ? `<button class="btn sec" onclick="retirerRetenu('${k}','${id}')">Ne plus retenir</button>` : ''}
      <button class="btn sec" onclick="fermer()">Annuler</button>
    </div>`;
  ouvrirRideau();
}

function choisirGenre(g){
  genreChoisi = g;
  document.querySelectorAll('.gen-l label').forEach(l => l.classList.remove('sel'));
  const i = document.querySelector('.gen-l input[value="' + g + '"]');
  if(i){ i.checked = true; i.closest('label').classList.add('sel'); }
}

async function validerRetenu(k, id){
  if(!genreChoisi){ toast("Choisissez ce que cette entrée doit devenir"); return; }
  const o = (etat[k] || []).find(x => x.id === id); if(!o) return;
  const n = document.getElementById('ret-note');
  o.retenu = {genre:genreChoisi, note:(n ? n.value : '').trim(), par:moi, quand:new Date().toISOString()};
  const g = RETENU_DE(genreChoisi);
  await sauver(); fermer(); rendre();
  toast("Retenu pour « " + (g ? g.ou : '') + " »");
}

async function retirerRetenu(k, id){
  const o = (etat[k] || []).find(x => x.id === id); if(!o) return;
  delete o.retenu;
  await sauver(); fermer(); rendre();
  toast("L'entrée ne part plus dans les rapports");
}

/* --- La page d'entrée -------------------------------------- */
/* Le bandeau de chantier. Il n'est pas décoratif : cet onglet écrit
   en main courante et dans un état partagé par toute l'équipe, et
   personne d'autre ne le voit pour l'instant. Ce qui s'y fait doit
   donc se savoir. */
function bandeauChantier(){
  return `<div class="chantier">
    <span class="p">En construction</span>
    <span class="t">Cet onglet est ouvert en maquette, sur cet appareil seulement — le reste de l'équipe ne le voit pas, et les étoiles de marquage n'apparaissent nulle part ailleurs dans le cockpit. Ce qui est enregistré ici l'est pour de bon et part sur le serveur : un point de situation arrêté s'inscrit en main courante comme n'importe quelle autre entrée. Pour refermer le chantier sur cet appareil, ajouter <code>?maquette=0</code> à l'adresse.</span>
  </div>`;
}

function vueRapports(){
  const ch = bandeauChantier();

  return ch + `<h1>Rapports</h1>
  <p class="chapo">Ce que cette crise laisse derrière elle. Quatre documents tirés du même fonds : le point de situation qu'on arrête à une date, la matière du retour d'expérience, les projets de fiches pour le plan SSE, et le dossier de traçabilité complet. Aucun ne se rédige de zéro — ils se remplissent de ce qui est déjà consigné, et de ce que vous marquez d'une étoile au fil de l'eau.</p>

  <div class="note">L'étoile ☆ est posée sur chaque entrée de la <a href="#" onclick="aller('courante');return false;">main courante</a>, des <a href="#" onclick="aller('ars');return false;">échanges avec l'ARS</a> et des visios de crise. Un clic, cinq secondes : on dit si l'entrée est un fait marquant, ce qui a marché, ce qui a manqué, ce qu'on changera, ou un point de doctrine. Les quatre rapports se remplissent seuls à partir de là.</p></div>

  <div class="rapports">
    ${carte('situations', "Points de situation",
      "Le rapport détaillé, arrêté à une date et signé : la situation, les consignes, les chiffres, l'état de chaque mission avec sa prochaine action, ce qui reste en suspens, et les faits marquants depuis le point précédent. Export PDF et Word.",
      sit.length
        ? `${sit.length} point${sit.length>1?'s':''} arrêté${sit.length>1?'s':''} · dernier le ${frdateL(der.quand.slice(0,10))}${neufs ? ` · ${neufs} fait${neufs>1?'s':''} marquant${neufs>1?'s':''} depuis` : ''}`
        : (neufs ? `Aucun point arrêté · ${neufs} fait${neufs>1?'s':''} marquant${neufs>1?'s':''} en attente` : "Aucun point arrêté"),

      rx ? `${rx} élément${rx>1?'s':''} versé${rx>1?'s':''} au retour d'expérience` : "Rien versé au RETEX pour l'instant",

      "Les fiches mission, déjà écrites à quatre cinquièmes dans le cockpit, et les fiches réflexes rangées par déclencheur — non par action, pour qu'elles servent aussi à la canicule. Export Word, à coller dans le plan en cours de rédaction.",
      `${(etat.missions||[]).length} fiche${(etat.missions||[]).length>1?'s':''} mission · ${DECLENCHEURS.length} déclencheurs${doc ? ` · ${doc} point${doc>1?'s':''} de doctrine` : ''}`,

/* --- Points de situation ----------------------------------- */
function situationsTriees(){
  return (etat.situations || []).slice().sort((a,b) => String(b.quand||'').localeCompare(String(a.quand||'')));
}
function faitsDepuis(depuis){
  return marquesRetenues(['fait']).filter(x => !depuis || String(x.quand || '') > depuis);
}

function vueSituations(){
  const sit = situationsTriees();
  const der = sit[0] || null;
  const neufs = faitsDepuis(der ? der.quand : '');

  let h = `<button class="retour-r" onclick="aller('rapports')">Revenir à tous les rapports</button>
  <h1>Points de situation</h1>
  <p class="chapo">Un point de situation dit où en est la CPTS à une date, pour quelqu'un qui n'a pas suivi. On l'arrête quand on veut : il se fige, il s'archive, et le suivant repart de là. C'est la succession de ces points qui montre le chemin parcouru — et c'est elle, bien plus que le dernier état, qui servira au retour d'expérience.</p>
  <div class="barre-h">
    <span class="cpt-h">${sit.length} point${sit.length>1?'s':''} arrêté${sit.length>1?'s':''}${
      neufs.length ? ` · ${neufs.length} fait${neufs.length>1?'s':''} marquant${neufs.length>1?'s':''} depuis le dernier` : ''}</span>
    <button class="btn" onclick="preparerSituation()">Préparer un point de situation</button>
  </div>`;

  if(!neufs.length){
    h += `<div class="note">Aucun fait marquant retenu ${der ? 'depuis le point du ' + frdateL(der.quand.slice(0,10)) : 'pour l\'instant'}. Le point se prépare quand même — il portera les chiffres, l'état des missions et ce qui reste en suspens — mais il ne dira pas ce qu'il faut en retenir. C'est l'étoile ☆ posée en main courante qui lui donne son corps.</div>`;
  }

  if(!sit.length){
    h += `<div class="carte"><p class="vide">Aucun point de situation arrêté. Le premier fixera le point de départ : tout ce qui sera retenu ensuite se comptera à partir de sa date.</p></div>`;
  }else{
    h += `<div class="carte"><ul class="fil">` + sit.map(s => `<li>
      <div class="h">${frdate(s.quand.slice(0,10))}<br><span style="font-family:var(--mono);font-size:10.5px">${esc(s.ref)}</span></div>
      <div class="c">
        <div class="t">${esc(s.phrase) || 'Point de situation'}</div>
        <div class="d">${s.faits.length} fait${s.faits.length>1?'s':''} marquant${s.faits.length>1?'s':''} · ${
          s.missions.filter(m => m.statut === 'En cours').length} mission${s.missions.filter(m => m.statut === 'En cours').length>1?'s':''} en cours · ${

        </div>
      </div></li>`).join('') + `</ul></div>`;

  return h;
}

/* Le brouillon se construit à l'ouverture, jamais avant : il ne
   peut donc pas être en retard sur ce qui a été saisi entre-temps. */
function brouillonSituation(){
  const sit = situationsTriees();
  const der = sit[0] || null;
  const depuis = der ? der.quand : '';

  const ch = [
    {n: etat.missions.filter(m => m.statut === 'En cours').length, l:"missions en cours"},
    {n: etat.missions.filter(m => !m.pilote).length,               l:"missions sans pilote désigné"},
    {n: (etat.cpts || []).length,                                  l:"CPTS contactées"},
    {n: venuesDuDehors().length,                                   l:"remontées de terrain"},
    {n: (etat.courante || []).length,                              l:"entrées en main courante"}
  ];
  const suspens = [];
  (etat.ars || []).filter(a => a.statut === 'À faire' || a.statut === 'En attente').forEach(a =>
    suspens.push({quoi:"ARS — " + (a.objet || '—'),
      detail:[a.sens, a.interlocuteur, a.statut, a.attendu].filter(Boolean).join(' · ')}));
  etat.missions.filter(m => !m.pilote).forEach(m =>
    suspens.push({quoi:"Mission sans pilote — " + m.titre, detail:m.prochaine || "Prochaine action à écrire."}));
  etat.missions.filter(m => m.statut === 'Bloqué').forEach(m =>
    suspens.push({quoi:"Mission bloquée — " + m.titre, detail:m.prochaine || ''}));

  return {
    id: uid(),
    ref: 'PS-2026-' + String((etat.situations || []).length + 1).padStart(2, '0'),
    quand: new Date().toISOString(),
    par: moi,
    depuis, depuisRef: der ? der.ref : '',
    niveau: etat.entete.niveau, phrase: etat.entete.phrase,
    faire: etat.consignes.faire.slice(), eviter: etat.consignes.eviter.slice(),
    chiffres: ch,
    missions: etat.missions.map(m => ({titre:m.titre, pilote:m.pilote, suppleant:m.suppleant,
      statut:m.statut, prochaine:m.prochaine})),
    faits: faitsDepuis(depuis).map(f => ({date:f.date, heure:f.heure, source:f.source,
      titre:f.titre, note:f.note, par:f.par})),
    suspens,
    analyse: ''
  };
}

  <h2>6 · Ce qui reste en suspens</h2>
  ${s.suspens.length ? `<table>
    <thead><tr><th style="width:42%">Objet</th><th>Où ça en est</th></tr></thead>
    <tbody>${s.suspens.map(x => `<tr><td><b>${esc(x.quoi)}</b></td><td>${esc(x.detail) || '—'}</td></tr>`).join('')}</tbody>
  </table>` : `<p class="vide">Rien en suspens : aucune mission sans pilote, aucun échange en attente auprès de l'ARS.</p>`}

  <h2>7 · Ce qu'on en retient</h2>
  ${modifiable
    ? `<div id="ps-analyse" contenteditable="true" style="min-height:76px;border:1px dashed #98A6BA;border-radius:6px;padding:10px 12px;font-size:13px">${esc(s.analyse || '')}</div>`
    : (String(s.analyse || '').trim()
        ? `<p>${esc(s.analyse).replace(/\n/g, '<br>')}</p>`
        : `<p class="vide">Rien n'a été ajouté à la main sur ce point.</p>`)}

  <div class="pied">Point de situation établi à partir du cockpit de crise de la CPTS Pau Béarn. Les chiffres et l'état des missions sont ceux enregistrés à la date d'arrêt ; les faits marquants sont ceux que l'équipe a expressément retenus. Un exemplaire est conservé au dossier de traçabilité de la CPTS.${
    s.fige ? '' : ' Document en préparation : il n\'est pas encore arrêté.'}</div>`;
}

function preparerSituation(){
  brouillonSit = brouillonSituation();
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<div class="acte">${corpsSituation(brouillonSit, 'ecran')}</div>
  <div class="actions">
    <button class="btn" onclick="arreterSituation()">Arrêter ce point de situation</button>
    <button class="btn sec" onclick="imprimerModale()">Imprimer ou enregistrer en PDF</button>
    <button class="btn sec" onclick="exporterSituationWord('')">Word</button>
    <button class="btn sec" onclick="fermer()">Fermer sans arrêter</button>
  </div>`;
  ouvrirRideau();
  toast("Le paragraphe « Ce qu'on en retient » s'écrit directement à l'écran");
}

function voirSituation(id){
  const s = (etat.situations || []).find(x => x.id === id); if(!s) return;
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<div class="acte">${corpsSituation(s, 'ecran')}</div>
  <div class="actions">
    <button class="btn" onclick="imprimerModale()">Imprimer ou enregistrer en PDF</button>
    <button class="btn sec" onclick="exporterSituationWord('${s.id}')">Word</button>
    <button class="btn sec" onclick="fermer()">Fermer</button>
  </div>`;

}

/* Arrêter, c'est figer. Le document ne se recalculera plus : il
   restera ce que la CPTS savait ce jour-là, y compris si ce qu'elle
   savait était faux. C'est précisément ce qu'un REX cherche. */
async function arreterSituation(){
  if(!brouillonSit) return;
  const el = document.getElementById('ps-analyse');
  const s = brouillonSit;
  s.analyse = el ? el.innerText.trim() : '';
  s.fige = true;
  s.par = moi;
  s.quand = new Date().toISOString();

  etat.situations = etat.situations || [];
  etat.situations.push(s);

  const n = s.faits.length, sp = s.suspens.length;
  etat.courante.unshift({
    id: uid(), type: 'Rapport', date: aujourdhui(), heure: new Date().toTimeString().slice(0,5), source:'',
    evenement: `Point de situation ${s.ref} arrêté : ${n} fait${n>1?'s':''} marquant${n>1?'s':''} retenu${n>1?'s':''}, ${
      s.missions.filter(m => m.statut === 'En cours').length} missions en cours, ${sp} point${sp>1?'s':''} en suspens.`,
    suite: "Le document est figé et archivé dans « Rapports », feuillet « Points de situation ». Il ne se recalcule plus : le prochain point repartira de cette date.",
    qui: '', auteur: moi, quand: new Date().toISOString()
  });

  brouillonSit = null;
  await sauver(); fermer(); rendre();
  toast("Point de situation arrêté et consigné en main courante");
}

function exporterSituationWord(id){
  let s;
  if(id){ s = (etat.situations || []).find(x => x.id === id); }
  else {
    s = brouillonSit;
    const el = document.getElementById('ps-analyse');
    if(s && el) s.analyse = el.innerText.trim();
  }
  if(!s) return;
  telechargerWord("Point de situation " + s.ref, "Point de situation — CPTS Pau Béarn",
    corpsSituation(s, 'word'));
}

/* --- Word sans bibliothèque --------------------------------
   Un document HTML que Word ouvre, met en page et laisse modifier.
   Rien à charger depuis un CDN, rien à installer : le cockpit doit
   pouvoir sortir un document depuis un poste qui n'a que son
   navigateur. */
function telechargerWord(nom, titre, corps){
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(titre)}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
<style>
@page{size:A4 portrait;margin:2cm}
body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#101820;line-height:1.4}
h1,.ttl{font-size:17pt;margin:0 0 2pt;text-transform:uppercase;font-weight:bold}
.ss{font-size:9.5pt;color:#5A6A7C;margin:0 0 14pt}
h2{font-size:10pt;text-transform:uppercase;letter-spacing:.05em;color:#1F3B5B;border-bottom:1px solid #C6D0DC;padding-bottom:3pt;margin:15pt 0 6pt}
.ent{border-bottom:2px solid #101820;padding-bottom:6pt;margin-bottom:12pt;font-size:9pt}
.ent .g,.ent .d{display:inline-block;vertical-align:top}
.ent .d{float:right;text-align:right}
.org{font-size:12.5pt;font-weight:bold}
.sub{font-size:8.5pt;color:#5A6A7C}
.ref{font-family:Consolas,monospace;font-size:9.5pt}
.ctx{background:#EEF3F9;border-left:3px solid #1F3B5B;padding:8pt 10pt;margin-bottom:10pt;font-size:10pt}
table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4pt 0}
th{background:#EEF3F9;border:1px solid #C6D0DC;padding:4pt 6pt;text-align:left;font-size:8.5pt;text-transform:uppercase;color:#5A6A7C}
td{border:1px solid #C6D0DC;padding:4pt 6pt;vertical-align:top}
ul,ol{margin:3pt 0;padding-left:15pt}
li{margin-bottom:3pt}
p{margin:4pt 0}
.vide{color:#5A6A7C;font-style:italic}
.pied{border-top:1px solid #C6D0DC;margin-top:15pt;padding-top:6pt;font-size:8.5pt;color:#5A6A7C}
</style></head><body>${corps}</body></html>`;
  const b = new Blob(['\uFEFF' + html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') + '-' + aujourdhui() + '.doc';
  a.click();
  toast("Document Word téléchargé — il s'ouvre et se modifie normalement");
}

/* --- Matière pour le RETEX ---------------------------------
   Trois colonnes que la machine ne saura jamais remplir seule, et
   une chronologie qu'elle est seule à pouvoir tenir sans rien
   oublier. Le document fini viendra ; ce qui presse, c'est que la
   matière ne se perde pas. */
function vueRetex(){
  const cols = [
    {g:'marche',  t:"Ce qui a marché",  s:"Les circuits, les réflexes et les appuis qui ont tenu. À reconduire tels quels dans le plan."},
    {g:'manque',  t:"Ce qui a manqué",  s:"Les informations, les moyens et les interlocuteurs qui ont fait défaut, et à quel moment."},
    {g:'changer', t:"À changer",        s:"Ce qu'on ferait autrement. C'est ce qui deviendra une ligne du plan SSE."}
  ];
  const tout = marquesRetenues(['marche','manque','changer']);

  let h = `<button class="retour-r" onclick="aller('rapports')">Revenir à tous les rapports</button>
  <h1>Matière pour le RETEX</h1>
  <p class="chapo">Le retour d'expérience s'écrira à froid, en septembre. Ce qui ne peut pas attendre, c'est la matière : ce qui a marché, ce qui a manqué, ce qu'on fera autrement. Ça s'oublie en deux semaines, et aucun compteur ne le retrouvera. Cette page ne rédige rien — elle ramasse, pendant que c'est encore chaud.</p>
  <div class="barre-h">
    <span class="cpt-h">${tout.length} élément${tout.length>1?'s':''} versé${tout.length>1?'s':''} au retour d'expérience</span>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn sec" onclick="exporterRetexWord()">Word</button>
  </div>`;

  h += `<div class="note">La chronologie complète, les décisions et les délais se calculent seuls à partir de la main courante — ils seront repris dans le document final sans que personne n'ait à les ressaisir. Les trois colonnes ci-dessous sont les seules qui dépendent de vous.</div>`;

  cols.forEach(c => {
    const l = marquesRetenues([c.g]);
    h += `<h2 style="margin-top:24px">${c.t} <span class="cpt-h">${l.length}</span></h2>
    <p class="sous-h">${c.s}</p><div class="carte">`;
    if(!l.length){
      h += `<p class="vide">Rien de versé sous cette entrée. L'étoile ☆ d'une entrée de main courante permet de l'y ranger.</p>`;
    }else{
      h += `<ul class="fil">` + l.map(x => `<li>
        <div class="h">${frdate(x.date)}${x.heure ? '<br>' + esc(x.heure) : ''}</div>

/* --- Pour le plan SSE --------------------------------------
   Deux documents, deux découpes. Les fiches mission suivent ce que
   la CPTS porte durablement — elles existent déjà mot pour mot.
   Les fiches réflexes suivent le déclencheur, pas l'action : c'est
   ce qui leur permet de servir d'un épisode à l'autre, et d'une
   crise à l'autre.

   Les déclencheurs ci-dessous sont ceux de la canicule. Le champ
   `m` désigne la mission qui a déjà défriché la question ; il
   reste vide tant que les missions de cet épisode ne sont pas
   arrêtées. */
const DECLENCHEURS = [
  {id:'d1', q:"Météo-France place le département en vigilance orange ou rouge canicule",
   s:"La première heure : qui est prévenu, qui ouvre le cockpit, qui parle à l'ARS, et ce qu'on diffuse aux adhérents dès le premier jour.", m:''},
  {id:'d2', q:"Un professionnel signale une personne fragile isolée",
   s:"Où ça se consigne, qui rappelle, ce qu'on peut faire nous-mêmes et à partir de quand ça relève du CCAS, du 15 ou de l'ARS.", m:''},
  {id:'d3', q:"Un EHPAD ou une résidence autonomie signale une tension",
   s:"Ce qu'on demande avant de proposer quoi que ce soit : nombre de résidents, locaux rafraîchis, personnel présent, médecin coordonnateur joignable.", m:''},
  {id:'d4', q:"Une officine signale des ruptures ou des demandes inhabituelles",
   s:"Ce qui se remonte à l'ARS, ce qui se relaie aux confrères, et ce qui n'est qu'un fait isolé.", m:''},
  {id:'d5', q:"Les urgences ou le SAS signalent un afflux lié à la chaleur",
   s:"Ce que la médecine de ville peut absorber, et comment on le fait savoir sans promettre des créneaux qui n'existent pas.", m:''},
  {id:'d6', q:"L'ARS demande à la CPTS de relayer une consigne",
   s:"Distinguer ce qui est mandaté de ce que la CPTS entreprend d'elle-même. Qui valide avant diffusion, et par quel canal.", m:''},
  {id:'d7', q:"Un adhérent ou la presse demande une position",
   s:"Qui parle au nom de la CPTS, et ce qui ne sort pas sans validation de la gouvernance.", m:''}
];

  const doc = marquesRetenues(['doctrine']);
  const vides = DECLENCHEURS.filter(d => !d.m).length;

  let h = `<button class="retour-r" onclick="aller('rapports')">Revenir à tous les rapports</button>

  <div class="barre-h">
    <span class="cpt-h">${(etat.missions||[]).length} fiches mission · ${DECLENCHEURS.length} déclencheurs · ${doc.length} point${doc.length>1?'s':''} de doctrine</span>

  <div class="carte">`;

  h += (etat.missions || []).map(m => {

  h += `<h2 style="margin-top:26px">Fiches réflexes <span class="cpt-h">rangées par déclencheur</span></h2>

  if(vides) h += `<div class="note"><strong>${vides} déclencheurs n'ont pas d'onglet dans le cockpit.</strong> Ils se sont joués à l'instinct, dans les premières heures et au téléphone, et rien n'en a été consigné. Ce sont ceux qui manqueront le plus au plan : l'étoile ☆ « point de doctrine » est le seul moyen d'en garder quelque chose.</div>`;

      <div class="h">${frdate(x.date)}</div>

      <div class="d"><div class="sub">Édité le ${frdateL(aujourdhui())}</div></div></div>
    <h1 class="ttl">Fiches pour le plan SSE</h1>
    <div class="ss">Projets de fiches extraits du cockpit de crise. Les fiches mission sont préremplies par ce qui a réellement été fait ; les fiches réflexes restent à rédiger, rangées par déclencheur pour qu'elles servent à toute crise et non à celle-ci seulement.</div>`
    + corps + decl + doctrine
    + `<div class="pied">Document de travail. Ce qui figure ici a été écrit pendant la crise, sous contrainte de temps : à relire et à trancher à froid avant intégration au plan SSE de la CPTS Pau Béarn.</div>`);
}
function vueCollection(k){
  const cfg = CHAMPS[k];
  const n = (etat[k] || []).length;
  const j = !!JOURNAL[k];
  /* La main courante dit aussi combien de ses entrées viennent du
     dehors : c'est le compte des remontées de terrain, et il n'a
     plus de registre à lui. */
  const dh = k === 'courante' ? venuesDuDehors().length : 0;
  return `<h1>${cfg.titre}</h1><p class="chapo">${cfg.chapo}</p>
    <div class="barre-h"><span class="cpt-h">${n} ${j ? 'entrée' : 'ligne'}${n>1?'s':''}${j ? ' · de la plus récente à la plus ancienne' : ''}${dh ? ` · ${dh} venue${dh>1?'s':''} du dehors` : ''}</span>
      <button class="btn sec" onclick="exporterCSV('${k}')">Excel</button>
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('${k}')">Ajouter</button></div>
    ${barreOrdre(k)}
    ${j ? journal(k) : tableau(k)}`;
}

/* --- ce qu'une remontée de terrain est devenue --------------
   Il n'y a plus de registre « Remontées terrain » : une remontée
   est une entrée de main courante venue du dehors, et rien
   d'autre. C'était déjà le cas dans les faits — la main courante
   en portait trente et une quand le registre en comptait trois,
   et l'une recopiait l'autre. Ce qui la reconnaît tient à un seul
   champ, sa source : une décision prise entre nous n'en a pas.
   C'est ce qui se compte pour le bilan ACI et le dialogue de
   gestion. */
const venuesDuDehors = () =>
  (etat.courante || []).filter(o => String(o.source || '').trim());

function majPrintHead(){
  const el = document.getElementById('printhead');
  if(!el) return;
  const o = ONGLETS.find(x => x.id === onglet);
  el.innerHTML = `<div class="t">CPTS Pau Béarn — ${esc(o ? o.nom : 'Dossier de traçabilité')}</div>
    <div class="d">${esc(etat.entete.niveau)} · édité le ${new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${moi!=='Anonyme'?' par '+esc(moi):''}</div>`;
}

function rendre(){
  /* Une session ouverte sur un onglet remis en chantier ne doit pas
     rester bloquée dessus : elle retombe sur le cockpit. */
  if(enChantier(onglet)) onglet = 'cockpit';
  normaliserPersonnes();
  rendreNav();
  rendreMesMissions();
  const v = document.getElementById('vue');
  if(onglet === 'cockpit') v.innerHTML = vueCockpit();
  else if(onglet === 'missions') v.innerHTML = vueMissions();
  else if(onglet === 'veille') v.innerHTML = vueVeille();
  else if(onglet === 'courante') v.innerHTML = vueCourante();
  else if(onglet === 'lignes') v.innerHTML = vueLignes();
  else if(onglet === 'offre') v.innerHTML = vueOffre();
  else if(onglet === 'appels') v.innerHTML = vueAppels();
  else if(onglet === 'rapports') v.innerHTML = vueRapports();
  else v.innerHTML = vueCollection(onglet);
  v.insertAdjacentHTML('afterbegin', '<div class="entete-print" id="printhead"></div>');
  majPrintHead();
}

charger();
</script>
</body>
</html>
