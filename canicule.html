  </div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('sv-url'); if(i) i.focus({preventScroll:true}); }, 60);
}

async function enregistrerLienVisio(){
  const brut = document.getElementById('sv-url').value.trim();
  const url = lienVisioPropre(brut);
  if(brut && !url){ toast("Ce lien ne ressemble pas à une adresse web — il commence par https://"); return; }
  if(!url){ toast("Collez le lien du salon"); return; }

  etat.salleVisio = etat.salleVisio && etat.salleVisio.length ? etat.salleVisio : [{id:'sv'}];
  const s = etat.salleVisio[0];
  /* Ce qui vaut d'être consigné, c'est que le rendez-vous a changé
     — pas seulement son lien. Un passage du quotidien au jeudi
     midi déplace toute l'organisation de la semaine : il se lit en
     main courante au même titre qu'un lien déposé. */
  const avant = {url: lienVisioPropre(s.url), rec: recurrenceVisio(), heure: s.horaire || ''};
  s.url = url;
  s.recurrence = (document.getElementById('sv-recurrence') || {}).value || 'quotidien';
  s.horaire = document.getElementById('sv-horaire').value || '12:00';
  s.precision = document.getElementById('sv-precision').value.trim();
  s.maj = horodate();
  s.par = moi;
  const change = avant.url !== url;
  const bouge = change || avant.rec !== recurrenceVisio() || avant.heure !== s.horaire;

  /* Le rendez-vous de l'ARS — son lien, son rythme, son heure —
     est un fait de la journée : qui l'a déposé, et quand, se lit
     en main courante comme le reste. */
  if(bouge){
    etat.courante = etat.courante || [];
    etat.courante.push({
      id: uid(), type: 'Organisation', date: aujourdhui(), heure: maintenant(), source: '', qui: moi,
      evenement: (change
        ? "Lien permanent de la visio de crise de l'ARS déposé dans le cockpit"
        : "Rendez-vous de la visio de crise de l'ARS mis à jour")
        + " — séance " + recurrenceLisible() + " à " + heureLisible(s.horaire)
        + (s.precision ? ' (' + s.precision + ')' : '') + ".",
      suite: "Accessible à tout le copil en tête de « Situation régionale ». Chacun s'y positionne sur le créneau de la prochaine séance avant l'heure.",
      auteur: moi, quand: new Date().toISOString()
    });
  }
  await sauver(); fermer(); rendre();
  toast(change ? "Lien de la visio déposé" : "Rendez-vous mis à jour — séance " + recurrenceLisible() + " à " + heureLisible(s.horaire));
}

async function retirerLienVisio(){
  const s = salleVisio();
  if(!s || !confirm("Retirer le lien du salon ?\n\nPlus personne ne pourra entrer dans la visio depuis le cockpit.")) return;
  s.url = '';
  s.maj = horodate();
  s.par = moi;
  await sauver(); fermer(); rendre();
  toast("Lien retiré");
}

async function copierLienVisio(){
  const url = lienVisioPropre((salleVisio() || {}).url);
  if(!url) return;
  try{
    await navigator.clipboard.writeText(url);
    toast("Lien copié — à coller dans le message");
  }catch(e){
    prompt("Copiez le lien de la visio :", url);
  }
}

async function sePositionnerVisio(){
  const c = document.getElementById('pv-nom');
  const n = c ? c.value.trim() : '';
  if(!n){ toast("Indiquez votre prénom"); return; }
  const jour = creneauVu();
  if(presencesDuJour(jour).some(p => cleP(p.prenom) === cleP(n))){
    toast(n + " est déjà positionné·e sur la séance du " + frdate(jour)); return;
  }
  const id = uid();
  etat.presencesVisio = presencesVisio();
  etat.presencesVisio.push({
    id, date: jour, heure: heureVisio(), prenom: n,
    par: moi === 'Anonyme' ? n : moi, quand: new Date().toISOString()
  });
  consignerPresenceEnCourante(id, n, jour);
  saisiePresence = '';
  await sauver(); rendre();
  toast(n + " est attendu·e à la visio du " + frdate(jour) + " à " + heureLisible(heureVisio()));
}

/* Qui représente la CPTS à une visio de crise est un fait de la
   journée, au même titre qu'un appel reçu : il se consigne en main
   courante comme le reste. L'entrée porte un identifiant dérivé de
   celui de la présence — c'est par là qu'un désistement retrouve la
   ligne qu'il vient contredire, au lieu d'en écrire une seconde. */
function consignerPresenceEnCourante(id, prenom, jour){
  const autres = presencesDuJour(jour).map(p => p.prenom).filter(x => cleP(x) !== cleP(prenom));
  etat.courante = etat.courante || [];
  etat.courante.push({
    id: 'mcv-' + id, type: 'Visio ARS', date: aujourdhui(), heure: maintenant(), source: '',
    qui: moi === 'Anonyme' ? prenom : moi,
    evenement: prenom + " se positionne sur la visio de crise de l'ARS du " + frdateL(jour)
      + " à " + heureLisible(heureVisio()) + "."
      + (autres.length ? " Y sont également attendu·es : " + autres.join(', ') + "." : ''),
    suite: "La CPTS Pau Béarn y sera représentée. Le compte rendu de la séance se consigne dans « Situation régionale » le jour même.",
    auteur: moi, quand: new Date().toISOString()
  });
}

async function retirerPresenceVisio(id){
  const p = presencesVisio().find(x => x.id === id);
  if(!p) return;
  if(!confirm("Retirer " + p.prenom + " de la séance du " + frdate(p.date) + " ?")) return;
  etat.presencesVisio = presencesVisio().filter(x => x.id !== id);

  /* Le désistement s'écrit à la suite de l'engagement, sur la même
     ligne : deux entrées pour un aller-retour feraient deux fois le
     bruit d'un fait qui n'a pas eu lieu. Une présence posée avant
     que la main courante s'en mêle n'a pas de ligne à compléter :
     celle-là s'écrit pour elle-même. */
  const mc = (etat.courante || []).find(x => x.id === 'mcv-' + id);
  const reste = presencesDuJour(p.date).map(x => x.prenom);
  const dit = p.prenom + " ne représentera pas la CPTS à la visio du " + frdateL(p.date) + "."
    + (reste.length ? " Reste attendu·e sur cette séance : " + reste.join(', ') + "."
                    : " Plus personne n'est positionné sur cette séance.");
  if(mc){
    mc.suite = (mc.suite ? mc.suite + '\n' : '')
      + "Désistement le " + frdateL(aujourdhui()) + " à " + maintenant()
      + (moi === 'Anonyme' ? '' : ', par ' + moi) + " : " + dit;
    mc.modifiePar = moi;
  }else{
    etat.courante = etat.courante || [];
    etat.courante.push({
      id: uid(), type: 'Visio ARS', date: aujourdhui(), heure: maintenant(), source: '',
      qui: moi === 'Anonyme' ? p.prenom : moi, evenement: dit,
      suite: "Retiré du créneau dans « Situation régionale ».",
      auteur: moi, quand: new Date().toISOString()
    });
  }

  await sauver(); rendre();
  toast(p.prenom + " retiré·e du créneau — désistement consigné en main courante");
}

function vueVisios(){
  const l = visiosTriees();
  const derniere = l[0];
  const avant = l.slice(1);
  const aConsigner = l.filter(visioVide).length;

  let h = `<div class="visios">
    <div class="tete-v">
      <div>
        <h2 style="margin:0 0 3px">Ce que l'ARS a dit à sa dernière visio</h2>
        <p class="sous-v">Les points de situation régionaux de l'ARS Nouvelle-Aquitaine, dans l'ordre où ils ont été abordés. C'est la source la plus complète dont dispose la CPTS : elle passe avant tout le reste.</p>
      </div>
      <button class="btn" onclick="ouvrirSaisieVisio()">Consigner une visio</button>
    </div>`;

  if(!l.length){
    return h + `<div class="carte" style="margin:0"><p class="vide">Aucune visio consignée. Dès la prochaine séance, notez-en les points ici : c'est ce que le reste de l'équipe lira en premier.</p></div></div>`;
  }

  if(aConsigner) h += `<div class="alerte-v">${aConsigner === 1
    ? "Une séance a eu lieu sans que son compte rendu soit consigné."
    : aConsigner + " séances ont eu lieu sans que leur compte rendu soit consigné."} Ce qui s'y est dit n'existe nulle part ailleurs dans le cockpit : à reprendre auprès de la personne qui y assistait, tant que c'est frais.</div>`;

  h += carteVisio(derniere, true);

  if(avant.length){
    h += `<div class="avant-v"><span class="k">Séances précédentes</span>`;
    avant.forEach(v => { h += carteVisio(v, visioOuverte === v.id); });
    h += `</div>`;
  }

  return h + `</div>`;
}

function carteVisio(v, deplie){
  const pts = v.points || [];
  const vide = visioVide(v);
  const quand = `${frdate(v.date)}${v.heure ? ' à ' + esc(v.heure) : ''}`;

  let h = `<div class="visio ${deplie ? 'ouverte' : ''} ${vide ? 'creuse' : ''}">
    <button class="tete" onclick="ouvrirVisio('${v.id}')" aria-expanded="${!!deplie}">
      <span class="q">${quand}</span>
      <span class="i">
        <span class="n">${esc(v.instance || "Visio de crise de l'ARS")}</span>
        <span class="s">${[v.represente ? 'CPTS représentée par ' + v.represente : '',
          vide ? 'compte rendu à consigner' : pts.length + ' point' + (pts.length > 1 ? 's' : '') + ' abordé' + (pts.length > 1 ? 's' : '')]
          .filter(Boolean).map(esc).join(' · ')}</span>
      </span>
      <span class="chev">${deplie ? '▲' : '▼'}</span>
    </button>`;

  if(deplie){
    h += `<div class="dedans">`;

    if(vide){
      h += `<div class="manque-v">${esc(v.manquant ||
        "Rien n'a été rapporté de cette séance. Ce qui s'y est dit n'existe nulle part ailleurs dans le cockpit.")}</div>`;
    }

    if(pts.length) h += `<ol class="pts-v">${pts.map(p => `<li>
      <div class="t">${esc(p.titre)}</div>
      <div class="d">${esc(p.texte).replace(/\n/g,'<br>')}</div>
    </li>`).join('')}</ol>`;

    if(v.consignes) h += `<div class="bloc-v consignes">
      <span class="k">Ce que l'ARS demande</span><div class="d">${esc(v.consignes).replace(/\n/g,'<br>')}</div></div>`;

    if(v.pourNous) h += `<div class="bloc-v pour-nous">
      <span class="k">Ce que ça change pour la CPTS Pau Béarn</span><div class="d">${esc(v.pourNous).replace(/\n/g,'<br>')}</div></div>`;

    if(v.prochaine) h += `<div class="bloc-v"><span class="k">Prochaine séance</span><div class="d">${esc(v.prochaine)}</div></div>`;

    h += marqueRetenue(v);

    h += `<div class="bas-v">
      <button class="btn${vide ? '' : ' sec'}" onclick="ouvrirSaisieVisio('${v.id}')">${vide ? 'Consigner le compte rendu' : 'Modifier'}</button>
      ${enChantier('rapports') ? '' : `<button class="btn sec" onclick="ouvrirRetenu('visios','${v.id}')">${v.retenu && v.retenu.genre ? 'Modifier ce qu\'on en retient' : 'Retenir pour les rapports'}</button>`}
      <button class="retirer sup" onclick="supprimerVisio('${v.id}')">Retirer</button>
    </div></div>`;
  }

  return h + `</div>`;
}

/* --- Saisie d'une séance -------------------------------
   Les points s'ajoutent un par un, dans l'ordre où ils ont été
   abordés : c'est la forme sous laquelle l'ARS les déroule, et
   celle sous laquelle on les relit. */
function ouvrirSaisieVisio(id){
  const v = id ? visios().find(x => x.id === id) : null;
  pointsSaisie = v ? JSON.parse(JSON.stringify(v.points || [])) : [];
  if(!pointsSaisie.length) pointsSaisie.push({titre:'', texte:''});
  const g = (c, d) => esc(v ? (v[c] ?? '') : (d ?? ''));
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<h3>${v ? 'Compte rendu de la visio' : 'Consigner une visio de crise'}</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Un point par sujet abordé, dans l'ordre de la séance. Le titre se lit seul dans la liste ; le texte porte ce qui a été dit. Rien ne remplace une phrase écrite le soir même.</p>
  <div class="form">
    <label><span class="k">Date *</span><input id="vs-date" type="date" value="${g('date', aujourdhui())}"></label>
    <label><span class="k">Heure</span><input id="vs-heure" type="time" value="${g('heure', heureVisio())}"></label>
    <label class="large"><span class="k">Instance</span>
      <input id="vs-instance" value="${g('instance', "Visio de crise de l'ARS Nouvelle-Aquitaine")}"></label>
    <label class="large"><span class="k">CPTS représentée par</span>
      <input id="vs-represente" value="${g('represente', moi === 'Anonyme' ? '' : moi)}" placeholder="Qui y assistait pour la CPTS Pau Béarn"></label>
  </div>

  <div style="margin-top:18px">
    <div class="barre-h" style="margin-bottom:8px">
      <span class="cpt-h">Points abordés</span>
      <button class="btn sec" onclick="ajouterPointVisio()">Ajouter un point</button>
    </div>
    <div id="pts-saisie">${pointsSaisie.map(pointVisioHTML).join('')}</div>
  </div>

  <div class="form" style="margin-top:16px">
    <label class="large"><span class="k">Ce que l'ARS demande</span>
      <textarea id="vs-consignes" placeholder="Les consignes explicites sorties de la séance, celles qu'on peut citer.">${g('consignes')}</textarea></label>
    <label class="large"><span class="k">Ce que ça change pour la CPTS Pau Béarn</span>
      <textarea id="vs-pourNous" placeholder="Ce qu'il faut décider, lancer ou arrêter de notre côté à la suite de cette séance.">${g('pourNous')}</textarea>
      <span class="aide">C'est ce champ-là qui fait la différence entre un compte rendu et une décision : sans lui, la séance reste une information que personne ne reprend. Une amorce ci-dessous pose le début de la phrase, à finir en quelques mots. Ce que vous écrivez ici se retrouve dans « Échanges avec l'ARS », colonne <em>Ce que ça implique pour la CPTS</em>.</span>
      ${amorces('vs-pourNous', IMPLIQUE_CPTS)}</label>
    <label class="large"><span class="k">Prochaine séance</span>
      <input id="vs-prochaine" value="${g('prochaine')}" placeholder="Ex. demain 15h, même lien"></label>
  </div>

  <div style="margin-top:14px"><label class="coche">
    <input type="checkbox" id="vs-mc" ${v && !visioVide(v) ? '' : 'checked'}>
    <span>Consigner en main courante
      <span class="d">Coché par défaut : toute information recueillie se retrouve dans la main courante, en plus de sa rubrique.</span></span>
  </label></div>

  <div class="actions">
    <button class="btn" onclick="validerVisio(${v ? `'${v.id}'` : ''})">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
  </div>`;
  ouvrirRideau();
}

function pointVisioHTML(p, i){
  return `<div class="pt-saisie" data-i="${i}">
    <div class="num">Point ${i+1}
      <button type="button" onclick="retirerPointVisio(${i})" title="Retirer ce point">Retirer ×</button></div>
    <input id="ps-titre-${i}" value="${esc(p.titre||'')}" placeholder="Ex. Évolution des fronts, situation hospitalière, transports sanitaires…"
      onchange="majPointVisio(${i},'titre',this.value)">
    <textarea id="ps-texte-${i}" placeholder="Ce qui a été dit sur ce point."
      onchange="majPointVisio(${i},'texte',this.value)">${esc(p.texte||'')}</textarea>
  </div>`;
}

function majPointVisio(i, c, v){ if(pointsSaisie[i]) pointsSaisie[i][c] = v; }

/* Les champs ne se déclarent qu'au « change » : avant de
   redessiner la liste, on relit ce qui est à l'écran pour ne pas
   perdre une saisie en cours. */
function relirePointsVisio(){
  pointsSaisie.forEach((p, i) => {
    ['titre','texte'].forEach(c => {
      const e = document.getElementById(`ps-${c}-${i}`);
      if(e) p[c] = e.value;
    });
  });
}
function redessinerPointsVisio(){
  const z = document.getElementById('pts-saisie');
  if(z) z.innerHTML = pointsSaisie.map(pointVisioHTML).join('');
}
function ajouterPointVisio(){
  relirePointsVisio();
  pointsSaisie.push({titre:'', texte:''});
  redessinerPointsVisio();
  const e = document.getElementById(`ps-titre-${pointsSaisie.length - 1}`);
  if(e){ e.scrollIntoView({block:'center'}); e.focus(); }
}
function retirerPointVisio(i){
  relirePointsVisio();
  pointsSaisie.splice(i, 1);
  if(!pointsSaisie.length) pointsSaisie.push({titre:'', texte:''});
  redessinerPointsVisio();
}

async function validerVisio(id){
  relirePointsVisio();
  const g = c => (document.getElementById('vs-' + c) || {}).value || '';
  const date = g('date');
  if(!date){ toast("La date de la séance est obligatoire"); return; }

  /* Un point sans titre ni texte n'est qu'une ligne restée vide :
     on ne la garde pas. Un point titré sans texte se garde — c'est
     un sujet abordé dont on n'a pas retenu le détail. */
  const points = pointsSaisie
    .map(p => ({titre:(p.titre||'').trim(), texte:(p.texte||'').trim()}))
    .filter(p => p.titre || p.texte)
    .map(p => ({titre: p.titre || 'Point sans intitulé', texte: p.texte}));

  const champs = {
    date, heure:g('heure').trim(), instance:g('instance').trim(),
    represente:g('represente').trim(), points,
    consignes:g('consignes').trim(), pourNous:g('pourNous').trim(),
    prochaine:g('prochaine').trim()
  };

  etat.visios = etat.visios || [];
  const v = id ? etat.visios.find(x => x.id === id) : null;
  let cible = v;
  if(v){
    Object.assign(v, champs, {modifiePar: moi});
    /* Le rappel « compte rendu manquant » n'a plus lieu d'être une
       fois la séance renseignée. */
    if(points.length || champs.consignes || champs.pourNous) delete v.manquant;
  }else{
    cible = Object.assign({id:uid(), auteur:moi, quand:new Date().toISOString()}, champs);
    etat.visios.push(cible);
  }

  const mc = (document.getElementById('vs-mc') || {}).checked;
  if(mc) consignerVisioEnCourante(champs);

  /* Une séance de crise est un échange avec l'ARS au même titre
     qu'un mail ou un appel : elle laisse sa ligne dans « Échanges
     avec l'ARS ». C'était la seule voie de contact à n'en laisser
     aucune — le compte rendu partait dans la situation régionale et
     le suivi ARS n'en savait rien. */
  tracerVisioDansARS(champs, cible.id);

  visioOuverte = cible.id;
  await sauver(); fermer(); rendre();
  toast(mc ? "Visio consignée, reportée en main courante et tracée avec l'ARS"
           : "Visio consignée, et tracée dans les échanges avec l'ARS");
}

/* L'entrée se réécrit à chaque enregistrement du compte rendu au
   lieu de s'ajouter : une séance, une ligne. C'est le champ `visio`
   qui les apparie — la séance du 27/07, consignée à la main dans
   l'amorçage, porte déjà le sien et se mettra donc à jour le jour
   où son compte rendu sera écrit, sans faire doublon. */
function tracerVisioDansARS(v, idVisio){
  etat.ars = etat.ars || [];
  const pts = (v.points||[]).map(p => '· ' + p.titre + (p.texte ? ' : ' + p.texte : '')).join('\n');
  const dit = [pts, v.consignes ? "Ce que l'ARS demande : " + v.consignes : ''].filter(Boolean).join('\n');
  const champs = {
    date: v.date, heure: v.heure || '',
    sens: "Reçu de l'ARS", canal: 'Visio',
    interlocuteur: "ARS Nouvelle-Aquitaine",
    objet: (v.instance || "Visio de crise de l'ARS")
      + ' du ' + frdateL(v.date) + (v.heure ? ' à ' + v.heure : ''),
    demande: dit || "Séance tenue. Le compte rendu reste à consigner : ce qui s'y est dit n'existe nulle part ailleurs.",
    reponse: [v.represente ? 'CPTS Pau Béarn représentée par ' + v.represente + '.' : '',
              "Compte rendu tenu dans « Situation régionale ».",
              v.prochaine ? 'Prochaine séance : ' + v.prochaine : ''].filter(Boolean).join(' '),
    attendu: v.pourNous || '',
    statut: v.pourNous ? 'En cours' : (dit ? 'Clos' : 'En attente'),
    visio: idVisio
  };
  const e = etat.ars.find(x => x.visio === idVisio);
  if(e) Object.assign(e, champs, {modifiePar: moi});
  else etat.ars.unshift(Object.assign({id:uid(), auteur:moi, quand:new Date().toISOString()}, champs));
}

/* Les séances tracées à la main avant que le cockpit ne le fasse
   seul n'ont pas le lien vers leur compte rendu : sans ce lien, le
   premier compte rendu consigné ouvrirait une seconde ligne à côté
   de la première. On le repose une fois au démarrage — d'abord sur
   les entrées de l'amorçage qui le portent, puis plus largement sur
   toute entrée « Visio » de mêmes date et heure qu'une séance : ce
   n'en est jamais une seconde, c'est la même. */
function apparierVisioARS(){
  (etatInitial.ars||[]).filter(o => o.visio).forEach(ref => {
    const e = (etat.ars||[]).find(x => x.id === ref.id);
    if(e && !e.visio) e.visio = ref.visio;
  });
  (etat.visios||[]).forEach(v => {
    if((etat.ars||[]).some(x => x.visio === v.id)) return;
    const e = (etat.ars||[]).find(x => !x.visio && x.canal === 'Visio'
      && x.date === v.date && (x.heure||'') === (v.heure||''));
    if(e) e.visio = v.id;
  });
}

function consignerVisioEnCourante(v){
  etat.courante = etat.courante || [];
  const corps = (v.points||[]).map(p => '· ' + p.titre + (p.texte ? ' : ' + p.texte : '')).join('\n');
  etat.courante.unshift({
    id: uid(), type: 'Visio ARS', date: v.date, heure: v.heure || '', source: 'ARS Nouvelle-Aquitaine',
    evenement: (v.instance || "Visio de crise de l'ARS")
      + (v.represente ? ` — la CPTS Pau Béarn y était représentée par ${v.represente}` : '')
      + (corps ? '.\n' + corps : '.')
      + (v.consignes ? "\nCe que l'ARS demande : " + v.consignes : ''),
    suite: v.pourNous || "Compte rendu consigné dans « Situation régionale ». Reste à en tirer ce qui appelle une décision du copil.",
    qui: v.represente || moi,
    auteur: moi, quand: ''
  });
}

async function supprimerVisio(id){
  const v = visios().find(x => x.id === id);
  if(!v) return;
  if(!confirm(`Retirer le compte rendu de la séance du ${frdateL(v.date)} ?\n\nCe qui s'y est dit n'existe nulle part ailleurs dans le cockpit.`)) return;
  noterRetrait(id);
  etat.visios = visios().filter(x => x.id !== id);
  await sauver(); rendre(); toast("Séance retirée");
}

function vueVeille(){
  const m = missionVeille();
  const pilote = m && m.pilote ? m.pilote : '';
  const maj = derniereActualisation();

  let h = `<h1>Situation régionale</h1>
  <p class="chapo">Ce que la CPTS Pau Béarn sait de la région, et d'où elle le tient. La page se lit dans l'ordre : qui la tient et quand elle a bougé pour la dernière fois, le rendez-vous de l'ARS — son lien, son rythme, qui se positionne sur la prochaine séance, et le compte rendu de chacune — puis, dessous, les informations que l'ARS nous a fait parvenir, collées telles quelles.</p>`;

  /* --- qui tient la page, et depuis quand elle n'a pas bougé --- */
  h += `<div class="poste ${pilote ? '' : 'vacant'}">
    <div class="qui">
      <span class="k">Veille tenue par</span>
      <div class="nom">${pilote ? esc(pilote) : 'Personne'}</div>
      <div class="depuis">${pilote
        ? `Mission « ${esc(m.titre)} »${m.suppleant ? ' · suppléance : ' + esc(m.suppleant) : ''}`
        : `Aucun pilote nommé sur la mission de veille — la page ne se tiendra pas toute seule. Cela se nomme dans <a href="#" onclick="aller('missions');return false;">Missions &amp; organigramme</a>.`}</div>
    </div>
    <div class="tours">
      <div class="tour-t ${!maj ? 'du' : (heuresDepuis(maj.quand) < SEUIL_POINT_H ? 'fait' : 'du')}">
        <div class="q">Dernière actualisation</div>
        <div class="v">${maj
          ? `<b>${frdate(maj.quand.slice(0,10))} à ${esc(maj.quand.slice(11,16))}</b><br>${esc(maj.quoi)}${maj.par ? ' · ' + esc(maj.par) : ''}`
          : `<b>Jamais</b><br>Rien n'a encore été écrit sur cette page`}</div>
      </div>
    </div>
  </div>`;

  /* --- le rendez-vous de l'ARS : le lien du salon, et qui y sera --- */
  h += vueSalleVisio();

  /* --- ce que l'ARS a dit à sa dernière visio --- */
  h += vueVisios();

  /* --- ce que l'ARS nous a fait parvenir, hors visio --- */
  h += vueInfosARS();

  return h;
}

/* =========================================================
   LES INFORMATIONS DONNÉES PAR L'ARS

   Un mail, un communiqué, un message : on colle la date, l'heure,
   l'objet et le texte, tel quel. Rien à résumer — un communiqué
   reformulé de mémoire ne vaut rien, et personne n'a le temps de
   le reformuler.

   Ces informations ne vivent pas à part : ce sont les entrées
   d'« Échanges avec l'ARS », moins celles qui sortent d'une visio
   de crise — leur compte rendu se lit juste au-dessus, et le
   répéter ici ferait deux fois le même texte sur le même écran.
   Saisir ici, c'est donc écrire là-bas, et laisser sa ligne en
   main courante, comme toute information recueillie.
   ========================================================= */
const infosARS = () => antechrono((etat.ars || []).filter(a => !a.visio && a.canal !== 'Visio'));
let infoARSOuverte = null;
function ouvrirInfoARS(id){ infoARSOuverte = (infoARSOuverte === id) ? null : id; rendre(); }

/* --- Les documents joints à une information ---------------
   Le PDF d'un communiqué, la capture d'un tableau : le fichier
   part sur l'hébergement par une porte à part et y reste. L'état
   partagé — relu en entier toutes les quinze secondes par chaque
   poste — n'en garde que le nom, le poids et l'identifiant ; le
   contenu ne transite jamais par lui.

   L'adresse rendue est stable et le serveur sert le document en
   « inline » : le PDF s'ouvre dans l'onglet, l'image s'affiche,
   sans rien télécharger. Le second lien, lui, l'emporte sur le
   poste sous son nom d'origine. Les deux valent pour tout le
   copil, du moment que la session est ouverte : le code d'accès
   voyage dans l'adresse, faute de quoi un onglet neuf n'aurait
   aucun moyen de se présenter. */
const PIECE_MAX_MO = 4;
const PIECE_FORMATS = '.pdf,.jpg,.jpeg,.png,.webp,.heic,.csv,.xlsx,.docx';

/* Le cockpit de la canicule porte déjà « ?crise= » dans l'adresse
   de son API : la porte des pièces s'y ajoute, elle ne la remplace
   pas — sinon les deux crises se serviraient dans le même tas. */
const portePiece = id => API + (API.indexOf('?') >= 0 ? '&' : '?')
  + 'piece' + (id ? '=' + encodeURIComponent(id) : '');
function lienPiece(idp){ return portePiece(idp) + '&code=' + encodeURIComponent(codeAcces); }
const poids = o => !o ? '' : o < 1024 ? o + ' o'
  : o < 1048576 ? Math.round(o / 1024) + ' Ko'
  : (o / 1048576).toFixed(1).replace('.', ',') + ' Mo';

/* Envoi d'un fichier. Rend sa fiche — identifiant, nom, poids —
   ou rien du tout, en ayant dit pourquoi. */
async function envoyerPiece(f){
  if(!modeServeur){ toast("Le serveur ne répond pas : un document ne peut être joint que depuis le cockpit partagé"); return null; }
  if(f.size > PIECE_MAX_MO * 1000000){ toast("« " + f.name + " » est trop lourd — " + PIECE_MAX_MO + " Mo au maximum"); return null; }
  const lu = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => res('');
    r.readAsDataURL(f);
  });
  if(!lu){ toast("« " + f.name + " » est illisible"); return null; }
  let r;
  try{
    r = await fetch(portePiece(), {
      method: 'POST',
      headers: {'X-Code-Acces': codeAcces, 'Content-Type': 'application/json'},
      body: JSON.stringify({nom: f.name, donnees: lu, par: moi})
    });
  }catch(e){ toast("Serveur injoignable — « " + f.name + " » n'a pas été envoyé"); return null; }
  let d = null;
  try{ d = await r.json(); }catch(e){}
  if(!r.ok || !d || !d.id){ toast((d && d.erreur) || "Envoi de « " + f.name + " » impossible"); return null; }
  return {id: d.id, nom: d.nom, taille: d.taille, le: d.le, par: moi};
}

/* Le fichier lui-même, effacé de l'hébergement. Sans bruit : on
   l'appelle quand la ligne qui le portait s'en va. */
async function effacerPiece(idp){
  try{
    await fetch(portePiece(idp), {
      method: 'POST',
      headers: {'X-Code-Acces': codeAcces, 'Content-Type': 'application/json'},
      body: JSON.stringify({supprimer: true})
    });
  }catch(e){}
}

/* La liste telle qu'elle se lit sous une information. Le retrait
   n'apparaît que si on dit à quelle fiche ces pièces appartiennent. */
function vuePieces(pieces, idInfo){
  const l = (pieces || []).filter(p => p && p.id);
  if(!l.length) return '';
  return `<div class="pj">` + l.map(p => `<div class="p">
    <span class="n">${esc(p.nom || 'Document')}</span>
    <span class="q">${[poids(p.taille), p.par].filter(Boolean).map(esc).join(' · ')}</span>
    <a href="${esc(lienPiece(p.id))}" target="_blank" rel="noopener noreferrer">Ouvrir ↗</a>
    <a href="${esc(lienPiece(p.id))}" download="${esc(p.nom || 'document')}">Télécharger</a>
    ${idInfo ? `<button class="ret" title="Retirer ce document"
      onclick="retirerPieceInfoARS('${idInfo}','${p.id}')">✕</button>` : ''}
  </div>`).join('') + `</div>`;
}

/* Joindre un document à une information déjà consignée : le
   communiqué arrive parfois après le mail qui l'annonçait. */
function choisirPieceInfoARS(id){
  if(!modeServeur){ toast("Le serveur ne répond pas : un document ne peut être joint que depuis le cockpit partagé"); return; }
  const i = document.getElementById('pj-ars-' + id);
  if(i) i.click();
}
async function joindrePieceInfoARS(id, input){
  const fs = [...(input.files || [])];
  input.value = '';
  const a = (etat.ars || []).find(x => x.id === id);
  if(!a || !fs.length) return;
  toast(fs.length > 1 ? "Envoi de " + fs.length + " documents…" : "Envoi de « " + fs[0].name + " »…");
  const mises = [];
  for(const f of fs){ const m = await envoyerPiece(f); if(m) mises.push(m); }
  if(!mises.length) return;
  a.pieces = Array.isArray(a.pieces) ? a.pieces : [];
  a.pieces.push(...mises);
  a.modifiePar = moi;
  /* La ligne de main courante nomme les documents : elle se
     réécrit, sinon celui joint après coup n'y figurerait pas. */
  consignerRegistreEnCourante('ars', a);
  infoARSOuverte = a.id;
  await sauver(); rendre();
  toast(mises.length > 1 ? mises.length + " documents joints à l'information"
                         : "« " + mises[0].nom + " » joint à l'information");
}
async function retirerPieceInfoARS(id, idp){
  const a = (etat.ars || []).find(x => x.id === id); if(!a) return;
  const p = (a.pieces || []).find(x => x.id === idp);
  if(!confirm("Retirer « " + ((p && p.nom) || 'ce document') + " » ?\n\nLe fichier est supprimé de l'hébergement, et son lien ne s'ouvrira plus.")) return;
  await effacerPiece(idp);
  a.pieces = (a.pieces || []).filter(x => x.id !== idp);
  a.modifiePar = moi;
  consignerRegistreEnCourante('ars', a);
  await sauver(); rendre(); toast("Document retiré");
}

function vueInfosARS(){
  const l = infosARS();

  let h = `<div class="infos-a">
    <div class="tete-i">
      <div>
        <h2 style="margin:0">Informations données par l'ARS
          <span class="cpt-h">${l.length} information${l.length > 1 ? 's' : ''}</span></h2>
        <p class="sous-i">Les mails, communiqués et messages reçus de l'ARS, collés tels quels : date, heure, objet, contenu. Cliquer sur une ligne pour la lire en entier. Les comptes rendus des visios de crise ne sont pas repris ici — ils se lisent au-dessus.</p>
      </div>
      <button class="btn" onclick="ouvrirSaisieInfoARS()">Consigner une information</button>
    </div>`;

  if(!l.length){
    return h + `<div class="carte" style="margin:0"><p class="vide">Rien de consigné pour l'instant. Le prochain mail de l'ARS se colle ici en trois champs : ce qu'on reçoit sur une boîte personnelle n'existe pour l'équipe que le jour où quelqu'un l'y dépose.</p></div></div>`;
  }

  h += l.map(a => {
    const ouvert = infoARSOuverte === a.id;
    const quand = frdate(a.date) + (a.heure ? ' à ' + esc(a.heure) : '');
    const sous = [a.sens, a.canal, a.interlocuteur,
                  a.auteur ? 'saisi par ' + a.auteur : ''].filter(Boolean).map(esc).join(' · ');

    const npj = (a.pieces || []).filter(p => p && p.id).length;

    let c = `<div class="info-a ${ouvert ? 'ouverte' : ''}">
      <button class="tete" onclick="ouvrirInfoARS('${a.id}')" aria-expanded="${ouvert}">
        <span class="q">${quand}</span>
        <span class="i">
          <span class="n">${esc(a.objet || 'Sans objet')}</span>
          <span class="s">${[sous, npj ? '📎 ' + npj + ' document' + (npj > 1 ? 's' : '') : ''].filter(Boolean).join(' · ')}</span>
        </span>
        <span class="chev">${ouvert ? '▲' : '▼'}</span>
      </button>`;

    if(ouvert){
      c += `<div class="dedans">`;
      c += a.demande
        ? `<div class="bloc"><span class="k">Contenu du message</span><div class="d">${esc(a.demande)}</div></div>`
        : `<div class="bloc"><div class="d" style="color:var(--texte-2);font-style:italic">Le contenu n'a pas été collé — seul l'objet a été noté.</div></div>`;
      if(a.reponse) c += `<div class="bloc reponse"><span class="k">Notre réponse ou action</span><div class="d">${esc(a.reponse)}</div></div>`;
      if(a.attendu) c += `<div class="bloc implique"><span class="k">Ce que ça implique pour la CPTS</span><div class="d">${esc(a.attendu)}</div></div>`;
      /* Les documents déposés sur le cockpit : ils s'ouvrent dans
         l'onglet et s'emportent, sans repasser par la boîte mail
         de qui les a reçus. */
      c += vuePieces(a.pieces, a.id);
      const lien = lienVisioPropre(a.lien);
      if(lien) c += `<a class="doc" href="${esc(lien)}" target="_blank" rel="noopener noreferrer">Ouvrir le document ↗</a>`;
      c += `<div class="meta">${[a.statut ? 'Statut : ' + a.statut : '',
        a.auteur ? 'Saisi par ' + a.auteur : 'Saisi sans nom'].filter(Boolean).map(esc).join(' · ')}</div>`;
      c += `<div class="bas">
        <input type="file" id="pj-ars-${a.id}" multiple accept="${PIECE_FORMATS}"
          style="display:none" onchange="joindrePieceInfoARS('${a.id}', this)">
        <button class="btn sec" onclick="ouvrirEdition('ars','${a.id}')">Modifier</button>
        <button class="btn sec" onclick="choisirPieceInfoARS('${a.id}')">Joindre un document</button>
        <button class="btn sec" onclick="aller('ars')">Voir dans les échanges avec l'ARS</button>
        <button class="btn sec sup" onclick="retirerInfoARS('${a.id}')">Retirer</button>
      </div></div>`;
    }

    return c + `</div>`;
  }).join('');

  return h + `</div>`;
}

/* Quatre champs, et rien de plus : la date, l'heure, l'objet et le
   texte du message. Le nom de qui saisit se pose tout seul — c'est
   la session ouverte, et le demander une fois de plus n'apprendrait
   rien à personne. À quoi s'ajoute, quand il y en a un, le document
   reçu : un communiqué en PDF ne se recopie pas, et le copil doit
   pouvoir le lire à la source.

   Les fichiers choisis attendent ici sans partir : ils ne montent
   sur l'hébergement qu'à l'enregistrement, pour qu'une fenêtre
   refermée en chemin ne laisse pas de pièces orphelines. */
let pjEnAttente = [];

function ouvrirSaisieInfoARS(){
  pjEnAttente = [];
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<h3>Information donnée par l'ARS</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Un mail, un communiqué, un message reçu de l'ARS. Le copier-coller suffit et vaut mieux qu'un résumé : c'est le texte de la source qui fera foi au copil.</p>
  <div class="form">
    <label><span class="k">Date *</span><input id="ia-date" type="date" value="${esc(aujourdhui())}"></label>
    <label><span class="k">Heure</span><input id="ia-heure" type="time" value="${esc(maintenant())}"></label>
    <label class="large"><span class="k">Objet *</span>
      <input id="ia-objet" placeholder="L'objet du mail, le titre du communiqué"></label>
    <label class="large"><span class="k">Contenu du message</span>
      <textarea id="ia-contenu" rows="12" placeholder="Collez ici le message entier, tel qu'il a été reçu."></textarea>
      <span class="aide">Rien à raccourcir : à l'écran, la ligne ne montrera que l'objet, et le texte ne s'ouvrira que si on clique dessus.</span></label>
    <div class="large pj-champ">
      <span class="k">Document reçu</span>
      <div id="ia-pj"></div>
      <input type="file" id="ia-fichier" multiple accept="${PIECE_FORMATS}"
        style="display:none" onchange="ajouterPJEnAttente(this)">
      <button class="btn sec" type="button" style="margin-top:6px"
        onclick="document.getElementById('ia-fichier').click()">Choisir un document…</button>
      <span class="aide">PDF, image, tableau ou document Word — ${PIECE_MAX_MO} Mo par fichier. Le document reste sur le cockpit : tout le copil pourra l'ouvrir dans son onglet ou l'enregistrer, sans repasser par la boîte mail de qui l'a reçu.</span>
    </div>
  </div>
  <div class="rappel" style="margin:14px 0 0">Cette information rejoint « Échanges avec l'ARS » et laisse sa ligne en <a href="#" onclick="fermer();aller('courante');return false;">Main courante</a>, au nom de ${esc(moi === 'Anonyme' ? 'la session en cours' : moi)}.</div>
  <div class="actions">
    <button class="btn" id="ia-valider" onclick="validerInfoARS()">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
  </div>`;
  ouvrirRideau();
  rendrePJEnAttente();
  setTimeout(()=>{ const i = document.getElementById('ia-objet'); if(i) i.focus({preventScroll:true}); }, 60);
}

/* La liste des fichiers en attente, dans la fenêtre. Elle se
   redessine seule : rendre() reconstruirait la page derrière la
   fenêtre ouverte et effacerait la saisie en cours. */
function rendrePJEnAttente(){
  const d = document.getElementById('ia-pj');
  if(!d) return;
  d.innerHTML = pjEnAttente.length
    ? `<div class="pj">` + pjEnAttente.map((f, i) => `<div class="p attente">
        <span class="n">${esc(f.name)}</span>
        <span class="q">${esc(poids(f.size))} · à envoyer</span>
        <button class="ret" title="Retirer de la liste" onclick="oterPJEnAttente(${i})">✕</button>
      </div>`).join('') + `</div>`
    : '';
}
function ajouterPJEnAttente(input){
  [...(input.files || [])].forEach(f => {
    if(f.size > PIECE_MAX_MO * 1000000){ toast("« " + f.name + " » est trop lourd — " + PIECE_MAX_MO + " Mo au maximum"); return; }
    pjEnAttente.push(f);
  });
  input.value = '';
  rendrePJEnAttente();
}
function oterPJEnAttente(i){ pjEnAttente.splice(i, 1); rendrePJEnAttente(); }

async function validerInfoARS(){
  const g = c => ((document.getElementById('ia-' + c) || {}).value || '').trim();
  const objet = g('objet');
  if(!objet){ toast("L'objet est obligatoire"); document.getElementById('ia-objet')?.focus(); return; }

  /* Les documents montent d'abord : si l'hébergement refuse, on le
     dit avant d'avoir écrit quoi que ce soit, et rien n'est perdu —
     la fenêtre est encore là, avec son texte et ses fichiers. */
  const pieces = [];
  if(pjEnAttente.length){
    const b = document.getElementById('ia-valider');
    if(b){ b.disabled = true; b.textContent = 'Envoi du document…'; }
    for(const f of pjEnAttente){
      const m = await envoyerPiece(f);
      if(!m){
        if(b){ b.disabled = false; b.textContent = 'Enregistrer'; }
        return;
      }
      pieces.push(m);
    }
    if(b){ b.disabled = false; b.textContent = 'Enregistrer'; }
  }

  const o = {
    id: uid(), auteur: moi === 'Anonyme' ? '' : moi, quand: new Date().toISOString(),
    date: g('date') || aujourdhui(), heure: g('heure'),
    sens: "Reçu de l'ARS", canal: 'Mail', interlocuteur: "ARS Nouvelle-Aquitaine",
    objet, demande: g('contenu'), reponse: '', attendu: '', lien: '', echeance: '', statut: 'En cours',
    pieces
  };

  etat.ars = etat.ars || [];
  /* Le registre des échanges peut avoir été classé à la main : une
     entrée nouvelle s'y place en tête, comme dans son propre onglet. */
  if(estManuel('ars')) o.rang = Math.min(...etat.ars.map(x => typeof x.rang === 'number' ? x.rang : 0)) - 1;
  etat.ars.unshift(o);
  consignerRegistreEnCourante('ars', o);

  infoARSOuverte = o.id;
  pjEnAttente = [];
  await sauver(); fermer(); rendre();
  toast(pieces.length
    ? "Information consignée avec son document, dans les échanges avec l'ARS et en main courante"
    : "Information consignée, dans les échanges avec l'ARS et en main courante");
}

async function retirerInfoARS(id){
  const a = (etat.ars || []).find(x => x.id === id);
  if(!a) return;
  const npj = (a.pieces || []).filter(p => p && p.id).length;
  if(!confirm(`Retirer « ${a.objet || 'cette information'} » ?\n\nElle disparaît aussi des échanges avec l'ARS.`
    + (npj ? `\nLe${npj > 1 ? 's' : ''} ${npj} document${npj > 1 ? 's' : ''} joint${npj > 1 ? 's' : ''} ${npj > 1 ? 'sont supprimés' : 'est supprimé'} de l'hébergement.` : '')
    + `\nSa ligne de main courante, elle, reste.`)) return;
  /* Le fichier ne survit pas à la ligne qui le portait : personne
     n'aurait plus d'adresse pour le retrouver, et il tiendrait la
     place sur l'hébergement. */
  for(const p of (a.pieces || [])){ if(p && p.id) await effacerPiece(p.id); }
  await supprimer('ars', id);
}

/* =========================================================
   LA MAIN COURANTE
   =========================================================
   Elle est le seul journal du cockpit. Le « Fil d'actualité »
   qui recomposait la même chose à côté d'elle, en lisant tous
   les registres et sans rien garder, a été supprimé : deux pages
   disaient la même journée en deux mots différents, et personne
   ne savait laquelle faisait foi. C'est la main courante qui fait
   foi — elle est écrite, exportée, imprimée, et c'est d'elle que
   les rapports tirent leur matière.

   Ce que le fil avait de juste, en revanche, c'est sa forme : une
   ligne par fait, l'heure en marge, la nature en pastille, et rien
   de plus tant qu'on n'a pas demandé à lire. La main courante la
   reprend telle quelle. Trois cents entrées se parcourent ainsi
   d'un coup d'œil, là où trois cents cartes demandaient dix
   écrans.
   --------------------------------------------------------- */

/* La nature d'une entrée : d'où elle vient dans le cockpit. Elle
   est posée à l'écriture, et sert à ne lire que les échanges avec
   l'ARS, ou que les appels aux CPTS, dans un registre qui reçoit
   tout. L'ordre ci-dessous est celui des pastilles de filtre. */
const MC_TYPES = [
  ['Consigné',  'e-lancer'],
  ['ARS',       'e-attente'],
  ['Visio ARS', 'e-attente'],
  ['Situation', 'e-fini'],
  ['CPTS',      'e-cours'],
  ['Réhydratation', 'e-cours'],
  ['Rapport',   'e-fini']
];
const MC_COUL = t => (MC_TYPES.find(x => x[0] === t) || [,'e-lancer'])[1];

/* Les entrées écrites avant que la nature n'existe la retrouvent
   à leur identifiant : c'est lui qui dit de quel registre elles
   sont nées. Celles saisies à la main n'ont ni l'un ni l'autre —
   elles sont « consignées », et c'est exact. */
const MC_PREFIXES = [];
function typeMC(o){
  if(o.type && MC_TYPES.some(x => x[0] === o.type)) return o.type;
  const id = String(o.id || '');
  if(id.startsWith('mcr-')){
    const k = id.slice(4).split('-')[0];
    if(MC_REG[k]) return MC_REG[k].type;
  }
  const p = MC_PREFIXES.find(x => id.startsWith(x[0]));
  return p ? p[1] : 'Consigné';
}

/* Une entrée se lit en une ligne : sa première phrase, ou ce qui
   tient en cent soixante-dix signes. Les entrées venues du cockpit
   sont écrites pour tenir ainsi ; celles écrites à la main sont
   parfois des paragraphes entiers, et c'est le dépliage qui les
   rend. On ne coupe pas sur un point trop précoce — « Dr. Martin »
   n'est pas une fin de phrase. */
function resumeMC(t){
  const s = String(t || '').replace(/\s+/g, ' ').trim();
  if(!s) return '—';
  const m = s.match(/^.{40,}?[.!?](?=\s|$)/);
  let r = m ? m[0] : s;
  if(r.length > 170) r = r.slice(0, 168).replace(/\s+\S*$/, '') + '…';
  return r;
}
/* Y a-t-il quelque chose de plus à lire que la ligne ? Sans quoi
   le bouton « Détail » ne mènerait nulle part. */
const plusQueLeResumeMC = o =>
  String(o.suite || '').trim() !== '' ||
  resumeMC(o.evenement) !== String(o.evenement || '').replace(/\s+/g, ' ').trim();

function vueCourante(){
  const toutes = chrono('courante', etat.courante);
  const presents = MC_TYPES.map(x => x[0]).filter(t => toutes.some(o => typeMC(o) === t));
  if(filtreMC !== 'Tout' && presents.indexOf(filtreMC) < 0) filtreMC = 'Tout';
  const lignes = filtreMC === 'Tout' ? toutes : toutes.filter(o => typeMC(o) === filtreMC);
  const dh = venuesDuDehors().length;
  const n = toutes.length;

  let h = `<h1>Main courante</h1>
  <p class="chapo">${CHAMPS.courante.chapo}</p>
  <div class="barre-h">
    <span class="cpt-h">${n} entrée${n > 1 ? 's' : ''} · de la plus récente à la plus ancienne${
      dh ? ` · ${dh} venue${dh > 1 ? 's' : ''} du dehors` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('courante')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('courante')">Ajouter une entrée</button>
  </div>`;

  if(presents.length > 1)
    h += `<div class="filtres">${['Tout', ...presents].map(t =>
      `<button class="${filtreMC === t ? 'on' : ''}" onclick="filtrerMC('${esc(t)}')">${esc(t)}${
        t === 'Tout' ? '' : ` <span style="opacity:.6">${toutes.filter(o => typeMC(o) === t).length}</span>`
      }</button>`).join('')}</div>`;

  h += barreOrdre('courante');

  if(!lignes.length)
    return h + `<div class="carte"><p class="vide">${n
      ? "Aucune entrée de cette nature. <a href=\"#\" onclick=\"filtrerMC('Tout');return false;\">Tout afficher</a>."
      : "Rien de consigné pour l'instant. La main courante se remplit d'elle-même dès qu'une page du cockpit enregistre quelque chose ; le bouton « Ajouter une entrée » sert à ce qui n'a pas de page."}</p></div>`;

  /* Classée à la main, la main courante ne suit plus les jours :
     les intertitres de journée n'ont plus rien à séparer, et
     chaque ligne porte alors sa date entière. */
  const manuel = estManuel('courante');
  let jour = null;
  h += `<div class="carte"><ul class="fil">`;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<li class="jour"><div class="h"></div><div class="c"><span class="n">${esc(frdateJour(jour))}</span>${
        jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : ''}</div></li>`;
    }

    const t = typeMC(o);
    const src = String(o.source || '').trim();
    const ouvert = deplieesMC.has(o.id);
    const saisiLe = horodateSaisie(o.quand);

    /* Le nom de qui s'en est chargé est lui-même le bouton qui le
       corrige : personne n'a à chercher où se change une
       attribution faite automatiquement. Sans nom, le bouton le dit
       et attend qu'on le nomme. */
    const qui = String(o.qui || '').trim();
    const signature = `<button class="qui${qui ? '' : ' vide'}" onclick="ouvrirQui('${o.id}')"
      title="Changer la personne en charge">${esc(qui || 'personne nommée')}</button>`;

    const pied = [o.auteur ? 'saisi par ' + o.auteur + (saisiLe ? ' le ' + saisiLe : '')
                           : (saisiLe ? 'saisi le ' + saisiLe : ''),
                  o.modifiePar ? 'modifié par ' + o.modifiePar : '']
      .filter(Boolean).map(x => `<span class="sep">·</span>${esc(x)}`).join('');

    h += `<li><div class="h">${esc(manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' ') : (o.heure || '—'))}</div>
      <div class="c">
        <div class="tete">
          <span class="etiq ${MC_COUL(t)}">${esc(t)}</span>
          ${src ? `<span class="venu"><span class="p">Du dehors</span>${esc(src)}</span>` : ''}
          <span class="out">
            ${/* Pas de flèches ici : une main courante est datée, et
                 c'est la date qui la classe. Les monter et descendre
                 une à une au milieu de trois cents entrées ferait
                 perdre le regroupement par journée, qui est ce qu'on
                 vient lire. Le bandeau d'ordre manuel reste affiché
                 pour qui aurait déjà déplacé quelque chose, et permet
                 de revenir au tri par date. */''}
            ${boutonRetenu('courante', o)}
            <button title="Modifier l'entrée" onclick="ouvrirEdition('courante','${o.id}')">✎</button>
            <button class="sup" title="Supprimer" onclick="supprimer('courante','${o.id}')">×</button>
          </span>
        </div>
        <div class="t">${esc(resumeMC(o.evenement))}</div>
        <div class="s">${signature}${pied}${plusQueLeResumeMC(o)
          ? `<span class="sep">·</span><button class="plus" onclick="deplierMC('${o.id}')">${
              ouvert ? 'replier' : 'détail'}</button>` : ''}</div>
        ${plusQueLeResumeMC(o) ? `<div class="plein${ouvert ? '' : ' plie'}">
          <span class="k">Ce qui s'est passé</span>${esc(o.evenement || '—')}${
          String(o.suite || '').trim() ? `<span class="k">Suite donnée</span>${esc(o.suite)}` : ''}</div>` : ''}
        ${marqueRetenue(o)}
      </div></li>`;
  });
  return h + `</ul></div>`;
}

function filtrerMC(t){ filtreMC = t; rendre(); }
function deplierMC(id){
  if(deplieesMC.has(id)) deplieesMC.delete(id); else deplieesMC.add(id);
  rendre();
}

/* ---- corriger la personne en charge -----------------------
   Une entrée déposée par le cockpit porte le nom de la session
   qui l'a créée : c'est juste dans la plupart des cas, et faux
   dès qu'une personne saisit ce qu'une autre a fait. Le nom se
   change donc partout, y compris sur les entrées automatiques —
   et une fois changé à la main il ne se laisse plus réécrire par
   la fiche d'origine, ce que dit « quiFixe ». */
function ouvrirQui(id){
  const o = (etat.courante || []).find(x => x.id === id);
  if(!o) return;
  const noms = nomsMissionnes();
  document.getElementById('modale').innerHTML = `<h3>Qui s'en est chargé</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">${esc(resumeMC(o.evenement))}</p>
  <div class="form">
    <label class="large"><span class="k">Personne en charge</span>
      <input type="text" id="qui-nom" list="qui-l" autocomplete="off" value="${esc(o.qui || '')}"
        placeholder="Prénom et nom">
      <datalist id="qui-l">${noms.map(x => `<option value="${esc(x)}"></option>`).join('')}</datalist>
      <span class="aide">Laissé vide, l'entrée reste sans personne nommée. Un nom saisi ici tient : la fiche d'origine ne le réécrira plus.</span></label>
  </div>
  <div class="actions">
    <button class="btn" onclick="validerQui('${id}')">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
  </div>`;
  ouvrirRideau();
  setTimeout(() => { const i = document.getElementById('qui-nom'); if(i) i.focus({preventScroll:true}); }, 60);
}

async function validerQui(id){
  const o = (etat.courante || []).find(x => x.id === id);
  if(!o) return;
  const champ = document.getElementById('qui-nom');
  const nom = champ ? champ.value.trim() : '';
  o.qui = nom;
  o.quiFixe = true;
  o.modifiePar = moi;
  await sauver(); fermer(); rendre();
  toast(nom ? "Entrée attribuée à " + nom : "L'entrée ne nomme plus personne");
}

function vueAppels(){
  const l = etat.cpts || [];
  const ordre = {"Prioritaire":0, "À suivre":1, "Pour information":2};
  const tri = [...l].sort((a,b) => (ordre[a.priorite]??3) - (ordre[b.priorite]??3) || a.nom.localeCompare(b.nom,'fr'));
  const faits = l.filter(x => x.appels && x.appels.length).length;
  const nbApp = l.reduce((a,x) => a + ((x.appels||[]).length), 0);

  let h = `<h1>Contact avec les CPTS</h1>
  <p class="chapo">Les CPTS avec lesquelles la CPTS Pau Béarn se coordonne sur l'épisode caniculaire — l'InterCPTS des Pyrénées-Atlantiques d'abord, les voisines ensuite. On prend des nouvelles, on mutualise ce qui peut l'être, et on n'annonce pas de moyens qu'on n'a pas. Chaque échange se consigne, même quand la réponse est « rien ».</p>
  <div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${l.length}</div><div class="l">CPTS répertoriées</div></div>
    <div class="compteur"><div class="n">${faits}</div><div class="l">déjà contactées</div></div>
    <div class="compteur"><div class="n">${nbApp}</div><div class="l">appels consignés</div></div>
  </div>
  <div class="note">Les coordonnées proviennent d'annuaires publics et ne sont pas toutes à jour. Les noms des coordinatrices et des présidents ne sont pas publiés : le plus rapide est de les obtenir auprès de Claire (Agora Lib), puis de les renseigner ici.</div>
  <div class="barre-h"><button class="btn sec" onclick="exporterAppels()">Excel</button><button class="btn sec" onclick="imprimer()">PDF</button><button class="btn" onclick="ouvrirCpts()">Ajouter une CPTS</button></div>
  <div class="cptsl">`;

  tri.forEach(c => {
    const cl = c.priorite === 'Prioritaire' ? 'feu' : c.priorite === 'À suivre' ? 'proche' : '';
    const app = antechrono(c.appels);
    h += `<div class="cptsc ${cl} ${app.length?'fait':''}">
      <div><div class="nom">${esc(c.nom)}</div><div class="terr">${esc(c.territoire)}</div></div>
      <div class="rangee">
        <span class="etiq ${c.priorite==='Prioritaire'?'e-bloque':c.priorite==='À suivre'?'e-attente':'e-lancer'}">${esc(c.priorite)}</span>
        ${c.contact?`<span class="terr">Contact : ${esc(c.contact)}</span>`:''}
      </div>
      ${c.note?`<div class="obs">${esc(c.note)}</div>`:''}
      <div class="rangee">
        ${c.tel?`<a class="tel" href="tel:${esc(c.tel.replace(/[^0-9+]/g,''))}">Appeler ${esc(c.tel)}${c.telLibelle?`<small>${esc(c.telLibelle)}</small>`:''}</a>`:`<button class="btn sec" style="flex:1;min-width:150px;min-height:44px" onclick="ouvrirTel('${c.id}')">Ajouter le numéro</button>`}
        ${c.tel2?`<a class="tel second" href="tel:${esc(c.tel2.replace(/[^0-9+]/g,''))}">Appeler ${esc(c.tel2)}${c.tel2Libelle?`<small>${esc(c.tel2Libelle)}</small>`:''}</a>`:''}
        <button class="corriger" onclick="ouvrirTel('${c.id}')">Corriger le numéro</button>
      </div>
      ${c.telMaj?`<div class="telmaj">Numéro corrigé le ${frdate(c.telMaj.date)} par ${esc(c.telMaj.par||'—')}${c.telMaj.source?` · ${esc(c.telMaj.source)}`:''}</div>`:''}
      <div class="rangee">
        <select onchange="majCpts('${c.id}','statut',this.value)">
          ${['À appeler','Appelée','Sans réponse','À rappeler','Sans objet'].map(x=>`<option ${x===c.statut?'selected':''}>${x}</option>`).join('')}
        </select>
      </div>
      <div class="journal">
        ${app.length ? app.map(a => `<div class="app">
            <div class="q">${frdate(a.date)} ${esc(a.heure||'')} · ${esc(a.par||'—')}
              <button onclick="supprimerAppel('${c.id}','${a.id}')" title="Supprimer">×</button></div>
            ${a.qui?`<div class="s">Interlocuteur : ${esc(a.qui)}</div>`:''}
            <div class="d">${esc(a.dit)}</div>
            ${a.suite?`<div class="s">Suite : ${esc(a.suite)}</div>`:''}
          </div>`).join('') : `<p class="vide">Aucun appel consigné.</p>`}
      </div>
      <div class="rangee">
        <button class="btn" style="flex:1;min-width:150px" onclick="ouvrirAppel('${c.id}')">Consigner un appel</button>
        <button class="retirer" onclick="ouvrirCpts('${c.id}')">Modifier</button>
        <button class="retirer" onclick="supprimerCpts('${c.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

async function majCpts(id, champ, val){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  c[champ] = val; c.modifiePar = moi;
  await sauver(); rendre();
}

function ouvrirAppel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(c.nom)} — consigner un appel</h3><div class="form">
    <label><span class="k">Date</span><input type="date" id="ap-date" value="${aujourdhui()}"></label>
    <label><span class="k">Heure</span><input type="time" id="ap-heure" value="${maintenant()}"></label>
    <label class="large"><span class="k">Interlocuteur joint</span><input id="ap-qui" placeholder="Nom, fonction"></label>
    <label class="large"><span class="k">Ce qui a été dit *</span><textarea id="ap-dit" placeholder="Situation sur place, besoins exprimés, réponse obtenue…"></textarea></label>
    <label class="large"><span class="k">Suite à donner</span><textarea id="ap-suite" placeholder="Rappeler le…, transmettre à…, rien"></textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerAppel('${c.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}
async function validerAppel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  const g = k => document.getElementById('ap-'+k).value.trim();
  if(!g('dit')){ toast("Indiquez ce qui a été dit"); return; }
  c.appels = c.appels || [];
  c.appels.unshift({id:uid(), date:g('date'), heure:g('heure'), qui:g('qui'), dit:g('dit'), suite:g('suite'), par:moi});
  if(c.statut === 'À appeler') c.statut = 'Appelée';
  await sauver(); fermer(); rendre(); toast("Appel consigné");
}
async function supprimerAppel(cid, aid){
  const c = (etat.cpts||[]).find(x => x.id === cid); if(!c) return;
  c.appels = (c.appels||[]).filter(a => a.id !== aid);
  await sauver(); rendre(); toast("Appel supprimé");
}

/* Correction rapide des coordonnées : les annuaires publics sont souvent
   faux, on doit pouvoir remplacer le numéro sans passer par la fiche entière. */
function ouvrirTel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(c.nom)} — numéros à appeler</h3><div class="form">
    <label><span class="k">Numéro principal</span><input id="tl-tel" type="tel" value="${esc(c.tel||'')}" placeholder="06 00 00 00 00"></label>
    <label><span class="k">À qui il correspond</span><input id="tl-telLibelle" value="${esc(c.telLibelle||'')}" placeholder="Secrétariat, pilote…"></label>
    <label><span class="k">Second numéro</span><input id="tl-tel2" type="tel" value="${esc(c.tel2||'')}" placeholder="Facultatif"></label>
    <label><span class="k">À qui il correspond</span><input id="tl-tel2Libelle" value="${esc(c.tel2Libelle||'')}" placeholder="Ligne directe, portable…"></label>
    <label class="large"><span class="k">D'où vient le numéro</span><input id="tl-source" value="${esc(c.telMaj?c.telMaj.source:'')}" placeholder="Donné par le pilote au téléphone le 27/07"></label>
  </div>
  <div class="note">Le numéro publié dans les annuaires n'est pas toujours celui qui répond. Corrigez-le dès qu'un interlocuteur vous en donne un autre, et dites d'où il vient : les autres pilotes appelleront le bon.</div>
  <div class="actions"><button class="btn" onclick="validerTel('${c.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}
async function validerTel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  const g = k => document.getElementById('tl-'+k).value.trim();
  const avant = [c.tel||'', c.tel2||''].join('|');
  c.tel = g('tel'); c.telLibelle = g('telLibelle');
  c.tel2 = g('tel2'); c.tel2Libelle = g('tel2Libelle');
  const source = g('source');
  if([c.tel, c.tel2].join('|') !== avant || (c.telMaj && c.telMaj.source !== source) || (!c.telMaj && source)){
    c.telMaj = {date:aujourdhui(), par:moi, source};
  }
  c.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Numéros mis à jour");
}

function ouvrirCpts(id){
  const c = id ? (etat.cpts||[]).find(x=>x.id===id) : null;
  const pr = ['Prioritaire','À suivre','Pour information'];
  document.getElementById('modale').innerHTML = `<h3>${c?'Modifier':'Ajouter une CPTS'}</h3><div class="form">
    <label class="large"><span class="k">Nom *</span><input id="cp-nom" value="${esc(c?c.nom:'')}"></label>
    <label class="large"><span class="k">Territoire</span><textarea id="cp-territoire">${esc(c?c.territoire:'')}</textarea></label>
    <label><span class="k">Téléphone</span><input id="cp-tel" type="tel" value="${esc(c?c.tel:'')}"></label>
    <label><span class="k">Second numéro</span><input id="cp-tel2" type="tel" value="${esc(c?c.tel2:'')}" placeholder="Facultatif"></label>
    <label><span class="k">Coordinatrice ou président</span><input id="cp-contact" value="${esc(c?c.contact:'')}" placeholder="Nom, fonction"></label>
    <label><span class="k">Proximité du feu</span><select id="cp-priorite">${pr.map(x=>`<option ${c&&c.priorite===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label><span class="k">Site</span><input id="cp-url" value="${esc(c?c.url:'')}" placeholder="https://"></label>
    <label class="large"><span class="k">Observation</span><textarea id="cp-note">${esc(c?c.note:'')}</textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerCpts(${c?`'${c.id}'`:''})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}
async function validerCpts(id){
  const g = k => document.getElementById('cp-'+k).value.trim();
  if(!g('nom')){ toast("Le nom est obligatoire"); return; }
  const d = {nom:g('nom'), territoire:g('territoire'), tel:g('tel'), tel2:g('tel2'), contact:g('contact'), priorite:g('priorite'), url:g('url'), note:g('note')};
  etat.cpts = etat.cpts || [];
  const c = id ? etat.cpts.find(x=>x.id===id) : null;
  if(c) Object.assign(c, d); else etat.cpts.push({id:uid(), statut:'À appeler', appels:[], ...d});
  await sauver(); fermer(); rendre(); toast(c?"Modifié":"Ajouté");
}
async function supprimerCpts(id){
  noterRetrait(id);
  etat.cpts = (etat.cpts||[]).filter(x=>x.id!==id);
  await sauver(); rendre(); toast("Retiré");
}
function exporterAppels(){
  const rows = [['CPTS','Territoire','Téléphone','Second numéro','Contact','Proximité','Statut','Date','Heure','Interlocuteur',"Ce qui a été dit",'Suite','Appelé par'].map(csvVal)];
  (etat.cpts||[]).forEach(c => {
    const tete = [c.nom,c.territoire,c.tel,c.tel2||'',c.contact,c.priorite,c.statut];
    if(!(c.appels||[]).length){
      rows.push([...tete,'','','','','',''].map(csvVal));
    } else {
      antechrono(c.appels).forEach(a => rows.push([...tete,a.date,a.heure,a.qui,a.dit,a.suite,a.par].map(csvVal)));
    }
  });

/* L'entrée garde la date et l'heure du fait, pas celles de la
   frappe : une fiche corrigée le lendemain ne doit pas remonter en
   tête de la journée. Une entrée sans heure se range en fin de
   journée, ce qui vaut mieux qu'une heure inventée. */
function poserEnCourante(id, t){
  etat.courante = etat.courante || [];
  etat.retires = etat.retires || [];
  if(etat.retires.includes(id)) return;
  const deja = etat.courante.find(x => x.id === id);
  const ligne = {
    id,
    type: t.type || (deja && deja.type) || 'Consigné',
    date: t.date || (deja && deja.date) || aujourdhui(),
    /* L'heure vient de la fiche d'origine quand celle-ci en porte une
       — corriger l'heure d'une remontée corrige son entrée de main
       courante. Les fiches qui n'en portent pas laissent intacte
       l'heure notée à la main dans la main courante. */
    heure: t.heure || (deja ? deja.heure : ''),
    source: t.source || '', evenement: t.evenement, suite: t.suite,
    /* Une attribution corrigée à la main tient : la fiche d'origine
       ne la réécrit plus, même si elle est enregistrée à nouveau
       depuis une autre session. C'est ce que dit « quiFixe », posé
       par la correction et jamais par le cockpit.

       À défaut de nom sur la fiche, c'est la session qui écrit qui
       s'en est chargée — sauf quand la fiche est formelle : une
       inscription arrivée par le formulaire public n'a été menée
       par personne de la CPTS, et l'attribuer à qui ouvre le
       cockpit serait faux. « quiStrict » le dit, et l'entrée
       attend alors qu'on la nomme. */
    qui: (deja && deja.quiFixe) ? deja.qui
       : (t.qui || (deja && deja.qui)
          || (t.quiStrict ? '' : (moi === 'Anonyme' ? '' : moi))),
    auteur: (deja && deja.auteur) || (moi === 'Anonyme' ? '' : moi),
    quand: (deja && deja.quand) || ''
  };
  if(deja) Object.assign(deja, ligne);
  else etat.courante.unshift(ligne);
}
/* ---- ce que chaque registre laisse en main courante --------
   Règle du cockpit : ce qui est renseigné quelque part se retrouve
   en main courante, en plus de sa rubrique. Un registre inscrit ici
   y laisse une ligne, une seule, écrite pour tenir sur une ligne.

   Chaque registre ne dit ici que trois choses : sa nature, le nom
   de qui s'en est chargé, et la phrase qui résume la fiche. Le
   reste — l'idempotence, l'heure du fait, l'attribution corrigée à
   la main — est l'affaire de poserEnCourante().

   Les rubriques d'action de la canicule s'ajoutent ici, une clé
   chacune, le jour où elles sont arrêtées. */
const MC_REG = {
  /* Une officine recensée laisse une ligne, et une seule : la
     réécrire corrige la ligne au lieu d'en ajouter une. */
  pharmacies: {
    type:'Réhydratation', personne:o => o.auteur,
    phrase:o => `Pharmacie ${o.nom || 'non nommée'}${o.commune ? ` (${o.commune})` : ''}`
      + ` — réhydratation à domicile : ${(o.statut || 'à contacter').toLowerCase()}`
      + (o.stock ? `. Tient : ${o.stock}` : '') + '.'
  },
  /* Une personne signalée aussi — en initiales, comme au registre.
     La main courante ne dit pas ici ce que la rubrique ne dit pas
     déjà : ni numéro de téléphone, ni adresse. */
  rehyd: {
    type:'Réhydratation', personne:o => o.auteur,
    phrase:o => `Personne signalée pour une réhydratation à domicile — ${o.nom || 'initiales non renseignées'}`
      + (o.age ? `, ${o.age} ans` : '') + (o.commune ? `, ${o.commune}` : '')
      + (o.motif ? ` : ${o.motif}` : '')
      + (o.decNom ? `. Signalée par ${o.decNom}` : '')
      + (String(o.idelNom || '').trim() ? `. Cabinet IDEL désigné : ${o.idelNom}`
         : o.idel === 'Non' ? `. Aucun cabinet IDEL identifié — médecin déclarant à rappeler` : '')
      + '.'
  },
  /* Un échange né d'une visio de crise en est déjà sorti consigné,
     avec son compte rendu : on ne le réécrit pas ici, où il ne
     dirait rien de plus et ferait doublon. */
  ars: {
    type:'ARS', personne:o => o.auteur,
    phrase:o => {
      if(o.visio) return '';
      /* Le document reçu se nomme dans la ligne : c'est par la main
         courante qu'on retrouve, trois jours après, de quel jour
         datait le communiqué qu'on cherche. */
      const pj = (o.pieces || []).filter(p => p && p.nom).map(p => p.nom);
      return `${o.sens || "Échange avec l'ARS"} — ${o.objet || 'objet non renseigné'}`
        + (o.interlocuteur ? ` (${o.interlocuteur})` : '') + '.'
        + (pj.length ? ` Document${pj.length > 1 ? 's' : ''} joint${pj.length > 1 ? 's' : ''} : ${pj.join(', ')}.` : '');
    }
  }
};

const idMCReg = (k, o) => 'mcr-' + k + '-' + o.id;

function consignerRegistreEnCourante(k, o){
  const cfg = MC_REG[k];
  if(!cfg || !o || !o.id) return;
  let phrase = '';
  try{ phrase = cfg.phrase(o); }catch(e){ return; }
  if(!String(phrase || '').trim()) return;
  poserEnCourante(idMCReg(k, o), {
    type: cfg.type,
    date: o.date || '',
    heure: o.heure || '',
    qui: (cfg.personne ? cfg.personne(o) : '') || '',
    quiStrict: true,
    /* Pas de source : ces fiches sont notre propre recensement, pas
       une information qu'on nous a communiquée. Celles qui viennent
       vraiment du dehors — un donateur, une structure — le disent
       dans leur phrase, et non par un bandeau qui les compterait à
       tort comme remontées de terrain. */
    source: '',
    evenement: phrase,
    suite: ''
  });
}

/* Les fiches arrivées sans passer par le cockpit — le formulaire
   public en ligne, la saisie d'une autre session — n'ont pas
   déclenché leur consignation. On les y porte une fois, à
   l'ouverture, à la date du fait. Une entrée déjà là est réécrite
   plutôt que doublée ; une entrée retirée à la main ne revient
   pas. */
function consignerRegistresHerites(){
  Object.keys(MC_REG).forEach(k => {
    (etat[k] || []).forEach(o => consignerRegistreEnCourante(k, o));
  });
}

let brouillonSit = null;
