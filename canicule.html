      + `<div class="actions"><button class="btn sec" onclick="aller('courante')">Ouvrir la main courante</button></div>`;
  }
  return h + `</div>`;
}

function classeStatut(s){
  return {'À lancer':'e-lancer','En cours':'e-cours','En attente':'e-attente','Terminé':'e-fini','Bloqué':'e-bloque'}[s] || 'e-lancer';
}

async function ajouterConsigne(type){
  const m = document.getElementById('modale');
  m.innerHTML = `<h3>Nouvelle consigne</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">${type==='faire'?"Ce que les membres doivent faire maintenant.":"Ce qu'il ne faut surtout pas faire, et qui doit être dit explicitement."}</p>
    <label><span class="k">Consigne</span><textarea id="in-cons"></textarea></label>
    <div class="actions"><button class="btn" onclick="validerConsigne('${type}')">Ajouter</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
  setTimeout(()=>document.getElementById('in-cons').focus({preventScroll:true}), 60);
}
async function validerConsigne(type){
  const v = document.getElementById('in-cons').value.trim();
  if(v){ etat.consignes[type].push(v); await sauver(); }
  fermer(); rendre();
}
function modifierConsigne(type, i){
  document.getElementById('modale').innerHTML = `<h3>Modifier la consigne</h3>
    <label><span class="k">Consigne</span><textarea id="in-cons">${esc(etat.consignes[type][i])}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerModifConsigne('${type}',${i})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}
async function validerModifConsigne(type, i){
  const v = document.getElementById('in-cons').value.trim();
  if(v) etat.consignes[type][i] = v;
  await sauver(); fermer(); rendre(); toast("Consigne modifiée");
}
async function retirerConsigne(type, i){
  etat.consignes[type].splice(i,1); await sauver(); rendre();
}

/* Les renforts d'une mission : des personnes positionnées auprès
   du pilote, chacune avec ce qu'elle prend en charge. */
function renfortsDe(m){ return Array.isArray(m.renforts) ? m.renforts : []; }

function referentDe(nom){
  return (etat.referents || []).find(r => cleP(r.nom) === cleP(nom)) || null;
}

/* L'équipe telle qu'elle se déduit des missions. Les référents de
   la gestion de crise y figurent au même titre, même sans mission :
   ils n'ont plus de bloc à part, ni de carnet d'adresses parallèle.
   Ceux qu'on a saisis sans rien leur confier encore y sont aussi. */
function equipeDeCrise(){
  const gens = new Map();
  const inscrire = n => {
    const t = (n || '').trim();
    if(!t || t === 'Anonyme') return null;
    if(!gens.has(cleP(t))) gens.set(cleP(t), {nom:t, pilote:[], appui:[]});
    return gens.get(cleP(t));
  };
  const ajoute = (nom, m, role, mention) => {
    const g = inscrire(nom);
    if(g) g[role].push({mid:m.id, titre:m.titre, mention:mention || ''});
  };
  etat.missions.forEach(m => {
    ajoute(m.pilote, m, 'pilote');
    ajoute(m.suppleant, m, 'appui', 'Suppléant');
    renfortsDe(m).forEach(r => ajoute(r.nom, m, 'appui', r.role || 'Renfort'));
  });
  (etat.referents || []).forEach(r => inscrire(r.nom));
  normaliserPersonnes();
  Object.values(etat.personnes || {}).forEach(p => inscrire(p.nom));

  /* La cellule de crise d'abord, puis ceux qui pilotent le plus. */
  return [...gens.values()]
    .map(p => Object.assign(p, {ref: referentDe(p.nom)}))
    .sort((a,b) => (b.ref ? 1 : 0) - (a.ref ? 1 : 0)
                || b.pilote.length - a.pilote.length
                || a.nom.localeCompare(b.nom, 'fr'));
}

/* Le feuillet d'arrivée, dans l'ordre où la carte se lit : le nom
   en grand, la profession, le statut dans l'association, la mission
   portée, les renforts positionnés dessus, et la fiche mission en
   bas. Le statut d'avancement et la prochaine action se lisent dans
   « Par mission » — la même liste n'est jamais affichée deux fois
   sur le même écran. */
function vuePersonnes(){
  const liste = equipeDeCrise();
  let h = `<div class="miss-gens">`;

  liste.forEach(p => {
    const c = coord(p.nom);
    const nEsc = esc(p.nom).replace(/'/g, "\\'");
    const prof = ((p.ref && p.ref.profession) || c.profession || '').trim();
    /* Ce que la personne est dans l'association, pas ce qu'elle fait
       sur la crise : vice-présidente, référente d'un groupe de
       travail. Rien ne s'affiche quand elle n'a pas de statut. */
    const statut = [(c.statut || '').trim(), p.ref ? 'Cellule de crise' : '']
      .filter(Boolean).join(' · ');
    let contact = '';
    if(c.tel)  contact += `<a href="tel:${esc(String(c.tel).replace(/\s/g,''))}">📞 ${esc(c.tel)}</a>`;
    if(c.mail) contact += `<a href="mailto:${esc(c.mail)}">✉️ ${esc(c.mail)}</a>`;

    const portees = p.pilote.map(o => ({o:o, role:'Pilote'}))
      .concat(p.appui.map(o => ({o:o, role:o.mention || 'Renfort'})));

    h += `<div class="miss-pers">
      <div class="nom">${esc(p.nom)}</div>
      ${prof ? `<div class="prof">${esc(prof)}</div>` : ''}
      ${statut ? `<div class="statut">${esc(statut)}</div>` : ''}
      <div class="lignes">
        ${portees.map(x => blocMissionPers(x.o, x.role, p.nom)).join('')}
        ${portees.length ? ''
          : `<div class="prof" style="margin:0">Aucune mission confiée pour l'instant.
             <button class="plusrf" onclick="nouvelleMission('${nEsc}')">+ Confier une mission</button></div>`}
      </div>
      <div class="tel">
        ${contact || `<button class="manquant" onclick="editerContact('${nEsc}')">Numéro à renseigner</button>`}
        <button class="modif" onclick="editerContact('${nEsc}')">Modifier la fiche</button>
      </div>
    </div>`;
  });

  h += `<button class="miss-neuf" onclick="editerContact('')">
    <span class="plus">+</span>
    <span class="t">Ajouter quelqu'un</span>
    <span class="d">Un nom, un numéro. On lui confie une mission ensuite.</span>
  </button></div>`;

  return h + bandeAPourvoir();
}

/* Une mission sous un nom : l'intitulé, les noms de ceux qui
   viennent en renfort dessus, le bouton qui en ajoute un sans
   quitter la carte, et la fiche mission en bas. */
function blocMissionPers(o, role, personne){
  const m = etat.missions.find(x => x.id === o.mid);
  if(!m) return '';
  const noms = renfortsDe(m).map(r => (r.nom || '').trim())
    .filter(n => n && cleP(n) !== cleP(personne));
  return `<div class="mis">
    ${role === 'Pilote' ? '' : `<span class="role">${esc(role)}</span>`}
    <div class="mt">${esc(m.titre)}</div>
    ${m.echeance ? `<div class="ech">Échéance ${frdateL(m.echeance)}</div>` : ''}
    ${noms.length ? `<div class="rf"><span class="k">En renfort</span>${esc(noms.join(', '))}</div>` : ''}
    <button class="plusrf" onclick="ajouterRenfort('${m.id}')">+ Renfort</button>
    <button class="btn sec fichem" onclick="voirFiche('${m.id}')">Fiche mission</button>
  </div>`;
}

/* Ce que personne ne porte n'est pas quelqu'un : la bande descend
   sous les noms au lieu de se présenter comme une carte d'équipe. */
function bandeAPourvoir(){
  const v = etat.missions.filter(m => !(m.pilote || '').trim());
  if(!v.length) return '';
  return `<div class="apourvoir">
    <div class="tt">${v.length} mission${v.length > 1 ? 's' : ''} que personne ne porte</div>
    <div class="ss">Une mission sans nom en face ne se fait pas.</div>
    <ul>${v.map(m => `<li>
      <button class="t" onclick="voirFiche('${m.id}')">${esc(m.titre)}</button>
      <span class="etiq ${classeStatut(m.statut)}">${esc(m.statut)}</span>
      <button class="designer" onclick="modifierMission('${m.id}')">Désigner un pilote</button>
    </li>`).join('')}</ul>
  </div>`;
}

/* Les référents de la gestion de crise n'ont plus de bloc à eux
   ni de carnet séparé : ils apparaissent sur la grille des
   personnes, en tête, avec la mention « Cellule de crise ». Leur
   appartenance se coche depuis leur fiche — voir editerContact. */

/* Les renforts s'ajoutent là où on les cherche : sous la mission
   qu'ils épaulent, dans le feuillet « Par mission ». */
function blocRenforts(mid){
  const m = etat.missions.find(x => x.id === mid);
  if(!m) return '';
  return `<div class="renforts">` +
    renfortsDe(m).map((r,i) => `<div class="rf">
      <div class="n">${esc(r.nom)}${r.role ? `<span class="q">${esc(r.role)}</span>` : ''}</div>
      <button class="rx" title="Retirer ce renfort" onclick="retirerRenfort('${mid}',${i})">×</button>
    </div>`).join('') +
    `<button class="rplus" onclick="ajouterRenfort('${mid}')">+ Ajouter un renfort</button></div>`;
}

function ajouterRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const noms = nomsMissionnes().filter(n => cleP(n) !== cleP(m.pilote));
  document.getElementById('modale').innerHTML = `<h3>Renfort sur « ${esc(m.titre)} »</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Une personne positionnée auprès de ${m.pilote ? esc(m.pilote) : 'la mission'}, avec ce qu'elle prend en charge. Elle apparaîtra dans l'organigramme, où son numéro pourra être renseigné.</p>
    ${noms.length ? `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà dans le cockpit&nbsp;:</p>
      <div class="choixnom">${noms.map(n => `<button onclick="document.getElementById('rf-nom').value='${esc(n).replace(/'/g,"\\'")}'">${esc(n)}</button>`).join('')}</div>` : ''}
    <label><span class="k">Prénom et nom *</span><input id="rf-nom" placeholder="Prénom et nom"></label>
    <label style="margin-top:12px"><span class="k">Ce qu'il ou elle prend en charge</span>
      <input id="rf-role" placeholder="Ex. phoning auprès des pharmaciens" onkeydown="if(event.key==='Enter')validerRenfort('${mid}')"></label>
    <div class="actions"><button class="btn" onclick="validerRenfort('${mid}')">Ajouter</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('rf-nom'); if(i) i.focus({preventScroll:true}); }, 60);
}

async function validerRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const nom = document.getElementById('rf-nom').value.trim();
  if(!nom){ toast("Le nom est obligatoire"); return; }
  m.renforts = renfortsDe(m).concat([{nom:nom, role:document.getElementById('rf-role').value.trim(), par:moi}]);
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Renfort ajouté");
}

async function retirerRenfort(mid, i){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const r = renfortsDe(m).slice();
  r.splice(i,1);
  m.renforts = r;
  m.modifiePar = moi;
  await sauver(); rendre();
}

/* Les statuts dans l'ordre où ils se lisent : ce qui tourne
   d'abord, ce qui est clos en dernier. */
const ORDRE_STATUT = ['En cours','À lancer','En attente','Bloqué','Terminé'];
const LISERE_STATUT = {'En cours':'st-cours','À lancer':'st-lancer','En attente':'st-attente',
                       'Bloqué':'st-bloque','Terminé':'st-fini'};

/* « Par personne » est le feuillet d'arrivée : en crise, la
   première question posée à cet onglet est qui est là. */
let feuilletMissions = 'personne';
function allerFeuilletMissions(f){ feuilletMissions = f; rendre(); window.scrollTo(0,0); }

function vueMissions(){
  const sansPilote = etat.missions.filter(m => !(m.pilote || '').trim()).length;
  const sansSuppl  = etat.missions.filter(m => m.statut === 'En cours' && !(m.suppleant || '').trim()).length;
  const nbGens     = equipeDeCrise().length;

  let h = `<h1>Missions et organigramme</h1>
  <p class="chapo">Qui porte quoi, et ce qui doit être fait ensuite. La même liste se lit par personne ou par mission.</p>

  <div class="miss-trous">
    <div class="miss-trou${sansPilote ? ' alerte' : ''}"><div class="n">${sansPilote}</div>
      <div class="l">mission${sansPilote > 1 ? 's' : ''} sans pilote${sansPilote
        ? ` — <button onclick="allerFeuilletMissions('personne')">les pourvoir</button>` : ''}</div></div>
    <div class="miss-trou${sansSuppl ? ' veille' : ''}"><div class="n">${sansSuppl}</div>
      <div class="l">mission${sansSuppl > 1 ? 's' : ''} en cours sans suppléant</div></div>
    <div class="miss-trou"><div class="n">${nbGens}</div>
      <div class="l">personne${nbGens > 1 ? 's' : ''} engagée${nbGens > 1 ? 's' : ''} sur la crise</div></div>
    <div class="miss-trou"><div class="n">${etat.missions.length}</div>
      <div class="l">mission${etat.missions.length > 1 ? 's' : ''} ouverte${etat.missions.length > 1 ? 's' : ''}</div></div>
  </div>

  <div class="miss-angle">
    <div class="miss-lunettes" role="group" aria-label="Angle de lecture">
      <button class="${feuilletMissions === 'personne' ? 'on' : ''}"
        onclick="allerFeuilletMissions('personne')">Par personne</button>
      <button class="${feuilletMissions === 'mission' ? 'on' : ''}"
        onclick="allerFeuilletMissions('mission')">Par mission</button>
    </div>
    <button class="btn sec" onclick="imprimerMissions()">PDF</button>
  </div>`;

  /* Sur papier, l'organigramme et la liste des missions ne se
     choisissent pas : c'est la pièce qu'on joint à un point de
     situation ou qu'on tend à l'ARS, et elle doit dire qui est là
     et ce que chacun porte. */
  if(missionsSurPapier) return h
    + `<h2>Organigramme — qui est engagé</h2>` + vuePersonnes()
    + `<h2 style="margin-top:22px">Missions — où elles en sont</h2>` + vueParMission();

  return h + (feuilletMissions === 'personne' ? vuePersonnes() : vueParMission());
}

/* Le temps de l'impression, l'onglet se déplie en entier, puis
   l'écran revient sur le feuillet où on l'avait laissé. */
let missionsSurPapier = false;
function imprimerMissions(){
  missionsSurPapier = true;
  rendre();
  window.print();
  setTimeout(() => { missionsSurPapier = false; rendre(); }, 800);
}

/* Les missions groupées par statut. « Terminé » ferme la page,
   « En cours » l'ouvre : on ne cherche pas ce qui tourne. */
function vueParMission(){
  let h = `<div class="actions" style="margin:0 0 18px">
    <button class="btn" onclick="nouvelleMission()">Créer une mission</button></div>`;

  ORDRE_STATUT.forEach(s => {
    const lot = etat.missions.filter(m => m.statut === s);
    if(!lot.length) return;
    h += `<div class="miss-grp"><h3>${esc(s)}
      <span class="c">${lot.length} mission${lot.length > 1 ? 's' : ''}</span></h3>
      <div class="miss-pile">${lot.map(carteMission).join('')}</div></div>`;
  });

  /* Un statut saisi hors liste ne doit pas faire disparaître la
     mission de la page. */
  const orphelines = etat.missions.filter(m => ORDRE_STATUT.indexOf(m.statut) === -1);
  if(orphelines.length){
    h += `<div class="miss-grp"><h3>Sans statut <span class="c">${orphelines.length}</span></h3>
      <div class="miss-pile">${orphelines.map(carteMission).join('')}</div></div>`;
  }
  return h;
}

function carteMission(m){
  const esp = espaceDe(m);
  const pil = (m.pilote || '').trim();
  const sup = (m.suppleant || '').trim();
  /* Le suppléant ne manque qu'une fois le pilote désigné : tant que
     personne ne porte la mission, l'alerte porte sur le pilote. */
  const champSup = sup ? `<span class="qn">${esc(sup)}</span>`
    : pil ? `<button class="qn manque" onclick="modifierMission('${m.id}')">à désigner</button>`
          : `<span class="qn absent">—</span>`;

  return `<div class="miss-c ${LISERE_STATUT[m.statut] || 'st-lancer'}">
    <div class="haut">
      <div class="titre">${esc(m.titre)}</div>
      <select onchange="majMission('${m.id}','statut',this.value)" style="width:auto">
        ${ORDRE_STATUT.map(s => `<option ${s === m.statut ? 'selected' : ''}>${esc(s)}</option>`).join('')}
      </select>
    </div>
    ${m.detail ? `<div class="detail">${esc(m.detail)}</div>` : ''}

    <button class="miss-prochaine${m.prochaine ? '' : ' vide'}" onclick="modifierProchaine('${m.id}')">
      <span class="k">Prochaine action</span>
      <p>${esc(m.prochaine) || "Rien d'écrit. Une mission sans prochaine action ne bouge pas — cliquer pour la renseigner."}</p>
      ${m.echeance ? `<p style="font-size:12.5px;color:var(--texte-2)">Échéance ${frdateL(m.echeance)}</p>` : ''}
    </button>

    <div class="miss-eq">
      <div><span class="k">Pilote</span>${pil ? `<span class="qn">${esc(pil)}</span>`
        : `<button class="qn manque" onclick="modifierMission('${m.id}')">à désigner</button>`}</div>
      <div><span class="k">Suppléant</span>${champSup}</div>
      <div style="flex:1 1 240px"><span class="k">Renforts</span>${blocRenforts(m.id)}</div>
    </div>

    <div class="barre-m">
      <button class="btn sec" onclick="voirFiche('${m.id}')">Fiche mission</button>
      <button class="btn sec" onclick="aller('${esp}')">Ouvrir « ${esc(nomEspace(esp))} »</button>
      <button class="btn sec" onclick="modifierMission('${m.id}')">Modifier</button>
      <button class="sup-m" title="Supprimer la mission" onclick="supprimerMission('${m.id}')">×</button>
    </div>
  </div>`;
}

/* La prochaine action se corrige là où elle se lit, sans passer
   par la fiche mission ni par un formulaire complet. */
function modifierProchaine(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  document.getElementById('modale').innerHTML = `<h3>Prochaine action</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Ce qui doit être fait ensuite sur « ${esc(m.titre)} ». C'est ce que lit le copil, et ce qui dit si la mission avance.</p>
    <label><span class="k">Prochaine action</span>
      <textarea id="pa-txt" style="min-height:110px" placeholder="Ex. rappeler la délégation départementale pour obtenir le circuit de retrait des FFP2">${esc(m.prochaine || '')}</textarea></label>
    <label style="margin-top:12px"><span class="k">Échéance — facultatif</span>
      <input id="pa-ech" type="date" value="${esc(m.echeance || '')}"></label>
    <div class="actions"><button class="btn" onclick="validerProchaine('${id}')">Enregistrer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('pa-txt'); if(i) i.focus({preventScroll:true}); }, 60);
}
async function validerProchaine(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  m.prochaine = document.getElementById('pa-txt').value.trim();
  m.echeance  = document.getElementById('pa-ech').value;
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Prochaine action enregistrée");
}
function lignes(t){ return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean); }

function voirFiche(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  const f = m.fiche || {};
  const li = lignes(f.faire);
  document.getElementById('modale').innerHTML = `
    <h3>${esc(m.titre)}</h3>
    <div class="fiche">
      <h4>Pourquoi</h4><p>${esc(f.but) || 'À renseigner.'}</p>
      <h4>Ce qu'il y a à faire</h4>
      ${li.length ? `<ul>${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '<p>À renseigner.</p>'}
      <h4>Avec qui</h4><p>${esc(f.avec) || '—'}</p>
      <h4>Pour qui</h4><p>${esc(f.pour) || '—'}</p>
      <h4>Ce qu'on ne fait pas</h4><div class="stop">${esc(f.limite) || '—'}</div>
      <h4>Où consigner</h4><p>${esc(nomEspace(espaceDe(m)))}</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="aller('${espaceDe(m)}');fermer()">Ouvrir l'espace</button>
      <button class="btn sec" onclick="editerFiche('${m.id}')">Modifier la fiche</button>
      <button class="btn sec" onclick="imprimerModale()">Imprimer</button>
      <button class="btn sec" onclick="fermer()">Fermer</button>
    </div>`;
  ouvrirRideau();
}

function editerFiche(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  const f = m.fiche || {};
  const opts = ONGLETS.filter(o => !['cockpit','missions'].includes(o.id))
    .map(o => `<option value="${o.id}" ${espaceDe(m)===o.id?'selected':''}>${o.nom}</option>`).join('');
  document.getElementById('modale').innerHTML = `
    <h3>Fiche mission</h3>
    <label style="margin-bottom:10px"><span class="k">Intitulé</span><input id="fi-titre" value="${esc(m.titre)}"></label>
    <label style="margin-bottom:10px"><span class="k">Pourquoi — une phrase</span><textarea id="fi-but" style="min-height:56px">${esc(f.but||'')}</textarea></label>
    <label style="margin-bottom:10px"><span class="k">Ce qu'il y a à faire — une action par ligne</span><textarea id="fi-faire">${esc(f.faire||'')}</textarea></label>
    <label style="margin-bottom:10px"><span class="k">Avec qui</span><input id="fi-avec" value="${esc(f.avec||'')}"></label>
    <label style="margin-bottom:10px"><span class="k">Pour qui</span><input id="fi-pour" value="${esc(f.pour||'')}"></label>
    <label style="margin-bottom:10px"><span class="k">Ce qu'on ne fait pas</span><textarea id="fi-limite" style="min-height:56px">${esc(f.limite||'')}</textarea></label>
    <label style="margin-bottom:10px"><span class="k">Où consigner</span><select id="fi-espace">${opts}</select></label>
    <div class="actions"><button class="btn" onclick="validerFiche('${m.id}')">Enregistrer</button><button class="btn sec" onclick="voirFiche('${m.id}')">Annuler</button></div>`;
  ouvrirRideau();
}

async function validerFiche(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  const g = k => document.getElementById('fi-'+k).value.trim();
  m.titre = g('titre') || m.titre;
  m.espace = g('espace');
  m.fiche = {but:g('but'), faire:g('faire'), avec:g('avec'), pour:g('pour'), limite:g('limite')};
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Fiche enregistrée");
}

/* Les noms déjà connus, proposés en un clic : on tape rarement
   deux fois le même nom, et une faute de frappe crée une carte
   en double dans l'organigramme. */
function choixPilote(champ, actuel, exclu){
  const noms = nomsMissionnes().filter(n => !exclu || cleP(n) !== cleP(exclu));
  if(!noms.length) return '';
  return `<div class="choixnom compact">` + noms.map(n =>
    `<button class="${cleP(n)===cleP(actuel)?'on':''}" onclick="document.getElementById('${champ}').value='${esc(n).replace(/'/g,"\\'")}'">${esc(n)}</button>`).join('') + `</div>`;
}

/* Créer une mission tient en deux réponses : ce qu'il y a à faire,

/* Une échéance se pose en un clic : en crise, personne n'ouvre un
   calendrier pour dire « demain ». */
const DELAIS = [{l:"Aujourd'hui", j:0}, {l:'Demain', j:1}, {l:'Sous 3 jours', j:3}, {l:'Sous une semaine', j:7}];
function poserDelai(champ, jours){

/* Renommer, réaffecter, clore : tout ce qui se corrige au fil de

async function validerModifMission(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;

  const t = g('titre');

  m.statut = document.getElementById('em-statut').value; m.prochaine = g('prochaine');

}
async function validerMission(){
  const t = document.getElementById('nm-titre').value.trim();
  if(!t){ toast("Dites ce qu'il y a à faire"); return; }
  const p = document.getElementById('nm-pilote').value.trim();
  const id = uid();
  etat.missions.push({
    id:id, titre:t, detail:'',
    pilote:p, suppleant:'', renforts:[],
    prochaine:'', echeance:document.getElementById('nm-ech').value,
    statut:'À lancer', espace:'courante',
    fiche:{but:'', faire:'', avec:'', pour:'', limite:''}, creePar:moi
  });
  await sauver(); rendre();
  toast(p ? `Mission confiée à ${p}` : "Mission créée — reste à désigner un pilote");
  /* Une mission se porte rarement seule : le renfort se propose
     dans la foulée, sans avoir à retrouver la carte. */
  proposerRenfort(id);
}

/* Juste après la création : ajouter un renfort en un bouton, ou
   passer. C'est le seul moment où on sait encore qui devait
   épauler. */
function proposerRenfort(id){
  const m = etat.missions.find(x => x.id === id); if(!m){ fermer(); return; }
  document.getElementById('modale').innerHTML = `<h3>Mission créée</h3>
    <p style="color:var(--texte-2);margin:0 0 6px">« ${esc(m.titre)} »${m.pilote ? ` — portée par ${esc(m.pilote)}` : ''}.</p>

    <div class="actions"><button class="btn" onclick="ajouterRenfort('${id}')">+ Ajouter un renfort</button>
      <button class="btn sec" onclick="fermer()">Pas pour l'instant</button></div>`;

}
async function supprimerMission(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  document.getElementById('modale').innerHTML = `<h3>Supprimer cette mission&nbsp;?</h3>
    <p style="color:var(--texte-2)">« ${esc(m.titre)} » disparaîtra de l'organigramme. Les saisies déjà enregistrées dans son espace sont conservées.</p>
    <div class="actions"><button class="btn" onclick="confirmerSuppression('${id}')">Supprimer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}
async function confirmerSuppression(id){
  noterRetrait(id);
  etat.missions = etat.missions.filter(x => x.id !== id);
  await sauver(); fermer(); rendre(); toast("Mission supprimée");
}

async function majMission(id, champ, val){
  const m = etat.missions.find(x => x.id === id);
  if(!m) return;
  m[champ] = val.trim();
  m.modifiePar = moi;
  await sauver();
  if(champ === 'statut' || champ === 'pilote' || champ === 'suppleant') rendre();
  else toast("Enregistré");
}

/* =========================================================
   SITUATION RÉGIONALE — le poste de veille

   La page ne fait plus qu'une chose : dire ce que l'ARS nous a dit,
   et quand. Trois objets, dans cet ordre :

   1. Qui tient la veille, et quand la page a bougé pour la dernière
      fois. C'est ce qu'on lit avant de croire ce qui suit.
   2. Le rendez-vous de l'ARS — le lien du salon, le rythme des
      séances, qui se positionne sur la prochaine, et le compte
      rendu de chacune.
   3. Les informations données par l'ARS hors visio — mails et
      communiqués, collés tels quels, la liste repliée et le texte à
      la demande.

   Le carnet de canaux, le tour de veille, le fil des informations
   retenues, le mode d'emploi en quatre gestes et les dix points de
   situation ont été retirés l'un après l'autre : ils demandaient un
   parcours que personne n'a le temps de faire en crise. Le geste
   attendu tient en un copier-coller. Les données correspondantes
   restent dans l'état partagé, sans affichage — les points de
   situation continuent de nommer les rubriques des sources.
   ========================================================= */
const SEUIL_POINT_H  = 12;  // au-delà, la page est réputée ne plus être fraîche

const horodate = () => aujourdhui() + ' ' + maintenant();
function heuresDepuis(q){
  if(!q) return Infinity;
  const t = new Date(q.slice(0,10) + 'T' + (q.slice(11,16) || '00:00') + ':00');
  return isNaN(t) ? Infinity : (Date.now() - t) / 36e5;
}
/* Les points de situation ne s'affichent plus nulle part. Ce qui en
   a été écrit reste dans l'état partagé — rien n'est effacé — et ces
   trois lignes restent la seule façon d'y accéder le jour où on
   voudrait les ressortir. */
const rubriques = () => etat.rubriques || [];
const rubriqueDe = id => rubriques().find(r => r.id === id);
const nomPoint = id => { const r = rubriqueDe(id); return r ? r.nom : ''; };
/* La dernière trace laissée sur cette page, quelle qu'en soit la
   nature : compte rendu de visio ou information de l'ARS consignée.
   C'est elle qui dit si ce qu'on lit ici est encore frais. Les
   points de situation n'y comptent plus depuis qu'ils ne s'affichent
   plus : dater la page d'après un texte que personne ne voit la
   ferait passer pour tenue alors qu'elle ne l'est pas. */
function derniereActualisation(){
  let d = null;
  const retenir = (quand, par, quoi) => {
    const q = quandNormalise(quand);
    if(q && (!d || q > d.quand)) d = {quand:q, par: par || '', quoi};
  };
  (etat.visios||[]).forEach(v => retenir(v.quand, v.auteur, 'Compte rendu de la visio du ' + frdate(v.date)));
  infosARS().forEach(a => retenir(a.quand, a.auteur, "Information de l'ARS : " + tronquer(a.objet || 'sans objet', 60)));
  return d;
}
/* Un objet de mail tient parfois sur deux lignes : dans la case
   « dernière actualisation », il déborderait sur le reste. */
const tronquer = (t, n) => String(t || '').length > n ? String(t).slice(0, n - 1).trim() + '…' : String(t || '');
/* Les points sont datés « AAAA-MM-JJ HH:MM », les visios en ISO :
   on ramène les deux à la même forme locale avant de les comparer. */
function quandNormalise(q){
  if(!q) return '';
  if(q.indexOf('T') === -1) return q;
  const t = new Date(q);
  if(isNaN(t)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
}
/* Qui tient la veille : le pilote de la mission rattachée à cet
   espace. Une seule source de vérité, dans Missions & organigramme. */
const missionVeille = () => (etat.missions||[]).find(m => espaceDe(m) === 'veille');

/* =========================================================
   LES VISIOS DE CRISE DE L'ARS

   L'ARS réunit ses partenaires en visioconférence à intervalle
   régulier et y déroule la situation de la région point par
   point. C'est, de loin, la source la plus dense dont dispose la
   CPTS : plutôt que de la laisser se diluer dans le fil des
   informations retenues, elle ouvre la situation régionale.

   La dernière séance s'affiche en entier, dépliée. Les
   précédentes se replient sous elle et se rouvrent d'un clic :
   on relit ce qui a été dit il y a deux jours sans quitter la
   page.
   ========================================================= */
let visioOuverte = null;
let pointsSaisie = [];

const visios = () => etat.visios || [];
const visiosTriees = () => [...visios()].sort((a,b) =>
  ((b.date||'') + ' ' + (b.heure||'')).localeCompare((a.date||'') + ' ' + (a.heure||'')));
const visioVide = v => !(v.points||[]).length && !v.consignes && !v.pourNous;

function ouvrirVisio(id){ visioOuverte = (visioOuverte === id) ? null : id; rendre(); }

/* Depuis le registre ARS, on retombe sur la séance dépliée : le
   registre dit qu'elle a eu lieu, la situation régionale dit ce qui
   s'y est dit. */
function ouvrirVisioDepuisARS(id){ visioOuverte = id; aller('veille'); }

/* =========================================================
   LE RENDEZ-VOUS DE L'ARS

   Deux choses, et seulement deux, en tête de la situation
   régionale :

   1. Le lien du salon, et le rythme des séances. Le lien est le
      même à chaque séance, il est déposé une fois, et il s'ouvre
      d'un clic depuis n'importe quel poste du cockpit. Avant, il
      circulait par mail et se cherchait cinq minutes avant.
   2. Le créneau de la prochaine séance. Chacun y pose son prénom
      pour dire qu'il y sera : l'équipe sait qui la représente
      avant que la séance commence, et personne n'y va à deux sans
      le savoir — ou n'y va à zéro en croyant qu'un autre y est.

   La présence annoncée n'est pas un compte rendu : ce qui s'est
   dit se consigne dessous, séance par séance.
   ========================================================= */
const salleVisio = () => (etat.salleVisio || [])[0] || null;
const presencesVisio = () => etat.presencesVisio || [];
/* Le prénom en cours de frappe. La page se redessine toute seule
   quand un autre poste enregistre quelque chose : sans ça, ce qui
   était tapé disparaissait sous les doigts. */
let saisiePresence = null;
const presencesDuJour = d => presencesVisio().filter(p => (p.date || '') === d);

/* Un lien collé à la va-vite arrive parfois sans « https:// », et
   parfois noyé dans le texte de l'invitation. On en extrait
   l'adresse, et on n'accepte qu'une adresse web : un bouton du
   cockpit ne doit pas pouvoir déclencher autre chose qu'une
   ouverture de page. */
function lienVisioPropre(v){
  const t = String(v || '').trim();
  if(!t) return '';
  const m = t.match(/https?:\/\/[^\s"'<>]+/i);
  if(m) return m[0];
  if(/^[\w.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?$/i.test(t)) return 'https://' + t;
  return '';
}

const heureVisio = () => (salleVisio() && salleVisio().horaire) || '12:00';
const heureLisible = h => String(h || '').replace(':00', ' h').replace(':', ' h ');

const dateJour = d => { const p = String(d || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; };
const isoJour = j => j.getFullYear() + '-' + String(j.getMonth() + 1).padStart(2,'0') + '-' + String(j.getDate()).padStart(2,'0');

/* À quelle cadence la séance revient. L'ARS ne réunit pas ses
   partenaires au même rythme d'une crise à l'autre : tous les
   jours quand la situation bouge d'heure en heure, une fois par
   semaine quand la vague de chaleur s'installe et qu'il n'y a
   plus qu'à en suivre la courbe. Le rythme se dépose avec le
   lien, et c'est lui qui décide des jours proposés sur la bande
   des créneaux : poser son prénom sur un mercredi quand la
   séance est le jeudi n'aurait dit à personne qu'on y serait.
   Rien de déposé vaut « tous les jours » — c'est ce qu'était le
   rendez-vous avant que la question se pose. */
const JOURS_SEM = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const recurrenceVisio = () => {
  const r = (salleVisio() || {}).recurrence;
  return (r === undefined || r === null || r === '') ? 'quotidien' : String(r);
};
const recurrenceLisible = () => {
  const r = recurrenceVisio();
  return r === 'quotidien' ? 'tous les jours' : 'tous les ' + JOURS_SEM[+r] + 's';
};
const jourDeSeance = d => {
  const r = recurrenceVisio();
  if(r === 'quotidien') return true;
  const j = dateJour(d);
  return !!j && j.getDay() === +r;
};

function jourLisible(d){
  const j = dateJour(d);
  if(!j) return frdateL(d);
  return j.toLocaleDateString('fr-FR', {weekday:'long', day:'2-digit', month:'2-digit'});
}

/* Les séances sur lesquelles on peut se poser : d'aujourd'hui à la
   fin du mois suivant. Assez loin pour qu'on organise les congés
   d'août sans y revenir chaque semaine, et sans date en dur qui
   se périmerait toute seule si la crise dure. */
function joursCreneaux(){
  const dep = dateJour(aujourdhui());
  if(!dep) return [];
  const fin = isoJour(new Date(dep.getFullYear(), dep.getMonth() + 2, 0));
  const l = [];
  const j = new Date(dep);
  while(isoJour(j) <= fin && l.length < 80){
    if(jourDeSeance(isoJour(j))) l.push(isoJour(j));
    j.setDate(j.getDate() + 1);
  }
  return l;
}

/* Le créneau affiché : la prochaine séance. Quand l'ARS réunit
   tous les jours, c'est aujourd'hui — la séance de tout à l'heure,
   celle qu'on vient voir neuf fois sur dix. Quand elle ne réunit
   que le jeudi, c'est le jeudi qui vient : ouvrir sur aujourd'hui
   aurait fait poser des prénoms sur un jour sans séance. Une date
   choisie hier, ou devenue passée, y retombe. */
let creneauChoisi = null;
const prochaineSeance = () => joursCreneaux()[0] || aujourdhui();
const creneauVu = () => (creneauChoisi && creneauChoisi >= aujourdhui() && jourDeSeance(creneauChoisi))
  ? creneauChoisi : prochaineSeance();
/* La page se redessine à chaque choix : la bande repart de son
   début, et le jour qu'on vient de choisir sortait de l'écran
   quand il était loin dans le mois. On le ramène sous les yeux. */
function choisirCreneau(d){
  creneauChoisi = d;
  rendre();
  setTimeout(() => {
    const b = document.querySelector('.creneau .jours button.on');
    if(b) b.scrollIntoView({block:'nearest', inline:'center'});
  }, 0);
}

function vueSalleVisio(){
  const s = salleVisio() || {};
  const url = lienVisioPropre(s.url);
  const auj = aujourdhui();
  const h = heureLisible(heureVisio());

  /* L'adresse en clair et la mention du dépôt tenaient deux lignes
     pour une information qu'on ne lit jamais : elles sont passées
     en infobulle du bouton qui sert à les changer. */
  const infobulle = url
    ? url + (s.maj ? ` — déposé le ${frdateL(s.maj)}${s.par ? ' par ' + s.par : ''}` : '')
    : "Aucun lien déposé : chacun le cherche dans sa boîte mail avant la séance.";

  let v = `<div class="salle-v">
    <div class="haut">
      <div class="n">Visio de crise de l'ARS — ${esc(recurrenceLisible())} à ${esc(h)}${s.precision ? `<small> · ${esc(s.precision)}</small>` : ''}</div>
      ${url
        ? `<a class="entrer" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Lien permanent visio ARS ${esc(h)}</a>
           <button class="mini" onclick="copierLienVisio()" title="Copier ${esc(url)}">Copier</button>
           <button class="mini" onclick="ouvrirDepotVisio()" title="${esc(infobulle)}">Modifier</button>`
        : `<button class="entrer vide" onclick="ouvrirDepotVisio()" title="${esc(infobulle)}">Déposer le lien permanent visio ARS ${esc(h)}</button>`}
    </div>`;

  /* --- le créneau choisi, et la bande des séances à venir --- */
  const jour = creneauVu();
  const ici = presencesDuJour(jour);
  let mois = '';
  const bande = joursCreneaux().map(d => {
    const j = dateJour(d);
    const nb = presencesDuJour(d).length;
    const we = j.getDay() === 0 || j.getDay() === 6;
    let pre = '';
    const m = j.toLocaleDateString('fr-FR', {month:'short'}).replace('.','');
    if(m !== mois){ if(mois) pre = `<span class="mois">${esc(m)}</span>`; mois = m; }
    return pre + `<button class="${[d === jour ? 'on' : '', nb ? 'pris' : '', we ? 'we' : ''].filter(Boolean).join(' ')}"
      onclick="choisirCreneau('${d}')" title="${esc(jourLisible(d))}${nb ? ' — ' + presencesDuJour(d).map(p => p.prenom).join(', ') : ' — personne'}">
      ${esc(j.toLocaleDateString('fr-FR', {weekday:'short'}).replace('.',''))} ${j.getDate()}${nb ? `<span class="nb">${nb}</span>` : ''}</button>`;
  }).join('');

  v += `<div class="creneau">
    <span class="jourh">Qui y sera — ${esc(jourLisible(jour))} à ${esc(h)}${jour === auj ? ' · aujourd\'hui' : ''}</span>
    <div class="jours">${bande}</div>
    <div class="qui-v">${ici.length
      ? ici.map(p => `<span class="nom">${esc(p.prenom)}
          <button onclick="retirerPresenceVisio('${p.id}')" title="Retirer ${esc(p.prenom)} du créneau" aria-label="Retirer ${esc(p.prenom)} du créneau">×</button>
        </span>`).join('')
      : `<span class="personne">Personne ne s'est encore positionné sur la séance ${jour === auj ? "d'aujourd'hui" : 'du ' + esc(frdate(jour))}.</span>`}</div>
    <div class="poser">
      <input id="pv-nom" value="${esc(saisiePresence !== null ? saisiePresence : (moi === 'Anonyme' ? '' : moi.split(' ')[0]))}"
        placeholder="Votre prénom" oninput="saisiePresence=this.value"
        onkeydown="if(event.key==='Enter')sePositionnerVisio()">
      <button class="btn" onclick="sePositionnerVisio()">${jour === auj ? "J'y serai" : "J'y serai le " + esc(frdate(jour))}</button>
    </div>`;

  /* Les jours d'avant, en une ligne : assez pour voir qui porte le
     rendez-vous depuis le début, pas assez pour encombrer. */
  const avant = [...new Set(presencesVisio().map(p => p.date).filter(d => d && d < auj))]
    .sort().reverse().slice(0, 3);
  if(avant.length) v += `<div class="avant">Les jours précédents · ` + avant.map(d =>
    `<b>${esc(frdate(d))}</b> : ` + presencesDuJour(d).map(p => esc(p.prenom)).join(', ')).join(' · ') + `</div>`;

  return v + `</div></div>`;
}

function ouvrirDepotVisio(){
  const s = salleVisio() || {};
  document.getElementById('modale').innerHTML = `<h3>Lien permanent de la visio de l'ARS</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">L'adresse du salon, celle qui vaut pour toutes les séances. Déposée ici une fois, elle est à portée de clic pour tout le copil : plus personne n'a à la redemander avant l'heure.</p>
  <label style="margin-bottom:12px"><span class="k">Lien du salon *</span>
    <input id="sv-url" value="${esc(s.url || '')}" placeholder="https://…  — collez le lien reçu de l'ARS"></label>
  <div class="form">
    <label><span class="k">Rythme des séances</span>
      <select id="sv-recurrence">${
        [['quotidien','Tous les jours'],['1','Tous les lundis'],['2','Tous les mardis'],
         ['3','Tous les mercredis'],['4','Tous les jeudis'],['5','Tous les vendredis'],
         ['6','Tous les samedis'],['0','Tous les dimanches']]
        .map(o => `<option value="${o[0]}" ${recurrenceVisio() === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')
      }</select>
      <span class="aide">Seuls les jours de séance sont proposés sur la bande des créneaux.</span></label>
    <label><span class="k">Heure de la séance</span><input id="sv-horaire" type="time" value="${esc(s.horaire || '12:00')}"></label>
    <label class="large"><span class="k">Précision</span>
      <input id="sv-precision" value="${esc(s.precision || '')}" placeholder="Plateforme, code d'accès, mot de passe…"></label>
  </div>
  <div class="actions">
    <button class="btn" onclick="enregistrerLienVisio()">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
