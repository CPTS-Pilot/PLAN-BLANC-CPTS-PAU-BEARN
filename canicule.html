/* Les champs retenus selon le mode de saisie : en saisie manuelle on
   ne demande pas qui a mené l'appel, puisqu'il n'y a pas eu d'appel.
   Un champ marqué « hors » n'est plus proposé à la frappe : il garde
   sa place dans la configuration pour le tableau et l'export, et se
   renseigne ailleurs — par le formulaire en ligne, le plus souvent.
   Ne pas l'afficher, c'est aussi ne jamais l'écraser : l'enregistrement
   ne relit que les champs visibles. */
function champsVisibles(cfg, mode){
  return cfg.f.filter(f => !f.hors && (mode === 'manuel' ? !f.appel : !f.manuel));
}

/* Les intertitres du formulaire ne sont pas des champs : ils n'ont ni
   colonne, ni valeur à enregistrer. */
const champsSaisie = l => l.filter(f => f.c);

/* ---------- les entrées d'échappement des listes fermées -------
   « Autre », « Autre profession de santé », « À préciser » : ces
   entrées disent qu'aucune des réponses proposées ne convient.
   Les choisir sans pouvoir dire ce qu'il en est enregistre le
   constat qu'il y avait quelque chose à préciser, et rien de la
   précision — la ligne part telle quelle au tableau et à l'export.

   Leur place dans la liste dit laquelle est laquelle. En tête,
   c'est la valeur par défaut d'une fiche neuve : « on ne sait pas
   encore », et il n'y a rien à saisir — ouvrir un champ sous
   « Peut dormir sur place : à préciser » à chaque nouvelle fiche
   n'aiderait personne. Ailleurs, c'est bien l'échappatoire, et un
   champ libre s'ouvre dessous. Ce qu'on y écrit devient la valeur
   enregistrée : c'est elle qu'on relit au tableau, pas l'étiquette
   de la liste. */
const estEchappe = v => /^(Autre|À préciser)/.test(String(v ?? '').trim());
const echappesDe = liste => liste.filter((x, i) => i > 0 && estEchappe(x));

/* Le champ libre lui-même, replié tant qu'on n'a pas choisi
   l'entrée qui l'appelle. Une précision déjà enregistrée y revient
   telle quelle, pour rester modifiable au lieu d'être à retaper. */
const champPrecision = (id, echs, ouvert, v) => !echs.length ? '' :
  `<input class="precision" id="${id}-p" data-ech="${esc(JSON.stringify(echs))}"` +
  `${ouvert ? '' : ' hidden'} value="${esc(ouvert ? v : '')}" placeholder="Précisez">`;

/* Ce qui vient d'être choisi ouvre ou referme le champ. Refermé,
   il se vide : une précision restée là après qu'on a changé d'avis
   s'enregistrerait à la place de la réponse choisie. */
function bascPrecision(id){
  const s = document.getElementById(id), p = document.getElementById(id + '-p');
  if(!s || !p) return;
  let echs = []; try{ echs = JSON.parse(p.dataset.ech || '[]'); }catch(e){}
  const ouvrir = echs.indexOf(s.value) !== -1;
  p.hidden = !ouvrir;
  if(!ouvrir) p.value = ''; else p.focus();
}

/* La valeur retenue : la précision si elle a été saisie, sinon
   l'entrée choisie dans la liste. */
function valPrecisee(id){
  const s = document.getElementById(id);
  if(!s) return '';
  const p = document.getElementById(id + '-p');
  return (p && !p.hidden ? p.value.trim() : '') || String(s.value ?? '').trim();
}

/* Répartit une valeur déjà enregistrée entre la liste et son champ
   libre. Absente de la liste, elle est soit une précision saisie
   ici — elle retourne dans le champ libre, son entrée à nouveau
   choisie — soit une réponse venue d'ailleurs, du formulaire en
   ligne le plus souvent, qui s'ajoute en tête plutôt que de
   disparaître à la première modification. */
function repartir(val, valeurs, echs){
  const hors = !!val && valeurs.indexOf(val) === -1;
  const libre = hors && echs.length > 0;
  return {libre, ajout: hors && !libre, sel: libre ? echs[echs.length - 1] : val};
}


/* Les pastilles de suggestion écrivent dans le champ libre qui
   les surmonte, sans repasser par un rendu complet : ce qui est
   déjà tapé plus bas dans le formulaire ne doit pas s'effacer
   parce qu'on a touché un motif. Retoucher la même pastille la
   désélectionne — c'est le geste attendu quand on s'est trompé. */
function choisirSugg(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const val = btn.dataset.v || '';
  const meme = el.value.trim() === val;
  el.value = meme ? '' : val;
  Array.prototype.forEach.call(btn.parentNode.children,
    b => b.classList.toggle('on', b === btn && !meme));
  /* Une pastille « Autre » appelle sa précision comme le ferait
     une liste déroulante. Sur un champ libre à suggestions, il n'y
     a pas de champ de précision et l'appel ne fait rien. */
  bascPrecision(cible);
}
/* `val` allume d'emblée la pastille qui correspond à ce qui est déjà
   dans le champ : en modification, on voit ce qui avait été choisi. */
/* Les mêmes pastilles, mais cumulatives : chacune s'ajoute au champ
   ou s'en retire, séparées par des virgules. Le champ reste un champ
   libre — ce qui a été tapé à la main et ne figure dans aucune
   pastille y reste, et repart tel quel au tableau comme à l'export. */
const listeVirgules = v => String(v || '').split(',').map(x => x.trim()).filter(Boolean);
function basculerSugg(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const v = btn.dataset.v || '';
  const l = listeVirgules(el.value), i = l.indexOf(v);
  if(i >= 0) l.splice(i, 1); else l.push(v);
  el.value = l.join(', ');
  btn.classList.toggle('on', i < 0);
}
const pastillesMulti = (cible, liste, val) => {
  const l = listeVirgules(val);
  return `<div class="sugg">${liste.filter(Boolean).map(x =>
    `<button type="button" data-v="${esc(x)}"${l.indexOf(x) >= 0 ? ' class="on"' : ''} onclick="basculerSugg('${cible}',this)">${esc(x)}</button>`
  ).join('')}</div>`;
};

const pastilles = (cible, liste, cls, val) => `<div class="sugg ${cls||''}">${liste.filter(Boolean)
  .map(x => {
    const c = [cls === 'urg' && x === 'Non urgent' ? 'calme' : '', x === val ? 'on' : ''].filter(Boolean).join(' ');
    return `<button type="button" data-v="${esc(x)}"${c ? ` class="${c}"` : ''} onclick="choisirSugg('${cible}',this)">${esc(x)}</button>`;
  }).join('')}</div>`;

/* --- « Et pour nous, ça veut dire quoi ? » --------------------
   C'est la question à laquelle personne ne répond spontanément en
   recopiant un communiqué : on note ce que l'ARS a dit, et le champ
   qui demande ce que ça change pour la CPTS reste vide. Les amorces
   ci-dessous ne remplissent rien à la place de qui écrit — elles
   posent le début de la phrase, et la phrase se finit à la main.
   Elles s'ajoutent les unes aux autres au lieu de se remplacer :
   une mise à jour appelle souvent deux suites, un relais aux
   adhérents et une question à poser. */
const IMPLIQUE_CPTS = [
  "Rien à faire de notre côté pour l'instant.",
  "À relayer aux adhérents :",
  "À porter au prochain copil :",
  "Une mission à lancer ou à rouvrir :",
  "Une question à poser à l'ARS :",
  "Des renforts à mobiliser :",
  "Une consigne à afficher en cabinet :",
  "Ce qui change pour les patients :"
];

function amorcer(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const t = btn.dataset.v || '';
  const cur = el.value.replace(/\s+$/,'');
  /* Retoucher la même amorce quand elle est seule dans le champ la
     retire : c'est le geste attendu quand on s'est trompé de bouton
     et qu'on n'a encore rien écrit derrière. */
  if(cur === t){ el.value = ''; btn.classList.remove('on'); el.focus(); return; }
  el.value = cur ? cur + '\n' + t + ' ' : t + ' ';
  btn.classList.add('on');
  el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
  el.scrollTop = el.scrollHeight;
}
const amorces = (cible, liste) => `<div class="sugg amorces">${liste.map(x =>
  `<button type="button" data-v="${esc(x)}" onclick="amorcer('${cible}',this)">${esc(x)}</button>`).join('')}</div>`;

function formulaire(k, o, mode){
  const cfg = CHAMPS[k];
  const ed = !!o;
  if(!mode && ed && o.source === 'saisie') mode = 'manuel';
  const man = mode === 'manuel';
  let h = `<h3>${esc(cfg.titre)} — ${ed ? 'modifier' : (man ? 'saisie manuelle' : 'nouvelle entrée')}</h3>`;
  if(man) h += `<p class="chapo" style="margin:-6px 0 14px">Pour reporter au registre une réponse obtenue autrement que par un appel de la CPTS — une réponse au formulaire en ligne, un message reçu. La ligne compte comme les autres ; elle porte la mention « saisie à la main » au lieu du nom de l'appelant.</p>`;
  h += `<div class="form">`;
  h += `<label><span class="k">Date</span><input type="date" id="f-${k}-date" value="${esc(ed ? (o.date||'') : aujourdhui())}"></label>`;
  champsVisibles(cfg, mode).forEach(f => {
    /* Un intertitre : il ne saisit rien, il découpe le formulaire en
       temps successifs — le même repère qu'au recueil d'un patient. */
    if(f.t === 'titre'){
      h += `<div class="sous-t">${esc(f.l)}${f.sous ? `<span class="d">${esc(f.sous)}</span>` : ''}</div>`;
      return;
    }
    const val = ed ? (o[f.c] ?? '') : (typeof f.d === 'function' ? f.d() : '');
    const id = `f-${k}-${f.c}`;
    const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
    h += `<label class="${f.large?'large':''}"><span class="k">${esc(man && f.lm ? f.lm : f.l)}${f.req?' *':''}</span>`;
    if(f.t === 'textarea') h += `<textarea id="${id}"${ph}>${esc(val)}</textarea>`;
    else if(f.t === 'select'){
      /* Certaines listes se construisent à la volée : les lieux de
         stockage déjà saisis, par exemple. */
      const opts = typeof f.o === 'function' ? f.o() : f.o;
      const echs = echappesDe(opts);
      const r = repartir(val, opts, echs);
      const liste = r.ajout ? [val, ...opts] : opts;
      h += `<select id="${id}"${echs.length ? ` onchange="bascPrecision('${id}')"` : ''}>${
        liste.map(x=>`<option ${x===r.sel?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
      h += champPrecision(id, echs, r.libre, val);
    }
    /* Un choix court se pose en pastilles plutôt qu'en liste
       déroulante : les réponses possibles se lisent sans ouvrir, et
       se donnent d'un doigt — les mêmes pastilles qu'au recueil d'un
       patient. Une option peut porter un libellé distinct de ce qui
       est enregistré : « Oui » à l'écran, « Volontaire » au registre,
       pour que le vocabulaire du cockpit et celui du formulaire en
       ligne restent le même. Une valeur déjà posée qui ne figure pas
       dans la liste — une réponse du formulaire en ligne, rédigée à
       sa façon — s'ajoute en tête plutôt que de disparaître à la
       première modification. */
    else if(f.t === 'choix'){
      const brut = typeof f.o === 'function' ? f.o() : f.o;
      const opts = brut.map(x => typeof x === 'string' ? {v:x, l:x} : x);
      const echs = echappesDe(opts.map(x => x.v));
      const r = repartir(val, opts.map(x => x.v), echs);
      const liste = r.ajout ? [{v:val, l:val}, ...opts] : opts;
      h += `<input type="hidden" id="${id}" value="${esc(r.sel)}">`
        +  `<div class="sugg">${liste.map(x =>
             `<button type="button" class="${x.v===r.sel?'on':''}" data-v="${esc(x.v)}" onclick="choisirSugg('${id}',this)">${esc(x.l)}</button>`
           ).join('')}</div>`;
      h += champPrecision(id, echs, r.libre, val);
    }
    /* Désigner quelqu'un ne doit obliger ni à choisir dans une liste
       fermée, ni à tout retaper : le champ propose les personnes déjà
       recensées — équipe de crise, pilotes, suppléants, renforts — et
       accepte un nom qui n'y figure pas encore, qui rejoint alors la
       liste pour les saisies suivantes. */
    else if(f.t === 'personne'){
      const noms = nomsMissionnes();
      h += `<input type="text" id="${id}" list="${id}-l" value="${esc(val)}" autocomplete="off"${ph || ' placeholder="Prénom et nom"'}>`
        +  `<datalist id="${id}-l">${noms.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`;
    }
    else h += `<input type="${f.t}" id="${id}" value="${esc(val)}"${ph}>`;
    /* Un champ libre peut porter ses réponses les plus fréquentes en
       pastilles : on touche plutôt que de taper, sans que le champ
       cesse d'accepter n'importe quoi d'autre. */
    if(f.sugg) h += pastilles(id, typeof f.sugg === 'function' ? f.sugg() : f.sugg, '', val);
    /* Et quand les réponses s'additionnent au lieu de se remplacer —
       la même personne trie, charge et transporte — les pastilles
       s'ajoutent au champ à la suite, sans l'empêcher d'accepter ce
       qui n'est pas proposé. */
    if(f.multi) h += pastillesMulti(id, typeof f.multi === 'function' ? f.multi() : f.multi, val);
    if(f.aide) h += `<span class="aide">${esc(f.aide)}</span>`;
    h += `</label>`;
  });
  h += `</div><div class="actions"><button class="btn" onclick="enregistrer('${k}',${ed?`'${o.id}'`:'null'},'${mode||''}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  return h;
}

function ouvrirEdition(k, id){
  const o = (etat[k]||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = formulaire(k, o);
  ouvrirRideau();
}

async function enregistrer(k, id, mode){
  const cfg = CHAMPS[k];
  const existant = id ? (etat[k]||[]).find(x => x.id === id) : null;
  const o = existant || {id:uid(), auteur:moi, quand:new Date().toISOString()};
  if(!existant && mode === 'manuel') o.source = 'saisie';
  let manque = null;
  const dEl = document.getElementById(`f-${k}-date`);
  o.date = dEl ? dEl.value : aujourdhui();
  /* Seuls les champs affichés sont relus : sinon un champ masqué par
     le mode de saisie serait effacé à chaque enregistrement. */
  champsSaisie(champsVisibles(cfg, mode || (o.source === 'saisie' ? 'manuel' : ''))).forEach(f => {
    const v = valPrecisee(`f-${k}-${f.c}`);
    if(f.req && !v && !manque) manque = f.l;
    o[f.c] = v;
  });
  if(manque){ toast(`Champ obligatoire : ${manque}`); return; }
  if(existant){
    o.modifiePar = moi;
  }else{
    /* Registre classé à la main : la nouvelle entrée passe devant
       toutes les autres plutôt que de se perdre au milieu. */
    if(estManuel(k)) o.rang = Math.min(...etat[k].map(x => typeof x.rang === 'number' ? x.rang : 0)) - 1;
    etat[k].unshift(o);
  }
  /* Règle du cockpit : ce qui est renseigné quelque part se
     consigne en main courante, en plus de sa rubrique. */
  consignerRegistreEnCourante(k, o);
  const enCourante = !!MC_REG[k];
  await sauver(); fermer(); rendre();
  toast(enCourante ? (existant ? "Modifié, et repris en main courante" : "Enregistré et consigné en main courante")
                   : (existant ? "Modifié" : "Enregistré"));
}

async function supprimer(k, id){
  noterRetrait(id);
  etat[k] = etat[k].filter(x => x.id !== id);
  await sauver(); rendre(); toast("Ligne supprimée");
}

/* Les registres de traçabilité se lisent du plus récent au plus ancien :
   ce qui vient d'arriver est la première chose qu'on doit voir en ouvrant
   la page, et on remonte le temps en descendant. Le tri se fait à
   l'affichage seulement — l'ordre de stockage n'est pas touché, et les
   lignes saisies sans heure se rangent en fin de journée. */
const CHRONO = ['ars','courante'];

/* L'heure est ramenée à HH:MM avant d'être comparée : une entrée saisie
   « 9h05 » ou « 9:05 » doit se ranger avant 14:01, pas après. Une entrée
   sans heure se range en fin de journée, faute de mieux. */
function cleHeure(v){
  const m = String(v || '').match(/^\s*(\d{1,2})\s*[:hH.]\s*(\d{1,2})/);
  return m ? m[1].padStart(2,'0') + ':' + m[2].padStart(2,'0') : '';
}
function antechrono(lignes){
  const cle = o => (o.date || '') + ' ' + cleHeure(o.heure);
  return [...(lignes || [])].sort((a,b) => cle(b).localeCompare(cle(a)));
}

/* Le classement à la main l'emporte sur le tri par date dès qu'une
   entrée porte un rang. Le rang est posé sur la fiche elle-même, et
   non déduit de l'ordre du tableau : c'est ce qui lui permet de
   survivre à la fusion avec le serveur quand deux postes saisissent
   en même temps — un simple déplacement de ligne serait sinon repris
   par la version d'en face, qui ne l'aurait pas vu passer.
   Une entrée sans rang — celle qui vient d'arriver d'un autre poste,
   ou d'un amorçage — se place en tête, là où le plus récent se lit. */
function estManuel(k){ return (etat[k] || []).some(o => typeof o.rang === 'number'); }

function chrono(k, lignes){
  if(!CHRONO.includes(k)) return [...(lignes || [])];
  const l = antechrono(lignes);
  if(!estManuel(k)) return l;
  /* le tri est stable : à rang égal ou absent, l'ordre chronologique
     ci-dessus fait le départage */
  return l.sort((a,b) => (typeof a.rang === 'number' ? a.rang : -1) -
                         (typeof b.rang === 'number' ? b.rang : -1));
}

/* Numérote les entrées dans l'ordre où elles sont affichées à
   l'instant : bascule un registre en classement manuel sans que rien
   ne bouge sous les yeux de celle qui vient de cliquer. */
function assurerRangs(k){
  chrono(k, etat[k]).forEach((o, i) => { o.rang = i; });
}

async function deplacer(k, id, sens){
  assurerRangs(k);
  const l = chrono(k, etat[k]);
  const i = l.findIndex(o => o.id === id), j = i + sens;
  if(i < 0 || j < 0 || j >= l.length) return;
  const r = l[i].rang; l[i].rang = l[j].rang; l[j].rang = r;
  await sauver(); rendre();
}

async function retablirTri(k){
  (etat[k] || []).forEach(o => { delete o.rang; });
  await sauver(); rendre();
  toast("Tri par date et heure rétabli");
}

/* Le bandeau n'apparaît qu'une fois le registre passé en manuel :
   tant qu'on n'a rien déplacé, il n'y a rien à expliquer. */
function barreOrdre(k){
  if(!CHRONO.includes(k) || !estManuel(k)) return '';
  return `<div class="note ordre-manuel">
    <strong>Ordre manuel.</strong> Ces entrées sont classées à la main : le tri par date et heure ne s'applique plus, et une entrée nouvelle se place en tête.
    <button class="btn sec" onclick="retablirTri('${k}')">Revenir au tri par date et heure</button></div>`;
}

function tableau(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;
  const ent = cfg.cols.map(c => {
    if(c === 'date') return 'Date';
    if(c === 'auteur') return 'Saisi par';
    const f = cfg.f.find(x => x.c === c);
    return f ? f.l : c;
  });
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  lignes.forEach((l, i) => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel' || c === 'rdvle' || c === 'infoLe' || c === 'apartir'
         || c === 'verifieLe') v = frdate(v);
      if(typeof v === 'string' && /^https?:\/\//.test(v))
        return `<td><a href="${esc(v)}" target="_blank" rel="noopener">Ouvrir</a></td>`;
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + `<td class="act">${fleches(k, l.id, i, lignes.length)}<button title="Modifier" onclick="ouvrirEdition('${k}','${l.id}')">✎</button><button title="Supprimer" onclick="supprimer('${k}','${l.id}')">×</button></td></tr>`;
  });
  return h + '</tbody></table></div>';
}

/* Les flèches ne sont proposées que là où un ordre a un sens, et
   restent visibles en tri automatique : le premier déplacement fait
   lui-même basculer le registre en classement manuel, sans qu'il y
   ait de réglage à comprendre au préalable. */
function fleches(k, id, i, n){
  if(!CHRONO.includes(k) || n < 2) return '';
  return `<button title="Monter" onclick="deplacer('${k}','${id}',-1)"${i === 0 ? ' disabled' : ''}>↑</button>` +
         `<button title="Descendre" onclick="deplacer('${k}','${id}',1)"${i === n-1 ? ' disabled' : ''}>↓</button>`;
}

/* ---------------------------------------------------------
   Les registres de traçabilité se lisent comme un journal :
   une carte par entrée, regroupée par jour, plutôt qu'un
   tableau à dix colonnes qu'il faut faire défiler pour lire
   une phrase. Le tableau reste dans le dossier de traçabilité,
   où il sert à l'impression et à l'export.
   --------------------------------------------------------- */
/* La main courante n'y figure plus : elle reçoit désormais tout ce
   que le cockpit enregistre, et une carte par entrée n'aurait plus
   tenu à l'écran. Elle se lit en fil — une ligne par fait, le
   détail à la demande — dans vueCourante(). */
const JOURNAL = {
  ars: {
    titre:'objet', etiq:['sens','statut'],
    chips:[{c:'canal', l:"Canal"},{c:'interlocuteur', l:"Interlocuteur"}],
    blocs:[{c:'demande', l:"Ce qui est demandé ou annoncé"},{c:'reponse', l:"Notre réponse ou action"},
           {c:'attendu', l:"Ce que ça implique pour la CPTS"}],
    lien:'lien', lienL:"Ouvrir le document"
  }
};

const ETIQ_REG = {
  'En cours':'e-cours', 'Clos':'e-fini', 'Terminé':'e-fini',
  'À suivre':'e-attente', 'À faire':'e-attente', 'En attente':'e-attente',
  "Reçu de l'ARS":'e-lancer', "Envoyé à l'ARS":'e-cours', 'À envoyer':'e-attente',
  'Faible':'e-fini', 'Moyenne':'e-attente', 'Élevée':'e-bloque',
  'Sans suite':'e-fini'
};

/* Le liseré de gauche donne l'état d'un coup d'œil, sans lire :
   rouge si la remontée est critique, ambre si ça attend, vert si
   c'est en cours, gris si c'est clos. */
function classeReg(o){
  if(o.criticite === 'Élevée') return 't-bloque';
  if(o.statut === 'En cours') return 't-cours';
  if(['À faire','En attente','À suivre'].includes(o.statut)) return 't-attente';
  if(['Clos','Terminé'].includes(o.statut)) return 't-fini';
  return '';
}

/* Les initiales d'un nom pour la pastille de signature. Deux
   lettres suffisent ; « Anne Latisnère et Eva Poulmarch » en donne
   AL, et l'on lit le nom entier juste à côté. */
function initialesDe(nom){
  const m = String(nom || '').trim().split(/[\s'’-]+/).filter(Boolean);
  return (m.slice(0,2).map(x => x[0]).join('') || '?').toUpperCase();
}

/* L'horodatage que le cockpit pose lui-même à l'enregistrement, en
   clair : « 29/07 à 17:15 ». Les entrées de l'amorçage n'en ont pas
   — elles ont été écrites à la main, pas saisies. */
function horodateSaisie(iso){
  if(!iso) return '';
  const t = new Date(iso);
  if(isNaN(t.getTime())) return '';
  const p = n => String(n).padStart(2,'0');
  return `${p(t.getDate())}/${p(t.getMonth()+1)} à ${p(t.getHours())}:${p(t.getMinutes())}`;
}

function frdateJour(d){
  if(!d) return "Date non précisée";
  const t = new Date(d + 'T12:00:00');
  if(isNaN(t.getTime())) return d;
  const s = t.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function journal(k){
  const cfg = JOURNAL[k], lignes = chrono(k, etat[k]);
  if(!lignes.length)
    return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;

  /* Classé à la main, l'ordre ne suit plus les jours : les
     intertitres de journée n'ont plus rien à séparer, et chaque
     carte porte alors sa date entière. */
  const manuel = estManuel(k);
  let h = '', jour = null;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }

    const quand = manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' à ') : o.heure;

    const etiqs = (cfg.etiq || []).map(c => o[c]).filter(Boolean)
      .map(v => `<span class="etiq ${ETIQ_REG[v] || 'e-lancer'}">${esc(v)}</span>`).join('');

    const chips = (cfg.chips || []).filter(x => o[x.c])
      .map(x => `<span><span class="k">${esc(x.l)}</span>${esc(o[x.c])}</span>`).join('');

    const blocs = (cfg.blocs || []).filter(x => o[x.c])
      .map(x => `<div class="bloc"><span class="k">${esc(x.l)}</span><div class="v">${esc(o[x.c])}</div></div>`).join('');

    const lien = cfg.lien && o[cfg.lien]
      ? `<a class="lien" href="${esc(o[cfg.lien])}" target="_blank" rel="noopener">${esc(cfg.lienL || 'Ouvrir')} ↗</a>` : '';

    /* Une entrée née d'une visio garde le chemin vers son compte
       rendu : le registre atteste que la séance a eu lieu, le détail
       point par point reste là où il a été écrit. */
    const versV = o.visio
      ? `<button class="lien lien-v" onclick="ouvrirVisioDepuisARS('${o.visio}')">Voir le compte rendu de la séance</button>` : '';

    /* Une entrée sans heure de fait n'est pas pour autant sans
       repère : le cockpit horodate chaque enregistrement, et ce
       repère-là se lit au pied de la carte. Il ne dit pas quand la
       chose est arrivée — il dit quand elle a été écrite, ce qui est
       exactement ce qu'un dossier de traçabilité doit pouvoir
       attester. */
    const saisiLe = horodateSaisie(o.quand);
    const pied = [o.auteur ? 'Saisi par ' + o.auteur + (saisiLe ? ' le ' + saisiLe : '')
                           : (saisiLe ? 'Saisi le ' + saisiLe : ''),
                  o.modifiePar ? 'Modifié par ' + o.modifiePar : '',
                  o.echeance ? 'Échéance ' + frdateL(o.echeance) : '']
      .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

    const venu = cfg.venu && String(o[cfg.venu]||'').trim()
      ? `<span class="venu"><span class="p">Venu du dehors</span>${esc(o[cfg.venu])}</span>` : '';

    /* Celle ou celui qui s'en est chargé se signe : ses initiales en
       pastille, son nom à côté. C'est la contrepartie du bandeau de
       provenance — l'entrée dit d'un coup d'œil si elle vient de nous
       ou du dehors. */
    const perso = cfg.personne && String(o[cfg.personne]||'').trim()
      ? `<span class="par"><span class="av">${esc(initialesDe(o[cfg.personne]))}</span>
           <span class="nn"><span class="k">Pris en charge par</span>${esc(o[cfg.personne])}</span></span>` : '';

    h += `<article class="ent-r ${cfg.marque || ''} ${classeReg(o)}${venu ? ' dehors' : ''}">
      <div class="haut">
        ${quand ? `<span class="hr">${esc(quand)}</span>` : ''}${etiqs}${venu}
        <span class="outils">
          ${fleches(k, o.id, i, lignes.length)}
          ${SOURCES_RET[k] ? boutonRetenu(k, o) : ''}
          <button title="Modifier" onclick="ouvrirEdition('${k}','${o.id}')">✎</button>
          <button title="Supprimer" onclick="supprimer('${k}','${o.id}')">×</button>
        </span>
      </div>
      <div class="ti">${esc(o[cfg.titre]) || '—'}</div>
      ${perso}
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${blocs}${lien}${versV}${marqueRetenue(o)}
      ${pied ? `<div class="pied">${pied}</div>` : ''}
    </article>`;
  });
  return h;
}

/* =========================================================
   VUES
   ========================================================= */

    }</ul><div class="actions"><button class="btn sec" onclick="ajouterConsigne('eviter')">Ajouter</button></div></div>

        <div class="t">${esc(a.objet)}</div>
        ${a.attendu?`<div class="d">${esc(a.attendu)}</div>`:''}
        <div class="s">${esc(a.sens)} · ${esc(a.interlocuteur||'—')} · ${esc(a.statut)}</div></div></li>`).join('') +
      `</ul><div class="actions"><button class="btn sec" onclick="aller('ars')">Ouvrir le suivi ARS</button></div></div>`;
  }

  h += `<h2 style="margin-top:26px">Missions en un coup d'œil</h2>`;
  etat.missions.forEach(m => {
    h += `<div class="mission"><div class="haut">
      <div class="titre">${esc(m.titre)}</div>
      <span class="etiq ${classeStatut(m.statut)}">${esc(m.statut)}</span></div>
      <div class="meta">
        <div><span class="k">Pilote</span>${esc(m.pilote) || '<em style="color:var(--braise)">à désigner</em>'}</div>
        <div><span class="k">Suppléant</span>${esc(m.suppleant) || '—'}</div>
        <div style="flex:1 1 100%"><span class="k">Prochaine action</span>${esc(m.prochaine) || '<em style="color:var(--texte-2)">à écrire</em>'}</div>
      </div></div>`;
  });

  h += `<h2 style="margin-top:26px">Dernières entrées en main courante</h2><div class="carte">`;
  if(!derniers.length){
    h += `<p class="vide">Rien de consigné pour l'instant. <a href="#" onclick="aller('courante');return false;">Ouvrir la main courante</a></p>`;
  }else{
    /* Le même coup d'œil qu'en main courante, en six lignes : la
       nature en pastille, le fait en une phrase, qui s'en est
       chargé. Le détail se lit là où il est écrit. */
    h += `<ul class="fil">` + derniers.map(e =>
      `<li><div class="h">${frdate(e.date)} ${esc(e.heure||'')}</div>
       <div class="c">
       <div class="tete"><span class="etiq ${MC_COUL(typeMC(e))}">${esc(typeMC(e))}</span>${
         e.source ? `<span class="venu"><span class="p">Du dehors</span>${esc(e.source)}</span>` : ''}</div>
       <div class="t">${esc(resumeMC(e.evenement))}</div>
       <div class="s">${esc([e.qui || 'personne nommée',
              e.auteur ? 'saisi par ' + e.auteur : ''].filter(Boolean).join(' · '))}</div></div></li>`).join('') + `</ul>`
      + `<div class="actions"><button class="btn sec" onclick="aller('courante')">Ouvrir la main courante</button></div>`;
  }
  return h + `</div>`;
}

function classeStatut(s){
  return {'À lancer':'e-lancer','En cours':'e-cours','En attente':'e-attente','Terminé':'e-fini','Bloqué':'e-bloque'}[s] || 'e-lancer';
}

/* Les renforts d'une mission : des personnes positionnées auprès
   du pilote, chacune avec ce qu'elle prend en charge. */
function renfortsDe(m){ return Array.isArray(m.renforts) ? m.renforts : []; }

function referentDe(nom){
  return (etat.referents || []).find(r => cleP(r.nom) === cleP(nom)) || null;
}

/* L'équipe telle qu'elle se déduit des missions. Les référents de
   la gestion de crise y figurent au même titre, même sans mission :
   ils n'ont plus de bloc à part, ni de carnet d'adresses parallèle.
   Ceux qu'on a saisis sans rien leur confier encore y sont aussi. */
function equipeDeCrise(){
  const gens = new Map();
  const inscrire = n => {
    const t = (n || '').trim();
    if(!t || t === 'Anonyme') return null;
    if(!gens.has(cleP(t))) gens.set(cleP(t), {nom:t, pilote:[], appui:[]});
    return gens.get(cleP(t));
  };
  const ajoute = (nom, m, role, mention) => {
    const g = inscrire(nom);
    if(g) g[role].push({mid:m.id, titre:m.titre, mention:mention || ''});
  };
  etat.missions.forEach(m => {
    ajoute(m.pilote, m, 'pilote');
    ajoute(m.suppleant, m, 'appui', 'Suppléant');
    renfortsDe(m).forEach(r => ajoute(r.nom, m, 'appui', r.role || 'Renfort'));
  });
  (etat.referents || []).forEach(r => inscrire(r.nom));
  normaliserPersonnes();
  Object.values(etat.personnes || {}).forEach(p => inscrire(p.nom));

  /* La cellule de crise d'abord, puis ceux qui pilotent le plus. */
  return [...gens.values()]
    .map(p => Object.assign(p, {ref: referentDe(p.nom)}))
    .sort((a,b) => (b.ref ? 1 : 0) - (a.ref ? 1 : 0)
                || b.pilote.length - a.pilote.length
                || a.nom.localeCompare(b.nom, 'fr'));
}

/* Le feuillet d'arrivée, dans l'ordre où la carte se lit : le nom
   en grand, la profession, le statut dans l'association, la mission
   portée, les renforts positionnés dessus, et la fiche mission en
   bas. Le statut d'avancement et la prochaine action se lisent dans
   « Par mission » — la même liste n'est jamais affichée deux fois
   sur le même écran. */
function vuePersonnes(){
  const liste = equipeDeCrise();
  let h = `<div class="miss-gens">`;

  liste.forEach(p => {
    const c = coord(p.nom);
    const nEsc = esc(p.nom).replace(/'/g, "\\'");
    const prof = ((p.ref && p.ref.profession) || c.profession || '').trim();
    /* Ce que la personne est dans l'association, pas ce qu'elle fait
       sur la crise : vice-présidente, référente d'un groupe de
       travail. Rien ne s'affiche quand elle n'a pas de statut. */
    const statut = [(c.statut || '').trim(), p.ref ? 'Cellule de crise' : '']
      .filter(Boolean).join(' · ');
    let contact = '';
    if(c.tel)  contact += `<a href="tel:${esc(String(c.tel).replace(/\s/g,''))}">📞 ${esc(c.tel)}</a>`;
    if(c.mail) contact += `<a href="mailto:${esc(c.mail)}">✉️ ${esc(c.mail)}</a>`;

    const portees = p.pilote.map(o => ({o:o, role:'Pilote'}))
      .concat(p.appui.map(o => ({o:o, role:o.mention || 'Renfort'})));

    h += `<div class="miss-pers">
      <div class="nom">${esc(p.nom)}</div>
      ${prof ? `<div class="prof">${esc(prof)}</div>` : ''}
      ${statut ? `<div class="statut">${esc(statut)}</div>` : ''}
      <div class="lignes">
        ${portees.map(x => blocMissionPers(x.o, x.role, p.nom)).join('')}
        ${portees.length ? ''
          : `<div class="prof" style="margin:0">Aucune mission confiée pour l'instant.
             <button class="plusrf" onclick="nouvelleMission('${nEsc}')">+ Confier une mission</button></div>`}
      </div>
      <div class="tel">
        ${contact || `<button class="manquant" onclick="editerContact('${nEsc}')">Numéro à renseigner</button>`}
        <button class="modif" onclick="editerContact('${nEsc}')">Modifier la fiche</button>
      </div>
    </div>`;
  });

  h += `<button class="miss-neuf" onclick="editerContact('')">
    <span class="plus">+</span>
    <span class="t">Ajouter quelqu'un</span>
    <span class="d">Un nom, un numéro. On lui confie une mission ensuite.</span>
  </button></div>`;

  return h + bandeAPourvoir();
}

/* Une mission sous un nom : l'intitulé, les noms de ceux qui
   viennent en renfort dessus, le bouton qui en ajoute un sans
   quitter la carte, et la fiche mission en bas. */
function blocMissionPers(o, role, personne){
  const m = etat.missions.find(x => x.id === o.mid);
  if(!m) return '';
  const noms = renfortsDe(m).map(r => (r.nom || '').trim())
    .filter(n => n && cleP(n) !== cleP(personne));
  return `<div class="mis">
    ${role === 'Pilote' ? '' : `<span class="role">${esc(role)}</span>`}
    <div class="mt">${esc(m.titre)}</div>
    ${m.echeance ? `<div class="ech">Échéance ${frdateL(m.echeance)}</div>` : ''}
    ${noms.length ? `<div class="rf"><span class="k">En renfort</span>${esc(noms.join(', '))}</div>` : ''}
    <button class="plusrf" onclick="ajouterRenfort('${m.id}')">+ Renfort</button>
    <button class="btn sec fichem" onclick="voirFiche('${m.id}')">Fiche mission</button>
  </div>`;
}

/* Ce que personne ne porte n'est pas quelqu'un : la bande descend
   sous les noms au lieu de se présenter comme une carte d'équipe. */
function bandeAPourvoir(){
  const v = etat.missions.filter(m => !(m.pilote || '').trim());
  if(!v.length) return '';
  return `<div class="apourvoir">
    <div class="tt">${v.length} mission${v.length > 1 ? 's' : ''} que personne ne porte</div>
    <div class="ss">Une mission sans nom en face ne se fait pas.</div>
    <ul>${v.map(m => `<li>
      <button class="t" onclick="voirFiche('${m.id}')">${esc(m.titre)}</button>
      <span class="etiq ${classeStatut(m.statut)}">${esc(m.statut)}</span>
      <button class="designer" onclick="modifierMission('${m.id}')">Désigner un pilote</button>
    </li>`).join('')}</ul>
  </div>`;
}

/* Les référents de la gestion de crise n'ont plus de bloc à eux
   ni de carnet séparé : ils apparaissent sur la grille des
   personnes, en tête, avec la mention « Cellule de crise ». Leur
   appartenance se coche depuis leur fiche — voir editerContact. */

/* Les renforts s'ajoutent là où on les cherche : sous la mission
   qu'ils épaulent, dans le feuillet « Par mission ». */
function blocRenforts(mid){
  const m = etat.missions.find(x => x.id === mid);
  if(!m) return '';
  return `<div class="renforts">` +
    renfortsDe(m).map((r,i) => `<div class="rf">
      <div class="n">${esc(r.nom)}${r.role ? `<span class="q">${esc(r.role)}</span>` : ''}</div>
      <button class="rx" title="Retirer ce renfort" onclick="retirerRenfort('${mid}',${i})">×</button>
    </div>`).join('') +
    `<button class="rplus" onclick="ajouterRenfort('${mid}')">+ Ajouter un renfort</button></div>`;
}

function ajouterRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const noms = nomsMissionnes().filter(n => cleP(n) !== cleP(m.pilote));
  document.getElementById('modale').innerHTML = `<h3>Renfort sur « ${esc(m.titre)} »</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Une personne positionnée auprès de ${m.pilote ? esc(m.pilote) : 'la mission'}, avec ce qu'elle prend en charge. Elle apparaîtra dans l'organigramme, où son numéro pourra être renseigné.</p>
    ${noms.length ? `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà dans le cockpit&nbsp;:</p>
      <div class="choixnom">${noms.map(n => `<button onclick="document.getElementById('rf-nom').value='${esc(n).replace(/'/g,"\\'")}'">${esc(n)}</button>`).join('')}</div>` : ''}
    <label><span class="k">Prénom et nom *</span><input id="rf-nom" placeholder="Prénom et nom"></label>
    <label style="margin-top:12px"><span class="k">Ce qu'il ou elle prend en charge</span>
      <input id="rf-role" placeholder="Ex. phoning auprès des pharmaciens" onkeydown="if(event.key==='Enter')validerRenfort('${mid}')"></label>
    <div class="actions"><button class="btn" onclick="validerRenfort('${mid}')">Ajouter</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('rf-nom'); if(i) i.focus({preventScroll:true}); }, 60);
}

async function validerRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const nom = document.getElementById('rf-nom').value.trim();
  if(!nom){ toast("Le nom est obligatoire"); return; }
  m.renforts = renfortsDe(m).concat([{nom:nom, role:document.getElementById('rf-role').value.trim(), par:moi}]);
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Renfort ajouté");
}

async function retirerRenfort(mid, i){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const r = renfortsDe(m).slice();
  r.splice(i,1);
  m.renforts = r;
  m.modifiePar = moi;
  await sauver(); rendre();
}

/* Les statuts dans l'ordre où ils se lisent : ce qui tourne
   d'abord, ce qui est clos en dernier. */
const ORDRE_STATUT = ['En cours','À lancer','En attente','Bloqué','Terminé'];
const LISERE_STATUT = {'En cours':'st-cours','À lancer':'st-lancer','En attente':'st-attente',
                       'Bloqué':'st-bloque','Terminé':'st-fini'};

/* « Par personne » est le feuillet d'arrivée : en crise, la
   première question posée à cet onglet est qui est là. */
let feuilletMissions = 'personne';
function allerFeuilletMissions(f){ feuilletMissions = f; rendre(); window.scrollTo(0,0); }

function vueMissions(){
  const sansPilote = etat.missions.filter(m => !(m.pilote || '').trim()).length;
  const sansSuppl  = etat.missions.filter(m => m.statut === 'En cours' && !(m.suppleant || '').trim()).length;
  const nbGens     = equipeDeCrise().length;

  let h = `<h1>Missions et organigramme</h1>
  <p class="chapo">Qui porte quoi, et ce qui doit être fait ensuite. La même liste se lit par personne ou par mission.</p>

  <div class="miss-trous">
    <div class="miss-trou${sansPilote ? ' alerte' : ''}"><div class="n">${sansPilote}</div>
      <div class="l">mission${sansPilote > 1 ? 's' : ''} sans pilote${sansPilote
        ? ` — <button onclick="allerFeuilletMissions('personne')">les pourvoir</button>` : ''}</div></div>
    <div class="miss-trou${sansSuppl ? ' veille' : ''}"><div class="n">${sansSuppl}</div>
      <div class="l">mission${sansSuppl > 1 ? 's' : ''} en cours sans suppléant</div></div>
    <div class="miss-trou"><div class="n">${nbGens}</div>
      <div class="l">personne${nbGens > 1 ? 's' : ''} engagée${nbGens > 1 ? 's' : ''} sur la crise</div></div>
    <div class="miss-trou"><div class="n">${etat.missions.length}</div>
      <div class="l">mission${etat.missions.length > 1 ? 's' : ''} ouverte${etat.missions.length > 1 ? 's' : ''}</div></div>
  </div>

  <div class="miss-lunettes" role="group" aria-label="Angle de lecture">
    <button class="${feuilletMissions === 'personne' ? 'on' : ''}"
      onclick="allerFeuilletMissions('personne')">Par personne</button>
    <button class="${feuilletMissions === 'mission' ? 'on' : ''}"
      onclick="allerFeuilletMissions('mission')">Par mission</button>
  </div>`;

  return h + (feuilletMissions === 'personne' ? vuePersonnes() : vueParMission());
}

/* Les missions groupées par statut. « Terminé » ferme la page,
   « En cours » l'ouvre : on ne cherche pas ce qui tourne. */
function vueParMission(){
  let h = `<div class="actions" style="margin:0 0 18px">
    <button class="btn" onclick="nouvelleMission()">Créer une mission</button></div>`;

  ORDRE_STATUT.forEach(s => {
    const lot = etat.missions.filter(m => m.statut === s);
    if(!lot.length) return;
    h += `<div class="miss-grp"><h3>${esc(s)}
      <span class="c">${lot.length} mission${lot.length > 1 ? 's' : ''}</span></h3>
      <div class="miss-pile">${lot.map(carteMission).join('')}</div></div>`;
  });

  /* Un statut saisi hors liste ne doit pas faire disparaître la
     mission de la page. */
  const orphelines = etat.missions.filter(m => ORDRE_STATUT.indexOf(m.statut) === -1);
  if(orphelines.length){
    h += `<div class="miss-grp"><h3>Sans statut <span class="c">${orphelines.length}</span></h3>
      <div class="miss-pile">${orphelines.map(carteMission).join('')}</div></div>`;
  }
  return h;
}

function carteMission(m){
  const esp = espaceDe(m);
  const pil = (m.pilote || '').trim();
  const sup = (m.suppleant || '').trim();
  /* Le suppléant ne manque qu'une fois le pilote désigné : tant que
     personne ne porte la mission, l'alerte porte sur le pilote. */
  const champSup = sup ? `<span class="qn">${esc(sup)}</span>`
    : pil ? `<button class="qn manque" onclick="modifierMission('${m.id}')">à désigner</button>`
          : `<span class="qn absent">—</span>`;

  return `<div class="miss-c ${LISERE_STATUT[m.statut] || 'st-lancer'}">
    <div class="haut">
      <div class="titre">${esc(m.titre)}</div>
      <select onchange="majMission('${m.id}','statut',this.value)" style="width:auto">
        ${ORDRE_STATUT.map(s => `<option ${s === m.statut ? 'selected' : ''}>${esc(s)}</option>`).join('')}
      </select>
    </div>
    ${m.detail ? `<div class="detail">${esc(m.detail)}</div>` : ''}

    <button class="miss-prochaine${m.prochaine ? '' : ' vide'}" onclick="modifierProchaine('${m.id}')">
      <span class="k">Prochaine action</span>
      <p>${esc(m.prochaine) || "Rien d'écrit. Une mission sans prochaine action ne bouge pas — cliquer pour la renseigner."}</p>
      ${m.echeance ? `<p style="font-size:12.5px;color:var(--texte-2)">Échéance ${frdateL(m.echeance)}</p>` : ''}
    </button>

    <div class="miss-eq">
      <div><span class="k">Pilote</span>${pil ? `<span class="qn">${esc(pil)}</span>`
        : `<button class="qn manque" onclick="modifierMission('${m.id}')">à désigner</button>`}</div>
      <div><span class="k">Suppléant</span>${champSup}</div>
      <div style="flex:1 1 240px"><span class="k">Renforts</span>${blocRenforts(m.id)}</div>
    </div>

    <div class="barre-m">
      <button class="btn sec" onclick="voirFiche('${m.id}')">Fiche mission</button>
      <button class="btn sec" onclick="aller('${esp}')">Ouvrir « ${esc(nomEspace(esp))} »</button>
      <button class="btn sec" onclick="modifierMission('${m.id}')">Modifier</button>
      <button class="sup-m" title="Supprimer la mission" onclick="supprimerMission('${m.id}')">×</button>
    </div>
  </div>`;
}

/* La prochaine action se corrige là où elle se lit, sans passer
   par la fiche mission ni par un formulaire complet. */
function modifierProchaine(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  document.getElementById('modale').innerHTML = `<h3>Prochaine action</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Ce qui doit être fait ensuite sur « ${esc(m.titre)} ». C'est ce que lit le copil, et ce qui dit si la mission avance.</p>
    <label><span class="k">Prochaine action</span>
      <textarea id="pa-txt" style="min-height:110px" placeholder="Ex. rappeler la délégation départementale pour obtenir le circuit de retrait des FFP2">${esc(m.prochaine || '')}</textarea></label>
    <label style="margin-top:12px"><span class="k">Échéance — facultatif</span>
      <input id="pa-ech" type="date" value="${esc(m.echeance || '')}"></label>
    <div class="actions"><button class="btn" onclick="validerProchaine('${id}')">Enregistrer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('pa-txt'); if(i) i.focus({preventScroll:true}); }, 60);
}
async function validerProchaine(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  m.prochaine = document.getElementById('pa-txt').value.trim();
  m.echeance  = document.getElementById('pa-ech').value;
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Prochaine action enregistrée");
}
function lignes(t){ return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean); }

function voirFiche(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  const f = m.fiche || {};
  const li = lignes(f.faire);
  document.getElementById('modale').innerHTML = `
    <h3>${esc(m.titre)}</h3>
    <div class="fiche">
      <h4>Pourquoi</h4><p>${esc(f.but) || 'À renseigner.'}</p>
      <h4>Ce qu'il y a à faire</h4>
      ${li.length ? `<ul>${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '<p>À renseigner.</p>'}
      <h4>Avec qui</h4><p>${esc(f.avec) || '—'}</p>
      <h4>Pour qui</h4><p>${esc(f.pour) || '—'}</p>
      <h4>Ce qu'on ne fait pas</h4><div class="stop">${esc(f.limite) || '—'}</div>
      <h4>Où consigner</h4><p>${esc(nomEspace(espaceDe(m)))}</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="aller('${espaceDe(m)}');fermer()">Ouvrir l'espace</button>
      <button class="btn sec" onclick="editerFiche('${m.id}')">Modifier la fiche</button>
      <button class="btn sec" onclick="imprimerModale()">Imprimer</button>
      <button class="btn sec" onclick="fermer()">Fermer</button>
    </div>`;
  ouvrirRideau();
}

function editerFiche(id){

/* Les noms déjà connus, proposés en un clic : on tape rarement
   deux fois le même nom, et une faute de frappe crée une carte
   en double dans l'organigramme. */

  const noms = nomsMissionnes().filter(n => !exclu || cleP(n) !== cleP(exclu));

  return `<div class="choixnom compact">` + noms.map(n =>

}

async function confirmerSuppression(id){

async function majMission(id, champ, val){

/* =========================================================
   SITUATION RÉGIONALE — le poste de veille

   La page ne fait plus qu'une chose : dire l'état de la région, et
   le tenir à jour. Deux objets, dans cet ordre :

   1. Les visios de crise de l'ARS — la source la plus dense dont
      dispose la CPTS. Elles ouvrent la page.
   2. Les points de situation — les feuillets qu'on maintient à
      jour : niveau de vigilance, tension sur les structures,
      situation sanitaire, consignes aux libéraux… C'est ce qui se
      lit au copil.

   Le carnet de canaux, le tour de veille et le fil des informations
   retenues ont été retirés : ils demandaient un parcours que
   personne n'a le temps de faire en crise. Le geste attendu tient
   désormais en un copier-coller dans le bon feuillet. Les données
   correspondantes restent dans l'état partagé, sans affichage.
   ========================================================= */
const SEUIL_POINT_H  = 12;  // au-delà, un point de situation est à rafraîchir
let brouillonPoint = null;
/* Le mode d'emploi reste ouvert tant qu'on ne l'a pas replié soi-même :
   c'est la première chose que voit qui prend la veille. */
let guideVeille = (() => { try{ return localStorage.getItem('cpts64_guide_veille') !== 'ferme'; }catch(e){ return true; } })();
function basculerGuide(){
  guideVeille = !guideVeille;
  try{ localStorage.setItem('cpts64_guide_veille', guideVeille ? 'ouvert' : 'ferme'); }catch(e){}
  rendre();
}

const horodate = () => aujourdhui() + ' ' + maintenant();
function heuresDepuis(q){
  if(!q) return Infinity;
  const t = new Date(q.slice(0,10) + 'T' + (q.slice(11,16) || '00:00') + ':00');
  return isNaN(t) ? Infinity : (Date.now() - t) / 36e5;
}
const rubriques = () => etat.rubriques || [];
const rubriqueDe = id => rubriques().find(r => r.id === id);
const nomPoint = id => { const r = rubriqueDe(id); return r ? r.nom : ''; };
/* Un point non réécrit depuis un demi-tour d'horloge est à
   rafraîchir : c'est ce qui donne sa liste de travail à qui prend
   la veille. Un point jamais écrit l'est toujours. */
const pointARafraichir = r => !r.maj || heuresDepuis(r.maj) >= SEUIL_POINT_H;
/* La dernière trace laissée sur cette page, quelle qu'en soit la
   nature : réécriture d'un point ou compte rendu de visio. C'est
   elle qui dit si ce qu'on lit ici est encore frais. */
function derniereActualisation(){
  let d = null;
  const retenir = (quand, par, quoi) => {
    const q = quandNormalise(quand);
    if(q && (!d || q > d.quand)) d = {quand:q, par: par || '', quoi};
  };
  rubriques().forEach(r => retenir(r.maj, r.par, 'Point « ' + r.nom + ' »'));
  (etat.visios||[]).forEach(v => retenir(v.quand, v.auteur, 'Compte rendu de la visio du ' + frdate(v.date)));
  return d;
}
/* Les points sont datés « AAAA-MM-JJ HH:MM », les visios en ISO :
   on ramène les deux à la même forme locale avant de les comparer. */
function quandNormalise(q){
  if(!q) return '';
  if(q.indexOf('T') === -1) return q;
  const t = new Date(q);
  if(isNaN(t)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
}
/* Qui tient la veille : le pilote de la mission rattachée à cet
   espace. Une seule source de vérité, dans Missions & organigramme. */
const missionVeille = () => (etat.missions||[]).find(m => espaceDe(m) === 'veille');

/* =========================================================
   LES VISIOS DE CRISE DE L'ARS

   L'ARS réunit ses partenaires en visioconférence à intervalle
   régulier et y déroule la situation de la région point par
   point. C'est, de loin, la source la plus dense dont dispose la
   CPTS : plutôt que de la laisser se diluer dans le fil des
   informations retenues, elle ouvre la situation régionale.

   La dernière séance s'affiche en entier, dépliée. Les
   précédentes se replient sous elle et se rouvrent d'un clic :
   on relit ce qui a été dit il y a deux jours sans quitter la
   page.
   ========================================================= */
let visioOuverte = null;
let pointsSaisie = [];

const visios = () => etat.visios || [];
const visiosTriees = () => [...visios()].sort((a,b) =>
  ((b.date||'') + ' ' + (b.heure||'')).localeCompare((a.date||'') + ' ' + (a.heure||'')));
const visioVide = v => !(v.points||[]).length && !v.consignes && !v.pourNous;

function ouvrirVisio(id){ visioOuverte = (visioOuverte === id) ? null : id; rendre(); }

/* Depuis le registre ARS, on retombe sur la séance dépliée : le
   registre dit qu'elle a eu lieu, la situation régionale dit ce qui
   s'y est dit. */
function ouvrirVisioDepuisARS(id){ visioOuverte = id; aller('veille'); }

/* =========================================================
   LE RENDEZ-VOUS DE 15 H

   Deux choses, et seulement deux, en tête de la situation
   régionale :

   1. Le lien du salon. Il est le même à chaque séance, il est
      déposé une fois, et il s'ouvre d'un clic depuis n'importe
      quel poste du cockpit. Avant, il circulait par mail et se
      cherchait à 14h55.
   2. Le créneau du jour. Chacun y pose son prénom pour dire
      qu'il y sera : l'équipe sait qui la représente avant que
      la séance commence, et personne n'y va à deux sans le
      savoir — ou n'y va à zéro en croyant qu'un autre y est.

   La présence annoncée n'est pas un compte rendu : ce qui s'est
   dit se consigne dessous, séance par séance.
   ========================================================= */
const salleVisio = () => (etat.salleVisio || [])[0] || null;
const presencesVisio = () => etat.presencesVisio || [];
/* Le prénom en cours de frappe. La page se redessine toute seule
   quand un autre poste enregistre quelque chose : sans ça, ce qui
   était tapé disparaissait sous les doigts. */
let saisiePresence = null;
const presencesDuJour = d => presencesVisio().filter(p => (p.date || '') === d);

/* Un lien collé à la va-vite arrive parfois sans « https:// », et
   parfois noyé dans le texte de l'invitation. On en extrait
   l'adresse, et on n'accepte qu'une adresse web : un bouton du
   cockpit ne doit pas pouvoir déclencher autre chose qu'une
   ouverture de page. */
function lienVisioPropre(v){
  const t = String(v || '').trim();
  if(!t) return '';
  const m = t.match(/https?:\/\/[^\s"'<>]+/i);
  if(m) return m[0];
  if(/^[\w.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?$/i.test(t)) return 'https://' + t;
  return '';
}

const heureVisio = () => (salleVisio() && salleVisio().horaire) || '15:00';
const heureLisible = h => String(h || '').replace(':00', ' h').replace(':', ' h ');

function jourLisible(d){
  const p = String(d || '').split('-');
  if(p.length !== 3) return frdateL(d);
  const j = new Date(+p[0], +p[1] - 1, +p[2]);
  return j.toLocaleDateString('fr-FR', {weekday:'long', day:'2-digit', month:'2-digit'});
}

function vueSalleVisio(){
  const s = salleVisio() || {};
  const url = lienVisioPropre(s.url);
  const auj = aujourdhui();
  const ici = presencesDuJour(auj);
  const h = heureLisible(heureVisio());

  let v = `<div class="salle-v">
    <div class="haut">
      <div class="q">
        <span class="k">Rendez-vous quotidien</span>
        <div class="n">Visio de crise de l'ARS Nouvelle-Aquitaine — tous les jours à ${esc(h)}</div>
        <div class="s">${url
          ? `Le lien du salon ne change pas d'une séance à l'autre : il s'ouvre d'ici, sans le demander à personne.${s.precision ? ' ' + esc(s.precision) : ''}`
          : `Aucun lien déposé. Tant qu'il n'est pas là, chacun le cherche dans sa boîte mail à 14 h 55.`}</div>
      </div>
      ${url
        ? `<a class="entrer" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Lien permanent visio ARS ${esc(h)}</a>`
        : `<button class="entrer vide" onclick="ouvrirDepotVisio()">Déposer le lien permanent visio ARS ${esc(h)}</button>`}
    </div>

    <div class="petits">
      ${url ? `<span class="adresse">${esc(url)}</span>
        <button onclick="copierLienVisio()">Copier le lien</button>` : ''}
      <button onclick="ouvrirDepotVisio()">${url ? 'Modifier le lien' : 'Déposer le lien'}</button>
      ${url && s.maj ? `<span class="adresse" style="flex:0 0 auto">Déposé le ${esc(frdateL(s.maj))}${s.par ? ' par ' + esc(s.par) : ''}</span>` : ''}
    </div>`;

  /* --- le créneau du jour --- */
  v += `<div class="creneau">
    <span class="jourh">Qui y sera — créneau du jour, ${esc(jourLisible(auj))} à ${esc(h)}</span>
    <div class="qui-v">${ici.length
      ? ici.map(p => `<span class="nom">${esc(p.prenom)}
          <button onclick="retirerPresenceVisio('${p.id}')" title="Retirer ${esc(p.prenom)} du créneau" aria-label="Retirer ${esc(p.prenom)} du créneau">×</button>
        </span>`).join('')
      : `<span class="personne">Personne ne s'est encore positionné sur la séance d'aujourd'hui.</span>`}</div>
    <div class="poser">
      <input id="pv-nom" value="${esc(saisiePresence !== null ? saisiePresence : (moi === 'Anonyme' ? '' : moi.split(' ')[0]))}"
        placeholder="Votre prénom" oninput="saisiePresence=this.value"
        onkeydown="if(event.key==='Enter')sePositionnerVisio()">
      <button class="btn" onclick="sePositionnerVisio()">J'y serai</button>
    </div>`;

  /* Les jours d'avant, en une ligne : assez pour voir qui porte le
     rendez-vous depuis le début, pas assez pour encombrer. */
  const avant = [...new Set(presencesVisio().map(p => p.date).filter(d => d && d < auj))]
    .sort().reverse().slice(0, 3);
  if(avant.length) v += `<div class="avant">Les jours précédents · ` + avant.map(d =>
    `<b>${esc(frdate(d))}</b> : ` + presencesDuJour(d).map(p => esc(p.prenom)).join(', ')).join(' · ') + `</div>`;

  return v + `</div></div>`;
}

function ouvrirDepotVisio(){
  const s = salleVisio() || {};
  document.getElementById('modale').innerHTML = `<h3>Lien permanent de la visio de l'ARS</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">L'adresse du salon, celle qui vaut pour toutes les séances. Déposée ici une fois, elle est à portée de clic pour tout le copil : plus personne n'a à la redemander avant l'heure.</p>
  <label style="margin-bottom:12px"><span class="k">Lien du salon *</span>
    <input id="sv-url" value="${esc(s.url || '')}" placeholder="https://…  — collez le lien reçu de l'ARS"></label>
  <div class="form">
    <label><span class="k">Heure de la séance</span><input id="sv-horaire" type="time" value="${esc(s.horaire || '15:00')}"></label>
    <label><span class="k">Précision</span>
      <input id="sv-precision" value="${esc(s.precision || '')}" placeholder="Plateforme, code d'accès, mot de passe…"></label>
  </div>
  <div class="actions">
    <button class="btn" onclick="enregistrerLienVisio()">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
    ${s.url ? `<button class="btn sec" style="margin-left:auto" onclick="retirerLienVisio()">Retirer le lien</button>` : ''}
  </div>`;
  ouvrirRideau();
  setTimeout(()=>{ const i = document.getElementById('sv-url'); if(i) i.focus({preventScroll:true}); }, 60);
}

async function enregistrerLienVisio(){
  const brut = document.getElementById('sv-url').value.trim();
  const url = lienVisioPropre(brut);
  if(brut && !url){ toast("Ce lien ne ressemble pas à une adresse web — il commence par https://"); return; }
  if(!url){ toast("Collez le lien du salon"); return; }

  etat.salleVisio = etat.salleVisio && etat.salleVisio.length ? etat.salleVisio : [{id:'sv'}];
  const s = etat.salleVisio[0];
  const change = lienVisioPropre(s.url) !== url;
  s.url = url;
  s.horaire = document.getElementById('sv-horaire').value || '15:00';
  s.precision = document.getElementById('sv-precision').value.trim();
  s.maj = horodate();
  s.par = moi;

  /* Le lien du rendez-vous quotidien est un fait de la journée :
     qui l'a déposé, et quand, se lit en main courante comme le
     reste. */
  if(change){
    etat.courante = etat.courante || [];
    etat.courante.push({
      id: uid(), type: 'Organisation', date: aujourdhui(), heure: maintenant(), source: '', qui: moi,
      evenement: "Lien permanent de la visio de crise de l'ARS déposé dans le cockpit — séance quotidienne à "
        + heureLisible(s.horaire) + (s.precision ? ' (' + s.precision + ')' : '') + ".",
      suite: "Accessible à tout le copil en tête de « Situation régionale ». Chacun s'y positionne sur le créneau du jour avant la séance.",
      auteur: moi, quand: new Date().toISOString()
    });
  }
  await sauver(); fermer(); rendre();
  toast(change ? "Lien de la visio déposé" : "Rendez-vous mis à jour");
}

async function retirerLienVisio(){
  const s = salleVisio();
  if(!s || !confirm("Retirer le lien du salon ?\n\nPlus personne ne pourra entrer dans la visio depuis le cockpit.")) return;
  s.url = '';
  s.maj = horodate();
  s.par = moi;
  await sauver(); fermer(); rendre();
  toast("Lien retiré");
}

async function copierLienVisio(){
  const url = lienVisioPropre((salleVisio() || {}).url);
  if(!url) return;
  try{
    await navigator.clipboard.writeText(url);
    toast("Lien copié — à coller dans le message");
  }catch(e){
    prompt("Copiez le lien de la visio :", url);
  }
}

async function sePositionnerVisio(){
  const c = document.getElementById('pv-nom');
  const n = c ? c.value.trim() : '';
  if(!n){ toast("Indiquez votre prénom"); return; }
  const auj = aujourdhui();
  if(presencesDuJour(auj).some(p => cleP(p.prenom) === cleP(n))){
    toast(n + " est déjà positionné·e sur la séance du jour"); return;
  }
  etat.presencesVisio = presencesVisio();
  etat.presencesVisio.push({
    id: uid(), date: auj, heure: heureVisio(), prenom: n,
    par: moi === 'Anonyme' ? n : moi, quand: new Date().toISOString()
  });
  saisiePresence = '';
  await sauver(); rendre();
  toast(n + " est attendu·e à la visio de " + heureLisible(heureVisio()));
}

async function retirerPresenceVisio(id){
  const p = presencesVisio().find(x => x.id === id);
  if(!p) return;
  if(!confirm("Retirer " + p.prenom + " du créneau du jour ?")) return;
  etat.presencesVisio = presencesVisio().filter(x => x.id !== id);
  await sauver(); rendre();
  toast(p.prenom + " retiré·e du créneau");
}

function vueVisios(){
  const l = visiosTriees();
  const derniere = l[0];
  const avant = l.slice(1);
  const aConsigner = l.filter(visioVide).length;

  let h = `<div class="visios">
    <div class="tete-v">
      <div>
        <h2 style="margin:0 0 3px">Ce que l'ARS a dit à sa dernière visio</h2>
        <p class="sous-v">Les points de situation régionaux de l'ARS Nouvelle-Aquitaine, dans l'ordre où ils ont été abordés. C'est la source la plus complète dont dispose la CPTS : elle passe avant tout le reste.</p>
      </div>
      <button class="btn" onclick="ouvrirSaisieVisio()">Consigner une visio</button>
    </div>`;

  if(!l.length){
    return h + `<div class="carte" style="margin:0"><p class="vide">Aucune visio consignée. Dès la prochaine séance, notez-en les points ici : c'est ce que le reste de l'équipe lira en premier.</p></div></div>`;
  }

  if(aConsigner) h += `<div class="alerte-v">${aConsigner === 1
    ? "Une séance a eu lieu sans que son compte rendu soit consigné."
    : aConsigner + " séances ont eu lieu sans que leur compte rendu soit consigné."} Ce qui s'y est dit n'existe nulle part ailleurs dans le cockpit : à reprendre auprès de la personne qui y assistait, tant que c'est frais.</div>`;

  h += carteVisio(derniere, true);

  if(avant.length){
    h += `<div class="avant-v"><span class="k">Séances précédentes</span>`;
    avant.forEach(v => { h += carteVisio(v, visioOuverte === v.id); });
    h += `</div>`;
  }

  return h + `</div>`;
}

function carteVisio(v, deplie){
  const pts = v.points || [];
  const vide = visioVide(v);
  const quand = `${frdate(v.date)}${v.heure ? ' à ' + esc(v.heure) : ''}`;

  let h = `<div class="visio ${deplie ? 'ouverte' : ''} ${vide ? 'creuse' : ''}">
    <button class="tete" onclick="ouvrirVisio('${v.id}')" aria-expanded="${!!deplie}">
      <span class="q">${quand}</span>
      <span class="i">
        <span class="n">${esc(v.instance || "Visio de crise de l'ARS")}</span>
        <span class="s">${[v.represente ? 'CPTS représentée par ' + v.represente : '',
          vide ? 'compte rendu à consigner' : pts.length + ' point' + (pts.length > 1 ? 's' : '') + ' abordé' + (pts.length > 1 ? 's' : '')]
          .filter(Boolean).map(esc).join(' · ')}</span>
      </span>
      <span class="chev">${deplie ? '▲' : '▼'}</span>
    </button>`;

  if(deplie){
    h += `<div class="dedans">`;

    if(vide){
      h += `<div class="manque-v">${esc(v.manquant ||
        "Rien n'a été rapporté de cette séance. Ce qui s'y est dit n'existe nulle part ailleurs dans le cockpit.")}</div>`;
    }

    if(pts.length) h += `<ol class="pts-v">${pts.map(p => `<li>
      <div class="t">${esc(p.titre)}</div>
      <div class="d">${esc(p.texte).replace(/\n/g,'<br>')}</div>
    </li>`).join('')}</ol>`;

    if(v.consignes) h += `<div class="bloc-v consignes">
      <span class="k">Ce que l'ARS demande</span><div class="d">${esc(v.consignes).replace(/\n/g,'<br>')}</div></div>`;

    if(v.pourNous) h += `<div class="bloc-v pour-nous">
      <span class="k">Ce que ça change pour la CPTS Pau Béarn</span><div class="d">${esc(v.pourNous).replace(/\n/g,'<br>')}</div></div>`;

    if(v.prochaine) h += `<div class="bloc-v"><span class="k">Prochaine séance</span><div class="d">${esc(v.prochaine)}</div></div>`;

    h += marqueRetenue(v);

    h += `<div class="bas-v">
      <button class="btn${vide ? '' : ' sec'}" onclick="ouvrirSaisieVisio('${v.id}')">${vide ? 'Consigner le compte rendu' : 'Modifier'}</button>
      ${enChantier('rapports') ? '' : `<button class="btn sec" onclick="ouvrirRetenu('visios','${v.id}')">${v.retenu && v.retenu.genre ? 'Modifier ce qu\'on en retient' : 'Retenir pour les rapports'}</button>`}
      <button class="retirer sup" onclick="supprimerVisio('${v.id}')">Retirer</button>
    </div></div>`;
  }

  return h + `</div>`;
}

/* --- Saisie d'une séance -------------------------------
   Les points s'ajoutent un par un, dans l'ordre où ils ont été
   abordés : c'est la forme sous laquelle l'ARS les déroule, et
   celle sous laquelle on les relit. */
function ouvrirSaisieVisio(id){
  const v = id ? visios().find(x => x.id === id) : null;
  pointsSaisie = v ? JSON.parse(JSON.stringify(v.points || [])) : [];
  if(!pointsSaisie.length) pointsSaisie.push({titre:'', texte:''});
  const g = (c, d) => esc(v ? (v[c] ?? '') : (d ?? ''));
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<h3>${v ? 'Compte rendu de la visio' : 'Consigner une visio de crise'}</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Un point par sujet abordé, dans l'ordre de la séance. Le titre se lit seul dans la liste ; le texte porte ce qui a été dit. Rien ne remplace une phrase écrite le soir même.</p>
  <div class="form">
    <label><span class="k">Date *</span><input id="vs-date" type="date" value="${g('date', aujourdhui())}"></label>
    <label><span class="k">Heure</span><input id="vs-heure" type="time" value="${g('heure', '15:00')}"></label>
    <label class="large"><span class="k">Instance</span>
      <input id="vs-instance" value="${g('instance', "Visio de crise de l'ARS Nouvelle-Aquitaine")}"></label>
    <label class="large"><span class="k">CPTS représentée par</span>
      <input id="vs-represente" value="${g('represente', moi === 'Anonyme' ? '' : moi)}" placeholder="Qui y assistait pour la CPTS Pau Béarn"></label>
  </div>

  <div style="margin-top:18px">
    <div class="barre-h" style="margin-bottom:8px">
      <span class="cpt-h">Points abordés</span>
      <button class="btn sec" onclick="ajouterPointVisio()">Ajouter un point</button>
    </div>
    <div id="pts-saisie">${pointsSaisie.map(pointVisioHTML).join('')}</div>
  </div>

  <div class="form" style="margin-top:16px">
    <label class="large"><span class="k">Ce que l'ARS demande</span>
      <textarea id="vs-consignes" placeholder="Les consignes explicites sorties de la séance, celles qu'on peut citer.">${g('consignes')}</textarea></label>
    <label class="large"><span class="k">Ce que ça change pour la CPTS Pau Béarn</span>
      <textarea id="vs-pourNous" placeholder="Ce qu'il faut décider, lancer ou arrêter de notre côté à la suite de cette séance.">${g('pourNous')}</textarea>
      <span class="aide">C'est ce champ-là qui fait la différence entre un compte rendu et une décision : sans lui, la séance reste une information que personne ne reprend. Une amorce ci-dessous pose le début de la phrase, à finir en quelques mots. Ce que vous écrivez ici se retrouve dans « Échanges avec l'ARS », colonne <em>Ce que ça implique pour la CPTS</em>.</span>
      ${amorces('vs-pourNous', IMPLIQUE_CPTS)}</label>
    <label class="large"><span class="k">Prochaine séance</span>
      <input id="vs-prochaine" value="${g('prochaine')}" placeholder="Ex. demain 15h, même lien"></label>
  </div>

  <div style="margin-top:14px"><label class="coche">
    <input type="checkbox" id="vs-mc" ${v && !visioVide(v) ? '' : 'checked'}>
    <span>Consigner en main courante
      <span class="d">Coché par défaut : toute information recueillie se retrouve dans la main courante, en plus de sa rubrique.</span></span>
  </label></div>

  <div class="actions">
    <button class="btn" onclick="validerVisio(${v ? `'${v.id}'` : ''})">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
  </div>`;
  ouvrirRideau();
}

function pointVisioHTML(p, i){
  return `<div class="pt-saisie" data-i="${i}">
    <div class="num">Point ${i+1}
      <button type="button" onclick="retirerPointVisio(${i})" title="Retirer ce point">Retirer ×</button></div>
    <input id="ps-titre-${i}" value="${esc(p.titre||'')}" placeholder="Ex. Évolution des fronts, situation hospitalière, transports sanitaires…"
      onchange="majPointVisio(${i},'titre',this.value)">
    <textarea id="ps-texte-${i}" placeholder="Ce qui a été dit sur ce point."
      onchange="majPointVisio(${i},'texte',this.value)">${esc(p.texte||'')}</textarea>
  </div>`;
}

function majPointVisio(i, c, v){ if(pointsSaisie[i]) pointsSaisie[i][c] = v; }

/* Les champs ne se déclarent qu'au « change » : avant de
   redessiner la liste, on relit ce qui est à l'écran pour ne pas
   perdre une saisie en cours. */
function relirePointsVisio(){
  pointsSaisie.forEach((p, i) => {
    ['titre','texte'].forEach(c => {
      const e = document.getElementById(`ps-${c}-${i}`);
      if(e) p[c] = e.value;
    });
  });
}
function redessinerPointsVisio(){
  const z = document.getElementById('pts-saisie');
  if(z) z.innerHTML = pointsSaisie.map(pointVisioHTML).join('');
}
function ajouterPointVisio(){
  relirePointsVisio();
  pointsSaisie.push({titre:'', texte:''});
  redessinerPointsVisio();
  const e = document.getElementById(`ps-titre-${pointsSaisie.length - 1}`);
  if(e){ e.scrollIntoView({block:'center'}); e.focus(); }
}
function retirerPointVisio(i){
  relirePointsVisio();
  pointsSaisie.splice(i, 1);
  if(!pointsSaisie.length) pointsSaisie.push({titre:'', texte:''});
  redessinerPointsVisio();
}

async function validerVisio(id){
  relirePointsVisio();
  const g = c => (document.getElementById('vs-' + c) || {}).value || '';
  const date = g('date');
  if(!date){ toast("La date de la séance est obligatoire"); return; }

  /* Un point sans titre ni texte n'est qu'une ligne restée vide :
     on ne la garde pas. Un point titré sans texte se garde — c'est
     un sujet abordé dont on n'a pas retenu le détail. */
  const points = pointsSaisie
    .map(p => ({titre:(p.titre||'').trim(), texte:(p.texte||'').trim()}))
    .filter(p => p.titre || p.texte)
    .map(p => ({titre: p.titre || 'Point sans intitulé', texte: p.texte}));

  const champs = {
    date, heure:g('heure').trim(), instance:g('instance').trim(),
    represente:g('represente').trim(), points,
    consignes:g('consignes').trim(), pourNous:g('pourNous').trim(),
    prochaine:g('prochaine').trim()
  };

  etat.visios = etat.visios || [];
  const v = id ? etat.visios.find(x => x.id === id) : null;
  let cible = v;
  if(v){
    Object.assign(v, champs, {modifiePar: moi});
    /* Le rappel « compte rendu manquant » n'a plus lieu d'être une
       fois la séance renseignée. */
    if(points.length || champs.consignes || champs.pourNous) delete v.manquant;
  }else{
    cible = Object.assign({id:uid(), auteur:moi, quand:new Date().toISOString()}, champs);
    etat.visios.push(cible);
  }

  const mc = (document.getElementById('vs-mc') || {}).checked;
  if(mc) consignerVisioEnCourante(champs);

  /* Le point de situation « Points de situation de l'ARS » se
     réécrit à partir de la séance : c'est ce qui se lit au copil. */
  majPointARS(champs);

  /* Une séance de crise est un échange avec l'ARS au même titre
     qu'un mail ou un appel : elle laisse sa ligne dans « Échanges
     avec l'ARS ». C'était la seule voie de contact à n'en laisser
     aucune — le compte rendu partait dans la situation régionale et
     le suivi ARS n'en savait rien. */
  tracerVisioDansARS(champs, cible.id);

  visioOuverte = cible.id;
  await sauver(); fermer(); rendre();
  toast(mc ? "Visio consignée, reportée en main courante et tracée avec l'ARS"
           : "Visio consignée, et tracée dans les échanges avec l'ARS");
}

/* L'entrée se réécrit à chaque enregistrement du compte rendu au
   lieu de s'ajouter : une séance, une ligne. C'est le champ `visio`
   qui les apparie — la séance du 27/07, consignée à la main dans
   l'amorçage, porte déjà le sien et se mettra donc à jour le jour
   où son compte rendu sera écrit, sans faire doublon. */
function tracerVisioDansARS(v, idVisio){
  etat.ars = etat.ars || [];
  const pts = (v.points||[]).map(p => '· ' + p.titre + (p.texte ? ' : ' + p.texte : '')).join('\n');
  const dit = [pts, v.consignes ? "Ce que l'ARS demande : " + v.consignes : ''].filter(Boolean).join('\n');
  const champs = {
    date: v.date, heure: v.heure || '',
    sens: "Reçu de l'ARS", canal: 'Visio',
    interlocuteur: "ARS Nouvelle-Aquitaine",
    objet: (v.instance || "Visio de crise de l'ARS")
      + ' du ' + frdateL(v.date) + (v.heure ? ' à ' + v.heure : ''),
    demande: dit || "Séance tenue. Le compte rendu reste à consigner : ce qui s'y est dit n'existe nulle part ailleurs.",
    reponse: [v.represente ? 'CPTS Pau Béarn représentée par ' + v.represente + '.' : '',
              "Compte rendu tenu dans « Situation régionale ».",
              v.prochaine ? 'Prochaine séance : ' + v.prochaine : ''].filter(Boolean).join(' '),
    attendu: v.pourNous || '',
    statut: v.pourNous ? 'En cours' : (dit ? 'Clos' : 'En attente'),
    visio: idVisio
  };
  const e = etat.ars.find(x => x.visio === idVisio);
  if(e) Object.assign(e, champs, {modifiePar: moi});
  else etat.ars.unshift(Object.assign({id:uid(), auteur:moi, quand:new Date().toISOString()}, champs));
}

/* Les séances tracées à la main avant que le cockpit ne le fasse
   seul n'ont pas le lien vers leur compte rendu : sans ce lien, le
   premier compte rendu consigné ouvrirait une seconde ligne à côté
   de la première. On le repose une fois au démarrage — d'abord sur
   les entrées de l'amorçage qui le portent, puis plus largement sur
   toute entrée « Visio » de mêmes date et heure qu'une séance : ce
   n'en est jamais une seconde, c'est la même. */
function apparierVisioARS(){
  (etatInitial.ars||[]).filter(o => o.visio).forEach(ref => {
    const e = (etat.ars||[]).find(x => x.id === ref.id);
    if(e && !e.visio) e.visio = ref.visio;
  });
  (etat.visios||[]).forEach(v => {
    if((etat.ars||[]).some(x => x.visio === v.id)) return;
    const e = (etat.ars||[]).find(x => !x.visio && x.canal === 'Visio'
      && x.date === v.date && (x.heure||'') === (v.heure||''));
    if(e) e.visio = v.id;
  });
}

function consignerVisioEnCourante(v){
  etat.courante = etat.courante || [];
  const corps = (v.points||[]).map(p => '· ' + p.titre + (p.texte ? ' : ' + p.texte : '')).join('\n');
  etat.courante.unshift({
    id: uid(), type: 'Visio ARS', date: v.date, heure: v.heure || '', source: 'ARS Nouvelle-Aquitaine',
    evenement: (v.instance || "Visio de crise de l'ARS")
      + (v.represente ? ` — la CPTS Pau Béarn y était représentée par ${v.represente}` : '')
      + (corps ? '.\n' + corps : '.')
      + (v.consignes ? "\nCe que l'ARS demande : " + v.consignes : ''),
    suite: v.pourNous || "Compte rendu consigné dans « Situation régionale ». Reste à en tirer ce qui appelle une décision du copil.",
    qui: v.represente || moi,
    auteur: moi, quand: ''
  });
}

function majPointARS(v){
  const r = rubriqueDe('rb-ars');
  if(!r) return;
  const lignes = (v.points||[]).map(p => p.titre + (p.texte ? ' : ' + p.texte : ''));
  if(!lignes.length && !v.consignes) return;
  r.etat = `Au point du ${frdateL(v.date)}${v.heure ? ' à ' + v.heure : ''} :\n`
    + lignes.map(x => '— ' + x).join('\n')
    + (v.consignes ? `\n\nCe que l'ARS demande : ${v.consignes}` : '');
  r.maj = horodate();
  r.par = moi;
}

async function supprimerVisio(id){
  const v = visios().find(x => x.id === id);
  if(!v) return;
  if(!confirm(`Retirer le compte rendu de la séance du ${frdateL(v.date)} ?\n\nCe qui s'y est dit n'existe nulle part ailleurs dans le cockpit.`)) return;
  noterRetrait(id);
  etat.visios = visios().filter(x => x.id !== id);
  await sauver(); rendre(); toast("Séance retirée");
}

function vueVeille(){

  /* --- le rendez-vous de 15 h : le lien du salon, et qui y sera --- */
  h += vueSalleVisio();

  h += `<div class="poste ${pilote ? '' : 'vacant'}">
