<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Plan canicule — Cockpit de crise CPTS Pau Béarn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#062B63;
  --encre-2:#0B4FA8;
  --cobalt-clair:#E8F0FB;
  --surface:#F3F6FB;
  --carte:#FFFFFF;
  --trait:#D8E1EF;
  --texte:#122238;
  --texte-2:#5A6B84;
  --ambre:#E8A33D;
  --braise:#C2482F;
  --stable:#2F7D62;
  --rail:250px;
  --display:'Archivo',system-ui,sans-serif;
  --corps:'Source Sans 3',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--corps);
  background:var(--surface);
  color:var(--texte);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- structure ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--encre);color:#C3D6F0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.marque{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.marque .nom{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff;line-height:1.2}
.marque .sous{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FA3D4;margin-top:6px}
.marque .crise{
  display:flex;align-items:center;gap:6px;margin-top:10px;
  background:var(--braise);color:#fff;text-decoration:none;
  border-radius:5px;padding:6px 9px;font-size:12.5px;font-weight:600;
}
.marque .crise::after{content:'⇄';margin-left:auto;opacity:.75;font-size:13px}
.marque .crise:hover{filter:brightness(1.08)}
.nav{padding:10px 8px;flex:1}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;
  padding:9px 10px;border-radius:6px;color:#B5CBE9;font-size:14px;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.actif{background:var(--encre-2);color:#fff;font-weight:600}
.nav button .cpt{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7FA3D4}
.nav button.actif .cpt{color:#DCE9FA}
.nav .groupe{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#6C8FC4;padding:16px 10px 6px}
.pied{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#7FA3D4}
.pied button{background:none;border:1px solid rgba(255,255,255,.18);color:#C3D6F0;border-radius:5px;padding:5px 9px;font-size:11.5px;cursor:pointer;margin:3px 3px 0 0}
.pied button:hover{border-color:#fff;color:#fff}
.pied .version{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:#5F82B4;margin-top:9px}

.zone{flex:1;min-width:0;display:flex;flex-direction:column}
.bandeau{
  background:var(--encre-2);color:#fff;padding:14px 26px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.bandeau .pastille{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--braise);padding:4px 9px;border-radius:3px;white-space:nowrap;
}
.bandeau .phrase{font-size:14.5px;flex:1;min-width:200px}
.bandeau .crayon{background:none;border:1px solid rgba(255,255,255,.3);color:#C3D6F0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;min-height:34px}
.bandeau .crayon:hover{border-color:#fff;color:#fff}
.bandeau .maj{font-family:var(--mono);font-size:11.5px;color:#A9C4E8}
.contenu{padding:26px;max-width:1180px;width:100%}

h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0 0 4px}
.chapo{color:var(--texte-2);margin:0 0 22px;max-width:70ch}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;margin:0 0 12px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;background:var(--encre-2);border-radius:2px;display:block}

/* ---------- feuillets ----------
   Un onglet du rail ne tient pas sur une seule page : il se lit
   en feuillets. Cette barre-là n'est pas un filtre, c'est de la
   navigation — elle passe donc avant le titre, en haut de l'écran,
   et se donne la taille qui va avec. Quelqu'un qui arrive doit
   voir du premier coup d'œil qu'il y a d'autres pages à ouvrir,
   et laquelle il est en train de lire. */
.feuillets{background:var(--carte);border:1px solid var(--trait);border-top:3px solid var(--encre);
  border-radius:11px;padding:11px 13px 13px;margin:0 0 22px;box-shadow:0 1px 3px rgba(6,43,99,.06)}
.feuillets .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:9px}
.feuillets .rangee{display:flex;gap:7px;flex-wrap:wrap}
.feuillets button{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--trait);border-radius:9px;padding:10px 15px;min-height:46px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;color:var(--encre-2)}
.feuillets button:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.feuillets button.on{background:var(--encre);border-color:var(--encre);color:#fff;
  box-shadow:inset 0 -3px 0 var(--ambre)}
.feuillets button .n{font-family:var(--mono);font-weight:400;font-size:11.5px;
  background:var(--cobalt-clair);color:var(--encre-2);border-radius:20px;padding:2px 8px}
.feuillets button.on .n{background:rgba(255,255,255,.22);color:#fff}
@media(max-width:640px){
  .feuillets{padding:10px 11px 12px;margin-bottom:18px}
  .feuillets button{font-size:14px;padding:9px 12px;min-height:44px}
}

/* ---------- cartes ---------- */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:18px;margin-bottom:18px}
.grille{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* ---------- consignes ---------- */
.consignes{display:grid;gap:14px}
@media(min-width:820px){.consignes{grid-template-columns:1fr 1fr}}
.bloc-consigne{border-radius:9px;padding:16px 18px;border:1px solid var(--trait);background:var(--carte)}
.bloc-consigne.faire{border-left:4px solid var(--stable)}
.bloc-consigne.eviter{border-left:4px solid var(--braise)}
.bloc-consigne h3{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--texte-2)}
.bloc-consigne ul{margin:0;padding-left:18px}
.bloc-consigne li{margin-bottom:7px}
.bloc-consigne li button{background:none;border:0;color:var(--texte-2);cursor:pointer;font-size:12px;padding:0 4px;opacity:.5}
.bloc-consigne li button:hover{opacity:1;color:var(--braise)}

/* ---------- compteurs ---------- */
.compteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.compteur{background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:13px 14px}
.compteur .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;color:var(--encre)}
.compteur .l{font-size:12px;color:var(--texte-2);margin-top:5px;line-height:1.3}

/* ---------- missions ---------- */
.mission{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:16px 18px;margin-bottom:12px}
.mission .haut{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.mission .titre{font-family:var(--display);font-weight:600;font-size:15.5px;flex:1;min-width:220px}
.mission .meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:13.5px}
.mission .meta div{min-width:130px}
.mission .meta .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.mission .suite{margin-top:12px;padding-top:12px;border-top:1px dashed var(--trait);font-size:14px}
.mission .suite .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:3px}

.etiq{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.e-attente{background:#FCF0DA;color:#8A5D12}
.e-cours{background:#DFF0E9;color:#1E5C46}
.e-lancer{background:#E2EAF5;color:#3D5578}
.e-fini{background:#E4E9F1;color:#6A7C93}
.e-bloque{background:#F8E0DB;color:#8E2F1D}

/* ---------- organigramme ---------- */
.orga{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));margin-bottom:26px}
.pers{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--encre-2);border-radius:11px;padding:17px 18px;display:flex;flex-direction:column}
.pers.vacant{border-top-color:var(--braise);background:#FDF7F5}
.pers .qui{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-2)}
.pers .nom{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.12;letter-spacing:-.015em;margin:7px 0 3px;color:var(--encre)}
.pers.vacant .nom{color:var(--braise)}
.pers .compte{font-size:12.5px;color:var(--texte-2);margin-bottom:13px}
.pers .chip{display:block;background:var(--cobalt-clair);border-radius:7px;padding:8px 11px;font-size:13.5px;margin-bottom:6px;line-height:1.35}
.pers .chip.appui{background:#F4F6FA;color:var(--texte-2)}
.pers .chip .r{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px;opacity:.75}
.pers .coord{margin:10px 0 12px;display:flex;flex-direction:column;gap:5px}
.pers .coord a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--encre-2);font-size:14px;padding:7px 10px;background:var(--cobalt-clair);border-radius:7px;min-height:40px}
.pers .coord a:active{background:#D6E5F9}
.pers .coord .abs{font-size:13px;color:var(--texte-2);font-style:italic}
.pers .modif{background:none;border:1px solid var(--trait);border-radius:6px;color:var(--texte-2);font-size:12px;padding:6px 10px;cursor:pointer;margin-top:4px;min-height:36px}
.pers .modif:hover{border-color:var(--encre-2);color:var(--encre-2)}
.pers .chip{cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit}
.pers .chip:hover{background:#D8E7FA}
.pers .chip.appui:hover{background:#EAEEF5}
.fiche h4{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--texte-2);margin:16px 0 5px}
.fiche p{margin:0}
.fiche ul{margin:0;padding-left:19px}
.fiche li{margin-bottom:5px}
.fiche .stop{background:#FBEDE9;border-left:3px solid var(--braise);border-radius:0 7px 7px 0;padding:10px 13px;margin-top:5px}
.mission .barre{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--trait);align-items:center}
.mission .sup-m,.miss-c .sup-m{margin-left:auto;background:none;border:0;color:var(--texte-2);opacity:.45;cursor:pointer;font-size:18px;padding:4px 8px}
.mission .sup-m:hover,.miss-c .sup-m:hover{opacity:1;color:var(--braise)}
.espace{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--trait);flex-wrap:wrap}
.espace .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2)}
.mesmissions{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09)}
.mesmissions .t{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#6C8FC4;margin-bottom:8px}
.mesmissions button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:0;border-radius:6px;color:#DCE9FA;padding:9px 10px;font-size:13px;margin-bottom:5px;cursor:pointer;line-height:1.3}
.mesmissions button:hover{background:rgba(255,255,255,.15)}
.mesmissions .r{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FA3D4;margin-top:3px}
.choixnom{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.choixnom button{text-align:left;background:var(--cobalt-clair);border:1px solid var(--trait);border-radius:8px;padding:12px 14px;font-size:16px;font-family:var(--display);font-weight:600;cursor:pointer;min-height:48px}
.choixnom button:hover{border-color:var(--encre-2)}
/* Même liste, en pastilles, quand elle sert à désigner un pilote
   au milieu d'un formulaire plutôt qu'à s'identifier. */
.choixnom.compact{flex-direction:row;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.choixnom.compact button{font-family:var(--corps);font-weight:400;font-size:13.5px;
  padding:7px 13px;min-height:38px;border-radius:20px;border-color:transparent;color:var(--encre-2)}
.choixnom.compact button.on{border-color:var(--encre-2);font-weight:600}
/* Les délais courants, en un clic, sous le champ de date. */
.delais{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.delais button{background:var(--cobalt-clair);border:1px solid transparent;border-radius:20px;
  color:var(--encre-2);font-family:inherit;font-size:13px;padding:7px 13px;cursor:pointer;min-height:38px}
.delais button:hover{border-color:var(--encre-2)}

/* Les référents de la gestion de crise : en tête de l'onglet,
   plus compacts que les cartes de mission — on vient y chercher
   un numéro, pas à s'y attarder. */
.refs{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 26px}
.ref{flex:1 1 212px;max-width:290px;background:var(--carte);border:1px solid var(--trait);
  border-left:4px solid var(--encre);border-radius:10px;padding:12px 14px;
  display:flex;flex-direction:column;gap:3px}
.ref .nom{font-family:var(--display);font-weight:700;font-size:16.5px;color:var(--encre);line-height:1.15}
.ref .prof{font-size:13px;color:var(--texte-2);line-height:1.3}
.ref a{margin-top:5px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  color:var(--encre-2);font-size:14.5px;padding:7px 10px;background:var(--cobalt-clair);
  border-radius:7px;min-height:40px}
.ref a:active{background:#D6E5F9}
.ref .abs{margin-top:5px;font-size:12.5px;color:var(--texte-2);font-style:italic}
.ref .b{display:flex;gap:6px;align-items:center;margin-top:6px}
.ref .modif{background:none;border:1px solid var(--trait);border-radius:6px;color:var(--texte-2);
  font-family:inherit;font-size:12px;padding:6px 10px;cursor:pointer;min-height:36px}
.ref .modif:hover{border-color:var(--encre-2);color:var(--encre-2)}
.ref .rx{background:none;border:0;color:var(--texte-2);font-size:17px;line-height:1;
  cursor:pointer;padding:4px 8px;border-radius:5px}
.ref .rx:hover{background:#F8E5E0;color:var(--braise)}
.ref.neuf{border:2px dashed var(--trait);align-items:flex-start;justify-content:center;
  cursor:pointer;font-family:inherit;text-align:left;min-height:98px;color:var(--texte-2)}
.ref.neuf:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.ref.neuf .plus{font-family:var(--display);font-size:24px;line-height:1;color:var(--encre-2)}
.ref.neuf .t{font-family:var(--display);font-weight:600;font-size:15px;color:var(--encre)}

/* Une mission sur une carte : la pastille ouvre la fiche, le
   crayon ouvre la modification. */
.mrow{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
.mrow .chip{margin-bottom:0;flex:1;min-width:0}
.pers .chip.vac{background:#F8E5E0;color:var(--texte)}
.crayon-m{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-size:14px;padding:0 10px;cursor:pointer;flex:0 0 auto}
.crayon-m:hover{border-color:var(--encre-2);color:var(--encre-2)}
.confier{margin-top:auto;background:none;border:1px dashed var(--trait);border-radius:7px;
  color:var(--encre-2);font-family:inherit;font-size:13px;padding:10px;cursor:pointer;min-height:42px}
.confier:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
/* Dernière carte de la grille : créer sans quitter l'organigramme. */
.neuve{background:none;border:2px dashed var(--trait);border-radius:11px;padding:22px 18px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;
  cursor:pointer;font-family:inherit;text-align:left;min-height:190px;color:var(--texte-2)}
.neuve:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.neuve .plus{font-family:var(--display);font-size:30px;line-height:1;color:var(--encre-2)}
.neuve .t{font-family:var(--display);font-weight:700;font-size:19px;color:var(--encre)}
.neuve .d{font-size:13px;line-height:1.4}
.sup-mod{background:none;border:0;color:var(--braise);font-family:inherit;font-size:13.5px;
  cursor:pointer;margin-left:auto;padding:8px 4px}
.sup-mod:hover{text-decoration:underline}
/* Renforts : les personnes positionnées auprès du pilote. Elles
   se lisent sous la mission qu'elles épaulent, décalées d'un cran
   pour que le rattachement saute aux yeux. */
.renforts{margin:-2px 0 10px 12px;padding-left:11px;border-left:2px solid var(--trait)}
.renforts .rf{display:flex;align-items:flex-start;gap:8px;padding:5px 0}
.renforts .rf .n{flex:1;font-size:13.5px;line-height:1.3;color:var(--encre)}
.renforts .rf .q{display:block;font-size:12px;color:var(--texte-2)}
.renforts .rx{background:none;border:0;color:var(--texte-2);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:5px}
.renforts .rx:hover{background:#F8E5E0;color:var(--braise)}
.renforts .rplus{background:none;border:1px dashed var(--trait);border-radius:6px;color:var(--texte-2);
  font-family:inherit;font-size:12px;padding:6px 10px;cursor:pointer;min-height:34px;margin-top:3px}
.renforts .rplus:hover{border-color:var(--encre-2);color:var(--encre-2)}
.renforts-m{margin-top:12px}
.renforts-m .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:4px}

/* =========================================================
   MISSIONS ET ORGANIGRAMME — les deux feuillets

   La même liste se lit par personne ou par mission, jamais les
   deux sur le même écran. « Par personne » est le feuillet
   d'arrivée : en crise, la première question est qui est là.
   ========================================================= */

/* Ce qui manque, avant de descendre dans le détail. */
.miss-trous{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.miss-trou{flex:1 1 186px;background:var(--carte);border:1px solid var(--trait);
  border-left:3px solid var(--texte-2);border-radius:9px;padding:11px 13px}
.miss-trou.alerte{border-left-color:var(--braise)}
.miss-trou.veille{border-left-color:var(--ambre)}
.miss-trou .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;
  color:var(--encre);font-variant-numeric:tabular-nums}
.miss-trou.alerte .n{color:var(--braise)}
.miss-trou .l{font-size:12.5px;color:var(--texte-2);margin-top:4px;line-height:1.3}
.miss-trou .l button{background:none;border:0;padding:0;color:var(--encre-2);
  font-family:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline}

.miss-lunettes{display:flex;background:var(--surface);border:1px solid var(--trait);
  border-radius:9px;padding:4px;width:max-content;max-width:100%;margin:0 0 20px}
.miss-lunettes button{background:none;border:0;border-radius:6px;padding:9px 17px;
  font-size:14px;color:var(--texte-2);font-weight:600;min-height:40px;cursor:pointer}
.miss-lunettes button.on{background:var(--carte);color:var(--encre);box-shadow:0 1px 3px rgba(6,43,99,.13)}

/* La carte d'une personne, dans l'ordre où on la lit : le nom en
   grand, la profession dessous, le statut dans l'association, puis
   la mission portée et les renforts positionnés dessus. La fiche
   mission ferme la carte. Rien d'autre. */
.miss-gens{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));margin-bottom:22px}
.miss-pers{background:var(--carte);border:1px solid var(--trait);border-radius:11px;
  padding:16px 17px 14px;display:flex;flex-direction:column}
.miss-pers .nom{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.06;
  letter-spacing:-.02em;color:var(--encre)}
.miss-pers .prof{font-size:13px;color:var(--texte-2);margin-top:5px;line-height:1.3}
/* Le statut dans l'association — vice-présidente, référente d'un
   groupe de travail. Absent quand la personne n'en a pas. */
.miss-pers .statut{align-self:flex-start;margin-top:7px;font-family:var(--mono);font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--encre-2);
  background:var(--cobalt-clair);border-radius:4px;padding:4px 8px;line-height:1.25}
.miss-pers .lignes{margin-top:13px;display:grid;gap:12px}
/* La mission portée : son intitulé, et dessous les noms de ceux
   qui viennent en renfort dessus. */
.miss-pers .mis{border-top:1px solid var(--trait);padding-top:12px}
.miss-pers .mis .role{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texte-2);margin-bottom:3px}
.miss-pers .mis .mt{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.25;
  color:var(--encre)}
.miss-pers .mis .ech{font-size:12px;color:var(--texte-2);margin-top:3px}
.miss-pers .mis .rf{font-size:13.5px;line-height:1.35;color:var(--texte);margin-top:6px}
.miss-pers .mis .rf .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.miss-pers .plusrf{background:none;border:1px dashed var(--trait);border-radius:6px;
  color:var(--encre-2);font-family:inherit;font-size:12.5px;padding:6px 10px;cursor:pointer;
  min-height:34px;margin-top:7px}
.miss-pers .plusrf:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.miss-pers .fichem{width:100%;margin-top:9px}
.miss-pers .tel{margin-top:auto;padding-top:14px}
.miss-pers .tel a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  color:var(--encre-2);font-size:14px;padding:7px 10px;background:var(--cobalt-clair);
  border-radius:7px;min-height:40px;margin-right:6px}
.miss-pers .tel a:active{background:#D6E5F9}
.miss-pers .manquant{background:none;border:0;padding:0;color:var(--braise);
  font-family:inherit;font-size:13px;font-style:italic;cursor:pointer;text-decoration:underline}
.miss-pers .modif{background:none;border:0;padding:0;color:var(--texte-2);font-family:inherit;
  font-size:12px;cursor:pointer;display:block;margin-top:7px}
.miss-pers .modif:hover{color:var(--encre-2)}
.miss-neuf{background:none;border:2px dashed var(--trait);border-radius:11px;padding:20px 17px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;
  cursor:pointer;font-family:inherit;text-align:left;min-height:150px;color:var(--texte-2)}
.miss-neuf:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.miss-neuf .plus{font-family:var(--display);font-size:28px;line-height:1;color:var(--encre-2)}
.miss-neuf .t{font-family:var(--display);font-weight:700;font-size:18px;color:var(--encre)}
.miss-neuf .d{font-size:13px;line-height:1.4}

/* Les missions que personne ne porte ne sont pas quelqu'un :
   elles descendent en bande sous les noms, au lieu de se faire
   passer pour un membre de l'équipe. */
.apourvoir{border:1px solid var(--braise);border-left-width:4px;border-radius:9px;
  padding:15px 17px;background:var(--carte);margin-bottom:24px}
.apourvoir .tt{font-family:var(--display);font-weight:700;font-size:17px;color:var(--braise);margin-bottom:3px}
.apourvoir .ss{font-size:13px;color:var(--texte-2);margin-bottom:11px}
.apourvoir ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.apourvoir li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.apourvoir li .t{flex:1;min-width:190px;background:none;border:0;padding:0;text-align:left;
  font-family:inherit;font-size:14.5px;line-height:1.3;color:var(--texte);cursor:pointer}
.apourvoir li .t:hover{color:var(--encre-2)}
.apourvoir li .designer{background:none;border:1px solid var(--trait);border-radius:6px;
  color:var(--braise);font-family:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer;min-height:32px}
.apourvoir li .designer:hover{border-color:var(--braise);background:var(--braise);color:#fff}

/* La carte d'une mission, groupée sous son statut. Le liseré de
   gauche dit l'état ; la prochaine action tient le centre. */
.miss-grp{margin-bottom:28px}
.miss-grp > h3{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--texte-2);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--trait);
  display:flex;align-items:baseline;gap:9px;font-weight:400}
.miss-grp > h3 .c{font-family:var(--corps);letter-spacing:0;text-transform:none;font-size:12.5px}
.miss-pile{display:grid;gap:12px}
.miss-c{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--trait);
  border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.miss-c.st-cours{border-left-color:var(--stable)}
.miss-c.st-lancer{border-left-color:var(--encre-2)}
.miss-c.st-attente{border-left-color:var(--ambre)}
.miss-c.st-bloque{border-left-color:var(--braise)}
.miss-c.st-fini{opacity:.66}
.miss-c .haut{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.miss-c .titre{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.25;
  color:var(--encre);flex:1;min-width:220px}
.miss-c .detail{font-size:14px;color:var(--texte-2);line-height:1.4}
.miss-prochaine{background:var(--cobalt-clair);border:0;border-radius:8px;padding:11px 13px;
  text-align:left;width:100%;font-family:inherit;cursor:pointer;display:block}
.miss-prochaine .k{color:var(--encre-2)}
.miss-prochaine p{margin:4px 0 0;font-size:14px;line-height:1.45;color:var(--texte)}
.miss-prochaine:hover{background:#D8E7FA}
.miss-prochaine.vide{background:var(--surface);border:1px dashed var(--trait)}
.miss-prochaine.vide p{color:var(--texte-2);font-style:italic}
.miss-prochaine.vide:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.miss-eq{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:flex-start}
.miss-eq > div{min-width:148px}
.miss-eq .qn{display:inline-block;margin-top:3px;font-size:14.5px;font-family:var(--display);
  font-weight:600;color:var(--texte)}
.miss-eq .qn.manque{color:var(--braise);background:none;border:0;padding:0;cursor:pointer;
  border-bottom:1px dashed currentColor}
.miss-eq .qn.absent{color:var(--texte-2);font-weight:400;font-family:var(--corps)}
.miss-eq .renf{font-size:13.5px;line-height:1.35;margin-top:3px}
.miss-eq .renf em{display:block;font-style:normal;font-size:12.5px;color:var(--texte-2)}
.miss-c .barre-m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-top:11px;border-top:1px dashed var(--trait)}
.miss-c .barre-m .sup-m{margin-left:auto}
@media(max-width:620px){
  .miss-c .barre-m .sup-m{margin-left:0}
}
.renforts-m .renforts{margin-left:0}
.legende{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--texte-2);margin:-12px 0 18px}
.legende span{display:flex;align-items:center;gap:6px}
.legende i{width:12px;height:12px;border-radius:3px;display:block;font-style:normal}

/* ---------- fil ---------- */
.fil{list-style:none;margin:0;padding:0}
.fil li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--trait)}
.fil li:last-child{border-bottom:0}
.fil .h{font-family:var(--mono);font-size:11.5px;color:var(--texte-2);flex:0 0 92px;padding-top:2px}
.fil .c{flex:1;min-width:0}
.fil .c .t{font-weight:600}
.fil .c .d{color:var(--texte-2);font-size:13.5px;margin-top:2px}
.fil .c .s{font-family:var(--mono);font-size:11px;color:var(--texte-2);margin-top:4px}
.fil .sup{background:none;border:0;color:var(--texte-2);cursor:pointer;opacity:.4;font-size:14px;padding:0 2px;align-self:flex-start}
.fil .sup:hover{opacity:1;color:var(--braise)}

/* ---------- la main courante ----------
   Elle se lit comme le fil qu'elle a remplacé : une ligne par
   fait, l'heure en marge, la nature en pastille, et le nom de qui
   s'en est chargé sous la ligne. Ce qui a été écrit en plus — le
   texte entier, la suite donnée — ne s'ouvre qu'à la demande : on
   parcourt d'abord, on lit ensuite.

   Les outils ne s'affichent qu'au survol de l'entrée : trois cents
   entrées portant chacune quatre boutons se liraient comme une
   barre d'outils, pas comme un registre. Au doigt, faute de
   survol, ils restent visibles. */
.fil .tete{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.fil .venu{display:inline-flex;align-items:baseline;gap:6px;background:#FCF3E4;color:#8A5D12;
  border-radius:20px;padding:2px 9px;font-size:11.5px;max-width:100%}
.fil .venu .p{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.fil .out{margin-left:auto;display:flex;gap:1px;opacity:0;transition:opacity .12s}
.fil li:hover .out, .fil li:focus-within .out{opacity:1}
@media(hover:none){.fil .out{opacity:1}}
.fil .out button{background:none;border:0;color:var(--texte-2);cursor:pointer;font-size:13px;
  line-height:1;padding:3px 4px;border-radius:5px;font-family:inherit}
.fil .out button:hover{background:var(--surface);color:var(--encre)}
.fil .out button[disabled]{opacity:.25;cursor:default}
.fil .out button.sup:hover{color:var(--braise)}
/* La personne en charge se corrige là où elle se lit : le nom est
   lui-même le bouton, et un crayon discret le dit. */
.fil .qui{background:none;border:0;padding:0;margin:0;cursor:pointer;font-family:inherit;
  font-size:11px;letter-spacing:.04em;color:var(--encre-2);border-bottom:1px dashed var(--trait)}
.fil .qui:hover{color:var(--encre);border-bottom-color:var(--encre-2)}
.fil .qui.vide{color:var(--texte-2);font-style:italic}
.fil .qui::after{content:" ✎";opacity:.5;font-style:normal}
.fil .plus{background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:11px;
  letter-spacing:.04em;color:var(--encre-2);text-decoration:underline;text-underline-offset:2px}
.fil .c .s .sep{opacity:.4;margin:0 6px}
/* Le texte entier est toujours dans la page, replié seulement : à
   l'écran on lit le résumé, mais un PDF de main courante ne tronque
   rien — c'est la pièce qu'on joint au retour d'expérience. */
.fil .plein{margin-top:6px;padding:8px 11px;background:var(--surface);border-radius:7px;
  font-size:13.5px;line-height:1.5;color:var(--texte);white-space:pre-line}
.fil .plein.plie{display:none}
.fil .plein .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--encre-2);margin:9px 0 1px}
.fil .plein .k:first-child{margin-top:0}
.fil .jour{border-bottom:0;padding:14px 0 2px}
.fil .jour:first-child{padding-top:2px}
.fil .jour .n{font-family:var(--display);font-weight:600;font-size:13px;color:var(--encre)}
.fil .jour .auj{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--braise);margin-left:8px}
@media(max-width:600px){
  .fil .out{opacity:1}
}

/* ---------- le rendez-vous de 15 h ----------
   Le salon de la visio de l'ARS ne change pas d'une séance à
   l'autre : le lien est déposé une fois et se retrouve en tête de
   la situation régionale, pour que n'importe qui du copil entre
   dans la séance sans avoir à le redemander avant 15 h. Dessous,
   le créneau du jour : chacun y pose son prénom, et l'équipe sait
   avant l'heure qui l'y représentera. */
.salle-v{background:var(--carte);border:1px solid var(--trait);border-left:5px solid var(--ambre);
  border-radius:12px;padding:16px 18px;margin-bottom:16px}
.salle-v .haut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.salle-v .haut > .q{flex:1;min-width:230px}
.salle-v .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:3px}
.salle-v .n{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25;color:var(--encre)}
.salle-v .s{font-size:12.5px;color:var(--texte-2);margin-top:3px}
.salle-v .entrer{display:inline-flex;align-items:center;gap:9px;background:var(--encre);color:#fff;
  font-family:var(--display);font-weight:700;font-size:15px;border:0;border-radius:9px;
  padding:13px 20px;min-height:50px;text-decoration:none;cursor:pointer}
.salle-v .entrer:hover{background:var(--encre-2)}
.salle-v .entrer.vide{background:#fff;color:var(--encre);border:1px dashed var(--encre-2);font-weight:600}
.salle-v .petits{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.salle-v .petits button{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-family:var(--corps);font-size:12.5px;padding:7px 11px;cursor:pointer;min-height:38px}
.salle-v .petits button:hover{border-color:var(--encre-2);color:var(--encre-2)}
.salle-v .adresse{font-family:var(--mono);font-size:11px;color:var(--texte-2);word-break:break-all;
  flex:1;min-width:160px}

/* Le créneau du jour. Un prénom, un clic : c'est tout ce qu'on
   demande à quelqu'un qui a la séance dans dix minutes. */
.creneau{border-top:1px dashed var(--trait);margin-top:14px;padding-top:12px}
.creneau .jourh{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:8px}
.creneau .qui-v{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.creneau .qui-v .nom{display:inline-flex;align-items:center;gap:7px;background:var(--cobalt-clair);
  color:var(--encre);border-radius:20px;padding:6px 6px 6px 13px;font-size:13.5px;font-weight:600;
  font-family:var(--display)}
.creneau .qui-v .nom button{background:none;border:0;color:var(--encre-2);opacity:.5;cursor:pointer;
  font-size:14px;line-height:1;padding:3px 6px;border-radius:50%}
.creneau .qui-v .nom button:hover{opacity:1;color:var(--braise);background:#FCF0EC}
.creneau .qui-v .personne{font-size:13.5px;color:var(--texte-2);font-style:italic}
.creneau .poser{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.creneau .poser input{flex:1;min-width:170px;max-width:280px;margin:0}
.creneau .avant{font-size:12px;color:var(--texte-2);margin-top:10px;line-height:1.5}
.creneau .avant b{font-weight:600;color:var(--texte)}
@media(max-width:640px){
  .salle-v{padding:14px}
  .salle-v .entrer{width:100%;justify-content:center}
  .creneau .poser input{max-width:none}
}

/* ---------- visios de crise de l'ARS ----------
   En tête de la situation régionale, et traitées comme telles :
   fond encré, séance la plus récente dépliée, les précédentes
   repliées dessous. C'est le premier bloc qu'on lit en arrivant. */
.visios{background:var(--encre);border-radius:12px;padding:19px 20px;margin-bottom:20px}
.visios .tete-v{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.visios .tete-v > div{flex:1;min-width:250px}
.visios .tete-v h2{color:#fff;font-size:17px}
.visios .tete-v h2::before{background:var(--ambre)}
.visios .sous-v{font-size:13px;color:#A9C4E8;margin:0;max-width:72ch}
.visios .tete-v .btn{background:#fff;color:var(--encre);flex:0 0 auto}
.visios .tete-v .btn:hover{background:var(--cobalt-clair)}
.visios .vide{color:#A9C4E8}
.visios .alerte-v{background:#7A3520;border:1px solid #A5563A;color:#FFE2D8;border-radius:8px;
  padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.visios .avant-v{margin-top:14px}
.visios .avant-v > .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#7FA3D4;display:block;margin-bottom:7px}

.visio{background:var(--carte);border-radius:10px;margin-bottom:8px;overflow:hidden}
.visio:last-child{margin-bottom:0}
.visio.creuse{background:#FDF7F3}
.visio .tete{display:flex;gap:13px;align-items:center;padding:13px 15px;cursor:pointer;flex-wrap:wrap;
  width:100%;background:none;border:0;text-align:left;font-family:inherit;font-size:inherit;color:inherit}
.visio .tete:hover{background:var(--cobalt-clair)}
.visio .tete .q{font-family:var(--mono);font-size:11.5px;color:var(--texte-2);flex:0 0 112px}
.visio .tete .i{flex:1;min-width:190px}
.visio .tete .i .n{font-family:var(--display);font-weight:700;font-size:16px;color:var(--encre);
  line-height:1.25;display:block}
.visio .tete .i .s{font-size:12.5px;color:var(--texte-2);margin-top:2px;display:block}
.visio .tete .chev{font-family:var(--mono);font-size:13px;color:var(--texte-2);flex:0 0 14px;text-align:center}
.visio .dedans{padding:2px 15px 15px;border-top:1px dashed var(--trait)}
.visio .manque-v{background:#FCF0EC;border:1px solid #E8C3B8;color:#8C2F1B;border-radius:7px;
  padding:11px 13px;font-size:13.5px;margin-top:13px}

/* Les points de la séance : numérotés, dans l'ordre où l'ARS les
   a déroulés. C'est cette forme-là qu'on relit. */
.pts-v{margin:14px 0 0;padding:0;list-style:none;counter-reset:ptv}
.pts-v li{counter-increment:ptv;position:relative;padding:0 0 13px 34px;margin-bottom:13px;
  border-bottom:1px solid var(--trait)}
.pts-v li:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.pts-v li::before{content:counter(ptv);position:absolute;left:0;top:1px;width:23px;height:23px;
  border-radius:50%;background:var(--cobalt-clair);color:var(--encre-2);font-family:var(--mono);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:500}
.pts-v .t{font-family:var(--display);font-weight:600;font-size:15px;color:var(--encre);line-height:1.3}
.pts-v .d{font-size:14px;line-height:1.5;margin-top:4px}

.visio .bloc-v{margin-top:13px;border-radius:0 7px 7px 0;border-left:3px solid var(--trait);
  padding:10px 13px;background:var(--surface)}
.visio .bloc-v.consignes{border-left-color:var(--encre-2);background:var(--cobalt-clair)}
.visio .bloc-v.pour-nous{border-left-color:var(--ambre);background:#FCF3E4}
.visio .bloc-v .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:3px}
.visio .bloc-v .d{font-size:13.5px;line-height:1.45}
.visio .bas-v{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px}
.visio .bas-v .sup{margin-left:auto}

/* Saisie d'une séance : un bloc par point, ajouté à la demande. */
.pt-saisie{border:1px solid var(--trait);border-left:3px solid var(--cobalt-clair);border-radius:8px;
  padding:12px 13px;margin-bottom:10px;background:#FCFDFF}
.pt-saisie .num{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);display:flex;align-items:center;margin-bottom:8px}
.pt-saisie .num button{margin-left:auto;background:none;border:0;color:var(--texte-2);cursor:pointer;
  font-size:13px;padding:2px 6px;border-radius:5px}
.pt-saisie .num button:hover{color:var(--braise);background:#FDF0EC}
.pt-saisie input{margin-bottom:8px}
.pt-saisie textarea{min-height:64px}

@media(max-width:640px){
  .visios{padding:16px 14px;border-radius:10px}
  .visio .tete{padding:13px 13px;gap:9px}
  .visio .tete .q{flex:0 0 auto}
  .visio .dedans{padding:2px 13px 14px}
  .pts-v li{padding-left:29px}
}

/* ---------- veille ---------- */
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filtres button{border:1px solid var(--trait);background:var(--carte);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--texte-2)}
.filtres button.on{background:var(--encre);border-color:var(--encre);color:#fff}
.cptsl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));margin-bottom:20px}
.cptsc{background:var(--carte);border:1px solid var(--trait);border-left:5px solid var(--trait);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.cptsc.feu{border-left-color:var(--braise)}
.cptsc.proche{border-left-color:var(--ambre)}
.cptsc.fait{background:#F6FBF8}
.cptsc .nom{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.2;color:var(--encre)}
.cptsc .terr{font-size:12.5px;color:var(--texte-2);line-height:1.4}
.cptsc .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:7px 9px}
.cptsc .rangee{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cptsc select{width:auto;flex:1;min-width:140px;min-height:40px}
.cptsc a.tel{display:inline-flex;align-items:center;justify-content:center;background:var(--encre-2);color:#fff;font-family:var(--display);font-weight:600;border-radius:8px;padding:10px 14px;text-decoration:none;min-height:44px;flex:1;min-width:150px}
.cptsc a.tel.second{background:var(--carte);color:var(--encre-2);border:1px solid var(--encre-2)}
.cptsc a.tel small{display:block;font-family:var(--corps);font-weight:400;font-size:11px;opacity:.85;line-height:1.2}
.cptsc .corriger{background:var(--cobalt-clair);border:1px solid var(--trait);color:var(--encre-2);font-family:var(--display);font-weight:600;font-size:12.5px;border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;white-space:nowrap}
.cptsc .corriger:hover{background:#DCE8F8}
.cptsc .telmaj{font-family:var(--mono);font-size:10.5px;color:var(--texte-2)}
.cptsc .journal{border-top:1px dashed var(--trait);padding-top:9px;margin-top:2px}
.cptsc .journal .vide{font-size:12.5px;font-style:italic;color:var(--texte-2);padding:0}
.cptsc .app{border-left:2px solid var(--cobalt-clair);padding:2px 0 2px 10px;margin-bottom:9px}
.cptsc .app .q{font-family:var(--mono);font-size:10.5px;color:var(--texte-2)}
.cptsc .app .d{font-size:13px;line-height:1.4;margin-top:2px}
.cptsc .app .s{font-size:12.5px;color:var(--texte-2);margin-top:2px}
.cptsc .app button{background:none;border:0;color:var(--texte-2);opacity:.45;cursor:pointer;font-size:13px;padding:0 3px}
.cptsc .app button:hover{opacity:1;color:var(--braise)}
.etabs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));margin-bottom:22px}
.etab{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--encre-2);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:8px}
.etab.prive{border-top-color:var(--stable)}
.etab.lib{border-top-color:var(--ambre)}
.etab .tete{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.etab .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;color:var(--encre)}
.etab .type{font-size:12.5px;color:var(--texte-2);margin-top:2px}
.etab .lits{font-family:var(--display);font-weight:700;font-size:26px;color:var(--encre-2);line-height:1;text-align:right;white-space:nowrap}
.etab .lits small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-2);font-weight:400;margin-top:3px}
.etab .cap{font-size:13px;color:var(--texte-2);line-height:1.45}
.etab .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:8px 10px}
.etab .liens{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.etab .liens a{display:inline-flex;align-items:center;min-height:44px;padding:9px 13px;border-radius:8px;text-decoration:none;font-size:14px}
.etab .liens a.tel{background:var(--encre-2);color:#fff;font-weight:600;font-family:var(--display)}
.etab .liens a.adr,.etab .liens a.web{background:var(--cobalt-clair);color:var(--encre-2);font-size:13px}
.etab .badges{display:flex;gap:6px;flex-wrap:wrap}
.lignes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));margin-bottom:22px}
.ligne{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--encre-2);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:9px}
.ligne.urg{border-left-color:var(--braise)}
.ligne .org{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2)}
.ligne .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;color:var(--encre)}
.ligne .quoi{font-size:13.5px;color:var(--texte-2);line-height:1.45}
.ligne .dispo{font-family:var(--mono);font-size:11px;color:var(--stable)}
.ligne .actes{display:flex;flex-direction:column;gap:7px}
.ligne .actes a{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:600}
.ligne .actes a.tel{background:var(--encre-2);color:#fff;font-family:var(--display)}
.ligne .actes a.tel:active{background:var(--encre)}
.ligne .actes a.ml{background:var(--cobalt-clair);color:var(--encre-2);font-size:13.5px;word-break:break-all}
.ligne .actes a.web{background:#fff;border:1px solid var(--trait);color:var(--texte);font-size:13.5px;font-weight:400}
.ligne .aver{background:#FCF3E4;border-radius:6px;padding:8px 10px;font-size:12.5px;color:#8A5D12}
.ligne .retirer{background:none;border:1px solid var(--trait);border-radius:6px;color:var(--texte-2);font-size:12px;padding:6px 10px;cursor:pointer;align-self:flex-start}
.ligne .retirer:hover{border-color:var(--braise);color:var(--braise)}
/* Situation régionale — les titres de section portent leur compte,
   pour qu'on sache d'un coup d'œil s'il reste du travail. */
.cpt-h{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);font-weight:400}
.sous-h{color:var(--texte-2);font-size:13.5px;margin:-6px 0 13px;max-width:78ch}

/* Le mode d'emploi, en tête de la veille : les quatre gestes. */
.guide{border-left:4px solid var(--encre-2)}
.gestes-g{margin:14px 0 0;padding-left:0;list-style:none;counter-reset:g}
.gestes-g li{counter-increment:g;position:relative;padding-left:38px;margin-bottom:12px;font-size:14px;line-height:1.5;color:var(--texte-2)}
.gestes-g li::before{content:counter(g);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;
  background:var(--cobalt-clair);color:var(--encre);font-family:var(--display);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.gestes-g li b{color:var(--encre);font-weight:600}
.guide .apres{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--trait);font-size:13px;color:var(--texte-2)}

/* Les feuillets : ce qu'on sait, point par point. Un point vierge
   se distingue d'un point qui a simplement vieilli. */
/* Une dizaine de points de situation côte à côte : chacun déployé
   en entier, la page devenait un mur qu'on ne parcourt plus. Le
   feuillet se replie donc sur ce qui se lit d'un coup d'œil — son
   nom, l'état en trois lignes, ce que ça implique pour nous — et
   s'ouvre en entier à la demande. Le crayon reste dans l'en-tête :
   mettre à jour un point ne demande pas de l'ouvrir d'abord.
   À l'impression, tout se déplie : un dossier de traçabilité ne
   tronque rien. */
.points{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-bottom:8px}
.pt{background:var(--carte);border:1px solid var(--trait);border-top:3px solid var(--stable);border-radius:9px;padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px}
.pt.vieux{border-top-color:var(--ambre)}
.pt.vierge{border-top-color:var(--trait);background:var(--surface)}
.pt .tete-p{display:flex;align-items:flex-start;gap:4px}
.pt .bascule{flex:1;display:flex;align-items:flex-start;gap:8px;background:none;border:0;padding:0;
  cursor:pointer;text-align:left;font-family:inherit;color:inherit;min-width:0}
.pt .n{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.25;letter-spacing:-.01em;color:var(--encre);flex:1}
.pt .chev{font-family:var(--mono);font-size:11px;color:var(--texte-2);flex:0 0 11px;text-align:center;margin-top:3px}
.pt .modif-p{background:none;border:0;color:var(--texte-2);cursor:pointer;font-size:14px;
  padding:0 3px;border-radius:5px;line-height:1.2;flex:0 0 auto}
.pt .modif-p:hover{color:var(--encre-2);background:var(--cobalt-clair)}
.pt .e{font-size:13px;line-height:1.45}
.pt .e.rien{color:var(--texte-2);font-style:italic}
/* Replié, l'état s'arrête à trois lignes et la suite se devine :
   c'est assez pour reconnaître le point, pas assez pour croire
   qu'on l'a lu. */
.pt:not(.ouvert) .e{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pt:not(.ouvert) .imp .v{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pt:not(.ouvert) .q,.pt:not(.ouvert) .b{display:none}
.pt .imp{font-size:12.5px;line-height:1.4;background:#FCF3E4;border-left:3px solid var(--ambre);
  border-radius:0 6px 6px 0;padding:6px 9px;color:#6B4A12}
.pt .imp .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:1px;opacity:.75}
/* Le manque se signale sans prendre la place d'une réponse : une
   ligne en italique, pas un encadré. Dix feuillets muets ne doivent
   pas coûter dix pavés. */
.pt .imp.manque{background:none;border-left:0;border-radius:0;padding:0;
  font-size:11.5px;color:var(--texte-2);font-style:italic}
.pt .q{font-size:12.5px;color:var(--texte-2);line-height:1.4}
.pt .q .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:1px;opacity:.8}
.pt .meta{font-family:var(--mono);font-size:9.5px;color:var(--texte-2);margin-top:auto;padding-top:3px}
.pt.vieux .meta{color:#8A5D12}
.pt .b{display:flex;gap:7px;flex-wrap:wrap}
.pt .b button{flex:1;min-width:130px;min-height:38px;border-radius:7px;font-size:13px;cursor:pointer;border:1px solid var(--trait);background:#fff;color:var(--texte);font-family:inherit;padding:8px 11px}
.pt .b .maj{background:var(--encre-2);border-color:var(--encre-2);color:#fff;font-family:var(--display);font-weight:600}
.pt .b .maj:hover{background:var(--encre)}

/* Le poste de veille : qui la tient, et quand la page a bougé
   pour la dernière fois. Ce que le copil lit sans demander. */
.poste{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--encre-2);border-radius:11px;padding:18px 20px;margin-bottom:16px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.poste.vacant{border-top-color:var(--braise);background:#FDF7F5}
.poste .qui{flex:1;min-width:230px}
.poste .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:3px}
.poste .nom{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.12;letter-spacing:-.015em;color:var(--encre)}
.poste.vacant .nom{color:var(--braise)}
.poste .depuis{font-size:13px;color:var(--texte-2);margin-top:3px}
.poste .tours{flex:2;min-width:280px;display:flex;gap:10px;flex-wrap:wrap}
.tour-t{flex:1;min-width:150px;border:1px solid var(--trait);border-radius:9px;padding:11px 13px;background:var(--surface)}
.tour-t.fait{background:#F1F8F5;border-color:#BEDCCE}
.tour-t.du{background:#FCF3E4;border-color:#EBD5A8}
.tour-t .q{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2)}
.tour-t .v{font-size:13.5px;line-height:1.35;margin-top:4px}

/* Le mode d'emploi se replie une fois la main prise. */
.repli{background:var(--carte);border:1px solid var(--trait);border-radius:9px;margin-bottom:18px;overflow:hidden}
.repli > .tete{display:flex;gap:12px;align-items:center;padding:14px 17px;width:100%;background:none;border:0;text-align:left;cursor:pointer;font-family:inherit;font-size:inherit;color:inherit}
.repli > .tete:hover{background:var(--cobalt-clair)}
.repli > .tete .t{font-family:var(--display);font-weight:600;font-size:15px;color:var(--encre)}
.repli > .tete .s{font-size:13px;color:var(--texte-2);margin-top:2px}
.repli > .tete .chev{margin-left:auto;font-family:var(--mono);color:var(--texte-2)}
.repli .dedans{padding:0 17px 17px;border-top:1px dashed var(--trait)}

.choix{display:flex;gap:7px;flex-wrap:wrap}
.choix button{border:1px solid var(--trait);background:#fff;border-radius:8px;padding:9px 13px;font-size:13.5px;cursor:pointer;color:var(--texte-2);min-height:42px;font-family:inherit}
.choix button.on{border-color:var(--encre-2);background:var(--cobalt-clair);color:var(--encre);font-weight:600}
.coche{display:flex;gap:10px;align-items:flex-start;background:#F1F8F5;border:1px solid #BEDCCE;border-radius:8px;padding:11px 13px;font-size:13.5px}
.coche input{width:18px;height:18px;flex:0 0 18px;margin-top:2px;accent-color:var(--stable)}
.coche .d{font-size:12.5px;color:var(--texte-2);margin-top:2px}

/* Le rappel de méthode, en tête de la fenêtre d'un point. */
.rappel{background:var(--cobalt-clair);border-radius:8px;padding:11px 13px;margin-bottom:15px;font-size:13px;color:var(--texte-2);line-height:1.4}
.aide{display:block;font-size:12px;color:var(--texte-2);margin-top:4px;line-height:1.35}

/* ---------- registres de traçabilité ---------- */
.reg-jour{display:flex;align-items:center;gap:11px;margin:24px 0 11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2)}
.reg-jour:first-child{margin-top:2px}
.reg-jour::after{content:"";flex:1;height:1px;background:var(--trait)}
.reg-jour .n{color:var(--encre);font-weight:500;font-size:11.5px}
.reg-jour .auj{background:var(--cobalt-clair);color:var(--encre-2);padding:2px 7px;border-radius:3px}

.ent-r{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--trait);
  border-radius:8px;padding:14px 17px;margin-bottom:10px}
.ent-r.t-cours{border-left-color:var(--stable)}
.ent-r.t-attente{border-left-color:var(--ambre)}
.ent-r.t-bloque{border-left-color:var(--braise)}
.ent-r.t-fini{border-left-color:#A7B6CA}
.ent-r .haut{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ent-r .hr{font-family:var(--mono);font-size:11.5px;color:var(--texte-2)}
.ent-r .outils{margin-left:auto;display:flex;gap:1px}
.ent-r .outils button{background:none;border:0;cursor:pointer;color:var(--texte-2);opacity:.35;
  font-size:15px;line-height:1;padding:3px 6px;border-radius:4px}
.ent-r .outils button:hover{opacity:1;color:var(--braise);background:var(--surface)}
.ent-r .outils button[disabled]{opacity:.1;cursor:default;background:none;color:var(--texte-2)}
.ent-r .ti{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.4;
  color:var(--encre);white-space:pre-line}
.ent-r .bloc{margin-top:10px;padding-left:12px;border-left:2px solid var(--cobalt-clair)}
.ent-r .bloc .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:2px}
.ent-r .bloc .v{font-size:14px;white-space:pre-line}
.ent-r .chips{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;font-size:13.5px}
.ent-r .chips .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);margin-right:6px}
.ent-r .lien{display:inline-block;margin-top:10px;font-size:13.5px;color:var(--encre-2);
  text-decoration:none;border-bottom:1px solid var(--trait)}
.ent-r .lien:hover{border-color:var(--encre-2)}
/* Le renvoi vers le compte rendu d'une séance est un bouton, pas un
   lien sortant : il reste dans le cockpit, et se donne donc l'allure
   d'un lien plutôt que celle d'un bouton d'action. */
.ent-r .lien-v{display:block;background:none;border:0;border-bottom:1px solid var(--trait);
  padding:0;cursor:pointer;font-family:inherit;text-align:left;width:fit-content}
.ent-r .lien-v::after{content:" →";color:var(--texte-2)}
.ent-r .pied{margin-top:11px;padding-top:8px;border-top:1px dashed var(--trait);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--texte-2);
  display:flex;gap:6px 16px;flex-wrap:wrap}

/* ---------- collecte de matériel ---------- */
.jauge{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--trait);margin:0 0 8px}
.jauge i{display:block;height:100%;transition:width .3s}
.jauge i.oui{background:var(--stable)}
.jauge i.non{background:var(--braise)}
.jauge i.att{background:var(--ambre)}
.jl{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--texte-2);margin-bottom:20px}
.jl span{display:flex;align-items:center;gap:6px}
.jl i{width:11px;height:11px;border-radius:3px;display:block;font-style:normal}
.jl i.oui{background:var(--stable)}
.jl i.non{background:var(--braise)}
.jl i.att{background:var(--ambre)}

.dons{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.don{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--trait);border-radius:9px}
.don.oui{border-left-color:var(--stable)}
.don.non{border-left-color:var(--braise)}
.don.att{border-left-color:var(--ambre)}
.don .tete{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;flex-wrap:wrap;width:100%;background:none;border:0;text-align:left;font-family:inherit;font-size:inherit;color:inherit;border-radius:8px}
.don .tete:hover{background:var(--cobalt-clair)}
.don .qd{font-family:var(--mono);font-size:11.5px;color:var(--texte-2);flex:0 0 78px;line-height:1.35}
.don .ident{flex:1;min-width:170px}
.don .ident .n{font-family:var(--display);font-weight:600;font-size:15px;color:var(--encre);line-height:1.25}
.don .ident .s{font-size:12.5px;color:var(--texte-2);margin-top:2px}
.don .par{font-size:12.5px;color:var(--texte-2);flex:0 0 auto;max-width:170px}
.don .par b{font-weight:600;color:var(--texte)}
.don .mat{font-size:12.5px;background:#DFF0E9;color:#1E5C46;border-radius:6px;padding:5px 9px;max-width:260px;line-height:1.35}
.don .manque{font-size:12.5px;background:#FCF0DA;color:#8A5D12;border-radius:6px;padding:5px 9px}
.don .chev{font-family:var(--mono);font-size:13px;color:var(--texte-2);flex:0 0 14px;text-align:center}
.don .detail{border-top:1px dashed var(--trait);padding:15px 14px 16px}
.don .detail .form{margin-bottom:12px}
.don .suivi{border-top:1px dashed var(--trait);padding-top:10px;margin-bottom:12px}
.don .suivi .e{border-left:2px solid var(--cobalt-clair);padding:2px 0 2px 10px;margin-bottom:8px}
.don .suivi .e .q{font-family:var(--mono);font-size:10.5px;color:var(--texte-2)}
.don .suivi .e .d{font-size:13px;line-height:1.4;margin-top:2px}
.don .suivi .e button{background:none;border:0;color:var(--texte-2);opacity:.45;cursor:pointer;font-size:13px;padding:0 3px}
.don .suivi .e button:hover{opacity:1;color:var(--braise)}
.don .bas{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.don .bas .sup{margin-left:auto}

/* ---------- formulaire public de don ---------- */
.carte.formulaire{border-left:4px solid var(--trait)}
.carte.formulaire.ouverte{border-left-color:var(--stable)}
.carte.formulaire .ligne-f{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.carte.formulaire .ligne-f > div{flex:1;min-width:240px}
.carte.formulaire .sous-f{font-size:13px;color:var(--texte-2);margin:0;max-width:70ch}
.carte.formulaire .lien-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.carte.formulaire .lien-f input{flex:1;min-width:220px;font-family:var(--mono);font-size:12.5px;background:var(--surface)}
.carte.formulaire .lien-f .btn{flex:0 0 auto}
@media(max-width:600px){.carte.formulaire .lien-f .btn{width:100%}}

/* ---------- appels aux dons ----------
   Une campagne, c'est une liste de matériel nommée, ouverte le
   temps d'un appel puis close. Ce qu'on doit voir sans lire :
   celles qui sont ouvertes en ce moment, et ce qu'elles
   demandent. Le liseré le dit — vert ouvert, gris clos. */
.camp{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--trait);
  border-radius:10px;padding:17px 19px;margin-bottom:13px}
.camp.ouverte{border-left-color:var(--stable);box-shadow:0 2px 14px rgba(6,43,99,.07)}
.camp.essai{border-left-color:var(--ambre)}
.camp .tc{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.camp .tc h3{font-family:var(--display);font-weight:700;font-size:17.5px;line-height:1.25;
  color:var(--encre);margin:0;flex:1;min-width:200px}
.camp .motif{font-size:13px;color:var(--texte-2);line-height:1.5;margin:0 0 11px;max-width:74ch}
.camp .arts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.camp .arts span{font-size:12.5px;background:#DFF0E9;color:#1E5C46;border-radius:6px;padding:4px 9px;line-height:1.3}
.camp .arts span i{font-style:normal;opacity:.7}
.camp .arts .libre{background:var(--fond-2,#F1F3F6);color:var(--texte-2)}
.camp .quand{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texte-2);margin-bottom:11px}
.camp .recu{font-size:13px;color:var(--texte-2);margin:0 0 11px}
.camp .recu b{font-family:var(--display);font-size:16px;color:var(--encre)}
.camp .actions{margin-top:2px}
.camp .lien-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.camp .lien-f input{flex:1;min-width:200px;font-family:var(--mono);font-size:12.5px;background:var(--surface)}
@media(max-width:600px){.camp .lien-f .btn,.camp .actions .btn{width:100%}}

/* Le matériel demandé se construit à l'écran : c'est une liste
   qu'on allonge, pas un formulaire qu'on remplit. Chaque ligne
   porte son rang, sa désignation et ce qu'on en précise — et
   c'est elle qui deviendra la case à cocher du donateur. */
.arts-saisie{display:flex;flex-direction:column;gap:9px}
.art-l{display:flex;gap:11px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--trait);border-radius:9px;padding:11px 12px}
.art-l:focus-within{border-color:var(--encre-2);background:#fff;box-shadow:0 1px 8px rgba(6,43,99,.07)}
.art-l .n{font-family:var(--mono);font-size:11px;color:var(--encre-2);background:var(--cobalt-clair);
  width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:0 0 23px;margin-top:8px}
.art-l .ch{flex:1;min-width:0;display:grid;gap:7px}
.art-l .ch input{background:#fff}
.art-l .ch input.prec{font-size:13.5px;border-style:dashed;color:var(--texte-2)}
.art-l .ch input.prec:focus{color:var(--texte);border-style:solid}
.art-l button.sup{background:none;border:0;color:var(--texte-2);opacity:.4;cursor:pointer;
  font-size:15px;line-height:1;padding:11px 3px;border-radius:6px}
.art-l button.sup:hover{opacity:1;color:var(--braise);background:#FDF0EC}

.art-vide{border:1px dashed var(--trait);border-radius:9px;padding:18px 16px;text-align:center;
  font-size:13px;line-height:1.5;color:var(--texte-2);background:var(--surface)}
.art-plus{width:100%;border:1px dashed var(--encre-2);background:#fff;color:var(--encre-2);
  border-radius:9px;padding:11px;margin-top:9px;font-family:inherit;font-size:14px;cursor:pointer}
.art-plus:hover{background:var(--cobalt-clair)}
.art-cpt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--texte-2);margin-top:11px}
.art-cpt b{font-family:var(--display);font-size:13px;letter-spacing:0;text-transform:none;color:var(--encre)}
/* Les désignations courantes s'ajoutent d'un clic : la plupart
   des appels reprennent les mêmes dispositifs. Celle qui est déjà
   dans la liste s'efface au lieu de se proposer deux fois. */
.sugg button.pris{opacity:.4;pointer-events:none;text-decoration:line-through}

/* ---------- relancer un appel ----------
   Relancer, ce n'est pas recopier : c'est décider, matériel par
   matériel, ce qu'on redemande. La ligne dit donc ce que le
   précédent appel a rapporté — combien de professionnels l'ont
   proposé, et combien d'unités. Un matériel que personne n'avait
   ne se redemande pas de la même façon qu'un matériel qui a
   trouvé preneur. */
.bilan{display:flex;flex-direction:column;gap:8px}
.bil{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--trait);
  border-radius:9px;padding:11px 12px;cursor:pointer;background:#fff}
.bil:hover{border-color:var(--encre-2)}
.bil.on{border-color:var(--stable);background:#F7FCFA}
.bil input{width:18px;height:18px;flex:0 0 18px;margin-top:2px;accent-color:var(--encre-2)}
.bil .bn{flex:1;min-width:0;font-size:14px;line-height:1.35;color:var(--encre)}
.bil .bn i{display:block;font-style:normal;color:var(--texte-2);font-size:12.5px;margin-top:2px}
.bil .bq{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#1E5C46;
  background:#DFF0E9;border-radius:5px;padding:5px 8px;white-space:nowrap;flex:0 0 auto;line-height:1.25}
.bil .bq.nul{background:var(--fond-2,#F1F3F6);color:var(--texte-2)}
@media(max-width:560px){.bil{flex-wrap:wrap}.bil .bq{margin-left:29px}}
/* Le rappel de ce dont un appel est la suite, sur sa carte. */
.camp .suite-c{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--encre-2);background:var(--cobalt-clair);border-radius:5px;padding:4px 8px;
  display:inline-block;margin-bottom:9px}

/* L'aperçu. Ce qu'on fabrique ici n'est pas un formulaire de
   saisie, c'est une page que quelqu'un lira sur son téléphone :
   on la montre pendant qu'on l'écrit, plutôt que de la découvrir
   après l'avoir diffusée. Sur un écran large elle se tient à
   côté et suit le défilement ; sur un téléphone elle se pose en
   bas, juste avant le bouton qui crée l'appel — le dernier coup
   d'œil avant de publier. */
.camp-grille{display:grid;gap:20px;align-items:start}
@media(min-width:800px){
  .camp-grille{grid-template-columns:minmax(0,1fr) 288px}
  .camp-grille .apercu{position:sticky;top:0}
}
.apercu{background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:13px}
.apercu .ap-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texte-2);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.apercu .ap-t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--stable);flex:0 0 6px}
.ap-ecran{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:15px 14px;
  box-shadow:0 1px 10px rgba(6,43,99,.06)}
.ap-ecran .ap-h{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.25;color:var(--encre)}
.ap-ecran .ap-h.gris{color:var(--texte-2);font-weight:400;font-style:italic}
.ap-ecran .ap-c{font-size:12px;line-height:1.45;background:#FCF3E4;border:1px solid #E9D3A6;
  color:#8A5D12;border-radius:6px;padding:8px 9px;margin-top:10px;white-space:pre-line}
.ap-ecran .ap-k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);margin:14px 0 7px}
.ap-ecran .ap-i{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--trait);
  border-radius:7px;padding:8px 9px;margin-bottom:6px;font-size:12.5px;line-height:1.35}
.ap-ecran .ap-i .b{width:14px;height:14px;border:1.5px solid var(--encre-2);border-radius:3px;flex:0 0 14px;margin-top:1px}
.ap-ecran .ap-i .p{display:block;color:var(--texte-2);font-size:11.5px;margin-top:2px}
.ap-ecran .ap-vide{font-size:12px;color:var(--texte-2);font-style:italic;line-height:1.45}
.ap-ecran .ap-n{font-size:11.5px;color:var(--texte-2);line-height:1.4;margin-top:10px;
  border-top:1px dashed var(--trait);padding-top:8px}

/* Accepter le hors-liste est une décision, pas une option : elle
   se pose comme une carte à cocher, et se voit quand elle est
   prise. */
.bascule{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--trait);
  border-radius:9px;padding:12px 13px;margin-top:14px;cursor:pointer;background:#fff}
.bascule:hover{border-color:var(--encre-2)}
.bascule.on{border-color:var(--ambre);background:#FFFBEF}
.bascule input{width:19px;height:19px;flex:0 0 19px;margin-top:2px;accent-color:var(--encre-2)}
.bascule .t{font-size:13.5px;line-height:1.45}
.bascule .t .d{display:block;color:var(--texte-2);font-size:12.5px;margin-top:3px}

/* ---------- choix d'un module dans un onglet ----------
   Un onglet qui porte deux métiers distincts ne les empile pas :
   il fait choisir. On entre dans l'un ou dans l'autre, et on
   revient au palier par le lien du haut. */
.modules{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));margin-bottom:20px}
.module{background:var(--carte);border:1px solid var(--trait);border-left:5px solid var(--encre-2);
  border-radius:10px;padding:20px 22px;text-align:left;font-family:inherit;color:inherit;
  cursor:pointer;display:flex;flex-direction:column;gap:10px}
.module:hover{border-color:var(--encre-2);border-left-color:var(--encre);box-shadow:0 2px 16px rgba(6,43,99,.11)}
.module .titre-m{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.22;color:var(--encre)}
.module .sous-m{font-size:13.5px;line-height:1.5;color:var(--texte-2);margin:0}
.module .chiffres{display:flex;gap:18px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.module .chiffres div{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--texte-2)}
.module .chiffres strong{display:block;font-family:var(--display);font-size:20px;letter-spacing:0;
  text-transform:none;color:var(--encre);line-height:1.1}
.module .entrer{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--encre-2)}
/* Deux moitiés dans une même carte — les collectes tenues, puis
   les dons déclarés. Le titre de section les sépare franchement :
   sans lui, on lirait la seconde liste comme la suite de la
   première, et ce ne sont pas les mêmes faits. */
.titre-s{border-top:1px solid var(--trait);padding-top:16px;margin-bottom:14px}
.titre-s:first-child{border-top:0;padding-top:0}
.titre-s .k{font-family:var(--display);font-weight:700;font-size:17px;color:var(--encre);
  letter-spacing:-.005em;text-transform:none;margin-bottom:3px}
.titre-s .sous-f{margin:0;font-size:13.5px;line-height:1.5;color:var(--texte-2);max-width:72ch}
/* --- Le pas en arrière ----------------------------------------
   Entrer dans un sous-écran est facile ; en ressortir doit l'être
   autant. Le retour n'est donc pas une mention en petits capitales
   qu'on devine, mais un bouton plein : une flèche cerclée qu'on
   repère du coin de l'œil, le nom de l'écran où l'on retombe, et
   une cible assez large pour le pouce. Une seule allure pour tous
   les retours du cockpit — matériel, renfort, orientation, recueil,
   rapports — pour qu'on n'ait à l'apprendre qu'une fois. */
.retour-m,.retour-r,.retour-f{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--carte);border:1.5px solid var(--encre-2);border-radius:24px;
  color:var(--encre-2);font-family:var(--corps);font-size:14.5px;font-weight:600;
  letter-spacing:0;text-transform:none;line-height:1.25;text-align:left;
  cursor:pointer;padding:8px 18px 8px 9px;min-height:44px;margin:0 0 14px}
.retour-m::before,.retour-r::before,.retour-f::before{
  content:"←";flex:0 0 27px;width:27px;height:27px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--cobalt-clair);color:var(--encre-2);
  font-size:17px;font-weight:700;line-height:1}
.retour-m:hover,.retour-r:hover,.retour-f:hover{
  background:var(--encre-2);border-color:var(--encre-2);color:#fff;text-decoration:none}
.retour-m:hover::before,.retour-r:hover::before,.retour-f:hover::before{
  background:#fff;color:var(--encre-2)}
.retour-m:focus-visible,.retour-r:focus-visible,.retour-f:focus-visible{
  outline:3px solid var(--ambre);outline-offset:2px}
@media print{.modules,.retour-m,.retour-r{display:none}}

.don .ident .n .src-f,.stock .nom .src-f{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--cobalt-clair);color:var(--encre-2);border-radius:4px;padding:2px 6px;
  margin-left:7px;vertical-align:2px;font-weight:400;white-space:nowrap;
}
.don .ident .n .src-f.neuf,.stock .nom .src-f.neuf{background:#FCF0DA;color:#8A5D12}
.don .ident .n .src-f.camp{background:#DFF0E9;color:#1E5C46;text-transform:none;letter-spacing:.02em;font-size:10px}
.don .ident .n .src-f.saisie,.stock .nom .src-f.saisie{background:var(--fond-2,#F1F3F6);color:var(--texte-2)}
/* La même étiquette, sur le nom d'une collecte : elle dit qu'un
   lien de saisie court dehors et que des lignes peuvent arriver
   sans que personne du copil ne les tape. */
.pc .tete .id .n .src-f{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:#DFF0E9;color:#1E5C46;border-radius:4px;padding:2px 6px;margin-left:8px;
  vertical-align:2px;font-weight:400;white-space:nowrap}

.don .declaration{border:1px solid var(--trait);border-left:3px solid var(--encre-2);border-radius:0 8px 8px 0;padding:13px 15px;margin-bottom:14px;background:#FCFDFF}
.don .declaration .dt{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--encre-2);margin-bottom:9px}
.don .declaration .dc{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));font-size:13.5px;margin-bottom:11px}
.don .declaration .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.don .declaration table.dl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:11px}
.don .declaration table.dl th{padding:6px 8px;font-size:9.5px}
.don .declaration table.dl td{padding:6px 8px;border-bottom:1px solid var(--trait)}
.don .declaration .dn{font-size:13.5px;margin-bottom:11px;white-space:pre-line}
.don .declaration .de{font-size:12.5px;background:#F1F8F5;border:1px solid #BEDCCE;color:#1E5C46;border-radius:6px;padding:9px 11px}

/* Le renfort envisagé se coche depuis la fiche du volontaire :
   c'est ce qui bouge le plus souvent, au fil des appels. Mêmes
   étiquettes cochables que les tâches de la collecte. */
/* Les étiquettes cochables ne tiennent pas dans un <label> : il
   renverrait tous les clics vers son premier bouton. Elles vivent
   donc dans un <div>, qui reprend ici l'intitulé du formulaire. */
.don .detail .form > div > .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:4px}
.don .taches{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.don .taches button{font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--texte-2);
  border:1px solid var(--trait);border-radius:14px;padding:6px 11px;cursor:pointer;min-height:34px}
.don .taches button:hover{border-color:var(--encre-2);color:var(--encre-2)}
.don .taches button.on{background:var(--cobalt-clair);border-color:var(--encre-2);color:var(--encre);font-weight:600}

.stocks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));margin-bottom:20px}
.stock{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--ambre);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:9px}
.stock.confirme{border-top-color:var(--stable)}
.stock.ecarte{border-top-color:var(--trait);background:#FAFBFD}
.stock .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;color:var(--encre)}
.stock .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.stock .bl{font-size:13.5px;line-height:1.45}
.stock .horaires{white-space:pre-line;font-size:13.5px;line-height:1.45}
.stock .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:8px 10px}
/* Ce que le médecin a dit en plus ne peut pas se lire comme une
   ligne de plus : c'est ce qui fait rappeler, ou ne pas rappeler.
   Il se signale — pastille, gras, filet de braise — et se voit
   avant le reste de la fiche. */
.stock .precise{display:flex;gap:9px;align-items:flex-start;background:#FBEDE9;
  border-left:3px solid var(--braise);border-radius:0 7px 7px 0;padding:9px 11px;
  font-size:13.5px;line-height:1.45;font-weight:600;color:#8A2A1A;white-space:pre-line}
.stock .precise .ic{flex:none;width:19px;height:19px;border-radius:50%;background:var(--braise);
  color:#fff;font-family:var(--display);font-weight:700;font-size:13px;line-height:19px;
  text-align:center;margin-top:1px}
.stock .precise .k{color:var(--braise);opacity:.85;font-weight:400}
.stock .liens{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.stock .liens a{display:inline-flex;align-items:center;min-height:44px;padding:9px 13px;border-radius:8px;text-decoration:none;font-size:14px}
.stock .liens a.tel{background:var(--encre-2);color:#fff;font-weight:600;font-family:var(--display)}
/* Le second numéro se compose après le premier : il se voit, mais
   en creux — jamais deux boutons pleins qui se disputent le doigt. */
.stock .liens a.tel.second{background:var(--carte);color:var(--encre-2);border:1px solid var(--encre-2)}
.stock .liens a.tel{flex-direction:column;align-items:flex-start;justify-content:center}
.stock .liens a.tel small{font-family:var(--corps);font-weight:400;font-size:11px;opacity:.85;line-height:1.2}
.stock .liens a.adr{background:var(--cobalt-clair);color:var(--encre-2);font-size:13px}
.stock .oriente{font-family:var(--mono);font-size:11px;color:var(--stable)}
/* La tête de fiche : le nom, où il exerce, sa réponse. Les deux
   lignes du dessous ne s'écrivent que si elles ont de quoi. */
.stock .tete-m{display:flex;flex-direction:column;gap:3px}
.stock .lieu-m{font-size:13px;color:var(--texte-2);line-height:1.35}
.stock .etiq-m{margin-top:4px}
/* Modifier et retirer, au pied de la fiche, derrière un filet :
   ce sont des gestes de tenue de registre, pas des actions de
   crise — ils ne se disputent pas la place avec le bouton d'appel. */
.stock .pied-m{display:flex;gap:7px;margin-top:2px;padding-top:11px;border-top:1px solid var(--trait)}
.stock .retirer{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-size:12.5px;padding:7px 12px;cursor:pointer;min-height:36px;transition:border-color .15s,color .15s}
.stock .retirer:hover{border-color:var(--encre-2);color:var(--encre-2)}
.stock .retirer.sup:hover{border-color:var(--braise);color:var(--braise)}
/* Tâches de la collecte : des cases à cocher qui se lisent comme
   des étiquettes, cochables d'un doigt depuis la fiche. */
.stock .taches{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.stock .taches button{font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--texte-2);
  border:1px solid var(--trait);border-radius:14px;padding:6px 11px;cursor:pointer;min-height:34px}
.stock .taches button:hover{border-color:var(--encre-2);color:var(--encre-2)}
.stock .taches button.on{background:var(--cobalt-clair);border-color:var(--encre-2);color:var(--encre);font-weight:600}
.stock label.bl select{margin-top:2px}

/* ---------- pool de volontaires ----------
   Une liste, pas une grille de cartes : un volontaire tient sur une
   ligne — qui il est, ce qu'il peut faire — et on parcourt vingt
   noms d'un regard au lieu de faire défiler vingt vignettes. Ce qui
   a été recueilli en plus vient sous le nom, en clair. */
.pool{list-style:none;margin:0 0 20px;padding:0;background:var(--carte);
  border:1px solid var(--trait);border-radius:10px;overflow:hidden}
.pool li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
  padding:13px 16px;border-bottom:1px solid var(--trait)}
.pool li:last-child{border-bottom:none}
.pool li:nth-child(even){background:var(--fond-2,#F9FAFC)}
.pool .qui{flex:1 1 200px;min-width:0}
.pool .qui .n{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--encre);display:block}
.pool .qui .d{font-size:12.5px;color:var(--texte-2);line-height:1.35}
.pool .fait{flex:2 1 260px;display:flex;flex-wrap:wrap;gap:5px}
.pool .fait span{font-size:12px;background:var(--cobalt-clair);color:var(--encre-2);
  border-radius:12px;padding:3px 9px;line-height:1.4}
.pool .fait .rien{background:none;color:var(--texte-2);padding:3px 0;font-style:italic}
/* Le numéro se compose d'un doigt depuis la liste : c'est ce qu'on
   vient y chercher le jour de l'enlèvement. */
