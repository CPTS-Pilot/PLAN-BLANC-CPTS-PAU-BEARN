}

/* --- Module 1 : les procédures en vigueur ------------------
   Deux procédures, et deux seulement. Elles se distinguent par un
   seul point — d'où part la demande — et tout le reste en découle :
   qui a le consommable en main, qui fait venir le pied à perfusion,
   qui rappelle qui à la fin. C'est pour cette raison qu'elles ne
   sont pas fondues en un texte unique : devant un téléphone, on
   choisit d'abord la bonne, puis on la suit.

   Leur contenu est plus haut, avec les autres amorces : ce sont
   désormais des pièces de l'état partagé, corrigeables depuis la
   page, et non plus des constantes du fichier. Ce qui est écrit
   ici ne fait que les afficher. */

/* L'état fait foi. L'amorce ne sert qu'au premier chargement et de
   filet si la rubrique arrivait vide d'un poste plus ancien. */
const lesProc = () => Array.isArray(etat.procedures) && etat.procedures.length
  ? etat.procedures : PROC_REHYD;
const procDe = id => lesProc().find(p => p.id === id);

/* null = la liste des deux procédures ; un identifiant = le déroulé
   de celle-là. Ouvrir une procédure et revenir à la liste ne change
   pas de module : on reste dans « Procédure ». */
let procOuverte = null;
function ouvrirProc(id){ procOuverte = id; rendre(); window.scrollTo(0,0); }

function carteProcedure(){
  if(brouillonProc) return editeurProc();
  return procOuverte ? derouleProc(procDe(procOuverte)) : listeProc();
}

/* --- Modifier une procédure -------------------------------
   Une procédure change dans la vraie vie : un numéro, un délai, un
   prestataire, une branche qu'on avait mal lue. Elle doit pouvoir
   changer ici sans que personne n'ouvre le fichier.

   L'écran d'édition est le déroulé lui-même, avec des champs à la
   place du texte : on modifie là où on lisait, dans le même ordre,
   et rien n'est caché derrière un onglet. Une étape porte quatre
   champs, et deux de plus par réponse quand elle pose une question.
   Il n'y a pas d'autre grammaire à apprendre.

   Le brouillon est une copie : tant qu'on n'a pas enregistré, la
   procédure affichée aux autres postes ne bouge pas. Et comme un
   champ qu'on retape ne doit pas s'effacer quand on ajoute une
   étape plus bas, toute action de structure commence par ramasser
   ce qui est saisi à l'écran. */
let brouillonProc = null;

function modifierProc(id){
  const p = procDe(id);
  if(!p) return;
  brouillonProc = JSON.parse(JSON.stringify(p));
  rendre(); window.scrollTo(0,0);
}

function quitterEdition(){ brouillonProc = null; rendre(); window.scrollTo(0,0); }

/* Ramasse ce qui est à l'écran. Appelée avant chaque ajout, retrait
   ou déplacement : sans elle, la saisie en cours partirait avec le
   rendu suivant. */
function lireChampsProc(){
  const b = brouillonProc;
  if(!b) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  /* Un champ facultatif laissé vide s'efface au lieu de s'écrire
     vide : sans ça, chaque enregistrement épaissirait la rubrique
     de clés qui ne disent rien, et deux versions identiques ne se
     ressembleraient plus. */
  const pose = (o, k, val) => { if(val) o[k] = val; else delete o[k]; };
  ['nom','quand','materiel','role','appel'].forEach(k => {
    const el = document.getElementById('pe-' + k);
    if(el) b[k] = el.value.trim();
  });
  pose(b, 'appelNote', v('pe-appelNote'));
  b.etapes.forEach((e, i) => {
    e.qui  = v(`pe-${i}-qui`);
    e.t    = v(`pe-${i}-t`);
    e.d    = v(`pe-${i}-d`);
    pose(e, 'note', v(`pe-${i}-note`));
    /* C'est le modèle qui dit si l'étape pose une question, pas la
       case à cocher : quand on la coche, elle a déjà changé d'état
       et on la lirait à contretemps. La case ne fait qu'appeler
       basculerQuestionProc, qui tranche. */
    if(e.q !== undefined){
      e.q = v(`pe-${i}-q`) || "Quelle est la réponse ?";
      ['oui','non'].forEach(r => {
        e[r] = e[r] || {};
        e[r].t = v(`pe-${i}-${r}-t`);
        e[r].d = v(`pe-${i}-${r}-d`);
        /* Une issue qui parle d'une étape renvoie à la suite du
           déroulé ; sinon, c'est que la branche s'arrête là. Rien à
           choisir dans un menu : on écrit ce qu'on dirait. */
        const iss = v(`pe-${i}-${r}-issue`);
        delete e[r].fin; delete e[r].vers;
        if(iss) (/étape\s*\d/i.test(iss) ? (e[r].vers = iss) : (e[r].fin = iss));
      });
      const st = v(`pe-${i}-non-suite-t`), sd = v(`pe-${i}-non-suite-d`);
      if(st || sd) e.non.suite = {t:st, d:sd}; else delete e.non.suite;
    }
  });
}

function toucheProc(f){ lireChampsProc(); f(brouillonProc); rendre(); }
const ajouterEtapeProc = i => toucheProc(b =>
  b.etapes.splice(i, 0, {qui:'', t:'', d:''}));
const retirerEtapeProc = i => toucheProc(b => b.etapes.splice(i, 1));
const bougerEtapeProc = (i, d) => toucheProc(b => {
  const j = i + d;
  if(j < 0 || j >= b.etapes.length) return;
  b.etapes.splice(j, 0, b.etapes.splice(i, 1)[0]);
});
const basculerQuestionProc = i => toucheProc(b => {
  const e = b.etapes[i];
  if(e.q === undefined){
    e.q = "Quelle est la réponse ?";
    e.oui = {t:'', d:'', fin:"La procédure s'arrête ici."};
    e.non = {t:'', d:''};
  } else { delete e.q; delete e.oui; delete e.non; }
});

async function enregistrerProc(){
  lireChampsProc();
  const b = brouillonProc;
  if(!b.nom){ toast("La procédure a besoin d'un nom"); return; }
  b.etapes = b.etapes.filter(e => e.t || e.d || e.qui);
  const l = Array.isArray(etat.procedures) && etat.procedures.length
    ? etat.procedures : JSON.parse(JSON.stringify(PROC_REHYD));
  const i = l.findIndex(x => x.id === b.id);
  if(i === -1) l.push(b); else l[i] = b;
  etat.procedures = l;
  /* Règle du cockpit : ce qui se décide quelque part se consigne en
     main courante, en plus de sa rubrique. Une procédure de soins
     qui bouge est exactement ce qu'on doit pouvoir retrouver plus
     tard, avec sa date et le nom de qui l'a reprise. */
  poserEnCourante('mcr-proc-' + b.id, {
    type:'Réhydratation', date: aujourdhui(), source:'',
    evenement:`Procédure « ${b.nom} » reprise — ${b.etapes.length} étape${b.etapes.length > 1 ? 's' : ''}.`,
    suite:"Consultable dans l'espace « Réhydratation à domicile », module « Procédures en vigueur »."
  });
  await sauver();
  procOuverte = b.id;
  brouillonProc = null;
  rendre(); window.scrollTo(0,0);
  toast("Procédure enregistrée, et reprise en main courante");
}

function editeurProc(){
  const b = brouillonProc;
  const ch = (id, lib, val, aide) => `<label class="large"><span class="k">${esc(lib)}</span>
    <input id="${id}" value="${esc(val || '')}">${aide ? `<div class="aide">${esc(aide)}</div>` : ''}</label>`;
  const za = (id, lib, val, aide) => `<label class="large"><span class="k">${esc(lib)}</span>
    <textarea id="${id}" style="min-height:62px">${esc(val || '')}</textarea>${
      aide ? `<div class="aide">${esc(aide)}</div>` : ''}</label>`;

  return `<button class="retour-m" onclick="quitterEdition()">Abandonner les modifications</button>
  <h2>Modifier « ${esc(b.nom)} »</h2>
  <p class="sous-h">Les champs sont dans l'ordre du déroulé : on corrige là où on lisait. Rien n'est enregistré tant qu'on n'a pas appuyé sur « Enregistrer » en bas — et une étape laissée entièrement vide se retire d'elle-même.</p>

  <div class="pr-actes pr-actes-fixe">
    <button class="btn" onclick="enregistrerProc()">Enregistrer la procédure</button>
    <button class="btn sec" onclick="quitterEdition()">Annuler</button>
  </div>

  <div class="carte pe-bloc">
    <h3 class="pe-t">L'en-tête</h3>
    <div class="form">
      ${ch('pe-nom', "Nom de la procédure", b.nom)}
      ${za('pe-quand', "Quand l'utiliser", sansBalises(b.quand),
        "La phrase qui permet de choisir entre les deux procédures : d'où part la demande.")}
      ${za('pe-materiel', "Le matériel", sansBalises(b.materiel),
        "D'où vient le matériel, qui le livre, et en combien de temps.")}
      ${za('pe-role', "Le rôle de la CPTS", b.role)}
      ${ch('pe-appel', "Numéro à appeler", b.appel)}
      ${ch('pe-appelNote', "Réserve sur ce numéro (facultatif)", b.appelNote,
        "S'affiche en petit sous le numéro. À vider dès que le numéro est confirmé.")}
    </div>
  </div>

  ${b.etapes.map((e, i) => etapeEditeur(e, i, b.etapes.length, ch, za)).join('')}

  <div class="pe-ajout">
    <button class="btn sec" onclick="ajouterEtapeProc(${b.etapes.length})">+ Ajouter une étape à la fin</button>
  </div>

  <div class="pr-actes" style="margin:18px 0 0">
    <button class="btn" onclick="enregistrerProc()">Enregistrer la procédure</button>
    <button class="btn sec" onclick="quitterEdition()">Annuler</button>
  </div>`;
}

function etapeEditeur(e, i, n, ch, za){
  const pose = e.q !== undefined;
  const issue = r => (e[r] && (e[r].fin || e[r].vers)) || '';
  return `<div class="carte pe-bloc">
    <div class="pe-haut">
      <h3 class="pe-t">Étape ${i + 1}</h3>
      <div class="pe-outils">
        <button class="pe-o" title="Monter" onclick="bougerEtapeProc(${i},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="pe-o" title="Descendre" onclick="bougerEtapeProc(${i},1)" ${i === n - 1 ? 'disabled' : ''}>↓</button>
        <button class="pe-o" title="Insérer une étape juste après" onclick="ajouterEtapeProc(${i + 1})">+</button>
        <button class="pe-o ret" title="Retirer cette étape" onclick="retirerEtapeProc(${i})">×</button>
      </div>
    </div>
    <div class="form">
      ${ch(`pe-${i}-qui`, "Qui agit", e.qui, "Médecin, CPTS, SOS Médecins, IDEL, Prestataire…")}
      ${ch(`pe-${i}-t`, "Ce qu'on fait", e.t, "En une ligne : c'est elle qui part sur la fiche PDF.")}
      ${za(`pe-${i}-d`, "Le détail", e.d, "Ce qu'on lit à l'écran quand on a le temps. Ne part pas sur la fiche PDF.")}
      ${ch(`pe-${i}-note`, "Remarque en jaune (facultatif)", e.note,
        "Un point que la procédure ne tranche pas encore. S'affiche en encadré jaune.")}
    </div>

    <label class="pe-pose"><input type="checkbox" id="pe-${i}-pose" ${pose ? 'checked' : ''}
      onchange="basculerQuestionProc(${i})"> <span>Cette étape pose une question (oui / non)</span></label>

    ${pose ? `<div class="pe-q">
      ${ch(`pe-${i}-q`, "La question posée", e.q, "Elle s'affiche en gras sous l'étape.")}
      <div class="pe-rep oui">
        <div class="pe-r">Si OUI</div>
        <div class="form">
          ${ch(`pe-${i}-oui-t`, "Ce qu'on fait", e.oui.t)}
          ${za(`pe-${i}-oui-d`, "Le détail", e.oui.d)}
          ${ch(`pe-${i}-oui-issue`, "Ce que devient la demande", issue('oui'),
            "Écrire « On continue à l'étape 5 » pour renvoyer à la suite, ou par exemple « La procédure s'arrête ici » si la branche se termine.")}
        </div>
      </div>
      <div class="pe-rep non">
        <div class="pe-r">Si NON</div>
        <div class="form">
          ${ch(`pe-${i}-non-t`, "Ce qu'on fait", e.non.t)}
          ${za(`pe-${i}-non-d`, "Le détail", e.non.d)}
          ${ch(`pe-${i}-non-issue`, "Ce que devient la demande", issue('non'),
            "Même règle : « On continue à l'étape 6 », ou ce qui met fin à la branche.")}
          ${ch(`pe-${i}-non-suite-t`, "Et si ça ne marche toujours pas (facultatif)",
            e.non.suite ? e.non.suite.t : '', "Le rattrapage d'un « non » qui rebondit avant de sortir.")}
          ${za(`pe-${i}-non-suite-d`, "Le détail de ce rattrapage", e.non.suite ? e.non.suite.d : '')}
        </div>
      </div>
    </div>` : ''}
  </div>`;
}

/* La liste : ce qui doit suffire à choisir sans ouvrir. La question
   posée est toujours la même — d'où part la demande. */
function listeProc(){
  const L = lesProc();
  return `<h2>Procédures en vigueur <span class="cpt-h">${L.length} procédure${L.length > 1 ? 's' : ''}</span></h2>
  <p class="sous-h">Deux procédures de réhydratation à domicile sont en vigueur sur le territoire. Elles se choisissent sur un seul critère : <strong>d'où part la demande</strong>. Le reste en découle — qui a le matériel en main, qui le fait venir, et qui rappelle qui à la fin. Ouvrir une procédure, c'est en avoir le déroulé complet, étape par étape, avec ce qu'on fait à chaque réponse.</p>
  <div class="pr-choix">
    ${L.map(p => `
      <button class="pr-b" onclick="ouvrirProc('${p.id}')">
        <div class="rang">${esc(p.rang)}</div>
        <div class="nom">${esc(p.nom)}</div>
        <div class="quand">${esc(p.quand)}</div>
        <div class="pied-b">
          <span>${p.etapes.length} étapes</span>
          <span>${p.etapes.filter(e => e.q).length} décisions</span>
        </div>
        <div class="entrer">Lire la procédure en détail →</div>
      </button>`).join('')}
  </div>
  <div class="barre-h" style="margin-top:14px">
    <button class="btn" onclick="pdfProc(lesProc().map(p => p.id))"
      title="Ouvre la boîte d'impression : choisir « Enregistrer au format PDF »">Télécharger les deux en PDF — 1 page chacune</button>
  </div>
  <div class="carte" style="margin-top:16px">
    <p style="font-size:13.5px;line-height:1.55;margin:0">Dans les deux cas, la CPTS n'est appelée qu'à une condition : <strong>qu'aucun cabinet infirmier ne suive déjà la personne</strong>. Si un cabinet IDEL est en place, la procédure s'arrête chez le médecin et la prise en charge se fait avec lui. Ce que la CPTS reçoit se note dans le module « Patients signalés / orientés », en initiales et sans élément clinique au-delà du motif.</p>
  </div>`;
}

/* Le déroulé. Une étape par bloc, dans l'ordre du schéma, et à
   chaque question les deux réponses en regard : ce qu'on fait si
   oui, ce qu'on fait si non. Rien n'est laissé implicite — une
   branche qui s'arrête le dit. */
function derouleProc(p){
  if(!p) return listeProc();
  return `<button class="retour-m" onclick="ouvrirProc(null)">Revenir aux deux procédures</button>
  <h2>${esc(p.nom)}</h2>
  <p class="sous-h">${esc(p.quand)}</p>
  <div class="pr-tete">
    <div class="rang">${esc(p.rang)} — réhydratation à domicile</div>
    <div class="l"><span class="k">Le matériel</span>${esc(p.materiel)}</div>
    <div class="l"><span class="k">Le rôle de la CPTS</span>${esc(p.role)}</div>
    <div class="l"><span class="k">Numéro à appeler</span><a href="${telLien(p.appel)}">${esc(p.appel)}</a>${
      p.appelNote ? ` — ${esc(p.appelNote)}` : ''}</div>
  </div>
  <div class="pr-actes">
    <button class="btn" onclick="pdfProc('${p.id}')"
      title="Ouvre la boîte d'impression : choisir « Enregistrer au format PDF »">Télécharger en PDF — 1 page</button>
    <button class="btn sec" onclick="modifierProc('${p.id}')">Modifier la procédure</button>
    <button class="btn sec" onclick="imprimer()">Imprimer le déroulé détaillé</button>
  </div>
  <div class="pr-flux">
    ${p.etapes.map((e,i) => (i ? '<div class="pr-fl">▼</div>' : '') + etapeProc(e, i + 1)).join('')}
  </div>
  <div class="pr-actes" style="margin:16px 0 0">
    <button class="btn sec" onclick="ouvrirProc(null)">Voir l'autre procédure</button>
  </div>`;
}

/* --- La fiche de synthèse, sur une page -------------------
   Le déroulé de l'écran ne s'imprime pas bien : il est écrit pour
   être lu assis, et il fait quatre feuilles. Celle-ci est écrite
   pour être tenue debout — l'intitulé de chaque étape, l'acteur
   qui agit, et les deux issues de chaque question. Rien de plus.

   Elle ne redit rien : les intitulés sont ceux du schéma, déjà
   courts parce qu'ils décrivent un geste. Ce qui saute, c'est
   l'explication — elle reste à l'écran, où on a le temps.

   Le passage par la boîte d'impression du navigateur est voulu :
   c'est là qu'on choisit « Enregistrer au format PDF », et c'est
   la seule façon de sortir un PDF sans embarquer une librairie
   dans un cockpit qui doit s'ouvrir hors ligne. */
const sansBalises = s => String(s || '').replace(/<[^>]+>/g, '');
const numEtape = s => (String(s || '').match(/\d+/) || [''])[0];

function feuilleProc(p){
  /* Les notes d'incertitude sont renvoyées en bas de page : elles
     comptent, mais elles ne doivent pas grossir une ligne d'étape. */
  const notes = [];
  p.etapes.forEach((e, i) => { if(e.note) notes.push({n:i + 1, txt:e.note}); });

  const issue = b =>
    b.fin  ? `<span class="f"> — ${esc(b.fin.replace(/\.$/, ''))}</span>` :
    b.vers ? `<span class="f"> → étape ${esc(numEtape(b.vers))}</span>` : '';

  const ligne = (e, n) => {
    const marque = e.note ? `<sup>${notes.findIndex(x => x.n === n) + 1}</sup>` : '';
    return `<div class="e">
      <div class="n">${n}</div>
      <div>
        <div class="qui">${esc(e.qui)}</div>
        <div class="t">${esc(e.t)}${marque}</div>
        ${e.q ? `<div class="b">
          <div class="r o">OUI</div><div class="v"><span class="o">${esc(sansBalises(e.oui.t))}</span>${issue(e.oui)}</div>
          <div class="r n">NON</div><div class="v"><span class="n">${esc(sansBalises(e.non.t))}</span>${issue(e.non)}${
            e.non.suite ? `<span class="s"> — ${esc(sansBalises(e.non.suite.t))} : ${
              esc(sansBalises(e.non.suite.d).replace(/\..*$/, ''))}.</span>` : ''}</div>
        </div>` : ''}
      </div>
    </div>`;
  };

  return `<div class="fp">
    <div class="ch">
      <span class="org">CPTS Pau Béarn — plan canicule</span>
      <span class="cr">Réhydratation à domicile · ${esc(p.rang)}</span>
    </div>
    <h1>${esc(p.nom)}</h1>
    <p class="st">${esc(sansBalises(p.quand))}</p>
    <div class="cadre">
      <div><span class="k">Quand appeler la CPTS</span>
        <span class="l">Seulement si <strong>aucun cabinet IDEL</strong> ne suit déjà la personne. Sinon, la procédure s'arrête chez le médecin.</span></div>
      <div><span class="k">Matériel</span><span class="l">${esc(sansBalises(p.materiel))}</span></div>
      <div><span class="k">Numéro CPTS</span><span class="tel">${esc(p.appel)}</span>${
        p.appelNote ? `<span class="l">${esc(p.appelNote)}</span>` : ''}</div>
    </div>
    ${p.etapes.map((e, i) => ligne(e, i + 1)).join('')}
    ${notes.length ? `<div class="nb">${notes.map((x, i) =>
      `<sup>${i + 1}</sup> Étape ${x.n} — ${esc(x.txt)}`).join('<br>')}</div>` : ''}
    <div class="pied">
      <span>Procédure arrêtée par la CPTS Pau Béarn. Le déroulé détaillé est dans le cockpit de crise, espace « Réhydratation à domicile ».</span>
      <span>Si rien n'aboutit : appel au 15.</span>
    </div>
  </div>`;
}

/* Une feuille ne se compose que le temps de sortir, et la page
   reprend son état juste après : un cockpit resté en mode
   impression parce qu'on a annulé la boîte de dialogue serait
   inutilisable, et personne ne saurait pourquoi. */
function pdfProc(ids){
  const l = (Array.isArray(ids) ? ids : [ids]).map(procDe).filter(Boolean);
  if(!l.length) return;
  const zone = document.getElementById('feuille-proc');
  zone.innerHTML = l.map(feuilleProc).join('');
  /* La marge de page du cockpit est confortable ; celle d'une fiche
     à tenir sur une feuille l'est moins. La règle ne vaut que le
     temps de cette impression, et repart avec elle. */
  const marge = document.createElement('style');
  marge.textContent = '@page{margin:9mm}';
  document.head.appendChild(marge);
  document.body.classList.add('impr-proc');

  let fini = false;
  const nettoyer = () => {
    if(fini) return;
    fini = true;
    document.body.classList.remove('impr-proc');
    marge.remove();
    zone.innerHTML = '';
    window.removeEventListener('afterprint', nettoyer);
  };
  window.addEventListener('afterprint', nettoyer);
  window.print();
  /* Tous les navigateurs n'émettent pas « afterprint » — quelques
     mobiles notamment. Ce filet remet la page d'aplomb sans quoi
     elle resterait blanche. */
  setTimeout(nettoyer, 1200);
}

/* Le bas d'une réponse dit toujours ce qu'elle devient : ou bien
   elle sort du circuit, ou bien elle rejoint la suite du déroulé.
   Une flèche verticale ne suffirait pas à le dire — elle ne montre
   pas laquelle des deux branches la traverse. */
function issueBranche(b){
  if(b.fin)  return `<div class="fin">${esc(b.fin)}</div>`;
  if(b.vers) return `<div class="fin vers">${esc(b.vers)}</div>`;
  return '';
}

function etapeProc(e, n){
  const branches = e.q ? `
    <div class="pr-br">
      <div class="pr-r oui"><div class="rep">Oui</div><div class="t">${esc(e.oui.t)}</div>
        <div class="d">${esc(e.oui.d)}</div>
        ${issueBranche(e.oui)}</div>
      <div class="pr-r non"><div class="rep">Non</div><div class="t">${esc(e.non.t)}</div>
        <div class="d">${esc(e.non.d)}</div>
        ${e.non.suite ? `<div class="suite"><div class="st">${esc(e.non.suite.t)}</div>
          <div class="sd">${esc(e.non.suite.d)}</div></div>` : ''}
        ${issueBranche(e.non)}</div>
    </div>` : '';
  return `<div class="pr-et${e.q ? ' q' : ''}">
    <div class="n">${n}</div>
    <div class="c">
      <span class="qui">${esc(e.qui)}</span>
      <div class="t">${esc(e.t)}</div>
      <div class="d">${esc(e.d)}</div>
      ${e.q ? `<div class="d"><strong>${esc(e.q)}</strong></div>` : ''}
      ${e.note ? `<div class="rq">${esc(e.note)}</div>` : ''}
    </div>
  </div>${branches}`;
}

/* --- Module 2 : les officines ----------------------------
   Le recensement, et la carte qui le rend lisible : c'est elle qui
   dit où le maillage est trop clair. */
function cartePharmacies(ph){
  const parts = ph.filter(p => p.statut === 'Partenaire').length;
  const contact = ph.filter(p => p.statut === 'Contactée').length;
  const aFaire = ph.filter(p => !p.statut || p.statut === 'À contacter').length;
  const pts = pointsPharmacies(ph);
  /* La liste se lit dans l'ordre où elle sert : celles qui délivrent
     d'abord, celles qu'il reste à appeler ensuite, celles qui ne
     participent pas en bas. Ce n'est pas l'ordre du formulaire, qui
     est celui d'un partenariat qui avance. */
  const PH_ORDRE = ['Partenaire','Contactée','À contacter','Ne participe pas'];
  const rang = p => { const i = PH_ORDRE.indexOf(p.statut); return i < 0 ? PH_ORDRE.length : i; };
  const rangees = [...ph].sort((a, b) => (rang(a) - rang(b))
    || String(a.commune||'').localeCompare(String(b.commune||''), 'fr')
    || String(a.nom||'').localeCompare(String(b.nom||''), 'fr'));

  return `<h2>Recensement des pharmacies partenaires
    <span class="cpt-h">${ph.length} officine${ph.length>1?'s':''} recensée${ph.length>1?'s':''}</span></h2>
  <p class="sous-h">Les officines du territoire prêtes à délivrer les solutions de réhydratation orale, ce qu'elles tiennent et qui y décroche. L'adresse renseignée pose la pharmacie sur la carte : c'est ce qui permet, pour une personne signalée, de dire quelle officine est la plus proche de chez elle.</p>
    <div class="compteurs" style="margin-bottom:16px">
      <div class="compteur"><div class="n">${parts}</div><div class="l">partenaires</div></div>
      <div class="compteur"><div class="n">${contact}</div><div class="l">contactées, réponse à venir</div></div>
      <div class="compteur"><div class="n">${aFaire}</div><div class="l">restent à appeler</div></div>
    </div>
    ${blocCarte('carte-pharmacies', pts, {
      titre:"Les officines sur le territoire",
      sous:"Chaque officine recensée dont l'adresse est renseignée. La couleur dit où en est le partenariat — c'est la carte qui montre les secteurs sans officine partenaire.",
      compte:"officines situées",
      legende:[
        {c:CARTO_PH['Partenaire'], l:"Partenaire", croix:true},
        {c:CARTO_PH['Contactée'], l:"Contactée", croix:true},
        {c:CARTO_PH['À contacter'], l:"À contacter", croix:true},
        {c:CARTO_PH['Ne participe pas'], l:"Ne participe pas", croix:true}
      ],
      alerte: alertePharmacies(pts),
      videSansFiche:"Aucune officine recensée pour l'instant. La première fiche enregistrée avec une adresse ouvre la carte.",
      videSansPoint:"Aucune adresse renseignée sur les officines recensées : la carte s'affichera dès qu'une fiche en portera une.",
      source:"Officines recensées par la CPTS Pau Béarn."
    })}
    <div class="barre-h">
      <span class="cpt-h">${parts} partenaire${parts>1?'s':''} sur ${ph.length}</span>
      ${ph.length ? `<button class="btn sec" onclick="exporterCSV('pharmacies')">Excel</button>` : ''}
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('pharmacies')">Ajouter une pharmacie</button>
    </div>
    ${ph.length ? `<div class="rh-l">${rangees.map(fichePharma).join('')}</div>`
      : `<p class="vide">Rien à afficher pour le moment. La première officine appelée ouvre le recensement.</p>`}`;
}

function fichePharma(p){
  const st = p.statut || 'À contacter';
  const cl = st === 'Partenaire' ? 'ok' : st === 'Ne participe pas' ? 'hors' : 'attente';
  const situable = nombreOuNul(p.lat) !== null && p.geoCle === cleGeo(p);
  return `<div class="rh-c ${cl}">
    <div class="haut">
      <div class="nom">${esc(p.nom || 'Officine sans nom')}</div>
      <span class="etiq ${PH_ET[st] || 'e-lancer'}">${esc(st)}</span>
    </div>
    ${p.adresse || p.commune ? `<div class="meta">${esc([p.adresse, p.commune].filter(Boolean).join(' · '))}${
      p.geoEchec && p.geoEchec === cleGeo(p) ? ` — <strong>adresse non retrouvée</strong>, à corriger` : ''}</div>` : ''}
    <div class="champs">
      ${p.interlocuteur || p.telInterlocuteur ? `<div><span class="k">Interlocuteur</span><span class="v">${
        esc(p.interlocuteur || 'Nom non renseigné')}${p.telInterlocuteur
          ? ` — <a class="tel" href="${esc(telLien(p.telInterlocuteur))}">${esc(p.telInterlocuteur)}</a>` : ''}</span></div>` : ''}
      ${p.horaires ? `<div><span class="k">Horaires</span><span class="v">${esc(p.horaires)}</span></div>` : ''}
      ${p.portage && p.portage !== 'À préciser' ? `<div><span class="k">Portage à domicile</span><span class="v">${esc(p.portage)}</span></div>` : ''}
      ${p.mail ? `<div><span class="k">Courriel</span><span class="v">${esc(p.mail)}</span></div>` : ''}
    </div>
    ${p.stock ? `<div class="meta"><span class="k">Tient à disposition</span>${esc(p.stock)}</div>` : ''}
    ${p.note ? `<div class="meta">${esc(p.note)}</div>` : ''}
    <div class="barre">
      <div class="actes">
        ${p.tel ? `<a class="btn" href="${esc(telLien(p.tel))}">Appeler l'officine — ${esc(p.tel)}</a>` : ''}
        ${situable ? `<button class="btn sec" onclick="situerPharma('${p.id}')">Situer sur la carte ci-dessus</button>` : ''}
        ${p.adresse ? `<a class="btn sec" href="${esc(lienCarte(p.adresse, p.commune))}" target="_blank" rel="noopener"
          title="Ouvre l'itinéraire vers l'officine dans votre application de cartes">Itinéraire ↗</a>` : ''}
      </div>
      <div class="fin">
        <button class="btn sec" onclick="ouvrirEdition('pharmacies','${p.id}')">Modifier</button>
        <button class="sup-m" title="Retirer du recensement" onclick="supprimer('pharmacies','${p.id}')">×</button>
      </div>
    </div>
  </div>`;
}

/* --- Module 3 : les personnes signalées ------------------
   Le recueil, la carte, et l'affectation du cabinet infirmier. La
   carte porte les deux populations : les personnes signalées, et
   autour d'elles les officines — c'est la seule façon de voir d'un
   coup d'œil qui est loin de tout. */
function cartePatients(pat, ph){
  const attente = pat.filter(enAttenteIdel).length;
  const poses = pat.filter(estAffecte).length;
  const faits = pat.filter(o => o.statut === 'Passage assuré').length;
  const rappels = pat.filter(o => enAttenteIdel(o) && o.idel === 'Non').length;

  /* Les officines qui peuvent délivrer, situées : c'est parmi elles
     qu'on cherche la plus proche. Celles qui ne participent pas ne
     sont pas du décor utile — elles ne montent pas sur la carte. */
  const autour = pointsPharmacies(ph.filter(p => p.statut !== 'Ne participe pas'), true);
  const vivier = autour.filter(p => p.statut === 'Partenaire' && p.lat !== null);
  const pts = pointsPatients(pat, vivier);
  /* Ce qui attend quelqu'un passe devant ce qui est réglé, et à
     égalité c'est le plus récent d'abord : un signalement du matin
     ne se lit pas après celui d'avant-hier. */
  const rang = o => { const i = RH_STATUTS.indexOf(o.statut); return i < 0 ? 0 : i; };
  const rangees = [...pat].sort((a, b) => (rang(a) - rang(b))
    || String(b.date||'').localeCompare(String(a.date||''))
    || String(b.heure||'').localeCompare(String(a.heure||'')));

  return `<h2>Patients signalés / orientés
    <span class="cpt-h">${pat.length} personne${pat.length>1?'s':''} au registre</span></h2>
  <p class="sous-h">Chaque personne signalée par un médecin du territoire, et ce qu'elle est devenue. Le registre est tenu en initiales, sans élément clinique au-delà du motif : la commune sert à situer la personne sur la carte et à trouver l'officine la plus proche, l'adresse exacte n'est jamais demandée.</p>
    <div class="compteurs" style="margin-bottom:16px">
      <div class="compteur"><div class="n">${pat.length}</div><div class="l">personnes signalées</div></div>
      <div class="compteur"><div class="n">${attente}</div><div class="l">sans cabinet IDEL désigné</div></div>
      <div class="compteur"><div class="n">${poses}</div><div class="l">cabinets IDEL désignés</div></div>
      <div class="compteur"><div class="n">${faits}</div><div class="l">passages assurés</div></div>
    </div>
    ${rappels ? `<div class="note">${rappels} personne${rappels>1?'s':''} pour ${rappels>1?'lesquelles':'laquelle'} aucun cabinet infirmier n'est identifié : c'est le médecin à l'origine de la demande qu'il faut rappeler — lui sait quel cabinet ${rappels>1?'les':'la'} suit.</div>` : ''}
    ${blocCarte('carte-patients', [...pts, ...autour], {
      titre:"Les personnes signalées, et les officines autour d'elles",
      sous:"Chaque personne est posée sur le bourg de sa commune, jamais à son adresse. Les croix sont les officines : toucher un point donne la pharmacie partenaire la plus proche, et de quoi désigner le cabinet infirmier sans quitter la carte.",
      compte:"personnes situées",
      legende:[
        {c:CARTO_PAT.attente, l:"Sans cabinet IDEL"},
        {c:CARTO_PAT.pose, l:"Cabinet IDEL désigné"},
        {c:CARTO_PAT.assure, l:"Passage assuré"},
        {c:CARTO_PAT.clos, l:"Sans suite"},
        {c:CARTO_PH['Partenaire'], l:"Pharmacie partenaire", croix:true},
        {c:CARTO_PH['Contactée'], l:"Officine contactée", croix:true},
        {c:CARTO_PH['À contacter'], l:"Officine à contacter", croix:true}
      ],
      alerte: alertePatients(pts),
      videSansFiche:"Aucune personne signalée pour l'instant. Le premier signalement d'un médecin ouvre la carte.",
      videSansPoint:"Aucune commune renseignée sur les personnes signalées : la carte s'affichera dès qu'une fiche en portera une.",
      source:"Personnes signalées par les médecins du territoire, situées à la commune."
    })}
    <div class="barre-h">
      <span class="cpt-h">${attente ? attente + ' en attente d\'un cabinet' : 'toutes affectées'}</span>
      ${pat.length ? `<button class="btn sec" onclick="exporterCSV('rehyd')">Excel</button>` : ''}
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('rehyd')">Signaler un patient</button>
    </div>
    ${pat.length ? `<div class="rh-l">${rangees.map(fichePatient).join('')}</div>`
      : `<p class="vide">Rien à afficher pour le moment. Le premier signalement ouvre le registre.</p>`}`;
}

function fichePatient(o){
  const st = o.statut || 'À orienter';
  const et = RH_ETAT(o);
  const cl = et === 'assure' || et === 'pose' ? 'ok' : et === 'clos' ? 'hors' : 'attente';
  const situable = nombreOuNul(o.lat) !== null && o.geoCle === cleGeoPat(o);

  /* Le cœur de la fiche : qui passe chez cette personne. Trois états
     seulement, et le troisième dit quoi faire plutôt que de
     constater qu'il manque quelque chose. */
  let idel;
  if(estAffecte(o)){
    idel = `<div class="rh-idel pose"><span class="k">Cabinet IDEL affecté</span>
      ${esc(o.idelNom)}${o.idelTel ? ` — <a href="${esc(telLien(o.idelTel))}">${esc(o.idelTel)}</a>` : ''}${
      o.idelLe ? ` · désigné le ${frdateL(o.idelLe)}${o.idelPar ? ` par ${esc(o.idelPar)}` : ''}` : ''}</div>`;
  }else if(o.idel === 'Non'){
    idel = `<div class="rh-idel rappel"><strong>Contacter le médecin à l'origine de la demande.</strong>
      Aucun cabinet infirmier n'est identifié pour cette personne : c'est le médecin qui a déclaré qui sait lequel la suit.${
      o.decNom ? ` ${esc(o.decNom)}` : ''}${o.decTel ? ` — <a href="${esc(telLien(o.decTel))}">${esc(o.decTel)}</a>` : ''}</div>`;
  }else{
    idel = `<div class="rh-idel"><span class="k">Cabinet IDEL</span>Pas encore renseigné — la question se pose au signalement, et se rattrape ici.</div>`;
  }

  return `<div class="rh-c ${cl}">
    <div class="haut">
      <div class="nom">${esc(o.nom || 'Initiales non renseignées')}${o.age ? ` <span class="a">${esc(o.age)} ans</span>` : ''}</div>
      <span class="etiq ${RH_ET[st] || 'e-attente'}">${esc(st)}</span>
    </div>
    <div class="meta">${esc([o.commune, o.motif].filter(Boolean).join(' · ')) || 'Ni commune ni motif renseignés'}${
      o.date ? ` · signalée le ${frdateL(o.date)}${o.heure ? ` à ${esc(o.heure)}` : ''}` : ''}</div>
    <div class="champs">
      ${o.tel ? `<div><span class="k">Téléphone</span><span class="v"><a class="tel" href="${esc(telLien(o.tel))}">${esc(o.tel)}</a></span></div>` : ''}
      ${o.decNom ? `<div><span class="k">Médecin déclarant</span><span class="v">${esc(o.decNom)}</span></div>` : ''}
      ${o.decTel ? `<div><span class="k">Téléphone du médecin</span><span class="v"><a class="tel" href="${esc(telLien(o.decTel))}">${esc(o.decTel)}</a></span></div>` : ''}
      ${o.decAdresse ? `<div><span class="k">Adresse du médecin</span><span class="v">${esc(o.decAdresse)}</span></div>` : ''}
    </div>
    ${idel}
    ${o.note ? `<div class="meta">${esc(o.note)}</div>` : ''}
    <div class="barre">
      <div class="actes">
        <button class="btn" onclick="ouvrirIdel('${o.id}')">${estAffecte(o) ? 'Changer le cabinet IDEL' : 'Désigner le cabinet IDEL'}</button>
        ${situable ? `<button class="btn sec" onclick="situerPatient('${o.id}')">Situer sur la carte ci-dessus</button>` : ''}
      </div>
      <div class="fin">
        <button class="btn sec" onclick="ouvrirEdition('rehyd','${o.id}')">Modifier</button>
        <button class="sup-m" title="Retirer du registre" onclick="supprimer('rehyd','${o.id}')">×</button>
      </div>
    </div>
  </div>`;
}

/* --- Module 4 : les médecins qui ont orienté --------------
   Rien ne se saisit ici, et c'est le principe : la liste se relit
   des signalements eux-mêmes, un médecin de plus dès qu'un nom
   nouveau apparaît en tête d'une fiche. Il n'y a donc pas de
   fichier de médecins à tenir à jour à côté du registre, et rien
   qui puisse le contredire.

   C'est la page qu'on ouvre pour rappeler celui qui a déclaré
   quand aucun cabinet infirmier n'est identifié — la procédure
   renvoie à lui, et lui seul sait quel cabinet suit la personne. */
function carteMedecins(){
  const med = carnetMedecins();
  const sansTel = med.filter(m => !m.tel).length;
  const total = med.reduce((n,m) => n + m.n, 0);

  return `<h2>Liste des médecins qui ont orienté
    <span class="cpt-h">${med.length} médecin${med.length>1?'s':''}</span></h2>
  <p class="sous-h">Les médecins du territoire qui ont signalé au moins une personne pour une réhydratation à domicile, avec l'adresse et le téléphone notés sur leurs signalements. La liste se remplit d'elle-même : elle n'a pas de saisie propre, et c'est elle que le formulaire de signalement propose à la frappe pour ne pas redemander deux fois les mêmes coordonnées.</p>
    <div class="compteurs" style="margin-bottom:16px">
      <div class="compteur"><div class="n">${med.length}</div><div class="l">médecins déclarants</div></div>
      <div class="compteur"><div class="n">${total}</div><div class="l">personnes signalées par eux</div></div>
      <div class="compteur"><div class="n">${sansTel}</div><div class="l">sans téléphone noté</div></div>
    </div>
    ${sansTel ? `<div class="note">${sansTel} médecin${sansTel>1?'s':''} sans numéro de téléphone : ${sansTel>1?'ils sont':'il est'} injoignable${sansTel>1?'s':''} si le circuit se bloque. Le numéro se rattrape en modifiant l'un de ${sansTel>1?'leurs':'ses'} signalements, et il revient ensuite tout seul sur les suivants.</div>` : ''}
    <div class="barre-h">
      <span class="cpt-h">${med.length ? `${total} signalement${total>1?'s':''} au total` : 'aucun signalement'}</span>
      ${med.length ? `<button class="btn sec" onclick="exporterMedecins()">Excel</button>` : ''}
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="allerModuleRehyd('patients')">Voir les personnes signalées</button>
    </div>
    ${med.length ? `<div class="rh-l">${med.map(ficheMedecin).join('')}</div>`
      : `<p class="vide">Rien à afficher pour le moment. Le premier médecin qui signale une personne ouvre la liste.</p>`}`;
}

function ficheMedecin(m){
  /* Les initiales des personnes qu'il a signalées : c'est tout ce que
     le registre porte, et c'est assez pour retrouver la fiche. */
  const qui = m.patients.map(o => String(o.nom || '').trim()).filter(Boolean);
  return `<div class="rh-c ${m.tel ? 'ok' : 'attente'}">
    <div class="haut">
      <div class="nom">${esc(m.nom)}</div>
      <span class="etiq e-cours">${m.n} signalement${m.n>1?'s':''}</span>
    </div>
    ${m.dernier ? `<div class="meta">Dernier signalement le ${frdateL(m.dernier)}</div>` : ''}
    <div class="champs">
      <div><span class="k">Téléphone</span><span class="v">${m.tel
        ? `<a class="tel" href="${esc(telLien(m.tel))}">${esc(m.tel)}</a>` : 'non renseigné'}</span></div>
      <div><span class="k">Adresse</span><span class="v">${m.adresse ? esc(m.adresse) : 'non renseignée'}</span></div>
    </div>
    ${qui.length ? `<div class="meta"><span class="k">Personnes signalées</span>${esc(qui.join(' · '))}</div>` : ''}
    ${m.tel || m.adresse ? `<div class="barre">
      <div class="actes">
        ${m.tel ? `<a class="btn" href="${esc(telLien(m.tel))}">Appeler — ${esc(m.tel)}</a>` : ''}
        ${m.adresse ? `<a class="btn sec" href="${esc(lienCarte(m.adresse, ''))}" target="_blank" rel="noopener"
          title="Ouvre l'itinéraire vers le cabinet dans votre application de cartes">Itinéraire ↗</a>` : ''}
      </div>
    </div>` : ''}
  </div>`;
}

/* Le carnet en fichier : un médecin par ligne, avec ce qu'on a pour
   le joindre. Il n'y a pas de registre derrière — l'export se
   fabrique de la même relecture que la liste à l'écran. */
function exporterMedecins(){
  const rows = [['Médecin','Adresse','Téléphone','Personnes signalées',
                 'Dernier signalement','Initiales des personnes signalées'].map(csvVal)];
  carnetMedecins().forEach(m => rows.push([
    m.nom, m.adresse, m.tel, m.n, m.dernier,
    m.patients.map(o => String(o.nom || '').trim()).filter(Boolean).join(' · ')
  ].map(csvVal)));
  telechargerCSV("Médecins qui ont orienté", rows);
}

/* --- Désigner le cabinet infirmier -----------------------
   La question posée au recueil se repose ici, et la même règle
   s'applique : oui, on nomme le cabinet et la personne lui est
   affectée ; non, on rappelle le médecin à l'origine de la
   demande. Cette fenêtre s'ouvre de la fiche comme de la carte. */
function ouvrirIdel(id){
  const o = (etat.rehyd || []).find(x => x.id === id); if(!o) return;
  const rep = estAffecte(o) ? 'Oui' : (o.idel === 'Non' ? 'Non' : (o.idel === 'Oui' ? 'Oui' : ''));
  const connus = dejaVus('rehyd', 'idelNom');

  document.getElementById('modale').innerHTML = `<h3>Cabinet IDEL — ${esc(o.nom || 'personne signalée')}</h3>
    <p class="chapo" style="margin:-6px 0 14px">Qui passera chez cette personne${o.commune ? `, à ${esc(o.commune)}` : ''}. Nommer le cabinet l'affecte : la personne sort de la liste d'attente et son point passe au bleu sur la carte.</p>
    <label><span class="k">Un cabinet infirmier libéral est-il identifié ?</span>
      <input type="hidden" id="id-rep" value="${esc(rep)}">
      <div class="sugg">
        <button type="button" class="${rep==='Oui'?'on':''}" data-v="Oui" onclick="repondreIdel('Oui',this)">Oui</button>
        <button type="button" class="${rep==='Non'?'on':''}" data-v="Non" onclick="repondreIdel('Non',this)">Non</button>
      </div></label>
    <div id="id-oui"${rep === 'Oui' ? '' : ' hidden'}>
      <label style="margin-top:12px"><span class="k">Nom du cabinet IDEL</span>
        <input type="text" id="id-nom" list="id-nom-l" autocomplete="off" value="${esc(o.idelNom || '')}" placeholder="Cabinet infirmier…">
        <datalist id="id-nom-l">${connus.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></label>
      <label style="margin-top:12px"><span class="k">Téléphone du cabinet</span>
        <input type="text" id="id-tel" value="${esc(o.idelTel || '')}" placeholder="06 12 34 56 78"></label>
    </div>
    <div id="id-non" class="note-dep" style="margin-top:12px"${rep === 'Non' ? '' : ' hidden'}>
      <strong>Contacter le médecin à l'origine de la demande.</strong>
      Aucun cabinet infirmier n'est identifié pour cette personne : c'est le médecin qui a déclaré qui sait lequel la suit. La fiche reste en attente jusqu'à ce qu'un cabinet y soit inscrit.
      ${o.decNom || o.decTel ? `<div style="margin-top:7px">${esc(o.decNom || 'Médecin déclarant')}${
        o.decTel ? ` — <a href="${esc(telLien(o.decTel))}">Appeler ${esc(o.decTel)}</a>` : " — numéro non renseigné sur la fiche"}</div>` : ''}
    </div>
    <div class="actions"><button class="btn" onclick="validerIdel('${id}')">Enregistrer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  ouvrirRideau();
}

/* La réponse ouvre l'un des deux blocs et referme l'autre. Retoucher
   la réponse déjà donnée la retire : c'est le geste attendu quand on
   s'est trompé de bouton. */
function repondreIdel(v, btn){
  const el = document.getElementById('id-rep');
  const meme = el.value === v;
  el.value = meme ? '' : v;
  Array.prototype.forEach.call(btn.parentNode.children,
    b => b.classList.toggle('on', b === btn && !meme));
  document.getElementById('id-oui').hidden = el.value !== 'Oui';
  document.getElementById('id-non').hidden = el.value !== 'Non';
  if(el.value === 'Oui'){ const n = document.getElementById('id-nom'); if(n) n.focus(); }
}

async function validerIdel(id){
  const o = (etat.rehyd || []).find(x => x.id === id); if(!o) return;
  const rep = document.getElementById('id-rep').value;
  if(!rep){ toast("Répondre oui ou non sur le cabinet IDEL"); return; }

  if(rep === 'Oui'){
    const nom = document.getElementById('id-nom').value.trim();
    if(!nom){ toast("Nommer le cabinet infirmier pour l'affecter"); return; }
    o.idel = 'Oui';
    o.idelNom = nom;
    o.idelTel = document.getElementById('id-tel').value.trim();
    if(!o.idelLe){ o.idelLe = aujourdhui(); o.idelPar = moi === 'Anonyme' ? '' : moi; }
    if(!o.statut || o.statut === 'À orienter') o.statut = 'Cabinet IDEL désigné';
  }else{
    o.idel = 'Non';
    o.idelNom = ''; o.idelTel = ''; o.idelLe = ''; o.idelPar = '';
    if(o.statut === 'Cabinet IDEL désigné') o.statut = 'À orienter';
  }
  o.modifiePar = moi;
  consignerRegistreEnCourante('rehyd', o);
  await sauver(); fermer(); rendre();
  toast(rep === 'Oui' ? `Cabinet affecté — ${o.idelNom}`
                      : "Médecin déclarant à rappeler, et repris en main courante");
}

function majPrintHead(){
  const el = document.getElementById('printhead');
  if(!el) return;
  const o = ONGLETS.find(x => x.id === onglet);
  el.innerHTML = `<div class="t">CPTS Pau Béarn — ${esc(o ? o.nom : 'Dossier de traçabilité')}</div>
    <div class="d">${esc(etat.entete.niveau)} · édité le ${new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${moi!=='Anonyme'?' par '+esc(moi):''}</div>`;
}

function rendre(){
  /* Une session ouverte sur un onglet remis en chantier ne doit pas
     rester bloquée dessus : elle retombe sur le cockpit. */
  if(enChantier(onglet)) onglet = 'cockpit';
  normaliserPersonnes();
  rendreNav();
  rendreMesMissions();
  const v = document.getElementById('vue');
  if(onglet === 'cockpit') v.innerHTML = vueCockpit();
  else if(onglet === 'missions') v.innerHTML = vueMissions();
  else if(onglet === 'veille') v.innerHTML = vueVeille();
  else if(onglet === 'courante') v.innerHTML = vueCourante();
  else if(onglet === 'lignes') v.innerHTML = vueLignes();
  else if(onglet === 'offre') v.innerHTML = vueOffre();
  else if(onglet === 'appels') v.innerHTML = vueAppels();
  else if(onglet === 'rehydratation') v.innerHTML = vueRehydratation();
  else if(onglet === 'rapports') v.innerHTML = vueRapports();
  else v.innerHTML = vueCollection(onglet);
  v.insertAdjacentHTML('afterbegin', '<div class="entete-print" id="printhead"></div>');
  majPrintHead();
  /* La page vient d'être reconstruite : les cartes qu'elle porte se
     remontent sur leurs conteneurs neufs, et celles qui ont disparu
     se démontent. */
  monterCartes();
}

charger();
</script>
</body>
</html>
