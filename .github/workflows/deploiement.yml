# Dépôt automatique du cockpit sur ses hébergements.
#
# Se déclenche à chaque modification poussée sur main. Plus aucune
# manipulation FTP n'est nécessaire côté coordination.
#
# Deux destinations pendant la bascule de juillet 2026 :
#
#   - AlwaysData (nouvelle) : https://cptspaubearn.alwaysdata.net
#     Seule adresse en HTTPS, donc la seule diffusable aux
#     professionnels sans avertissement « site non sécurisé ».
#   - OVH (ancienne) : http://cptspip.cluster129.hosting.ovh.net
#     Conservée le temps de vérifier la nouvelle. L'offre gratuite y
#     interdit tout certificat, c'est la raison du déménagement.
#
# Deux secrets à renseigner dans GitHub :
#   OVH_FTP_MOTDEPASSE et ALWAYSDATA_FTP_MOTDEPASSE.
# Les serveurs et identifiants ne sont pas des secrets, ils figurent
# tels quels dans les espaces clients.

name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:      # permet aussi de relancer à la main

jobs:
  deposer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      # Rien ne distingue deux versions de index.html à l'œil nu. On y
      # inscrit donc la date du dépôt, lisible en bas du rail : elle
      # permet de vérifier en une seconde si le navigateur affiche la
      # dernière version ou une copie restée en cache.
      # Le grep final fait échouer l'étape si le repère a disparu de la
      # page, plutôt que de déposer une version muette.
      - name: Horodater la version déposée
        run: |
          horodatage="$(TZ=Europe/Paris date '+%d/%m/%Y à %Hh%M')"
          sed -i "s|<div class=\"version\">[^<]*</div>|<div class=\"version\">Version du ${horodatage}</div>|" index.html
          grep -o '<div class="version">[^<]*</div>' index.html

      # Destination principale. En FTPS : le mot de passe ne circule
      # pas en clair, contrairement au FTP simple imposé par OVH.
      #
      # Tant que le secret n'est pas renseigné, cette étape se saute
      # au lieu de faire échouer tout le dépôt : sans cette condition,
      # une bascule d'hébergement à moitié configurée empêche aussi
      # les mises à jour de partir vers l'ancienne adresse, et plus
      # rien n'arrive nulle part.
      - name: Prévenir si le mot de passe AlwaysData manque
        if: ${{ secrets.ALWAYSDATA_FTP_MOTDEPASSE == '' }}
        run: echo "::warning::Secret ALWAYSDATA_FTP_MOTDEPASSE absent — dépôt AlwaysData sauté, seule l'ancienne adresse OVH est mise à jour."

      - name: Déposer sur AlwaysData
        if: ${{ secrets.ALWAYSDATA_FTP_MOTDEPASSE != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp-cptspaubearn.alwaysdata.net
          username: cptspaubearn
          password: ${{ secrets.ALWAYSDATA_FTP_MOTDEPASSE }}
          protocol: ftps
          port: 21
          server-dir: www/
          # Le dossier « donnees » contient l'état saisi par le copil :
          # il vit sur le serveur et ne doit jamais être écrasé.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/donnees/**
            **/*.md

      # Ancienne destination, gardée le temps de la bascule. Un échec
      # ici ne doit pas faire passer le dépôt AlwaysData pour raté :
      # c'est ce dernier qui compte désormais.
      - name: Déposer sur OVH (ancienne adresse)
        continue-on-error: true
        if: ${{ secrets.OVH_FTP_MOTDEPASSE != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: cptspip
          password: ${{ secrets.OVH_FTP_MOTDEPASSE }}
          protocol: ftp
          port: 21
          server-dir: www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/donnees/**
            **/*.md
