    <label style="margin-bottom:10px"><span class="k">Avec qui</span><input id="fi-avec" value="${esc(f.avec||'')}"></label>
    <label style="margin-bottom:10px"><span class="k">Pour qui</span><input id="fi-pour" value="${esc(f.pour||'')}"></label>
    <label style="margin-bottom:10px"><span class="k">Ce qu'on ne fait pas</span><textarea id="fi-limite" style="min-height:56px">${esc(f.limite||'')}</textarea></label>
    <label style="margin-bottom:10px"><span class="k">Où consigner</span><select id="fi-espace">${opts}</select></label>
    <div class="actions"><button class="btn" onclick="validerFiche('${m.id}')">Enregistrer</button><button class="btn sec" onclick="voirFiche('${m.id}')">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}

async function validerFiche(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  const g = k => document.getElementById('fi-'+k).value.trim();
  m.titre = g('titre') || m.titre;
  m.espace = g('espace');
  m.fiche = {but:g('but'), faire:g('faire'), avec:g('avec'), pour:g('pour'), limite:g('limite')};
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Fiche enregistrée");
}

function nouvelleMission(){
  const opts = ONGLETS.filter(o => !['cockpit','missions'].includes(o.id))
    .map(o => `<option value="${o.id}">${o.nom}</option>`).join('');
  document.getElementById('modale').innerHTML = `
    <h3>Créer une mission</h3>
    <label style="margin-bottom:10px"><span class="k">Intitulé *</span><input id="nm-titre" placeholder="Ex. Veille des sources"></label>
    <label style="margin-bottom:10px"><span class="k">En une phrase</span><textarea id="nm-detail" style="min-height:56px"></textarea></label>
    <label style="margin-bottom:10px"><span class="k">Pilote</span><input id="nm-pilote"></label>
    <label style="margin-bottom:10px"><span class="k">Mandat ARS</span><input id="nm-mandat" value="Non"></label>
    <label style="margin-bottom:10px"><span class="k">Où consigner</span><select id="nm-espace">${opts}</select></label>
    <div class="actions"><button class="btn" onclick="validerMission()">Créer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>document.getElementById('nm-titre').focus(), 60);
}
async function validerMission(){
  const t = document.getElementById('nm-titre').value.trim();
  if(!t){ toast("L'intitulé est obligatoire"); return; }
  etat.missions.push({
    id:uid(), titre:t,
    detail:document.getElementById('nm-detail').value.trim(),
    pilote:document.getElementById('nm-pilote').value.trim(), suppleant:'',
    mandat:document.getElementById('nm-mandat').value.trim() || 'Non',
    statut:'À lancer', espace:document.getElementById('nm-espace').value,
    fiche:{but:'', faire:'', avec:'', pour:'', limite:''}, creePar:moi
  });
  await sauver(); fermer(); rendre(); toast("Mission créée");
}
async function supprimerMission(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  document.getElementById('modale').innerHTML = `<h3>Supprimer cette mission&nbsp;?</h3>
    <p style="color:var(--texte-2)">« ${esc(m.titre)} » disparaîtra de l'organigramme. Les saisies déjà enregistrées dans son espace sont conservées.</p>
    <div class="actions"><button class="btn" onclick="confirmerSuppression('${id}')">Supprimer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function confirmerSuppression(id){
  noterRetrait(id);
  etat.missions = etat.missions.filter(x => x.id !== id);
  await sauver(); fermer(); rendre(); toast("Mission supprimée");
}

async function majMission(id, champ, val){
  const m = etat.missions.find(x => x.id === id);
  if(!m) return;
  m[champ] = val.trim();
  m.modifiePar = moi;
  await sauver();
  if(champ === 'statut' || champ === 'pilote' || champ === 'suppleant') rendre();
  else toast("Enregistré");
}

/* =========================================================
   SITUATION RÉGIONALE — le poste de veille

   La veille est tenue par une personne du copil, deux fois par
   jour. Toute la page est construite autour de ce geste : le tour
   de veille enchaîne les sources dues, et « rien de neuf » comme
   « je retiens » datent la source au passage. Marquer un canal vu
   et noter une information sont devenus le même geste.
   ========================================================= */
const SEUIL_VEILLE_H = 6;   // au-delà, un canal « chaque tour » est à repasser
const IMPACTS = {
  direct:    {l:"Impact direct sur le 64", c:'imp-direct',     d:"Change quelque chose pour nos adhérents ou leurs patients dès maintenant."},
  surveiller:{l:"À surveiller",            c:'imp-surveiller', d:"Pas d'effet immédiat chez nous, mais ça peut basculer."},
  contexte:  {l:"Contexte",                c:'imp-contexte',   d:"On le note pour comprendre la situation, sans action attendue."}
};
const SUITES = {
  rien:      {l:"Rien à faire"},
  copil:     {l:"À porter au copil"},
  ars:       {l:"À poser en question à l'ARS"},
  adherents: {l:"À relayer aux adhérents"}
};
let tourVeille = null;      // {liste:[ids], i, retenues, passees}
let sourcesDepliees = false;
let brouillonVeille = null;

const horodate = () => aujourdhui() + ' ' + maintenant();
function heuresDepuis(q){
  if(!q) return Infinity;
  const t = new Date(q.slice(0,10) + 'T' + (q.slice(11,16) || '00:00') + ':00');
  return isNaN(t) ? Infinity : (Date.now() - t) / 36e5;
}
function depuisTexte(q){
  if(!q) return "Jamais ouvert";
  const h = heuresDepuis(q);
  if(h < 1) return "Ouvert à l'instant";
  if(h < 24) return "Ouvert il y a " + Math.round(h) + " h";
  const j = Math.floor(h / 24);
  return "Ouvert il y a " + j + " jour" + (j > 1 ? 's' : '');
}
/* Une source est « due » selon son rythme : les canaux de premier
   plan à chaque tour, les autres une fois par jour. Un canal jamais
   ouvert l'est toujours. */
function sourceDue(o){
  if(!o.verifieLe) return true;
  if((o.rythme || 'Chaque tour') === 'Une fois par jour') return o.verifieLe.slice(0,10) !== aujourdhui();
  return heuresDepuis(o.verifieLe) >= SEUIL_VEILLE_H;
}
const sourcesTriees = () => [...(etat.sources||[])].sort((a,b) => (a.verifieLe||'').localeCompare(b.verifieLe||''));
/* Qui tient la veille : le pilote de la mission rattachée à cet
   espace. Une seule source de vérité, dans Missions & organigramme. */
const missionVeille = () => (etat.missions||[]).find(m => espaceDe(m) === 'veille');

function vueVeille(){
  const m = missionVeille();
  const pilote = m && m.pilote ? m.pilote : '';
  const dues = sourcesTriees().filter(sourceDue);
  const jamais = (etat.sources||[]).filter(o => !o.verifieLe);
  const attente = (etat.veille||[]).filter(i => i.suiteEtat === 'ouvert');
  const duJour = (etat.veille||[]).filter(i => i.date === aujourdhui());
  const dernier = sourcesTriees().filter(o => o.verifieLe).map(o => o.verifieLe).sort().pop();

  let h = `<h1>Situation régionale</h1>
  <p class="chapo">Le poste de veille de la CPTS Pau Béarn. On passe les canaux officiels en revue deux fois par jour, on retient ce qui a un impact sur le territoire, et on décide de la suite à donner à chaque information retenue.</p>`;

  /* --- qui tient la veille, et où en est le tour --- */
  h += `<div class="poste ${pilote ? '' : 'vacant'}">
    <div class="qui">
      <span class="k">Veille tenue par</span>
      <div class="nom">${pilote ? esc(pilote) : 'Personne'}</div>
      <div class="depuis">${pilote
        ? `Mission « ${esc(m.titre)} »${m.suppleant ? ' · suppléance : ' + esc(m.suppleant) : ''}`
        : "Aucun pilote nommé sur la mission de veille — la page ne se tiendra pas toute seule."}</div>
      <div class="actions" style="margin-top:11px">
        <button class="btn ${pilote ? 'sec' : ''}" onclick="passerLaMain()">${pilote ? 'Passer la main' : 'Nommer qui tient la veille'}</button>
      </div>
    </div>
    <div class="tours">
      <div class="tour-t ${dernier ? 'fait' : ''}">
        <div class="q">Dernier passage</div>
        <div class="v">${dernier
          ? `<b>${frdate(dernier.slice(0,10))} à ${esc(dernier.slice(11,16))}</b><br>${(etat.sources||[]).length - dues.length} canal${(etat.sources||[]).length - dues.length > 1 ? 'aux' : ''} à jour sur ${(etat.sources||[]).length}`
          : `<b>Aucun</b><br>Le tour n'a jamais été fait`}</div>
      </div>
      <div class="tour-t ${dues.length ? 'du' : 'fait'}">
        <div class="q">Tour en cours</div>
        <div class="v">${dues.length
          ? `<b>${dues.length} source${dues.length > 1 ? 's' : ''} à repasser</b><br>dont ${jamais.length} jamais ouverte${jamais.length > 1 ? 's' : ''}`
          : `<b>À jour</b><br>Rien à repasser pour l'instant`}</div>
      </div>
    </div>
  </div>`;

  /* --- ce qui appelle une décision --- */
  h += `<div class="compteurs" style="margin-bottom:18px">
    <div class="compteur"><div class="n">${attente.length}</div><div class="l">information${attente.length > 1 ? 's' : ''} en attente d'une suite</div></div>
    <div class="compteur"><div class="n">${duJour.length}</div><div class="l">retenue${duJour.length > 1 ? 's' : ''} aujourd'hui</div></div>
    <div class="compteur"><div class="n">${dues.length}</div><div class="l">source${dues.length > 1 ? 's' : ''} à repasser</div></div>
    <div class="compteur"><div class="n">${jamais.length}</div><div class="l">jamais ouverte${jamais.length > 1 ? 's' : ''} depuis le début de la crise</div></div>
  </div>`;

  /* --- le tour --- */
  h += tourVeille ? vueTourVeille() : (dues.length
    ? `<button class="lancer" onclick="lancerTour()">
        <div>
          <div class="t">Lancer le tour de veille</div>
          <div class="s">${dues.length} source${dues.length > 1 ? 's' : ''} à repasser, les moins récemment ouvertes d'abord</div>
        </div>
        <span class="go">Commencer →</span>
      </button>`
    : `<div class="carte" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:220px"><strong>Tous les canaux sont à jour.</strong>
        <div style="color:var(--texte-2);font-size:13.5px;margin-top:3px">Le prochain tour s'ouvrira de lui-même quand les sources arriveront à échéance.</div></div>
        <button class="btn sec" onclick="lancerTour(true)">Tout repasser quand même</button>
      </div>`);

  /* --- ce qu'on a retenu --- */
  const compte = f => f === 'decision' ? (etat.veille||[]).filter(i => i.suiteEtat === 'ouvert').length
                    : f === 'tout' ? (etat.veille||[]).length
                    : (etat.veille||[]).filter(i => (i.impact || 'contexte') === f).length;
  const filtres = [['decision',"Ce qui attend une décision"],['direct',"Impact direct 64"],['surveiller',"À surveiller"],['tout',"Tout"]];

  h += `<h2 style="margin-top:26px">Ce qu'on a retenu</h2>
  <div class="filtres">${filtres.map(([k,l]) =>
    `<button class="${filtreVeille === k ? 'on' : ''}" onclick="filtrer('${k}')">${l} · ${compte(k)}</button>`).join('')}
    <button onclick="ouvrirVeille()" style="border-style:dashed">+ Ajouter à la main</button>
  </div>`;

  let items = [...(etat.veille||[])].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if(filtreVeille === 'decision') items = items.filter(i => i.suiteEtat === 'ouvert');
  else if(filtreVeille !== 'tout') items = items.filter(i => (i.impact || 'contexte') === filtreVeille);

  if(!items.length){
    h += `<div class="carte" style="color:var(--texte-2)">${filtreVeille === 'decision'
      ? "Rien n'attend de décision : tout ce qui a été retenu a reçu sa suite."
      : "Aucune information pour ce filtre."}</div>`;
  } else {
    let jour = '';
    items.forEach(i => {
      if(i.date !== jour){
        jour = i.date;
        h += `<div class="reg-jour"><span class="n">${frdateL(i.date)}</span>${i.date === aujourdhui() ? '<span class="auj">Aujourd\'hui</span>' : ''}</div>`;
      }
      h += vueInfoVeille(i);
    });
  }

  /* --- le carnet de sources, replié --- */
  h += vueSourcesVeille(dues.length);

  h += `<div class="note" style="margin-top:20px"><strong>Ce que cette mission ne fait pas.</strong> On alimente le fil, on ne diffuse rien aux adhérents depuis ici : le relais se décide au copil et part de <a href="#" onclick="aller('diffusions');return false;">Ce qu'on a diffusé</a>. Les communications de l'ARS ont leur propre onglet, <a href="#" onclick="aller('ars');return false;">Échanges avec l'ARS</a>.</div>`;

  return h;
}

function vueInfoVeille(i){
  const imp = IMPACTS[i.impact] || IMPACTS.contexte;
  const su = SUITES[i.suite] || SUITES.rien;
  const ouvert = i.suiteEtat === 'ouvert';
  return `<div class="info i-${esc(i.impact || 'contexte')}">
    <div class="haut">
      <span class="src">${esc(i.source)} · ${frdate(i.date)}</span>
      <span class="imp ${imp.c}">${imp.l}</span>
      <span class="outils">
        <button onclick="ouvrirVeille('${i.id}')" title="Modifier">✎</button>
        <button onclick="supprimerVeille('${i.id}')" title="Retirer">×</button>
      </span>
    </div>
    <div class="ti">${esc(i.titre)}</div>
    ${i.resume ? `<div class="re">${esc(i.resume)}</div>` : ''}
    ${i.lien ? `<a class="lien" href="${esc(i.lien)}" target="_blank" rel="noopener">Ouvrir la source</a>` : ''}
    <div class="suite ${ouvert ? 'ouverte' : ''}">
      <span class="k">Suite</span>
      <span class="v">${ouvert
        ? `<b>${su.l}</b> — pas encore fait`
        : (i.suite === 'rien' || !i.suite ? 'Aucune suite attendue' : `<b>${su.l}</b>${i.suiteNote ? ' — ' + esc(i.suiteNote) : ''}`)}</span>
      ${ouvert
        ? `<button class="faire" onclick="suiteFaite('${i.id}')">C'est fait</button>`
        : (i.suite === 'rien' || !i.suite ? '' : `<span class="traite">✓ traité</span>`)}
    </div>
    <div class="trace">
      <span>Retenu par ${esc(i.auteur || i.modifiePar || '—')}</span>
      ${i.mc ? '<span class="mc">✓ consigné en main courante</span>' : ''}
    </div>
  </div>`;
}

function vueSourcesVeille(nbDues){
  const l = sourcesTriees();
  let h = `<div class="repli" style="margin-top:20px">
    <button class="tete" onclick="sourcesDepliees=!sourcesDepliees;rendre()">
      <div>
        <div class="t">Les ${l.length} sources surveillées</div>
        <div class="s">${nbDues} à repasser · à ouvrir pour ajouter, retirer ou corriger un canal</div>
      </div>
      <span class="chev">${sourcesDepliees ? '▾' : '▸'}</span>
    </button>`;
  if(sourcesDepliees){
    h += `<div class="dedans"><div class="srcs" style="margin-top:15px">` + l.map(o => `
      <div class="src-c ${o.verifieLe ? '' : 'jamais'}">
        <div>
          <div class="cat">${esc(o.cat || 'Autre')} · ${esc(o.rythme || 'Chaque tour')}</div>
          <div class="n">${esc(o.nom)}</div>
        </div>
        ${o.quoi ? `<div class="q">${esc(o.quoi)}</div>` : ''}
        <div class="q">${depuisTexte(o.verifieLe)}${o.verifiePar ? ' par ' + esc(o.verifiePar) : ''}</div>
        <div class="b">
          <a href="${esc(o.url)}" target="_blank" rel="noopener">Ouvrir</a>
          <button onclick="marquerSource('${o.id}')">Marquer vu</button>
          <button onclick="ouvrirSource('${o.id}')" title="Modifier" style="flex:0 0 46px;min-width:46px">✎</button>
          <button onclick="supprimerSource('${o.id}')" title="Retirer" style="flex:0 0 46px;min-width:46px">×</button>
        </div>
      </div>`).join('') + `</div>
      <div class="actions"><button class="btn sec" onclick="ouvrirSource()">Ajouter une source</button></div>
    </div>`;
  }
  return h + `</div>`;
}

/* ---------- le tour de veille ---------- */
function lancerTour(tout){
  const l = sourcesTriees().filter(o => tout || sourceDue(o));
  if(!l.length){ toast("Aucune source à repasser"); return; }
  tourVeille = {liste: l.map(o => o.id), i:0, retenues:0, passees:0};
  rendre();
  document.querySelector('.tourc')?.scrollIntoView({behavior:'smooth', block:'center'});
}
function vueTourVeille(){
  const total = tourVeille.liste.length;
  if(tourVeille.i >= total){
    const r = tourVeille.retenues, p = tourVeille.passees;
    return `<div class="tourc"><div class="jauge"><i style="width:100%"></i></div>
      <div class="fini">
        <div class="t">Tour terminé</div>
        <div class="s">${total} source${total > 1 ? 's' : ''} passée${total > 1 ? 's' : ''} · ${r} information${r > 1 ? 's' : ''} retenue${r > 1 ? 's' : ''}${p ? ' · ' + p + ' laissée' + (p > 1 ? 's' : '') + ' de côté' : ''}</div>
        <div class="actions" style="justify-content:center">
          <button class="btn" onclick="cloreTour()">Revenir au poste de veille</button>
        </div>
      </div></div>`;
  }
  const o = (etat.sources||[]).find(x => x.id === tourVeille.liste[tourVeille.i]);
  if(!o){ tourVeille.i++; return vueTourVeille(); }
  const reste = total - tourVeille.i - 1;
  return `<div class="tourc">
    <div class="jauge"><i style="width:${Math.round(tourVeille.i / total * 100)}%"></i></div>
    <div class="corps">
      <div class="pos"><span>Source ${tourVeille.i + 1} sur ${total}</span><span class="cat">${esc(o.cat || 'Autre')}</span><span>${esc(o.rythme || 'Chaque tour')}</span></div>
      <div class="n">${esc(o.nom)}</div>
      <div class="q ${o.verifieLe ? '' : 'vieux'}">${depuisTexte(o.verifieLe)}${o.verifiePar ? ' par ' + esc(o.verifiePar) : ''}</div>
      ${o.quoi ? `<div class="cherche"><span class="k">Ce qu'on y cherche</span><p>${esc(o.quoi)}</p></div>` : ''}
      <div class="gestes">
        <a class="ouvrir" href="${esc(o.url)}" target="_blank" rel="noopener">Ouvrir la source ↗</a>
        <button class="rien" onclick="rienDeNeuf()">Rien de neuf</button>
        <button class="retiens" onclick="ouvrirVeille('', '${o.id}')">Je retiens quelque chose</button>
      </div>
      <div class="bas">
        <button onclick="passerSource()">Passer sans marquer</button>
        <button onclick="cloreTour()">Interrompre le tour</button>
        <span class="reste">${reste} restante${reste > 1 ? 's' : ''}</span>
      </div>
    </div>
  </div>`;
}
function avancerTour(){
  if(!tourVeille) return;
  tourVeille.i++;
  rendre();
  document.querySelector('.tourc')?.scrollIntoView({behavior:'smooth', block:'center'});
}
async function rienDeNeuf(){
  await marquerSource(tourVeille.liste[tourVeille.i], true);
  avancerTour();
}
function passerSource(){ tourVeille.passees++; avancerTour(); }
function cloreTour(){ tourVeille = null; rendre(); }

function filtrer(s){ filtreVeille = s; rendre(); }
async function marquerSource(id, silencieux){
  const o = (etat.sources||[]).find(x => x.id === id);
  if(!o) return;
  o.verifieLe = horodate();
  o.verifiePar = moi;
  await sauver();
  if(!silencieux){ rendre(); toast("Source datée"); }
}
function ouvrirSource(id){
  const o = id ? (etat.sources||[]).find(x=>x.id===id) : null;
  const rythmes = ['Chaque tour','Une fois par jour'];
  document.getElementById('modale').innerHTML = `<h3>${o?'Modifier la source':'Ajouter une source'}</h3><div class="form">
    <label class="large"><span class="k">Nom du canal *</span><input id="s-nom" value="${esc(o?o.nom:'')}" placeholder="Ex. URPS Infirmiers Nouvelle-Aquitaine"></label>
    <label><span class="k">Catégorie</span><input id="s-cat" value="${esc(o?o.cat:'')}" placeholder="Institutionnel, Presse, URPS…"></label>
    <label><span class="k">Rythme</span><select id="s-rythme">${rythmes.map(x=>`<option ${o&&(o.rythme||'Chaque tour')===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label class="large"><span class="k">Adresse *</span><input id="s-url" value="${esc(o?o.url:'')}" placeholder="https://"></label>
    <label class="large"><span class="k">Ce qu'on y cherche</span><textarea id="s-quoi" placeholder="Ce qu'il faut regarder sur ce canal, pour que quelqu'un d'autre puisse prendre la main.">${esc(o?o.quoi:'')}</textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerSource(${o?`'${o.id}'`:''})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerSource(id){
  const g = k => document.getElementById('s-'+k).value.trim();
  const n = g('nom'), u = g('url');
  if(!n || !u){ toast("Nom et adresse obligatoires"); return; }
  const champs = {nom:n, url:u, cat: g('cat') || 'Autre', rythme: g('rythme'), quoi: g('quoi')};
  etat.sources = etat.sources || [];
  const o = id ? etat.sources.find(x=>x.id===id) : null;
  if(o) Object.assign(o, champs);
  else etat.sources.push(Object.assign({id:uid(), verifieLe:'', verifiePar:''}, champs));
  await sauver(); fermer(); rendre(); toast(o?"Source modifiée":"Source ajoutée");
}
async function supprimerSource(id){
  noterRetrait(id);
  etat.sources = (etat.sources||[]).filter(x=>x.id!==id);
  await sauver(); rendre(); toast("Source retirée");
}

/* ---------- ce qu'on retient ---------- */
function ouvrirVeille(id, srcId){
  const o = id ? (etat.veille||[]).find(x=>x.id===id) : null;
  const src = srcId ? (etat.sources||[]).find(x=>x.id===srcId) : null;
  brouillonVeille = {
    id: id || '',
    src,
    date: o ? o.date : aujourdhui(),
    source: o ? o.source : (src ? categorieSource(src) : 'Autre'),
    titre: o ? o.titre : '',
    resume: o ? o.resume : '',
    lien: o ? o.lien : (src ? src.url : ''),
    impact: o ? (o.impact || 'contexte') : 'surveiller',
    suite: o ? (o.suite || 'rien') : 'rien',
    mc: o ? !!o.mc : true
  };
  dessinerVeille();
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('v-titre'); if(i) i.focus(); }, 60);
}
/* Les sources du carnet portent une catégorie libre ; le fil, lui,
   se lit avec un vocabulaire court. On rapproche les deux. */
function categorieSource(s){
  const c = (s.cat || '').toLowerCase();
  if(c.indexOf('préfecture') === 0) return 'Préfecture';
  if(c.indexOf('presse') === 0) return 'Presse';
  if(c.indexOf('urps') === 0) return 'URPS';
  return 'Autre';
}

      <button class="btn" onclick="validerVeille()">${b.src ? 'Enregistrer et continuer le tour' : 'Enregistrer'}</button>

/* Un clic sur une étiquette redessine la fenêtre : on remet dans le
   brouillon ce qui est déjà tapé avant de la reconstruire. */
function choisirVeille(champ, valeur){
  relireBrouillonVeille();
  brouillonVeille[champ] = valeur;
  dessinerVeille();
}
function relireBrouillonVeille(){
  const b = brouillonVeille;
  if(!b) return;
  ['date','source','titre','resume','lien'].forEach(k => {
    const el = document.getElementById('v-' + k);
    if(el) b[k] = el.value.trim();
  });
  const mc = document.getElementById('v-mc');
  if(mc) b.mc = mc.checked;
}
async function validerVeille(){
  relireBrouillonVeille();
  const b = brouillonVeille;
  if(!b.titre){ toast("Il faut au moins une phrase"); document.getElementById('v-titre')?.focus(); return; }
  const o = b.id ? etat.veille.find(x => x.id === b.id) : null;
  const champs = {date:b.date, source:b.source, titre:b.titre, resume:b.resume, lien:b.lien, impact:b.impact, suite:b.suite};

  if(o){
    /* Changer la suite d'une information déjà traitée la remet en
       attente : c'est un nouvel engagement, pas une correction. */
    if(o.suite !== b.suite) o.suiteEtat = b.suite === 'rien' ? 'traite' : 'ouvert';
    Object.assign(o, champs, {modifiePar: moi});
  } else {
    etat.veille.unshift(Object.assign({id:uid()}, champs, {
      suiteEtat: b.suite === 'rien' ? 'traite' : 'ouvert',
      suiteNote: '',
      mc: b.mc,
      auteur: moi
    }));
    if(b.mc) consignerVeilleEnCourante(b);
  }

  const enTour = !!b.src;
  const srcId = b.src ? b.src.id : '';
  if(srcId){
    const s = (etat.sources||[]).find(x => x.id === srcId);
    if(s){ s.verifieLe = horodate(); s.verifiePar = moi; }
    if(tourVeille) tourVeille.retenues++;
  }
  await sauver(); fermer();
  toast(o ? "Modifié" : (b.mc ? "Retenu, et consigné en main courante" : "Retenu"));
  if(enTour && tourVeille) avancerTour(); else rendre();
}
/* Règle du cockpit : toute information recueillie au fil de l'eau
   se consigne aussi en main courante, en plus de sa rubrique. */
function consignerVeilleEnCourante(b){
  etat.courante = etat.courante || [];
  const su = SUITES[b.suite] || SUITES.rien;
  etat.courante.unshift({
    id: uid(),
    date: aujourdhui(),
    heure: maintenant(),
    source: 'Veille',
    evenement: "Veille — " + b.titre + (b.src ? " (source : " + b.src.nom + ")" : '') + (b.resume ? "\n" + b.resume : ''),
    suite: b.suite === 'rien'
      ? "Retenu pour la situation régionale, sans suite attendue. Impact : " + (IMPACTS[b.impact] || IMPACTS.contexte).l.toLowerCase() + "."
      : su.l + ". Impact : " + (IMPACTS[b.impact] || IMPACTS.contexte).l.toLowerCase() + ".",
    statut: b.suite === 'rien' ? 'Clos' : 'À suivre',
    auteur: moi,
    quand: ''
  });
}
async function suiteFaite(id){
  const i = (etat.veille||[]).find(x => x.id === id);
  if(!i) return;
  i.suiteEtat = 'traite';
  i.suiteNote = "Fait le " + frdateL(aujourdhui()) + " par " + moi;
  await sauver(); rendre(); toast("Suite marquée faite");
}
async function supprimerVeille(id){
  noterRetrait(id);
  etat.veille = etat.veille.filter(v => v.id !== id);
  await sauver(); rendre();
}

function passerLaMain(){
  const m = missionVeille();
  if(!m){ toast("Aucune mission de veille dans l'organigramme"); return; }
  const noms = nomsMissionnes().filter(n => cleP(n) !== cleP(m.pilote));
  document.getElementById('modale').innerHTML = `<h3>Qui tient la veille&nbsp;?</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Le nom est porté sur la mission « ${esc(m.titre)} » dans <a href="#" onclick="fermer();aller('missions');return false;">Missions &amp; organigramme</a>. C'est de là que le copil sait qui suivre.</p>
    ${noms.length ? `<div class="choixnom">` + noms.map(n =>
      `<button onclick="nommerVeilleur('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`).join('') + `</div>
      <p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Quelqu'un d'autre&nbsp;?</p>` : ''}
    <label><span class="k">Prénom et nom</span><input id="pv-nom" value="${esc(m.pilote || '')}" placeholder="Prénom et nom" onkeydown="if(event.key==='Enter')nommerVeilleur()"></label>
    <div class="actions"><button class="btn" onclick="nommerVeilleur()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;

async function nommerVeilleur(nom){
  const m = missionVeille();
  if(!m) return;
  const n = (nom || document.getElementById('pv-nom').value).trim();
  if(!n){ toast("Il faut un nom"); return; }
  const avant = m.pilote;
  m.pilote = n;
  if(m.statut === 'À lancer') m.statut = 'En cours';
  m.modifiePar = moi;
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(), date: aujourdhui(), heure: maintenant(), source: 'Coordination',
    evenement: (avant ? "Relève de la veille : " + avant + " passe la main à " + n + "." : n + " prend la veille des sources et de la situation régionale."),
    suite: "Passer les canaux en revue deux fois par jour et porter au copil ce qui appelle une décision.",
    statut: 'En cours', auteur: moi, quand: ''
  });
  await sauver(); fermer(); rendre();
  toast(n + " tient la veille");
}

function evenements(){
  const e = [];
  const push = (o, type, titre, detail, qui) => {
    if(!titre) return;
    e.push({date:o.date||'', heure:o.heure||'', type, titre, detail:detail||'', qui:qui||o.auteur||''});
  };
  (etat.diffusions||[]).forEach(o => push(o,'Diffusé',o.objet,
    [o.canal,o.cible,o.portee?o.portee+' destinataires':''].filter(Boolean).join(' · '), o.emetteur||o.auteur));
  (etat.ars||[]).forEach(o => push(o,'ARS',o.objet,
    [o.sens,o.interlocuteur,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.courante||[]).forEach(o => push(o,'Consigné',o.evenement, [o.source,o.suite].filter(Boolean).join(' · '), o.auteur));
  (etat.terrain||[]).forEach(o => push(o,'Terrain',o.sujet,
    [o.professionnel,o.profession,o.commune,o.criticite].filter(Boolean).join(' · '), o.auteur));
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a =>
    push(a,'Appel CPTS', c.nom, [a.qui, a.dit].filter(Boolean).join(' · '), a.par)));
  (etat.materiel||[]).forEach(o => push(o,'Matériel',o.nature,
    [o.demandeur,o.quantite,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.dons||[]).forEach(o => {
    push(o,'Collecte', o.structure,
      [o.reponse ? 'Réponse : ' + o.reponse : '', o.commune, o.reponse==='Oui' ? o.materiel : '', o.interlocuteur]
        .filter(Boolean).join(' · '), o.par || o.auteur);
    (o.suivi||[]).forEach(s => push(s,'Collecte', o.structure + ' — relance', s.texte, s.par));
  });
  (etat.renforts||[]).forEach(o => push(o,'Collecte', o.nom + ' — volontaire pour la collecte',
    [o.taches, aVehicule(o) ? o.vehicule : '', o.dispo, o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.volontaires||[]).forEach(o => push(o,'Volontaire',o.nom,
    [o.profession,o.dispo,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.veille||[]).forEach(o => push(o,'Veille',o.titre, [o.source,o.resume].filter(Boolean).join(' · '), o.auteur));
  return e.sort((a,b) => ((b.date+' '+(b.heure||'00:00')).localeCompare(a.date+' '+(a.heure||'00:00'))));
}

const COUL = {'Diffusé':'e-cours','ARS':'e-attente','Consigné':'e-lancer','Terrain':'e-bloque','Appel CPTS':'e-lancer','Matériel':'e-attente','Collecte':'e-cours','Volontaire':'e-cours','Veille':'e-fini'};

async function validerTel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  const g = k => document.getElementById('tl-'+k).value.trim();
  const avant = [c.tel||'', c.tel2||''].join('|');
  c.tel = g('tel'); c.telLibelle = g('telLibelle');

  const pc = n => d.length ? (n * 100 / d.length) : 0;

  let h = `<h1>Collecte de matériel</h1>
  <p class="chapo">Qui a été contacté sur le territoire pour donner du matériel, à quelle heure, par qui, et ce qui a été obtenu. Chaque don accepté se formalise par un bordereau signé et se range dans un lieu de stockage identifié.</p>
  <div class="filtres">
    <button class="${feuilletMat==='dons'?'on':''}" onclick="allerFeuilletMat('dons')">Appels aux donateurs <span style="opacity:.6">${d.length}</span></button>
    <button class="${feuilletMat==='stockage'?'on':''}" onclick="allerFeuilletMat('stockage')">Lieux de stockage <span style="opacity:.6">${s.length}</span></button>
    <button class="${feuilletMat==='renforts'?'on':''}" onclick="allerFeuilletMat('renforts')">Volontaires de la collecte <span style="opacity:.6">${(etat.renforts||[]).length}</span></button>
    <button class="${feuilletMat==='besoins'?'on':''}" onclick="allerFeuilletMat('besoins')">Besoins exprimés <span style="opacity:.6">${(etat.materiel||[]).length}</span></button>
  </div>`;

  if(feuilletMat === 'stockage') return h + feuilletStockage();
  if(feuilletMat === 'renforts') return h + feuilletRenforts();
  if(feuilletMat === 'besoins')  return h + feuilletBesoins();

  h += carteFormulaire();

  const parFormulaire = d.filter(x => x.source === 'formulaire').length;
  const parSaisie = d.filter(x => x.source === 'saisie').length;

  h += `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${d.length}</div><div class="l">structures contactées ou déclarées</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${oui}</div><div class="l">ont accepté de donner</div></div>
    <div class="compteur"><div class="n" style="color:var(--braise)">${non}</div><div class="l">ont refusé ou n'ont rien</div></div>
    <div class="compteur"><div class="n" style="color:var(--ambre)">${att}</div><div class="l">en attente ou à rappeler</div></div>
    <div class="compteur"><div class="n">${taux}&thinsp;%</div><div class="l">d'accord parmi les réponses obtenues</div></div>
    <div class="compteur"><div class="n">${d.filter(x=>x.reponse==='Oui'&&BORDEREAU_ACQUIS.indexOf(x.bordereau)>=0).length}</div><div class="l">bordereaux signés ou engagés en ligne</div></div>
    ${parFormulaire ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parFormulaire}</div><div class="l">reçus par le formulaire</div></div>` : ''}
    ${parSaisie ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parSaisie}</div><div class="l">réponses reportées à la main</div></div>` : ''}
  </div>`;

  if(d.length){
    h += `<div class="jauge">
      <i class="oui" style="width:${pc(oui)}%"></i>
      <i class="non" style="width:${pc(non)}%"></i>
      <i class="att" style="width:${pc(att)}%"></i>
    </div>
    <div class="jl">
      <span><i class="oui"></i>${oui} accord${oui>1?'s':''}</span>
      <span><i class="non"></i>${non} refus</span>
      <span><i class="att"></i>${att} sans réponse ferme</span>
    </div>`;
  }

  h += `<div class="note">Un don n'est acquis qu'une fois le <strong>bordereau signé ou engagé en ligne</strong> et le <strong>lieu de stockage</strong> connu. Le bordereau s'édite depuis la ligne du donateur, ou vierge depuis le bouton en haut à droite. Les lignes marquées <strong>Formulaire</strong> ont été déclarées par le donateur lui-même : leur bordereau est déjà rempli et son engagement recueilli, il reste à les vérifier et à organiser l'enlèvement. Une réponse obtenue autrement — le formulaire Google, un message reçu — se reporte ici avec <strong>Reporter une réponse</strong> : la ligne compte comme les autres, sans nom d'appelant.</div>
  <div class="barre-h">
    <span class="cpt-h">${d.length} ligne${d.length>1?'s':''} au registre</span>
    <button class="btn sec" onclick="exporterCSV('dons')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn sec" onclick="bordereau()">Bordereau de don officiel</button>
    <button class="btn sec" onclick="ouvrirAjout('dons','manuel')">Reporter une réponse</button>
    <button class="btn" onclick="ouvrirAjout('dons')">Consigner un appel</button>
  </div>`;

  const LIB_SRC = {Formulaire:'Reçus par formulaire', Saisie:'Reportés à la main'};
  const compte = r => r === 'Formulaire' ? parFormulaire
    : r === 'Saisie' ? parSaisie
    : d.filter(x => x.reponse === r).length;
  const reps = ['Tout','Oui','Non','En attente','À rappeler']
    .concat(parFormulaire ? ['Formulaire'] : [])
    .concat(parSaisie ? ['Saisie'] : []);
  if(d.length) h += `<div class="filtres">${reps.map(r =>
    `<button class="${filtreDon===r?'on':''}" onclick="filtrerDon('${r}')">${LIB_SRC[r] || esc(r)}${r!=='Tout'?` <span style="opacity:.6">${compte(r)}</span>`:''}</button>`).join('')}</div>`;

  let vus = filtreDon === 'Tout' ? [...d]
    : filtreDon === 'Formulaire' ? d.filter(x => x.source === 'formulaire')
    : filtreDon === 'Saisie' ? d.filter(x => x.source === 'saisie')
    : d.filter(x => x.reponse === filtreDon);
  vus.sort((a,b) => ((b.date||'')+' '+(b.heure||'')).localeCompare((a.date||'')+' '+(a.heure||'')));

  if(!vus.length){
    return h + `<div class="carte"><p class="vide">${d.length
      ? "Aucune ligne dans ce filtre."
      : "Registre vide. Il se remplit de deux façons : consigner un appel qu'on a mené, ou reporter une réponse arrivée autrement — une réponse au formulaire Google, un message reçu."}</p></div>`;
  }

  h += `<div class="dons">`;
  vus.forEach(o => {
    const cl = REPCL[o.reponse] || 'att';
    const ouvertx = donOuvert === o.id;
    h += `<div class="don ${cl}">
      <button class="tete" onclick="ouvrirDon('${o.id}')" aria-expanded="${ouvertx}">
        <span class="qd">${frdate(o.date)}<br>${esc(o.heure||'—')}</span>
        <span class="ident">
          <span class="n">${esc(o.structure)}${o.source === 'formulaire'
            ? `<span class="src-f">Formulaire</span>${o.aVerifier ? `<span class="src-f neuf">À vérifier</span>` : ''}`
            : o.source === 'saisie'
            ? `<span class="src-f saisie">Saisie à la main</span>`
            : ''}</span>
          <span class="s">${[o.type, o.commune, o.interlocuteur].filter(Boolean).map(esc).join(' · ') || '—'}</span>
        </span>
        <span class="par">${o.source === 'formulaire' ? 'Déclaré par'
            : o.source === 'saisie' ? 'Réponse de'
            : 'Appel mené par'}<br><b>${esc(o.source === 'formulaire' ? (o.interlocuteur || 'le donateur')
            : o.source === 'saisie' ? (o.interlocuteur || o.origine || 'le donateur')
            : (o.par || o.auteur || '—'))}</b></span>
        <span class="etiq ${REPET[o.reponse]||'e-lancer'}">${esc(o.reponse||'En attente')}</span>
        ${o.reponse === 'Oui'
          ? (o.materiel
              ? `<span class="mat">${esc(o.materiel)}${o.quantite?' — '+esc(o.quantite):''}</span>`
              : `<span class="manque">Nature du matériel à renseigner</span>`)
          : ''}
        <span class="chev">${ouvertx?'▲':'▼'}</span>
      </button>`;

    if(ouvertx) h += detailDon(o);
    h += `</div>`;
  });
  return h + `</div>`;
}

/* Panneau dépliant : la case « nature du matériel » n'apparaît
   que lorsque la structure a dit oui. */
function detailDon(o){
  const lieux = ['', ...(etat.stockage||[]).map(s => s.nom)];
  if(o.lieu && lieux.indexOf(o.lieu) === -1) lieux.push(o.lieu);
  const sel = (v, arr) => arr.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  let h = `<div class="detail">`;

  /* Ce que le donateur a déclaré lui-même n'est pas modifiable
     d'un clic : c'est la pièce qui fait foi. On l'affiche telle
     quelle, et la correction passe par « Modifier la fiche ». */
  if(o.source === 'formulaire'){
    const e = o.engagement || {};
    h += `<div class="declaration">
      <div class="dt">Déclaration reçue par le formulaire en ligne</div>
      <div class="dc">
        ${[['Adresse', o.adresse], ['Courriel', o.mail], ['Qualité du représentant', e.qualite],
           ['Disponible à partir de', o.dispo], ['Volume approximatif', o.quantite]]
          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Aucun élément complémentaire déclaré</span></div>`}
      </div>
      ${(o.lignes||[]).length ? `<table class="dl"><thead><tr><th>Désignation</th><th>Quantité</th><th>État</th><th>Observations</th></tr></thead>
        <tbody>${o.lignes.map(l => `<tr><td>${esc(l.designation||'')}</td><td>${esc(l.quantite||'')}</td><td>${esc(l.etat||'')}</td><td>${esc(l.obs||'')}</td></tr>`).join('')}</tbody></table>` : ''}
      ${o.note ? `<div class="dn"><span class="k">Précisions à l'enlèvement</span>${esc(o.note)}</div>` : ''}
      ${e.le ? `<div class="de">Conditions du bordereau acceptées le ${frdateL(e.le)} à ${esc(String(e.le).slice(11,16))} par ${esc(e.nom||'—')}${e.qualite?', '+esc(e.qualite):''}. Cette acceptation tient lieu de signature de l'entité donneuse.</div>` : ''}
    </div>`;
  }

  /* Une ligne reportée à la main n'engage pas la CPTS de la même
     façon qu'un appel : on rappelle d'où vient la réponse et qui
     l'a recopiée, sans quoi la ligne n'est plus vérifiable. */
  if(o.source === 'saisie'){
    h += `<div class="declaration">
      <div class="dt">Réponse reportée à la main au registre</div>
      <div class="dc">
        ${[['Provenance', o.origine], ['Personne qui a répondu', o.interlocuteur],
           ['Courriel', o.mail], ['Adresse', o.adresse]]
          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Provenance non précisée</span></div>`}
      </div>
      <div class="de">Reportée par ${esc(o.auteur || '—')}${o.quand ? ' le ' + frdateL(String(o.quand).slice(0,10)) : ''}. Cette ligne n'a pas fait l'objet d'un appel de la CPTS.</div>
    </div>`;
  }

  h += `<div class="form">
    <label><span class="k">Réponse à la collecte</span>
      <select onchange="majDon('${o.id}','reponse',this.value)">${sel(o.reponse||'En attente', ['En attente','Oui','Non','À rappeler'])}</select></label>
    <label><span class="k">Téléphone</span>
      ${o.tel ? `<a class="btn sec" style="display:flex;justify-content:center;text-decoration:none" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>`
              : `<input value="" placeholder="06 12 34 56 78" onchange="majDon('${o.id}','tel',this.value)">`}</label>`;

  if(o.reponse === 'Oui'){
    h += `<label class="large"><span class="k">Nature du matériel donné</span>
      <textarea placeholder="Ex. 2 tensiomètres, 3 saturomètres, 1 lecteur d'hémoglucotest, 1 stéthoscope" onchange="majDon('${o.id}','materiel',this.value)">${esc(o.materiel||'')}</textarea></label>
    <label><span class="k">Quantité totale</span><input value="${esc(o.quantite||'')}" placeholder="Ex. 6 cartons" onchange="majDon('${o.id}','quantite',this.value)"></label>
    <label><span class="k">Disponible à partir de</span><input value="${esc(o.dispo||'')}" placeholder="Ex. dès demain 9 h" onchange="majDon('${o.id}','dispo',this.value)"></label>
    <label><span class="k">Lieu de stockage prévu</span>
      <select onchange="majDon('${o.id}','lieu',this.value)">${sel(o.lieu||'', lieux)}</select>
      ${lieux.length > 1 ? '' : `<span style="font-size:12px;color:var(--texte-2)">Aucun lieu enregistré — <a href="#" onclick="allerFeuilletMat('stockage');return false;">en ajouter un</a></span>`}</label>
    <label><span class="k">Enlèvement</span>
      <select onchange="majDon('${o.id}','retrait',this.value)">${sel(o.retrait||'À organiser', ['À organiser','Planifié','Collecté','Remis au receveur','Sans objet'])}</select></label>
    <label><span class="k">Bordereau de don</span>
      <select onchange="majDon('${o.id}','bordereau',this.value)">${sel(o.bordereau||'Non', BORDEREAU_ETATS)}</select></label>`;
  }

  h += `<label class="large"><span class="k">Observation</span>
      <textarea onchange="majDon('${o.id}','note',this.value)">${esc(o.note||'')}</textarea></label>
  </div>`;

  const su = antechrono(o.suivi);
  h += `<div class="suivi">
    <span class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:7px">Relances et suites</span>
    ${su.length ? su.map(x => `<div class="e">
        <div class="q">${frdate(x.date)} ${esc(x.heure||'')} · ${esc(x.par||'—')}
          <button title="Supprimer" onclick="supprimerSuiviDon('${o.id}','${x.id}')">×</button></div>
        <div class="d">${esc(x.texte)}</div>
      </div>`).join('') : `<p class="vide" style="padding:0;font-size:13px">Aucune relance consignée.</p>`}
  </div>
  <div class="bas">
    ${o.aVerifier ? `<button class="btn" onclick="verifierDon('${o.id}')">Marquer comme vérifié</button>` : ''}
    <button class="btn sec" onclick="ouvrirSuiviDon('${o.id}')">Consigner une relance</button>
    ${o.reponse === 'Oui' ? `<button class="btn${o.aVerifier?' sec':''}" onclick="bordereau('${o.id}')">Éditer le bordereau${o.source==='formulaire'?' pré-rempli':' de don'}</button>` : ''}
    <button class="retirer" onclick="ouvrirEdition('dons','${o.id}')">Modifier la fiche</button>
    <button class="retirer sup" onclick="supprimer('dons','${o.id}')">Retirer</button>
  </div></div>`;
  return h;
}

async function majDon(id, champ, val){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  if(champ === 'reponse' && val === 'Oui' && !o.retrait) o.retrait = 'À organiser';
  await sauver(); rendre();
}

/* Un dépôt arrivé par le formulaire attend qu'un membre du copil
   l'ait lu : c'est ce qui distingue « reçu » de « pris en charge ». */
async function verifierDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  delete o.aVerifier;
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:aujourdhui(), heure:maintenant(), texte:"Déclaration en ligne vérifiée par la coordination.", par:moi});
  o.modifiePar = moi;
  await sauver(); rendre(); toast("Dépôt vérifié");
}

function ouvrirSuiviDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(o.structure)} — relance</h3><div class="form">
    <label><span class="k">Date</span><input type="date" id="sd-date" value="${aujourdhui()}"></label>
    <label><span class="k">Heure</span><input type="time" id="sd-heure" value="${maintenant()}"></label>
    <label class="large"><span class="k">Ce qui a été dit ou fait *</span><textarea id="sd-texte" placeholder="Rappel effectué, matériel préparé, enlèvement convenu…"></textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerSuiviDon('${o.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerSuiviDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  const g = k => document.getElementById('sd-'+k).value.trim();
  if(!g('texte')){ toast("Indiquez ce qui a été dit"); return; }
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:g('date'), heure:g('heure'), texte:g('texte'), par:moi});
  o.modifiePar = moi;
  donOuvert = o.id;
  await sauver(); fermer(); rendre(); toast("Relance consignée");
}
async function supprimerSuiviDon(id, sid){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  o.suivi = (o.suivi||[]).filter(x => x.id !== sid);
  await sauver(); rendre(); toast("Relance supprimée");
}

/* ---------- lieux de stockage ---------- */
function feuilletStockage(){
  const s = etat.stockage || [];
  const conf = s.filter(x => x.statut === 'Confirmé').length;
  const ordre = {'Confirmé':0, 'Proposé':1, 'Écarté':2};
  const tri = [...s].sort((a,b) => (ordre[a.statut]??1) - (ordre[b.statut]??1) || (a.nom||'').localeCompare(b.nom||'','fr'));

  let h = `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${s.length}</div><div class="l">lieux repérés sur le territoire</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${conf}</div><div class="l">confirmés et utilisables</div></div>
    <div class="compteur"><div class="n">${s.filter(x=>!x.referent).length}</div><div class="l">sans personne référente</div></div>
  </div>
  <div class="note">Un lieu n'est utilisable que si l'on connaît son <strong>adresse</strong>, ses <strong>horaires d'accès</strong> et la <strong>personne qui en détient les clés</strong>. Sans référent nommé, la collecte s'arrête devant une porte fermée.</div>
  <div class="barre-h">
    <span class="cpt-h">${s.length} lieu${s.length>1?'x':''}</span>
    <button class="btn sec" onclick="exporterCSV('stockage')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('stockage')">Ajouter un lieu</button>
  </div>`;

  if(!s.length) return h + `<div class="carte"><p class="vide">Aucun lieu de stockage enregistré. Renseignez le premier lieu proposé : nom, adresse, téléphone, horaires d'accès et personne référente.</p></div>`;

  h += `<div class="stocks">`;
  tri.forEach(o => {
    const cl = o.statut === 'Confirmé' ? 'confirme' : o.statut === 'Écarté' ? 'ecarte' : '';
    const orientes = (etat.dons||[]).filter(x => x.lieu === o.nom).length;
    h += `<div class="stock ${cl}">
      <div>
        <div class="nom">${esc(o.nom)}</div>
        <div style="margin-top:6px"><span class="etiq ${o.statut==='Confirmé'?'e-cours':o.statut==='Écarté'?'e-fini':'e-attente'}">${esc(o.statut||'Proposé')}</span></div>
      </div>
      ${o.horaires ? `<div class="bl"><span class="k">Horaires d'accès</span><span class="horaires">${esc(o.horaires)}</span></div>` : `<div class="obs">Horaires d'accès à obtenir.</div>`}
      ${o.referent ? `<div class="bl"><span class="k">Personne référente</span>${esc(o.referent)}${o.referentTel?` — <a href="tel:${esc(String(o.referentTel).replace(/[^0-9+]/g,''))}">${esc(o.referentTel)}</a>`:''}</div>` : `<div class="obs">Personne référente à identifier.</div>`}
      ${o.capacite ? `<div class="bl"><span class="k">Capacité</span>${esc(o.capacite)}</div>` : ''}
      ${o.acces ? `<div class="bl"><span class="k">Accès</span>${esc(o.acces)}</div>` : ''}
      ${o.note ? `<div class="obs">${esc(o.note)}</div>` : ''}
      ${orientes ? `<div class="oriente">${orientes} don${orientes>1?'s':''} orienté${orientes>1?'s':''} vers ce lieu</div>` : ''}
      <div class="liens">
        ${o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>` : ''}
        ${o.adresse ? `<a class="adr" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.adresse)}" target="_blank" rel="noopener">${esc(o.adresse)}</a>` : ''}
      </div>
      <div style="display:flex;gap:7px">
        <button class="retirer" onclick="ouvrirEdition('stockage','${o.id}')">Modifier</button>
        <button class="retirer" onclick="supprimer('stockage','${o.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

/* ---------- volontaires de la collecte ------------------
   Une collecte tient sur des mains : quelqu'un pour tenir la
   permanence, quelqu'un pour trier, quelqu'un qui a un
   utilitaire. Ce feuillet les recense et dit qui fait quoi.
   Il ne recense pas les soignants volontaires pour partir en
   renfort : ceux-là relèvent de l'onglet Volontaires, où le
   cadre — assurance, statut, continuité des soins — n'est pas
   le même. */
const RENFORT_ORDRE = {'Affecté':0, 'Confirmé':1, 'Proposé':2, 'Indisponible':3, 'Sans suite':4};
const RENFORT_ETIQ  = {'Affecté':'e-cours', 'Confirmé':'e-cours', 'Proposé':'e-attente',
                       'Indisponible':'e-bloque', 'Sans suite':'e-fini'};

const listeTaches = o => String(o.taches || '').split(',').map(x => x.trim()).filter(Boolean);
const aVehicule = o => o.vehicule && o.vehicule !== 'Aucun';

function filtrerRenfort(i){
  filtreRenfort = i === -1 ? 'Tout' : i === -2 ? 'Véhicule' : TACHES[i];
  rendre();
}

async function majRenfort(id, champ, val){
  const o = (etat.renforts||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  await sauver(); rendre();
}

/* Les tâches se cochent depuis la fiche : c'est ce qui change le
   plus souvent, au fil des disponibilités de chacun. Elles sont
   rangées dans un seul champ texte, lisible tel quel à l'export
   comme dans le dossier de traçabilité. */
async function basculerTache(id, i){
  const o = (etat.renforts||[]).find(x => x.id === id); if(!o) return;
  const t = TACHES[i], l = listeTaches(o), j = l.indexOf(t);
  if(j >= 0) l.splice(j, 1); else l.push(t);
  o.taches = TACHES.filter(x => l.indexOf(x) >= 0)
    .concat(l.filter(x => TACHES.indexOf(x) === -1)).join(', ');
  o.modifiePar = moi;
  await sauver(); rendre();
}

function feuilletRenforts(){
  const v = etat.renforts || [];
  const actifs = v.filter(x => x.statut !== 'Indisponible' && x.statut !== 'Sans suite');
  const prets = v.filter(x => x.statut === 'Confirmé' || x.statut === 'Affecté').length;
  const roulants = actifs.filter(aVehicule).length;
  const muets = v.filter(x => !x.tel).length;

  let h = `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${v.length}</div><div class="l">volontaires recensés</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${prets}</div><div class="l">confirmés ou déjà affectés</div></div>
    <div class="compteur"><div class="n">${roulants}</div><div class="l">disposent d'un véhicule</div></div>
    ${muets ? `<div class="compteur"><div class="n" style="color:var(--braise)">${muets}</div><div class="l">sans téléphone renseigné</div></div>` : ''}
  </div>
  <div class="note">Un volontaire n'est mobilisable que si l'on sait <strong>quand il est disponible</strong> et <strong>par quel numéro le joindre</strong>. La CPTS coordonne : elle ne réquisitionne personne et n'engage aucun volontaire au-delà de ce qu'il a accepté. Les soignants volontaires pour partir en renfort ne se recensent pas ici mais dans l'onglet <a href="#" onclick="aller('volontaires');return false;">Volontaires</a>, où le cadre — assurance, statut, continuité des soins — n'est pas le même.</div>
  <div class="barre-h">
    <span class="cpt-h">${v.length} volontaire${v.length>1?'s':''}</span>
    <button class="btn sec" onclick="exporterCSV('renforts')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('renforts')">Recenser un volontaire</button>
  </div>`;

  if(!v.length) return h + `<div class="carte"><p class="vide">Aucun volontaire recensé. Notez le premier : son nom, son téléphone, ce qu'il peut faire et quand. Un nom sans créneau ni numéro ne sert à rien le jour de l'enlèvement.</p></div>`;

  h += `<div class="filtres">
    <button class="${filtreRenfort==='Tout'?'on':''}" onclick="filtrerRenfort(-1)">Tout <span style="opacity:.6">${v.length}</span></button>
    ${TACHES.map((t,i) => {
      const n = v.filter(x => listeTaches(x).indexOf(t) >= 0).length;
      return n ? `<button class="${filtreRenfort===t?'on':''}" onclick="filtrerRenfort(${i})">${esc(t)} <span style="opacity:.6">${n}</span></button>` : '';
    }).join('')}
    ${roulants ? `<button class="${filtreRenfort==='Véhicule'?'on':''}" onclick="filtrerRenfort(-2)">Avec véhicule <span style="opacity:.6">${roulants}</span></button>` : ''}
  </div>`;

  let vus = filtreRenfort === 'Tout' ? [...v]
    : filtreRenfort === 'Véhicule' ? v.filter(aVehicule)
    : v.filter(x => listeTaches(x).indexOf(filtreRenfort) >= 0);
  vus.sort((a,b) => (RENFORT_ORDRE[a.statut] ?? 2) - (RENFORT_ORDRE[b.statut] ?? 2)
    || (a.nom||'').localeCompare(b.nom||'','fr'));

  if(!vus.length) return h + `<div class="carte"><p class="vide">Aucun volontaire dans ce filtre.</p></div>`;

  h += `<div class="stocks">`;
  vus.forEach(o => {
    const cl = (o.statut === 'Confirmé' || o.statut === 'Affecté') ? 'confirme'
      : (o.statut === 'Indisponible' || o.statut === 'Sans suite') ? 'ecarte' : '';
    const t = listeTaches(o);
    h += `<div class="stock ${cl}">
      <div>
        <div class="nom">${esc(o.nom)}</div>
        <div style="font-size:13px;color:var(--texte-2);margin-top:3px">${
          [o.profession, o.commune].filter(Boolean).map(esc).join(' · ') || '—'}</div>
      </div>
      <label class="bl"><span class="k">Statut</span>
        <select onchange="majRenfort('${o.id}','statut',this.value)">${
          ['Proposé','Confirmé','Affecté','Indisponible','Sans suite'].map(x =>
            `<option ${x===(o.statut||'Proposé')?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <div class="bl"><span class="k">Ce qu'il ou elle peut faire</span>
        <div class="taches">${TACHES.map((x,i) =>
          `<button class="${t.indexOf(x)>=0?'on':''}" onclick="basculerTache('${o.id}',${i})">${esc(x)}</button>`).join('')}</div>
        ${t.filter(x => TACHES.indexOf(x) === -1).length
          ? `<div style="font-size:13px;margin-top:6px">${esc(t.filter(x => TACHES.indexOf(x) === -1).join(', '))}</div>` : ''}</div>
      ${aVehicule(o) ? `<div class="bl"><span class="k">Véhicule</span>${esc(o.vehicule)}${o.volume?` — ${esc(o.volume)}`:''}</div>` : ''}
      ${o.dispo ? `<div class="bl"><span class="k">Disponibilités</span><span class="horaires">${esc(o.dispo)}</span></div>`
                : `<div class="obs">Disponibilités à préciser.</div>`}
      ${o.affectation ? `<div class="bl"><span class="k">Affecté à</span>${esc(o.affectation)}</div>` : ''}
      ${o.note ? `<div class="obs">${esc(o.note)}</div>` : ''}
      <div class="liens">
        ${o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>`
                : `<span class="obs">Téléphone à obtenir.</span>`}
        ${o.mail ? `<a class="adr" href="mailto:${esc(o.mail)}">${esc(o.mail)}</a>` : ''}
      </div>
      <div style="display:flex;gap:7px">
        <button class="retirer" onclick="ouvrirEdition('renforts','${o.id}')">Modifier</button>
        <button class="retirer" onclick="supprimer('renforts','${o.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

/* ---------- besoins exprimés (ancien onglet Matériel) ---------- */

  const n = (etat.materiel||[]).length;
  return `<p class="chapo" style="margin-top:-6px">${CHAMPS.materiel.chapo}</p>

}

/* =========================================================
   BORDEREAU DE DON
   Document d'une page qui formalise la remise du matériel de
   l'entité donneuse vers l'entité réceptrice. Prérempli depuis
   la fiche du donateur, complétable à l'écran, imprimable ou
   enregistrable en PDF.
   ========================================================= */
function bordereau(id){
  const o = id ? (etat.dons||[]).find(x => x.id === id) : null;
  const st = o && o.lieu ? (etat.stockage||[]).find(x => x.nom === o.lieu) : null;
  const ref = 'BD-2026-' + (o ? String(o.id).slice(-4).toUpperCase() : '……');
  const ligne = (l, v, ph) => `<div class="lg"><span class="e">${l}</span><span class="v" contenteditable="true" data-ph="${esc(ph||'')}">${esc(v||'')}</span></div>`;
  const cellules = (a, b, c) => `<tr><td contenteditable="true">${esc(a||'')}</td><td contenteditable="true">${esc(b||'')}</td><td contenteditable="true"></td><td contenteditable="true">${esc(c||'')}</td></tr>`;

  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<div class="acte">
    <div class="ent">
      <div class="g">
        <div class="org">CPTS Pau Béarn</div>
        <div class="sub">Communauté professionnelle territoriale de santé — Pau et Béarn</div>
      </div>
      <div class="d">
        <div class="ref">Réf. ${esc(ref)}</div>
        <div class="sub">Établi le ${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}</div>
      </div>
    </div>

    <h1 class="ttl">Bordereau de don de matériel</h1>
    <div class="ss">Formalisation de la remise de matériel de l'entité donneuse à l'entité réceptrice</div>

    <div class="ctx"><b>Cadre de la remise.</b> Le présent bordereau est établi dans le cadre du plan blanc régional et du dispositif ORSAN AMAVI activés par l'ARS Nouvelle-Aquitaine à la suite des feux de forêt de Gironde et des Landes de juillet 2026. La CPTS Pau Béarn intervient au seul titre de la coordination de la collecte sur son territoire. Ce document constate la remise, à titre gratuit et définitif, du matériel décrit à l'article 3 par l'entité donneuse à l'entité réceptrice. Il ne vaut ni commande, ni engagement financier, ni transfert de responsabilité médicale.</div>

    <h2>1 · Entité donneuse</h2>
    ${ligne("Dénomination", o ? o.structure : '')}
    ${ligne("Nature de la structure", o ? o.type : '')}
    ${ligne("Adresse", o ? o.adresse : '')}
    ${ligne("Commune", o ? o.commune : '')}
    ${ligne("Représentant — nom et qualité", o ? [o.interlocuteur, (o.engagement||{}).qualite].filter(Boolean).join(', ') : '')}
    ${ligne("Téléphone", o ? o.tel : '')}
    ${ligne("Courriel", o ? o.mail : '')}

    <h2>2 · Entité réceptrice</h2>
    ${ligne("Dénomination", RECEVEUR.nom)}
    ${ligne("Adresse", RECEVEUR.adresse)}
    ${ligne("Qualité", RECEVEUR.qualite)}
    ${ligne("Réceptionnaire — nom et qualité", '')}
    ${ligne("Téléphone", '')}

    <h2>3 · Matériel remis</h2>
    <table>
      <thead><tr><th style="width:44%">Désignation</th><th style="width:16%">Quantité</th><th style="width:16%">État</th><th style="width:24%">Observations</th></tr></thead>
      <tbody>
        ${o && (o.lignes||[]).length
          /* Déclaration reçue par le formulaire : le détail ligne
             à ligne est déjà là, l'état aussi. */
          ? o.lignes.map(l => `<tr><td contenteditable="true">${esc(l.designation||'')}</td>
              <td contenteditable="true">${esc(l.quantite||'')}</td>
              <td contenteditable="true">${esc(l.etat||'')}</td>
              <td contenteditable="true">${esc(l.obs||'')}</td></tr>`).join('')
          : cellules(o ? o.materiel : '', o ? o.quantite : '', o && o.dispo ? 'Disponible : ' + o.dispo : '')}
        ${cellules('','','')}${cellules('','','')}${cellules('','','')}
      </tbody>
    </table>
    ${ligne("Lieu de regroupement", st ? st.nom + (st.adresse ? ' — ' + st.adresse : '') : (o ? o.lieu : ''))}
    ${ligne("Transport assuré par", '')}

    <h2>4 · Conditions</h2>
    <ol>
      <li>Le don est consenti à titre gratuit et définitif. Il ne donne lieu à aucune facturation, aucune contrepartie ni aucune demande de remboursement, présente ou future.</li>
      <li>L'entité donneuse déclare que le matériel remis est en état d'usage et non périmé, et que les dispositifs médicaux et consommables sont dans leur conditionnement d'origine intact.</li>
      <li>La propriété et la garde du matériel sont transférées à l'entité réceptrice au moment de la réception, constatée par la signature du présent bordereau.</li>
      <li>Le matériel est destiné exclusivement à la réponse à la situation sanitaire exceptionnelle en cours. L'entité réceptrice en dispose librement pour cet usage.</li>
      <li>Le présent bordereau vaut décharge pour l'entité donneuse à compter de la réception, et pièce justificative pour l'entité réceptrice.</li>
      <li>La CPTS Pau Béarn n'intervient qu'en qualité de coordonnateur de la collecte. Elle n'est ni propriétaire, ni transporteur, ni destinataire du matériel.</li>
    </ol>

    <h2>5 · Signatures</h2>
    ${o && o.engagement && o.engagement.le
      /* Le donateur a accepté les conditions dans le formulaire :
         sa signature manuscrite n'a plus lieu d'être, seule la
         réception reste à constater. */
      ? `<div class="cachet"><b>Engagement de l'entité donneuse recueilli par voie électronique</b> le
          ${frdateL(o.engagement.le)} à ${esc(String(o.engagement.le).slice(11,16))},
          par ${esc(o.engagement.nom || o.interlocuteur || '—')}${o.engagement.qualite ? ', ' + esc(o.engagement.qualite) : ''},
          pour ${esc(o.structure)}, qui a déclaré accepter les conditions de l'article 4 et certifié être
          habilité à engager la structure. Cette acceptation tient lieu de signature de l'entité donneuse.</div>`
      : ''}
    <div class="sig">
      ${o && o.engagement && o.engagement.le ? '' : `<div class="b">
        <div class="q">Pour l'entité donneuse</div>
        <div class="l">Fait à …………………………, le ……… / ……… / 2026</div>
        <div class="l">Nom et qualité :</div>
        <div class="l">Signature :</div>
      </div>`}
      <div class="b">
        <div class="q">Pour l'entité réceptrice</div>
        <div class="l">Fait à …………………………, le ……… / ……… / 2026</div>
        <div class="l">Nom et qualité :</div>
        <div class="l">Signature :</div>
      </div>
    </div>

    <div class="pied">Document établi en deux exemplaires, un pour chaque partie. Un exemplaire est conservé par la CPTS Pau Béarn au titre de la traçabilité de sa mobilisation. Coordination de la collecte : CPTS Pau Béarn — ${esc(moi !== 'Anonyme' ? moi : 'coordination de crise')}.</div>
  </div>
  <div class="actions">
    <button class="btn" onclick="imprimerModale()">Imprimer ou enregistrer en PDF</button>
    ${o ? `<button class="btn sec" onclick="marquerBordereau('${o.id}')">Marquer comme édité</button>` : ''}
    <button class="btn sec" onclick="fermer()">Fermer</button>
  </div>`;
  document.getElementById('rideau').classList.add('on');
  toast("Les champs pointillés se complètent directement à l'écran");
}
async function marquerBordereau(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  if(BORDEREAU_ACQUIS.indexOf(o.bordereau) === -1) o.bordereau = 'Édité';
  o.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Bordereau noté comme édité");
}

const DOSSIER = ['diffusions','ars','courante','terrain','materiel','dons','stockage','renforts','volontaires'];

function tableauFige(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<p class="vide">Aucune ligne.</p>`;
  const ent = cfg.cols.map(c => c==='date' ? 'Date' : c==='auteur' ? 'Saisi par' : ((cfg.f.find(x=>x.c===c)||{}).l || c));
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}</tr></thead><tbody>`;
  lignes.forEach(l => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel') v = frdate(v);
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

function vueDossier(){
  let h = `<h1>Dossier de traçabilité</h1>
  <div style="font-family:var(--display);font-weight:600;font-size:16px;color:var(--encre);margin:-2px 0 6px">CPTS Pau Béarn</div>
  <p class="chapo">L'ensemble des éléments tracés par la CPTS Pau Béarn depuis le début de sa mobilisation dans le cadre du plan blanc régional / ORSAN AMAVI, mis bout à bout pour être imprimés ou enregistrés en PDF. C'est la pièce à joindre au retour d'expérience et au bilan.</p>
  <div class="barre-h">
    <button class="btn sec" onclick="exporterTout()">Tout en Excel</button>
    <button class="btn" onclick="imprimer()">Imprimer ou enregistrer en PDF</button>
  </div>
  <div class="carte"><h2>Organisation</h2>${organigramme() || '<p class="vide">Aucun pilote désigné.</p>'}</div>
  <div class="carte"><h2>Fiches mission</h2>` +
  etat.missions.map(m => {
    const f = m.fiche || {};
    const li = lignes(f.faire);
    return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--trait)">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(m.titre)}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 7px">Pilote : ${esc(m.pilote)||'à désigner'} · Suppléant : ${esc(m.suppleant)||'—'} · Mandat ARS : ${esc(m.mandat)} · ${esc(m.statut)}</div>
      ${f.but?`<div style="font-size:13.5px"><em>${esc(f.but)}</em></div>`:''}
      ${li.length?`<ul style="margin:6px 0 0;padding-left:19px;font-size:13.5px">${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${f.limite?`<div style="font-size:13px;color:var(--braise);margin-top:6px">Ce qu'on ne fait pas : ${esc(f.limite)}</div>`:''}
    </div>`;
  }).join('') + `</div>`;

  DOSSIER.forEach(k => {
    h += `<h2 style="margin-top:24px">${esc(CHAMPS[k].titre)}</h2>${tableauFige(k)}`;
  });

  h += `<h2 style="margin-top:24px">Appels aux CPTS</h2><div class="tw"><table>
    <thead><tr><th>CPTS</th><th>Proximité</th><th>Statut</th><th>Date</th><th>Interlocuteur</th><th>Ce qui a été dit</th><th>Suite</th><th>Par</th></tr></thead><tbody>` +
    (etat.cpts||[]).map(c => {
      const a = antechrono(c.appels);
      if(!a.length) return `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td colspan="5">—</td></tr>`;
      return a.map(x => `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td>${frdate(x.date)} ${esc(x.heure||'')}</td><td>${esc(x.qui)||'—'}</td><td>${esc(x.dit)}</td><td>${esc(x.suite)||'—'}</td><td>${esc(x.par)}</td></tr>`).join('');
    }).join('') + `</tbody></table></div>`;
  return h;
}

function vueCollection(k){
  const cfg = CHAMPS[k];
  const n = (etat[k] || []).length;
  const j = !!JOURNAL[k];
  return `<h1>${cfg.titre}</h1><p class="chapo">${cfg.chapo}</p>
    <div class="barre-h"><span class="cpt-h">${n} ${j ? 'entrée' : 'ligne'}${n>1?'s':''}${j ? ' · de la plus récente à la plus ancienne' : ''}</span>
      <button class="btn sec" onclick="exporterCSV('${k}')">Excel</button>
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('${k}')">Ajouter</button></div>
    ${barreOrdre(k)}
    ${j ? journal(k) : tableau(k)}`;
}

function majPrintHead(){
  const el = document.getElementById('printhead');
  if(!el) return;
  const o = ONGLETS.find(x => x.id === onglet);
  el.innerHTML = `<div class="t">CPTS Pau Béarn — ${esc(o ? o.nom : 'Dossier de traçabilité')}</div>
    <div class="d">${esc(etat.entete.niveau)} · édité le ${new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${moi!=='Anonyme'?' par '+esc(moi):''}</div>`;
}

function rendre(){
  normaliserPersonnes();
  rendreNav();
  rendreMesMissions();
  const v = document.getElementById('vue');
  if(onglet === 'cockpit') v.innerHTML = vueCockpit();
  else if(onglet === 'missions') v.innerHTML = vueMissions();
  else if(onglet === 'veille') v.innerHTML = vueVeille();
  else if(onglet === 'fil') v.innerHTML = vueFil();
  else if(onglet === 'lignes') v.innerHTML = vueLignes();
  else if(onglet === 'offre') v.innerHTML = vueOffre();
  else if(onglet === 'appels') v.innerHTML = vueAppels();
  else if(onglet === 'materiel') v.innerHTML = vueCollecte();
  else if(onglet === 'dossier') v.innerHTML = vueDossier();
  else v.innerHTML = vueCollection(onglet);
  v.insertAdjacentHTML('afterbegin', '<div class="entete-print" id="printhead"></div>');
  majPrintHead();
}

charger();
</script>
