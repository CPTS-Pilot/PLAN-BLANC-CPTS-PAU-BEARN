  if(feuilletOri === 'patients') return h + feuilletPatients(ori, vivier);
  if(feuilletOri === 'relais')   return h + feuilletRelais(rel, ori, diffusables.length);
  return h + feuilletMedecins(med, vivier, diffusables, ori);
}

/* =========================================================
   L'AGENDA DES CRÉNEAUX

   Les créneaux de tous les médecins volontaires mis bout à
   bout, jour par jour. C'est la page à ouvrir quand une
   pharmacie appelle : on voit ce qui est libre, on y pose la
   personne, et le cockpit rend aussitôt le numéro et le
   courriel du médecin — parce qu'un créneau positionné qui
   n'est pas dit au médecin n'est pas un rendez-vous.

   Un créneau n'existe pas comme fiche : il se déduit de ce que
   le médecin a coché. Ce qui est enregistré, c'est le patient
   qu'on y pose — une seule source de vérité, celle du registre
   des patients.
   ========================================================= */
let filtreAgenda = 'libres';
let agendaPasse = false;
function filtrerAgenda(f){ filtreAgenda = f; rendre(); }
function basculerAgendaPasse(){ agendaPasse = !agendaPasse; rendre(); }

const PART_L = { matin:'matin', apresmidi:'après-midi' };
const heuresDuCreneau = (m, cle) =>
  (m.heures && Array.isArray(m.heures[cle])) ? m.heures[cle].filter(h => /^\d{1,2}:\d{2}$/.test(h)) : [];

/* Un créneau se désigne par le médecin, la demi-journée et
   l'heure — vide si le médecin n'en a pas précisé. */
const cleCreneau = s => s.m.id + '|' + s.d + ':' + s.p + '|' + (s.h || '');

/* « 09:30 » se dit « 9h30 », et « 10:00 » se dit « 10h ». */
const hFr = h => String(h || '').replace(/^0/, '').replace(':', 'h').replace(/h00$/, 'h');

function creneauxOfferts(){
  const l = [];
  (etat.medecins || []).filter(m => MED_OK.indexOf(m.statut) >= 0).forEach(m => {
    (Array.isArray(m.dispos) ? m.dispos : []).forEach(cle => {
      const d = String(cle).slice(0, 10), p = String(cle).slice(11);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !PART_L[p]) return;
      const hs = heuresDuCreneau(m, cle);
      if(hs.length) hs.forEach(h => l.push({m, d, p, h}));
      else l.push({m, d, p, h:''});
    });
  });
  return l.sort((a,b) => a.d.localeCompare(b.d)
    || (a.p === 'matin' ? 0 : 1) - (b.p === 'matin' ? 0 : 1)
    || (a.h || '99:99').localeCompare(b.h || '99:99')
    || nomMed(a.m).localeCompare(nomMed(b.m), 'fr'));
}

function creneauDeCle(cle){
  const [mid, quand, h] = String(cle).split('|');
  const m = (etat.medecins || []).find(x => x.id === mid);
  if(!m) return null;
  return { m, d: quand.slice(0, 10), p: quand.slice(11), h: h || '' };
}

/* Qui occupe ce créneau. On rattache par identifiant quand on
   l'a — le nom d'un médecin peut se corriger, son identifiant
   non. */
function occupantDe(s){
  return (etat.orientes || []).find(o =>
    (o.medecinId ? o.medecinId === s.m.id : o.medecin === nomMed(s.m))
    && o.rdvle === s.d && (o.rdvpart || '') === s.p && (o.rdvh || '') === s.h);
}

function libelleCreneau(s){
  const t = new Date(s.d + 'T12:00:00');
  const j = isNaN(t.getTime()) ? s.d
    : t.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  return j + ' ' + (s.h ? 'à ' + hFr(s.h) : '— ' + PART_L[s.p]);
}

function feuilletAgenda(){
  const tous = creneauxOfferts();
  const auj = aujourdhui();
  const visibles = agendaPasse ? tous : tous.filter(s => s.d >= auj);
  const passes = tous.length - tous.filter(s => s.d >= auj).length;
  const libres = visibles.filter(s => !occupantDe(s));
  const pris = visibles.filter(s => occupantDe(s));
  const aConfirmer = pris.filter(s => (occupantDe(s).confirme || 'À confirmer') === 'À confirmer').length;
  const attente = (etat.orientes || []).filter(enAttenteMed).length;

  let h = `<div class="note">Tous les créneaux proposés par les médecins volontaires, mis bout à bout. Quand une pharmacie appelle, c'est cette page qu'on ouvre : on repère un créneau libre, on y pose la personne, et le cockpit donne aussitôt <strong>le numéro et le courriel du médecin</strong> pour lui dire que c'est calé. Un médecin qui n'a coché qu'une demi-journée apparaît sans heure : elle se convient au téléphone.${attente ? ` <strong style="color:var(--ambre)">${attente}</strong> patient${attente>1?'s attendent':' attend'} encore un médecin.` : ''}${aConfirmer ? ` <strong style="color:var(--ambre)">${aConfirmer}</strong> créneau${aConfirmer>1?'x positionnés restent à confirmer':' positionné reste à confirmer'} avec le médecin.` : ''}</div>

  <div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n" style="color:var(--stable)">${libres.length}</div><div class="l">créneaux libres à venir</div></div>
    <div class="compteur"><div class="n">${pris.length}</div><div class="l">créneaux positionnés</div></div>
    ${aConfirmer ? `<div class="compteur"><div class="n" style="color:var(--ambre)">${aConfirmer}</div><div class="l">à confirmer avec le médecin</div></div>` : ''}
    ${attente ? `<div class="compteur"><div class="n" style="color:var(--ambre)">${attente}</div><div class="l">patients sans créneau</div></div>` : ''}
  </div>

  <div class="filtres">
    <button class="${filtreAgenda==='libres'?'on':''}" onclick="filtrerAgenda('libres')">Créneaux libres <span style="opacity:.6">${libres.length}</span></button>
    <button class="${filtreAgenda==='pris'?'on':''}" onclick="filtrerAgenda('pris')">Positionnés <span style="opacity:.6">${pris.length}</span></button>
    <button class="${filtreAgenda==='tout'?'on':''}" onclick="filtrerAgenda('tout')">Tout <span style="opacity:.6">${visibles.length}</span></button>
  </div>

  <div class="barre-h">
    <span class="cpt-h">${visibles.length} créneau${visibles.length>1?'x':''} au calendrier</span>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    ${passes ? `<button class="btn sec" onclick="basculerAgendaPasse()">${agendaPasse ? 'Masquer' : 'Afficher'} les ${passes} créneau${passes>1?'x':''} passé${passes>1?'s':''}</button>` : ''}
    <button class="btn" onclick="allerFeuilletOri('recueil')">Recueillir un patient</button>
  </div>`;

  if(!tous.length){
    return h + `<div class="carte"><p class="vide">Aucun créneau proposé. L'agenda se remplit tout seul à mesure que les médecins répondent au formulaire en cochant leurs demi-journées — et leurs horaires. Un médecin saisi à la main n'y apparaît que si ses créneaux ont été cochés depuis sa fiche.</p></div>`;
  }

  const vus = filtreAgenda === 'libres' ? libres : filtreAgenda === 'pris' ? pris : visibles;
  if(!vus.length){
    return h + `<div class="carte"><p class="vide">${filtreAgenda === 'libres'
      ? "Plus aucun créneau libre à venir. Relancer les médecins volontaires, ou en solliciter de nouveaux."
      : "Aucun créneau positionné pour le moment."}</p></div>`;
  }

  let jour = null;
  vus.forEach(s => {
    if(s.d !== jour){
      jour = s.d;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === auj ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }
    const o = occupantDe(s);
    const cle = cleCreneau(s);
    const conf = o ? (o.confirme || 'À confirmer') : '';
    h += `<div class="cren ${o ? (conf === 'À confirmer' ? 'attente' : 'pris') : 'libre'}">
      <div class="q">${s.h ? esc(hFr(s.h)) : '—'}<span>${esc(PART_L[s.p])}</span></div>
      <div class="qui">
        <div class="nm">${esc(nomMed(s.m))}</div>
        <div class="s">${[s.m.structure, s.m.commune].filter(Boolean).map(esc).join(' · ') || 'Commune à préciser'}</div>
        ${o ? `<div class="pat">${esc(o.ref || 'Patient')}${o.motif ? ' — ' + esc(o.motif) : ''}${o.relais ? ' · signalé par ' + esc(o.relais) : ''}</div>` : ''}
      </div>
      <div class="act">
        ${o
          ? `<span class="etiq ${conf === 'À confirmer' ? 'e-attente' : 'e-cours'}">${esc(conf)}</span>
             <button class="btn sec" onclick="ouvrirConfirmation('${cle}')">Prévenir le médecin</button>
             <button class="retirer" onclick="libererCreneau('${cle}')">Libérer</button>`
          : `<button class="btn" onclick="ouvrirPositionnement('${cle}')">Positionner un patient</button>`}
      </div>
    </div>`;
  });
  return h;
}

/* --- poser quelqu'un sur un créneau ---------------------- */
function ouvrirPositionnement(cle){
  const s = creneauDeCle(cle);
  if(!s) return toast("Ce créneau n'existe plus");
  const tous = (etat.orientes || []).filter(o => o.statut !== 'Sans suite');
  /* Ceux qui attendent d'abord : c'est pour eux qu'on cherche. */
  const l = tous.slice().sort((a,b) => (enAttenteMed(a) ? 0 : 1) - (enAttenteMed(b) ? 0 : 1)
    || ((a.date||'') + (a.heure||'')).localeCompare((b.date||'') + (b.heure||'')));

  document.getElementById('modale').innerHTML = `<h3>Positionner un patient</h3>
    <p style="color:var(--texte-2);margin:0 0 6px;font-size:13.5px">${esc(nomMed(s.m))}${s.m.commune ? ' — ' + esc(s.m.commune) : ''}</p>
    <p style="margin:0 0 14px;font-family:var(--display);font-weight:600">${esc(libelleCreneau(s))}</p>
    ${s.m.motifs ? `<div class="note" style="margin-bottom:12px">Ce médecin accepte : ${esc(s.m.motifs)}.${s.m.conditions ? ` Conditions posées : ${esc(s.m.conditions)}.` : ''}</div>` : ''}
    ${l.length
      ? `<div class="choix-pat">${l.map(o => `
          <button onclick="positionner('${cle}','${o.id}')">
            <span class="r">${esc(o.ref || 'Patient')}${enAttenteMed(o) ? '' : `<span class="deja">déjà orienté</span>`}</span>
            <span class="d">${[o.motif, o.commune, o.relais, o.delai].filter(Boolean).map(esc).join(' · ') || 'Aucun détail'}</span>
          </button>`).join('')}</div>`
      : `<p class="vide">Aucun patient au registre. Recueillez d'abord la demande de la pharmacie.</p>`}
    <div class="actions">
      <button class="btn sec" onclick="fermer();allerFeuilletOri('recueil')">Recueillir un nouveau patient</button>
      <button class="btn sec" onclick="fermer()">Annuler</button>
    </div>`;
  document.getElementById('rideau').classList.add('on');
}

async function positionner(cle, pid){
  const s = creneauDeCle(cle);
  const o = (etat.orientes || []).find(x => x.id === pid);
  if(!s || !o) return toast("Créneau ou patient introuvable");
  if(occupantDe(s)) return toast("Ce créneau vient d'être pris");

  o.medecin = nomMed(s.m);
  o.medecinId = s.m.id;
  o.rdvle = s.d; o.rdvpart = s.p; o.rdvh = s.h;
  o.confirme = 'À confirmer';
  if(!o.statut || o.statut === 'À orienter' || o.statut === 'Orienté') o.statut = 'Rendez-vous fixé';
  o.modifiePar = moi;
  await sauver();
  /* On enchaîne sur le contact du médecin sans laisser le choix
     de fermer : c'est le geste qui manque le plus souvent. */
  ouvrirConfirmation(cle);
  rendreFond();
}

/* Rafraîchit la page sous la fenêtre sans la refermer. */
function rendreFond(){
  const v = document.getElementById('vue');
  if(v && onglet === 'orientation'){ v.innerHTML = vueOrientation(); majPrintHead(); }
  rendreNav();
}

async function libererCreneau(cle){
  const s = creneauDeCle(cle); if(!s) return;
  const o = occupantDe(s); if(!o) return;
  o.rdvle = ''; o.rdvpart = ''; o.rdvh = ''; o.confirme = '';
  if(o.statut === 'Rendez-vous fixé') o.statut = 'Orienté';
  o.modifiePar = moi;
  await sauver(); rendre();
  toast(`Créneau libéré — ${esc(o.ref || 'le patient')} reste orienté vers ${esc(o.medecin || 'ce médecin')}`);
}

/* --- prévenir le médecin --------------------------------
   L'exigence de la coordination : un créneau posé ne vaut rien
   tant que le médecin ne le sait pas. La fenêtre rend donc son
   numéro, son courriel, et le message tout écrit. */
function messageConfirmation(s, o){
  const quand = libelleCreneau(s);
  return `Bonjour Docteur ${s.m.nom || ''},

La CPTS Pau Béarn vous adresse une personne évacuée des zones incendiées de Gironde, sur le créneau que vous avez proposé : ${quand}.

Motif : ${o.motif || 'à préciser'}.
Référence du dossier : ${o.ref || '—'}${o.relais ? ` — signalée par ${o.relais}` : ''}.

La personne, ou la structure qui la suit, prendra contact avec votre secrétariat. Merci de nous prévenir si ce créneau ne convient plus.

Bien cordialement,
${moi === 'Anonyme' ? 'La coordination' : moi} — CPTS Pau Béarn`;
}

function ouvrirConfirmation(cle){
  const s = creneauDeCle(cle);
  if(!s) return toast("Ce créneau n'existe plus");
  const o = occupantDe(s);
  if(!o) return toast("Ce créneau n'est pas positionné");

  const msg = messageConfirmation(s, o);
  const tel = String(s.m.tel || '').trim();
  const mail = String(s.m.mail || '').trim();
  const sujet = `CPTS Pau Béarn — patient adressé le ${frdateL(s.d)}${s.h ? ' à ' + hFr(s.h) : ''}`;
  const lienMail = mail
    ? `mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(msg)}`
    : '';

  document.getElementById('modale').innerHTML = `<h3>Créneau positionné — prévenir le médecin</h3>
    <p style="margin:0 0 14px;color:var(--texte-2);font-size:13.5px">${esc(o.ref || 'Le patient')} est posé sur le créneau de <strong>${esc(nomMed(s.m))}</strong>, ${esc(libelleCreneau(s))}. Il reste à le lui dire : sans cela, le rendez-vous n'existe que dans le cockpit.</p>

    <div class="contact-med">
      <div class="nm">${esc(nomMed(s.m))}</div>
      <div class="s">${[s.m.structure, s.m.commune].filter(Boolean).map(esc).join(' · ') || ''}</div>
      ${tel || mail ? `<div class="voies">
        ${tel ? `<a class="voie tel" href="tel:${esc(tel.replace(/[^0-9+]/g,''))}"><span class="k">Téléphone</span>${esc(tel)}</a>` : ''}
        ${mail ? `<a class="voie mail" href="${esc(lienMail)}"><span class="k">Courriel</span>${esc(mail)}</a>` : ''}
        ${s.m.rdv ? `<span class="voie"><span class="k">Prise de rendez-vous</span>${esc(s.m.rdv)}</span>` : ''}
      </div>` : `<div class="alerte-med">Ce médecin n'a ni téléphone ni courriel au registre. Complétez sa fiche avant de pouvoir le prévenir — sinon ce créneau ne sert à rien.</div>`}
    </div>

    <label style="margin:14px 0 0"><span class="k">Message tout prêt — à adapter</span>
      <textarea id="msg-conf" style="min-height:190px">${esc(msg)}</textarea></label>

    <div class="actions">
      ${mail ? `<a class="btn" href="${esc(lienMail)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Écrire au médecin</a>` : ''}
      <button class="btn${mail ? ' sec' : ''}" onclick="copierMessageConf()">Copier le message</button>
      ${(o.confirme || 'À confirmer') === 'À confirmer'
        ? `<button class="btn sec" onclick="marquerConfirme('${o.id}')" style="margin-left:auto;color:var(--stable);border-color:#BEDCCE">C'est confirmé avec le médecin</button>`
        : `<span class="etiq e-cours" style="margin-left:auto">${esc(o.confirme)}</span>`}
      <button class="btn sec" onclick="fermer()">Fermer</button>
    </div>`;
  document.getElementById('rideau').classList.add('on');
}

function copierMessageConf(){
  const t = document.getElementById('msg-conf');
  if(!t) return;
  const fini = () => toast("Message copié — collez-le dans votre SMS ou votre courriel");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(fini, () => { t.select(); toast("Sélectionnez le message à la main"); });
  }else{
    t.select();
    try{ document.execCommand('copy'); fini(); }catch(e){ toast("Sélectionnez le message à la main"); }
  }
}

async function marquerConfirme(pid){
  const o = (etat.orientes || []).find(x => x.id === pid); if(!o) return;
  o.confirme = 'Confirmé avec le médecin';
  o.modifiePar = moi;
  await sauver(); fermer(); rendre();
  toast("Créneau confirmé avec le médecin");
}

/* --- recueillir un patient ------------------------------
   Ce feuillet se remplit pendant l'appel, pas après : une
   pharmacie au téléphone, quelqu'un devant elle, et trente
   secondes pour noter. Le formulaire est à même la page —
   pas de fenêtre à ouvrir — et la structure qui appelle est
   le seul champ dont on ne se passe pas : c'est elle qui
   fait entrer la pharmacie dans la liste des relais. */
const cleRelais = s => String(s||'').trim().toLowerCase();

function feuilletRecueil(rel, vivier){
  const opts = (l, sel) => l.map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
  const connues = [...new Set((rel||[]).map(r => (r.structure||'').trim()).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,'fr'));

  return `<div class="note protection">
    <strong>On ne note aucun nom de patient.</strong> Des initiales et un âge suffisent à suivre le dossier ; le nom, la date de naissance et le téléphone restent chez la structure qui a la personne en face d'elle. Demandez-lui d'informer le patient et de recueillir son accord avant que la moindre coordonnée circule.
    <div class="pp">
      <span><span class="k">Ce qu'on demande à la structure</span>Initiales et âge, commune, ce dont la personne a besoin, et sous quel délai.</span>
      <span><span class="k">Ce qu'on lui rend</span>Le nom et le numéro d'un généraliste volontaire — à elle de le remettre au patient.</span>
    </div>
  </div>

  <div class="carte">
    <h2>Recueillir un patient signalé</h2>
    <p class="sous-f" style="margin:0 0 14px">Une ligne par personne signalée. Si la structure appelle pour trois patients, faites trois saisies : c'est ce qui permet de compter les personnes, et pas seulement les appels.</p>
    <div class="form">
      <label><span class="k">Date</span><input type="date" id="rc-date" value="${aujourdhui()}"></label>
      <label><span class="k">Heure de l'appel</span><input type="time" id="rc-heure" value="${maintenant()}"></label>
      <label class="large"><span class="k">Structure qui signale *</span>
        <input id="rc-relais" list="rc-relais-l" placeholder="Pharmacie de la Paix, CMSI de Billère…" autocomplete="off">
        <datalist id="rc-relais-l">${connues.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist></label>
      <label><span class="k">Type de structure</span><select id="rc-provenance">${opts(ORI_PROVENANCES,'Pharmacie')}</select></label>
      <label><span class="k">Interlocuteur au bout du fil</span><input id="rc-qui" placeholder="Prénom, fonction"></label>
      <label class="large"><span class="k">Référence patient — initiales et âge, jamais le nom *</span>
        <input id="rc-ref" placeholder="M. D., 62 ans"></label>
      <label><span class="k">Commune où se trouve le patient</span><input id="rc-commune" placeholder="Pau, Billère…"></label>
      <label><span class="k">Situation du patient</span><select id="rc-situation">${opts(ORI_SITUATIONS,'')}</select></label>
      <label><span class="k">Motif de la demande</span><select id="rc-motif">${opts(ORI_MOTIFS,'')}</select></label>
      <label><span class="k">Délai souhaitable</span><select id="rc-delai">${opts(ORI_DELAIS,'')}</select></label>
      <label class="large"><span class="k">Ce qu'il faut savoir pour orienter (sans élément identifiant)</span>
        <textarea id="rc-detail" placeholder="Traitement chronique à renouveler, gêne respiratoire persistante depuis l'évacuation…"></textarea></label>
      <label><span class="k">Accord du patient pour être orienté et rappelé</span>
        <select id="rc-accord">${opts(ORI_ACCORDS,'À recueillir')}</select></label>
      <label><span class="k">Orienté vers, si c'est déjà décidé</span>
        <select id="rc-medecin"><option></option>${vivier.map(m => `<option>${esc(nomMed(m))}</option>`).join('')}</select></label>
    </div>
    <div class="actions">
      <button class="btn" onclick="enregistrerRecueil()">Enregistrer ce patient</button>
      <button class="btn sec" onclick="allerFeuilletOri('patients')">Voir les patients signalés</button>
      <span class="aide" style="color:var(--texte-2);font-size:13px">La structure qui signale entre d'elle-même dans la liste des relais si elle n'y est pas encore.</span>
    </div>
  </div>

  ${!vivier.length ? `<div class="note"><strong style="color:var(--ambre)">Aucun médecin volontaire n'est encore recensé.</strong> Vous pouvez recueillir les demandes — elles ne pourront pas être fléchées tant que le vivier est vide. Ouvrez le recensement depuis le feuillet <a href="#" onclick="allerFeuilletOri('medecins');return false;">Médecins volontaires</a>.</div>` : ''}`;
}

/* La structure qui signale entre d'elle-même au registre des
   relais : c'est elle qui a fait remonter l'information, elle a
   donc sa place dans la liste, avec le compte de ses appels.
   Si elle y est déjà, on ne touche à rien d'autre que la marque
   « a signalé des patients ». */
function assurerRelais(nom, provenance, commune){
  const n = String(nom||'').trim();
  if(!n) return;
  etat.relais = etat.relais || [];
  const dejaLa = etat.relais.find(r => cleRelais(r.structure) === cleRelais(n));
  if(dejaLa){
    if(!dejaLa.info || dejaLa.info === 'À informer') dejaLa.info = 'A signalé des patients';
    return;
  }
  const type = RELAIS_TYPES.indexOf(provenance) >= 0 ? provenance : '';
  etat.relais.unshift({
    id: uid(), date: aujourdhui(), structure: n, type: type, commune: String(commune||'').trim(),
    adresse:'', interlocuteur:'', tel:'', mail:'',
    info:'A signalé des patients', infoLe:'', canal:'Téléphone',
    liste:'Non', demarche:'À solliciter', par: moi === 'Anonyme' ? '' : moi,
    note:"Entrée automatiquement au registre en signalant un patient.",
    auteur: moi, quand: new Date().toISOString()
  });
}

async function enregistrerRecueil(){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const relais = v('rc-relais'), ref = v('rc-ref');
  if(!relais){ toast("Indiquez la structure qui signale"); document.getElementById('rc-relais')?.focus(); return; }
  if(!ref){ toast("Indiquez une référence patient — initiales et âge"); document.getElementById('rc-ref')?.focus(); return; }

  const medecin = v('rc-medecin');
  etat.orientes = etat.orientes || [];
  etat.orientes.unshift({
    id: uid(), date: v('rc-date') || aujourdhui(), heure: v('rc-heure'),
    ref: ref, provenance: v('rc-provenance'), relais: relais, interlocuteur: v('rc-qui'),
    commune: v('rc-commune'), situation: v('rc-situation'), motif: v('rc-motif'),
    detail: v('rc-detail'), delai: v('rc-delai'), accord: v('rc-accord'),
    medecin: medecin, circuit:'', rdvle:'',
    par: moi === 'Anonyme' ? '' : moi,
    statut: medecin ? 'Orienté' : 'À orienter',
    note:'', auteur: moi, quand: new Date().toISOString()
  });
  assurerRelais(relais, v('rc-provenance'), v('rc-commune'));

  await sauver();
  feuilletOri = 'patients';
  rendre(); window.scrollTo(0,0);
  toast(medecin ? `Patient enregistré et orienté vers ${medecin}` : "Patient enregistré — reste à lui trouver un médecin");
}

/* --- le vivier ------------------------------------------
   Une fiche par médecin, lisible au téléphone : le numéro
   par lequel on prend rendez-vous, ce qu'il accepte de
   prendre, à quel rythme, et s'il autorise la diffusion de
   ses coordonnées aux pharmacies. */
function feuilletMedecins(med, vivier, diffusables, ori){
  const ordre = {'Volontaire':0, 'Sous conditions':1, 'Sollicité':2, 'À solliciter':3,
                 'Sans réponse':4, 'Indisponible':5};
  const tri = [...med].sort((a,b) => (ordre[a.statut] ?? 3) - (ordre[b.statut] ?? 3)
    || nomMed(a).localeCompare(nomMed(b), 'fr'));
  const aVerifier = vivier.filter(m => (m.diffusion || 'À vérifier') === 'À vérifier').length;
  const sansTel = vivier.filter(m => !String(m.tel||'').trim() && !String(m.rdv||'').trim()).length;
  const parFormulaire = med.filter(m => m.source === 'formulaire').length;

  let h = carteFormulaireConsult();
  h += `<div class="note">Un médecin n'entre dans le fléchage que si l'on sait <strong>par quel numéro prendre rendez-vous</strong>, <strong>ce qu'il accepte de prendre</strong> et <strong>combien de patients</strong>. Sa réponse est un service rendu, pas une obligation : les conditions qu'il pose se notent et se respectent. <strong>${diffusables.length}</strong> médecin${diffusables.length>1?'s ont':' a'} accepté que ses coordonnées soient transmises aux pharmacies et aux structures — ce sont les seul${diffusables.length>1?'s':''} dont le nom peut sortir du cockpit.${aVerifier ? ` <strong style="color:var(--ambre)">${aVerifier}</strong> accord${aVerifier>1?'s de diffusion restent à vérifier':' de diffusion reste à vérifier'}.` : ''}${sansTel ? ` <strong style="color:var(--ambre)">${sansTel}</strong> volontaire${sansTel>1?'s sont injoignables':' est injoignable'} faute de numéro.` : ''}</div>
  <div class="barre-h">
    <span class="cpt-h">${med.length} médecin${med.length>1?'s':''} au registre${parFormulaire ? ` · ${parFormulaire} par le formulaire` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('medecins')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn sec" onclick="ouvrirAjout('medecins','manuel')">Reporter une réponse</button>
    <button class="btn" onclick="ouvrirAjout('medecins')">Ajouter un médecin</button>
  </div>`;

  if(!med.length) return h + `<div class="carte"><p class="vide">Aucun médecin sondé. Le vivier se remplit de trois façons : par le formulaire en ligne une fois le recensement ouvert, en appelant les généralistes du territoire un par un, ou en reportant une réponse arrivée autrement.</p></div>`;

  /* Les réponses arrivées par le formulaire se filtrent à part :
     ce sont celles qu'il reste à confirmer au téléphone. */
  if(parFormulaire){
    const nb = r => r === 'Formulaire' ? parFormulaire
      : r === 'Tout' ? med.length
      : med.filter(m => (m.statut || 'À solliciter') === r).length;
    const filtres = ['Tout','Formulaire'].concat(MED_STATUTS.filter(s => nb(s)));
    h += `<div class="filtres">${filtres.map(r =>
      `<button class="${filtreMed===r?'on':''}" onclick="filtrerMed('${r}')">${r === 'Formulaire' ? 'Réponses au formulaire' : esc(r)}${r!=='Tout'?` <span style="opacity:.6">${nb(r)}</span>`:''}</button>`).join('')}</div>`;
  }
  const vus = filtreMed === 'Tout' || !parFormulaire ? tri
    : filtreMed === 'Formulaire' ? tri.filter(m => m.source === 'formulaire')
    : tri.filter(m => (m.statut || 'À solliciter') === filtreMed);
  if(!vus.length) return h + `<div class="carte"><p class="vide">Aucun médecin dans ce filtre.</p></div>`;

  h += `<div class="stocks">`;
  vus.forEach(o => {
    const st = o.statut || 'À solliciter';
    const cl = MED_OK.indexOf(st) >= 0 ? 'confirme' : st === 'Indisponible' ? 'ecarte' : '';
    const recus = ori.filter(x => x.medecin === nomMed(o)).length;
    const cren = creneauxGroupes(o);
    h += `<div class="stock ${cl}">
      <div>
        <div class="nom">${esc(nomMed(o))}${o.source === 'formulaire'
          ? `<span class="src-f">Formulaire</span>${o.aVerifier ? `<span class="src-f neuf">À confirmer</span>` : ''}`
          : o.source === 'saisie' ? `<span class="src-f saisie">Saisie à la main</span>` : ''}</div>
        <div style="font-size:13px;color:var(--texte-2);margin-top:2px">${[o.structure, o.commune].filter(Boolean).map(esc).join(' · ') || 'Structure et commune à préciser'}</div>
        <div style="margin-top:6px"><span class="etiq ${MED_ET[st] || 'e-attente'}">${esc(st)}</span></div>
      </div>
      ${o.motifs ? `<div class="bl"><span class="k">Accepte de prendre</span>${esc(o.motifs)}</div>` : `<div class="obs">Ce qu'il ou elle accepte de prendre reste à préciser.</div>`}
      ${o.capacite ? `<div class="bl"><span class="k">Nombre de patients</span>${esc(o.capacite)}</div>` : ''}
      ${cren.length
        ? `<div class="bl"><span class="k">Créneaux cochés sur le calendrier</span>
             <span class="agenda-l">${cren.map(c => `<span><b>${esc(c.jour)}</b> ${esc(c.parts.join(' et '))}</span>`).join('')}</span></div>`
        : o.creneaux ? `<div class="bl"><span class="k">Créneaux proposés</span><span class="horaires">${esc(o.creneaux)}</span></div>` : ''}
      ${o.delai ? `<div class="bl"><span class="k">Délai de rendez-vous</span>${esc(o.delai)}</div>` : ''}
      ${o.rdv ? `<div class="bl"><span class="k">Prise de rendez-vous</span>${esc(o.rdv)}</div>` : ''}
      ${o.mt && o.mt !== 'À préciser' ? `<div class="bl"><span class="k">Médecin traitant si besoin</span>${esc(o.mt)}</div>` : ''}
      ${o.conditions ? `<div class="obs">Conditions posées : ${esc(o.conditions)}</div>` : ''}
      ${MED_OK.indexOf(st) >= 0 ? (o.diffusion === 'Oui'
        ? `<div class="bl"><span class="k">Diffusion de ses coordonnées</span>Acceptée</div>`
        : `<div class="obs">${o.diffusion === 'Non' ? "Refuse que ses coordonnées soient diffusées : orienter uniquement par la CPTS." : "Accord de diffusion à vérifier avant de transmettre son nom aux pharmacies."}</div>`) : ''}
      ${o.note ? `<div class="obs">${esc(o.note)}</div>` : ''}
      ${recus ? `<div class="oriente">${recus} patient${recus>1?'s':''} orienté${recus>1?'s':''} vers ce médecin</div>` : ''}
      <div class="liens">
        ${o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>` : ''}
        ${o.adresse ? `<a class="adr" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.adresse)}" target="_blank" rel="noopener">${esc(o.adresse)}</a>` : ''}
      </div>
      <div style="display:flex;gap:7px">
        <button class="retirer" onclick="ouvrirEdition('medecins','${o.id}')">Modifier</button>
        <button class="retirer" onclick="supprimer('medecins','${o.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

/* --- les patients ---------------------------------------
   Une ligne par demande reçue, de la remontée de la pharmacie
   au rendez-vous obtenu. Ce qui n'a pas encore de médecin
   remonte en tête : c'est ce qui reste à faire. */
function feuilletPatients(ori, vivier){
  const attente = ori.filter(enAttenteMed);
  const sansAccord = ori.filter(o => (o.accord || 'À recueillir') === 'À recueillir'
    && o.statut !== 'Sans suite').length;

  let h = `<div class="note">Chaque personne signalée par une pharmacie ou une structure a sa ligne, <strong>même sans médecin à ce jour</strong> : c'est ce registre qui dit combien de personnes le dispositif a absorbées et combien attendent encore. Le médecin et le statut se choisissent <strong>directement sur la ligne</strong> — pas besoin d'ouvrir la fiche. Le registre est pseudonymisé : ni nom, ni téléphone, ni détail clinique.${!vivier.length ? ` <strong style="color:var(--ambre)">Aucun médecin volontaire n'est encore recensé :</strong> les demandes peuvent être enregistrées, elles ne pourront pas être fléchées.` : ''}${sansAccord ? ` <strong style="color:var(--ambre)">${sansAccord}</strong> demande${sansAccord>1?'s dont l\'accord du patient reste à recueillir' : ' dont l\'accord du patient reste à recueillir'}.` : ''}</div>
  <div class="barre-h">
    <span class="cpt-h">${ori.length} patient${ori.length>1?'s':''} signalé${ori.length>1?'s':''}${attente.length ? ` · ${attente.length} sans médecin` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('orientes')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    ${ori.length ? `<button class="btn sec" onclick="anonymiserOrientes()">Anonymiser le registre</button>` : ''}
    <button class="btn" onclick="allerFeuilletOri('recueil')">Recueillir un patient</button>
  </div>`;

  if(!ori.length) return h + `<div class="carte"><p class="vide">Aucun patient signalé. Le suivi s'ouvre au premier appel d'une pharmacie ou d'une structure de soins non programmés — la saisie se fait dans <a href="#" onclick="allerFeuilletOri('recueil');return false;">Recueillir un patient</a>.</p></div>`;

  const lignes = chrono('orientes', ori);
  const manuel = estManuel('orientes');
  let jour = null;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }
    const st = o.statut || 'À orienter';
    const quand = manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' à ') : o.heure;
    const chips = [[o.relais,"Structure qui signale"],[o.interlocuteur,"Interlocuteur"],
                   [o.provenance,"Type"],[o.motif,"Motif"],
                   [o.commune,"Commune"],[o.situation,"Situation"],[o.delai,"Délai souhaitable"]]
      .filter(x => x[0]).map(x => `<span><span class="k">${x[1]}</span>${esc(x[0])}</span>`).join('');
    const pied = [o.par ? 'Orientation par ' + o.par : (o.auteur ? 'Saisi par ' + o.auteur : ''),
                  o.modifiePar ? 'Modifié par ' + o.modifiePar : '']
      .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

    h += `<article class="ent-r ${estOriente(o) ? (aRendezVous(o) ? 't-fini' : 't-cours')
        : st === 'Sans suite' ? 't-fini' : 't-attente'}">
      <div class="haut">
        ${quand ? `<span class="hr">${esc(quand)}</span>` : ''}
        <span class="etiq ${ETIQ_REG[st] || 'e-attente'}">${esc(st)}</span>
        <span class="outils">
          ${fleches('orientes', o.id, i, lignes.length)}
          <button title="Modifier" onclick="ouvrirEdition('orientes','${o.id}')">✎</button>
          <button title="Supprimer" onclick="supprimer('orientes','${o.id}')">×</button>
        </span>
      </div>
      <div class="ti">${esc(o.ref) || 'Référence non précisée'}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${o.detail ? `<div class="bloc"><span class="k">Ce qu'il faut savoir pour orienter</span><div class="v">${esc(o.detail)}</div></div>` : ''}
      <div class="flechage">
        <label><span class="k">Orienté vers</span>
          <select onchange="orienterPatient('${o.id}', this.value)">
            <option value="">— aucun médecin désigné —</option>
            ${vivier.map(m => `<option ${nomMed(m) === o.medecin ? 'selected' : ''}>${esc(nomMed(m))}</option>`).join('')}
            ${o.medecin && !vivier.some(m => nomMed(m) === o.medecin)
              ? `<option selected>${esc(o.medecin)}</option>` : ''}
          </select></label>
        <label><span class="k">Où en est-on</span>
          <select onchange="majPatient('${o.id}','statut', this.value)">
            ${ORI_STATUTS.map(s => `<option ${s === st ? 'selected' : ''}>${esc(s)}</option>`).join('')}
          </select></label>
        <label><span class="k">Rendez-vous fixé le</span>
          <input type="date" value="${esc(o.rdvle||'')}" onchange="majPatient('${o.id}','rdvle', this.value)"></label>
      </div>
      ${o.rdvle ? `<div class="bloc"><span class="k">Créneau</span><div class="v">${esc(frdateL(o.rdvle))}${o.rdvh ? ' à ' + esc(hFr(o.rdvh)) : (o.rdvpart ? ' — ' + esc(PART_L[o.rdvpart] || o.rdvpart) : '')}${o.confirme ? ` · ${esc(o.confirme)}` : ''}</div></div>` : ''}
      ${estOriente(o) && o.circuit ? `<div class="bloc"><span class="k">Circuit suivi</span><div class="v">${esc(o.circuit)}</div></div>` : ''}
      ${(o.accord || 'À recueillir') === 'À recueillir' && st !== 'Sans suite'
        ? `<div class="bloc"><span class="k">Accord du patient</span><div class="v">À recueillir par la structure qui le reçoit avant que ses coordonnées ne circulent.</div></div>`
        : o.accord === 'Non' ? `<div class="bloc"><span class="k">Accord du patient</span><div class="v">Refusé — aucune coordonnée ne doit circuler. Lui remettre le nom et le numéro du médecin, à lui d'appeler.</div></div>` : ''}
      ${o.note ? `<div class="bloc"><span class="k">Observation</span><div class="v">${esc(o.note)}</div></div>` : ''}
      ${pied ? `<div class="pied">${pied}</div>` : ''}
    </article>`;
  });
  return h;
}

/* Orienter depuis la ligne : c'est le geste le plus fréquent du
   feuillet — un médecin se libère, on lui adresse la personne qui
   attend depuis le plus longtemps. Il ne mérite pas d'ouvrir une
   fenêtre. Désigner un médecin fait passer la ligne à « Orienté »
   si elle attendait encore ; l'enlever la ramène à « À orienter ». */
async function orienterPatient(id, medecin){
  const o = (etat.orientes||[]).find(x => x.id === id); if(!o) return;
  o.medecin = medecin;
  /* On retient aussi l'identifiant : c'est par lui que l'agenda
     rattache le patient au créneau, et un nom peut se corriger. */
  const m = (etat.medecins||[]).find(x => nomMed(x) === medecin);
  o.medecinId = m ? m.id : '';
  if(!medecin){ o.rdvle = ''; o.rdvpart = ''; o.rdvh = ''; o.confirme = ''; }
  if(medecin && (!o.statut || o.statut === 'À orienter')) o.statut = 'Orienté';
  if(!medecin && o.statut === 'Orienté') o.statut = 'À orienter';
  o.modifiePar = moi;
  await sauver(); rendre();
  toast(medecin ? `Patient orienté vers ${medecin}` : "Médecin retiré de la ligne");
}
async function majPatient(id, champ, valeur){
  const o = (etat.orientes||[]).find(x => x.id === id); if(!o) return;
  o[champ] = valeur;
  o.modifiePar = moi;
  await sauver(); rendre();
}

/* Une fois la crise passée, le registre n'a plus à porter de
   quoi remonter à quelqu'un : les compteurs suffisent au retour
   d'expérience et au bilan ACI. L'anonymisation efface la
   référence patient, les précisions et les observations, et
   garde le reste — motif, commune, délai, médecin, dates. Elle
   est définitive : c'est le but. */
async function anonymiserOrientes(){
  const n = (etat.orientes || []).length;
  document.getElementById('modale').innerHTML = `<h3>Anonymiser le registre des patients&nbsp;?</h3>
    <p style="color:var(--texte-2)">Les ${n} ligne${n>1?'s':''} du registre perdront leur référence patient, leurs précisions et leurs observations. Le reste est conservé : date, commune, motif, délai, médecin vers qui le patient a été orienté, statut. Les compteurs et le bilan ne bougent pas.</p>
    <p style="color:var(--braise)">L'opération est définitive et vaut pour tous les postes connectés. À faire une fois la crise passée, ou dès qu'une ligne n'a plus besoin d'être suivie.</p>
    <div class="actions"><button class="btn" onclick="confirmerAnonymisation()">Anonymiser</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function confirmerAnonymisation(){
  (etat.orientes || []).forEach((o, i) => {
    o.ref = 'Patient ' + (i + 1);
    o.detail = ''; o.note = '';
    o.anonymise = new Date().toISOString();
  });
  await sauver(); fermer(); rendre();
  toast("Registre anonymisé — les compteurs sont conservés");
}

/* --- les relais -----------------------------------------
   Les points d'entrée. Deux choses s'y mesurent, et ce ne sont
   pas les mêmes : une pharmacie informée du circuit, et une
   pharmacie qui accepte d'entrer dans la démarche — repérer les
   personnes évacuées au comptoir, les signaler, leur remettre le
   nom d'un médecin. La seconde seule fait vivre le dispositif.
   Celles qui ont déjà signalé un patient y entrent d'elles-mêmes,
   à la saisie : leurs appels remontent depuis le recueil. */
function feuilletRelais(rel, ori, diffusables){
  const ordre = {'Oui':0, 'En attente de réponse':1, 'À solliciter':2, 'Non':3};
  const tri = [...rel].sort((a,b) => (ordre[a.demarche] ?? 2) - (ordre[b.demarche] ?? 2)
    || (a.structure||'').localeCompare(b.structure||'', 'fr'));
  const aSolliciter = rel.filter(r => !r.demarche || r.demarche === 'À solliciter').length;
  const partenaires = rel.filter(r => r.demarche === 'Oui').length;
  const appels = o => ori.filter(x => cleRelais(x.relais) === cleRelais(o.structure));

  let h = `<div class="note">Ces structures reçoivent les patients avant nous : c'est par elles que le fléchage passe. <strong>${partenaires}</strong> ${partenaires>1?'ont accepté':'a accepté'} d'entrer dans la démarche. Leur transmettre la liste des <strong>${diffusables}</strong> médecin${diffusables>1?'s':''} ayant accepté la diffusion de leurs coordonnées, et leur rappeler de <strong>signaler chaque personne orientée</strong> — c'est ce qui permet de compter.${aSolliciter ? ` <strong style="color:var(--ambre)">${aSolliciter}</strong> structure${aSolliciter>1?'s restent à solliciter':' reste à solliciter'}.` : ''}</div>
  <div class="barre-h">
    <span class="cpt-h">${rel.length} structure${rel.length>1?'s':''}${partenaires ? ` · ${partenaires} dans la démarche` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('relais')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('relais')">Ajouter une structure</button>
  </div>`;

  if(!rel.length) return h + `<div class="carte"><p class="vide">Aucune structure enregistrée. Commencer par celles qui ont déjà appelé — le CMSI de Billère et les pharmacies qui l'ont sollicité. Toute structure qui signale un patient depuis le feuillet <a href="#" onclick="allerFeuilletOri('recueil');return false;">Recueillir un patient</a> entre ici d'elle-même.</p></div>`;

  h += `<div class="stocks">`;
  tri.forEach(o => {
    const dem = o.demarche || 'À solliciter';
    const info = o.info || 'À informer';
    const cl = dem === 'Oui' ? 'confirme' : dem === 'Non' ? 'ecarte' : '';
    const siens = appels(o);
    const dernier = siens.map(x => x.date).filter(Boolean).sort().pop();
    h += `<div class="stock ${cl}">
      <div>
        <div class="nom">${esc(o.structure)}</div>
        <div style="font-size:13px;color:var(--texte-2);margin-top:2px">${[o.type, o.commune].filter(Boolean).map(esc).join(' · ') || 'Type et commune à préciser'}</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="etiq ${dem === 'Oui' ? 'e-cours' : dem === 'Non' ? 'e-fini' : 'e-attente'}">${dem === 'Oui' ? 'Dans la démarche' : dem === 'Non' ? "N'y entre pas" : dem}</span>
          <span class="etiq ${info === 'À informer' ? 'e-attente' : info === 'Sans réponse' ? 'e-fini' : 'e-lancer'}">${esc(info)}</span>
        </div>
      </div>
      ${o.interlocuteur ? `<div class="bl"><span class="k">Interlocuteur</span>${esc(o.interlocuteur)}</div>` : `<div class="obs">Interlocuteur à nommer.</div>`}
      ${o.infoLe ? `<div class="bl"><span class="k">Informée le</span>${frdateL(o.infoLe)}${o.canal ? ' · ' + esc(o.canal) : ''}</div>` : ''}
      ${o.liste === 'Oui'
        ? `<div class="bl"><span class="k">Liste des médecins</span>Transmise</div>`
        : o.liste === 'Sans objet' ? '' : `<div class="obs">Liste des médecins volontaires pas encore transmise.</div>`}
      ${o.note ? `<div class="obs">${esc(o.note)}</div>` : ''}
      ${siens.length
        ? `<div class="oriente">${siens.length} patient${siens.length>1?'s':''} signalé${siens.length>1?'s':''}${dernier ? `, le dernier le ${frdateL(dernier)}` : ''}
             <button class="retirer" style="margin-left:6px" onclick="allerFeuilletOri('patients')">Voir</button></div>`
        : ''}
      <div class="liens">
        ${o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>` : ''}
        ${o.adresse ? `<a class="adr" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.adresse)}" target="_blank" rel="noopener">${esc(o.adresse)}</a>` : ''}
      </div>
      <div style="display:flex;gap:7px">
        <button class="retirer" onclick="ouvrirEdition('relais','${o.id}')">Modifier</button>
        <button class="retirer" onclick="supprimer('relais','${o.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

const DOSSIER = ['ars','courante','terrain','materiel','dons','stockage','renforts','volontaires','medecins','orientes','relais'];

function tableauFige(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<p class="vide">Aucune ligne.</p>`;
  const ent = cfg.cols.map(c => c==='date' ? 'Date' : c==='auteur' ? 'Saisi par' : ((cfg.f.find(x=>x.c===c)||{}).l || c));
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}</tr></thead><tbody>`;
  lignes.forEach(l => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel' || c === 'rdvle' || c === 'infoLe' || c === 'apartir') v = frdate(v);
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

function vueDossier(){
  let h = `<h1>Dossier de traçabilité</h1>
  <div style="font-family:var(--display);font-weight:600;font-size:16px;color:var(--encre);margin:-2px 0 6px">CPTS Pau Béarn</div>
  <p class="chapo">L'ensemble des éléments tracés par la CPTS Pau Béarn depuis le début de sa mobilisation dans le cadre du plan blanc régional / ORSAN AMAVI, mis bout à bout pour être imprimés ou enregistrés en PDF. C'est la pièce à joindre au retour d'expérience et au bilan.</p>
  <div class="barre-h">
    <button class="btn sec" onclick="exporterTout()">Tout en Excel</button>
    <button class="btn" onclick="imprimer()">Imprimer ou enregistrer en PDF</button>
  </div>
  <div class="carte"><h2>Organisation</h2>${organigramme() || '<p class="vide">Aucun pilote désigné.</p>'}</div>
  <div class="carte"><h2>Fiches mission</h2>` +
  etat.missions.map(m => {
    const f = m.fiche || {};
    const li = lignes(f.faire);
    return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--trait)">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(m.titre)}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 7px">Pilote : ${esc(m.pilote)||'à désigner'} · Suppléant : ${esc(m.suppleant)||'—'} · Mandat ARS : ${esc(m.mandat)} · ${esc(m.statut)}</div>
      ${f.but?`<div style="font-size:13.5px"><em>${esc(f.but)}</em></div>`:''}
      ${li.length?`<ul style="margin:6px 0 0;padding-left:19px;font-size:13.5px">${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${f.limite?`<div style="font-size:13px;color:var(--braise);margin-top:6px">Ce qu'on ne fait pas : ${esc(f.limite)}</div>`:''}
    </div>`;
  }).join('') + `</div>`;

  DOSSIER.forEach(k => {
    h += `<h2 style="margin-top:24px">${esc(CHAMPS[k].titre)}</h2>${tableauFige(k)}`;
  });

  /* Les points de collecte ne sont pas une liste de fiches mais
     des permanences chiffrées : chacun est repris avec sa
     synthèse et son détail, comme dans son récapitulatif. */
  h += `<h2 style="margin-top:24px">Points de collecte tenus</h2>`;
  const pts = pointsTries();
  if(!pts.length) h += `<p class="vide">Aucun point de collecte tenu.</p>`;
  pts.forEach(p => {
    const s = synthesePoint(p);
    h += `<div class="carte" style="margin-bottom:14px">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(p.lieu)} — ${frdateL(p.date)}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 9px">
        ${esc(p.statut||'Ouvert')} · créneau ${esc(p.debut||'—')} – ${esc(p.fin||'—')}${p.cloture ? ', clôturé à ' + esc(p.cloture) : ''} ·
        responsable : ${esc(p.responsable) || 'à nommer'}${p.destination ? ' · destination : ' + esc(p.destination) : ''}
      </div>
      <div style="font-size:13.5px;margin-bottom:8px"><strong>${s.unites} unités</strong> déposées par <strong>${s.deposants.length} déposants</strong> en ${s.lignes} lignes${p.colis ? ', ' + esc(p.colis) + ' colis' : ''}${
        s.parMat.length ? ' — ' + s.parMat.map(m => m.quantite + ' ' + esc(m.materiel.toLowerCase())).join(', ') : ''}.</div>
      ${p.acheminement ? `<div style="font-size:13px;color:var(--texte-2);margin-bottom:8px">Acheminement : ${esc(p.acheminement)}</div>` : ''}
      ${s.deposants.length ? `<div class="tw"><table><thead><tr><th>Déposant</th><th>Qualité</th><th>Matériel déposé</th></tr></thead><tbody>` +
        s.deposants.map(d => `<tr><td>${esc(d.deposant)}</td><td>${esc(d.qualite)||'—'}</td><td>${
          d.lignes.map(l => esc(l.materiel) + ' (' + qte(l) + ')').join(', ')}</td></tr>`).join('') + `</tbody></table></div>` : ''}
      ${p.observations ? `<div style="font-size:12.5px;color:var(--texte-2);margin-top:9px;white-space:pre-line">${esc(p.observations)}</div>` : ''}
      ${(p.pieces||[]).length ? `<div style="font-size:12.5px;color:var(--texte-2);margin-top:9px">Pièces jointes : ${
        p.pieces.map(x => esc(x.nom)).join(', ')}</div>` : ''}
    </div>`;
  });

  h += `<h2 style="margin-top:24px">Appels aux CPTS</h2><div class="tw"><table>
    <thead><tr><th>CPTS</th><th>Proximité</th><th>Statut</th><th>Date</th><th>Interlocuteur</th><th>Ce qui a été dit</th><th>Suite</th><th>Par</th></tr></thead><tbody>` +
    (etat.cpts||[]).map(c => {
      const a = antechrono(c.appels);
      if(!a.length) return `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td colspan="5">—</td></tr>`;
      return a.map(x => `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td>${frdate(x.date)} ${esc(x.heure||'')}</td><td>${esc(x.qui)||'—'}</td><td>${esc(x.dit)}</td><td>${esc(x.suite)||'—'}</td><td>${esc(x.par)}</td></tr>`).join('');
    }).join('') + `</tbody></table></div>`;
  return h;
}

function vueCollection(k){
  const cfg = CHAMPS[k];
  const n = (etat[k] || []).length;
  const j = !!JOURNAL[k];
  return `<h1>${cfg.titre}</h1><p class="chapo">${cfg.chapo}</p>
    <div class="barre-h"><span class="cpt-h">${n} ${j ? 'entrée' : 'ligne'}${n>1?'s':''}${j ? ' · de la plus récente à la plus ancienne' : ''}</span>
      <button class="btn sec" onclick="exporterCSV('${k}')">Excel</button>
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('${k}')">Ajouter</button></div>
    ${barreOrdre(k)}
    ${j ? journal(k) : tableau(k)}`;
}

function majPrintHead(){
  const el = document.getElementById('printhead');
  if(!el) return;
  const o = ONGLETS.find(x => x.id === onglet);
  el.innerHTML = `<div class="t">CPTS Pau Béarn — ${esc(o ? o.nom : 'Dossier de traçabilité')}</div>
    <div class="d">${esc(etat.entete.niveau)} · édité le ${new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${moi!=='Anonyme'?' par '+esc(moi):''}</div>`;
}

function rendre(){
  normaliserPersonnes();
  rendreNav();
  rendreMesMissions();
  const v = document.getElementById('vue');
  if(onglet === 'cockpit') v.innerHTML = vueCockpit();
  else if(onglet === 'missions') v.innerHTML = vueMissions();
  else if(onglet === 'veille') v.innerHTML = vueVeille();
  else if(onglet === 'fil') v.innerHTML = vueFil();
  else if(onglet === 'lignes') v.innerHTML = vueLignes();
  else if(onglet === 'offre') v.innerHTML = vueOffre();
  else if(onglet === 'appels') v.innerHTML = vueAppels();
  else if(onglet === 'materiel') v.innerHTML = vueCollecte();
  else if(onglet === 'volontaires') v.innerHTML = vueRenfort();
  else if(onglet === 'orientation') v.innerHTML = vueOrientation();
  else if(onglet === 'dossier') v.innerHTML = vueDossier();
  else v.innerHTML = vueCollection(onglet);
  v.insertAdjacentHTML('afterbegin', '<div class="entete-print" id="printhead"></div>');
  majPrintHead();
}

charger();
</script>
</body>
</html>
