  'Collectivités':               "Le terrain logistique : centres d'accueil, dons, hébergement.",
  'Presse':                      "Ce qui sort avant les canaux officiels, et ce que voient nos adhérents.",
  'Autres canaux':               "Les canaux ajoutés en cours de crise."
};
const IMPACTS = {
  direct:    {l:"Impact direct sur le 64", c:'imp-direct',     d:"Change quelque chose pour nos adhérents ou leurs patients dès maintenant."},
  surveiller:{l:"À surveiller",            c:'imp-surveiller', d:"Pas d'effet immédiat chez nous, mais ça peut basculer."},
  contexte:  {l:"Contexte",                c:'imp-contexte',   d:"On le note pour comprendre la situation, sans action attendue."}
};
const SUITES = {
  rien:      {l:"Rien à faire"},
  copil:     {l:"À porter au copil"},
  ars:       {l:"À poser en question à l'ARS"},
  adherents: {l:"À relayer aux adhérents"}
};
let tourVeille = null;      // {liste:[ids], i, retenues, passees}
let brouillonVeille = null;
let brouillonPoint = null;
let famillesRepliees = {};  // famille -> true quand on la replie à la main
/* Le mode d'emploi reste ouvert tant qu'on ne l'a pas replié soi-même :
   c'est la première chose que voit qui prend la veille. */
let guideVeille = (() => { try{ return localStorage.getItem('cpts64_guide_veille') !== 'ferme'; }catch(e){ return true; } })();
function basculerGuide(){
  guideVeille = !guideVeille;
  try{ localStorage.setItem('cpts64_guide_veille', guideVeille ? 'ouvert' : 'ferme'); }catch(e){}
  rendre();
}

const horodate = () => aujourdhui() + ' ' + maintenant();
function heuresDepuis(q){
  if(!q) return Infinity;
  const t = new Date(q.slice(0,10) + 'T' + (q.slice(11,16) || '00:00') + ':00');
  return isNaN(t) ? Infinity : (Date.now() - t) / 36e5;
}
function depuisTexte(q){
  if(!q) return "Jamais ouvert";
  const h = heuresDepuis(q);
  if(h < 1) return "Ouvert à l'instant";
  if(h < 24) return "Ouvert il y a " + Math.round(h) + " h";
  const j = Math.floor(h / 24);
  return "Ouvert il y a " + j + " jour" + (j > 1 ? 's' : '');
}
/* Une source est « due » selon son rythme : les canaux de premier
   plan à chaque tour, les autres une fois par jour. Un canal jamais
   ouvert l'est toujours. */
function sourceDue(o){
  if(!o.verifieLe) return true;
  if((o.rythme || 'Chaque tour') === 'Une fois par jour') return o.verifieLe.slice(0,10) !== aujourdhui();
  return heuresDepuis(o.verifieLe) >= SEUIL_VEILLE_H;
}
const sourcesTriees = () => [...(etat.sources||[])].sort((a,b) => (a.verifieLe||'').localeCompare(b.verifieLe||''));
const rubriques = () => etat.rubriques || [];
const rubriqueDe = id => rubriques().find(r => r.id === id);
const nomPoint = id => { const r = rubriqueDe(id); return r ? r.nom : ''; };
/* Un point non réécrit depuis un demi-tour d'horloge est à
   rafraîchir : c'est ce qui donne sa liste de travail à qui prend
   la veille. Un point jamais écrit l'est toujours. */
const pointARafraichir = r => !r.maj || heuresDepuis(r.maj) >= SEUIL_POINT_H;
const infosDuPoint = id => (etat.veille||[]).filter(i => (i.rubrique||'') === id);
/* Qui tient la veille : le pilote de la mission rattachée à cet
   espace. Une seule source de vérité, dans Missions & organigramme. */
const missionVeille = () => (etat.missions||[]).find(m => espaceDe(m) === 'veille');

function vueVeille(){
  const m = missionVeille();
  const pilote = m && m.pilote ? m.pilote : '';
  const dues = sourcesTriees().filter(sourceDue);
  const jamais = (etat.sources||[]).filter(o => !o.verifieLe);
  const attente = (etat.veille||[]).filter(i => i.suiteEtat === 'ouvert');
  const duJour = (etat.veille||[]).filter(i => i.date === aujourdhui());
  const dernier = sourcesTriees().filter(o => o.verifieLe).map(o => o.verifieLe).sort().pop();

  const arafraichir = rubriques().filter(pointARafraichir);

  let h = `<h1>Situation régionale</h1>
  <p class="chapo">Le poste de veille de la CPTS Pau Béarn. ${rubriques().length} points de situation à tenir à jour, ${(etat.sources||[]).length} canaux officiels rangés par famille pour les alimenter. On passe les canaux en revue deux fois par jour, on retient ce qui a un impact sur le territoire, on range chaque information dans son point, et on décide de la suite à donner.</p>`;

  /* --- qui tient la veille, et où en est le tour --- */
  h += `<div class="poste ${pilote ? '' : 'vacant'}">
    <div class="qui">
      <span class="k">Veille tenue par</span>
      <div class="nom">${pilote ? esc(pilote) : 'Personne'}</div>
      <div class="depuis">${pilote
        ? `Mission « ${esc(m.titre)} »${m.suppleant ? ' · suppléance : ' + esc(m.suppleant) : ''}`
        : "Aucun pilote nommé sur la mission de veille — la page ne se tiendra pas toute seule."}</div>
      <div class="actions" style="margin-top:11px">
        <button class="btn ${pilote ? 'sec' : ''}" onclick="passerLaMain()">${pilote ? 'Passer la main' : 'Nommer qui tient la veille'}</button>
      </div>
    </div>
    <div class="tours">
      <div class="tour-t ${dernier ? 'fait' : ''}">
        <div class="q">Dernier passage</div>
        <div class="v">${dernier
          ? `<b>${frdate(dernier.slice(0,10))} à ${esc(dernier.slice(11,16))}</b><br>${(etat.sources||[]).length - dues.length} ${(etat.sources||[]).length - dues.length > 1 ? 'canaux' : 'canal'} à jour sur ${(etat.sources||[]).length}`
          : `<b>Aucun</b><br>Le tour n'a jamais été fait`}</div>
      </div>
      <div class="tour-t ${dues.length ? 'du' : 'fait'}">
        <div class="q">Tour en cours</div>
        <div class="v">${dues.length
          ? `<b>${dues.length} ${dues.length > 1 ? 'canaux' : 'canal'} à repasser</b><br>${jamais.length ? 'dont ' + jamais.length + ' jamais ouvert' + (jamais.length > 1 ? 's' : '') : 'tous déjà ouverts au moins une fois'}`
          : `<b>À jour</b><br>Rien à repasser pour l'instant`}</div>
      </div>
    </div>
  </div>`;

  /* --- les quatre gestes, pour qui prend la veille --- */
  h += `<div class="repli guide">
    <button class="tete" onclick="basculerGuide()">
      <div>
        <div class="t">Tenir cette veille : les quatre gestes</div>
        <div class="s">${guideVeille ? "À replier une fois la main prise" : "Déplier si vous prenez la veille pour la première fois"}</div>
      </div>
      <span class="chev">${guideVeille ? '▾' : '▸'}</span>
    </button>
    ${guideVeille ? `<div class="dedans"><ol class="gestes-g">
      <li><b>Passer les canaux au crible</b>, famille par famille — ARS, préfectures, URPS et ordres, environnement, presse. Deux fois par jour : le matin, et en fin d'après-midi. Le tour vous les présente un par un, les moins récemment ouverts d'abord.</li>
      <li><b>Retenir ce qui compte pour le Béarn.</b> Une phrase, le lien vers la source, et l'impact sur le 64. Sur un canal où rien n'a bougé, « rien de neuf » suffit : le canal est daté et on passe au suivant.</li>
      <li><b>Ranger l'information dans un point de situation.</b> Avancée des feux, situation sanitaire, consignes aux libéraux… C'est ce classement qui rend la veille lisible pour le reste de l'équipe.</li>
      <li><b>Réécrire le point dans la foulée.</b> Quelques lignes sur ce qu'on sait maintenant, au présent. Un point qui n'a pas bougé depuis ${SEUIL_POINT_H} h passe en orange et redemande à être repris.</li>
    </ol>
    <p class="apres">Ce qui n'est pas de votre ressort : rien ne part aux adhérents depuis cette page. Une information à relayer se marque « À relayer aux adhérents » — la diffusion se décide au copil.</p>
    </div>` : ''}
  </div>`;

  /* --- ce qui appelle une décision --- */
  h += `<div class="compteurs" style="margin-bottom:18px">
    <div class="compteur"><div class="n">${arafraichir.length}</div><div class="l">point${arafraichir.length > 1 ? 's' : ''} de situation à rafraîchir</div></div>
    <div class="compteur"><div class="n">${attente.length}</div><div class="l">information${attente.length > 1 ? 's' : ''} en attente d'une suite</div></div>
    <div class="compteur"><div class="n">${dues.length}</div><div class="l">${dues.length > 1 ? 'canaux' : 'canal'} à repasser${jamais.length ? ', dont ' + jamais.length + ' jamais ouvert' + (jamais.length > 1 ? 's' : '') : ''}</div></div>
    <div class="compteur"><div class="n">${duJour.length}</div><div class="l">information${duJour.length > 1 ? 's' : ''} retenue${duJour.length > 1 ? 's' : ''} aujourd'hui</div></div>
  </div>`;

  /* --- le tour --- */
  h += tourVeille ? vueTourVeille() : (dues.length
    ? `<button class="lancer" onclick="lancerTour()">
        <div>
          <div class="t">Lancer le tour des canaux</div>
          <div class="s">${dues.length} ${dues.length > 1 ? 'canaux' : 'canal'} à repasser, les moins récemment ouverts d'abord — on peut interrompre et reprendre</div>
        </div>
        <span class="go">Commencer →</span>
      </button>`
    : `<div class="carte" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:220px"><strong>Tous les canaux sont à jour.</strong>
        <div style="color:var(--texte-2);font-size:13.5px;margin-top:3px">Le prochain tour s'ouvrira de lui-même quand les canaux arriveront à échéance.</div></div>
        <button class="btn sec" onclick="lancerTour(true)">Tout repasser quand même</button>
      </div>`);

  /* --- les points de situation --- */
  h += vuePoints(arafraichir.length);

  /* --- les canaux, rangés par famille --- */
  h += vueClasseur(dues.length);

  /* --- ce qu'on a retenu --- */
  h += vueRetenu();

  h += `<div class="note" style="margin-top:20px"><strong>Ce que cette mission ne fait pas.</strong> On alimente les points de situation, on ne diffuse rien aux adhérents depuis ici : le relais se décide au copil et se consigne en <a href="#" onclick="aller('courante');return false;">Main courante</a>. Les échanges avec l'ARS, eux, ont leur propre onglet, <a href="#" onclick="aller('ars');return false;">Échanges avec l'ARS</a> : ici on ne garde que ce qui ressort de ses points de situation.</div>`;

  return h;
}

/* Les feuillets de la situation régionale. Chacun porte ce qu'on
   sait à l'instant, ce qu'on y suit, et où on va le chercher :
   prendre la veille, c'est reprendre ceux qui ont vieilli. */
function vuePoints(nbRafraichir){
  const l = rubriques();
  let h = `<h2 style="margin-top:26px">Les points de situation
    <span class="cpt-h">${l.length} feuillet${l.length > 1 ? 's' : ''}${nbRafraichir ? ' · ' + nbRafraichir + ' à rafraîchir' : ' · tous à jour'}</span></h2>
  <p class="sous-h">C'est ce qui se lit au copil. Chaque point se réécrit à partir de ce que la veille a retenu — au présent, en quelques lignes.</p>
  <div class="points">`;

  h += l.map(r => {
    const infos = infosDuPoint(r.id);
    const ouvertes = infos.filter(i => i.suiteEtat === 'ouvert').length;
    const vieux = pointARafraichir(r);
    return `<div class="pt ${r.etat ? '' : 'vierge'} ${vieux && r.etat ? 'vieux' : ''}">
      <div class="n">${esc(r.nom)}</div>
      <div class="e ${r.etat ? '' : 'rien'}">${r.etat
        ? esc(r.etat).replace(/\n/g,'<br>')
        : "Point encore vierge — rien n'y a été écrit depuis le début de la crise."}</div>
      <div class="q"><span class="k">Ce qu'on y suit</span>${esc(r.quoi)}</div>
      ${r.ou ? `<div class="q"><span class="k">Où on le trouve</span>${esc(r.ou)}</div>` : ''}
      <div class="meta">${r.maj
        ? `Mis à jour ${frdate(r.maj.slice(0,10))} à ${esc(r.maj.slice(11,16))}${r.par ? ' par ' + esc(r.par) : ''}${vieux ? ' · à rafraîchir' : ''}`
        : 'Jamais renseigné'}</div>
      <div class="b">
        <button class="maj" onclick="ouvrirPoint('${r.id}')">${r.etat ? 'Mettre à jour' : 'Écrire le point'}</button>
        <button class="lire" onclick="filtrer('pt:${r.id}')">${infos.length
          ? infos.length + ' information' + (infos.length > 1 ? 's' : '') + (ouvertes ? ' · ' + ouvertes + ' en attente' : '')
          : 'Aucune information rangée ici'}</button>
      </div>
    </div>`;
  }).join('');

  return h + `</div>`;
}

/* Ce qu'on a retenu, filtrable par point de situation : c'est le
   même classement que les feuillets ci-dessus, vu par le détail. */
function vueRetenu(){
  const tous = etat.veille || [];
  const compte = f => f === 'decision' ? tous.filter(i => i.suiteEtat === 'ouvert').length
                    : f === 'tout' ? tous.length
                    : f === 'direct' ? tous.filter(i => (i.impact || 'contexte') === 'direct').length
                    : f === 'pt:' ? tous.filter(i => !i.rubrique).length
                    : tous.filter(i => 'pt:' + (i.rubrique||'') === f).length;

  let h = `<h2 id="retenu" style="margin-top:26px">Ce qu'on a retenu
    <span class="cpt-h">${tous.length} information${tous.length > 1 ? 's' : ''}</span></h2>
  <div class="filtres">
    <button class="${filtreVeille === 'decision' ? 'on' : ''}" onclick="filtrer('decision')">Ce qui attend une décision · ${compte('decision')}</button>
    <button class="${filtreVeille === 'direct' ? 'on' : ''}" onclick="filtrer('direct')">Impact direct 64 · ${compte('direct')}</button>
    <button class="${filtreVeille === 'tout' ? 'on' : ''}" onclick="filtrer('tout')">Tout · ${compte('tout')}</button>
  </div>
  <div class="filtres pts">${rubriques().map(r =>
    `<button class="${filtreVeille === 'pt:' + r.id ? 'on' : ''}" onclick="filtrer('pt:${r.id}')">${esc(r.nom)} · ${compte('pt:' + r.id)}</button>`).join('')}
    <button class="${filtreVeille === 'pt:' ? 'on' : ''}" onclick="filtrer('pt:')">Hors point · ${compte('pt:')}</button>
    <button onclick="ouvrirVeille()" style="border-style:dashed">+ Ajouter à la main</button>
  </div>`;

  let items = [...tous].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if(filtreVeille === 'decision') items = items.filter(i => i.suiteEtat === 'ouvert');
  else if(filtreVeille === 'direct') items = items.filter(i => (i.impact || 'contexte') === 'direct');
  else if(filtreVeille.indexOf('pt:') === 0) items = items.filter(i => (i.rubrique||'') === filtreVeille.slice(3));

  if(!items.length){
    h += `<div class="carte" style="color:var(--texte-2)">${filtreVeille === 'decision'
      ? "Rien n'attend de décision : tout ce qui a été retenu a reçu sa suite."
      : filtreVeille.indexOf('pt:') === 0 && filtreVeille.length > 3
        ? `Rien n'a encore été rangé dans « ${esc(nomPoint(filtreVeille.slice(3)))} ». Le prochain tour des canaux devrait l'alimenter.`
        : "Aucune information pour ce filtre."}</div>`;
  } else {
    let jour = '';
    items.forEach(i => {
      if(i.date !== jour){
        jour = i.date;
        h += `<div class="reg-jour"><span class="n">${frdateL(i.date)}</span>${i.date === aujourdhui() ? '<span class="auj">Aujourd\'hui</span>' : ''}</div>`;
      }
      h += vueInfoVeille(i);
    });
  }
  return h;
}

function vueInfoVeille(i){
  const imp = IMPACTS[i.impact] || IMPACTS.contexte;
  const su = SUITES[i.suite] || SUITES.rien;
  const ouvert = i.suiteEtat === 'ouvert';
  return `<div class="info i-${esc(i.impact || 'contexte')}">
    <div class="haut">
      <span class="src">${esc(i.source)} · ${frdate(i.date)}</span>
      ${i.rubrique && rubriqueDe(i.rubrique)
        ? `<button class="pt-b" onclick="filtrer('pt:${i.rubrique}')" title="Voir tout ce point de situation">${esc(nomPoint(i.rubrique))}</button>`
        : `<button class="pt-b hors" onclick="ouvrirVeille('${i.id}')" title="Ranger dans un point de situation">À ranger dans un point</button>`}
      <span class="imp ${imp.c}">${imp.l}</span>
      <span class="outils">
        <button onclick="ouvrirVeille('${i.id}')" title="Modifier">✎</button>
        <button onclick="supprimerVeille('${i.id}')" title="Retirer">×</button>
      </span>
    </div>
    <div class="ti">${esc(i.titre)}</div>
    ${i.resume ? `<div class="re">${esc(i.resume)}</div>` : ''}
    ${i.lien ? `<a class="lien" href="${esc(i.lien)}" target="_blank" rel="noopener">Ouvrir la source</a>` : ''}
    <div class="suite ${ouvert ? 'ouverte' : ''}">
      <span class="k">Suite</span>
      <span class="v">${ouvert
        ? `<b>${su.l}</b> — pas encore fait`
        : (i.suite === 'rien' || !i.suite ? 'Aucune suite attendue' : `<b>${su.l}</b>${i.suiteNote ? ' — ' + esc(i.suiteNote) : ''}`)}</span>
      ${ouvert
        ? `<button class="faire" onclick="suiteFaite('${i.id}')">C'est fait</button>`
        : (i.suite === 'rien' || !i.suite ? '' : `<span class="traite">✓ traité</span>`)}
    </div>
    <div class="trace">
      <span>Retenu par ${esc(i.auteur || i.modifiePar || '—')}</span>
      ${i.mc ? '<span class="mc">✓ consigné en main courante</span>' : ''}
    </div>
  </div>`;
}

/* Le classeur : les canaux rangés par famille, chaque famille
   passable en revue d'un bloc. C'est ici qu'on cherche « ce que dit
   l'ARS » ou « ce que disent les URPS » sans lire toute la liste. */
function vueClasseur(nbDues){
  const l = etat.sources || [];
  const familles = FAMILLES.filter(f => l.some(o => (o.famille || 'Autres canaux') === f));
  /* Une famille ajoutée à la main peut ne pas figurer dans la liste
     de référence : on la range à la suite plutôt que de la perdre. */
  l.forEach(o => { const f = o.famille || 'Autres canaux'; if(!familles.includes(f)) familles.push(f); });

  let h = `<h2 style="margin-top:26px">Les canaux, par famille
    <span class="cpt-h">${l.length} ${l.length > 1 ? 'canaux' : 'canal'} · ${familles.length} famille${familles.length > 1 ? 's' : ''}${nbDues ? ' · ' + nbDues + ' à repasser' : ' · tous à jour'}</span></h2>
  <p class="sous-h">Chaque famille se passe en revue d'un bloc. Sur un canal, « rien de neuf » le date et referme le sujet ; « je retiens » ouvre la fiche de saisie avec le bon point de situation déjà choisi.</p>
  <div class="familles">`;

  h += familles.map(f => {
    const canaux = l.filter(o => (o.famille || 'Autres canaux') === f)
                    .sort((a,b) => (a.verifieLe||'').localeCompare(b.verifieLe||''));
    const d = canaux.filter(sourceDue).length;
    const replie = !!famillesRepliees[f];
    return `<div class="fam ${d ? 'du' : ''}">
      <button class="tete" onclick="basculerFamille(${JSON.stringify(f).replace(/"/g,'&quot;')})">
        <div class="t">${esc(f)}</div>
        <span class="cpt ${d ? 'du' : ''}">${d ? d + ' à repasser' : 'à jour'}</span>
        <span class="chev">${replie ? '▸' : '▾'}</span>
      </button>
      ${FAMILLE_QUOI[f] ? `<div class="q">${esc(FAMILLE_QUOI[f])}</div>` : ''}
      ${replie ? '' : `<div class="cans">` + canaux.map(o => {
        const du = sourceDue(o);
        return `<div class="can ${du ? 'du' : ''} ${o.verifieLe ? '' : 'jamais'}">
          <div class="haut">
            <a class="n" href="${esc(o.url)}" target="_blank" rel="noopener" title="${esc(o.quoi || '')}">${esc(o.nom)} ↗</a>
            <span class="d">${depuisTexte(o.verifieLe)}${o.verifiePar ? ' · ' + esc(o.verifiePar) : ''}</span>
          </div>
          ${o.point && rubriqueDe(o.point) ? `<div class="al">Alimente « ${esc(nomPoint(o.point))} »</div>` : ''}
          <div class="b">
            <button class="rien" onclick="marquerSource('${o.id}')" title="Daté comme ouvert, sans rien en retenir">Rien de neuf</button>
            <button class="retiens" onclick="ouvrirVeille('', '${o.id}')">Je retiens</button>
            <button class="ico" onclick="ouvrirSource('${o.id}')" title="Modifier ce canal">✎</button>
          </div>
        </div>`;
      }).join('') + `</div>
      <div class="pied">
        <button onclick="lancerTour(true, ${JSON.stringify(f).replace(/"/g,'&quot;')})">Passer cette famille en revue</button>
        <button onclick="ouvrirSource('', ${JSON.stringify(f).replace(/"/g,'&quot;')})">+ Canal</button>
      </div>`}
    </div>`;
  }).join('');

  return h + `</div>`;
}
function basculerFamille(f){ famillesRepliees[f] = !famillesRepliees[f]; rendre(); }

/* ---------- le tour de veille ---------- */
/* Un tour porte sur tous les canaux dus, ou sur une seule famille
   quand on veut n'éplucher que l'ARS ou que les URPS. */
function lancerTour(tout, famille){
  const l = sourcesTriees()
    .filter(o => !famille || (o.famille || 'Autres canaux') === famille)
    .filter(o => tout || sourceDue(o));
  if(!l.length){ toast(famille ? "Aucun canal dans cette famille" : "Aucun canal à repasser"); return; }
  tourVeille = {liste: l.map(o => o.id), i:0, retenues:0, passees:0, famille: famille || ''};
  rendre();
  document.querySelector('.tourc')?.scrollIntoView({behavior:'smooth', block:'center'});
}
function vueTourVeille(){
  const total = tourVeille.liste.length;
  if(tourVeille.i >= total){
    const r = tourVeille.retenues, p = tourVeille.passees;
    return `<div class="tourc"><div class="jauge"><i style="width:100%"></i></div>
      <div class="fini">
        <div class="t">Tour terminé${tourVeille.famille ? ' — ' + esc(tourVeille.famille) : ''}</div>
        <div class="s">${total} ${total > 1 ? 'canaux passés' : 'canal passé'} · ${r} information${r > 1 ? 's' : ''} retenue${r > 1 ? 's' : ''}${p ? ' · ' + p + ' laissé' + (p > 1 ? 's' : '') + ' de côté' : ''}</div>
        ${r ? `<div class="s" style="margin-top:9px">Dernier geste : reprendre les points de situation que ces informations concernent, pour qu'ils disent ce qu'on sait maintenant.</div>` : ''}
        <div class="actions" style="justify-content:center">
          <button class="btn" onclick="cloreTour()">Revenir au poste de veille</button>
        </div>
      </div></div>`;
  }
  const o = (etat.sources||[]).find(x => x.id === tourVeille.liste[tourVeille.i]);
  if(!o){ tourVeille.i++; return vueTourVeille(); }
  const reste = total - tourVeille.i - 1;
  return `<div class="tourc">
    <div class="jauge"><i style="width:${Math.round(tourVeille.i / total * 100)}%"></i></div>
    <div class="corps">
      <div class="pos"><span>Canal ${tourVeille.i + 1} sur ${total}</span><span class="cat">${esc(o.famille || 'Autres canaux')}</span><span>${esc(o.rythme || 'Chaque tour')}</span></div>
      <div class="n">${esc(o.nom)}</div>
      <div class="q ${o.verifieLe ? '' : 'vieux'}">${depuisTexte(o.verifieLe)}${o.verifiePar ? ' par ' + esc(o.verifiePar) : ''}</div>
      ${o.quoi ? `<div class="cherche"><span class="k">Ce qu'on y cherche</span><p>${esc(o.quoi)}</p></div>` : ''}
      ${o.point && rubriqueDe(o.point) ? `<div class="cherche"><span class="k">Ce que ça alimente</span><p>Point de situation « ${esc(nomPoint(o.point))} »${rubriqueDe(o.point).etat ? " — aujourd'hui : " + esc(rubriqueDe(o.point).etat.split('\n')[0]) : " — encore vierge"}</p></div>` : ''}
      <div class="gestes">
        <a class="ouvrir" href="${esc(o.url)}" target="_blank" rel="noopener">Ouvrir la source ↗</a>
        <button class="rien" onclick="rienDeNeuf()">Rien de neuf</button>
        <button class="retiens" onclick="ouvrirVeille('', '${o.id}')">Je retiens quelque chose</button>
      </div>
      <div class="bas">
        <button onclick="passerSource()">Passer sans marquer</button>
        <button onclick="cloreTour()">Interrompre le tour</button>
        <span class="reste">${reste} restante${reste > 1 ? 's' : ''}</span>
      </div>
    </div>
  </div>`;
}
function avancerTour(){
  if(!tourVeille) return;
  tourVeille.i++;
  rendre();
  document.querySelector('.tourc')?.scrollIntoView({behavior:'smooth', block:'center'});
}
async function rienDeNeuf(){
  await marquerSource(tourVeille.liste[tourVeille.i], true);
  avancerTour();
}
function passerSource(){ tourVeille.passees++; avancerTour(); }
function cloreTour(){ tourVeille = null; rendre(); }

/* Les feuillets sont en haut de page, le détail en bas : filtrer
   depuis un point de situation amène à l'endroit où il se lit. */
function filtrer(s){
  filtreVeille = s;
  rendre();
  document.getElementById('retenu')?.scrollIntoView({behavior:'smooth', block:'start'});
}
async function marquerSource(id, silencieux){
  const o = (etat.sources||[]).find(x => x.id === id);
  if(!o) return;
  o.verifieLe = horodate();
  o.verifiePar = moi;
  await sauver();
  if(!silencieux){ rendre(); toast("Source datée"); }
}
function ouvrirSource(id, famille){
  const o = id ? (etat.sources||[]).find(x=>x.id===id) : null;
  const rythmes = ['Chaque tour','Une fois par jour'];
  const fam = o ? (o.famille || 'Autres canaux') : (famille || 'Autres canaux');
  const familles = FAMILLES.includes(fam) ? FAMILLES : [fam].concat(FAMILLES);
  document.getElementById('modale').innerHTML = `<h3>${o?'Modifier le canal':'Ajouter un canal'}</h3><div class="form">
    <label class="large"><span class="k">Nom du canal *</span><input id="s-nom" value="${esc(o?o.nom:'')}" placeholder="Ex. URPS Infirmiers Nouvelle-Aquitaine"></label>
    <label><span class="k">Famille</span><select id="s-famille">${familles.map(x=>`<option ${fam===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
    <label><span class="k">Rythme</span><select id="s-rythme">${rythmes.map(x=>`<option ${o&&(o.rythme||'Chaque tour')===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label class="large"><span class="k">Point de situation alimenté</span><select id="s-point">
      <option value="">Aucun en particulier</option>
      ${rubriques().map(r=>`<option value="${esc(r.id)}" ${o&&o.point===r.id?'selected':''}>${esc(r.nom)}</option>`).join('')}
    </select><span class="aide">Proposé d'avance quand on retient une information depuis ce canal.</span></label>
    <label class="large"><span class="k">Adresse *</span><input id="s-url" value="${esc(o?o.url:'')}" placeholder="https://"></label>
    <label class="large"><span class="k">Ce qu'on y cherche</span><textarea id="s-quoi" placeholder="Ce qu'il faut regarder sur ce canal, pour que quelqu'un d'autre puisse prendre la main.">${esc(o?o.quoi:'')}</textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerSource(${o?`'${o.id}'`:''})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button>${
    o ? `<button class="btn sec" style="margin-left:auto;color:var(--braise)" onclick="supprimerSource('${o.id}')">Retirer ce canal</button>` : ''}</div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerSource(id){
  const g = k => document.getElementById('s-'+k).value.trim();
  const n = g('nom'), u = g('url');
  if(!n || !u){ toast("Nom et adresse obligatoires"); return; }
  const champs = {nom:n, url:u, famille: g('famille') || 'Autres canaux', point: g('point'), rythme: g('rythme'), quoi: g('quoi')};
  etat.sources = etat.sources || [];
  const o = id ? etat.sources.find(x=>x.id===id) : null;
  if(o) Object.assign(o, champs);
  else etat.sources.push(Object.assign({id:uid(), verifieLe:'', verifiePar:''}, champs));
  await sauver(); fermer(); rendre(); toast(o?"Source modifiée":"Source ajoutée");
}
async function supprimerSource(id){
  noterRetrait(id);
  etat.sources = (etat.sources||[]).filter(x=>x.id!==id);
  await sauver(); fermer(); rendre(); toast("Canal retiré");
}

/* ---------- ce qu'on retient ---------- */
function ouvrirVeille(id, srcId){
  const o = id ? (etat.veille||[]).find(x=>x.id===id) : null;
  const src = srcId ? (etat.sources||[]).find(x=>x.id===srcId) : null;
  brouillonVeille = {
    id: id || '',
    src,
    date: o ? o.date : aujourdhui(),
    source: o ? o.source : (src ? (src.famille || 'Autres canaux') : 'Autre'),
    rubrique: o ? (o.rubrique || '') : (src ? (src.point || '') : ''),
    titre: o ? o.titre : '',
    resume: o ? o.resume : '',
    lien: o ? o.lien : (src ? src.url : ''),
    impact: o ? (o.impact || 'contexte') : 'surveiller',
    suite: o ? (o.suite || 'rien') : 'rien',
    majPoint: '',
    mc: o ? !!o.mc : true
  };
  dessinerVeille();
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('v-titre'); if(i) i.focus(); }, 60);
}
function dessinerVeille(){
  const b = brouillonVeille;
  const src = FAMILLES.includes(b.source) || !b.source ? FAMILLES : [b.source].concat(FAMILLES);
  const pt = b.rubrique ? rubriqueDe(b.rubrique) : null;
  document.getElementById('modale').innerHTML = `<h3>${b.id ? 'Modifier' : "Ce qu'on retient"}</h3>
    ${b.src ? `<p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Depuis <strong>${esc(b.src.nom)}</strong> · ${frdateL(aujourdhui())} · ${esc(moi)}</p>` : ''}
    <div style="margin-bottom:16px">
      <span class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:6px">Point de situation concerné</span>
      <div class="choix">${rubriques().map(r =>
        `<button class="${b.rubrique===r.id?'on':''}" onclick="choisirVeille('rubrique','${r.id}')">${esc(r.nom)}</button>`).join('')}
        <button class="${b.rubrique?'':'on'}" onclick="choisirVeille('rubrique','')">Aucun</button></div>
      <p style="font-size:12.5px;color:var(--texte-2);margin:7px 0 0">${pt ? esc(pt.quoi) : "L'information sera rangée hors point de situation — à ne garder que si elle n'entre dans aucun des sept."}</p>
    </div>
    <div class="form">
      <label><span class="k">Date</span><input type="date" id="v-date" value="${esc(b.date)}"></label>
      <label><span class="k">Famille du canal</span><select id="v-source">${src.map(x=>`<option ${b.source===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <label class="large"><span class="k">En une phrase *</span><input id="v-titre" value="${esc(b.titre)}" placeholder="Ex. Levée de l'évacuation sur trois communes girondines"></label>
      <label class="large"><span class="k">Ce qu'il faut en retenir</span><textarea id="v-resume" placeholder="Ce que ça change concrètement, en deux lignes.">${esc(b.resume)}</textarea></label>
      <label class="large"><span class="k">Lien</span><input id="v-lien" value="${esc(b.lien)}" placeholder="https://"></label>
    </div>
    <div style="margin-top:16px">

        : `<span class="k">Ce qu'il dit aujourd'hui</span>Rien : ce point n'a jamais été écrit.`}</div>

/* Un clic sur une étiquette redessine la fenêtre : on remet dans le
   brouillon ce qui est déjà tapé avant de la reconstruire. */
function choisirVeille(champ, valeur){
  relireBrouillonVeille();
  brouillonVeille[champ] = valeur;
  dessinerVeille();
}
function relireBrouillonVeille(){
  const b = brouillonVeille;
  if(!b) return;
  ['date','source','titre','resume','lien'].forEach(k => {
    const el = document.getElementById('v-' + k);
    if(el) b[k] = el.value.trim();
  });
  const mp = document.getElementById('v-majpoint');
  b.majPoint = mp ? mp.value.trim() : '';
  const mc = document.getElementById('v-mc');
  if(mc) b.mc = mc.checked;
}
async function validerVeille(){
  relireBrouillonVeille();
  const b = brouillonVeille;
  if(!b.titre){ toast("Il faut au moins une phrase"); document.getElementById('v-titre')?.focus(); return; }
  const o = b.id ? etat.veille.find(x => x.id === b.id) : null;
  const champs = {date:b.date, source:b.source, rubrique:b.rubrique, titre:b.titre, resume:b.resume, lien:b.lien, impact:b.impact, suite:b.suite};

  /* Le geste va jusqu'au bout : si on a réécrit le point de
     situation dans la même fenêtre, il est repris ici, daté et
     signé, sans avoir à rouvrir le feuillet. */
  const pt = b.majPoint ? rubriqueDe(b.rubrique) : null;
  if(pt){
    pt.etat = b.majPoint;
    pt.maj = horodate();
    pt.par = moi;
  }

  if(o){
    /* Changer la suite d'une information déjà traitée la remet en
       attente : c'est un nouvel engagement, pas une correction. */
    if(o.suite !== b.suite) o.suiteEtat = b.suite === 'rien' ? 'traite' : 'ouvert';
    Object.assign(o, champs, {modifiePar: moi});
  } else {
    etat.veille.unshift(Object.assign({id:uid()}, champs, {
      suiteEtat: b.suite === 'rien' ? 'traite' : 'ouvert',
      suiteNote: '',
      mc: b.mc,
      auteur: moi
    }));
    /* Un seul geste, une seule ligne de main courante : la reprise
       du point y figure au même endroit que l'information. */
    if(b.mc) consignerVeilleEnCourante(b, pt);
  }

  const enTour = !!b.src;
  const srcId = b.src ? b.src.id : '';
  if(srcId){
    const s = (etat.sources||[]).find(x => x.id === srcId);
    if(s){ s.verifieLe = horodate(); s.verifiePar = moi; }
    if(tourVeille) tourVeille.retenues++;
  }
  await sauver(); fermer();
  toast(pt ? "Retenu, et point « " + pt.nom + " » repris"
           : (o ? "Modifié" : (b.mc ? "Retenu, et consigné en main courante" : "Retenu")));
  if(enTour && tourVeille) avancerTour(); else rendre();
}
/* Règle du cockpit : toute information recueillie au fil de l'eau
   se consigne aussi en main courante, en plus de sa rubrique. */
function consignerVeilleEnCourante(b, pt){
  etat.courante = etat.courante || [];
  const su = SUITES[b.suite] || SUITES.rien;
  const range = b.rubrique ? nomPoint(b.rubrique) : '';
  etat.courante.unshift({
    id: uid(),
    date: aujourdhui(),
    heure: maintenant(),
    source: 'Veille',
    evenement: "Veille — " + b.titre + (b.src ? " (source : " + b.src.nom + ")" : '') + (b.resume ? "\n" + b.resume : '')
      + (pt ? "\nPoint de situation « " + pt.nom + " », réécrit dans la foulée :\n" + pt.etat : ''),
    suite: (b.suite === 'rien' ? "Retenu pour la situation régionale, sans suite attendue" : su.l)
      + " — " + (IMPACTS[b.impact] || IMPACTS.contexte).l + "."
      + (range ? " Rangé dans le point « " + range + " »." : ''),
    statut: b.suite === 'rien' ? 'Clos' : 'À suivre',
    auteur: moi,
    quand: ''
  });
}
/* ---------- les points de situation ---------- */
function ouvrirPoint(id){
  const r = rubriqueDe(id);

  brouillonPoint = id;
  const infos = infosDuPoint(id).sort((a,b) => (b.date||'').localeCompare(a.date||'')).slice(0,5);
  document.getElementById('modale').innerHTML = `<h3>${esc(r.nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">${esc(r.quoi)}${r.ou ? ' <em>Où on le trouve : ' + esc(r.ou) + '</em>' : ''}</p>
    ${infos.length ? `<div class="rappel">
      <span class="k">Ce que la veille a retenu récemment</span>
      <ul>${infos.map(i => `<li>${esc(i.titre)} <span class="d">${frdate(i.date)} · ${esc(i.source)}</span></li>`).join('')}</ul>
    </div>` : `<div class="rappel vide">Rien n'a encore été rangé dans ce point. Il se remplira au fil des tours de veille.</div>`}
    <div class="form">
      <label class="large"><span class="k">Ce qu'on sait à cet instant</span>
        <textarea id="p-etat" rows="7" placeholder="Écrire au présent, en quelques lignes : ce qui est établi, ce qui a changé depuis hier, ce qui reste incertain. Dater ce qui est daté.">${esc(r.etat)}</textarea>
        <span class="aide">Ce texte remplace le précédent — la version d'avant reste tracée en main courante.</span></label>
    </div>
    <div style="margin-top:14px"><label class="coche">
      <input type="checkbox" id="p-mc" checked>

    </label></div>
    <div class="actions">

  document.getElementById('rideau').classList.add('on');

async function validerPoint(){
  const r = rubriqueDe(brouillonPoint);
  if(!r) return;
  const v = document.getElementById('p-etat').value.trim();
  if(!v){ toast("Le point est vide"); document.getElementById('p-etat')?.focus(); return; }
  const mc = document.getElementById('p-mc').checked;
  if(v === r.etat){ fermer(); toast("Le point n'a pas changé"); return; }
  r.etat = v;
  r.maj = horodate();
  r.par = moi;
  if(mc) consignerPointEnCourante(r, '');
  await sauver(); fermer(); rendre();
  toast(mc ? "Point mis à jour, et consigné en main courante" : "Point mis à jour");
}
/* Même règle que pour le reste du cockpit : ce qui est écrit ici se
   retrouve dans la main courante, qui garde la trace de l'état
   précédent du point. */
function consignerPointEnCourante(r, motif){
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(),
    date: aujourdhui(),
    heure: maintenant(),
    source: 'Veille',
    evenement: "Point de situation — " + r.nom + (motif ? " (" + motif + ")" : '') + "\n" + r.etat,
    suite: "Situation régionale : le point « " + r.nom + " » a été repris. Il fait foi jusqu'à la prochaine mise à jour.",
    statut: 'Clos',
    auteur: moi,
    quand: ''
  });
}

async function suiteFaite(id){

async function nommerVeilleur(nom){
  const m = missionVeille();
  if(!m) return;
  const n = (nom || document.getElementById('pv-nom').value).trim();
  if(!n){ toast("Il faut un nom"); return; }

  m.modifiePar = moi;
  etat.courante = etat.courante || [];

    id: uid(), date: aujourdhui(), heure: maintenant(), source: 'Coordination',

    statut: 'En cours', auteur: moi, quand: ''
  });

function evenements(){
  const e = [];
  const push = (o, type, titre, detail, qui) => {
    if(!titre) return;
    e.push({date:o.date||'', heure:o.heure||'', type, titre, detail:detail||'', qui:qui||o.auteur||''});
  };
  (etat.ars||[]).forEach(o => push(o,'ARS',o.objet,
    [o.sens,o.interlocuteur,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.courante||[]).forEach(o => push(o,'Consigné',o.evenement, [o.source,o.suite].filter(Boolean).join(' · '), o.auteur));
  (etat.terrain||[]).forEach(o => push(o,'Terrain',o.sujet,
    [o.professionnel,o.profession,o.commune,o.criticite].filter(Boolean).join(' · '), o.auteur));
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a =>
    push(a,'Appel CPTS', c.nom, [a.qui, a.dit].filter(Boolean).join(' · '), a.par)));
  (etat.materiel||[]).forEach(o => push(o,'Matériel',o.nature,
    [o.demandeur,o.quantite,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.dons||[]).forEach(o => {
    push(o,'Collecte', o.structure,
      [o.reponse ? 'Réponse : ' + o.reponse : '', o.commune, o.reponse==='Oui' ? o.materiel : '', o.interlocuteur]
        .filter(Boolean).join(' · '), o.par || o.auteur);
    (o.suivi||[]).forEach(s => push(s,'Collecte', o.structure + ' — relance', s.texte, s.par));
  });
  (etat.renforts||[]).forEach(o => push(o,'Collecte', o.nom + ' — volontaire pour la collecte',
    [o.taches, aVehicule(o) ? o.vehicule : '', o.dispo, o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.volontaires||[]).forEach(o => {
    push(o,'Renfort', nomVol(o) + ' — volontaire au renfort',
      [o.profession, o.commune, o.renforts, o.dispo, o.zone, o.statut].filter(Boolean).join(' · '),
      o.par || o.auteur);
    (o.suivi||[]).forEach(s => push(s,'Renfort', nomVol(o) + ' — appel', s.texte, s.par));
  });
  (etat.medecins||[]).forEach(o => push(o,'Évacués', nomMed(o) + ' — médecin généraliste sondé',
    [o.statut, o.commune, o.motifs, o.capacite].filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.orientes||[]).forEach(o => push(o,'Évacués', (o.ref || 'Patient') + ' — demande d\'orientation',
    [o.provenance, o.relais, o.motif, o.medecin ? 'orienté vers ' + o.medecin : '', o.statut]
      .filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.relais||[]).forEach(o => push(o,'Évacués', o.structure + ' — structure relais',
    [o.type, o.commune, o.info].filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.veille||[]).forEach(o => push(o,'Veille',o.titre, [o.source,o.resume].filter(Boolean).join(' · '), o.auteur));
  return e.sort((a,b) => ((b.date+' '+(b.heure||'00:00')).localeCompare(a.date+' '+(a.heure||'00:00'))));
}

const COUL = {'ARS':'e-attente','Consigné':'e-lancer','Terrain':'e-bloque','Appel CPTS':'e-lancer','Matériel':'e-attente','Collecte':'e-cours','Renfort':'e-cours','Évacués':'e-cours','Veille':'e-fini'};

function vueFil(){
  let ev = evenements();
  const types = ['Tout', ...new Set(ev.map(x => x.type))];
  if(filtreFil !== 'Tout') ev = ev.filter(x => x.type === filtreFil);

  let h = `<h1>Fil d'actualité</h1>
  <p class="chapo">Tout ce que la CPTS Pau Béarn a mené, tracé, communiqué ou reçu depuis le début de sa mobilisation, du plus récent au plus ancien. C'est la page à ouvrir quand on reprend la main après une absence.</p>
  <div class="filtres">${types.map(t=>`<button class="${filtreFil===t?'on':''}" onclick="filtrerFil('${t}')">${esc(t)}</button>`).join('')}</div>`;

  if(!ev.length) return h + `<div class="carte"><p class="vide">Rien n'a encore été enregistré. Le fil se construit à partir de toutes les autres pages.</p></div>`;

  let jour = '';
  h += `<div class="carte"><ul class="fil">`;
  ev.forEach(x => {
    if(x.date !== jour){
      jour = x.date;
      h += `<li style="border-bottom:0;padding-bottom:2px"><div class="h"></div><div class="c"><div class="s" style="font-weight:600;color:var(--encre)">${frdate(x.date)}</div></div></li>`;
    }
    h += `<li><div class="h">${esc(x.heure||'—')}</div><div class="c">

  });
  return h + `</ul></div>`;
}
function filtrerFil(t){ filtreFil = t; rendre(); }

      <div class="rangee">

      <textarea id="co-besoins" placeholder="Ex. masques FFP2, compresses stériles, sérum physiologique.">${esc(c.besoins||'')}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerCollecte()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerCollecte(){
  etat.collecte = etat.collecte || {ouverte:false};
  etat.collecte.message = document.getElementById('co-message').value.trim();
  etat.collecte.besoins = document.getElementById('co-besoins').value.trim();
  await sauver(); fermer(); rendre(); toast("Textes du formulaire mis à jour");
}

function copierLien(){
  const l = lienFormulaire();
  const fini = () => toast("Lien copié — collez-le dans le message aux adhérents");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(l).then(fini, () => toast("Copie impossible — sélectionnez le lien à la main"));
  }else{
    const i = document.getElementById('lien-don');
    if(i){ i.select(); try{ document.execCommand('copy'); fini(); }catch(e){ toast("Sélectionnez le lien à la main"); } }
  }
}

function carteFormulaire(){
  const c = etat.collecte || {};
  const aVerifier = (etat.dons||[]).filter(x => x.source === 'formulaire' && x.aVerifier).length;
  return `<div class="carte formulaire ${c.ouverte?'ouverte':''}">
    <div class="ligne-f">
      <div>
        <h2 style="margin-bottom:2px">Formulaire de don en ligne</h2>
        <p class="sous-f">Le professionnel déclare son don et accepte les conditions du bordereau depuis son téléphone. La ligne arrive ici, il repart avec son récapitulatif en PDF. Plus rien à imprimer ni à renvoyer.</p>
      </div>
      <span class="etiq ${c.ouverte?'e-cours':'e-bloque'}">${c.ouverte?'Ouvert aux dépôts':'Fermé'}</span>
    </div>
    ${c.ouverte
      ? `<div class="lien-f">
           <input id="lien-don" readonly value="${esc(lienFormulaire())}" onclick="this.select()">
           <button class="btn sec" onclick="copierLien()">Copier le lien</button>
         </div>
         <p class="sous-f" style="margin:9px 0 0">Ce lien est à diffuser aux adhérents. Toute personne qui l'a peut déposer une proposition ; le cockpit, lui, reste protégé par son code d'accès.</p>`
      : `<div class="note" style="margin:0">Tant que la collecte est fermée, le formulaire affiche aux professionnels que la CPTS ne sollicite aucun don et refuse tout dépôt. C'est la position à tenir tant que l'ARS n'a pas transmis de besoin écrit et de lieu de réception.</div>`}
    <div class="actions">
      <button class="btn${c.ouverte?' sec':''}" onclick="basculerCollecte()">${c.ouverte?'Fermer la collecte':'Ouvrir la collecte'}</button>
      <button class="btn sec" onclick="editerCollecte()">Textes affichés</button>
      ${c.ouverte ? `<a class="btn sec" href="${esc(lienFormulaire())}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Voir le formulaire</a>` : ''}
      ${aVerifier ? `<button class="btn sec" onclick="filtrerDon('Formulaire')" style="margin-left:auto;color:var(--braise);border-color:#E8C3B8">${aVerifier} dépôt${aVerifier>1?'s':''} à vérifier</button>` : ''}
    </div>
  </div>`;
}

function vueCollecte(){
  const d = etat.dons || [], s = etat.stockage || [];
  const oui = d.filter(x => x.reponse === 'Oui').length;
  const non = d.filter(x => x.reponse === 'Non').length;
  const att = d.length - oui - non;
  const taux = (oui + non) ? Math.round(oui * 100 / (oui + non)) : 0;
  const pc = n => d.length ? (n * 100 / d.length) : 0;

  let h = `<h1>Collecte de matériel</h1>
  <p class="chapo">Qui a été contacté sur le territoire pour donner du matériel, à quelle heure, par qui, et ce qui a été obtenu. Chaque don accepté se formalise par un bordereau signé et se range dans un lieu de stockage identifié. Ce qui a été <strong>réellement déposé</strong> se compte, lui, point de collecte par point de collecte.</p>
  <div class="filtres">
    <button class="${feuilletMat==='points'?'on':''}" onclick="allerFeuilletMat('points')">Points de collecte <span style="opacity:.6">${(etat.points||[]).length}</span></button>
    <button class="${feuilletMat==='dons'?'on':''}" onclick="allerFeuilletMat('dons')">Appels aux donateurs <span style="opacity:.6">${d.length}</span></button>
    <button class="${feuilletMat==='stockage'?'on':''}" onclick="allerFeuilletMat('stockage')">Lieux de stockage <span style="opacity:.6">${s.length}</span></button>
    <button class="${feuilletMat==='renforts'?'on':''}" onclick="allerFeuilletMat('renforts')">Volontaires de la collecte <span style="opacity:.6">${(etat.renforts||[]).length}</span></button>
    <button class="${feuilletMat==='besoins'?'on':''}" onclick="allerFeuilletMat('besoins')">Besoins exprimés <span style="opacity:.6">${(etat.materiel||[]).length}</span></button>
  </div>`;

  if(feuilletMat === 'points')   return h + feuilletPoints();
  if(feuilletMat === 'stockage') return h + feuilletStockage();
  if(feuilletMat === 'renforts') return h + feuilletRenforts();
  if(feuilletMat === 'besoins')  return h + feuilletBesoins();

  h += carteDernierPoint();
  h += carteFormulaire();

  const parFormulaire = d.filter(x => x.source === 'formulaire').length;
  const parSaisie = d.filter(x => x.source === 'saisie').length;

  h += `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${d.length}</div><div class="l">structures contactées ou déclarées</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${oui}</div><div class="l">ont accepté de donner</div></div>
    <div class="compteur"><div class="n" style="color:var(--braise)">${non}</div><div class="l">ont refusé ou n'ont rien</div></div>
    <div class="compteur"><div class="n" style="color:var(--ambre)">${att}</div><div class="l">en attente ou à rappeler</div></div>
    <div class="compteur"><div class="n">${taux}&thinsp;%</div><div class="l">d'accord parmi les réponses obtenues</div></div>
    <div class="compteur"><div class="n">${d.filter(x=>x.reponse==='Oui'&&BORDEREAU_ACQUIS.indexOf(x.bordereau)>=0).length}</div><div class="l">bordereaux signés ou engagés en ligne</div></div>
    ${parFormulaire ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parFormulaire}</div><div class="l">reçus par le formulaire</div></div>` : ''}
    ${parSaisie ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parSaisie}</div><div class="l">réponses reportées à la main</div></div>` : ''}
  </div>`;

  if(d.length){
    h += `<div class="jauge">
      <i class="oui" style="width:${pc(oui)}%"></i>
      <i class="non" style="width:${pc(non)}%"></i>
      <i class="att" style="width:${pc(att)}%"></i>
    </div>
    <div class="jl">
      <span><i class="oui"></i>${oui} accord${oui>1?'s':''}</span>
      <span><i class="non"></i>${non} refus</span>
      <span><i class="att"></i>${att} sans réponse ferme</span>
    </div>`;
  }

  h += `<div class="note">Un don n'est acquis qu'une fois le <strong>bordereau signé ou engagé en ligne</strong> et le <strong>lieu de stockage</strong> connu. Le bordereau s'édite depuis la ligne du donateur, ou vierge depuis le bouton en haut à droite. Les lignes marquées <strong>Formulaire</strong> ont été déclarées par le donateur lui-même : leur bordereau est déjà rempli et son engagement recueilli, il reste à les vérifier et à organiser l'enlèvement. Une réponse obtenue autrement — le formulaire Google, un message reçu — se reporte ici avec <strong>Reporter une réponse</strong> : la ligne compte comme les autres, sans nom d'appelant.</div>
  <div class="barre-h">
    <span class="cpt-h">${d.length} ligne${d.length>1?'s':''} au registre</span>
    <button class="btn sec" onclick="exporterCSV('dons')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn sec" onclick="bordereau()">Bordereau de don officiel</button>
    <button class="btn sec" onclick="ouvrirAjout('dons','manuel')">Reporter une réponse</button>
    <button class="btn" onclick="ouvrirAjout('dons')">Consigner un appel</button>
  </div>`;

  const LIB_SRC = {Formulaire:'Reçus par formulaire', Saisie:'Reportés à la main'};
  const compte = r => r === 'Formulaire' ? parFormulaire
    : r === 'Saisie' ? parSaisie
    : d.filter(x => x.reponse === r).length;
  const reps = ['Tout','Oui','Non','En attente','À rappeler']
    .concat(parFormulaire ? ['Formulaire'] : [])
    .concat(parSaisie ? ['Saisie'] : []);
  if(d.length) h += `<div class="filtres">${reps.map(r =>
    `<button class="${filtreDon===r?'on':''}" onclick="filtrerDon('${r}')">${LIB_SRC[r] || esc(r)}${r!=='Tout'?` <span style="opacity:.6">${compte(r)}</span>`:''}</button>`).join('')}</div>`;

  let vus = filtreDon === 'Tout' ? [...d]
    : filtreDon === 'Formulaire' ? d.filter(x => x.source === 'formulaire')
    : filtreDon === 'Saisie' ? d.filter(x => x.source === 'saisie')
    : d.filter(x => x.reponse === filtreDon);
  vus.sort((a,b) => ((b.date||'')+' '+(b.heure||'')).localeCompare((a.date||'')+' '+(a.heure||'')));

  if(!vus.length){
    return h + `<div class="carte"><p class="vide">${d.length
      ? "Aucune ligne dans ce filtre."
      : "Registre vide. Il se remplit de deux façons : consigner un appel qu'on a mené, ou reporter une réponse arrivée autrement — une réponse au formulaire Google, un message reçu."}</p></div>`;
  }

  h += `<div class="dons">`;
  vus.forEach(o => {
    const cl = REPCL[o.reponse] || 'att';
    const ouvertx = donOuvert === o.id;
    h += `<div class="don ${cl}">
      <button class="tete" onclick="ouvrirDon('${o.id}')" aria-expanded="${ouvertx}">
        <span class="qd">${frdate(o.date)}<br>${esc(o.heure||'—')}</span>
        <span class="ident">
          <span class="n">${esc(o.structure)}${o.source === 'formulaire'
            ? `<span class="src-f">Formulaire</span>${o.aVerifier ? `<span class="src-f neuf">À vérifier</span>` : ''}`
            : o.source === 'saisie'
            ? `<span class="src-f saisie">Saisie à la main</span>`
            : ''}</span>
          <span class="s">${[o.type, o.commune, o.interlocuteur].filter(Boolean).map(esc).join(' · ') || '—'}</span>
        </span>
        <span class="par">${o.source === 'formulaire' ? 'Déclaré par'
            : o.source === 'saisie' ? 'Réponse de'
            : 'Appel mené par'}<br><b>${esc(o.source === 'formulaire' ? (o.interlocuteur || 'le donateur')
            : o.source === 'saisie' ? (o.interlocuteur || o.origine || 'le donateur')
            : (o.par || o.auteur || '—'))}</b></span>
        <span class="etiq ${REPET[o.reponse]||'e-lancer'}">${esc(o.reponse||'En attente')}</span>
        ${o.reponse === 'Oui'
          ? (o.materiel
              ? `<span class="mat">${esc(o.materiel)}${o.quantite?' — '+esc(o.quantite):''}</span>`
              : `<span class="manque">Nature du matériel à renseigner</span>`)
          : ''}
        <span class="chev">${ouvertx?'▲':'▼'}</span>
      </button>`;

    if(ouvertx) h += detailDon(o);
    h += `</div>`;
  });
  return h + `</div>`;
}

/* Panneau dépliant : la case « nature du matériel » n'apparaît
   que lorsque la structure a dit oui. */
function detailDon(o){
  const lieux = ['', ...(etat.stockage||[]).map(s => s.nom)];
  if(o.lieu && lieux.indexOf(o.lieu) === -1) lieux.push(o.lieu);
  const sel = (v, arr) => arr.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  let h = `<div class="detail">`;

  /* Ce que le donateur a déclaré lui-même n'est pas modifiable
     d'un clic : c'est la pièce qui fait foi. On l'affiche telle
     quelle, et la correction passe par « Modifier la fiche ». */
  if(o.source === 'formulaire'){
    const e = o.engagement || {};
    h += `<div class="declaration">
      <div class="dt">Déclaration reçue par le formulaire en ligne</div>
      <div class="dc">
        ${[['Adresse', o.adresse], ['Courriel', o.mail], ['Qualité du représentant', e.qualite],
           ['Disponible à partir de', o.dispo], ['Volume approximatif', o.quantite]]
          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Aucun élément complémentaire déclaré</span></div>`}
      </div>
      ${(o.lignes||[]).length ? `<table class="dl"><thead><tr><th>Désignation</th><th>Quantité</th><th>État</th><th>Observations</th></tr></thead>
        <tbody>${o.lignes.map(l => `<tr><td>${esc(l.designation||'')}</td><td>${esc(l.quantite||'')}</td><td>${esc(l.etat||'')}</td><td>${esc(l.obs||'')}</td></tr>`).join('')}</tbody></table>` : ''}
      ${o.note ? `<div class="dn"><span class="k">Précisions à l'enlèvement</span>${esc(o.note)}</div>` : ''}
      ${e.le ? `<div class="de">Conditions du bordereau acceptées le ${frdateL(e.le)} à ${esc(String(e.le).slice(11,16))} par ${esc(e.nom||'—')}${e.qualite?', '+esc(e.qualite):''}. Cette acceptation tient lieu de signature de l'entité donneuse.</div>` : ''}
    </div>`;
  }

  /* Une ligne reportée à la main n'engage pas la CPTS de la même
     façon qu'un appel : on rappelle d'où vient la réponse et qui
     l'a recopiée, sans quoi la ligne n'est plus vérifiable. */
  if(o.source === 'saisie'){
    h += `<div class="declaration">
      <div class="dt">Réponse reportée à la main au registre</div>
      <div class="dc">
        ${[['Provenance', o.origine], ['Personne qui a répondu', o.interlocuteur],
           ['Courriel', o.mail], ['Adresse', o.adresse]]
          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Provenance non précisée</span></div>`}
      </div>
      <div class="de">Reportée par ${esc(o.auteur || '—')}${o.quand ? ' le ' + frdateL(String(o.quand).slice(0,10)) : ''}. Cette ligne n'a pas fait l'objet d'un appel de la CPTS.</div>
    </div>`;
  }

  h += `<div class="form">
    <label><span class="k">Réponse à la collecte</span>
      <select onchange="majDon('${o.id}','reponse',this.value)">${sel(o.reponse||'En attente', ['En attente','Oui','Non','À rappeler'])}</select></label>
    <label><span class="k">Téléphone</span>
      ${o.tel ? `<a class="btn sec" style="display:flex;justify-content:center;text-decoration:none" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>`
              : `<input value="" placeholder="06 12 34 56 78" onchange="majDon('${o.id}','tel',this.value)">`}</label>`;

  if(o.reponse === 'Oui'){
    h += `<label class="large"><span class="k">Nature du matériel donné</span>
      <textarea placeholder="Ex. 2 tensiomètres, 3 saturomètres, 1 lecteur d'hémoglucotest, 1 stéthoscope" onchange="majDon('${o.id}','materiel',this.value)">${esc(o.materiel||'')}</textarea></label>
    <label><span class="k">Quantité totale</span><input value="${esc(o.quantite||'')}" placeholder="Ex. 6 cartons" onchange="majDon('${o.id}','quantite',this.value)"></label>
    <label><span class="k">Disponible à partir de</span><input value="${esc(o.dispo||'')}" placeholder="Ex. dès demain 9 h" onchange="majDon('${o.id}','dispo',this.value)"></label>
    <label><span class="k">Lieu de stockage prévu</span>
      <select onchange="majDon('${o.id}','lieu',this.value)">${sel(o.lieu||'', lieux)}</select>
      ${lieux.length > 1 ? '' : `<span style="font-size:12px;color:var(--texte-2)">Aucun lieu enregistré — <a href="#" onclick="allerFeuilletMat('stockage');return false;">en ajouter un</a></span>`}</label>
    <label><span class="k">Enlèvement</span>
      <select onchange="majDon('${o.id}','retrait',this.value)">${sel(o.retrait||'À organiser', ['À organiser','Planifié','Collecté','Remis au receveur','Sans objet'])}</select></label>
    <label><span class="k">Bordereau de don</span>
      <select onchange="majDon('${o.id}','bordereau',this.value)">${sel(o.bordereau||'Non', BORDEREAU_ETATS)}</select></label>`;
  }

  h += `<label class="large"><span class="k">Observation</span>
      <textarea onchange="majDon('${o.id}','note',this.value)">${esc(o.note||'')}</textarea></label>
  </div>`;

  const su = antechrono(o.suivi);
  h += `<div class="suivi">
    <span class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:7px">Relances et suites</span>
    ${su.length ? su.map(x => `<div class="e">
        <div class="q">${frdate(x.date)} ${esc(x.heure||'')} · ${esc(x.par||'—')}
          <button title="Supprimer" onclick="supprimerSuiviDon('${o.id}','${x.id}')">×</button></div>
        <div class="d">${esc(x.texte)}</div>
      </div>`).join('') : `<p class="vide" style="padding:0;font-size:13px">Aucune relance consignée.</p>`}
  </div>
  <div class="bas">
    ${o.aVerifier ? `<button class="btn" onclick="verifierDon('${o.id}')">Marquer comme vérifié</button>` : ''}
    <button class="btn sec" onclick="ouvrirSuiviDon('${o.id}')">Consigner une relance</button>
    ${o.reponse === 'Oui' ? `<button class="btn${o.aVerifier?' sec':''}" onclick="bordereau('${o.id}')">Éditer le bordereau${o.source==='formulaire'?' pré-rempli':' de don'}</button>` : ''}
    <button class="retirer" onclick="ouvrirEdition('dons','${o.id}')">Modifier la fiche</button>
    <button class="retirer sup" onclick="supprimer('dons','${o.id}')">Retirer</button>
  </div></div>`;
  return h;
}

async function majDon(id, champ, val){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  if(champ === 'reponse' && val === 'Oui' && !o.retrait) o.retrait = 'À organiser';
  await sauver(); rendre();
}

/* Un dépôt arrivé par le formulaire attend qu'un membre du copil
   l'ait lu : c'est ce qui distingue « reçu » de « pris en charge ». */
async function verifierDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  delete o.aVerifier;
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:aujourdhui(), heure:maintenant(), texte:"Déclaration en ligne vérifiée par la coordination.", par:moi});
  o.modifiePar = moi;
  await sauver(); rendre(); toast("Dépôt vérifié");
}

function ouvrirSuiviDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(o.structure)} — relance</h3><div class="form">
    <label><span class="k">Date</span><input type="date" id="sd-date" value="${aujourdhui()}"></label>
    <label><span class="k">Heure</span><input type="time" id="sd-heure" value="${maintenant()}"></label>
    <label class="large"><span class="k">Ce qui a été dit ou fait *</span><textarea id="sd-texte" placeholder="Rappel effectué, matériel préparé, enlèvement convenu…"></textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerSuiviDon('${o.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerSuiviDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  const g = k => document.getElementById('sd-'+k).value.trim();
  if(!g('texte')){ toast("Indiquez ce qui a été dit"); return; }
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:g('date'), heure:g('heure'), texte:g('texte'), par:moi});
  o.modifiePar = moi;
  donOuvert = o.id;
  await sauver(); fermer(); rendre(); toast("Relance consignée");
}
async function supprimerSuiviDon(id, sid){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  o.suivi = (o.suivi||[]).filter(x => x.id !== sid);
  await sauver(); rendre(); toast("Relance supprimée");
}

/* ---------- lieux de stockage ---------- */
function feuilletStockage(){
  const s = etat.stockage || [];
  const conf = s.filter(x => x.statut === 'Confirmé').length;
  const ordre = {'Confirmé':0, 'Proposé':1, 'Écarté':2};
  const tri = [...s].sort((a,b) => (ordre[a.statut]??1) - (ordre[b.statut]??1) || (a.nom||'').localeCompare(b.nom||'','fr'));

  let h = `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${s.length}</div><div class="l">lieux repérés sur le territoire</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${conf}</div><div class="l">confirmés et utilisables</div></div>
    <div class="compteur"><div class="n">${s.filter(x=>!x.referent).length}</div><div class="l">sans personne référente</div></div>
  </div>
  <div class="note">Un lieu n'est utilisable que si l'on connaît son <strong>adresse</strong>, ses <strong>horaires d'accès</strong> et la <strong>personne qui en détient les clés</strong>. Sans référent nommé, la collecte s'arrête devant une porte fermée.</div>
  <div class="barre-h">
    <span class="cpt-h">${s.length} lieu${s.length>1?'x':''}</span>
    <button class="btn sec" onclick="exporterCSV('stockage')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>

/* ---------- volontaires de la collecte ------------------
   Une collecte tient sur des mains : quelqu'un pour tenir la
   permanence, quelqu'un pour trier, quelqu'un qui a un
   utilitaire. Ce feuillet les recense et dit qui fait quoi.
   Il ne recense pas les soignants volontaires pour partir en
   renfort : ceux-là relèvent de l'onglet Volontaires, où le
   cadre — assurance, statut, continuité des soins — n'est pas
   le même. */
const RENFORT_ORDRE = {'Affecté':0, 'Confirmé':1, 'Proposé':2, 'Indisponible':3, 'Sans suite':4};
const RENFORT_ETIQ  = {'Affecté':'e-cours', 'Confirmé':'e-cours', 'Proposé':'e-attente',
                       'Indisponible':'e-bloque', 'Sans suite':'e-fini'};

const listeTaches = o => String(o.taches || '').split(',').map(x => x.trim()).filter(Boolean);
const aVehicule = o => o.vehicule && o.vehicule !== 'Aucun';

function filtrerRenfort(i){
  filtreRenfort = i === -1 ? 'Tout' : i === -2 ? 'Véhicule' : TACHES[i];
  rendre();
}

async function majRenfort(id, champ, val){
  const o = (etat.renforts||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  await sauver(); rendre();
}

/* Les tâches se cochent depuis la fiche : c'est ce qui change le
   plus souvent, au fil des disponibilités de chacun. Elles sont
   rangées dans un seul champ texte, lisible tel quel à l'export
   comme dans le dossier de traçabilité. */
async function basculerTache(id, i){
  const o = (etat.renforts||[]).find(x => x.id === id); if(!o) return;
  const t = TACHES[i], l = listeTaches(o), j = l.indexOf(t);
  if(j >= 0) l.splice(j, 1); else l.push(t);
  o.taches = TACHES.filter(x => l.indexOf(x) >= 0)
    .concat(l.filter(x => TACHES.indexOf(x) === -1)).join(', ');
  o.modifiePar = moi;
  await sauver(); rendre();
}

  const v = etat.renforts || [];

    || (a.nom||'').localeCompare(b.nom||'','fr'));

  if(!vus.length) return h + `<div class="carte"><p class="vide">Aucun volontaire dans ce filtre.</p></div>`;

  h += `<div class="stocks">`;
  vus.forEach(o => {
    const cl = (o.statut === 'Confirmé' || o.statut === 'Affecté') ? 'confirme'
      : (o.statut === 'Indisponible' || o.statut === 'Sans suite') ? 'ecarte' : '';
    const t = listeTaches(o);
    h += `<div class="stock ${cl}">
      <div>
        <div class="nom">${esc(o.nom)}</div>
        <div style="font-size:13px;color:var(--texte-2);margin-top:3px">${
          [o.profession, o.commune].filter(Boolean).map(esc).join(' · ') || '—'}</div>
      </div>
      <label class="bl"><span class="k">Statut</span>
        <select onchange="majRenfort('${o.id}','statut',this.value)">${
          ['Proposé','Confirmé','Affecté','Indisponible','Sans suite'].map(x =>
            `<option ${x===(o.statut||'Proposé')?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <div class="bl"><span class="k">Ce qu'il ou elle peut faire</span>
        <div class="taches">${TACHES.map((x,i) =>
          `<button class="${t.indexOf(x)>=0?'on':''}" onclick="basculerTache('${o.id}',${i})">${esc(x)}</button>`).join('')}</div>
        ${t.filter(x => TACHES.indexOf(x) === -1).length
          ? `<div style="font-size:13px;margin-top:6px">${esc(t.filter(x => TACHES.indexOf(x) === -1).join(', '))}</div>` : ''}</div>
      ${aVehicule(o) ? `<div class="bl"><span class="k">Véhicule</span>${esc(o.vehicule)}${o.volume?` — ${esc(o.volume)}`:''}</div>` : ''}
      ${o.dispo ? `<div class="bl"><span class="k">Disponibilités</span><span class="horaires">${esc(o.dispo)}</span></div>`
                : `<div class="obs">Disponibilités à préciser.</div>`}
      ${o.affectation ? `<div class="bl"><span class="k">Affecté à</span>${esc(o.affectation)}</div>` : ''}
      ${o.note ? `<div class="obs">${esc(o.note)}</div>` : ''}
      <div class="liens">
        ${o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>`

      </div>

/* =========================================================
   POINTS DE COLLECTE

   Une permanence tenue quelque part, un soir, par quelqu'un de
   nommé, et ce qui en est ressorti. C'est la pièce qui atteste
   de ce que la CPTS a réellement réuni — à distinguer du
   registre des donateurs, qui recense ce qui a été annoncé.

   Rien de ce qui est chiffré ici n'est saisi deux fois : les
   totaux, la synthèse par type de matériel et le nombre de
   déposants se recalculent depuis les lignes de dépôt. Le
   récapitulatif imprimable en sort tel quel, et le document
   signé sur place se joint au point comme pièce.
   ========================================================= */

const CAT_MAT = ['Dispositif médical', 'Consommable', 'Autre'];
const MAT_SUGGERES = ['Thermomètre','Hémoglucotest','Tensiomètre','Saturomètre','Stéthoscope',
                      'Masques FFP2','Gel hydroalcoolique'];
/* La désignation courante suffit à l'écran ; le document, lui,
   nomme le dispositif en toutes lettres. */
const MAT_PRECISION = {'Hémoglucotest':'lecteur de glycémie', 'Saturomètre':'oxymètre de pouls'};
/* Deux dispositifs de mesure ont été demandés sous ces deux noms
   par le site de Bordeaux : on range par défaut ce qui entre. */
const CAT_PAR_DEFAUT = {'Masques FFP2':'Consommable', 'Gel hydroalcoolique':'Consommable'};

const lignesPoint = p => Array.isArray(p.lignes) ? p.lignes : [];
const qte = l => { const n = parseFloat(String(l.quantite).replace(',','.')); return isFinite(n) ? n : 0; };
const nomMat = m => m + (MAT_PRECISION[m] ? ' (' + MAT_PRECISION[m] + ')' : '');

/* Une seule lecture des lignes, tout le monde s'en sert : les
   cartes, le document, la main courante et les exports. */
function synthesePoint(p){
  const lig = lignesPoint(p);
  const mats = new Map();
  const deps = new Map();
  lig.forEach(l => {
    const m = (l.materiel || '').trim(); if(!m) return;
    const cat = l.categorie || CAT_PAR_DEFAUT[m] || 'Dispositif médical';
    if(!mats.has(m)) mats.set(m, {materiel:m, categorie:cat, quantite:0, deposants:new Set()});
    const e = mats.get(m);
    e.quantite += qte(l);
    if(l.deposant) e.deposants.add(l.deposant.trim());
    const d = (l.deposant || '').trim();
    if(d && !deps.has(d)) deps.set(d, {deposant:d, qualite:l.qualite || '', lignes:[]});
    if(d) deps.get(d).lignes.push(l);
  });
  const parMat = [...mats.values()]
    .map(e => ({...e, deposants: e.deposants.size}))
    .sort((a,b) => (CAT_MAT.indexOf(a.categorie) - CAT_MAT.indexOf(b.categorie)) || (b.quantite - a.quantite));
  const parCat = CAT_MAT.map(c => ({
    categorie: c,
    quantite: parMat.filter(m => m.categorie === c).reduce((s,m) => s + m.quantite, 0),
    types: parMat.filter(m => m.categorie === c).length
  })).filter(c => c.types);
  return {
    lignes: lig.length,
    deposants: [...deps.values()],
    unites: parMat.reduce((s,m) => s + m.quantite, 0),
    parMat, parCat
  };
}

const pointsClotures = () => (etat.points||[]).filter(p => p.statut === 'Clôturé');
function pointsTries(){
  return [...(etat.points||[])].sort((a,b) =>
    ((b.date||'') + ' ' + (b.debut||'')).localeCompare((a.date||'') + ' ' + (a.debut||'')));
}

/* --- Pièces jointes -------------------------------------
   Le récapitulatif signé sur place, la photo d'un bordereau : le
   fichier part sur l'hébergement par une porte à part, et le
   point n'en garde que le nom. Il ne transite jamais par l'état
   partagé, que chaque poste relit en entier toutes les quinze
   secondes. */
const PIECE_MAX_MO = 4;
function lienPiece(idp){ return API + '?piece=' + encodeURIComponent(idp) + '&code=' + encodeURIComponent(codeAcces); }
const poids = o => o < 1024 ? o + ' o' : o < 1048576 ? Math.round(o/1024) + ' Ko' : (o/1048576).toFixed(1).replace('.',',') + ' Mo';

function choisirPiece(id){
  if(!modeServeur){ toast("Le serveur ne répond pas : une pièce ne peut être jointe que depuis le cockpit partagé"); return; }
  const i = document.getElementById('pj-' + id);
  if(i) i.click();
}
async function joindrePiece(id, input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  if(f.size > PIECE_MAX_MO * 1000000){ toast("Fichier trop lourd — " + PIECE_MAX_MO + " Mo au maximum"); return; }
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  toast("Envoi de « " + f.name + " »…");
  const lu = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => res('');
    r.readAsDataURL(f);
  });
  if(!lu){ toast("Fichier illisible"); return; }
  let r;
  try{
    r = await fetch(API + '?piece', {
      method: 'POST',
      headers: {'X-Code-Acces': codeAcces, 'Content-Type': 'application/json'},
      body: JSON.stringify({nom: f.name, donnees: lu, par: moi})
    });
  }catch(e){ toast("Serveur injoignable — la pièce n'a pas été envoyée"); return; }
  let d = null;
  try{ d = await r.json(); }catch(e){}
  if(!r.ok || !d || !d.id){ toast((d && d.erreur) || "Envoi impossible"); return; }
  p.pieces = Array.isArray(p.pieces) ? p.pieces : [];
  p.pieces.push({id:d.id, nom:d.nom, taille:d.taille, le:d.le, par:moi});
  p.modifiePar = moi;
  await sauver(); rendre();
  toast("« " + d.nom + " » joint au point de collecte");
}
async function retirerPiece(id, idp){
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  const pc = (p.pieces||[]).find(x => x.id === idp);
  if(!confirm("Retirer « " + ((pc && pc.nom) || 'cette pièce') + " » ? Le fichier est supprimé de l'hébergement.")) return;
  try{
    await fetch(API + '?piece=' + encodeURIComponent(idp), {
      method: 'POST',
      headers: {'X-Code-Acces': codeAcces, 'Content-Type': 'application/json'},
      body: JSON.stringify({supprimer: true})
    });
  }catch(e){}
  p.pieces = (p.pieces||[]).filter(x => x.id !== idp);
  p.modifiePar = moi;
  await sauver(); rendre(); toast("Pièce retirée");
}

/* --- Le feuillet ---------------------------------------- */
function feuilletPoints(){
  const pts = pointsTries();
  const clos = pointsClotures();
  const total = clos.reduce((s,p) => s + synthesePoint(p).unites, 0);
  const deposants = new Set();
  clos.forEach(p => synthesePoint(p).deposants.forEach(d => deposants.add(d.deposant.toLowerCase())));

  let h = `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${pts.length}</div><div class="l">point${pts.length>1?'s':''} de collecte tenu${pts.length>1?'s':''}</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${total}</div><div class="l">unités collectées, tous points confondus</div></div>
    <div class="compteur"><div class="n">${deposants.size}</div><div class="l">déposants distincts</div></div>
    <div class="compteur"><div class="n">${clos.length}</div><div class="l">point${clos.length>1?'s':''} clôturé${clos.length>1?'s':''}</div></div>
  </div>
  <div class="note">Un point de collecte se clôture par un <strong>récapitulatif</strong> : ce qui a été déposé, par qui, en quelles quantités, et à quelle heure la permanence a fermé. Les totaux ne se saisissent pas — ils se recalculent à partir des lignes de dépôt, pour qu'un chiffre annoncé ne puisse jamais diverger du détail qui le compose. Le <strong>document signé sur place</strong> se joint au point : il est conservé sur l'hébergement, à côté du cockpit, et suit la copie transmise au site destinataire.</div>
  <div class="barre-h">
    <span class="cpt-h">${pts.length} point${pts.length>1?'s':''} · ${total} unité${total>1?'s':''}</span>
    <button class="btn sec" onclick="exporterPoints()">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirPoint()">Ouvrir un point de collecte</button>
  </div>`;

  if(!pts.length) return h + `<div class="carte"><p class="vide">Aucun point de collecte enregistré. Ouvrez-en un dès que le lieu et le créneau sont arrêtés : les dépôts s'y consignent au fil de l'eau, et la clôture produit le récapitulatif.</p></div>`;

  h += `<div class="pcs">`;
  pts.forEach(p => {
    const s = synthesePoint(p);
    const clot = p.statut === 'Clôturé';
    h += `<div class="pc ${clot?'clos':''}">
      <div class="tete">
        <div class="id">
          <div class="n">${esc(p.lieu || 'Point de collecte')}</div>
          <div class="s">${[frdateL(p.date),
             (p.debut || p.fin) ? (esc(p.debut||'—') + ' – ' + esc(p.fin||'—')) : '',
             p.adresse ? esc(p.adresse) : ''].filter(Boolean).join(' · ')}</div>
        </div>
        <span class="etiq ${clot?'e-fini':'e-cours'}">${esc(p.statut || 'Ouvert')}</span>
      </div>
      <div class="chiffres">
        <div><div class="v">${s.lignes}</div><div class="l">lignes de dépôt</div></div>
        <div><div class="v">${s.deposants.length}</div><div class="l">déposants distincts</div></div>
        <div><div class="v">${s.unites}</div><div class="l">unités collectées</div></div>
        <div class="${p.colis?'':'manque'}"><div class="v">${esc(p.colis || '—')}</div><div class="l">colis / cartons</div></div>
        <div><div class="v">${esc(p.cloture || '—')}</div><div class="l">heure de clôture</div></div>
      </div>
      ${s.parMat.length ? `<div class="synth">${s.parMat.map(m =>
        `<span class="${m.categorie==='Dispositif médical'?'':'conso'}"><b>${m.quantite}</b> ${esc(m.materiel)}<span style="opacity:.6"> · ${m.deposants} dépos.</span></span>`).join('')}</div>` : ''}
      ${p.responsable ? `<div class="bl"><span class="k">Responsable sur place</span>${esc(p.responsable)}</div>` : `<div class="obs">Responsable sur place à nommer.</div>`}
      ${p.equipe ? `<div class="bl"><span class="k">Avec</span>${esc(p.equipe)}</div>` : ''}
      ${p.destination ? `<div class="bl"><span class="k">Destination</span>${esc(p.destination)}${p.acheminement ? ' — ' + esc(p.acheminement) : ''}</div>` : `<div class="obs">Destination du matériel à nommer : aucun enlèvement sans lieu de livraison.</div>`}
      ${p.observations ? `<div class="obs">${esc(p.observations)}</div>` : ''}
      ${(p.pieces||[]).length
        ? `<div class="pieces">${p.pieces.map(x => `<div class="piece">
             <a href="${esc(lienPiece(x.id))}" target="_blank" rel="noopener">${esc(x.nom)}</a>
             <span class="q">${esc(poids(x.taille||0))}${x.par ? ' · déposé par ' + esc(x.par) : ''}</span>
             <button onclick="retirerPiece('${p.id}','${x.id}')" title="Retirer la pièce">✕</button>
           </div>`).join('')}</div>`
        : `<div class="sanspiece">Aucune pièce jointe. Le récapitulatif signé sur place, ou sa photo, se joint ici : c'est lui qui fait foi auprès du site destinataire.</div>`}
      <input type="file" id="pj-${p.id}" style="display:none"
        accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.csv,.xlsx,.docx" onchange="joindrePiece('${p.id}', this)">
      <div class="actions">
        <button class="btn" onclick="recapPoint('${p.id}')">Récapitulatif</button>
        <button class="btn sec" onclick="choisirPiece('${p.id}')">Joindre une pièce</button>
        <button class="btn sec" onclick="ouvrirPoint('${p.id}')">Modifier ${clot ? '' : 'et consigner les dépôts'}</button>
        ${clot ? '' : `<button class="btn sec" onclick="cloturerPoint('${p.id}')">Clôturer</button>`}
        <button class="btn sec" onclick="supprimerPoint('${p.id}')" style="margin-left:auto">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}
