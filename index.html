     la relève, et repart au prochain enregistrement : c'est ce qui
     manquait quand les numéros des pilotes disparaissaient. En cas de
     saisie concurrente sur la même personne, le serveur l'emporte. */
  normaliserPersonnes();
  const carnetLocal = etat.personnes;

  for(const k in etatInitial){ if(src[k] !== undefined) etat[k] = src[k]; }
  fusionnerNouveautes();
  normaliserPersonnes();

  const aDeposer = Object.keys(carnetLocal).filter(c => !etat.personnes[c]);
  etat.personnes = Object.assign({}, carnetLocal, etat.personnes);
  marquerSynchronise();
  /* Ce que le serveur ignore encore doit repartir : on marque la
     rubrique comme à envoyer plutôt que comme synchronisée. */
  if(aDeposer.length) empreinte.personnes = null;
}

/* Renvoie 'ok', 'code' (code d'accès à fournir) ou 'absent'
   (pas d'hébergement en face : on reste en local). */
async function joindreServeur(){
  try{
    const r = await appelApi('GET');
    if(r.statut === 401) return 'code';
    if(!r.ok || !r.corps) return 'absent';
    appliquerDistant(r.corps);
    return 'ok';
  }catch(e){ return 'absent'; }
}

async function charger(){
  try{
    const p = await window.storage.get('cpts_identite', false);
    if(p && p.value) dernierNom = p.value;
  }catch(e){}
  try{
    const c = localStorage.getItem('cpts64_code');
    if(c) codeAcces = c;
  }catch(e){}

  const etatLocal = await lireLocal();
  let issue = await joindreServeur();

  if(issue === 'code'){
    majBandeau(); rendre();
    return demanderCode();
  }
  if(issue === 'ok'){
    modeServeur = true;
    stockageActif = true;
    /* Serveur vierge : on l'amorce avec l'état de référence,
       appels aux CPTS compris. */
    if(versionServeur === 0){ empreinte = {}; await sauver(); }
    lancerSondage();
  }else{
    if(etatLocal){
      if(Array.isArray(etatLocal.diffusions)) diffusionsHeritees = etatLocal.diffusions;
      for(const k in etatInitial){ if(etatLocal[k] !== undefined) etat[k] = etatLocal[k]; }
    }
    fusionnerNouveautes();
    normaliserPersonnes();
    marquerSynchronise();
    stockageActif = true;
  }
  majBandeau(); rendre();
  demanderIdentite(true);
}

async function lireLocal(){
  try{
    const r = await window.storage.get(CLE, true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return null;
}

function demanderCode(){
  verrouModale = true;
  document.getElementById('modale').innerHTML = `<h3>Code d'accès</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Ce cockpit contient des coordonnées de professionnels de santé et le détail des échanges de crise. Le code vous a été communiqué par la coordination.</p>
    <label><span class="k">Code</span><input id="in-code" type="password" placeholder="Code d'accès" onkeydown="if(event.key==='Enter')validerCode()"></label>
    <div class="actions"><button class="btn" onclick="validerCode()">Entrer</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('in-code'); if(i) i.focus(); }, 60);
}
async function validerCode(){
  const v = document.getElementById('in-code').value.trim();
  if(!v){ toast("Saisissez le code d'accès"); return; }
  codeAcces = v;
  const issue = await joindreServeur();
  if(issue === 'code'){ toast("Code d'accès incorrect"); return; }
  try{ localStorage.setItem('cpts64_code', v); }catch(e){}
  verrouModale = false;
  if(issue === 'ok'){
    modeServeur = true;
    if(versionServeur === 0){ empreinte = {}; await sauver(); }
    lancerSondage();
  }
  stockageActif = true;
  fermer(); majBandeau(); rendre();
  demanderIdentite(true);
}

/* Relève régulière des modifications des autres postes. On
   s'abstient pendant une saisie ou tant qu'il reste quelque
   chose à envoyer, pour ne rien écraser sous les doigts. */
function lancerSondage(){
  if(sondage) clearInterval(sondage);
  sondage = setInterval(async () => {
    if(!modeServeur) return;
    if(document.getElementById('rideau').classList.contains('on')) return;
    if(rubriquesModifiees().length) return;
    try{
      const r = await appelApi('GET');
      if(!r.ok || !r.corps) return;
      if((r.corps.version || 0) === versionServeur) return;
      appliquerDistant(r.corps);
      majBandeau(); rendre();
      toast("Cockpit actualisé — saisie de " + (r.corps.par || 'un membre du copil'));
    }catch(e){}
  }, 15000);
}

/* Les rubriques amorcées depuis l'état de référence. Une fiche
   n'y est ajoutée que si son identifiant est inconnu du cockpit
   et qu'elle n'a pas été retirée à la main : ce qui a été saisi
   par le copil n'est jamais touché. C'est par là qu'arrivent les
   éléments consignés hors ligne, au téléphone notamment. */
const SEEDS = ['missions','veille','ars','sources','rubriques','lignes','offre','cpts','courante','terrain','materiel','stockage','points','contacts','referents','medecins','orientes','relais'];
function fusionnerNouveautes(){
  etat.retires = etat.retires || [];
  SEEDS.forEach(k => {
    if(!Array.isArray(etat[k]) || !Array.isArray(etatInitial[k])) return;
    const vus = new Set(etat[k].map(x => x.id));
    etatInitial[k].forEach(o => {
      if(!vus.has(o.id) && !etat.retires.includes(o.id)) etat[k].push(JSON.parse(JSON.stringify(o)));
    });
  });
  reverserDiffusions();
  completerVeille();
  corrigerRelaisRenfort();
}

/* La CPTS ne lançait aucun appel à volontaires en propre : c'était
   écrit noir sur blanc dans la fiche du relais de diffusion. Elle
   en lance un depuis l'ouverture de l'appel au renfort, et la
   phrase est devenue fausse. On la corrige une fois, et seulement
   si elle n'a pas déjà été réécrite à la main. */
const ANCIENNE_LIMITE_M5 = "On ne lance pas d'appel à volontaires en propre.";
function corrigerRelaisRenfort(){
  const m = (etat.missions||[]).find(x => x.id === 'm5');
  const ref = (etatInitial.missions||[]).find(x => x.id === 'm5');
  if(!m || !m.fiche || !ref || m.fiche.limite !== ANCIENNE_LIMITE_M5) return;
  m.fiche.limite = ref.fiche.limite;
}

/* « Ce qu'on a diffusé » faisait doublon avec la main courante et a été
   retiré du cockpit : tout ce qui partait de la CPTS se consigne
   désormais en main courante, comme le reste. Les messages qui y avaient
   été saisis sont repris ici : ceux déjà consignés en main courante
   (identifiants ci-dessous) n'y sont pas remis une seconde fois, les
   autres y sont reversés pour qu'aucune saisie ne parte avec l'onglet.
   La reprise se fait une fois : la fiche reversée porte un identifiant
   dérivé du sien, et n'est pas recréée si elle est déjà là ou si elle a
   été retirée à la main. */
let diffusionsHeritees = [];
const DIFF_DEJA_CONSIGNEES = ['d1','d2','d3','d4','d5','d6','d7','d8'];
function reverserDiffusions(){
  if(!diffusionsHeritees.length) return;
  etat.courante = etat.courante || [];
  etat.retires = etat.retires || [];
  const vus = new Set(etat.courante.map(o => o.id));
  diffusionsHeritees.forEach(d => {
    if(!d || !d.id || DIFF_DEJA_CONSIGNEES.includes(d.id)) return;
    const id = 'mcd-' + d.id;
    if(vus.has(id) || etat.retires.includes(id)) return;
    const detail = [
      d.canal       ? "Canal : " + d.canal : '',
      d.cible       ? "Destinataires : " + d.cible : '',
      d.portee      ? "Nombre de destinataires : " + d.portee : '',
      d.emetteur    ? "Émetteur : " + d.emetteur : '',
      d.valide      ? "Validé par : " + d.valide : '',
      d.demande     ? "Demande formulée : " + d.demande : '',
      d.retourCanal ? "Canal de retour indiqué : " + d.retourCanal : ''
    ].filter(Boolean).join(' · ');
    etat.courante.push({
      id, date: d.date || '', heure: d.heure || '', source: 'Diffusion',
      evenement: "Message diffusé — " + (d.objet || 'objet non renseigné') + (detail ? "\n" + detail : ''),
      suite: [d.retours ? "Retours reçus : " + d.retours : '', d.observation || ''].filter(Boolean).join(' '),
      statut: 'À suivre', auteur: d.auteur || '', quand: d.quand || ''
    });
    vus.add(id);
  });
}

/* Les fiches enregistrées avant l'arrivée du poste de veille n'ont
   ni rythme, ni impact, ni suite. On ne remplit que les champs
   absents — jamais ceux qui portent déjà une saisie du copil. */
function completerVeille(){
  const combler = (o, defauts) => {
    for(const c in defauts) if(o[c] === undefined || o[c] === null) o[c] = defauts[c];
  };
  const refSrc = new Map((etatInitial.sources||[]).map(o => [o.id, o]));
  (etat.sources||[]).forEach(o => {
    const r = refSrc.get(o.id);
    combler(o, {rythme: r ? r.rythme : 'Chaque tour', quoi: r ? r.quoi : ''});
    /* Le carnet était rangé par catégorie libre ; il l'est désormais
       par famille de canal. Les sources déjà enregistrées récupèrent
       leur famille et leur point de situation à la volée. */
    if(!o.famille) o.famille = r ? r.famille : familleDeCat(o.cat);
    if(o.point === undefined) o.point = r ? r.point : '';
  });
  const refV = new Map((etatInitial.veille||[]).map(o => [o.id, o]));
  (etat.veille||[]).forEach(o => {
    const r = refV.get(o.id);
    combler(o, {
      impact:    r ? r.impact    : 'contexte',
      suite:     r ? r.suite     : 'rien',
      suiteEtat: r ? r.suiteEtat : 'traite',
      suiteNote: r ? r.suiteNote : ''
    });
    if(o.rubrique === undefined) o.rubrique = r ? (r.rubrique || '') : '';
  });
  etat.rubriques = etat.rubriques || [];
  const refR = new Map((etatInitial.rubriques||[]).map(o => [o.id, o]));
  etat.rubriques.forEach(o => {
    const r = refR.get(o.id);
    combler(o, {quoi: r ? r.quoi : '', ou: r ? r.ou : '', etat:'', maj:'', par:''});
  });
}
/* Rattrapage des anciennes catégories saisies à la main. */
function familleDeCat(c){
  c = (c || '').toLowerCase();
  if(c.indexOf('ars') === 0 || c.indexOf('institutionnel') === 0) return "ARS et autorités sanitaires";
  if(c.indexOf('préfecture') === 0 || c.indexOf('prefecture') === 0) return 'Préfectures';
  if(c.indexOf('urps') === 0 || c.indexOf('ordre') === 0) return 'URPS et ordres';
  if(c.indexOf('environnement') === 0 || c.indexOf('météo') === 0) return 'Environnement et météo';
  if(c.indexOf('suivi') === 0 || c.indexOf('feu') === 0 || c.indexOf('incendie') === 0) return 'Suivi des incendies';
  if(c.indexOf('établissement') === 0 || c.indexOf('etablissement') === 0) return 'Établissements de santé';
  if(c.indexOf('collectivité') === 0 || c.indexOf('collectivite') === 0) return 'Collectivités';
  if(c.indexOf('presse') === 0 || c.indexOf('média') === 0) return 'Presse';
  return 'Autres canaux';
}

async function sauver(){
  etat.entete.maj = new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  majBandeau();

  /* Copie locale systématique : même en mode partagé, elle sert
     de filet si l'hébergement devient injoignable. */
  try{ await window.storage.set(CLE, JSON.stringify(etat), true); }catch(e){}

  if(modeServeur) return sauverServeur();
  if(!stockageActif) toast("Modification enregistrée dans cette session seulement");
  return 'local';
}

async function sauverServeur(reste){
  if(reste === undefined) reste = 4;
  const modifiees = rubriquesModifiees();
  if(!modifiees.length) return;

  const corps = { version: versionServeur, par: moi, donnees: {} };
  modifiees.forEach(k => corps.donnees[k] = etat[k]);

  let r;
  try{
    r = await appelApi('POST', corps);
  }catch(e){
    toast("Serveur injoignable — saisie conservée sur cet appareil");
    return 'local';
  }

  if(r.ok && r.corps){
    versionServeur = r.corps.version;
    marquerSynchronise();
    return 'ok';
  }

  /* Quelqu'un a enregistré entre-temps. On repart de sa version et
     on y réapplique nos seules modifications, fiche par fiche. */
  if(r.statut === 409 && r.corps && reste > 0){
    versionServeur = r.corps.version || 0;
    const src = r.corps.donnees || {};
    RUBRIQUES.forEach(k => {
      if(src[k] === undefined) return;
      etat[k] = modifiees.indexOf(k) === -1 ? src[k] : fusionner(instantane[k], etat[k], src[k]);
      instantane[k] = copie(src[k]);
    });
    RUBRIQUES.forEach(k => { empreinte[k] = modifiees.indexOf(k) === -1 ? empreinteDe(k) : null; });
    majBandeau(); rendre();
    return sauverServeur(reste - 1);
  }

  if(r.statut === 401){
    modeServeur = false;
    toast("Session expirée — code d'accès à ressaisir");
    demanderCode();
    return 'local';
  }
  toast("Enregistrement sur le serveur impossible — copie locale conservée");
  return 'local';
}

function editerEntete(){
  document.getElementById('modale').innerHTML = `<h3>État affiché en haut du cockpit</h3>
    <label style="margin-bottom:12px"><span class="k">Pastille — court</span><input id="en-niveau" value="${esc(etat.entete.niveau)}"></label>
    <label style="margin-bottom:12px"><span class="k">Phrase de situation</span><textarea id="en-phrase">${esc(etat.entete.phrase)}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerEntete()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerEntete(){
  etat.entete.niveau = document.getElementById('en-niveau').value.trim() || etat.entete.niveau;
  etat.entete.phrase = document.getElementById('en-phrase').value.trim();
  await sauver(); fermer(); majBandeau(); toast("État mis à jour");
}

function majBandeau(){
  document.getElementById('niveau').textContent = etat.entete.niveau;
  document.getElementById('phrase').textContent = etat.entete.phrase;
  document.getElementById('maj').textContent = etat.entete.maj ? 'Dernière saisie ' + etat.entete.maj : '';
  const etatSync = modeServeur
    ? 'Cockpit partagé — le copil voit vos saisies'
    : 'Enregistré sur cet appareil seulement';
  document.getElementById('identite').innerHTML =
    'Connecté·e comme ' + esc(moi) + '<br><span style="opacity:.7">' + etatSync + '</span>';
}

/* =========================================================
   OUTILS
   ========================================================= */
const ESPACES = {m1:'terrain', m2:'terrain', m3:'materiel', m4:'appels', m5:'courante', m6:'courante'};
const espaceDe = m => m.espace || ESPACES[m.id] || 'courante';
const nomEspace = id => (ONGLETS.find(o => o.id === id) || {}).nom || 'Main courante';
const cleP = n => (n||'').trim().toLowerCase();

function noterRetrait(id){
  etat.retires = etat.retires || [];
  if(!etat.retires.includes(id)) etat.retires.push(id);
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aujourdhui = () => new Date().toISOString().slice(0,10);
const maintenant = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function frdate(d){ if(!d) return '—'; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1] : d; }
/* Les listes se lisent en « 27/07 » ; une mention qui fait foi
   sur un bordereau porte l'année. */
function frdateL(d){ if(!d) return '—'; const p = String(d).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d; }

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove('on'), 2600);
}
let verrouModale = false;
function fermer(){
  if(verrouModale) return;
  document.getElementById('rideau').classList.remove('on');
  document.getElementById('modale').classList.remove('large');
}
document.getElementById('rideau').addEventListener('click', e => { if(e.target.id === 'rideau') fermer(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fermer(); });

/* Le carnet de coordonnées est un dictionnaire, pas une liste :
   les fiches y sont rangées par nom. Or un objet vide part en JSON
   `{}` et revient du serveur en `[]` — PHP ne distingue pas les
   deux. Et une fois devenu tableau, il avale les numéros sans
   jamais les rendre : JSON.stringify ignore les clés nommées d'un
   tableau, si bien que la saisie disparaît au rafraîchissement
   suivant. On le remet donc en dictionnaire à chaque fois qu'il
   entre dans le cockpit. */
function normaliserPersonnes(){
  const p = etat.personnes;
  if(p && typeof p === 'object' && !Array.isArray(p)) return;
  const v = {};
  if(Array.isArray(p)) p.forEach(x => { if(x && x.nom) v[cleP(x.nom)] = x; });
  etat.personnes = v;
}

function coord(nom){
  normaliserPersonnes();
  return etat.personnes[cleP(nom)] || {};
}
function editerContact(nom){
  const c = coord(nom);
  document.getElementById('modale').innerHTML = `<h3>Contact de ${esc(nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Renseigné une fois, utilisable par tout le monde en un clic depuis l'organigramme.</p>
    <label><span class="k">Téléphone</span><input id="ct-tel" type="tel" value="${esc(c.tel||'')}" placeholder="06 12 34 56 78"></label>
    <label style="margin-top:12px"><span class="k">Mail</span><input id="ct-mail" type="email" value="${esc(c.mail||'')}" placeholder="prenom.nom@exemple.fr"></label>
    <div class="actions"><button class="btn" onclick="validerContact('${esc(nom).replace(/'/g,"\\'")}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerContact(nom){
  normaliserPersonnes();
  etat.personnes[cleP(nom)] = {
    nom: nom,
    tel: document.getElementById('ct-tel').value.trim(),
    mail: document.getElementById('ct-mail').value.trim()
  };
  /* Ce carnet a déjà été perdu une fois : on force son envoi au lieu
     de s'en remettre à la détection de changement, et on dit ce qui
     s'est réellement passé plutôt qu'un « enregistré » de principe. */
  empreinte.personnes = null;
  const issue = await sauver();
  fermer(); rendre();
  toast(issue === 'ok' ? "Contact enregistré et partagé avec le copil"
                       : "Contact conservé sur cet appareil — le serveur n'a pas répondu");
}

/* Toute personne dont le nom figure déjà dans le cockpit : pilotes et
   suppléants des missions, mais aussi auteurs d'un appel ou d'une saisie.
   C'est la liste proposée en un clic à l'ouverture. */
function nomsMissionnes(){
  const v = new Map();
  const ajouter = n => {
    const t = (n||'').trim();
    if(t && t !== 'Anonyme') v.set(cleP(t), t);
  };
  etat.missions.forEach(m => {
    ajouter(m.pilote); ajouter(m.suppleant);
    (Array.isArray(m.renforts) ? m.renforts : []).forEach(r => ajouter(r.nom));
  });
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a => ajouter(a.par)));
  ['veille','ars'].forEach(k =>
    (etat[k]||[]).forEach(o => { ajouter(o.auteur); ajouter(o.modifiePar); }));
  return [...v.values()].sort((a,b)=>a.localeCompare(b,'fr'));
}

/* Passage obligé à chaque ouverture : rien n'est saisi sous « Anonyme ».
   En mode porte (ouverture du lien), la fenêtre ne peut pas être fermée
   sans avoir donné un nom. */
function demanderIdentite(porte){
  const m = document.getElementById('modale');
  const noms = nomsMissionnes();
  verrouModale = !!porte;
  let h = `<h3>Qui êtes-vous&nbsp;?</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Votre nom est associé à chacune de vos saisies. Il est demandé à chaque ouverture du cockpit, pour que tout ce qui est consigné reste traçable.</p>`;
  if(noms.length){
    h += `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà missionné·e ou déjà intervenu·e — un clic suffit&nbsp;:</p>
      <div class="choixnom">` + noms.map(n =>
      `<button onclick="choisirNom('${esc(n).replace(/'/g,"\\'")}')"${cleP(n)===cleP(dernierNom)?' style="border-color:var(--marque);font-weight:600"':''}>${esc(n)}</button>`).join('') + `</div>
      <p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Vous n'êtes pas dans cette liste&nbsp;?</p>`;
  }
  h += `<label><span class="k">Prénom et nom</span><input id="in-moi" value="${esc(moi === 'Anonyme' ? dernierNom : moi)}" placeholder="Prénom et nom" onkeydown="if(event.key==='Enter')validerIdentite()"></label>
    <div class="actions"><button class="btn" onclick="validerIdentite()">Entrer dans le cockpit</button>${porte?'':'<button class="btn sec" onclick="fermer()">Annuler</button>'}</div>`;
  m.innerHTML = h;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('in-moi'); if(i && !noms.length) i.focus(); }, 60);
}
async function choisirNom(n){
  moi = n;
  dernierNom = n;
  try{ await window.storage.set('cpts_identite', n, false); }catch(e){}
  verrouModale = false;
  fermer(); majBandeau(); rendre();
  toast("Session ouverte au nom de " + n);
}
async function validerIdentite(){
  const v = document.getElementById('in-moi').value.trim();
  if(!v){ toast("Indiquez votre prénom et votre nom"); return; }
  await choisirNom(v);
}

function csvVal(v){ return '"' + String(v ?? '').replace(/"/g,'""') + '"'; }
function telechargerCSV(nom, rows){
  const txt = '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');
  const b = new Blob([txt], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);

function exporterCSV(k){
  const cfg = CHAMPS[k];
  const cols = ['date', ...cfg.f.map(f => f.c), 'auteur', 'modifiePar'];
  const ent  = ['Date', ...cfg.f.map(f => f.l), 'Saisi par', 'Modifié par'];
  const lig  = chrono(k, etat[k]).map(o => cols.map(c => csvVal(o[c])));
  telechargerCSV(cfg.titre, [ent.map(csvVal), ...lig]);
}
function exporterTout(){
  const rows = [['Onglet','Date','Heure','Nature','Contenu','Détail','Par'].map(csvVal)];
  evenements().forEach(e => rows.push([e.type, e.date, e.heure, e.type, e.titre, e.detail, e.qui].map(csvVal)));
  telechargerCSV('Traçabilité complète', rows);
}

function importer(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(Array.isArray(d.diffusions)) diffusionsHeritees = d.diffusions;
      for(const k in etatInitial){ if(d[k] !== undefined) etat[k] = d[k]; }
      fusionnerNouveautes();
      await sauver(); rendre(); toast("Données importées");
    }catch(e){ toast("Fichier illisible"); }
  };
  r.readAsText(f); ev.target.value = '';
}

function rendreMesMissions(){
  const el = document.getElementById('mesmissions');
  if(moi === 'Anonyme'){ el.innerHTML = ''; return; }
  const miennes = etat.missions.filter(m => cleP(m.pilote) === cleP(moi) || cleP(m.suppleant) === cleP(moi));
  if(!miennes.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="t">Vos missions</div>` + miennes.map(m => {
    const role = cleP(m.pilote) === cleP(moi) ? 'Pilote' : 'Appui';
    return `<button onclick="voirFiche('${m.id}')">${esc(m.titre)}<span class="r">${role} · fiche et espace</span></button>`;
  }).join('');
}

function rendreNav(){
  let h = '', g = '';
  ONGLETS.forEach(o => {
    if(o.groupe !== g){ g = o.groupe; h += `<div class="groupe">${g}</div>`; }
    const n = o.cpt ? (etat[o.cpt] || []).length : '';
    h += `<button class="${onglet===o.id?'actif':''}" onclick="aller('${o.id}')">${o.nom}${n!==''?`<span class="cpt">${n}</span>`:''}</button>`;
  });
  document.getElementById('nav').innerHTML = h;
}

function ouvrirAjout(k, mode){
  document.getElementById('modale').innerHTML = formulaire(k, null, mode);
  document.getElementById('rideau').classList.add('on');
}

/* Les champs retenus selon le mode de saisie : en saisie manuelle on
   ne demande pas qui a mené l'appel, puisqu'il n'y a pas eu d'appel. */
function champsVisibles(cfg, mode){
  return cfg.f.filter(f => mode === 'manuel' ? !f.appel : !f.manuel);
}

function formulaire(k, o, mode){
  const cfg = CHAMPS[k];
  const ed = !!o;
  if(!mode && ed && o.source === 'saisie') mode = 'manuel';
  const man = mode === 'manuel';
  let h = `<h3>${esc(cfg.titre)} — ${ed ? 'modifier' : (man ? 'saisie manuelle' : 'nouvelle entrée')}</h3>`;
  if(man) h += `<p class="chapo" style="margin:-6px 0 14px">Pour reporter au registre une réponse obtenue autrement que par un appel de la CPTS — une réponse au formulaire en ligne, un message reçu. La ligne compte comme les autres ; elle porte la mention « saisie à la main » au lieu du nom de l'appelant.</p>`;
  h += `<div class="form">`;
  h += `<label><span class="k">Date</span><input type="date" id="f-${k}-date" value="${esc(ed ? (o.date||'') : aujourdhui())}"></label>`;
  champsVisibles(cfg, mode).forEach(f => {
    const val = ed ? (o[f.c] ?? '') : (typeof f.d === 'function' ? f.d() : '');
    const id = `f-${k}-${f.c}`;
    h += `<label class="${f.large?'large':''}"><span class="k">${esc(man && f.lm ? f.lm : f.l)}${f.req?' *':''}</span>`;
    if(f.t === 'textarea') h += `<textarea id="${id}">${esc(val)}</textarea>`;
    else if(f.t === 'select'){
      /* Certaines listes se construisent à la volée : les lieux de
         stockage déjà saisis, par exemple. */
      const opts = typeof f.o === 'function' ? f.o() : f.o;
      const liste = opts.indexOf(val) === -1 && val ? [val, ...opts] : opts;
      h += `<select id="${id}">${liste.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    }
    else h += `<input type="${f.t}" id="${id}" value="${esc(val)}">`;
    h += `</label>`;
  });
  h += `</div><div class="actions"><button class="btn" onclick="enregistrer('${k}',${ed?`'${o.id}'`:'null'},'${mode||''}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  return h;
}

function ouvrirEdition(k, id){
  const o = (etat[k]||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = formulaire(k, o);
  document.getElementById('rideau').classList.add('on');
}

async function enregistrer(k, id, mode){
  const cfg = CHAMPS[k];
  const existant = id ? (etat[k]||[]).find(x => x.id === id) : null;
  const o = existant || {id:uid(), auteur:moi, quand:new Date().toISOString()};
  if(!existant && mode === 'manuel') o.source = 'saisie';
  let manque = null;
  const dEl = document.getElementById(`f-${k}-date`);
  o.date = dEl ? dEl.value : aujourdhui();
  /* Seuls les champs affichés sont relus : sinon un champ masqué par
     le mode de saisie serait effacé à chaque enregistrement. */
  champsVisibles(cfg, mode || (o.source === 'saisie' ? 'manuel' : '')).forEach(f => {
    const el = document.getElementById(`f-${k}-${f.c}`);
    const v = el ? el.value.trim() : '';
    if(f.req && !v && !manque) manque = f.l;
    o[f.c] = v;
  });
  if(manque){ toast(`Champ obligatoire : ${manque}`); return; }
  if(existant){
    o.modifiePar = moi;
  }else{
    /* Registre classé à la main : la nouvelle entrée passe devant
       toutes les autres plutôt que de se perdre au milieu. */
    if(estManuel(k)) o.rang = Math.min(...etat[k].map(x => typeof x.rang === 'number' ? x.rang : 0)) - 1;
    etat[k].unshift(o);
  }
  await sauver(); fermer(); rendre(); toast(existant ? "Modifié" : "Enregistré");
}

async function supprimer(k, id){
  noterRetrait(id);
  etat[k] = etat[k].filter(x => x.id !== id);
  await sauver(); rendre(); toast("Ligne supprimée");
}

/* Les registres de traçabilité se lisent du plus récent au plus ancien :
   ce qui vient d'arriver est la première chose qu'on doit voir en ouvrant
   la page, et on remonte le temps en descendant. Le tri se fait à
   l'affichage seulement — l'ordre de stockage n'est pas touché, et les
   lignes saisies sans heure se rangent en fin de journée. */
const CHRONO = ['ars','courante','terrain','materiel','appels','orientes'];

/* L'heure est ramenée à HH:MM avant d'être comparée : une entrée saisie
   « 9h05 » ou « 9:05 » doit se ranger avant 14:01, pas après. Une entrée
   sans heure se range en fin de journée, faute de mieux. */
function cleHeure(v){
  const m = String(v || '').match(/^\s*(\d{1,2})\s*[:hH.]\s*(\d{1,2})/);
  return m ? m[1].padStart(2,'0') + ':' + m[2].padStart(2,'0') : '';
}
function antechrono(lignes){
  const cle = o => (o.date || '') + ' ' + cleHeure(o.heure);
  return [...(lignes || [])].sort((a,b) => cle(b).localeCompare(cle(a)));
}

/* Le classement à la main l'emporte sur le tri par date dès qu'une
   entrée porte un rang. Le rang est posé sur la fiche elle-même, et
   non déduit de l'ordre du tableau : c'est ce qui lui permet de
   survivre à la fusion avec le serveur quand deux postes saisissent
   en même temps — un simple déplacement de ligne serait sinon repris
   par la version d'en face, qui ne l'aurait pas vu passer.
   Une entrée sans rang — celle qui vient d'arriver d'un autre poste,
   ou d'un amorçage — se place en tête, là où le plus récent se lit. */
function estManuel(k){ return (etat[k] || []).some(o => typeof o.rang === 'number'); }

function chrono(k, lignes){
  if(!CHRONO.includes(k)) return [...(lignes || [])];
  const l = antechrono(lignes);
  if(!estManuel(k)) return l;
  /* le tri est stable : à rang égal ou absent, l'ordre chronologique
     ci-dessus fait le départage */
  return l.sort((a,b) => (typeof a.rang === 'number' ? a.rang : -1) -
                         (typeof b.rang === 'number' ? b.rang : -1));
}

/* Numérote les entrées dans l'ordre où elles sont affichées à
   l'instant : bascule un registre en classement manuel sans que rien
   ne bouge sous les yeux de celle qui vient de cliquer. */
function assurerRangs(k){
  chrono(k, etat[k]).forEach((o, i) => { o.rang = i; });
}

async function deplacer(k, id, sens){
  assurerRangs(k);
  const l = chrono(k, etat[k]);
  const i = l.findIndex(o => o.id === id), j = i + sens;
  if(i < 0 || j < 0 || j >= l.length) return;
  const r = l[i].rang; l[i].rang = l[j].rang; l[j].rang = r;
  await sauver(); rendre();
}

async function retablirTri(k){
  (etat[k] || []).forEach(o => { delete o.rang; });
  await sauver(); rendre();
  toast("Tri par date et heure rétabli");
}

/* Le bandeau n'apparaît qu'une fois le registre passé en manuel :
   tant qu'on n'a rien déplacé, il n'y a rien à expliquer. */
function barreOrdre(k){
  if(!CHRONO.includes(k) || !estManuel(k)) return '';
  return `<div class="note ordre-manuel">
    <strong>Ordre manuel.</strong> Ces entrées sont classées à la main : le tri par date et heure ne s'applique plus, et une entrée nouvelle se place en tête.
    <button class="btn sec" onclick="retablirTri('${k}')">Revenir au tri par date et heure</button></div>`;
}

function tableau(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;
  const ent = cfg.cols.map(c => {
    if(c === 'date') return 'Date';
    if(c === 'auteur') return 'Saisi par';
    const f = cfg.f.find(x => x.c === c);
    return f ? f.l : c;
  });
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  lignes.forEach((l, i) => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel' || c === 'rdvle' || c === 'infoLe' || c === 'apartir') v = frdate(v);
      if(typeof v === 'string' && /^https?:\/\//.test(v))
        return `<td><a href="${esc(v)}" target="_blank" rel="noopener">Ouvrir</a></td>`;
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + `<td class="act">${fleches(k, l.id, i, lignes.length)}<button title="Modifier" onclick="ouvrirEdition('${k}','${l.id}')">✎</button><button title="Supprimer" onclick="supprimer('${k}','${l.id}')">×</button></td></tr>`;
  });
  return h + '</tbody></table></div>';
}

/* Les flèches ne sont proposées que là où un ordre a un sens, et
   restent visibles en tri automatique : le premier déplacement fait
   lui-même basculer le registre en classement manuel, sans qu'il y
   ait de réglage à comprendre au préalable. */
function fleches(k, id, i, n){
  if(!CHRONO.includes(k) || n < 2) return '';
  return `<button title="Monter" onclick="deplacer('${k}','${id}',-1)"${i === 0 ? ' disabled' : ''}>↑</button>` +
         `<button title="Descendre" onclick="deplacer('${k}','${id}',1)"${i === n-1 ? ' disabled' : ''}>↓</button>`;
}

/* ---------------------------------------------------------
   Les registres de traçabilité se lisent comme un journal :
   une carte par entrée, regroupée par jour, plutôt qu'un
   tableau à dix colonnes qu'il faut faire défiler pour lire
   une phrase. Le tableau reste dans le dossier de traçabilité,
   où il sert à l'impression et à l'export.
   --------------------------------------------------------- */
const JOURNAL = {
  courante: {
    titre:'evenement', etiq:['statut'],
    chips:[{c:'source', l:"Source"}],
    blocs:[{c:'suite', l:"Suite donnée"}]
  },

    chips:[{c:'professionnel', l:"Professionnel"},{c:'profession', l:"Profession"},
           {c:'commune', l:"Commune"},{c:'transmis', l:"Transmis à"}],
    blocs:[{c:'action', l:"Action menée"}]
  },
  ars: {
    titre:'objet', etiq:['sens','statut'],
    chips:[{c:'canal', l:"Canal"},{c:'interlocuteur', l:"Interlocuteur"}],
    blocs:[{c:'demande', l:"Ce qui est demandé ou annoncé"},{c:'reponse', l:"Notre réponse ou action"},
           {c:'attendu', l:"Ce que ça implique pour la CPTS"}],
    lien:'lien', lienL:"Ouvrir le document"
  }
};

const ETIQ_REG = {
  'En cours':'e-cours', 'Clos':'e-fini', 'Terminé':'e-fini',
  'À suivre':'e-attente', 'À faire':'e-attente', 'En attente':'e-attente',
  "Reçu de l'ARS":'e-lancer', "Envoyé à l'ARS":'e-cours', 'À envoyer':'e-attente',
  'Faible':'e-fini', 'Moyenne':'e-attente', 'Élevée':'e-bloque',
  'À orienter':'e-attente', 'Orienté':'e-cours', 'Rendez-vous fixé':'e-cours',
  'Patient vu':'e-fini', 'Sans suite':'e-fini'
};

/* Le liseré de gauche donne l'état d'un coup d'œil, sans lire :
   rouge si la remontée est critique, ambre si ça attend, vert si
   c'est en cours, gris si c'est clos. */
function classeReg(o){
  if(o.criticite === 'Élevée') return 't-bloque';
  if(o.statut === 'En cours') return 't-cours';
  if(['À faire','En attente','À suivre'].includes(o.statut)) return 't-attente';
  if(['Clos','Terminé'].includes(o.statut)) return 't-fini';
  return '';
}

function frdateJour(d){
  if(!d) return "Date non précisée";
  const t = new Date(d + 'T12:00:00');
  if(isNaN(t.getTime())) return d;
  const s = t.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function journal(k){
  const cfg = JOURNAL[k], lignes = chrono(k, etat[k]);
  if(!lignes.length)
    return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;

  /* Classé à la main, l'ordre ne suit plus les jours : les
     intertitres de journée n'ont plus rien à séparer, et chaque
     carte porte alors sa date entière. */
  const manuel = estManuel(k);
  let h = '', jour = null;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }

    const quand = manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' à ') : o.heure;

    const etiqs = (cfg.etiq || []).map(c => o[c]).filter(Boolean)
      .map(v => `<span class="etiq ${ETIQ_REG[v] || 'e-lancer'}">${esc(v)}</span>`).join('');

    const chips = (cfg.chips || []).filter(x => o[x.c])
      .map(x => `<span><span class="k">${esc(x.l)}</span>${esc(o[x.c])}</span>`).join('');

    const blocs = (cfg.blocs || []).filter(x => o[x.c])
      .map(x => `<div class="bloc"><span class="k">${esc(x.l)}</span><div class="v">${esc(o[x.c])}</div></div>`).join('');

    const lien = cfg.lien && o[cfg.lien]
      ? `<a class="lien" href="${esc(o[cfg.lien])}" target="_blank" rel="noopener">${esc(cfg.lienL || 'Ouvrir')} ↗</a>` : '';

    const pied = [o.auteur ? 'Saisi par ' + o.auteur : '', o.modifiePar ? 'Modifié par ' + o.modifiePar : '',
                  o.echeance ? 'Échéance ' + frdateL(o.echeance) : '']
      .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

    h += `<article class="ent-r ${classeReg(o)}">
      <div class="haut">
        ${quand ? `<span class="hr">${esc(quand)}</span>` : ''}${etiqs}
        <span class="outils">
          ${fleches(k, o.id, i, lignes.length)}
          <button title="Modifier" onclick="ouvrirEdition('${k}','${o.id}')">✎</button>
          <button title="Supprimer" onclick="supprimer('${k}','${o.id}')">×</button>
        </span>
      </div>
      <div class="ti">${esc(o[cfg.titre]) || '—'}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${blocs}${lien}
      ${pied ? `<div class="pied">${pied}</div>` : ''}
    </article>`;
  });
  return h;
}

function classeStatut(s){
  return {'À lancer':'e-lancer','En cours':'e-cours','En attente':'e-attente','Terminé':'e-fini','Bloqué':'e-bloque'}[s] || 'e-lancer';
}

async function ajouterConsigne(type){
  const m = document.getElementById('modale');
  m.innerHTML = `<h3>Nouvelle consigne</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">${type==='faire'?"Ce que les membres doivent faire maintenant.":"Ce qu'il ne faut surtout pas faire, et qui doit être dit explicitement."}</p>
    <label><span class="k">Consigne</span><textarea id="in-cons"></textarea></label>
    <div class="actions"><button class="btn" onclick="validerConsigne('${type}')">Ajouter</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>document.getElementById('in-cons').focus(), 60);
}
async function validerConsigne(type){
  const v = document.getElementById('in-cons').value.trim();
  if(v){ etat.consignes[type].push(v); await sauver(); }
  fermer(); rendre();
}
function modifierConsigne(type, i){
  document.getElementById('modale').innerHTML = `<h3>Modifier la consigne</h3>
    <label><span class="k">Consigne</span><textarea id="in-cons">${esc(etat.consignes[type][i])}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerModifConsigne('${type}',${i})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerModifConsigne(type, i){
  const v = document.getElementById('in-cons').value.trim();
  if(v) etat.consignes[type][i] = v;
  await sauver(); fermer(); rendre(); toast("Consigne modifiée");
}
async function retirerConsigne(type, i){
  etat.consignes[type].splice(i,1); await sauver(); rendre();
}

/* Les renforts d'une mission : des personnes positionnées auprès
   du pilote, chacune avec ce qu'elle prend en charge. */
function renfortsDe(m){ return Array.isArray(m.renforts) ? m.renforts : []; }

function organigramme(){
  const gens = new Map();
  const ajoute = (nom, m, role, mention) => {
    const n = (nom || '').trim();
    if(!n) return;
    const cle = cleP(n);
    if(!gens.has(cle)) gens.set(cle, {nom:n, pilote:[], appui:[]});
    gens.get(cle)[role].push({t:m.titre, esp:espaceDe(m), mid:m.id, mention:mention||''});
  };
  etat.missions.forEach(m => {
    ajoute(m.pilote, m, 'pilote');
    ajoute(m.suppleant, m, 'appui', 'Suppléant');
    renfortsDe(m).forEach(r => ajoute(r.nom, m, 'appui', r.role || 'Renfort'));
  });

  const liste = [...gens.values()].sort((a,b) =>
    b.pilote.length - a.pilote.length || a.nom.localeCompare(b.nom, 'fr'));
  const vacantes = etat.missions.filter(m => !(m.pilote || '').trim());

  if(!liste.length && !vacantes.length) return '';

  let h = `<div class="legende">
    <span><i style="background:var(--cobalt-clair)"></i> Pilote de la mission</span>
    <span><i style="background:#F4F6FA;border:1px solid var(--trait)"></i> En appui</span>
    <span><i style="background:var(--braise)"></i> Mission sans pilote</span>
  </div><div class="orga">`;

  liste.forEach(p => {
    const tot = p.pilote.length + p.appui.length;
    const c = coord(p.nom);
    const nEsc = esc(p.nom).replace(/'/g, "\\'");
    let contact = '';
    if(c.tel) contact += `<a href="tel:${esc(c.tel.replace(/\s/g,''))}">📞 ${esc(c.tel)}</a>`;
    if(c.mail) contact += `<a href="mailto:${esc(c.mail)}">✉️ ${esc(c.mail)}</a>`;
    if(!contact) contact = `<span class="abs">Aucun contact renseigné</span>`;
    h += `<div class="pers">
      <div class="qui">${p.pilote.length ? 'Pilote' : 'Appui'}</div>
      <div class="nom">${esc(p.nom)}</div>
      <div class="compte">${tot} mission${tot>1?'s':''}${p.pilote.length&&p.appui.length?` · ${p.pilote.length} pilotée${p.pilote.length>1?'s':''}, ${p.appui.length} en appui`:''}</div>
      <div class="coord">${contact}
        <button class="modif" onclick="editerContact('${nEsc}')">${c.tel||c.mail?'Modifier le contact':'Ajouter un contact'}</button>
      </div>
      ${p.pilote.map(o=>ligneMission(o.mid, 'Pilote') + blocRenforts(o.mid)).join('')}
      ${p.appui.map(o=>ligneMission(o.mid, o.mention || 'Appui')).join('')}
      <button class="confier" onclick="nouvelleMission('${nEsc}')">+ Confier une mission à ${esc(p.nom.split(' ')[0])}</button>
    </div>`;
  });

  if(vacantes.length){
    h += `<div class="pers vacant">
      <div class="qui">Personne n'est dessus</div>
      <div class="nom">À pourvoir</div>
      <div class="compte">${vacantes.length} mission${vacantes.length>1?'s':''} sans pilote désigné</div>
      ${vacantes.map(m=>`<div class="mrow">
        <button class="chip vac" onclick="voirFiche('${m.id}')"><span class="r">Sans pilote · fiche mission</span>${esc(m.titre)}</button>
        <button class="crayon-m" title="Modifier la mission" onclick="modifierMission('${m.id}')">✎</button></div>
        <button class="rplus" style="margin:0 0 10px 12px" onclick="modifierMission('${m.id}')">Désigner un pilote</button>`).join('')}
    </div>`;
  }

  /* Dernière carte de la grille : créer une mission sans quitter
     l'organigramme. Elle se range ensuite sur la carte du pilote. */
  h += `<button class="neuve" onclick="nouvelleMission('')">
    <span class="plus">+</span>
    <span class="t">Créer une mission</span>
    <span class="d">Un intitulé, un pilote. La carte se range toute seule dans l'organigramme.</span>
  </button>`;

  return h + `</div>`;
}

/* =========================================================
   RÉFÉRENTS DE LA GESTION DE CRISE

   L'équipe qui tient la crise, en tête de l'onglet : nom,
   profession, numéro. On les appelle, on ne les cherche pas.
   ========================================================= */
function blocReferents(){
  etat.referents = etat.referents || [];
  return `<h2 style="margin-top:0">Référents de la gestion de crise</h2>
    <div class="refs">` +
    etat.referents.map(r => `<div class="ref">
      <div class="nom">${esc(r.nom)}</div>
      ${r.profession ? `<div class="prof">${esc(r.profession)}</div>` : ''}
      ${r.tel ? `<a href="tel:${esc(String(r.tel).replace(/\s/g,''))}">📞 ${esc(r.tel)}</a>`
              : `<span class="abs">Numéro à renseigner</span>`}
      <div class="b">
        <button class="modif" onclick="editerReferent('${r.id}')">Modifier</button>
        <button class="rx" title="Retirer ce référent" onclick="retirerReferent('${r.id}')">×</button>
      </div></div>`).join('') +
    `<button class="ref neuf" onclick="editerReferent('')">
      <span class="plus">+</span><span class="t">Ajouter un référent</span></button></div>`;
}

function editerReferent(id){
  const r = id ? (etat.referents || []).find(x => x.id === id) : null;
  document.getElementById('modale').innerHTML = `<h3>${r ? 'Modifier le référent' : 'Ajouter un référent'}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Les personnes qui tiennent la gestion de crise pour la CPTS Pau Béarn.</p>
    <label style="margin-bottom:10px"><span class="k">Prénom et nom *</span>
      <input id="rf-r-nom" value="${esc(r ? r.nom : '')}" placeholder="Prénom et nom"></label>
    <label style="margin-bottom:10px"><span class="k">Profession et rôle</span>
      <input id="rf-r-prof" value="${esc(r ? r.profession : '')}" placeholder="Ex. infirmière — vice-présidente"></label>
    <label style="margin-bottom:10px"><span class="k">Téléphone</span>
      <input id="rf-r-tel" type="tel" value="${esc(r ? r.tel : '')}" placeholder="06 12 34 56 78"
        onkeydown="if(event.key==='Enter')validerReferent('${id}')"></label>
    <div class="actions"><button class="btn" onclick="validerReferent('${id}')">Enregistrer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('rf-r-nom'); if(i) i.focus(); }, 60);
}

async function validerReferent(id){
  const nom = document.getElementById('rf-r-nom').value.trim();
  if(!nom){ toast("Le nom est obligatoire"); return; }
  const v = {
    nom: nom,
    profession: document.getElementById('rf-r-prof').value.trim(),
    tel: document.getElementById('rf-r-tel').value.trim()
  };
  etat.referents = etat.referents || [];
  const r = id ? etat.referents.find(x => x.id === id) : null;
  if(r){ Object.assign(r, v); r.modifiePar = moi; }
  else etat.referents.push(Object.assign({id:uid()}, v, {auteur:moi, quand:new Date().toISOString()}));
  const issue = await sauver();
  fermer(); rendre();
  toast(issue === 'ok' ? "Référent enregistré et partagé avec le copil"
                       : "Référent conservé sur cet appareil — le serveur n'a pas répondu");
}

async function retirerReferent(id){
  const r = (etat.referents || []).find(x => x.id === id); if(!r) return;
  document.getElementById('modale').innerHTML = `<h3>Retirer ce référent&nbsp;?</h3>
    <p style="color:var(--texte-2)">${esc(r.nom)} ne figurera plus parmi les référents de la gestion de crise.</p>
    <div class="actions"><button class="btn" onclick="confirmerRetraitReferent('${id}')">Retirer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function confirmerRetraitReferent(id){
  noterRetrait(id);
  etat.referents = (etat.referents || []).filter(x => x.id !== id);
  await sauver(); fermer(); rendre(); toast("Référent retiré");
}

/* La pastille ouvre la fiche mission, le crayon la modifie :
   deux boutons côte à côte, jamais l'un dans l'autre. */
function ligneMission(mid, role){
  const m = etat.missions.find(x => x.id === mid); if(!m) return '';
  return `<div class="mrow">
    <button class="chip${role === 'Pilote' ? '' : ' appui'}" onclick="voirFiche('${mid}')">
      <span class="r">${esc(role)} · fiche mission</span>${esc(m.titre)}</button>
    <button class="crayon-m" title="Modifier la mission" onclick="modifierMission('${mid}')">✎</button>
  </div>`;
}

/* Les renforts s'ajoutent là où on les cherche : sous la mission,
   sur la carte du pilote comme dans la répartition détaillée. */
function blocRenforts(mid){
  const m = etat.missions.find(x => x.id === mid);
  if(!m) return '';
  return `<div class="renforts">` +
    renfortsDe(m).map((r,i) => `<div class="rf">
      <div class="n">${esc(r.nom)}${r.role ? `<span class="q">${esc(r.role)}</span>` : ''}</div>
      <button class="rx" title="Retirer ce renfort" onclick="retirerRenfort('${mid}',${i})">×</button>
    </div>`).join('') +
    `<button class="rplus" onclick="ajouterRenfort('${mid}')">+ Ajouter un renfort</button></div>`;
}

function ajouterRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const noms = nomsMissionnes().filter(n => cleP(n) !== cleP(m.pilote));
  document.getElementById('modale').innerHTML = `<h3>Renfort sur « ${esc(m.titre)} »</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Une personne positionnée auprès de ${m.pilote ? esc(m.pilote) : 'la mission'}, avec ce qu'elle prend en charge. Elle apparaîtra dans l'organigramme, où son numéro pourra être renseigné.</p>
    ${noms.length ? `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà dans le cockpit&nbsp;:</p>
      <div class="choixnom">${noms.map(n => `<button onclick="document.getElementById('rf-nom').value='${esc(n).replace(/'/g,"\\'")}'">${esc(n)}</button>`).join('')}</div>` : ''}
    <label><span class="k">Prénom et nom *</span><input id="rf-nom" placeholder="Prénom et nom"></label>
    <label style="margin-top:12px"><span class="k">Ce qu'il ou elle prend en charge</span>
      <input id="rf-role" placeholder="Ex. phoning auprès des pharmaciens" onkeydown="if(event.key==='Enter')validerRenfort('${mid}')"></label>
    <div class="actions"><button class="btn" onclick="validerRenfort('${mid}')">Ajouter</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('rf-nom'); if(i) i.focus(); }, 60);
}

async function validerRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const nom = document.getElementById('rf-nom').value.trim();
  if(!nom){ toast("Le nom est obligatoire"); return; }
  m.renforts = renfortsDe(m).concat([{nom:nom, role:document.getElementById('rf-role').value.trim(), par:moi}]);
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Renfort ajouté");
}

async function retirerRenfort(mid, i){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const r = renfortsDe(m).slice();
  r.splice(i,1);
  m.renforts = r;
  m.modifiePar = moi;
  await sauver(); rendre();
}

/* =========================================================
   SITUATION RÉGIONALE — le poste de veille

   La page tient sur trois objets, dans cet ordre :

   1. Les points de situation — les feuillets qu'on maintient à
      jour : avancée des feux, qualité de l'air, situation
      sanitaire, consignes aux libéraux… C'est ce qui se lit au
      copil, et c'est ce que la veille alimente.
   2. Les canaux, rangés par famille — ARS, préfectures, URPS et
      ordres, environnement, presse. On les passe au crible famille
      par famille, ou tous d'un coup avec le tour.
   3. Ce qu'on a retenu — chaque information est rangée dans un
      point, porte son impact sur le 64 et la suite à donner.

   Le geste complet est : ouvrir un canal → retenir → ranger dans
   un point → réécrire ce point. Qui prend la veille sans connaître
   le dossier suit les quatre gestes affichés en tête de page.
   ========================================================= */
const SEUIL_VEILLE_H = 6;   // au-delà, un canal « chaque tour » est à repasser
const SEUIL_POINT_H  = 12;  // au-delà, un point de situation est à rafraîchir
const FAMILLES = ["ARS et autorités sanitaires",'Préfectures','URPS et ordres','Environnement et météo','Suivi des incendies','Établissements de santé','Collectivités','Presse','Autres canaux'];
/* Ce qu'on va chercher dans chaque famille, pour qui prend la
   veille sans savoir à quoi sert le canal. */
const FAMILLE_QUOI = {
  "ARS et autorités sanitaires": "La consigne officielle : ce que l'autorité sanitaire demande, et à qui.",
  'Préfectures':                 "L'ordre public : évacuations, arrêtés, FR-Alert, routes coupées.",
  'URPS et ordres':              "Ce qui s'adresse directement aux libéraux : appels, recensements, cadre d'exercice.",
  'Environnement et météo':      "Ce qui fera bouger le feu et l'air respirable dans les 24 h.",
  'Suivi des incendies':         "L'état du feu lui-même, commune par commune.",
