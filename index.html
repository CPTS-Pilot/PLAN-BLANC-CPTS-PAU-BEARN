<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Cockpit de crise — CPTS Pau Béarn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#062B63;
  --encre-2:#0B4FA8;
  --cobalt-clair:#E8F0FB;
  --surface:#F3F6FB;
  --carte:#FFFFFF;
  --trait:#D8E1EF;
  --texte:#122238;
  --texte-2:#5A6B84;
  --ambre:#E8A33D;
  --braise:#C2482F;
  --stable:#2F7D62;
  --rail:250px;
  --display:'Archivo',system-ui,sans-serif;
  --corps:'Source Sans 3',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--corps);
  background:var(--surface);
  color:var(--texte);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- structure ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--encre);color:#C3D6F0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.marque{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.marque .nom{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff;line-height:1.2}
.marque .sous{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FA3D4;margin-top:6px}
.nav{padding:10px 8px;flex:1}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;
  padding:9px 10px;border-radius:6px;color:#B5CBE9;font-size:14px;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.actif{background:var(--encre-2);color:#fff;font-weight:600}
.nav button .cpt{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7FA3D4}
.nav button.actif .cpt{color:#DCE9FA}
.nav .groupe{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#6C8FC4;padding:16px 10px 6px}
.pied{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#7FA3D4}
.pied button{background:none;border:1px solid rgba(255,255,255,.18);color:#C3D6F0;border-radius:5px;padding:5px 9px;font-size:11.5px;cursor:pointer;margin:3px 3px 0 0}
.pied button:hover{border-color:#fff;color:#fff}

.zone{flex:1;min-width:0;display:flex;flex-direction:column}
.bandeau{
  background:var(--encre-2);color:#fff;padding:14px 26px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.bandeau .pastille{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--braise);padding:4px 9px;border-radius:3px;white-space:nowrap;
}
.bandeau .phrase{font-size:14.5px;flex:1;min-width:200px}
.bandeau .crayon{background:none;border:1px solid rgba(255,255,255,.3);color:#C3D6F0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;min-height:34px}
.bandeau .crayon:hover{border-color:#fff;color:#fff}
.bandeau .maj{font-family:var(--mono);font-size:11.5px;color:#A9C4E8}
.contenu{padding:26px;max-width:1180px;width:100%}

h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0 0 4px}
.chapo{color:var(--texte-2);margin:0 0 22px;max-width:70ch}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;margin:0 0 12px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;background:var(--encre-2);border-radius:2px;display:block}

/* ---------- cartes ---------- */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:18px;margin-bottom:18px}
.grille{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* ---------- consignes ---------- */
.consignes{display:grid;gap:14px}
@media(min-width:820px){.consignes{grid-template-columns:1fr 1fr}}
.bloc-consigne{border-radius:9px;padding:16px 18px;border:1px solid var(--trait);background:var(--carte)}
.bloc-consigne.faire{border-left:4px solid var(--stable)}
.bloc-consigne.eviter{border-left:4px solid var(--braise)}
.bloc-consigne h3{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--texte-2)}
.bloc-consigne ul{margin:0;padding-left:18px}
.bloc-consigne li{margin-bottom:7px}
.bloc-consigne li button{background:none;border:0;color:var(--texte-2);cursor:pointer;font-size:12px;padding:0 4px;opacity:.5}
.bloc-consigne li button:hover{opacity:1;color:var(--braise)}

/* ---------- compteurs ---------- */
.compteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.compteur{background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:13px 14px}
.compteur .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;color:var(--encre)}
.compteur .l{font-size:12px;color:var(--texte-2);margin-top:5px;line-height:1.3}

/* ---------- missions ---------- */
.mission{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:16px 18px;margin-bottom:12px}
.mission .haut{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.mission .titre{font-family:var(--display);font-weight:600;font-size:15.5px;flex:1;min-width:220px}
.mission .meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:13.5px}
.mission .meta div{min-width:130px}
.mission .meta .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:2px}
.mission .suite{margin-top:12px;padding-top:12px;border-top:1px dashed var(--trait);font-size:14px}
.mission .suite .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:3px}

.etiq{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.e-attente{background:#FCF0DA;color:#8A5D12}
.e-cours{background:#DFF0E9;color:#1E5C46}
.e-lancer{background:#E2EAF5;color:#3D5578}
.e-fini{background:#E4E9F1;color:#6A7C93}
.e-bloque{background:#F8E0DB;color:#8E2F1D}

/* ---------- organigramme ---------- */
.orga{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));margin-bottom:26px}
.pers{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--encre-2);border-radius:11px;padding:17px 18px}
.pers.vacant{border-top-color:var(--braise);background:#FDF7F5}
.pers .qui{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-2)}
.pers .nom{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.12;letter-spacing:-.015em;margin:7px 0 3px;color:var(--encre)}
.pers.vacant .nom{color:var(--braise)}
.pers .compte{font-size:12.5px;color:var(--texte-2);margin-bottom:13px}
.pers .chip{display:block;background:var(--cobalt-clair);border-radius:7px;padding:8px 11px;font-size:13.5px;margin-bottom:6px;line-height:1.35}
.pers .chip.appui{background:#F4F6FA;color:var(--texte-2)}
.pers .chip .r{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px;opacity:.75}
.pers .coord{margin:10px 0 12px;display:flex;flex-direction:column;gap:5px}
.pers .coord a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--encre-2);font-size:14px;padding:7px 10px;background:var(--cobalt-clair);border-radius:7px;min-height:40px}
.pers .coord a:active{background:#D6E5F9}
.pers .coord .abs{font-size:13px;color:var(--texte-2);font-style:italic}
.pers .modif{background:none;border:1px solid var(--trait);border-radius:6px;color:var(--texte-2);font-size:12px;padding:6px 10px;cursor:pointer;margin-top:4px;min-height:36px}
.pers .modif:hover{border-color:var(--encre-2);color:var(--encre-2)}
.pers .chip{cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit}
.pers .chip:hover{background:#D8E7FA}
.pers .chip.appui:hover{background:#EAEEF5}
.fiche h4{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--texte-2);margin:16px 0 5px}
.fiche p{margin:0}
.fiche ul{margin:0;padding-left:19px}
.fiche li{margin-bottom:5px}
.fiche .stop{background:#FBEDE9;border-left:3px solid var(--braise);border-radius:0 7px 7px 0;padding:10px 13px;margin-top:5px}
.mission .barre{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--trait);align-items:center}
.mission .sup-m{margin-left:auto;background:none;border:0;color:var(--texte-2);opacity:.45;cursor:pointer;font-size:18px;padding:4px 8px}
.mission .sup-m:hover{opacity:1;color:var(--braise)}
.espace{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--trait);flex-wrap:wrap}
.espace .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2)}
.mesmissions{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09)}
.mesmissions .t{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#6C8FC4;margin-bottom:8px}
.mesmissions button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:0;border-radius:6px;color:#DCE9FA;padding:9px 10px;font-size:13px;margin-bottom:5px;cursor:pointer;line-height:1.3}
.mesmissions button:hover{background:rgba(255,255,255,.15)}
.mesmissions .r{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FA3D4;margin-top:3px}
.choixnom{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.choixnom button{text-align:left;background:var(--cobalt-clair);border:1px solid var(--trait);border-radius:8px;padding:12px 14px;font-size:16px;font-family:var(--display);font-weight:600;cursor:pointer;min-height:48px}
.choixnom button:hover{border-color:var(--encre-2)}
.legende{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--texte-2);margin:-12px 0 18px}
.legende span{display:flex;align-items:center;gap:6px}
.legende i{width:12px;height:12px;border-radius:3px;display:block;font-style:normal}

/* ---------- fil ---------- */
.fil{list-style:none;margin:0;padding:0}
.fil li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--trait)}
.fil li:last-child{border-bottom:0}
.fil .h{font-family:var(--mono);font-size:11.5px;color:var(--texte-2);flex:0 0 92px;padding-top:2px}
.fil .c{flex:1;min-width:0}
.fil .c .t{font-weight:600}
.fil .c .d{color:var(--texte-2);font-size:13.5px;margin-top:2px}
.fil .c .s{font-family:var(--mono);font-size:11px;color:var(--texte-2);margin-top:4px}
.fil .sup{background:none;border:0;color:var(--texte-2);cursor:pointer;opacity:.4;font-size:14px;padding:0 2px;align-self:flex-start}
.fil .sup:hover{opacity:1;color:var(--braise)}

/* ---------- veille ---------- */
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filtres button{border:1px solid var(--trait);background:var(--carte);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--texte-2)}
.filtres button.on{background:var(--encre);border-color:var(--encre);color:#fff}
.cptsl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));margin-bottom:20px}
.cptsc{background:var(--carte);border:1px solid var(--trait);border-left:5px solid var(--trait);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.cptsc.feu{border-left-color:var(--braise)}
.cptsc.proche{border-left-color:var(--ambre)}
.cptsc.fait{background:#F6FBF8}
.cptsc .nom{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.2;color:var(--encre)}
.cptsc .terr{font-size:12.5px;color:var(--texte-2);line-height:1.4}
.cptsc .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:7px 9px}
.cptsc .rangee{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cptsc select{width:auto;flex:1;min-width:140px;min-height:40px}
.cptsc a.tel{display:inline-flex;align-items:center;justify-content:center;background:var(--encre-2);color:#fff;font-family:var(--display);font-weight:600;border-radius:8px;padding:10px 14px;text-decoration:none;min-height:44px;flex:1;min-width:150px}
.cptsc .journal{border-top:1px dashed var(--trait);padding-top:9px;margin-top:2px}
.cptsc .journal .vide{font-size:12.5px;font-style:italic;color:var(--texte-2);padding:0}
.cptsc .app{border-left:2px solid var(--cobalt-clair);padding:2px 0 2px 10px;margin-bottom:9px}
.cptsc .app .q{font-family:var(--mono);font-size:10.5px;color:var(--texte-2)}
.cptsc .app .d{font-size:13px;line-height:1.4;margin-top:2px}
.cptsc .app .s{font-size:12.5px;color:var(--texte-2);margin-top:2px}
.cptsc .app button{background:none;border:0;color:var(--texte-2);opacity:.45;cursor:pointer;font-size:13px;padding:0 3px}
.cptsc .app button:hover{opacity:1;color:var(--braise)}
.etabs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));margin-bottom:22px}
.etab{background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--encre-2);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:8px}
.etab.prive{border-top-color:var(--stable)}
.etab.lib{border-top-color:var(--ambre)}
.etab .tete{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.etab .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;color:var(--encre)}
.etab .type{font-size:12.5px;color:var(--texte-2);margin-top:2px}
.etab .lits{font-family:var(--display);font-weight:700;font-size:26px;color:var(--encre-2);line-height:1;text-align:right;white-space:nowrap}
.etab .lits small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-2);font-weight:400;margin-top:3px}
.etab .cap{font-size:13px;color:var(--texte-2);line-height:1.45}
.etab .obs{font-size:12.5px;background:#FCF3E4;color:#8A5D12;border-radius:6px;padding:8px 10px}
.etab .liens{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.etab .liens a{display:inline-flex;align-items:center;min-height:44px;padding:9px 13px;border-radius:8px;text-decoration:none;font-size:14px}
.etab .liens a.tel{background:var(--encre-2);color:#fff;font-weight:600;font-family:var(--display)}
.etab .liens a.adr,.etab .liens a.web{background:var(--cobalt-clair);color:var(--encre-2);font-size:13px}
.etab .badges{display:flex;gap:6px;flex-wrap:wrap}
.lignes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));margin-bottom:22px}
.ligne{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--encre-2);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:9px}
.ligne.urg{border-left-color:var(--braise)}
.ligne .org{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2)}
.ligne .nom{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;color:var(--encre)}
.ligne .quoi{font-size:13.5px;color:var(--texte-2);line-height:1.45}
.ligne .dispo{font-family:var(--mono);font-size:11px;color:var(--stable)}
.ligne .actes{display:flex;flex-direction:column;gap:7px}
.ligne .actes a{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:600}
.ligne .actes a.tel{background:var(--encre-2);color:#fff;font-family:var(--display)}
.ligne .actes a.tel:active{background:var(--encre)}
.ligne .actes a.ml{background:var(--cobalt-clair);color:var(--encre-2);font-size:13.5px;word-break:break-all}
.ligne .actes a.web{background:#fff;border:1px solid var(--trait);color:var(--texte);font-size:13.5px;font-weight:400}
.ligne .aver{background:#FCF3E4;border-radius:6px;padding:8px 10px;font-size:12.5px;color:#8A5D12}
.ligne .retirer{background:none;border:1px solid var(--trait);border-radius:6px;color:var(--texte-2);font-size:12px;padding:6px 10px;cursor:pointer;align-self:flex-start}
.ligne .retirer:hover{border-color:var(--braise);color:var(--braise)}
.srcs{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-bottom:8px}
.src-c{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.src-c.jamais{border-left:4px solid var(--ambre)}
.src-c .n{font-weight:600;line-height:1.25}
.src-c .cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2)}
.src-c .q{font-size:12.5px;color:var(--texte-2)}
.src-c .b{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.src-c .b a,.src-c .b button{flex:1;min-width:110px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid var(--trait);background:#fff;color:var(--texte)}
.src-c .b a{background:var(--cobalt-clair);border-color:var(--cobalt-clair);color:var(--encre-2);font-weight:600}
.src-c .b button:hover{border-color:var(--encre-2);color:var(--encre-2)}
.veille{list-style:none;margin:0;padding:0}
.veille li{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--trait);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.veille li[data-s="ARS"]{border-left-color:var(--encre-2)}
.veille li[data-s="URPS"]{border-left-color:var(--stable)}
.veille li[data-s="Préfecture"]{border-left-color:var(--braise)}
.veille li[data-s="CPTS"]{border-left-color:var(--ambre)}
.veille li[data-s="CPAM"]{border-left-color:#6C8FC4}
.veille .en{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.veille .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2)}
.veille .dt{font-family:var(--mono);font-size:11.5px;color:var(--texte-2)}
.veille .ti{font-family:var(--display);font-weight:600;font-size:15.5px;width:100%}
.veille .re{color:var(--texte-2);font-size:14px}
.veille a{color:var(--encre-2);font-size:13.5px;display:inline-block;margin-top:7px;text-decoration:none;border-bottom:1px solid var(--trait)}
.veille a:hover{border-color:var(--encre-2)}

/* ---------- tableaux ---------- */
.tw{overflow-x:auto;background:var(--carte);border:1px solid var(--trait);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--cobalt-clair);text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);padding:10px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--trait);vertical-align:top}
tr:last-child td{border-bottom:0}
td.act{width:62px;white-space:nowrap}
td.act button{background:none;border:0;cursor:pointer;color:var(--texte-2);opacity:.4;font-size:14px}
td.act button:hover{opacity:1;color:var(--braise)}

/* ---------- formulaires ---------- */
.form{display:grid;gap:12px}
@media(min-width:760px){.form{grid-template-columns:repeat(2,1fr)}.form .large{grid-column:1/-1}}
label{display:block}
label .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:4px}
input,select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--trait);border-radius:6px;background:#fff;
}
textarea{min-height:74px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ambre);outline-offset:1px;border-color:var(--ambre)}
.btn{
  background:var(--encre);color:#fff;border:0;border-radius:6px;padding:9px 18px;
  font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer;
}
.btn:hover{background:var(--encre-2)}
.btn.sec{background:#fff;color:var(--encre);border:1px solid var(--trait)}
.btn.sec:hover{border-color:var(--encre)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

.barre-h{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.barre-h .cpt-h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2)}
.barre-h .btn:nth-of-type(1){margin-left:auto}
.modale .form{grid-template-columns:1fr}
.modale h3{margin-bottom:16px}
@media(max-width:600px){.barre-h .btn{margin-left:0;width:100%}}
.vide{color:var(--texte-2);font-style:italic;padding:18px 0}
.note{font-size:13px;color:var(--texte-2);background:var(--cobalt-clair);border:1px solid var(--trait);border-radius:7px;padding:11px 13px;margin-bottom:16px}
.note strong{color:var(--texte)}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--encre);color:#fff;padding:10px 18px;border-radius:7px;font-size:14px;
  opacity:0;transition:.25s;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.rideau{position:fixed;inset:0;background:rgba(16,32,46,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.rideau.on{display:flex}
.modale{background:#fff;border-radius:11px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto}
.modale h3{font-family:var(--display);margin:0 0 6px;font-size:19px}

@media(max-width:860px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex:none}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav .groupe{display:none}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .nav button .cpt{margin-left:6px}
  .contenu{padding:18px 15px}
  .bandeau{padding:12px 15px}
}
@media(max-width:600px){
  input,select,textarea{font-size:16px;padding:11px 12px}
  .btn{padding:12px 18px;min-height:46px;width:100%}
  .actions{flex-direction:column}
  .actions .btn{width:100%}
  .orga{grid-template-columns:1fr}
  .mission .meta div{min-width:100%;flex:1 1 100%}
  .compteurs{grid-template-columns:1fr 1fr}
  h1{font-size:22px}
  .pers .nom{font-size:21px}
  td,th{padding:9px 10px}
  .fil .h{flex:0 0 74px}
  .nav button{min-height:42px}
}
.entete-print{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt}
  .rail,.bandeau,.filtres,.barre-h,.actions,.crayon,.sup,.modif,.retirer,.src-c .b,.pers .modif,.mission .barre,.toast{display:none!important}
  td.act,th:last-child{display:none!important}
  .contenu{padding:0;max-width:none}
  .carte,.tw,.mission,.pers,.ligne,.src-c{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .entete-print{display:block!important;border-bottom:2px solid #062B63;padding-bottom:8px;margin-bottom:16px}
  .entete-print .t{font-family:var(--display);font-weight:700;font-size:15pt;color:#062B63}
  .entete-print .d{font-family:var(--mono);font-size:9pt;color:#555;margin-top:3px}
  table{font-size:9pt;width:100%}
  th{background:#EEF3FA!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,li,h2{break-inside:avoid}
  h2{break-after:avoid}
  a{color:#062B63;text-decoration:none}
  .tw{overflow:visible}
  body.print-modale .zone,body.print-modale .rail{display:none!important}
  body.print-modale .rideau{position:static;display:block!important;background:none;padding:0}
  body.print-modale .modale{max-width:none;max-height:none;overflow:visible;padding:0;border-radius:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let etat = JSON.parse(JSON.stringify(etatInitial));
let stockageActif = false;

/* =========================================================
   PERSISTANCE
   ========================================================= */
async function charger(){
  if(typeof window.storage === 'undefined'){ majBandeau(); rendre(); avertirHorsLigne(); return; }
  try{
    const r = await window.storage.get(CLE, true);
    if(r && r.value){
      const d = JSON.parse(r.value);
      for(const k in etatInitial){ if(d[k] !== undefined) etat[k] = d[k]; }
    }
    fusionnerNouveautes();
    stockageActif = true;
  }catch(e){
    stockageActif = true; // clé absente au premier lancement : normal
  }
  try{
    const p = await window.storage.get('cpts_identite', false);
    if(p && p.value) moi = p.value;
  }catch(e){}
  majBandeau(); rendre();
  if(moi === 'Anonyme') demanderIdentite();
}

const SEEDS = ['missions','veille','diffusions','ars','sources','lignes','offre','cpts'];
function fusionnerNouveautes(){
  etat.retires = etat.retires || [];
  SEEDS.forEach(k => {
    if(!Array.isArray(etat[k]) || !Array.isArray(etatInitial[k])) return;
    const vus = new Set(etat[k].map(x => x.id));
    etatInitial[k].forEach(o => {
      if(!vus.has(o.id) && !etat.retires.includes(o.id)) etat[k].push(JSON.parse(JSON.stringify(o)));
    });
  });
}

async function sauver(){
  etat.entete.maj = new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  majBandeau();
  if(!stockageActif){ toast("Modification enregistrée dans cette session seulement"); return; }
  try{
    await window.storage.set(CLE, JSON.stringify(etat), true);
  }catch(e){
    toast("Enregistrement impossible — pensez à exporter");
  }
}

function avertirHorsLigne(){
  const n = document.createElement('div');
  n.className = 'note';
  n.style.margin = '0 26px 0';
  n.innerHTML = "<strong>Mode hors ligne.</strong> Ce fichier est ouvert en dehors de Claude : les saisies ne seront pas partagées ni conservées à la fermeture. Utilisez « Exporter » pour sauvegarder, et « Importer » pour reprendre un état existant.";
  document.querySelector('.zone').insertBefore(n, document.getElementById('vue'));
}

function editerEntete(){
  document.getElementById('modale').innerHTML = `<h3>État affiché en haut du cockpit</h3>
    <label style="margin-bottom:12px"><span class="k">Pastille — court</span><input id="en-niveau" value="${esc(etat.entete.niveau)}"></label>
    <label style="margin-bottom:12px"><span class="k">Phrase de situation</span><textarea id="en-phrase">${esc(etat.entete.phrase)}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerEntete()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerEntete(){
  etat.entete.niveau = document.getElementById('en-niveau').value.trim() || etat.entete.niveau;
  etat.entete.phrase = document.getElementById('en-phrase').value.trim();
  await sauver(); fermer(); majBandeau(); toast("État mis à jour");
}

function majBandeau(){
  document.getElementById('niveau').textContent = etat.entete.niveau;
  document.getElementById('phrase').textContent = etat.entete.phrase;
  document.getElementById('maj').textContent = etat.entete.maj ? 'Dernière saisie ' + etat.entete.maj : '';
  document.getElementById('identite').textContent = 'Connecté·e comme ' + moi;
}

const ESPACES = {m1:'terrain', m2:'terrain', m3:'materiel', m4:'appels', m5:'diffusions', m6:'courante'};

const nomEspace = id => (ONGLETS.find(o => o.id === id) || {}).nom || 'Main courante';
const cleP = n => (n||'').trim().toLowerCase();

function noterRetrait(id){
  etat.retires = etat.retires || [];
  if(!etat.retires.includes(id)) etat.retires.push(id);
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aujourdhui = () => new Date().toISOString().slice(0,10);
const maintenant = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function frdate(d){ if(!d) return '—'; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1] : d; }

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove('on'), 2600);
}
function fermer(){ document.getElementById('rideau').classList.remove('on'); }
document.getElementById('rideau').addEventListener('click', e => { if(e.target.id === 'rideau') fermer(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fermer(); });

function coord(nom){
  return (etat.personnes || {})[cleP(nom)] || {};
}
function editerContact(nom){
  const c = coord(nom);
  document.getElementById('modale').innerHTML = `<h3>Contact de ${esc(nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Renseigné une fois, utilisable par tout le monde en un clic depuis l'organigramme.</p>
    <label><span class="k">Téléphone</span><input id="ct-tel" type="tel" value="${esc(c.tel||'')}" placeholder="06 12 34 56 78"></label>
    <label style="margin-top:12px"><span class="k">Mail</span><input id="ct-mail" type="email" value="${esc(c.mail||'')}" placeholder="prenom.nom@exemple.fr"></label>
    <div class="actions"><button class="btn" onclick="validerContact('${esc(nom).replace(/'/g,"\\'")}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerContact(nom){
  etat.personnes = etat.personnes || {};
  etat.personnes[cleP(nom)] = {
    nom: nom,
    tel: document.getElementById('ct-tel').value.trim(),
    mail: document.getElementById('ct-mail').value.trim()
  };
  await sauver(); fermer(); rendre(); toast("Contact enregistré");
}

function nomsMissionnes(){
  const v = new Map();
  etat.missions.forEach(m => {
    [m.pilote, m.suppleant].forEach(n => { if((n||'').trim()) v.set(cleP(n), n.trim()); });
  });
  return [...v.values()].sort((a,b)=>a.localeCompare(b,'fr'));
}

function demanderIdentite(){
  const m = document.getElementById('modale');

function csvVal(v){ return '"' + String(v ?? '').replace(/"/g,'""') + '"'; }
function telechargerCSV(nom, rows){
  const txt = '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');
  const b = new Blob([txt], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = nom.toLowerCase().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'') + '-' + aujourdhui() + '.csv';
  a.click();
  toast("Fichier téléchargé");
}
function exporterCSV(k){
  const cfg = CHAMPS[k];
  const cols = ['date', ...cfg.f.map(f => f.c), 'auteur', 'modifiePar'];
  const ent  = ['Date', ...cfg.f.map(f => f.l), 'Saisi par', 'Modifié par'];
  const lig  = (etat[k]||[]).map(o => cols.map(c => csvVal(o[c])));
  telechargerCSV(cfg.titre, [ent.map(csvVal), ...lig]);
}
function exporterTout(){
  const rows = [['Onglet','Date','Heure','Nature','Contenu','Détail','Par'].map(csvVal)];
  evenements().forEach(e => rows.push([e.type, e.date, e.heure, e.type, e.titre, e.detail, e.qui].map(csvVal)));
  telechargerCSV('Traçabilité complète', rows);
}

function importer(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      for(const k in etatInitial){ if(d[k] !== undefined) etat[k] = d[k]; }
      fusionnerNouveautes();
      await sauver(); rendre(); toast("Données importées");
    }catch(e){ toast("Fichier illisible"); }
  };
  r.readAsText(f); ev.target.value = '';
}

function ouvrirAjout(k){
  document.getElementById('modale').innerHTML = formulaire(k);
  document.getElementById('rideau').classList.add('on');
}

function formulaire(k, o){
  const cfg = CHAMPS[k];
  const ed = !!o;
  let h = `<h3>${esc(cfg.titre)} — ${ed ? 'modifier' : 'nouvelle entrée'}</h3><div class="form">`;
  h += `<label><span class="k">Date</span><input type="date" id="f-${k}-date" value="${esc(ed ? (o.date||'') : aujourdhui())}"></label>`;
  cfg.f.forEach(f => {
    const val = ed ? (o[f.c] ?? '') : (typeof f.d === 'function' ? f.d() : '');
    const id = `f-${k}-${f.c}`;
    h += `<label class="${f.large?'large':''}"><span class="k">${f.l}${f.req?' *':''}</span>`;
    if(f.t === 'textarea') h += `<textarea id="${id}">${esc(val)}</textarea>`;
    else if(f.t === 'select') h += `<select id="${id}">${f.o.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select>`;
    else h += `<input type="${f.t}" id="${id}" value="${esc(val)}">`;
    h += `</label>`;
  });
  h += `</div><div class="actions"><button class="btn" onclick="enregistrer('${k}'${ed?`,'${o.id}'`:''})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  return h;
}

function ouvrirEdition(k, id){
  const o = (etat[k]||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = formulaire(k, o);
  document.getElementById('rideau').classList.add('on');
}

async function enregistrer(k, id){
  const cfg = CHAMPS[k];
  const existant = id ? (etat[k]||[]).find(x => x.id === id) : null;
  const o = existant || {id:uid(), auteur:moi, quand:new Date().toISOString()};
  let manque = null;
  const dEl = document.getElementById(`f-${k}-date`);
  o.date = dEl ? dEl.value : aujourdhui();
  cfg.f.forEach(f => {
    const el = document.getElementById(`f-${k}-${f.c}`);
    const v = el ? el.value.trim() : '';
    if(f.req && !v && !manque) manque = f.l;
    o[f.c] = v;
  });
  if(manque){ toast(`Champ obligatoire : ${manque}`); return; }
  if(existant){ o.modifiePar = moi; } else { etat[k].unshift(o); }
  await sauver(); fermer(); rendre(); toast(existant ? "Modifié" : "Enregistré");
}

async function supprimer(k, id){
  noterRetrait(id);
  etat[k] = etat[k].filter(x => x.id !== id);
  await sauver(); rendre(); toast("Ligne supprimée");
}

function tableau(k){
  const cfg = CHAMPS[k], lignes = etat[k] || [];
  if(!lignes.length) return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;
  const ent = cfg.cols.map(c => {
    if(c === 'date') return 'Date';
    if(c === 'auteur') return 'Saisi par';
    const f = cfg.f.find(x => x.c === c);
    return f ? f.l : c;
  });
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  lignes.forEach(l => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel') v = frdate(v);
      if(typeof v === 'string' && /^https?:\/\//.test(v))
        return `<td><a href="${esc(v)}" target="_blank" rel="noopener">Ouvrir</a></td>`;
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + `<td class="act"><button title="Modifier" onclick="ouvrirEdition('${k}','${l.id}')">✎</button><button title="Supprimer" onclick="supprimer('${k}','${l.id}')">×</button></td></tr>`;
  });
  return h + '</tbody></table></div>';
}

    h += `<p class="vide">Rien de consigné pour l'instant. <a href="#" onclick="aller('courante');return false;">Ouvrir la main courante</a></p>`;

    h += `<ul class="fil">` + derniers.map(e =>
      `<li><div class="h">${frdate(e.date)} ${esc(e.heure||'')}</div>

function organigramme(){
  const gens = new Map();
  const ajoute = (nom, m, role) => {
    const n = (nom || '').trim();
    if(!n) return;
    const cle = cleP(n);
    if(!gens.has(cle)) gens.set(cle, {nom:n, pilote:[], appui:[]});
    gens.get(cle)[role].push({t:m.titre, esp:espaceDe(m), mid:m.id});
  };
  etat.missions.forEach(m => { ajoute(m.pilote, m, 'pilote'); ajoute(m.suppleant, m, 'appui'); });

  const liste = [...gens.values()].sort((a,b) =>
    b.pilote.length - a.pilote.length || a.nom.localeCompare(b.nom, 'fr'));
  const vacantes = etat.missions.filter(m => !(m.pilote || '').trim());

  if(!liste.length && !vacantes.length) return '';

  let h = `<div class="legende">
    <span><i style="background:var(--cobalt-clair)"></i> Pilote de la mission</span>
    <span><i style="background:#F4F6FA;border:1px solid var(--trait)"></i> En appui</span>
    <span><i style="background:var(--braise)"></i> Mission sans pilote</span>
  </div><div class="orga">`;

  liste.forEach(p => {
    const tot = p.pilote.length + p.appui.length;
    const c = coord(p.nom);
    const nEsc = esc(p.nom).replace(/'/g, "\\'");
    let contact = '';
    if(c.tel) contact += `<a href="tel:${esc(c.tel.replace(/\s/g,''))}">📞 ${esc(c.tel)}</a>`;
    if(c.mail) contact += `<a href="mailto:${esc(c.mail)}">✉️ ${esc(c.mail)}</a>`;
    if(!contact) contact = `<span class="abs">Aucun contact renseigné</span>`;
    h += `<div class="pers">
      <div class="qui">${p.pilote.length ? 'Pilote' : 'Appui'}</div>
      <div class="nom">${esc(p.nom)}</div>
      <div class="compte">${tot} mission${tot>1?'s':''}${p.pilote.length&&p.appui.length?` · ${p.pilote.length} pilotée${p.pilote.length>1?'s':''}, ${p.appui.length} en appui`:''}</div>
      <div class="coord">${contact}
        <button class="modif" onclick="editerContact('${nEsc}')">${c.tel||c.mail?'Modifier le contact':'Ajouter un contact'}</button>
      </div>
      ${p.pilote.map(o=>`<button class="chip" onclick="voirFiche('${o.mid}')"><span class="r">Pilote · fiche mission</span>${esc(o.t)}</button>`).join('')}
      ${p.appui.map(o=>`<button class="chip appui" onclick="voirFiche('${o.mid}')"><span class="r">Appui · fiche mission</span>${esc(o.t)}</button>`).join('')}
    </div>`;
  });

  if(vacantes.length){
    h += `<div class="pers vacant">
      <div class="qui">Personne n'est dessus</div>
      <div class="nom">À pourvoir</div>
      <div class="compte">${vacantes.length} mission${vacantes.length>1?'s':''} sans pilote désigné</div>
      ${vacantes.map(m=>`<div class="chip" style="background:#F8E5E0">${esc(m.titre)}</div>`).join('')}
    </div>`;
  }
  return h + `</div>`;
}

function evenements(){
  const e = [];
  const push = (o, type, titre, detail, qui) => {
    if(!titre) return;
    e.push({date:o.date||'', heure:o.heure||'', type, titre, detail:detail||'', qui:qui||o.auteur||''});
  };
  (etat.diffusions||[]).forEach(o => push(o,'Diffusé',o.objet,
    [o.canal,o.cible,o.portee?o.portee+' destinataires':''].filter(Boolean).join(' · '), o.emetteur||o.auteur));
  (etat.ars||[]).forEach(o => push(o,'ARS',o.objet,
    [o.sens,o.interlocuteur,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.courante||[]).forEach(o => push(o,'Consigné',o.evenement, [o.source,o.suite].filter(Boolean).join(' · '), o.auteur));
  (etat.terrain||[]).forEach(o => push(o,'Terrain',o.sujet,
    [o.professionnel,o.profession,o.commune,o.criticite].filter(Boolean).join(' · '), o.auteur));
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a =>
    push(a,'Appel CPTS', c.nom, [a.qui, a.dit].filter(Boolean).join(' · '), a.par)));
  (etat.materiel||[]).forEach(o => push(o,'Matériel',o.nature,
    [o.demandeur,o.quantite,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.volontaires||[]).forEach(o => push(o,'Volontaire',o.nom,
    [o.profession,o.dispo,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.veille||[]).forEach(o => push(o,'Veille',o.titre, [o.source,o.resume].filter(Boolean).join(' · '), o.auteur));
  return e.sort((a,b) => ((b.date+' '+(b.heure||'00:00')).localeCompare(a.date+' '+(a.heure||'00:00'))));
}

function vueFil(){

  let h = `<h1>Fil d'actualité</h1>

    <label class="large"><span class="k">Structure</span><input id="lg-org" value="${esc(o?o.org:'')}"></label>
    <label class="large"><span class="k">À quoi ça sert</span><textarea id="lg-quoi">${esc(o?o.quoi:'')}</textarea></label>
    <label><span class="k">Téléphone</span><input id="lg-tel" type="tel" value="${esc(o?o.tel:'')}"></label>
    <label><span class="k">Mail</span><input id="lg-mail" type="email" value="${esc(o?o.mail:'')}"></label>
    <label><span class="k">Disponibilité</span><input id="lg-dispo" value="${esc(o?o.dispo:'')}" placeholder="24h/24, heures ouvrées…"></label>
    <label><span class="k">Catégorie</span><select id="lg-cat">${cats.map(c=>`<option ${o&&o.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="large"><span class="k">Page officielle</span><input id="lg-url" value="${esc(o?o.url:'')}" placeholder="https://"></label>
    <label class="large"><span class="k">Coordonnée à confirmer&nbsp;?</span><select id="lg-verif"><option ${o&&o.verif?'':'selected'}>Non, elle est vérifiée</option><option ${o&&o.verif?'selected':''}>Oui, à confirmer</option></select></label>
  </div><div class="actions"><button class="btn" onclick="validerLigne(${o?`'${o.id}'`:''})">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerLigne(id){
  const n = document.getElementById('lg-nom').value.trim();
  if(!n){ toast("L'intitulé est obligatoire"); return; }
  const g = k => document.getElementById('lg-'+k).value.trim();
  const v = g('verif').startsWith('Oui');
  etat.lignes = etat.lignes || [];
  const o = id ? etat.lignes.find(x=>x.id===id) : null;
  if(o){ Object.assign(o, {nom:n, org:g('org'), quoi:g('quoi'), tel:g('tel'), mail:g('mail'), dispo:g('dispo'), cat:g('cat'), url:g('url'), verif:v}); }
  else etat.lignes.push({id:uid(), nom:n, org:g('org'), quoi:g('quoi'), tel:g('tel'), mail:g('mail'), dispo:g('dispo'), cat:g('cat'), url:g('url'), verif:v});
  await sauver(); fermer(); rendre(); toast(o?"Ligne modifiée":"Ligne ajoutée");
}
async function supprimerLigne(id){
  noterRetrait(id);
  etat.lignes = (etat.lignes||[]).filter(x => x.id !== id);
  await sauver(); rendre(); toast("Ligne retirée");
}

const DOSSIER = ['diffusions','ars','courante','terrain','materiel','volontaires'];

function tableauFige(k){
  const cfg = CHAMPS[k], lignes = etat[k] || [];
  if(!lignes.length) return `<p class="vide">Aucune ligne.</p>`;
  const ent = cfg.cols.map(c => c==='date' ? 'Date' : c==='auteur' ? 'Saisi par' : ((cfg.f.find(x=>x.c===c)||{}).l || c));
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}</tr></thead><tbody>`;
  lignes.forEach(l => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel') v = frdate(v);
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

function vueDossier(){
  let h = `<h1>Dossier de traçabilité</h1>
  <div style="font-family:var(--display);font-weight:600;font-size:16px;color:var(--encre);margin:-2px 0 6px">CPTS Pau Béarn</div>
  <p class="chapo">L'ensemble des éléments tracés par la CPTS Pau Béarn depuis le début de sa mobilisation dans le cadre du plan blanc régional / ORSAN AMAVI, mis bout à bout pour être imprimés ou enregistrés en PDF. C'est la pièce à joindre au retour d'expérience et au bilan.</p>
  <div class="barre-h">
    <button class="btn sec" onclick="exporterTout()">Tout en Excel</button>
    <button class="btn" onclick="imprimer()">Imprimer ou enregistrer en PDF</button>
  </div>
  <div class="carte"><h2>Organisation</h2>${organigramme() || '<p class="vide">Aucun pilote désigné.</p>'}</div>
  <div class="carte"><h2>Fiches mission</h2>` +
  etat.missions.map(m => {
    const f = m.fiche || {};
    const li = lignes(f.faire);
    return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--trait)">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(m.titre)}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 7px">Pilote : ${esc(m.pilote)||'à désigner'} · Suppléant : ${esc(m.suppleant)||'—'} · Mandat ARS : ${esc(m.mandat)} · ${esc(m.statut)}</div>
      ${f.but?`<div style="font-size:13.5px"><em>${esc(f.but)}</em></div>`:''}
      ${li.length?`<ul style="margin:6px 0 0;padding-left:19px;font-size:13.5px">${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${f.limite?`<div style="font-size:13px;color:var(--braise);margin-top:6px">Ce qu'on ne fait pas : ${esc(f.limite)}</div>`:''}
    </div>`;
  }).join('') + `</div>`;

  DOSSIER.forEach(k => {
    h += `<h2 style="margin-top:24px">${esc(CHAMPS[k].titre)}</h2>${tableauFige(k)}`;
  });

  h += `<h2 style="margin-top:24px">Appels aux CPTS</h2><div class="tw"><table>
    <thead><tr><th>CPTS</th><th>Proximité</th><th>Statut</th><th>Date</th><th>Interlocuteur</th><th>Ce qui a été dit</th><th>Suite</th><th>Par</th></tr></thead><tbody>` +
    (etat.cpts||[]).map(c => {
      const a = c.appels || [];
      if(!a.length) return `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td colspan="5">—</td></tr>`;
      return a.map(x => `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td>${frdate(x.date)} ${esc(x.heure||'')}</td><td>${esc(x.qui)||'—'}</td><td>${esc(x.dit)}</td><td>${esc(x.suite)||'—'}</td><td>${esc(x.par)}</td></tr>`).join('');
    }).join('') + `</tbody></table></div>`;
  return h;
}

function vueCollection(k){
  const cfg = CHAMPS[k];
  const n = (etat[k] || []).length;
  return `<h1>${cfg.titre}</h1><p class="chapo">${cfg.chapo}</p>
    <div class="barre-h"><span class="cpt-h">${n} ligne${n>1?'s':''}</span>
      <button class="btn sec" onclick="exporterCSV('${k}')">Excel</button>
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('${k}')">Ajouter</button></div>
    ${tableau(k)}`;
}

function majPrintHead(){
  const el = document.getElementById('printhead');
  if(!el) return;
  const o = ONGLETS.find(x => x.id === onglet);
  el.innerHTML = `<div class="t">CPTS Pau Béarn — ${esc(o ? o.nom : 'Dossier de traçabilité')}</div>
    <div class="d">${esc(etat.entete.niveau)} · édité le ${new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${moi!=='Anonyme'?' par '+esc(moi):''}</div>`;
}

function rendre(){
  etat.personnes = etat.personnes || {};
  rendreNav();
  rendreMesMissions();
  const v = document.getElementById('vue');
  if(onglet === 'cockpit') v.innerHTML = vueCockpit();
  else if(onglet === 'missions') v.innerHTML = vueMissions();
  else if(onglet === 'veille') v.innerHTML = vueVeille();
  else if(onglet === 'fil') v.innerHTML = vueFil();
  else if(onglet === 'lignes') v.innerHTML = vueLignes();
  else if(onglet === 'offre') v.innerHTML = vueOffre();
  else if(onglet === 'appels') v.innerHTML = vueAppels();
  else if(onglet === 'dossier') v.innerHTML = vueDossier();
  else v.innerHTML = vueCollection(onglet);
  v.insertAdjacentHTML('afterbegin', '<div class="entete-print" id="printhead"></div>');
  majPrintHead();
}

charger();
</script>
</body>
</html>
