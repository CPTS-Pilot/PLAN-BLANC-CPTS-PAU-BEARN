/* ---------- cartographie ----------
   Une commune écrite dans une colonne ne dit pas si le cabinet est
   à dix minutes de la pharmacie qui appelle. La carte le dit. Elle
   ne remplace pas la liste : elle se lit à côté d'elle, et se
   replie quand on n'en a pas besoin. */
.carto{background:var(--carte);border:1px solid var(--trait);border-radius:9px;margin-bottom:16px;overflow:hidden}
.carto .tete-c{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}
.carto .tete-c .t{font-family:var(--display);font-weight:700;font-size:16px;color:var(--encre);line-height:1.2}
.carto .tete-c .s{font-size:12.5px;color:var(--texte-2);flex:1 1 220px;line-height:1.35;margin:0}
.carto .tete-c .plier{background:none;border:1px solid var(--trait);border-radius:7px;color:var(--texte-2);
  font-family:inherit;font-size:12.5px;padding:7px 12px;cursor:pointer;min-height:36px}
.carto .tete-c .plier:hover{border-color:var(--encre-2);color:var(--encre-2)}
.carto .tete-c .plier.on{background:var(--cobalt-clair);border-color:var(--encre-2);
  color:var(--encre);font-weight:600}
/* z-index:0 enferme les couches de Leaflet — elles montent jusqu'à
   800 — sous les fenêtres du cockpit, qui sont à 50. Sans cela, la
   carte passerait par-dessus la modale de saisie. */
.carto-hote,.carto-vide{height:330px;border-top:1px solid var(--trait);background:var(--cobalt-clair);
  position:relative;z-index:0;isolation:isolate}
.carto-hote.court,.carto-vide.court{height:260px}
.carto-toile{height:100%}
.carto-vide,.carto .attente{display:flex;align-items:center;justify-content:center;height:100%;
  font-size:13px;color:var(--texte-2);font-style:italic;text-align:center;padding:22px;line-height:1.45}
.carto .legende{display:flex;flex-wrap:wrap;gap:7px 15px;padding:11px 16px;border-top:1px solid var(--trait);
  font-size:12px;color:var(--texte-2)}
.carto .legende span{display:inline-flex;align-items:center;gap:6px}
.carto .legende i{width:11px;height:11px;border-radius:50%;display:inline-block;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.22)}
.carto .legende i.approx{opacity:.45}
/* L'anneau de la légende reprend la forme du cabinet sur la carte :
   creux, quand la personne signalée est un disque plein. */
.carto .legende i.creux{border-color:transparent;box-shadow:none}
.carto .manquants{padding:11px 16px;border-top:1px solid var(--trait);font-size:12.5px;
  color:#8A5D12;background:#FCF3E4;line-height:1.45}
.carto .source{padding:9px 16px;border-top:1px solid var(--trait);font-size:11px;color:var(--texte-2);line-height:1.4}
.carto-popup{font-family:var(--corps);font-size:13.5px;line-height:1.45;min-width:180px}
.carto-popup .n{font-family:var(--display);font-weight:700;font-size:15px;color:var(--encre);line-height:1.2}
.carto-popup .l{color:var(--texte-2);font-size:12.5px;margin-top:2px}
.carto-popup .n .urg{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  background:#F7E3DE;color:var(--braise);border-radius:4px;padding:2px 6px;margin-left:7px;
  vertical-align:2px;font-weight:400}
/* Le cabinet le plus proche est la réponse qu'on vient chercher en
   touchant un point : il se détache du reste de la bulle. */
.carto-popup .pres{margin-top:9px;background:var(--cobalt-clair);border-radius:7px;padding:8px 10px;
  font-size:13px;line-height:1.4;color:var(--encre)}
.carto-popup .pres .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--texte-2);display:block;margin-bottom:2px}
.carto-popup a{display:block;margin-top:7px;color:var(--encre-2);font-weight:600;text-decoration:none}
.carto-popup button{margin-top:9px;background:none;border:1px solid var(--trait);border-radius:7px;
  color:var(--texte-2);font-family:inherit;font-size:12.5px;padding:6px 11px;cursor:pointer}
.carto-popup button:hover{border-color:var(--encre-2);color:var(--encre-2)}
@media print{.carto{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* Interrupteur du formulaire public de recensement des renforts
     (appel-au-renfort.html). Même mécanique que la collecte : le
     copil l'ouvre et le ferme d'ici, le serveur refuse toute
     inscription tant qu'il est fermé. Le « cadre » s'affiche en

     qu'on sait — et ce qu'on ne sait pas encore — du renfort
     attendu. */
  renfort: { ouverte:false, message:'', cadre:"Le type exact de renfort n'est pas encore arrêté : la CPTS Pau Béarn recense d'abord qui serait disponible, pour quoi et jusqu'où, afin de pouvoir répondre vite quand une demande précise arrivera. S'inscrire n'engage à rien et ne vaut pas affectation." },
  /* La campagne de recensement des généralistes qui acceptent de
     recevoir les personnes évacuées. Même mécanique que la
     collecte et le renfort : le copil ouvre, le formulaire
     public s'anime, les réponses tombent dans le registre. */
  consultations: { ouverte:false, message:'', cadre:"Il s'agit de consultations ponctuelles au cabinet, aux horaires que vous choisissez : renouvellement d'ordonnance interrompue par un départ précipité, suites d'inhalation de fumées. Répondre ne vous engage ni à devenir médecin traitant, ni à recevoir plus de patients que vous ne l'avez indiqué." },
  courante: [
    {id:'mc35', date:'2026-07-29', heure:'', source:'', evenement:"Reprise du feuillet « Patients signalés / orientés », après une première saisie réelle. Le formulaire de signalement ne demandait pas le numéro de téléphone du patient : il le demande désormais, juste sous l'âge. C'était le manque le plus gênant — une fois le médecin trouvé, on n'avait personne à rappeler et il fallait attendre que la pharmacie rappelle d'elle-même. Le numéro n'est pas obligatoire : un signalement sans numéro vaut mieux qu'un signalement perdu. Il s'ajoute aussi aux lignes déjà saisies par le crayon de modification, part à l'export Excel, entre dans la recherche, et disparaît avec le reste à l'anonymisation du registre. Le registre lui-même ne se lit plus en bandes pleine largeur mais en cartes : trois par ligne sur ordinateur, deux en tablette, une seule sur téléphone. Chaque carte porte en tête le nom, la commune et l'heure, puis le motif dans son propre encadré, en gros — c'est ce pour quoi on décroche. Une personne signalée urgente et sans médecin porte un bandeau rouge pleine largeur en tête de carte : dans une liste de trente, c'est la seule chose qui doit sauter aux yeux. Le numéro s'affiche en bouton bleu qui compose l'appel d'un doigt, et une carte sans numéro le dit.", suite:"La recherche avancée du registre est repliée : ne restent visibles que le champ de recherche et le tri, sur une seule ligne. Période, statut, urgence et voie dorment derrière un bouton « Affiner » qui compte les filtres posés — un registre tronqué ne doit jamais passer pour un registre complet. Corrigé au passage : le pied de chaque ligne écrivait « Orientation par » le nom de la personne qui avait saisi le signalement, alors qu'à ce moment-là rien n'est encore orienté. Il écrit maintenant « Saisie par », et n'ajoute « Orientation par » qu'une fois un médecin désigné, au nom de la personne qui l'a désigné — ce n'est pas toujours la même.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc34', date:'2026-07-29', heure:'', source:'', evenement:"L'onglet « Appels CPTS » quitte les Actions pour le Suivi, et prend le nom de « Contact avec les CPTS ». Il se lit maintenant juste sous « Situation régionale », dont il est le prolongement : appeler une CPTS voisine n'est pas une action que la CPTS Pau Béarn conduit pour elle-même, c'est la manière dont on sait ce qui se passe là-bas. Rien ne change dans l'écran : les mêmes fiches, les mêmes numéros, le même journal d'appels, le même export.", suite:"Les Actions ne portent plus que ce que la CPTS mène en propre : la collecte, l'appel au renfort, les patients évacués.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc33', date:'2026-07-29', heure:'', source:'', evenement:"Mise en carte des médecins généralistes dans l'onglet « Patients évacués ». Une adresse portée sur une fiche devient un point sur une carte, sans rien à faire de plus : le cockpit la situe tout seul auprès de la Base Adresse Nationale, garde le point avec la fiche et ne le recalcule que si l'adresse change. Deux cartes en découlent. Dans le feuillet « Médecins volontaires », la cartographie du registre entier, un point par cabinet coloré selon la réponse du médecin — vert pour ceux qui acceptent, ambre pour ceux qui ont été sollicités sans réponse ferme, bleu pour ceux qui restent à solliciter, gris pour ceux qui ont dit non : ce sont les trous entre les points qui disent les communes à couvrir. Dans le feuillet « Patients signalés / orientés », au-dessus de la liste, la cartographie des seuls médecins volontaires du territoire : quand une pharmacie appelle, on voit qui est le plus près de la personne avant de décrocher. Toucher un point ouvre le nom du médecin, sa réponse, son numéro qui compose et l'itinéraire ; depuis une fiche du registre, « Situer sur la carte » fait l'inverse. Une adresse que le service ne retrouve pas est signalée sur sa fiche et sous la carte, à corriger ; un médecin dont on n'a que la commune est posé sur le bourg, en point pâle.", suite:"Seules les adresses professionnelles des médecins sont transmises au service d'adresses — aucune donnée de patient ne sort du cockpit. Les deux services employés sont publics et sans compte à ouvrir : la Base Adresse Nationale pour situer, OpenStreetMap pour le fond de carte. Sur un poste hors ligne ou derrière un réseau qui les filtre, la carte le dit et s'efface : la liste, les adresses et le lien « Itinéraire » continuent de fonctionner comme avant. À l'usage, vérifier les adresses signalées non retrouvées — c'est le plus souvent une rue mal orthographiée ou une commune manquante.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc32', date:'2026-07-29', heure:'', source:'', evenement:"Reprise de la main courante sur une confusion de fond : « Coordination » et « Vice-présidence » avaient été portés en source, alors qu'une décision prise entre nous ne vient de nulle part — elle a seulement quelqu'un qui s'en est chargé. Les vingt-cinq entrées concernées perdent leur source et gagnent le nom de la personne qui a mené l'action, relu un par un dans le texte de l'entrée. Six entrées gardent une source, les seules qui en aient une : le CMSI de Billère, les pharmaciens du territoire, l'ARS Nouvelle-Aquitaine, les CPTS des zones touchées et le médecin coordonnateur du parc des expositions de Bordeaux. Le formulaire pose désormais la question en deux temps séparés à l'écran — « Est-ce nous qui l'avons fait ? » puis « Ou est-ce venu du dehors ? » — avec les sources fréquentes en pastilles. Une entrée venue du dehors se reconnaît dans le journal à un bandeau ambre portant le nom de qui l'a communiquée, et remonte d'elle-même dans l'onglet « Remontées terrain », sans y être recopiée : elle n'est écrite qu'une fois et se modifie en main courante. Corrigé au passage : deux entrées différentes portaient le même identifiant mc25, si bien que modifier l'une touchait l'autre.", suite:"Règle à tenir désormais : la source ne se remplit que si l'information nous a été communiquée de l'extérieur — une pharmacie, une structure, l'ARS, un confrère. Tout le reste se nomme dans « Qui s'en est chargé ». Une entrée reste sans personne nommée, l'acheminement du 27/07 au soir vers Bordeaux : le conducteur n'a jamais été consigné, à compléter si quelqu'un s'en souvient.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc31', date:'2026-07-29', heure:'', source:'', evenement:"Refonte de l'onglet « Patients évacués » du cockpit, après un test sur téléphone : il fallait trop faire défiler avant d'atteindre ce qu'on vient réellement chercher. Le module « Accueil patients évacués : hub santé sur le territoire » est retiré de l'interface — l'écran n'était pas mûr ; les lieux déjà recensés restent dans les données et au dossier de traçabilité, et l'écran se rebâtira le moment venu. L'onglet ne présente plus qu'une carte, renommée « Orientation vers les médecins généralistes du territoire ». Sous les feuillets, le titre et le chapô répétés sont supprimés, et la batterie de neuf compteurs est démontée : chaque feuillet ne porte plus que les chiffres qui le concernent — médecins sondés, acceptant de recevoir et communes couvertes chez les médecins volontaires ; patients signalés et patients orientés chez les patients ; structures dans la démarche et structures ayant signalé chez les structures. Le recensement en ligne des généralistes, qui occupait le haut du feuillet, tient maintenant dans un bouton qui ouvre une fenêtre. Les feuillets « Recueillir un patient » et « Patients signalés / orientés » sont fusionnés : un bouton « Signaler un patient » ouvre le formulaire de recueil, la liste des patients est juste en dessous. Sur chaque ligne, un bouton « Orienter le patient » ouvre la liste des médecins volontaires — un nom à toucher, ou un médecin saisi à la main s'il n'est pas au vivier. Le feuillet « Pharmacies et structures » devient « Structures qui orientent ».", suite:"Trois choses sont désormais enregistrées à chaque affectation : le jour, l'heure et le nom de la personne qui affecte, proposé d'après la session ouverte et modifiable quand on saisit pour quelqu'un d'autre. Dans les fiches des médecins et des structures, toucher le numéro compose l'appel et toucher l'adresse ouvre l'application de cartes du téléphone. La mention « accord de diffusion à vérifier » est retirée des fiches : elle se règle au téléphone. Une structure recensée dans « Structures qui orientent » est proposée d'elle-même au moment de signaler un patient — reste à recenser les pharmacies et les structures du territoire susceptibles d'orienter.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc30', date:'2026-07-29', heure:'', source:'', evenement:"L'onglet « Appel au renfort » s'ouvre désormais sur deux cartes, sur le modèle de « Patients évacués ». La première, « Formulaire de recensement en ligne », mène à l'ouverture de l'appel, au lien à diffuser et aux textes affichés aux professionnels. La seconde, « Recensement des professionnels de santé », mène au registre : les inscriptions arrivées par le formulaire et celles recueillies au téléphone, les vérifications d'assurance et de continuité des soins, les exports Excel et PDF. Le pavé de rappel sur le cadre du renfort est retiré de l'écran, et le doublon « Reporter une réponse » supprimé — il ne reste qu'un bouton, « Recenser un professionnel », comme pour les médecins généralistes.", suite:"Une réponse arrivée autrement qu'au téléphone se saisit avec le même bouton ; elle ne porte plus la mention « saisie à la main », qui se lisait déjà mal.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc29', date:'2026-07-29', heure:'', source:'', evenement:"Les trois formulaires publics du cockpit — collecte de matériel, appel au renfort, recensement des généralistes — ne s'ouvrent plus sans qu'on ait dit pourquoi. Au clic sur « Ouvrir », une question s'affiche : est-ce une ouverture officielle ? Répondre oui ouvre le formulaire et consigne l'ouverture en main courante, comme auparavant. Répondre non l'ouvre pour essai, sans rien consigner : la carte porte alors la mention « Ouvert — essai » et rappelle que le formulaire répond quand même à qui a le lien. La fermeture suit : un formulaire ouvert en essai se referme sans laisser de trace, un formulaire ouvert officiellement consigne sa fermeture. Motif : les ouvertures de vérification remplissaient la main courante d'entrées qui ne correspondaient à aucun acte de coordination. L'ouverture de la collecte, qui ne se consignait pas du tout, se consigne désormais comme les deux autres.", suite:"À l'usage, ne répondre « ouverture officielle » qu'au moment de diffuser le lien. Les entrées d'ouverture et de fermeture déjà consignées par erreur restent à supprimer une par une dans la main courante.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc28', date:'2026-07-28', heure:'', source:'', evenement:"Allègement de la saisie des médecins généralistes volontaires dans le cockpit, sur le modèle de celui de l'appel au renfort. La fiche se remplit désormais en neuf champs, le téléphone à l'oreille : nom, prénom, cabinet, adresse, commune, téléphone, modalité d'appel — secrétariat, ligne directe ou autre — volontaire oui ou non, et une case unique de précisions supplémentaires. Les réponses courtes se donnent en pastilles plutôt qu'en listes déroulantes. Le doublon « Reporter une réponse » est supprimé : il n'y a plus qu'un bouton, « Ajouter un médecin ». Les fiches créées ne portent plus que ce qui a été renseigné — une case laissée vide ne s'affiche plus sous forme de phrase disant ce qui manque.", suite:"Les questions retirées du cockpit — motifs acceptés, nombre de patients, créneaux, délai, conditions, accord de diffusion, RPPS, courriel — restent posées par le formulaire en ligne aux médecins qui y répondent, s'affichent sur leur fiche et sortent à l'export : elles ne sont plus qu'à la frappe. Modifier une fiche arrivée du formulaire n'efface rien de ce que le médecin a déclaré. Ce qui se recueille au téléphone au-delà des neuf champs se note dans « Précisions supplémentaires ».", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc27', date:'2026-07-28', heure:'', source:'', evenement:"Ouverture d'un second volet à l'action « Patients évacués » : l'accueil. Orienter une personne évacuée vers un médecin suppose qu'elle ait un endroit où être, compatible avec son état — ce qui n'est pas le cas de toutes, entre les départs précipités, les hébergements chez des proches et les sorties d'hospitalisation sans domicile à retrouver. L'onglet « Patients évacués » du cockpit présente désormais deux modules distincts : « Continuité des soins », qui est le fléchage vers un généraliste tel qu'il fonctionnait jusqu'ici, et « Accueil patients évacués : hub santé sur le territoire », qui recense les lieux capables de recevoir quelqu'un nécessitant des soins — EHPAD, résidences autonomie, SSR, hôpitaux de proximité, structures médico-sociales, hébergements collectifs. Pour chaque lieu : le gestionnaire et son interlocuteur, le nombre de places mobilisables et celles déjà occupées, la date à partir de laquelle elles s'ouvrent, les publics accueillis, l'accessibilité, la restauration — et surtout le niveau de soins assuré sur place, du gymnase sans soignant à l'établissement médicalisé en continu. C'est ce dernier champ qui décide de ce qu'on peut annoncer au téléphone.", suite:"Recenser les lieux un par un, en commençant par les gestionnaires qu'il faut appeler ; un lieu s'inscrit dès qu'il est identifié, avec la disponibilité « À solliciter », ce qui évite de rappeler deux fois le même. Confirmer auprès du gestionnaire tout lieu annoncé mobilisable avant de le compter, et rattacher un médecin ou une structure de soins à chaque lieu qui n'a pas de soignant sur place. Rappel du cadre : la CPTS tient la liste et la met à disposition de qui décide de l'accueil — elle ne place personne et ne gère aucun lieu.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc26', date:'2026-07-28', heure:'12:00', source:'', evenement:"À midi, Eva Poulmarch engage la conception d'une méthode de recensement des médecins généralistes et de mise à disposition de leurs créneaux. L'objectif est de recueillir en une seule fois qui accepte de recevoir des personnes évacuées, pour quels motifs et sur quelles demi-journées, de rassembler ces disponibilités en un calendrier unique, et de disposer ainsi d'une base exploitable pour piloter l'orientation des patients — plutôt que de rappeler cabinet par cabinet à chaque demande de pharmacie ou de structure de soins non programmés.", suite:"Ce travail se poursuit dans le cockpit : formulaire de recensement, agenda des créneaux et registre des médecins volontaires, consignés ci-dessus. Reste à diffuser le lien aux généralistes du territoire, canal par canal, et à consigner chaque diffusion.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc25', date:'2026-07-28', heure:'', source:'', evenement:"Anne Latisnère, vice-présidente, se charge de constituer le réseau de médecins généralistes volontaires pour recevoir les personnes évacuées : identification des cabinets du territoire, prise de contact et recueil des accords. Elle pilote l'action « Patients évacués » ; Eva Poulmarch, coordinatrice, en tient la logistique et l'outillage.", suite:"Consigner ici chaque diffusion aux médecins et chaque accord obtenu, et reporter les volontaires dans « Patients évacués », feuillet « Médecins volontaires ». Rappeler chaque médecin qui accepte pour confirmer ses créneaux avant de transmettre la liste aux pharmacies et aux structures de soins non programmés.", qui:'Anne Latisnère', auteur:'Eva Poulmarch', quand:''},
    {id:'mc25b', date:'2026-07-28', heure:'', source:'', evenement:"Allègement du formulaire de l'appel au renfort, sur le modèle de celui des généralistes. La commune d'exercice et le courriel deviennent obligatoires : sans commune on ne sait pas d'où part le volontaire, et le courriel double le téléphone quand il ne répond pas. La profession et le mode d'exercice acceptent désormais une saisie libre, pour les cas que les listes ne couvrent pas. Deux questions sont retirées — l'engagement dans un autre dispositif, et toute la partie « Quand et jusqu'où » à l'exception du rayon de déplacement : disponibilités, date de début, durée, véhicule et nuitée se demandent mieux au téléphone. Point capital corrigé dans le cadre remis au volontaire : c'est l'ARS qui rappellera avant toute proposition de mission, et non la coordination de la CPTS Pau Béarn — le formulaire annonçait l'inverse.", suite:"Les champs retirés du formulaire public restent disponibles dans le cockpit pour la saisie à la main et se renseignent au moment du rappel de vérification — assurance hors cabinet, continuité de la patientèle, créneaux. Vérifier au premier envoi que le récapitulatif remis au professionnel porte bien la mention du rappel par l'ARS.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc24', date:'2026-07-28', heure:'11:00', source:'', evenement:"Message adressé à 11h00 aux médecins de SOS Médecins Pau, confrontés à la même difficulté que les autres structures de soins non programmés : ils reçoivent des personnes évacuées pour des renouvellements d'ordonnance et des suites liées aux incendies, motifs qui relèvent du suivi et non de l'urgence. Le message leur présente le dispositif en cours de création par la CPTS Pau Béarn — un vivier de médecins généralistes volontaires et un circuit de fléchage depuis les pharmacies et les structures de soins non programmés. Il dit sans détour que le vivier n'est pas encore constitué et les associe à sa construction : ce qu'ils voient du flux, ce qui les soulagerait dans le fléchage, et la possibilité de figurer eux-mêmes parmi les médecins volontaires. Mêmes lignes de contact que le communiqué aux pharmaciens. Envoi réalisé par Eva Poulmarch.", suite:"Consigner le canal employé et l'interlocuteur joint. Nommer un interlocuteur SOS Médecins Pau au carnet de coordonnées, et reporter leur estimation du flux dans « Remontées terrain ».", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc23', date:'2026-07-28', heure:'10:00', source:'', evenement:"Communiqué diffusé à 10h00 aux pharmaciens du territoire, en réponse aux remontées de la matinée. Il expose la situation telle qu'elle est : des personnes évacuées des zones incendiées de Gironde se présentent en officine sans médecin traitant sur le territoire, cette situation est appelée à s'accroître, et la CPTS Pau Béarn se met en ordre de marche pour constituer un vivier de médecins généralistes disponibles pour les recevoir en consultation. Le communiqué ne donne aucun nom de médecin — le vivier est en cours de constitution — et invite les pharmaciens à continuer de faire remonter les situations rencontrées au comptoir. Deux lignes leur sont ouvertes : Anne Latisnère, vice-présidente, référente de cette coordination (06 29 82 29 10), et Eva Poulmarch, coordinatrice, sur la logistique (07 61 18 16 35). Diffusion réalisée par Anne Latisnère et Eva Poulmarch.", suite:"Consigner le canal employé et le nombre d'officines destinataires. Recueillir les retours dans « Remontées terrain », et rappeler les pharmacies dès l'ouverture du vivier pour leur transmettre le circuit de fléchage.", qui:'Anne Latisnère et Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc22', date:'2026-07-28', heure:'', source:'Pharmaciens du territoire', evenement:"Remontées directes de pharmaciens d'officine du territoire, coup sur coup dans la matinée : ils reçoivent au comptoir des personnes évacuées des zones incendiées de Gironde — les unes revenues dans leur commune d'origine, les autres relogées en Béarn — qui n'ont pas de médecin traitant ici. Mêmes demandes qu'au CMSI de Billère : renouvellement d'ordonnances interrompues par un départ précipité, et prise en soins d'infections liées aux incendies. Le pharmacien peut dépanner dans les limites de la dispensation d'urgence, mais ne peut ni prolonger durablement un traitement ni ouvrir une prise en charge : sans médecin vers qui adresser, la personne repart sans solution.", suite:"Consigné dans « Remontées terrain ». Seconde remontée de la matinée après celle du CMSI de Billère : elle confirme que la difficulté n'est pas isolée et fonde le communiqué diffusé aux pharmaciens à 10h00. Nommer au fil des retours les officines qui ont appelé, pour pouvoir les rappeler dès que le vivier de généralistes est ouvert.", auteur:'Eva Poulmarch', quand:''},
    {id:'mc18', date:'2026-07-28', heure:'', source:'', evenement:"Préparation d'un message d'information aux pharmaciens du territoire, en accompagnement du sondage des médecins généralistes de l'action « Patients évacués ». Le message assume la situation telle qu'elle est : le réseau d'orientation n'est pas encore constitué, aucun nom de médecin ne peut être donné à ce stade, et le vivier de volontaires est en cours de constitution. Il invite les pharmaciens à continuer de faire remonter les situations rencontrées au comptoir, en indiquant que ces remontées ont des suites — c'est l'une d'elles qui a ouvert l'action. Deux lignes y sont ouvertes : Anne Latisnère, vice-présidente, référente de cette coordination (06 29 82 29 10), et Eva Poulmarch, coordinatrice, sur la logistique (07 61 18 16 35).", suite:"Message diffusé le 28/07 à 10h00 par Anne Latisnère et Eva Poulmarch — voir l'entrée de 10h00 ci-dessus, où se consignent le canal employé, le nombre d'officines destinataires et les retours reçus.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc21', date:'2026-07-28', heure:'', source:'', evenement:"Allègement du formulaire de recensement des généralistes, après relecture. Les horaires d'une demi-journée s'ouvrent désormais dans la semaine même, juste sous sa grille : cocher mercredi matin et devoir descendre en bas de page pour en préciser l'heure n'était pas tenable pour un médecin qui répond entre deux patients. Les six motifs ne se cochent plus un par un — la liste se lit, et une seule case la couvre : accepter, c'est accepter ce qui relève de la médecine générale courante. Trois questions sont retirées : le nombre de patients acceptés, le délai de rendez-vous et les conditions posées, qui se demandent mieux au téléphone qu'au formulaire.", suite:"Les champs « nombre de patients » et « conditions posées » restent disponibles dans le cockpit pour la saisie à la main et se renseignent au moment du rappel de confirmation. Le reste du formulaire est inchangé : identité, réponse oui ou non, créneaux, prise de rendez-vous, accord de diffusion, et la question du médecin traitant en dernier.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc20', date:'2026-07-28', heure:'', source:'', evenement:"Mise en service de l'agenda des créneaux, dans l'onglet « Patients évacués ». Les médecins qui répondent au formulaire cochent leurs demi-journées puis, d'un appui, les horaires exacts qu'ils peuvent proposer. Tous ces créneaux se rassemblent en un seul calendrier, jour par jour, qui distingue ce qui est libre de ce qui est positionné. Quand une pharmacie appelle, la coordination repère un créneau libre, y pose la personne signalée, et le cockpit rend aussitôt le téléphone et le courriel du médecin, avec un message tout écrit à lui envoyer — un créneau positionné dont le médecin n'est pas prévenu n'est pas un rendez-vous.", suite:"Rappeler aux médecins, à la diffusion du formulaire, que préciser des horaires évite un appel de calage et permet de placer une personne dans la journée. Suivre le compteur « à confirmer avec le médecin » : il compte les créneaux posés dont le praticien n'a pas encore été averti.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc19', date:'2026-07-28', heure:'', source:'', evenement:"Mise en place de la campagne de recensement des médecins généralistes volontaires pour recevoir en consultation les personnes évacuées. Un formulaire en ligne, sur le modèle de ceux de la collecte et de l'appel au renfort, permet au médecin de répondre depuis son téléphone : identité, adresse du cabinet et téléphone, réponse oui ou non, motifs qu'il accepte de prendre, nombre de patients, et surtout ses créneaux — cochés demi-journée par demi-journée sur un calendrier de trois semaines plutôt que rédigés. La question de devenir médecin traitant est posée en dernier et ne conditionne rien. Un refus s'enregistre comme un accord : cela évite de rappeler deux fois le même cabinet.", suite:"Le recensement reste fermé tant que la coordination ne l'ouvre pas depuis l'onglet « Patients évacués », feuillet « Médecins volontaires ». À l'ouverture, diffuser le lien aux généralistes du territoire et consigner chaque diffusion. Attention : le cockpit et ses formulaires sont servis en http, ce qui a déjà provoqué un avertissement « site non sécurisé » lors de la diffusion du formulaire de don — arbitrer le canal avant d'envoyer.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc17', date:'2026-07-28', heure:'', source:'', evenement:"Cadre de protection des données arrêté pour le fléchage des patients évacués. Le cockpit ne conserve aucune donnée nominative de patient : le registre est pseudonymisé — initiales, âge, commune, motif — et le nom reste chez la pharmacie ou la structure de soins non programmés qui reçoit la personne. La CPTS aiguille vers un médecin, elle ne constitue pas de liste de patients et ne transporte aucun dossier médical. L'information et l'accord du patient sont recueillis au comptoir par la structure qui le reçoit, et tracés dans le registre. Quand des coordonnées doivent malgré tout circuler vers un médecin, elles passent par messagerie sécurisée de santé entre professionnels, jamais par le cockpit, ni par courriel ordinaire ou WhatsApp.", suite:"Un bouton « Anonymiser le registre » efface les références patients et les précisions en conservant les compteurs : à actionner une fois la crise passée, pour ne garder au dossier de traçabilité que ce qui sert au retour d'expérience et au bilan ACI. Reste à ajouter cette activité au registre des traitements de la CPTS et à remettre aux pharmacies une mention d'information à afficher au comptoir.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc16', date:'2026-07-28', heure:'08:00', source:'CMSI de Billère', evenement:"Appel reçu à 8h00 par Anne Latisnère, vice-présidente, de la part du CMSI de Billère : la structure reçoit des patients évacués des zones incendiées de Gironde — les uns revenus dans leur commune d'origine, les autres délocalisés ici. Partis dans la précipitation, ils sont en demande de renouvellement de leurs ordonnances en cours et de prise en soins pour des infections liées aux incendies. N'ayant pas de médecin traitant sur le territoire, ils se tournent vers le CMSI. Or celui-ci est un acteur de soins non programmés : il n'est pas en mesure d'assumer ni d'assurer ce type de rôle, qui relève du suivi et non de l'urgence. La structure reçoit par ailleurs les appels de pharmaciens du territoire confrontés aux mêmes situations au comptoir.", suite:"La CPTS Pau Béarn ouvre l'action « Patients évacués » : sonder les médecins généralistes du territoire pour constituer un vivier de volontaires acceptant les renouvellements d'ordonnance et les suivis liés aux incendies, informer les pharmacies et les structures de soins non programmés, et organiser un fléchage coordonné des patients. Pilote : Anne Latisnère ; appui coordination : Eva Poulmarch. Remontée également tracée dans « Remontées terrain ».", qui:'Anne Latisnère', auteur:'Anne Latisnère', quand:''},
    {id:'mc15', date:'2026-07-27', heure:'19:00', source:'', evenement:"Acheminement du matériel collecté à la Foire Expo vers le Parc des Expositions de Bordeaux — centre d'accueil et de regroupement — le soir même, dans la foulée de la clôture du point de collecte. Les 94 unités partent conditionnées ; le nombre de colis n'est pas encore arrêté au moment de la clôture.", suite:"Compléter le nombre de colis au conditionnement et la quantité de gel hydroalcoolique (unité de conditionnement non renseignée). Faire viser le récapitulatif à la réception par le site de Bordeaux, et en conserver un exemplaire au dossier de traçabilité. Nommer le conducteur et l'heure de départ effective dans le point de collecte.", auteur:'Eva Poulmarch', quand:''},
    {id:'mc14', date:'2026-07-27', heure:'19:00', source:'', evenement:"Clôture du point de collecte de la Foire Expo — Parc des Expositions de Pau, ouvert de 17h00 à 19h00, sous la responsabilité d'Anne Latisnère, vice-présidente, avec Camille Fillaudeau. 94 unités collectées auprès de 8 déposants distincts, en 26 lignes de dépôt : 62 dispositifs médicaux — 19 thermomètres, 18 lecteurs d'hémoglucotest, 12 tensiomètres, 10 saturomètres, 3 stéthoscopes — et 32 consommables — 31 masques FFP2 et du gel hydroalcoolique. Déposants : Joeva, Valérie, Florie, Anne et Jibran, Sandra, la pharmacie de la Paix (Camille), la pharmacie Berlioz (Sophie Maréchal) et Distri Med. Aucun matériel refusé ni signalé non conforme, aucun don annoncé non reçu. Les masques FFP2 et le gel hydroalcoolique sortent de la liste des cinq dispositifs annoncés : acceptés, ils sont comptabilisés à part en consommables.", suite:"Détail ligne à ligne et récapitulatif imprimable dans « Collecte de matériel », feuillet « Points de collecte ». Rapprocher les déposants du registre des donateurs : la plupart des dépôts ne correspondent pas à une déclaration reçue par le formulaire, et plusieurs déclarations reçues n'ont pas encore été déposées.", qui:'Anne Latisnère', auteur:'Anne Latisnère', quand:''},
    {id:'mc13', date:'2026-07-27', heure:'', source:'', evenement:"Décision de lancer un appel au renfort en propre : un formulaire de recensement sera diffusé à l'ensemble des professionnels de santé du territoire répondant aux critères, pour identifier ceux qui pourraient se déplacer sur les zones touchées ou dans les hubs de santé, auprès de la population blessée ou évacuée. Le type exact de renfort attendu n'est pas encore connu : le recensement est ouvert large, et vaudra base de réponse quand une demande précise arrivera. Deuxième appel lancé en propre par la CPTS après celui de la logistique de collecte — celui-ci porte sur le soin.", suite:"Ouvrir le formulaire depuis l'onglet « Appel au renfort » et diffuser le lien profession par profession. Rappeler chaque inscrit : assurance hors cabinet, continuité de sa patientèle, accord pour que ses coordonnées circulent. La question 5 posée à la DD ARS 64 — souhaitez-vous que la CPTS constitue une liste de volontaires, sous quel statut et via quel canal — reste sans réponse : le recensement se mène sans attendre, la transmission des noms non.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc12', date:'2026-07-27', heure:'', source:'', evenement:"Patricia Benastre vient en renfort d'Anne Latisnère sur la collecte de matériel médical : elle prend le phoning auprès des pharmaciens du territoire.", suite:"Renfort inscrit sur la mission dans « Missions & organigramme ». Consigner les retours des pharmaciens dans le registre des donateurs.", qui:'Patricia Benastre', auteur:'Eva Poulmarch', quand:''},
    {id:'mc11', date:'2026-07-27', heure:'15:30', source:'', evenement:"Envoi d'un appel à volontaires pour participer à la logistique de la collecte de dons à la Foire Expo de Pau : réception, tri et conditionnement du matériel donné. Diffusé par WhatsApp aux professionnels de santé du territoire, sous la signature d'Eva Poulmarch. Premier appel à volontaires lancé en propre par la CPTS Pau Béarn, et sur de la logistique, non du soin : distinct des appels à renfort officiels qu'elle se contente de relayer.", suite:"Recenser les réponses dans « Volontaires ». Préciser les créneaux, qui encadre sur place et la couverture assurantielle avant d'affecter qui que ce soit. Aucun canal de retour n'a été indiqué dans le message : à corriger dans le suivant.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc10', date:'2026-07-27', heure:'15:00', source:'ARS Nouvelle-Aquitaine', evenement:"Réunion de crise de l'ARS en visioconférence à 15h : la CPTS Pau Béarn y assiste. Eva Poulmarch en a la charge et y représente la CPTS.", suite:"Consigner le compte rendu dans « Échanges avec l'ARS » et ici à l'issue de la séance, et en tirer ce qui appelle une décision du copil.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc9', date:'2026-07-27', heure:'14:30', source:'', evenement:"Ouverture de la collecte de matériel médical et diffusion de l'appel aux professionnels de santé du territoire, canal par canal et profession par profession — pharmaciens en particulier. Liste fermée : lecteurs d'hémoglucotest, tensiomètres, thermomètres, saturomètres, auxquels s'ajoutent les stéthoscopes. Recueil des déclarations par un Google Forms, le formulaire hébergé avec le cockpit ayant déclenché un avertissement « site non sécurisé » chez une partie des destinataires. Appel diffusé par WhatsApp sous la signature d'Eva Poulmarch, demande faite de déclarer le matériel pouvant être donné. La liste demandée reprend exactement le besoin exprimé par le centre d'accueil du parc des expositions de Bordeaux (fiche « Besoins en matériel »).", suite:"Reporter à la main les réponses du Google Forms dans le registre des donateurs. Ne rien accepter au-delà de la liste. Aucun enlèvement sans point de livraison nommé.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc8', date:'2026-07-27', heure:'', source:'', evenement:"Premier lieu de stockage proposé pour la collecte : l'agence ADHAP, 29 rue Carrerot à Pau, référente Anne Tarascon (06 83 24 07 60). Ouvert 8h30-19h ; le mercredi 9h-18h, l'accueil de l'agence prend le relais en son absence.", suite:"Renseigner la capacité de stockage, l'accès (plain-pied, véhicule) et la ligne fixe de l'agence avant d'annoncer ce point de dépôt aux professionnels.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},
    {id:'mc7', date:'2026-07-27', heure:'10:30', source:"CPTS des zones touchées", evenement:"Appels aux CPTS des zones touchées. Nord Bassin Océan (10h43) : évacuation en cours, commande de masques pour les PDS, aucune demande particulière. Ouest Gironde (10h37, Dr Decroix, pilote SSE) : aucune demande des administrés, FFP2 reçus et distribués par les pharmaciens, transferts de patients élargis faute de place en Gironde, Landes et Dordogne. Sud Bassin Val de l'Eyre (10h55 puis rappel à 14h54) : aucun besoin matériel, situation gérée, pharmaciens et prestataires sur le pont.", suite:"Aucun besoin matériel exprimé à ce stade par les CPTS jointes. Envoyer le mail de contact à Nord Bassin Océan, rappeler Sud Bassin, et joindre Terre de Médoc et les CPTS landaises.", qui:'Eva Poulmarch', auteur:'Eva Poulmarch', quand:''},

   PERSISTANCE

   Trois situations, dans cet ordre de préférence :

   1. Cockpit servi par l'hébergement — api.php répond. L'état
      est partagé : tout le copil voit les mêmes données.
   2. Cockpit ouvert dans Claude — window.storage existe.
   3. Fichier ouvert ailleurs — stockage du navigateur, propre
      à l'appareil.

   Le stockage du navigateur est alimenté dans tous les cas :
   il sert de filet si le serveur devient injoignable.
   ========================================================= */

const RUBRIQUES = Object.keys(etatInitial);
let instantane = {};   // état des rubriques au dernier échange avec le serveur
function copie(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function empreinteDe(k){ try{ return JSON.stringify(etat[k]); }catch(e){ return ''; } }
function rubriquesModifiees(){ return RUBRIQUES.filter(k => empreinteDe(k) !== empreinte[k]); }
function marquerSynchronise(){
  RUBRIQUES.forEach(k => { empreinte[k] = empreinteDe(k); instantane[k] = copie(etat[k]); });
}

/* Deux personnes qui travaillent sur la même rubrique — deux
   membres appelant deux CPTS différentes, typiquement — ne
   doivent pas s'écraser. On repart donc de la version du
   serveur et on n'y réapplique que les fiches réellement
   touchées de notre côté, repérées par leur identifiant. */
function fusionner(base, mien, serveur){
  /* Un dictionnaire — le carnet de coordonnées — se fusionne par clé :
     ce qu'on a soi-même touché l'emporte, le reste du serveur est
     conservé. Sans ça, deux personnes qui renseignent deux numéros en
     même temps s'effacent l'une l'autre. */
  const dico = o => o && typeof o === 'object' && !Array.isArray(o);
  if(dico(base) && dico(mien) && dico(serveur)){
    const r = Object.assign({}, serveur);
    Object.keys(mien).forEach(c => {
      if(!(c in r) || JSON.stringify(base[c]) !== JSON.stringify(mien[c])) r[c] = mien[c];
    });
    return r;
  }

  const tableauIdentifie = a => Array.isArray(a) && a.every(x => x && typeof x === 'object' && x.id !== undefined);
  if(!tableauIdentifie(base) || !tableauIdentifie(mien) || !tableauIdentifie(serveur)) return mien;

  const avant = new Map(base.map(x => [x.id, x]));
  const apres = new Map(mien.map(x => [x.id, x]));
  const resultat = copie(serveur);

  apres.forEach((fiche, id) => {
    const initiale = avant.get(id);
    if(initiale && JSON.stringify(initiale) === JSON.stringify(fiche)) return;  // intacte chez nous
    const i = resultat.findIndex(x => x.id === id);
    if(i >= 0) resultat[i] = fiche; else resultat.push(fiche);
  });

  const supprimees = [...avant.keys()].filter(id => !apres.has(id));
  return resultat.filter(x => supprimees.indexOf(x.id) === -1);
}

async function appelApi(methode, corps){
  const opts = { method: methode, headers: { 'X-Code-Acces': codeAcces } };
  if(corps){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(corps);
  }
  const r = await fetch(API, opts);
  let d = null;
  try{ d = await r.json(); }catch(e){}
  return { ok: r.ok, statut: r.status, corps: d };
}

  versionServeur = d && d.version ? d.version : 0;

  /* Le carnet de coordonnées ne se remplace pas, il se complète.

     la relève, et repart au prochain enregistrement : c'est ce qui
     manquait quand les numéros des pilotes disparaissaient. En cas de
     saisie concurrente sur la même personne, le serveur l'emporte. */
  normaliserPersonnes();
  const carnetLocal = etat.personnes;

  for(const k in etatInitial){ if(src[k] !== undefined) etat[k] = src[k]; }
  fusionnerNouveautes();
  normaliserPersonnes();

  const aDeposer = Object.keys(carnetLocal).filter(c => !etat.personnes[c]);
  etat.personnes = Object.assign({}, carnetLocal, etat.personnes);
  marquerSynchronise();
  /* Ce que le serveur ignore encore doit repartir : on marque la
     rubrique comme à envoyer plutôt que comme synchronisée. */
  if(aDeposer.length) empreinte.personnes = null;
}

/* Renvoie 'ok', 'code' (code d'accès à fournir) ou 'absent'
   (pas d'hébergement en face : on reste en local). */
async function joindreServeur(){
  try{
    const r = await appelApi('GET');
    if(r.statut === 401) return 'code';
    if(!r.ok || !r.corps) return 'absent';
    appliquerDistant(r.corps);
    return 'ok';
  }catch(e){ return 'absent'; }
}

async function charger(){
  try{
    const p = await window.storage.get('cpts_identite', false);
    if(p && p.value) dernierNom = p.value;
  }catch(e){}
  try{
    const c = localStorage.getItem('cpts64_code');
    if(c) codeAcces = c;
  }catch(e){}

  const etatLocal = await lireLocal();
  let issue = await joindreServeur();

  if(issue === 'code'){
    majBandeau(); rendre();
    return demanderCode();
  }
  if(issue === 'ok'){
    modeServeur = true;
    stockageActif = true;
    /* Serveur vierge : on l'amorce avec l'état de référence,
       appels aux CPTS compris. */
    if(versionServeur === 0){ empreinte = {}; await sauver(); }
    lancerSondage();
  }else{
    if(etatLocal){
      if(Array.isArray(etatLocal.diffusions)) diffusionsHeritees = etatLocal.diffusions;
      for(const k in etatInitial){ if(etatLocal[k] !== undefined) etat[k] = etatLocal[k]; }
    }
    fusionnerNouveautes();
    normaliserPersonnes();
    marquerSynchronise();
    stockageActif = true;
  }
  majBandeau(); rendre();
  demanderIdentite(true);
}

async function lireLocal(){
  try{
    const r = await window.storage.get(CLE, true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return null;
}

function demanderCode(){
  verrouModale = true;
  document.getElementById('modale').innerHTML = `<h3>Code d'accès</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Ce cockpit contient des coordonnées de professionnels de santé et le détail des échanges de crise. Le code vous a été communiqué par la coordination.</p>
    <label><span class="k">Code</span><input id="in-code" type="password" placeholder="Code d'accès" onkeydown="if(event.key==='Enter')validerCode()"></label>
    <div class="actions"><button class="btn" onclick="validerCode()">Entrer</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('in-code'); if(i) i.focus(); }, 60);
}
async function validerCode(){
  const v = document.getElementById('in-code').value.trim();
  if(!v){ toast("Saisissez le code d'accès"); return; }
  codeAcces = v;
  const issue = await joindreServeur();
  if(issue === 'code'){ toast("Code d'accès incorrect"); return; }
  try{ localStorage.setItem('cpts64_code', v); }catch(e){}
  verrouModale = false;
  if(issue === 'ok'){
    modeServeur = true;
    if(versionServeur === 0){ empreinte = {}; await sauver(); }
    lancerSondage();
  }
  stockageActif = true;
  fermer(); majBandeau(); rendre();
  demanderIdentite(true);
}

/* Relève régulière des modifications des autres postes. On
   s'abstient pendant une saisie ou tant qu'il reste quelque
   chose à envoyer, pour ne rien écraser sous les doigts. */
function lancerSondage(){
  if(sondage) clearInterval(sondage);
  sondage = setInterval(async () => {
    if(!modeServeur) return;
    if(document.getElementById('rideau').classList.contains('on')) return;
    if(rubriquesModifiees().length) return;
    try{
      const r = await appelApi('GET');
      if(!r.ok || !r.corps) return;
      if((r.corps.version || 0) === versionServeur) return;
      appliquerDistant(r.corps);
      majBandeau(); rendre();
      toast("Cockpit actualisé — saisie de " + (r.corps.par || 'un membre du copil'));
    }catch(e){}
  }, 15000);
}

/* Les rubriques amorcées depuis l'état de référence. Une fiche
   n'y est ajoutée que si son identifiant est inconnu du cockpit
   et qu'elle n'a pas été retirée à la main : ce qui a été saisi
   par le copil n'est jamais touché. C'est par là qu'arrivent les
   éléments consignés hors ligne, au téléphone notamment. */
const SEEDS = ['missions','veille','ars','sources','rubriques','visios','lignes','offre','cpts','courante','terrain','materiel','stockage','points','contacts','referents','medecins','orientes','relais'];
function fusionnerNouveautes(){
  etat.retires = etat.retires || [];
  SEEDS.forEach(k => {
    if(!Array.isArray(etat[k]) || !Array.isArray(etatInitial[k])) return;
    const vus = new Set(etat[k].map(x => x.id));
    etatInitial[k].forEach(o => {
      if(!vus.has(o.id) && !etat.retires.includes(o.id)) etat[k].push(JSON.parse(JSON.stringify(o)));
    });
  });
  reverserDiffusions();
  completerVeille();
  corrigerRelaisRenfort();
}

/* La CPTS ne lançait aucun appel à volontaires en propre : c'était
   écrit noir sur blanc dans la fiche du relais de diffusion. Elle
   en lance un depuis l'ouverture de l'appel au renfort, et la
   phrase est devenue fausse. On la corrige une fois, et seulement
   si elle n'a pas déjà été réécrite à la main. */
const ANCIENNE_LIMITE_M5 = "On ne lance pas d'appel à volontaires en propre.";
function corrigerRelaisRenfort(){
  const m = (etat.missions||[]).find(x => x.id === 'm5');
  const ref = (etatInitial.missions||[]).find(x => x.id === 'm5');
  if(!m || !m.fiche || !ref || m.fiche.limite !== ANCIENNE_LIMITE_M5) return;
  m.fiche.limite = ref.fiche.limite;
}

/* « Ce qu'on a diffusé » faisait doublon avec la main courante et a été
   retiré du cockpit : tout ce qui partait de la CPTS se consigne
   désormais en main courante, comme le reste. Les messages qui y avaient
   été saisis sont repris ici : ceux déjà consignés en main courante
   (identifiants ci-dessous) n'y sont pas remis une seconde fois, les
   autres y sont reversés pour qu'aucune saisie ne parte avec l'onglet.
   La reprise se fait une fois : la fiche reversée porte un identifiant
   dérivé du sien, et n'est pas recréée si elle est déjà là ou si elle a
   été retirée à la main. */
let diffusionsHeritees = [];
const DIFF_DEJA_CONSIGNEES = ['d1','d2','d3','d4','d5','d6','d7','d8'];
function reverserDiffusions(){
  if(!diffusionsHeritees.length) return;
  etat.courante = etat.courante || [];
  etat.retires = etat.retires || [];
  const vus = new Set(etat.courante.map(o => o.id));
  diffusionsHeritees.forEach(d => {
    if(!d || !d.id || DIFF_DEJA_CONSIGNEES.includes(d.id)) return;
    const id = 'mcd-' + d.id;
    if(vus.has(id) || etat.retires.includes(id)) return;
    const detail = [
      d.canal       ? "Canal : " + d.canal : '',
      d.cible       ? "Destinataires : " + d.cible : '',
      d.portee      ? "Nombre de destinataires : " + d.portee : '',
      d.emetteur    ? "Émetteur : " + d.emetteur : '',
      d.valide      ? "Validé par : " + d.valide : '',
      d.demande     ? "Demande formulée : " + d.demande : '',
      d.retourCanal ? "Canal de retour indiqué : " + d.retourCanal : ''
    ].filter(Boolean).join(' · ');
    etat.courante.push({
      id, date: d.date || '', heure: d.heure || '', source: 'Diffusion',
      evenement: "Message diffusé — " + (d.objet || 'objet non renseigné') + (detail ? "\n" + detail : ''),
      suite: [d.retours ? "Retours reçus : " + d.retours : '', d.observation || ''].filter(Boolean).join(' '),
      auteur: d.auteur || '', quand: d.quand || ''
    });
    vus.add(id);
  });
}

/* Les fiches enregistrées avant l'arrivée du poste de veille n'ont
   ni rythme, ni impact, ni suite. On ne remplit que les champs
   absents — jamais ceux qui portent déjà une saisie du copil. */
function completerVeille(){
  const combler = (o, defauts) => {
    for(const c in defauts) if(o[c] === undefined || o[c] === null) o[c] = defauts[c];
  };
  const refSrc = new Map((etatInitial.sources||[]).map(o => [o.id, o]));
  (etat.sources||[]).forEach(o => {
    const r = refSrc.get(o.id);
    combler(o, {rythme: r ? r.rythme : 'Chaque tour', quoi: r ? r.quoi : ''});
    /* Le carnet était rangé par catégorie libre ; il l'est désormais
       par famille de canal. Les sources déjà enregistrées récupèrent
       leur famille et leur point de situation à la volée. */
    if(!o.famille) o.famille = r ? r.famille : familleDeCat(o.cat);
    if(o.point === undefined) o.point = r ? r.point : '';
  });
  const refV = new Map((etatInitial.veille||[]).map(o => [o.id, o]));
  (etat.veille||[]).forEach(o => {
    const r = refV.get(o.id);
    combler(o, {
      impact:    r ? r.impact    : 'contexte',
      suite:     r ? r.suite     : 'rien',
      suiteEtat: r ? r.suiteEtat : 'traite',
      suiteNote: r ? r.suiteNote : ''
    });
    if(o.rubrique === undefined) o.rubrique = r ? (r.rubrique || '') : '';
  });
  etat.rubriques = etat.rubriques || [];
  const refR = new Map((etatInitial.rubriques||[]).map(o => [o.id, o]));
  etat.rubriques.forEach(o => {
    const r = refR.get(o.id);
    combler(o, {quoi: r ? r.quoi : '', ou: r ? r.ou : '', etat:'', maj:'', par:''});
  });
}
/* Rattrapage des anciennes catégories saisies à la main. */
function familleDeCat(c){
  c = (c || '').toLowerCase();
  if(c.indexOf('ars') === 0 || c.indexOf('institutionnel') === 0) return "ARS et autorités sanitaires";
  if(c.indexOf('préfecture') === 0 || c.indexOf('prefecture') === 0) return 'Préfectures';
  if(c.indexOf('urps') === 0 || c.indexOf('ordre') === 0) return 'URPS et ordres';
  if(c.indexOf('environnement') === 0 || c.indexOf('météo') === 0) return 'Environnement et météo';
  if(c.indexOf('suivi') === 0 || c.indexOf('feu') === 0 || c.indexOf('incendie') === 0) return 'Suivi des incendies';
  if(c.indexOf('établissement') === 0 || c.indexOf('etablissement') === 0) return 'Établissements de santé';
  if(c.indexOf('collectivité') === 0 || c.indexOf('collectivite') === 0) return 'Collectivités';
  if(c.indexOf('presse') === 0 || c.indexOf('média') === 0) return 'Presse';
  return 'Autres canaux';
}

async function sauver(){
  etat.entete.maj = new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  majBandeau();

  /* Copie locale systématique : même en mode partagé, elle sert
     de filet si l'hébergement devient injoignable. */
  try{ await window.storage.set(CLE, JSON.stringify(etat), true); }catch(e){}

  if(modeServeur) return sauverServeur();
  if(!stockageActif) toast("Modification enregistrée dans cette session seulement");
  return 'local';
}

async function sauverServeur(reste){
  if(reste === undefined) reste = 4;
  const modifiees = rubriquesModifiees();
  if(!modifiees.length) return;

  const corps = { version: versionServeur, par: moi, donnees: {} };
  modifiees.forEach(k => corps.donnees[k] = etat[k]);

  let r;
  try{
    r = await appelApi('POST', corps);
  }catch(e){
    toast("Serveur injoignable — saisie conservée sur cet appareil");
    return 'local';
  }

  if(r.ok && r.corps){
    versionServeur = r.corps.version;
    marquerSynchronise();
    return 'ok';
  }

  /* Quelqu'un a enregistré entre-temps. On repart de sa version et
     on y réapplique nos seules modifications, fiche par fiche. */
  if(r.statut === 409 && r.corps && reste > 0){
    versionServeur = r.corps.version || 0;
    const src = r.corps.donnees || {};
    RUBRIQUES.forEach(k => {
      if(src[k] === undefined) return;
      etat[k] = modifiees.indexOf(k) === -1 ? src[k] : fusionner(instantane[k], etat[k], src[k]);
      instantane[k] = copie(src[k]);
    });
    RUBRIQUES.forEach(k => { empreinte[k] = modifiees.indexOf(k) === -1 ? empreinteDe(k) : null; });
    majBandeau(); rendre();
    return sauverServeur(reste - 1);
  }

  if(r.statut === 401){
    modeServeur = false;
    toast("Session expirée — code d'accès à ressaisir");
    demanderCode();
    return 'local';
  }
  toast("Enregistrement sur le serveur impossible — copie locale conservée");
  return 'local';
}

function editerEntete(){
  document.getElementById('modale').innerHTML = `<h3>État affiché en haut du cockpit</h3>
    <label style="margin-bottom:12px"><span class="k">Pastille — court</span><input id="en-niveau" value="${esc(etat.entete.niveau)}"></label>
    <label style="margin-bottom:12px"><span class="k">Phrase de situation</span><textarea id="en-phrase">${esc(etat.entete.phrase)}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerEntete()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerEntete(){
  etat.entete.niveau = document.getElementById('en-niveau').value.trim() || etat.entete.niveau;
  etat.entete.phrase = document.getElementById('en-phrase').value.trim();
  await sauver(); fermer(); majBandeau(); toast("État mis à jour");
}

function majBandeau(){
  document.getElementById('niveau').textContent = etat.entete.niveau;
  document.getElementById('phrase').textContent = etat.entete.phrase;
  document.getElementById('maj').textContent = etat.entete.maj ? 'Dernière saisie ' + etat.entete.maj : '';
  const etatSync = modeServeur
    ? 'Cockpit partagé — le copil voit vos saisies'
    : 'Enregistré sur cet appareil seulement';
  document.getElementById('identite').innerHTML =
    'Connecté·e comme ' + esc(moi) + '<br><span style="opacity:.7">' + etatSync + '</span>';
}

/* =========================================================
   OUTILS
   ========================================================= */
const ESPACES = {m1:'terrain', m2:'terrain', m3:'materiel', m4:'appels', m5:'courante', m6:'courante'};
const espaceDe = m => m.espace || ESPACES[m.id] || 'courante';
const nomEspace = id => (ONGLETS.find(o => o.id === id) || {}).nom || 'Main courante';
const cleP = n => (n||'').trim().toLowerCase();

function noterRetrait(id){
  etat.retires = etat.retires || [];
  if(!etat.retires.includes(id)) etat.retires.push(id);
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aujourdhui = () => new Date().toISOString().slice(0,10);
const maintenant = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function frdate(d){ if(!d) return '—'; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1] : d; }
/* Les listes se lisent en « 27/07 » ; une mention qui fait foi
   sur un bordereau porte l'année. */
function frdateL(d){ if(!d) return '—'; const p = String(d).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d; }

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove('on'), 2600);
}
let verrouModale = false;
/* Le recensement en ligne des généralistes s'ouvre en fenêtre :
   quand elle est ouverte, ses propres boutons la redessinent au
   lieu de redessiner la page qui est dessous. */
let modaleRecens = false;
/* Une question posée en fenêtre attend une réponse : si la fenêtre
   se referme autrement — Échap, clic à côté — c'est un renoncement,
   et celui qui attendait doit l'apprendre plutôt que rester en
   suspens. Voir demanderOuverture(). */
let repondreOuv = null;
function fermer(){
  if(verrouModale) return;
  if(repondreOuv){ const r = repondreOuv; repondreOuv = null; r(null); }
  modaleRecens = false;
  document.getElementById('rideau').classList.remove('on');
  document.getElementById('modale').classList.remove('large');
}
document.getElementById('rideau').addEventListener('click', e => { if(e.target.id === 'rideau') fermer(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fermer(); });

/* Le carnet de coordonnées est un dictionnaire, pas une liste :
   les fiches y sont rangées par nom. Or un objet vide part en JSON
   `{}` et revient du serveur en `[]` — PHP ne distingue pas les
   deux. Et une fois devenu tableau, il avale les numéros sans
   jamais les rendre : JSON.stringify ignore les clés nommées d'un
   tableau, si bien que la saisie disparaît au rafraîchissement
   suivant. On le remet donc en dictionnaire à chaque fois qu'il
   entre dans le cockpit. */
function normaliserPersonnes(){
  const p = etat.personnes;
  if(p && typeof p === 'object' && !Array.isArray(p)) return;
  const v = {};
  if(Array.isArray(p)) p.forEach(x => { if(x && x.nom) v[cleP(x.nom)] = x; });
  etat.personnes = v;
}

function coord(nom){
  normaliserPersonnes();
  return etat.personnes[cleP(nom)] || {};
}
function editerContact(nom){
  const c = coord(nom);
  document.getElementById('modale').innerHTML = `<h3>Contact de ${esc(nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Renseigné une fois, utilisable par tout le monde en un clic depuis l'organigramme.</p>
    <label><span class="k">Téléphone</span><input id="ct-tel" type="tel" value="${esc(c.tel||'')}" placeholder="06 12 34 56 78"></label>
    <label style="margin-top:12px"><span class="k">Mail</span><input id="ct-mail" type="email" value="${esc(c.mail||'')}" placeholder="prenom.nom@exemple.fr"></label>
    <div class="actions"><button class="btn" onclick="validerContact('${esc(nom).replace(/'/g,"\\'")}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerContact(nom){
  normaliserPersonnes();
  etat.personnes[cleP(nom)] = {
    nom: nom,
    tel: document.getElementById('ct-tel').value.trim(),
    mail: document.getElementById('ct-mail').value.trim()
  };
  /* Ce carnet a déjà été perdu une fois : on force son envoi au lieu
     de s'en remettre à la détection de changement, et on dit ce qui
     s'est réellement passé plutôt qu'un « enregistré » de principe. */
  empreinte.personnes = null;
  const issue = await sauver();
  fermer(); rendre();
  toast(issue === 'ok' ? "Contact enregistré et partagé avec le copil"
                       : "Contact conservé sur cet appareil — le serveur n'a pas répondu");
}

/* Toute personne dont le nom figure déjà dans le cockpit : l'équipe de
   gestion de crise, les pilotes, suppléants et renforts des missions,
   mais aussi les auteurs d'un appel ou d'une saisie. C'est la liste
   proposée en un clic à l'ouverture, et celle qu'on retrouve partout
   où il faut désigner quelqu'un — main courante comprise. */
function nomsMissionnes(){
  const v = new Map();
  /* Un même champ peut nommer deux personnes — « Anne Latisnère et Eva
     Poulmarch » quand une action a été portée à deux. Ce sont deux
     personnes distinctes : chacune entre dans la liste pour elle-même, et
     aucune paire ne s'y présente comme une identité à part entière. */
  const ajouter = n => (n||'').split(/\s*(?:,|;|&|\+|\bet\b)\s*/i).forEach(p => {
    const t = p.trim();
    if(t && t !== 'Anonyme') v.set(cleP(t), t);
  });
  (etat.referents||[]).forEach(r => ajouter(r.nom));
  etat.missions.forEach(m => {
    ajouter(m.pilote); ajouter(m.suppleant);
    (Array.isArray(m.renforts) ? m.renforts : []).forEach(r => ajouter(r.nom));
  });
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a => ajouter(a.par)));
  /* Un nom saisi à la main en main courante n'est plus à ressaisir la
     fois suivante : il entre dans la liste au même titre que les autres. */
  (etat.courante||[]).forEach(o => ajouter(o.qui));
  ['veille','ars'].forEach(k =>
    (etat[k]||[]).forEach(o => { ajouter(o.auteur); ajouter(o.modifiePar); }));
  return [...v.values()].sort((a,b)=>a.localeCompare(b,'fr'));
}

/* Passage obligé à chaque ouverture : rien n'est saisi sous « Anonyme ».
   En mode porte (ouverture du lien), la fenêtre ne peut pas être fermée
   sans avoir donné un nom. */
function demanderIdentite(porte){
  const m = document.getElementById('modale');
  const noms = nomsMissionnes();
  verrouModale = !!porte;
  let h = `<h3>Qui êtes-vous&nbsp;?</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Votre nom est associé à chacune de vos saisies. Il est demandé à chaque ouverture du cockpit, pour que tout ce qui est consigné reste traçable.</p>`;
  if(noms.length){
    h += `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà missionné·e ou déjà intervenu·e — un clic suffit&nbsp;:</p>
      <div class="choixnom">` + noms.map(n =>
      `<button onclick="choisirNom('${esc(n).replace(/'/g,"\\'")}')"${cleP(n)===cleP(dernierNom)?' style="border-color:var(--marque);font-weight:600"':''}>${esc(n)}</button>`).join('') + `</div>
      <p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Vous n'êtes pas dans cette liste&nbsp;?</p>`;
  }
  h += `<label><span class="k">Prénom et nom</span><input id="in-moi" value="${esc(moi === 'Anonyme' ? dernierNom : moi)}" placeholder="Prénom et nom" onkeydown="if(event.key==='Enter')validerIdentite()"></label>

function csvVal(v){ return '"' + String(v ?? '').replace(/"/g,'""') + '"'; }
function telechargerCSV(nom, rows){
  const txt = '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');
  const b = new Blob([txt], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = nom.toLowerCase().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'') + '-' + aujourdhui() + '.csv';
  a.click();
  toast("Fichier téléchargé");
}
function exporterCSV(k){
  const cfg = CHAMPS[k];
  const ch   = champsSaisie(cfg.f);
  const cols = ['date', ...ch.map(f => f.c), 'auteur', 'modifiePar'];
  const ent  = ['Date', ...ch.map(f => f.l), 'Saisi par', 'Modifié par'];
  const lig  = chrono(k, etat[k]).map(o => cols.map(c => csvVal(o[c])));
  telechargerCSV(cfg.titre, [ent.map(csvVal), ...lig]);
}
function exporterTout(){
  const rows = [['Onglet','Date','Heure','Nature','Contenu','Détail','Par'].map(csvVal)];
  evenements().forEach(e => rows.push([e.type, e.date, e.heure, e.type, e.titre, e.detail, e.qui].map(csvVal)));
  telechargerCSV('Traçabilité complète', rows);
}

function importer(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(Array.isArray(d.diffusions)) diffusionsHeritees = d.diffusions;
      for(const k in etatInitial){ if(d[k] !== undefined) etat[k] = d[k]; }
      fusionnerNouveautes();
      await sauver(); rendre(); toast("Données importées");
    }catch(e){ toast("Fichier illisible"); }
  };
  r.readAsText(f); ev.target.value = '';
}
