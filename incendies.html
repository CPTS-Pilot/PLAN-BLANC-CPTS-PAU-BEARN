  ${!vivier.length ? `<div class="note"><strong style="color:var(--ambre)">Aucun médecin volontaire n'est encore recensé.</strong> La demande peut être enregistrée — elle ne pourra pas être fléchée tant que le vivier est vide. Ouvrez le recensement depuis le feuillet <a href="#" onclick="allerFeuilletOri('medecins');return false;">Médecins volontaires</a>.</div>` : ''}`;
}

/* Voie 2 — la personne a déjà un médecin. Rien à chercher : on
   enregistre pour que le compte des situations absorbées soit
   juste, et pour savoir vers qui elles sont parties. */
function formulaireDejaOriente(rel, vivier){
  return `<button class="retour-f" onclick="choisirVoie('choix')">‹ Ce n'est pas ça — revenir au choix</button>

  <div class="carte">
    <h2>Patient déjà orienté</h2>
    <p class="sous-f" style="margin:0 0 4px">Cette personne a déjà un médecin : la ligne entre au registre au statut « Orienté », et ne remonte pas dans ce qui attend un créneau.</p>

    ${blocPatient()}

    <div class="sous-t">L'orientation
      <span class="d">Vers qui elle est partie, et quand.</span></div>
    <div class="form">
      <label class="large"><span class="k">Motif *</span>
        <input id="rc-motif" placeholder="Ce pour quoi elle consulte, en une ligne" autocomplete="off">
        ${pastilles('rc-motif', MOTIFS_SUGGERES)}</label>
      <label class="large"><span class="k">Médecin vers qui elle est orientée *</span>
        <input id="rc-medecin" list="rc-medecin-l" placeholder="Nom du médecin, même hors vivier" autocomplete="off">
        <datalist id="rc-medecin-l">${vivier.map(m => `<option value="${esc(nomMed(m))}"></option>`).join('')}</datalist></label>
      <label><span class="k">Date de l'orientation</span>
        <input type="date" id="rc-orientele" value="${aujourdhui()}"></label>
      <label><span class="k">Situation du patient</span>
        <select id="rc-situation">${ORI_SITUATIONS.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label class="large"><span class="k">Précisions supplémentaires</span>
        <textarea id="rc-detail" placeholder="Ce qu'il faut savoir sur cette orientation : qui l'a organisée, ce qui reste à faire…"></textarea></label>
    </div>

    ${blocDeclarant(rel)}

    ${blocSignature('rc-par', 'Recueilli par')}

    <div class="actions">
      <button class="btn" onclick="enregistrerRecueil()">Enregistrer ce patient</button>
      <button class="btn sec" onclick="choisirVoie('')">Annuler</button>
    </div>
  </div>`;
}

/* La structure qui signale entre d'elle-même au registre des
   relais : c'est elle qui a fait remonter l'information, elle a
   donc sa place dans la liste, avec le compte de ses appels.
   Si elle y est déjà, on ne touche à rien d'autre que la marque
   « a signalé des patients ». */
function assurerRelais(nom, provenance, commune){
  const n = String(nom||'').trim();
  if(!n) return;
  etat.relais = etat.relais || [];
  const dejaLa = etat.relais.find(r => cleRelais(r.structure) === cleRelais(n));
  if(dejaLa){
    if(!dejaLa.info || dejaLa.info === 'À informer') dejaLa.info = 'A signalé des patients';
    return;
  }
  const type = RELAIS_TYPES.indexOf(provenance) >= 0 ? provenance : '';
  etat.relais.unshift({
    id: uid(), date: aujourdhui(), structure: n, type: type, commune: String(commune||'').trim(),
    adresse:'', interlocuteur:'', tel:'', mail:'',
    info:'A signalé des patients', infoLe:'', canal:'Téléphone',
    liste:'Non', demarche:'À solliciter', par: moi === 'Anonyme' ? '' : moi,
    note:"Entrée automatiquement au registre en signalant un patient.",
    auteur: moi, quand: new Date().toISOString()
  });
}

async function enregistrerRecueil(){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const manque = (id, message) => { toast(message); document.getElementById(id)?.focus(); };
  const deja = voieRecueil === 'oriente';

  const nom = v('rc-nom'), motif = v('rc-motif'), medecin = deja ? v('rc-medecin') : '';
  if(!nom)   return manque('rc-nom', "Indiquez au moins le nom du patient");
  if(!motif) return manque('rc-motif', "Indiquez le motif — touchez une proposition ou écrivez-le");
  if(deja && !medecin) return manque('rc-medecin', "Indiquez le médecin vers qui le patient est orienté");

  const relais = v('rc-relais');
  /* L'identité saisie compose la référence qui circule ailleurs
     dans le cockpit — agenda, exports, main courante — pour que
     les lignes d'avant et celles d'après se lisent pareil. */
  const fiche = {
    id: uid(), voie: voieRecueil, date: aujourdhui(), heure: maintenant(),
    nom: nom, prenom: v('rc-prenom'), age: v('rc-age'), tel: v('rc-tel'), adresse: v('rc-adresse'),
    commune: v('rc-commune'), situation: v('rc-situation'),
    motif: motif, detail: v('rc-detail'),
    urgence: deja ? '' : v('rc-urgence'), delai: deja ? '' : v('rc-delai'),
    provenance: v('rc-provenance'), relais: relais,
    decPrenom: v('rc-dec-prenom'), decNom: v('rc-dec-nom'), profession: v('rc-dec-prof'),
    accord: deja ? 'Sans objet' : (document.getElementById('rc-accord')?.checked ? 'Oui' : 'À recueillir'),
    medecin: medecin, orienteLe: deja ? (v('rc-orientele') || aujourdhui()) : '',
    circuit:'', rdvle:'', ref:'',
    /* Le nom de la session signe la ligne, sauf si l'on a saisi
       pour quelqu'un d'autre : c'est alors ce nom-là qui reste. */
    par: v('rc-par') || (moi === 'Anonyme' ? '' : moi),
    statut: deja ? 'Orienté' : 'À orienter',
    note:'', auteur: moi, quand: new Date().toISOString()
  };
  if(deja){
    fiche.orienteH = maintenant();
    fiche.orientePar = fiche.par;
  }
  fiche.ref = refPatient(fiche);
  /* Le nom de la personne qui déclare tient aussi lieu
     d'interlocuteur : c'est elle qu'on rappelle. */
  fiche.interlocuteur = nomDeclarant(fiche);
  if(deja && !(etat.medecins||[]).some(m => nomMed(m) === medecin)) fiche.horsVivier = true;

  etat.orientes = etat.orientes || [];
  etat.orientes.unshift(fiche);
  if(relais) assurerRelais(relais, fiche.provenance, fiche.commune);

  await sauver();
  voieRecueil = '';
  feuilletOri = 'patients';
  rendre(); window.scrollTo(0,0);
  toast(deja ? `${fiche.ref} enregistré — déjà orienté vers ${medecin}`
             : `${fiche.ref} enregistré — reste à lui trouver un médecin`);
}

/* --- le vivier ------------------------------------------
   Une fiche par médecin, lisible au téléphone : le numéro
   par lequel on prend rendez-vous, ce qu'il accepte de
   prendre, à quel rythme, et s'il autorise la diffusion de
   ses coordonnées aux pharmacies. */
function feuilletMedecins(med, vivier, diffusables, ori){
  const ordre = {'Volontaire':0, 'Sous conditions':1, 'Sollicité':2, 'À solliciter':3,
                 'Sans réponse':4, 'Indisponible':5};
  const tri = [...med].sort((a,b) => (ordre[a.statut] ?? 3) - (ordre[b.statut] ?? 3)
    || nomMed(a).localeCompare(nomMed(b), 'fr'));
  const parFormulaire = med.filter(m => m.source === 'formulaire').length;
  const communes = new Set(vivier.map(m => (m.commune||'').trim()).filter(Boolean));
  const aConfirmer = med.filter(m => m.source === 'formulaire' && m.aVerifier).length;

  /* Trois chiffres, pas neuf : combien on en a sondé, combien
     acceptent, sur combien de communes. Le reste appartient aux
     autres feuillets. */
  let h = `<div class="compteurs" style="margin-bottom:14px">
    <div class="compteur"><div class="n">${med.length}</div><div class="l">médecins sondés</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${vivier.length}</div><div class="l">acceptent de recevoir</div></div>
    <div class="compteur"><div class="n">${communes.size}</div><div class="l">commune${communes.size>1?'s':''} couverte${communes.size>1?'s':''}</div></div>
  </div>
  <div class="barre-h">
    <span class="cpt-h">${med.length} médecin${med.length>1?'s':''} au registre${parFormulaire ? ` · ${parFormulaire} par le formulaire` : ''}</span>
    <button class="btn sec" onclick="ouvrirRecensement()">Recensement en ligne${(etat.consultations||{}).ouverte ? ' — ouvert' : ''}${aConfirmer ? ` · ${aConfirmer} à confirmer` : ''}</button>
    <button class="btn sec" onclick="exporterCSV('medecins')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('medecins')">Ajouter un médecin</button>
  </div>`;

  if(!med.length) return h + `<div class="carte"><p class="vide">Aucun médecin sondé. Le vivier se remplit de deux façons : par le formulaire en ligne une fois le recensement ouvert, ou en appelant les généralistes du territoire un par un — bouton « Ajouter un médecin ».</p></div>`;

  /* La carte du registre entier, statut par statut : elle montre
     autant les communes couvertes que les trous entre elles. */
  const ptsMed = pointsMedecins(med);
  h += blocCarte('carte-medecins', ptsMed, {
    titre:"Cartographie des médecins du territoire",
    sous:"Chaque cabinet dont l'adresse est renseignée se pose ici en point, coloré par la réponse du médecin. Les trous entre les points sont les communes qu'il reste à couvrir.",
    compte:'cabinets situés',
    legende:[{c:CARTO_TEINTES['Volontaire'],   l:'Accepte de recevoir'},
             {c:CARTO_TEINTES['Sollicité'],    l:'Sollicité, sans réponse ferme'},
             {c:CARTO_TEINTES['À solliciter'], l:'Pas encore sollicité'},
             {c:CARTO_TEINTES['Indisponible'], l:'A répondu non'}],
    alerte: alerteMedecins(ptsMed),
    source:"Seules les adresses professionnelles des médecins sont transmises — aucune donnée de patient.",
    videSansPoint:"Aucune adresse renseignée pour l'instant. Une adresse portée sur une fiche se pose ici en point, toute seule.",
    videSansFiche:"Aucun médecin au registre : la carte se remplit à mesure que les fiches se créent."
  });

  /* Les réponses arrivées par le formulaire se filtrent à part :
     ce sont celles qu'il reste à confirmer au téléphone. */
  if(parFormulaire){
    const nb = r => r === 'Formulaire' ? parFormulaire
      : r === 'Tout' ? med.length
      : med.filter(m => (m.statut || 'À solliciter') === r).length;
    const filtres = ['Tout','Formulaire'].concat(MED_STATUTS.filter(s => nb(s)));
    h += `<div class="filtres">${filtres.map(r =>
      `<button class="${filtreMed===r?'on':''}" onclick="filtrerMed('${r}')">${r === 'Formulaire' ? 'Réponses au formulaire' : esc(r)}${r!=='Tout'?` <span style="opacity:.6">${nb(r)}</span>`:''}</button>`).join('')}</div>`;
  }
  const vus = filtreMed === 'Tout' || !parFormulaire ? tri
    : filtreMed === 'Formulaire' ? tri.filter(m => m.source === 'formulaire')
    : tri.filter(m => (m.statut || 'À solliciter') === filtreMed);
  if(!vus.length) return h + `<div class="carte"><p class="vide">Aucun médecin dans ce filtre.</p></div>`;

  h += `<div class="stocks">`;
  vus.forEach(o => {
    const st = o.statut || 'À solliciter';
    const cl = MED_OK.indexOf(st) >= 0 ? 'confirme' : st === 'Indisponible' ? 'ecarte' : '';
    const recus = ori.filter(x => x.medecin === nomMed(o)).length;
    const cren = creneauxGroupes(o);
    /* Rien de ce qui n'a pas été renseigné n'apparaît. Une fiche
       de trois lignes se lit en trois lignes : elle ne se remplit
       pas de phrases disant ce qui manque. */
    const lieu = [o.structure, o.commune].filter(Boolean).map(esc).join(' · ');
    /* Le bouton « Situer » ne s'affiche que si le point existe :
       sinon il promet une carte qui ne bougera pas. */
    const situe = o.geoCle && o.geoCle === cleGeo(o) && nombreOuNul(o.lat) !== null;
    /* Le vivier se consulte au téléphone, debout, pendant l'appel :
       le numéro compose, l'adresse ouvre l'application de cartes du
       téléphone. Rien à recopier à la main. */
    const liens = [
      o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>` : '',
      o.adresse ? `<a class="adr" href="${esc(lienCarte(o.adresse, o.commune))}" target="_blank" rel="noopener">Itinéraire — ${esc(o.adresse)}${o.commune && String(o.adresse).toLowerCase().indexOf(String(o.commune).toLowerCase()) < 0 ? ', ' + esc(o.commune) : ''}</a>` : ''
    ].filter(Boolean).join('');

    h += `<div class="stock ${cl}">
      <div class="tete-m">
        <div class="nom">${esc(nomMed(o))}${o.source === 'formulaire'
          ? `<span class="src-f">Formulaire</span>${o.aVerifier ? `<span class="src-f neuf">À confirmer</span>` : ''}`
          : o.source === 'saisie' ? `<span class="src-f saisie">Saisie à la main</span>` : ''}</div>
        ${lieu ? `<div class="lieu-m">${lieu}</div>` : ''}
        <div class="etiq-m"><span class="etiq ${MED_ET[st] || 'e-attente'}">${esc(st)}</span></div>
      </div>
      ${o.motifs ? `<div class="bl"><span class="k">Accepte de prendre</span><span class="borne">${esc(o.motifs)}</span></div>` : ''}
      ${o.capacite ? `<div class="bl"><span class="k">Nombre de patients</span>${esc(o.capacite)}</div>` : ''}
      ${cren.length
        ? `<div class="bl"><span class="k">Créneaux cochés sur le calendrier</span>
             <span class="agenda-l">${cren.map(c => `<span><b>${esc(c.jour)}</b> ${esc(c.parts.join(' et '))}</span>`).join('')}</span></div>`
        : o.creneaux ? `<div class="bl"><span class="k">Créneaux proposés</span><span class="horaires">${esc(o.creneaux)}</span></div>` : ''}
      ${o.delai ? `<div class="bl"><span class="k">Délai de rendez-vous</span>${esc(o.delai)}</div>` : ''}
      ${o.rdv ? `<div class="bl"><span class="k">Modalité d'appel</span>${esc(o.rdv)}</div>` : ''}
      ${o.mt && o.mt !== 'À préciser' ? `<div class="bl"><span class="k">Médecin traitant si besoin</span>${esc(o.mt)}</div>` : ''}
      ${o.conditions ? `<div class="obs">Conditions posées : ${esc(o.conditions)}</div>` : ''}
      ${o.diffusion === 'Oui' ? `<div class="bl"><span class="k">Diffusion de ses coordonnées</span>Acceptée</div>` : ''}
      ${o.diffusion === 'Non' ? `<div class="obs">Refuse que ses coordonnées soient diffusées : orienter uniquement par la CPTS.</div>` : ''}
      ${o.note ? `<div class="bl"><span class="k">Précisions</span>${esc(o.note)}</div>` : ''}
      ${recus ? `<div class="oriente">${recus} patient${recus>1?'s':''} orienté${recus>1?'s':''} vers ce médecin</div>` : ''}
      ${o.geoEchec && o.geoEchec === cleGeo(o) ? `<div class="obs">Adresse non retrouvée sur la carte : ce cabinet n'y figure pas. Vérifier l'orthographe de la rue et de la commune.</div>` : ''}
      ${liens ? `<div class="liens">${liens}</div>` : ''}
      <div class="pied-m">
        ${situe ? `<button class="retirer" onclick="situerMed('${o.id}')">Situer sur la carte</button>` : ''}
        <button class="retirer" onclick="ouvrirEdition('medecins','${o.id}')">Modifier</button>
        <button class="retirer sup" onclick="supprimer('medecins','${o.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

/* --- les patients ---------------------------------------
   Une ligne par demande reçue, de la remontée de la pharmacie
   au rendez-vous obtenu. Ce qui n'a pas encore de médecin
   remonte en tête : c'est ce qui reste à faire.

   Le registre grossit vite en crise : un tamis le précède —
   recherche sur le nom, période, statut, urgence, voie — et le
   tri se choisit. Rien de tout cela ne s'enregistre : c'est une
   manière de regarder à l'instant, pas une donnée de plus. */

/* Tout ce sur quoi la recherche mord : l'identité, le motif, qui
   signale, le médecin, la commune. */
const pailleOriente = o => [refPatient(o), o.nom, o.prenom, o.tel, o.adresse, o.commune, o.motif,
  o.detail, o.relais, nomDeclarant(o), o.profession, o.medecin, o.note, o.statut]
  .filter(Boolean).join(' ').toLowerCase();

function tamiserPatients(ori){
  const t = tamisPat;
  const q = t.q.trim().toLowerCase();
  /* Plusieurs mots : tous doivent être présents, dans n'importe
     quel ordre — « dupont pau » retrouve la ligne. */
  const mots = q ? q.split(/\s+/) : [];
  return ori.filter(o => {
    if(mots.length){ const p = pailleOriente(o); if(!mots.every(m => p.indexOf(m) >= 0)) return false; }
    const d = String(o.date || '');
    if(t.du && d < t.du) return false;
    if(t.au && d > t.au) return false;
    if(t.statut === 'Sans médecin'){ if(!enAttenteMed(o)) return false; }
    else if(t.statut !== 'Tout' && (o.statut || 'À orienter') !== t.statut) return false;
    if(t.urgence !== 'Tout' && (o.urgence || '') !== t.urgence) return false;
    if(t.voie !== 'Tout'){
      /* Les lignes d'avant la refonte n'ont pas de voie : elles se
         rangent d'après le fait qu'un médecin leur soit désigné. */
      const voie = o.voie || (estOriente(o) ? 'oriente' : 'consulter');
      if(voie !== t.voie) return false;
    }
    return true;
  });
}

const TRIS_PAT = {recent:"Plus récents d'abord", ancien:"Plus anciens d'abord",
  urgent:"Urgents et sans médecin d'abord", nom:'Nom du patient (A→Z)',
  statut:"Par statut d'avancement"};

function trierPatients(l){
  const horo = o => String(o.date || '') + 'T' + String(o.heure || '00:00');
  const rangStatut = {'À orienter':0,'Orienté':1,'Rendez-vous fixé':2,'Patient vu':3,'Sans suite':4};
  const copie = [...l];
  if(tamisPat.tri === 'ancien') return copie.sort((a,b) => horo(a).localeCompare(horo(b)));
  if(tamisPat.tri === 'nom')
    return copie.sort((a,b) => refPatient(a).localeCompare(refPatient(b), 'fr'));
  if(tamisPat.tri === 'statut')
    return copie.sort((a,b) => (rangStatut[a.statut] ?? 0) - (rangStatut[b.statut] ?? 0)
      || horo(b).localeCompare(horo(a)));
  if(tamisPat.tri === 'urgent'){
    /* Ce qui doit être regardé en premier : urgent et sans
       médecin, puis urgent, puis sans médecin, puis le reste. */
    const poids = o => (o.urgence === 'Urgent' ? 0 : 2) + (enAttenteMed(o) ? 0 : 1);
    return copie.sort((a,b) => poids(a) - poids(b) || horo(b).localeCompare(horo(a)));
  }
  return copie.sort((a,b) => horo(b).localeCompare(horo(a)));
}

/* Le tamis re-rend la page à chaque frappe : le champ touché
   reprend le curseur là où il était, sinon on ne peut pas taper
   un nom en entier. */
function majTamis(champ, valeur, focus){
  tamisPat[champ] = valeur;
  rendre();
  if(!focus) return;
  const el = document.getElementById(focus);
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
}
function viderTamis(){
  tamisPat = {q:'', du:'', au:'', statut:'Tout', urgence:'Tout', voie:'Tout', tri:'recent'};
  rendre();
}
/* Ouvrir les filtres fins ne re-rend que le tamis : le champ de
   recherche garde ce qu'on venait d'y taper. */
function basculerTamis(){ tamisOuvert = !tamisOuvert; rendre(); }
const tamisActif = () => tamisPat.q || tamisPat.du || tamisPat.au
  || tamisPat.statut !== 'Tout' || tamisPat.urgence !== 'Tout' || tamisPat.voie !== 'Tout';
/* Combien de filtres fins sont posés — la pastille du bouton
   « Affiner » le dit, pour qu'un registre tronqué ne passe jamais
   pour un registre complet. La recherche libre n'y compte pas :
   elle se voit dans son champ. */
const tamisFins = () => [tamisPat.du || tamisPat.au, tamisPat.statut !== 'Tout',
  tamisPat.urgence !== 'Tout', tamisPat.voie !== 'Tout'].filter(Boolean).length;

/* Une ligne, et rien de plus tant qu'on ne le demande pas : le
   champ de recherche, le tri, et le bouton qui déplie le reste.
   Le compte des lignes affichées ne s'écrit que si le tamis mord
   réellement sur le registre — sinon il répète la barre du haut. */
function barreTamis(ori, vus){
  const t = tamisPat;
  const sel = (l, v) => l.map(x => `<option value="${esc(x[0])}" ${x[0]===v?'selected':''}>${esc(x[1])}</option>`).join('');
  const statuts = [['Tout','Tous les statuts'],['Sans médecin','Sans médecin à ce jour']]
    .concat(ORI_STATUTS.map(s => [s, s]));
  const fins = tamisFins();
  return `<div class="tamis">
    <div class="rang">
      <input class="q" id="pat-q" value="${esc(t.q)}" placeholder="Rechercher un nom, un motif, une commune…"
        autocomplete="off" oninput="majTamis('q', this.value, 'pat-q')">
      <select class="tri" onchange="majTamis('tri', this.value)">${sel(Object.entries(TRIS_PAT), t.tri)}</select>
      <button class="plus${tamisOuvert || fins ? ' on' : ''}" onclick="basculerTamis()"
        title="Période, statut, urgence, voie">${tamisOuvert ? 'Replier' : 'Affiner'}${fins ? `<span class="n">${fins}</span>` : ''}</button>
    </div>
    ${tamisOuvert ? `<div class="fins">
      <label><span class="k">Signalés à partir du</span>
        <input type="date" value="${esc(t.du)}" onchange="majTamis('du', this.value)"></label>
      <label><span class="k">Jusqu'au</span>
        <input type="date" value="${esc(t.au)}" onchange="majTamis('au', this.value)"></label>
      <label><span class="k">Statut</span>
        <select onchange="majTamis('statut', this.value)">${sel(statuts, t.statut)}</select></label>
      <label><span class="k">Urgence</span>
        <select onchange="majTamis('urgence', this.value)">${sel([['Tout','Urgent et non urgent'],['Urgent','Urgent'],['Non urgent','Non urgent'],['','Non renseignée']], t.urgence)}</select></label>
      <label><span class="k">Voie</span>
        <select onchange="majTamis('voie', this.value)">${sel([['Tout','Signalés et orientés'],['consulter','À faire consulter'],['oriente','Déjà orientés']], t.voie)}</select></label>
    </div>` : ''}
    ${tamisActif() ? `<div class="pied">
      <span>${vus.length} sur ${ori.length} affiché${vus.length>1?'s':''}</span>
      <button onclick="viderTamis()">Tout afficher</button>
    </div>` : ''}
  </div>`;
}

/* Un seul feuillet pour les patients : le recueil y a fondu.
   Au repos, un bouton en tête et la liste dessous ; pendant un
   appel, le formulaire prend toute la place et la liste attend.
   Deux écrans qui se répondaient en devenaient un. */
/* La carte des personnes signalées : une par point, posée sur sa
   commune. La couleur dit où elle en est — ambre tant qu'elle
   attend un médecin, rouge si elle a été signalée urgente et
   attend encore, verte dès qu'un médecin lui est désigné, grise
   si la demande est close sans suite.

   Les cabinets volontaires viennent en surimpression sur demande,
   en anneaux : c'est ce qui répond à « qui est le plus près de
   cette personne ». Sans eux, la carte reste ce qu'elle est —
   l'état du registre étalé sur le territoire. */
function carteDesPatients(ori, vivier){
  const ptsMed = pointsMedecins(vivier)
    .map(p => Object.assign({}, p, {creux:true, second:true}));
  const pts = pointsPatients(ori, ptsMed);
  const tous = medSurCartePat ? pts.concat(ptsMed.filter(p => p.lat !== null)) : pts;
  const situables = ptsMed.filter(p => p.lat !== null).length;

  const outil = situables
    ? `<button class="plier${medSurCartePat ? ' on' : ''}" onclick="basculerMedSurPat()">${
        medSurCartePat ? 'Masquer les cabinets' : 'Situer les cabinets'}</button>`
    : '';

  return blocCarte('carte-patients', tous, {
    court:true, outil,
    titre:"Cartographie des patients signalés",
    sous:"Une personne, un point, posé sur sa commune. La couleur dit si elle attend encore un médecin ou si elle en a un. Touchez un point : le cabinet volontaire le plus proche s'y affiche, avec de quoi l'affecter.",
    compte:'personnes situées',
    legende:[{c:CARTO_PAT.urgent,  l:'Signalée urgente, sans médecin'},
             {c:CARTO_PAT.attente, l:'En attente d\'un médecin'},
             {c:CARTO_PAT.oriente, l:'Orientée vers un médecin'},
             {c:CARTO_PAT.clos,    l:'Sans suite'},
             {c:CARTO_TEINTES['Volontaire'], l:'Cabinet volontaire', creux:true}],
    alerte: alertePatients(pts),
    source:"Une personne est posée sur sa commune, jamais à son adresse : seul le nom de la commune sort du cockpit, ni identité ni rue.",
    videSansPoint:"Aucune commune renseignée pour l'instant. La commune saisie au recueil pose la personne sur la carte, toute seule.",
    videSansFiche:"Aucun patient signalé : la carte se remplit au premier appel d'une pharmacie ou d'une structure."
  });
}

function feuilletPatients(ori, vivier, rel){
  if(voieRecueil) return feuilletRecueil(rel || etat.relais || [], vivier);

  const attente = ori.filter(enAttenteMed);
  const orientes = ori.filter(estOriente).length;
  const urgents = ori.filter(o => o.urgence === 'Urgent' && enAttenteMed(o)).length;

  let h = `<div class="compteurs" style="margin-bottom:14px">
    <div class="compteur"><div class="n">${ori.length}</div><div class="l">patients signalés</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${orientes}</div><div class="l">patients orientés</div></div>
  </div>

  <div class="carte" style="margin-bottom:14px">
    <div class="actions" style="margin:0">
      <button class="btn" onclick="choisirVoie('choix')">Signaler un patient</button>
    </div>
    <p class="sous-f" style="margin:10px 0 0">Une saisie par personne. Si la pharmacie appelle pour trois patients, faites trois saisies : c'est ce qui permet de compter les personnes, et pas seulement les appels.</p>
  </div>

  ${carteDesPatients(ori, vivier)}

  <div class="barre-h">
    <span class="cpt-h">${ori.length} patient${ori.length>1?'s':''} au registre${attente.length ? ` · ${attente.length} sans médecin` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('orientes')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    ${ori.length ? `<button class="btn sec" onclick="anonymiserOrientes()">Anonymiser le registre</button>` : ''}
  </div>
  ${!vivier.length || urgents ? `<div class="note">${!vivier.length ? `<strong style="color:var(--ambre)">Aucun médecin volontaire n'est encore recensé :</strong> les demandes peuvent être enregistrées, elles ne pourront pas être orientées.` : ''}${urgents ? ` <strong style="color:var(--braise)">${urgents}</strong> demande${urgents>1?'s signalées urgentes attendent' : ' signalée urgente attend'} encore un médecin.` : ''}</div>` : ''}`;

  if(!ori.length) return h + `<div class="carte"><p class="vide">Aucun patient signalé. Le suivi s'ouvre au premier appel d'une pharmacie, d'une structure de soins non programmés ou de la personne elle-même — bouton « Signaler un patient » ci-dessus.</p></div>`;

  const retenus = tamiserPatients(ori);
  h += barreTamis(ori, retenus);
  if(!retenus.length) return h + `<div class="carte"><p class="vide">Aucune ligne ne répond à cette recherche. <a href="#" onclick="viderTamis();return false;">Tout afficher</a>.</p></div>`;

  /* Le classement manuel et les flèches qui vont avec n'ont de
     sens que sur le registre entier, dans son ordre naturel :
     dès qu'on tamise ou qu'on trie autrement, elles disparaissent
     plutôt que de déplacer une ligne au mauvais endroit. */
  const brut = !tamisActif() && tamisPat.tri === 'recent';
  const lignes = brut ? chrono('orientes', retenus) : trierPatients(retenus);
  const manuel = brut && estManuel('orientes');
  /* Le regroupement par jour ne veut plus rien dire quand le tri
     n'est pas chronologique. */
  const parJour = !manuel && (tamisPat.tri === 'recent' || tamisPat.tri === 'ancien');
  /* Les cartes vivent dans une grille, et la grille se referme à
     chaque changement de jour pour laisser passer l'intertitre :
     sans quoi le titre du jour se rangerait dans une colonne. */
  let jour = null, grille = false;
  const clore = () => { if(!grille) return ''; grille = false; return `</div>`; };
  lignes.forEach((o, i) => {
    if(parJour && o.date !== jour){
      jour = o.date;
      h += clore();
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }
    if(!grille){ h += `<div class="pats">`; grille = true; }
    h += carteDuPatient(o, i, lignes.length, brut, parJour);
  });
  return h + clore();
}

/* La carte d'un patient. Ce qu'on doit lire avant tout le reste :
   est-ce urgent, qui est-ce, pour quoi, et a-t-il un médecin.
   Le reste — situation, adresse, structure qui signale — descend
   en dessous, en petit. Une carte ne fait pas la largeur de
   l'écran : elle en fait le tiers, et trois situations se
   comparent d'un coup d'œil au lieu de se dérouler l'une après
   l'autre. */
function carteDuPatient(o, i, total, brut, parJour){
  const st = o.statut || 'À orienter';
  const oriente = estOriente(o);
  const urgent = o.urgence === 'Urgent';
  const attend = enAttenteMed(o);
  const clos = st === 'Sans suite';
  const classe = clos ? 'p-clos' : oriente ? 'p-oriente' : urgent ? 'p-urgent' : 'p-attente';
  const quand = parJour ? (o.heure ? hFr(o.heure) : '')
                        : [frdate(o.date), o.heure ? hFr(o.heure) : ''].filter(Boolean).join(' à ');
  const declarant = nomDeclarant(o);
  /* Ce qui situe la personne se lit sous son nom, sur une ligne :
     où elle est, et quand elle a été signalée. */
  const situe = [o.commune, quand].filter(Boolean).map(esc).join(' · ');

  /* Les précisions de second rang, en bas de carte. Le motif n'y
     est plus : il a son propre encadré, en tête. */
  const faits = [[o.situation,"Situation"], [o.adresse,"Adresse"],
                 [declarant && o.profession ? declarant + ' — ' + o.profession : declarant,"Signalé par"],
                 [o.relais || o.provenance,"Structure"]]
    .filter(x => x[0]).map(x => `<span><span class="k">${x[1]}</span>${esc(x[0])}</span>`).join('');

  /* Qui a fait quoi. Au recueil, la ligne est saisie — elle n'est
     pas encore orientée : c'est « Saisie par ». L'orientation ne
     s'écrit qu'une fois un médecin désigné, au nom de la personne
     qui l'a désigné, qui n'est pas forcément celle qui a saisi. */
  const saisiePar = o.par || o.auteur;
  const pied = [saisiePar ? 'Saisie par ' + saisiePar : '',
                oriente && o.orientePar ? 'Orientation par ' + o.orientePar : '',
                o.modifiePar ? 'Modifié par ' + o.modifiePar : '']
    .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

  const tel = String(o.tel || '').trim();

  return `<article class="fpat ${classe}">
    ${urgent && attend ? `<div class="cri">Urgent — sans médecin</div>` : ''}
    <div class="corps">
      <div class="tete">
        <div class="qui">
          <div class="nom">${esc(refPatient(o)) || 'Identité non précisée'}</div>
          ${situe ? `<div class="ou">${situe}</div>` : ''}
        </div>
        <span class="outils">
          ${brut ? fleches('orientes', o.id, i, total) : ''}
          <button title="Modifier la fiche" onclick="ouvrirEdition('orientes','${o.id}')">✎</button>
          <button title="Supprimer" onclick="supprimer('orientes','${o.id}')">×</button>
        </span>
      </div>

      <div class="etats">
        <span class="etiq ${ETIQ_REG[st] || 'e-attente'}">${esc(st)}</span>
        ${urgent && !attend ? `<span class="etiq e-bloque">Signalé urgent</span>` : ''}
        ${o.delai && o.delai !== 'À préciser' ? `<span class="etiq e-lancer">${esc(o.delai)}</span>` : ''}
      </div>

      ${o.motif ? `<div class="motif"><span class="k">Motif</span><div class="v">${esc(o.motif)}</div></div>` : ''}

      ${tel
        ? `<a class="tel" href="tel:${esc(tel.replace(/[^0-9+]/g,''))}">Appeler ${esc(tel)}</a>`
        : clos ? ''
        : `<div class="sans-tel">Aucun numéro au dossier — l'ajouter par ✎ pour pouvoir rappeler.</div>`}

      ${oriente
        ? `<div class="bl vers"><span class="k">Orienté vers</span><strong>${esc(o.medecin)}</strong>${
            o.horsVivier ? ' — hors vivier CPTS' : ''}${
            o.orienteLe ? `<span class="s">Affecté le ${esc(frdateL(o.orienteLe))}${o.orienteH ? ' à ' + esc(hFr(o.orienteH)) : ''}${o.orientePar ? ' par ' + esc(o.orientePar) : ''}</span>` : ''}</div>`
        : ''}
      ${o.rdvle ? `<div class="bl"><span class="k">Créneau</span>${esc(frdateL(o.rdvle))}${o.rdvh ? ' à ' + esc(hFr(o.rdvh)) : (o.rdvpart ? ' — ' + esc(PART_L[o.rdvpart] || o.rdvpart) : '')}${o.confirme ? ` · ${esc(o.confirme)}` : ''}</div>` : ''}
      ${o.detail ? `<div class="bl"><span class="k">Précisions</span>${esc(o.detail)}</div>` : ''}
      ${faits ? `<div class="faits">${faits}</div>` : ''}
      ${oriente && o.circuit ? `<div class="bl"><span class="k">Circuit suivi</span>${esc(o.circuit)}</div>` : ''}
      ${(o.accord || 'À recueillir') === 'À recueillir' && !clos
        ? `<div class="avert">Accord du patient à recueillir par la structure qui le reçoit avant que ses coordonnées ne circulent.</div>`
        : o.accord === 'Non'
          ? `<div class="avert">Accord refusé — aucune coordonnée ne doit circuler. Lui remettre le nom et le numéro du médecin, à lui d'appeler.</div>`
          : ''}
      ${o.note ? `<div class="bl"><span class="k">Observation</span>${esc(o.note)}</div>` : ''}
    </div>

    <div class="actes">
      <button class="btn${oriente ? ' sec' : ''}" onclick="ouvrirOrientation('${o.id}')">${oriente ? 'Changer le médecin' : 'Orienter le patient'}</button>
      <label><span class="k">Où en est-on</span>
        <select onchange="majPatient('${o.id}','statut', this.value)">
          ${ORI_STATUTS.map(s => `<option ${s === st ? 'selected' : ''}>${esc(s)}</option>`).join('')}
        </select></label>
    </div>
    ${pied ? `<div class="pied">${pied}</div>` : ''}
  </article>`;
}

/* Orienter un patient : le geste le plus fréquent du feuillet.
   Une fenêtre, la liste des médecins qui ont accepté de recevoir,
   un nom à toucher — et c'est fait. Le champ libre en dessous
   permet de désigner un médecin qui n'est pas au vivier, parce
   qu'on ne va pas bloquer une orientation faute d'avoir recensé
   quelqu'un.

   Ce qui est enregistré à ce moment-là, et qui compte au retour
   d'expérience : vers qui, quel jour, à quelle heure, et par qui.
   Le nom de la session est proposé, et reste modifiable — on
   saisit parfois pour quelqu'un d'autre. */
function ouvrirOrientation(id){
  const o = (etat.orientes||[]).find(x => x.id === id);
  if(!o) return toast("Ce patient n'est plus au registre");
  const vivier = (etat.medecins||[]).filter(m => MED_OK.indexOf(m.statut) >= 0);
  const noms = nomsMissionnes();

  /* Le vivier se range du plus proche au plus loin de la commune
     du patient, dès que les deux sont situés. C'est la seule
     question qu'on se pose au moment d'affecter : qui est à côté.
     Les cabinets qu'on n'a pas pu situer ferment la marche plutôt
     que de disparaître. */
  const range = vivier.map(m => ({m, km: distancePatMed(o, m)}));
  const classe = range.some(x => x.km !== null);
  if(classe) range.sort((a, b) => (a.km === null ? 1e9 : a.km) - (b.km === null ? 1e9 : b.km));

  document.getElementById('modale').innerHTML = `<h3>Orienter ${esc(refPatient(o) || 'ce patient')}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">${
      [o.motif, o.commune, o.urgence === 'Urgent' ? 'signalé urgent' : ''].filter(Boolean).map(esc).join(' · ') || 'Aucun détail au registre'}</p>

    ${vivier.length
      ? `<span class="k" style="display:block;margin-bottom:6px">Médecins volontaires — ${classe
           ? `du plus proche au plus loin de ${esc(o.commune || 'la commune du patient')}`
           : 'toucher un nom pour affecter'}</span>
         <div class="choix-pat">${range.map(({m, km}) => `
           <button onclick="affecterMedecin('${o.id}','${m.id}')">
             <span class="r">${esc(nomMed(m))}${km !== null ? `<span class="km">${esc(fmtKm(km))}</span>` : ''}${
               nomMed(m) === o.medecin ? `<span class="deja">déjà affecté</span>` : ''}</span>
             <span class="d">${[m.structure, m.commune, m.delai, m.tel].filter(Boolean).map(esc).join(' · ') || 'Coordonnées à compléter'}</span>
           </button>`).join('')}</div>
         ${classe ? `<p class="sous-f" style="margin:8px 0 0;font-size:12px">Distances à vol d'oiseau, de commune à cabinet : elles classent, elles ne disent pas le temps de route.</p>` : ''}`
      : `<p class="vide">Aucun médecin n'a encore accepté de recevoir. Vous pouvez tout de même saisir un nom ci-dessous.</p>`}

    <label style="margin-top:12px"><span class="k">Ou saisir un autre médecin</span>
      <input id="or-autre" placeholder="Nom du médecin, même hors vivier" autocomplete="off"
        onkeydown="if(event.key==='Enter')affecterMedecin('${o.id}','')"></label>

    <label style="margin-top:10px"><span class="k">Affecté par</span>
      <input id="or-par" list="or-par-l" value="${esc(moi === 'Anonyme' ? '' : moi)}" placeholder="Prénom et nom" autocomplete="off">
      <datalist id="or-par-l">${noms.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></label>

    <div class="actions">
      <button class="btn" onclick="affecterMedecin('${o.id}','')">Affecter ce médecin</button>
      ${estOriente(o) ? `<button class="btn sec" onclick="retirerMedecin('${o.id}')" style="color:var(--braise);border-color:#E8C3B8">Retirer l'orientation</button>` : ''}
      <button class="btn sec" onclick="fermer()" style="margin-left:auto">Annuler</button>
    </div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(() => { if(!vivier.length) document.getElementById('or-autre')?.focus(); }, 60);
}

/* `mid` vide : on prend le nom tapé dans le champ libre. */
async function affecterMedecin(id, mid){
  const o = (etat.orientes||[]).find(x => x.id === id); if(!o) return;
  const m = mid ? (etat.medecins||[]).find(x => x.id === mid) : null;
  const nom = m ? nomMed(m) : (document.getElementById('or-autre')?.value || '').trim();
  if(!nom){
    document.getElementById('or-autre')?.focus();
    return toast("Touchez un médecin de la liste, ou saisissez un nom");
  }
  const par = (document.getElementById('or-par')?.value || '').trim()
    || (moi === 'Anonyme' ? '' : moi);

  o.medecin = nom;
  /* On retient aussi l'identifiant : c'est par lui que l'agenda
     rattache le patient au créneau, et un nom peut se corriger. */
  o.medecinId = m ? m.id : '';
  o.horsVivier = !m;
  o.orienteLe = aujourdhui();
  o.orienteH = maintenant();
  o.orientePar = par;
  if(!o.par) o.par = par;
  if(!o.statut || o.statut === 'À orienter') o.statut = 'Orienté';
  o.modifiePar = moi;
  await sauver(); fermer(); rendre();
  toast(`${refPatient(o) || 'Patient'} orienté vers ${nom}`);
}

async function retirerMedecin(id){
  const o = (etat.orientes||[]).find(x => x.id === id); if(!o) return;
  o.medecin = ''; o.medecinId = ''; o.horsVivier = false;
  o.orienteLe = ''; o.orienteH = ''; o.orientePar = '';
  o.rdvle = ''; o.rdvpart = ''; o.rdvh = ''; o.confirme = '';
  if(o.statut === 'Orienté' || o.statut === 'Rendez-vous fixé') o.statut = 'À orienter';
  o.modifiePar = moi;
  await sauver(); fermer(); rendre();
  toast("Orientation retirée — le patient attend de nouveau un médecin");
}
async function majPatient(id, champ, valeur){
  const o = (etat.orientes||[]).find(x => x.id === id); if(!o) return;
  o[champ] = valeur;
  o.modifiePar = moi;
  await sauver(); rendre();
}

/* Une fois la crise passée, le registre n'a plus à porter de
   quoi remonter à quelqu'un : les compteurs suffisent au retour
   d'expérience et au bilan ACI. L'anonymisation efface l'identité
   du patient — nom, prénom, âge, adresse —, celle de la personne
   qui a déclaré, les précisions et les observations. Elle garde
   le reste : motif, commune, urgence, délai, médecin, dates.
   C'est la contrepartie du fait de nommer les gens pendant la
   crise, et elle est définitive : c'est le but. */
async function anonymiserOrientes(){
  const n = (etat.orientes || []).length;
  document.getElementById('modale').innerHTML = `<h3>Anonymiser le registre des patients&nbsp;?</h3>
    <p style="color:var(--texte-2)">Les ${n} ligne${n>1?'s':''} du registre perdront le nom, le prénom, l'âge, le numéro de téléphone et l'adresse du patient, le nom de la personne qui l'a déclaré, les précisions et les observations. Le reste est conservé : date, commune, motif, urgence, délai, médecin vers qui le patient a été orienté, statut. Les compteurs et le bilan ne bougent pas.</p>
    <p style="color:var(--braise)">L'opération est définitive et vaut pour tous les postes connectés. À faire une fois la crise passée, ou dès qu'une ligne n'a plus besoin d'être suivie.</p>
    <div class="actions"><button class="btn" onclick="confirmerAnonymisation()">Anonymiser</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function confirmerAnonymisation(){
  (etat.orientes || []).forEach((o, i) => {
    o.ref = 'Patient ' + (i + 1);
    o.nom = o.ref; o.prenom = ''; o.age = ''; o.tel = ''; o.adresse = '';
    o.decNom = ''; o.decPrenom = ''; o.interlocuteur = '';
    o.detail = ''; o.note = '';
    o.anonymise = new Date().toISOString();
  });
  await sauver(); fermer(); rendre();
  toast("Registre anonymisé — les compteurs sont conservés");
}

/* --- les structures qui orientent -----------------------
   Les points d'entrée. Deux choses s'y mesurent, et ce ne sont
   pas les mêmes : une pharmacie informée du circuit, et une
   pharmacie qui accepte d'entrer dans la démarche — repérer les
   personnes évacuées au comptoir, les signaler, leur remettre le
   nom d'un médecin. La seconde seule fait vivre le dispositif.

   On les recense comme on recense les médecins volontaires, et
   pour la même raison : une structure recensée ici est proposée
   d'elle-même dans le formulaire de signalement, il n'y a plus
   qu'à toucher son nom. Celles qui signalent sans avoir été
   recensées y entrent d'elles-mêmes, à la saisie. */
function feuilletRelais(rel, ori, diffusables){
  const ordre = {'Oui':0, 'En attente de réponse':1, 'À solliciter':2, 'Non':3};
  const tri = [...rel].sort((a,b) => (ordre[a.demarche] ?? 2) - (ordre[b.demarche] ?? 2)
    || (a.structure||'').localeCompare(b.structure||'', 'fr'));
  const aSolliciter = rel.filter(r => !r.demarche || r.demarche === 'À solliciter').length;
  const partenaires = rel.filter(r => r.demarche === 'Oui').length;
  const appels = o => ori.filter(x => cleRelais(x.relais) === cleRelais(o.structure));
  const signalants = new Set(ori.map(o => cleRelais(o.relais)).filter(Boolean)).size;

  let h = `<div class="compteurs" style="margin-bottom:14px">
    <div class="compteur"><div class="n" style="color:var(--stable)">${partenaires}</div><div class="l">structures entrées dans la démarche</div></div>
    <div class="compteur"><div class="n">${signalants}</div><div class="l">structures ayant signalé un patient</div></div>
  </div>
  <div class="barre-h">
    <span class="cpt-h">${rel.length} structure${rel.length>1?'s':''}${partenaires ? ` · ${partenaires} dans la démarche` : ''}</span>
    <button class="btn sec" onclick="exporterCSV('relais')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('relais')">Recenser une structure</button>
  </div>
  <div class="note">Ces structures reçoivent les patients avant nous : c'est par elles que le fléchage passe. Une structure recensée ici est <strong>proposée d'elle-même</strong> au moment de signaler un patient. Leur transmettre la liste des <strong>${diffusables}</strong> médecin${diffusables>1?'s':''} ayant accepté la diffusion de leurs coordonnées, et leur rappeler de <strong>signaler chaque personne orientée</strong> — c'est ce qui permet de compter.${aSolliciter ? ` <strong style="color:var(--ambre)">${aSolliciter}</strong> structure${aSolliciter>1?'s restent à solliciter':' reste à solliciter'}.` : ''}</div>`;

  if(!rel.length) return h + `<div class="carte"><p class="vide">Aucune structure recensée. Commencer par celles qui ont déjà appelé — le CMSI de Billère et les pharmacies qui l'ont sollicité — puis par celles du territoire susceptibles d'orienter : pharmacies, structures de soins non programmés, cabinets. Toute structure qui signale un patient depuis le feuillet <a href="#" onclick="ouvrirRecueil();return false;">Patients signalés / orientés</a> entre ici d'elle-même.</p></div>`;

  h += `<div class="stocks">`;
  tri.forEach(o => {
    const dem = o.demarche || 'À solliciter';
    const info = o.info || 'À informer';
    const cl = dem === 'Oui' ? 'confirme' : dem === 'Non' ? 'ecarte' : '';
    const siens = appels(o);
    const dernier = siens.map(x => x.date).filter(Boolean).sort().pop();
    h += `<div class="stock ${cl}">
      <div>
        <div class="nom">${esc(o.structure)}</div>
        <div style="font-size:13px;color:var(--texte-2);margin-top:2px">${[o.type, o.commune].filter(Boolean).map(esc).join(' · ') || 'Type et commune à préciser'}</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="etiq ${dem === 'Oui' ? 'e-cours' : dem === 'Non' ? 'e-fini' : 'e-attente'}">${dem === 'Oui' ? 'Dans la démarche' : dem === 'Non' ? "N'y entre pas" : dem}</span>
          <span class="etiq ${info === 'À informer' ? 'e-attente' : info === 'Sans réponse' ? 'e-fini' : 'e-lancer'}">${esc(info)}</span>
        </div>
      </div>
      ${o.interlocuteur ? `<div class="bl"><span class="k">Interlocuteur</span>${esc(o.interlocuteur)}</div>` : `<div class="obs">Interlocuteur à nommer.</div>`}
      ${o.infoLe ? `<div class="bl"><span class="k">Informée le</span>${frdateL(o.infoLe)}${o.canal ? ' · ' + esc(o.canal) : ''}</div>` : ''}
      ${o.liste === 'Oui'
        ? `<div class="bl"><span class="k">Liste des médecins</span>Transmise</div>`
        : o.liste === 'Sans objet' ? '' : `<div class="obs">Liste des médecins volontaires pas encore transmise.</div>`}
      ${o.note ? `<div class="obs">${esc(o.note)}</div>` : ''}
      ${siens.length
        ? `<div class="oriente">${siens.length} patient${siens.length>1?'s':''} signalé${siens.length>1?'s':''}${dernier ? `, le dernier le ${frdateL(dernier)}` : ''}
             <button class="retirer" style="margin-left:6px" onclick="allerFeuilletOri('patients')">Voir</button></div>`
        : ''}
      <div class="liens">
        ${o.tel ? `<a class="tel" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>` : ''}
        ${o.adresse ? `<a class="adr" href="${esc(lienCarte(o.adresse, o.commune))}" target="_blank" rel="noopener">Itinéraire — ${esc(o.adresse)}</a>` : ''}
      </div>
      <div style="display:flex;gap:7px">
        <button class="retirer" onclick="ouvrirEdition('relais','${o.id}')">Modifier</button>
        <button class="retirer" onclick="supprimer('relais','${o.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

const DOSSIER = ['ars','courante','terrain','materiel','dons','stockage','renforts','volontaires','medecins','orientes','relais','lieux'];

function tableauFige(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<p class="vide">Aucune ligne.</p>`;
  const ent = cfg.cols.map(c => c==='date' ? 'Date' : c==='auteur' ? 'Saisi par' : ((cfg.f.find(x=>x.c===c)||{}).l || c));
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}</tr></thead><tbody>`;
  lignes.forEach(l => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel' || c === 'rdvle' || c === 'infoLe' || c === 'apartir'
         || c === 'verifieLe') v = frdate(v);
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

function vueDossier(){
  let h = `<h1>Dossier de traçabilité</h1>
  <div style="font-family:var(--display);font-weight:600;font-size:16px;color:var(--encre);margin:-2px 0 6px">CPTS Pau Béarn</div>
  <p class="chapo">L'ensemble des éléments tracés par la CPTS Pau Béarn depuis le début de sa mobilisation dans le cadre du plan blanc régional / ORSAN AMAVI, mis bout à bout pour être imprimés ou enregistrés en PDF. C'est la pièce à joindre au retour d'expérience et au bilan.</p>
  <div class="barre-h">
    <button class="btn sec" onclick="exporterTout()">Tout en Excel</button>
    <button class="btn" onclick="imprimer()">Imprimer ou enregistrer en PDF</button>
  </div>
  <div class="carte"><h2>Organisation</h2>${organigramme() || '<p class="vide">Aucun pilote désigné.</p>'}</div>
  <div class="carte"><h2>Fiches mission</h2>` +
  etat.missions.map(m => {
    const f = m.fiche || {};
    const li = lignes(f.faire);
    return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--trait)">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(m.titre)}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 7px">Pilote : ${esc(m.pilote)||'à désigner'} · Suppléant : ${esc(m.suppleant)||'—'} · Mandat ARS : ${esc(m.mandat)} · ${esc(m.statut)}</div>
      ${f.but?`<div style="font-size:13.5px"><em>${esc(f.but)}</em></div>`:''}
      ${li.length?`<ul style="margin:6px 0 0;padding-left:19px;font-size:13.5px">${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${f.limite?`<div style="font-size:13px;color:var(--braise);margin-top:6px">Ce qu'on ne fait pas : ${esc(f.limite)}</div>`:''}
    </div>`;
  }).join('') + `</div>`;

  /* Les visios de crise de l'ARS ouvrent le dossier comme elles
     ouvrent la situation régionale : c'est la source à laquelle le
     retour d'expérience se réfèrera d'abord. */
  h += `<h2 style="margin-top:24px">Visios de crise de l'ARS</h2>`;
  const vs = visiosTriees();
  if(!vs.length) h += `<p class="vide">Aucune séance consignée.</p>`;
  vs.forEach(v => {
    h += `<div class="carte" style="margin-bottom:14px">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(v.instance || "Visio de crise de l'ARS")} — ${frdate(v.date)}${v.heure ? ' à ' + esc(v.heure) : ''}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 8px">${v.represente
        ? 'CPTS Pau Béarn représentée par ' + esc(v.represente) : 'Représentation de la CPTS non précisée'}</div>
      ${(v.points||[]).length
        ? `<ol style="margin:0;padding-left:19px;font-size:13.5px">${v.points.map(p =>
            `<li style="margin-bottom:5px"><strong>${esc(p.titre)}</strong>${p.texte ? ' — ' + esc(p.texte) : ''}</li>`).join('')}</ol>`
        : `<div style="font-size:13px;color:var(--braise)">${esc(v.manquant || "Compte rendu non consigné.")}</div>`}
      ${v.consignes ? `<div style="font-size:13.5px;margin-top:8px"><strong>Ce que l'ARS demande :</strong> ${esc(v.consignes)}</div>` : ''}
      ${v.pourNous ? `<div style="font-size:13.5px;margin-top:5px"><strong>Ce que ça change pour la CPTS :</strong> ${esc(v.pourNous)}</div>` : ''}
    </div>`;
  });

  DOSSIER.forEach(k => {
    h += `<h2 style="margin-top:24px">${esc(CHAMPS[k].titre)}</h2>${tableauFige(k)}`;
  });

  /* Les points de collecte ne sont pas une liste de fiches mais
     des permanences chiffrées : chacun est repris avec sa
     synthèse et son détail, comme dans son récapitulatif. */
  h += `<h2 style="margin-top:24px">Points de collecte tenus</h2>`;
  const pts = pointsTries();
  if(!pts.length) h += `<p class="vide">Aucun point de collecte tenu.</p>`;
  pts.forEach(p => {
    const s = synthesePoint(p);
    h += `<div class="carte" style="margin-bottom:14px">
      <div style="font-family:var(--display);font-weight:700;font-size:15px">${esc(p.lieu)} — ${frdateL(p.date)}</div>
      <div style="font-size:13px;color:var(--texte-2);margin:3px 0 9px">
        ${esc(p.statut||'Ouvert')} · créneau ${esc(p.debut||'—')} – ${esc(p.fin||'—')}${p.cloture ? ', clôturé à ' + esc(p.cloture) : ''} ·
        responsable : ${esc(p.responsable) || 'à nommer'}${p.destination ? ' · destination : ' + esc(p.destination) : ''}
      </div>
      <div style="font-size:13.5px;margin-bottom:8px"><strong>${s.unites} unités</strong> déposées par <strong>${s.deposants.length} déposants</strong> en ${s.lignes} lignes${p.colis ? ', ' + esc(p.colis) + ' colis' : ''}${
        s.parMat.length ? ' — ' + s.parMat.map(m => m.quantite + ' ' + esc(m.materiel.toLowerCase())).join(', ') : ''}.</div>
      ${p.acheminement ? `<div style="font-size:13px;color:var(--texte-2);margin-bottom:8px">Acheminement : ${esc(p.acheminement)}</div>` : ''}
      ${s.deposants.length ? `<div class="tw"><table><thead><tr><th>Déposant</th><th>Qualité</th><th>Matériel déposé</th></tr></thead><tbody>` +
        s.deposants.map(d => `<tr><td>${esc(d.deposant)}</td><td>${esc(d.qualite)||'—'}</td><td>${
          d.lignes.map(l => esc(l.materiel) + ' (' + qte(l) + ')').join(', ')}</td></tr>`).join('') + `</tbody></table></div>` : ''}
      ${p.observations ? `<div style="font-size:12.5px;color:var(--texte-2);margin-top:9px;white-space:pre-line">${esc(p.observations)}</div>` : ''}
      ${(p.pieces||[]).length ? `<div style="font-size:12.5px;color:var(--texte-2);margin-top:9px">Pièces jointes : ${
        p.pieces.map(x => esc(x.nom)).join(', ')}</div>` : ''}
    </div>`;
  });

  h += `<h2 style="margin-top:24px">Appels aux CPTS</h2><div class="tw"><table>
    <thead><tr><th>CPTS</th><th>Proximité</th><th>Statut</th><th>Date</th><th>Interlocuteur</th><th>Ce qui a été dit</th><th>Suite</th><th>Par</th></tr></thead><tbody>` +
    (etat.cpts||[]).map(c => {
      const a = antechrono(c.appels);
      if(!a.length) return `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td colspan="5">—</td></tr>`;
      return a.map(x => `<tr><td>${esc(c.nom)}</td><td>${esc(c.priorite)}</td><td>${esc(c.statut)}</td><td>${frdate(x.date)} ${esc(x.heure||'')}</td><td>${esc(x.qui)||'—'}</td><td>${esc(x.dit)}</td><td>${esc(x.suite)||'—'}</td><td>${esc(x.par)}</td></tr>`).join('');
    }).join('') + `</tbody></table></div>`;
  return h;
}

function vueCollection(k){
  const cfg = CHAMPS[k];
  const n = (etat[k] || []).length;
  const j = !!JOURNAL[k];
  /* Le compteur dit aussi ce qui remonte de la main courante :
     sinon il annonce deux entrées et la page en montre sept. */
  const mc = k === 'terrain' ? signalesEnCourante().length : 0;
  return `<h1>${cfg.titre}</h1><p class="chapo">${cfg.chapo}</p>
    <div class="barre-h"><span class="cpt-h">${n} ${j ? 'entrée' : 'ligne'}${n>1?'s':''}${j ? ' · de la plus récente à la plus ancienne' : ''}${mc ? ` · ${mc} signalé${mc>1?'s':''} en main courante` : ''}</span>
      <button class="btn sec" onclick="exporterCSV('${k}')">Excel</button>
      <button class="btn sec" onclick="imprimer()">PDF</button>
      <button class="btn" onclick="ouvrirAjout('${k}')">Ajouter</button></div>
    ${barreOrdre(k)}
    ${j ? journal(k) : tableau(k)}
    ${k === 'terrain' ? blocSignaleEnCourante() : ''}`;
}

/* --- ce que la main courante fait remonter ici -------------
   Une information venue du dehors est une remontée de terrain,
   qu'elle ait été saisie ici ou en main courante. Elle s'affiche
   donc dans les deux endroits — mais elle n'est écrite qu'une
   fois : rien n'est recopié, et on la modifie là où elle a été
   consignée. Ce qui la distingue tient à un seul champ : sa
   source. Une décision prise entre nous n'en a pas, et ne
   remonte donc pas ici. */
const signalesEnCourante = () =>
  (etat.courante || []).filter(o => String(o.source || '').trim());

function blocSignaleEnCourante(){
  const mc = antechrono(signalesEnCourante());
  if(!mc.length) return '';
  let h = `<div class="reg-jour" style="margin-top:30px"><span class="n">Signalé en main courante</span></div>
  <div class="note">Ces entrées de la <a href="#" onclick="aller('courante');return false;">main courante</a> portent une source extérieure : elles remontent ici d'elles-mêmes, sans y être recopiées, et se modifient dans la main courante. Une situation qui mérite d'être suivie pour elle-même — avec sa criticité, sa commune et le professionnel concerné — se reprend en remontée à part entière ci-dessus.</div>`;
  mc.forEach(o => {
    const quand = [frdate(o.date), o.heure].filter(Boolean).join(' à ');
    h += `<article class="ent-r mc dehors">
      <div class="haut">
        ${quand ? `<span class="hr">${esc(quand)}</span>` : ''}
        <span class="venu"><span class="p">Venu du dehors</span>${esc(o.source)}</span>
        <span class="outils">
          <button title="Modifier en main courante" onclick="ouvrirEdition('courante','${o.id}')">✎</button>
        </span>
      </div>
      <div class="ti">${esc(o.evenement) || '—'}</div>
      ${o.qui ? `<div class="chips"><span><span class="k">Pris en charge par</span>${esc(o.qui)}</span></div>` : ''}
      ${o.suite ? `<div class="bloc"><span class="k">Suite donnée</span><div class="v">${esc(o.suite)}</div></div>` : ''}
      <div class="pied"><span>Consigné en main courante</span>${o.auteur ? `<span>Saisi par ${esc(o.auteur)}</span>` : ''}</div>
    </article>`;
  });
  return h;
}

function majPrintHead(){
  const el = document.getElementById('printhead');
  if(!el) return;
  const o = ONGLETS.find(x => x.id === onglet);
  el.innerHTML = `<div class="t">CPTS Pau Béarn — ${esc(o ? o.nom : 'Dossier de traçabilité')}</div>
    <div class="d">${esc(etat.entete.niveau)} · édité le ${new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${moi!=='Anonyme'?' par '+esc(moi):''}</div>`;
}

function rendre(){
  normaliserPersonnes();
  rendreNav();
  rendreMesMissions();
  const v = document.getElementById('vue');
  if(onglet === 'cockpit') v.innerHTML = vueCockpit();
  else if(onglet === 'missions') v.innerHTML = vueMissions();
  else if(onglet === 'veille') v.innerHTML = vueVeille();
  else if(onglet === 'fil') v.innerHTML = vueFil();
  else if(onglet === 'lignes') v.innerHTML = vueLignes();
  else if(onglet === 'offre') v.innerHTML = vueOffre();
  else if(onglet === 'appels') v.innerHTML = vueAppels();
  else if(onglet === 'materiel') v.innerHTML = vueCollecte();
  else if(onglet === 'volontaires') v.innerHTML = vueRenfort();
  else if(onglet === 'orientation') v.innerHTML = vueOrientation();
  else if(onglet === 'dossier') v.innerHTML = vueDossier();
  else v.innerHTML = vueCollection(onglet);
  v.insertAdjacentHTML('afterbegin', '<div class="entete-print" id="printhead"></div>');
  majPrintHead();
  /* La page vient d'être reconstruite : les cartes qu'elle porte
     se remontent sur leurs conteneurs neufs, et celles qui ont
     disparu se démontent. */
  monterCartes();
}

charger();
</script>
