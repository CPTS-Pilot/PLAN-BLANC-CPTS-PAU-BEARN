  return h;
}

async function majVol(id, champ, val){
  const o = (etat.volontaires||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  await sauver(); rendre();
}

async function basculerRenfortType(id, i){
  const o = (etat.volontaires||[]).find(x => x.id === id); if(!o) return;
  const t = RENFORTS_TYPES[i], l = listeRenforts(o), j = l.indexOf(t);
  if(j >= 0) l.splice(j, 1); else l.push(t);
  o.renforts = RENFORTS_TYPES.filter(x => l.indexOf(x) >= 0)
    .concat(l.filter(x => RENFORTS_TYPES.indexOf(x) === -1)).join(', ');
  o.modifiePar = moi;
  await sauver(); rendre();
}

/* Une inscription arrivée par le formulaire attend qu'un membre du
   copil ait rappelé la personne : c'est ce qui distingue « reçue »
   de « vérifiée ». */
async function verifierVol(id){
  const o = (etat.volontaires||[]).find(x => x.id === id); if(!o) return;
  delete o.aVerifier;
  if(!o.statut || o.statut === 'Recensé') o.statut = 'Vérifié';
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:aujourdhui(), heure:maintenant(),
    texte:"Inscription en ligne vérifiée par la coordination.", par:moi});
  o.modifiePar = moi;
  await sauver(); rendre(); toast("Inscription vérifiée");
}

function ouvrirSuiviVol(id){
  const o = (etat.volontaires||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(nomVol(o))} — appel</h3><div class="form">
    <label><span class="k">Date</span><input type="date" id="sv-date" value="${aujourdhui()}"></label>
    <label><span class="k">Heure</span><input type="time" id="sv-heure" value="${maintenant()}"></label>
    <label class="large"><span class="k">Ce qui a été dit ou fait *</span><textarea id="sv-texte" placeholder="Assurance vérifiée, disponibilités précisées, nom transmis à l'ARS, affectation proposée…"></textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerSuiviVol('${o.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerSuiviVol(id){
  const o = (etat.volontaires||[]).find(x => x.id === id); if(!o) return;
  const g = k => document.getElementById('sv-'+k).value.trim();
  if(!g('texte')){ toast("Indiquez ce qui a été dit"); return; }
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:g('date'), heure:g('heure'), texte:g('texte'), par:moi});
  o.modifiePar = moi;
  volOuvert = o.id;
  await sauver(); fermer(); rendre(); toast("Appel consigné");
}
async function supprimerSuiviVol(id, sid){
  const o = (etat.volontaires||[]).find(x => x.id === id); if(!o) return;
  o.suivi = (o.suivi||[]).filter(x => x.id !== sid);
  await sauver(); rendre(); toast("Appel supprimé");
}

}

/* =========================================================
   PATIENTS ÉVACUÉS
   Des personnes évacuées de Gironde se présentent au comptoir
   des pharmacies et dans les structures de soins non
   programmés du territoire : ordonnances à renouveler, suites
   d'inhalation de fumées, et pas de médecin traitant ici. La
   CPTS ne soigne pas — elle sonde les généralistes, tient le
   vivier de ceux qui acceptent, informe les relais et flèche
   les patients.

   L'onglet ne porte qu'un métier : « Orientation vers les
   médecins généralistes du territoire ». Le recensement des
   lieux d'accueil (hub santé) a été retiré de l'interface — les
   données restent au dossier, l'écran reviendra plus tard.
   ========================================================= */
let moduleOri = '';           /* '' = le palier, 'soins' */
let feuilletOri = 'medecins';
let filtreMed = 'Tout';
/* Où en est le recueil d'un patient : '' tant que rien n'est
   ouvert — le feuillet n'affiche alors qu'un bouton —, 'choix'
   pendant qu'on tranche la première question, puis 'consulter'
   ou 'oriente' selon la voie prise. */
let voieRecueil = '';
/* Le tamis du registre des patients : ce qui est affiché à
   l'instant, et dans quel ordre. Rien n'est enregistré — c'est
   une manière de regarder, pas une donnée. */
let tamisPat = {q:'', du:'', au:'', statut:'Tout', urgence:'Tout', voie:'Tout', tri:'recent'};
/* Les filtres fins restent repliés tant qu'on ne les demande pas :
   sur un écran de crise, la place se dispute aux patients. */
let tamisOuvert = false;
function allerModuleOri(m){ moduleOri = m; rendre(); window.scrollTo(0,0); }
/* Un lien profond venu d'ailleurs — du cockpit, d'un autre feuillet —
   ouvre le module qui contient le feuillet visé, pas le palier.
   « recueil » n'est plus un feuillet : il a fondu dans celui des
   patients, dont il est devenu le bouton de tête. */
function allerFeuilletOri(f){
  moduleOri = 'soins';
  feuilletOri = f === 'recueil' ? 'patients' : f;
  if(f !== 'patients') voieRecueil = '';
  rendre(); window.scrollTo(0,0);
}
/* Recueillir un patient, d'où qu'on parte : le feuillet des
   patients s'ouvre avec le formulaire déjà déplié. */
function ouvrirRecueil(){
  moduleOri = 'soins'; feuilletOri = 'patients'; voieRecueil = 'choix';
  rendre(); window.scrollTo(0,0);
}
function filtrerMed(r){ filtreMed = r; rendre(); }

/* --- La campagne de recensement des généralistes ---------
   Troisième formulaire public de la CPTS, après la collecte et
   le renfort. Celui-ci ne demande pas des bras pour partir : il
   demande des créneaux de consultation, ici, au cabinet. */
const FORMULAIRE_CONSULT = 'accueil-patients-evacues.html';
function lienConsult(){
  try{ return new URL(FORMULAIRE_CONSULT, location.href).href; }
  catch(e){ return FORMULAIRE_CONSULT; }
}

async function basculerConsult(){
  /* La question se pose dans la même fenêtre que le recensement :
     on note qu'on en venait, pour y revenir une fois répondu. */
  const dansModale = modaleRecens;
  const r = await basculerFormulairePublic({
    cle:'consultations',
    titre:"Ouvrir le recensement des généralistes",
    portee:"Le formulaire devient accessible à tout médecin qui en a le lien. Répondre ne l'engage qu'à ce qu'il a coché, et le formulaire le dit — mais la CPTS s'engage à rappeler ceux qui acceptent avant de leur adresser le moindre patient.",
    consigner: consignerConsultEnCourante
  });
  if(!r){ if(dansModale) ouvrirRecensement(); return; }
  await sauver(); rendre();
  if(dansModale) ouvrirRecensement();
  toast(r.ouvre
    ? (r.officielle ? "Recensement ouvert — l'ouverture est consignée en main courante"
                    : "Recensement ouvert pour essai — rien n'est consigné")
    : (r.officielle ? "Recensement fermé — la fermeture est consignée en main courante"
                    : "Essai terminé — le recensement est refermé, rien n'a été consigné"));
}

function consignerConsultEnCourante(ouvre){
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(), date: aujourdhui(), heure: maintenant(), source: '',
    evenement: ouvre
      ? "Ouverture du recensement des médecins généralistes volontaires pour recevoir en consultation les personnes évacuées des zones incendiées : le formulaire en ligne est accessible aux généralistes du territoire."
        + ((etat.consultations && etat.consultations.cadre) ? "\nCadre annoncé : " + etat.consultations.cadre : '')
      : "Fermeture du recensement des médecins généralistes volontaires : le formulaire n'accepte plus de réponse.",

/* Les créneaux cochés sur le calendrier du formulaire arrivent
   sous forme « 2026-07-29:matin ». On les regroupe par jour pour
   les relire d'un coup d'œil, dans l'ordre du calendrier. */
const JOURS_CT = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function creneauxGroupes(o){
  const l = Array.isArray(o.dispos) ? o.dispos : [];
  const par = new Map();
  /* Le matin d'abord : l'ordre alphabétique mettrait
     « apresmidi » devant, ce qui se lit de travers. */
  const rang = x => String(x).split(':')[1] === 'matin' ? 0 : 1;
  [...l].sort((a,b) => String(a).slice(0,10).localeCompare(String(b).slice(0,10)) || rang(a) - rang(b))
    .forEach(x => {
      const [d, p] = String(x).split(':');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      if(!par.has(d)) par.set(d, []);
      const lib = p === 'apresmidi' ? 'après-midi' : 'matin';
      if(par.get(d).indexOf(lib) === -1) par.get(d).push(lib);
    });
  return [...par.entries()].map(([d, p]) => {
    const t = new Date(d + 'T12:00:00');
    const j = isNaN(t.getTime()) ? '' : JOURS_CT[t.getDay()];
    /* Les horaires précisés se lisent à côté de leur demi-journée :
       c'est ce qui permet de poser quelqu'un sans rappeler. */
    const q = p.map(lib => {
      const h = heuresDuCreneau(o, d + ':' + (lib === 'après-midi' ? 'apresmidi' : 'matin'));
      return lib + (h.length ? ' — ' + h.map(hFr).join(', ') : '');
    });
    return {jour: (j ? j.charAt(0).toUpperCase() + j.slice(1) + ' ' : '') + frdate(d), parts: q};
  });
}

const nomMed = m => [m.prenom, m.nom].filter(x => String(x||'').trim()).join(' ').trim() || 'Sans nom';

/* Une adresse touchée sur un téléphone doit ouvrir la carte, pas
   une page. Cette forme d'URL est celle que les deux systèmes
   reprennent : iOS propose Plans, Android ouvre Maps, et sur un
   ordinateur elle s'affiche dans le navigateur. La commune est
   ajoutée quand l'adresse ne la contient pas — sans elle, une rue
   se retrouve à l'autre bout de la France. */
function lienCarte(adresse, commune){
  const a = String(adresse || '').trim();
  const c = String(commune || '').trim();
  const q = (c && a.toLowerCase().indexOf(c.toLowerCase()) < 0 ? a + ', ' + c : a)
    + (a.toLowerCase().indexOf('france') < 0 ? ', France' : '');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

/* =========================================================
   CARTOGRAPHIE DES MÉDECINS VOLONTAIRES

   Une colonne « commune » ne dit pas si le cabinet est à dix
   minutes de la pharmacie qui appelle. La carte le dit : chaque
   médecin dont l'adresse est renseignée devient un point, du
   vert pour ceux qui acceptent au gris pour ceux qui ont dit non.

   Le point se calcule une seule fois et se conserve avec la
   fiche — latitude, longitude et l'adresse qui les a produites.
   Tant que l'adresse ne change pas, on ne redemande rien à
   personne ; si elle change, le point se refait tout seul.

   Deux services publics, ni l'un ni l'autre avec une clé :
   — la Base Adresse Nationale (api-adresse.data.gouv.fr) pour
     transformer « 12 rue Carnot, Pau » en un point ;
   — les fonds de carte d'OpenStreetMap, affichés par Leaflet.

   Seules les adresses professionnelles des médecins partent au
   géocodage. Aucune donnée de patient ne sort du cockpit — ni
   nom, ni adresse, ni motif.

   Si l'un des deux services est injoignable — poste hors ligne,
   réseau filtré, pare-feu d'un cabinet — la carte le dit et
   s'efface : la liste reste entière, les adresses restent
   lisibles sur chaque fiche et le lien « Itinéraire » continue
   d'ouvrir l'application de cartes du téléphone. Rien du
   cockpit ne dépend de ce qui suit.
   ========================================================= */
const CARTO_CSS  = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
const CARTO_JS   = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
const CARTO_BAN  = 'https://api-adresse.data.gouv.fr/search/?limit=1&q=';
/* Pau, à défaut de tout point : la carte s'ouvre sur le territoire
   plutôt que sur l'océan. */
const CARTO_CENTRE = [43.2951, -0.3708];

/* Les teintes des points reprennent celles des étiquettes de
   statut : ce qui se lit sur la fiche se retrouve sur la carte. */
const CARTO_TEINTES = {
  'Volontaire':'#2F7D62', 'Sous conditions':'#2F7D62',
  'Sollicité':'#E8A33D', 'Sans réponse':'#E8A33D',
  'À solliciter':'#0B4FA8', 'Indisponible':'#9AA8BC'
};

/* Côté patients, la couleur ne dit pas un statut administratif
   mais où en est la personne : rouge tant qu'elle est signalée
   urgente sans médecin, ambre tant qu'elle attend, vert dès
   qu'un médecin lui est désigné, gris quand la demande est
   close sans suite. */
const CARTO_PAT = {attente:'#E8A33D', urgent:'#C2482F', oriente:'#2F7D62', clos:'#9AA8BC'};
const etatCarto = o => o.statut === 'Sans suite' ? 'clos'
  : estOriente(o) ? 'oriente'
  : o.urgence === 'Urgent' ? 'urgent' : 'attente';

let leafletEtat = 'absent';   // absent | charge | pret | echec
const cartesVives = {};       // les cartes montées, par identifiant de toile
const cartoDonnees = {};      // les points à poser, par identifiant de toile
const cartoPliee = {};        // les cartes repliées à la main
let medSurCartePat = false;   // les médecins volontaires en surimpression

/* L'adresse telle qu'on la soumet : elle sert aussi de témoin.
   Tant qu'elle n'a pas changé, le point calculé reste valable. */
function cleGeo(o){
  const a = String(o.adresse || '').trim();
  const c = String(o.commune || '').trim();
  if(!a && !c) return '';
  const q = a && c && a.toLowerCase().indexOf(c.toLowerCase()) < 0 ? a + ', ' + c : (a || c);
  return q.replace(/\s+/g, ' ');
}

const nombreOuNul = v => typeof v === 'number' && isFinite(v) ? v
  : (v !== '' && v !== null && v !== undefined && isFinite(Number(v)) ? Number(v) : null);

/* Ce que la carte a besoin de savoir de chaque médecin — rien de
   plus que ce qui s'affiche dans la bulle. */
function pointsMedecins(med){
  return (med || []).map(m => {
    const cle = cleGeo(m);
    const lat = nombreOuNul(m.lat), lon = nombreOuNul(m.lon);
    /* Un point calculé sur une adresse qui a changé depuis ne vaut
       plus rien : on ne l'affiche pas, il se recalculera. */
    const bon = lat !== null && lon !== null && m.geoCle === cle;
    return {
      id: m.id, nom: nomMed(m), statut: m.statut || 'À solliciter',
      lieu: [m.structure, m.commune].filter(Boolean).join(' · '),
      adresse: m.adresse || '', commune: m.commune || '', tel: m.tel || '',
      lat: bon ? lat : null, lon: bon ? lon : null,
      approx: m.geoPrecision === 'municipality' || m.geoPrecision === 'locality',
      cle, echec: !!cle && m.geoEchec === cle,
      forme:'med'
    };
  });
}

/* --- les patients --------------------------------------
   Une personne n'est jamais située à son adresse : seule sa
   commune part au service d'adresses, et c'est sur le bourg
   qu'elle se pose. Le registre porte l'identité pour pouvoir
   nommer quelqu'un au médecin qui la prend — il n'a pas à la
   faire sortir du cockpit pour autant, et la commune suffit
   largement à dire quel cabinet est le plus près. */
const cleGeoPat = o => String(o.commune || '').trim().replace(/\s+/g, ' ');

/* Deux personnes d'une même commune tomberaient sur le même
   point et se recouvriraient. On les écarte en spirale autour du
   bourg — angle d'or, pour que la spirale ne se recroise pas.
   Le rang se prend sur l'identifiant, jamais sur l'ordre de la
   liste : trier ou tamiser le registre ne doit pas faire sauter
   les points d'une place à l'autre. */
function pointsPatients(ori, vivier){
  const rangs = {};
  (ori || []).forEach(o => {
    const c = cleGeoPat(o); if(!c) return;
    (rangs[c] = rangs[c] || []).push(o.id);
  });
  for(const c in rangs) rangs[c].sort();

  return (ori || []).map(o => {
    const cle = cleGeoPat(o);
    const lat = nombreOuNul(o.lat), lon = nombreOuNul(o.lon);
    const bon = lat !== null && lon !== null && o.geoCle === cle;
    let dlat = 0, dlon = 0;
    if(bon){
      const n = (rangs[cle] || []).indexOf(o.id);
      if(n > 0){
        const ang = n * 2.399963;              // angle d'or, en radians
        const r = 0.0042 * Math.sqrt(n);       // ~450 m au premier écart
        dlat = r * Math.cos(ang);
        dlon = r * Math.sin(ang) / Math.max(.2, Math.cos(lat * Math.PI / 180));
      }
    }
    /* Le cabinet le plus proche ne se cherche que pour qui attend
       encore quelqu'un : une demande close sans suite n'a personne
       à se voir proposer. */
    const cherche = etatCarto(o) === 'attente' || etatCarto(o) === 'urgent';
    const proche = bon && cherche ? plusProche(lat, lon, vivier) : null;
    return {
      id: o.id, nom: refPatient(o) || 'Patient', statut: o.statut || 'À orienter',
      lieu: [o.motif, o.commune].filter(Boolean).join(' · '),
      urgent: o.urgence === 'Urgent', medecin: o.medecin || '',
      couleur: CARTO_PAT[etatCarto(o)], proche,
      lat: bon ? lat + dlat : null, lon: bon ? lon + dlon : null,
      cle, echec: !!cle && o.geoEchec === cle,
      forme:'pat'
    };
  });
}

/* --- la distance ---------------------------------------
   Haversine : la distance à vol d'oiseau. Ce n'est pas un temps
   de trajet — en piémont, une vallée peut doubler la route —
   mais pour ranger des cabinets du plus proche au plus loin
   d'une commune, elle suffit, et elle ne dépend d'aucun service. */
function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2) ** 2
    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

const fmtKm = d => d === null || d === undefined ? ''
  : d < 1 ? 'moins d\'1 km' : d.toFixed(d < 10 ? 1 : 0).replace('.', ',') + ' km';

/* Le cabinet volontaire le plus près d'un point, et à quelle
   distance. `vivier` est une liste de points déjà situés. */
function plusProche(lat, lon, vivier){
  let gagnant = null, mieux = Infinity;
  (vivier || []).forEach(m => {
    if(m.lat === null || m.lon === null) return;
    const d = distanceKm(lat, lon, m.lat, m.lon);
    if(d < mieux){ mieux = d; gagnant = m; }
  });
  return gagnant ? {nom: gagnant.nom, id: gagnant.id, km: mieux} : null;
}

/* La distance d'un patient à un médecin, quand les deux sont
   situés — sert à ranger la liste au moment d'affecter. */
function distancePatMed(o, m){
  const la = nombreOuNul(o.lat), lo = nombreOuNul(o.lon);
  const lb = nombreOuNul(m.lat), lob = nombreOuNul(m.lon);
  if(la === null || lo === null || lb === null || lob === null) return null;
  if(o.geoCle !== cleGeoPat(o) || m.geoCle !== cleGeo(m)) return null;
  return distanceKm(la, lo, lb, lob);
}

/* --- le géocodage -------------------------------------
   En file, une adresse à la fois, un souffle entre deux : le
   service est public et gratuit, on ne le mitraille pas. Ce qui
   revient s'écrit sur la fiche et part au serveur en une seule
   fois à la fin — pas un enregistrement par adresse.

   Deux registres à situer, et pas de la même façon : le cabinet
   d'un médecin part avec sa rue, la personne signalée part avec
   sa seule commune, et le service est prié de ne chercher qu'une
   commune. C'est la ligne de partage à ne pas franchir. */
const A_SITUER = [
  {k:'medecins', cle: cleGeo,    type:'',             quoi:'cabinet situé',   quoiP:'cabinets situés'},
  {k:'orientes', cle: cleGeoPat, type:'municipality', quoi:'personne située', quoiP:'personnes situées'}
];

let geoEnCours = false;
async function geocoderFiches(){
  if(geoEnCours || leafletEtat === 'echec') return;
  if(navigator.onLine === false) return;

  const files = A_SITUER.map(r => ({r, l: (etat[r.k] || []).filter(o => {
    const cle = r.cle(o);
    return cle && o.geoCle !== cle && o.geoEchec !== cle;
  })})).filter(x => x.l.length);
  if(!files.length) return;

  geoEnCours = true;
  let touche = false, coupure = false;
  const comptes = {};

  for(const {r, l} of files){
    if(coupure) break;
    for(const o of l.slice(0, 30)){
      const cle = r.cle(o);
      let d = null;
      try{
        const r2 = await fetch(CARTO_BAN + encodeURIComponent(cle)
          + (r.type ? '&type=' + r.type : ''));
        if(!r2.ok) throw new Error(r2.status);
        d = await r2.json();
      }catch(e){
        /* Service injoignable : on s'arrête là sans rien marquer,
           la prochaine ouverture de l'onglet réessaiera. */
        coupure = true;
        break;
      }
      const f = d && d.features && d.features[0];
      const c = f && f.geometry && f.geometry.coordinates;
      /* Le service répond toujours quelque chose : sous un certain
         score, ce qu'il propose n'a plus grand-chose à voir avec ce
         qu'on lui a demandé. Mieux vaut pas de point qu'un cabinet
         posé dans la mauvaise vallée. */
      const sur = f && (f.properties || {}).score >= 0.35;
      if(c && c.length === 2 && sur){
        o.lon = c[0]; o.lat = c[1]; o.geoCle = cle;
        o.geoPrecision = (f.properties || {}).type || '';
        delete o.geoEchec;
        comptes[r.k] = (comptes[r.k] || 0) + 1;
      }else{
        /* Adresse que le service ne reconnaît pas : on le note pour
           ne pas la redemander à chaque ouverture, et la fiche le
           dira — c'est à la coordination de corriger l'adresse. */
        o.geoEchec = cle;
      }
      touche = true;
      await new Promise(r3 => setTimeout(r3, 320));
    }
  }
  geoEnCours = false;

  if(!touche) return;
  await sauver();
  rendre();
  const dit = A_SITUER.filter(r => comptes[r.k])
    .map(r => `${comptes[r.k]} ${comptes[r.k] > 1 ? r.quoiP : r.quoi}`).join(' et ');
  if(dit) toast(dit + ' sur la carte');
}

/* --- Leaflet, chargé au moment où l'on en a besoin ------
   La bibliothèque ne part chercher son fond de carte que si une
   carte est effectivement à l'écran : ouvrir le cockpit ne coûte
   rien de plus qu'avant. */
function chargerLeaflet(){
  if(leafletEtat !== 'absent') return;
  leafletEtat = 'charge';
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = CARTO_CSS;
  document.head.appendChild(css);
  const js = document.createElement('script');
  js.src = CARTO_JS;
  js.onload  = () => { leafletEtat = typeof L === 'undefined' ? 'echec' : 'pret'; monterCartes(); };
  js.onerror = () => { leafletEtat = 'echec'; monterCartes(); };
  document.head.appendChild(js);
}

/* Le cockpit reconstruit sa page entière à chaque rendu. Le
   feuillet écrit donc un hôte vide, et la carte — bâtie une fois
   pour toutes — vient s'y replacer. Celle dont l'hôte a
   définitivement disparu se démonte, sinon Leaflet garderait ses
   écouteurs sur un élément que plus personne ne regarde. */
function monterCartes(){
  for(const id in cartesVives){
    if(document.getElementById('hote-' + id)) continue;
    try{ cartesVives[id].remove(); }catch(e){}
    delete cartesVives[id];
  }
  const hotes = [].slice.call(document.querySelectorAll('.carto-hote'));
  if(!hotes.length) return;

  geocoderFiches();

  if(leafletEtat === 'echec'){
    hotes.forEach(t => { t.innerHTML = `<div class="attente">Le fond de carte n'a pas pu être chargé — poste hors ligne, ou réseau qui n'autorise pas openstreetmap.org. Les adresses restent lisibles sur chaque fiche, et le lien « Itinéraire » ouvre l'application de cartes du téléphone.</div>`; });
    return;
  }
  if(leafletEtat !== 'pret'){ chargerLeaflet(); return; }
  hotes.forEach(dessinerCarte);
}

function dessinerCarte(hote){
  const idc = hote.dataset.carte;
  const pts = (cartoDonnees[idc] || []).filter(p => p.lat !== null && p.lon !== null);
  let carte = cartesVives[idc];

  if(carte){
    /* La carte existe déjà : on la replace dans son hôte neuf
       plutôt que d'en rebâtir une. Sans cela, une seule lettre
       tapée dans la recherche des patients — qui refait la page
       entière — rejetterait la vue à son cadrage d'origine, et
       refermerait la bulle qu'on venait d'ouvrir. */
    if(carte._toile.parentNode !== hote) hote.appendChild(carte._toile);
  }else{
    const toile = document.createElement('div');
    toile.className = 'carto-toile';
    hote.appendChild(toile);
    /* La molette ne zoome pas : sur une page qui défile, une carte
       qui capture le défilement se traverse à la souris comme un
       piège. Le zoom se fait aux boutons ou à deux doigts. */
    carte = L.map(toile, {scrollWheelZoom:false}).setView(CARTO_CENTRE, 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:18,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(carte);
    carte._couche = L.layerGroup().addTo(carte);
    carte._toile = toile;
    cartesVives[idc] = carte;
  }

  /* Les points ne se redessinent que s'ils ont changé : le reste
     du temps, le re-rendu de la page ne touche pas à la carte. */
  const signe = pts.map(p =>
    [p.id, p.lat, p.lon, p.statut, p.approx, p.forme, p.creux, p.couleur, p.medecin].join(':')).join('|');
  if(signe !== carte._signe){
    carte._couche.clearLayers();
    carte._reperes = {};
    pts.forEach(p => {
      const teinte = p.couleur || CARTO_TEINTES[p.statut] || '#0B4FA8';
      /* Deux formes, pour que les deux populations ne se confondent
         pas quand elles partagent la même carte : la personne
         signalée est un disque plein, le cabinet un anneau. */
      const style = p.forme === 'med' && p.creux
        ? {radius:8, weight:3, color:teinte, fillColor:teinte, fillOpacity:.12}
        : {radius:9, weight:3, color:'#fff', fillColor:teinte,
           /* Un point posé sur la commune faute d'adresse exacte se
              montre pâle : il dit « quelque part par ici », pas « là ». */
           fillOpacity: p.approx ? .42 : .95};
      const r = L.circleMarker([p.lat, p.lon], style).addTo(carte._couche);
      r.bindPopup(bullecarte(p));
      carte._reperes[p.id] = r;
    });
    /* Le cadrage se refait quand la population de points change —
       un médecin qui vient d'être situé doit entrer dans le cadre. */
    if(pts.length){
      const b = L.latLngBounds(pts.map(p => [p.lat, p.lon]));
      carte.fitBounds(b, {padding:[30,30], maxZoom: pts.length === 1 ? 15 : 14});
    }
    carte._signe = signe;
  }

  /* Le conteneur vient d'être replacé : Leaflet l'avait mesuré
     avant que la page ne prenne sa largeur définitive. */
  setTimeout(() => { try{ carte.invalidateSize(); }catch(e){} }, 80);
}

/* La bulle rend ce dont on a besoin le téléphone à la main :
   qui c'est, sa réponse, son numéro qui compose, l'itinéraire. */
function bullecarte(p){
  if(p.forme === 'pat') return bullePatient(p);
  return `<div class="carto-popup">
    <div class="n">${esc(p.nom)}</div>
    ${p.lieu ? `<div class="l">${esc(p.lieu)}</div>` : ''}
    <div class="l">${esc(p.statut)}${p.approx ? " — situé à la commune, l'adresse exacte n'a pas été retrouvée" : ''}</div>
    ${p.tel ? `<a href="tel:${esc(String(p.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(p.tel)}</a>` : ''}
    ${p.adresse ? `<a href="${esc(lienCarte(p.adresse, p.commune))}" target="_blank" rel="noopener">Itinéraire</a>` : ''}
    <button onclick="ouvrirEdition('medecins','${p.id}')">Ouvrir la fiche</button>
  </div>`;
}

/* La bulle d'une personne signalée répond à la question qu'on se
   pose en la regardant sur la carte : qui est le plus près d'elle,
   et à quelle distance. Le nom du cabinet est donné là, avec de
   quoi l'affecter sans quitter la carte. */
function bullePatient(p){
  return `<div class="carto-popup">
    <div class="n">${esc(p.nom)}${p.urgent ? `<span class="urg">Urgent</span>` : ''}</div>
    ${p.lieu ? `<div class="l">${esc(p.lieu)}</div>` : ''}
    <div class="l">${esc(p.statut)}</div>
    ${p.medecin ? `<div class="l">Orienté vers ${esc(p.medecin)}</div>` : ''}
    ${p.proche ? `<div class="pres"><span class="k">Cabinet volontaire le plus proche</span>
        ${esc(p.proche.nom)} — ${esc(fmtKm(p.proche.km))} à vol d'oiseau</div>` : ''}
    <button onclick="fermerBulles();ouvrirOrientation('${p.id}')">${
      p.medecin ? 'Changer le médecin' : 'Orienter le patient'}</button>
  </div>`;
}

/* La fenêtre d'affectation s'ouvre par-dessus la carte : la bulle
   dessous doit se refermer, sinon elle reste ouverte derrière et
   se retrouve là au retour, sur un patient qu'on a déjà traité. */
function fermerBulles(){
  for(const id in cartesVives){ try{ cartesVives[id].closePopup(); }catch(e){} }
}

/* Le bloc tel qu'il s'écrit dans un feuillet. Les points sont
   déposés au passage dans cartoDonnees : c'est la carte montée
   après le rendu qui viendra les y chercher. */
function blocCarte(idc, pts, o){
  cartoDonnees[idc] = pts;
  const vedettes = pts.filter(p => !p.second);   // ce que la carte est censée montrer
  const situes = pts.filter(p => p.lat !== null);
  const attente = vedettes.filter(p => p.lat === null && p.cle && !p.echec).length;
  const plie = !!cartoPliee[idc];
  const court = o.court ? ' court' : '';

  let corps;
  if(plie) corps = '';
  else if(situes.length || attente) corps = `<div class="carto-hote${court}" id="hote-${idc}" data-carte="${idc}"></div>`;
  else corps = `<div class="carto-vide${court}">${esc(vedettes.length ? o.videSansPoint : o.videSansFiche)}</div>`;

  /* La légende ne montre que ce qui est effectivement posé : une
     carte où personne n'a encore été orienté n'a pas à porter une
     pastille verte qui ne correspond à rien. La forme compte
     autant que la teinte — le vert d'une personne orientée et
     celui d'un cabinet volontaire sont le même vert, et seuls le
     disque et l'anneau les distinguent. */
  const forme = p => (p.couleur || CARTO_TEINTES[p.statut] || '#0B4FA8') + (p.creux ? '|anneau' : '|disque');
  const cles = new Set(situes.map(forme));
  const legende = (o.legende || []).filter(x => cles.has(forme({couleur:x.c, creux:x.creux})));

  return `<div class="carto">
    <div class="tete-c">
      <div class="t">${esc(o.titre)}</div>
      <p class="s">${o.sous}</p>
      ${o.outil || ''}
      <button class="plier" onclick="plierCarte('${idc}')">${plie ? 'Afficher la carte' : 'Replier'}</button>
    </div>
    ${corps}
    ${plie || !situes.length ? '' : `<div class="legende">
      <span><strong>${vedettes.filter(p => p.lat !== null).length}</strong> ${esc(o.compte)}</span>
      ${legende.map(x => `<span><i class="${x.creux ? 'creux' : ''}" style="${x.creux
        ? `background:transparent;box-shadow:0 0 0 1px ${x.c} inset,0 0 0 3px ${x.c} inset`
        : `background:${x.c}`}"></i>${esc(x.l)}</span>`).join('')}
      ${vedettes.some(p => p.lat !== null && p.approx) ? `<span><i class="approx" style="background:#0B4FA8"></i>Situé à la commune seulement</span>` : ''}
    </div>`}
    ${plie || !o.alerte ? '' : `<div class="manquants">${o.alerte}</div>`}
    ${plie || (!situes.length && !attente) ? '' : `<div class="source">${esc(o.source)} Fond de carte OpenStreetMap, adresses situées par la Base Adresse Nationale — deux services publics, sans compte ni clé.</div>`}
  </div>`;
}

/* Ce que la carte des médecins signale d'incomplet, sous elle. */
function alerteMedecins(pts){
  const attente = pts.filter(p => p.lat === null && p.cle && !p.echec).length;
  const introuvables = pts.filter(p => p.echec);
  const sansAdresse = pts.filter(p => !p.cle);
  if(!attente && !introuvables.length && !sansAdresse.length) return '';
  return [
    attente ? `${attente} adresse${attente > 1 ? 's sont' : ' est'} en cours de localisation.` : '',
    introuvables.length ? `<strong>${introuvables.length}</strong> adresse${introuvables.length > 1 ? 's n\'ont' : ' n\'a'} pas été retrouvée${introuvables.length > 1 ? 's' : ''} : ${introuvables.map(p => esc(p.nom)).join(', ')} — à corriger sur la fiche.` : '',
    sansAdresse.length ? `${sansAdresse.length} médecin${sansAdresse.length > 1 ? 's sont' : ' est'} sans adresse ni commune et ne peu${sansAdresse.length > 1 ? 'vent' : 't'} pas être situé${sansAdresse.length > 1 ? 's' : ''}.` : ''
  ].filter(Boolean).join(' ');
}

/* Et ce que signale la carte des patients : ici le manque est
   toujours le même — la commune n'a pas été renseignée au
   recueil, ou elle n'existe pas sous ce nom. */
function alertePatients(pts){
  const attente = pts.filter(p => p.lat === null && p.cle && !p.echec).length;
  const introuvables = pts.filter(p => p.echec);
  const sansCommune = pts.filter(p => !p.cle);
  if(!attente && !introuvables.length && !sansCommune.length) return '';
  return [
    attente ? `${attente} commune${attente > 1 ? 's sont' : ' est'} en cours de localisation.` : '',
    introuvables.length ? `<strong>${introuvables.length}</strong> commune${introuvables.length > 1 ? 's n\'ont' : ' n\'a'} pas été retrouvée${introuvables.length > 1 ? 's' : ''} : ${introuvables.map(p => esc(p.nom)).join(', ')} — vérifier l\'orthographe sur la fiche.` : '',
    sansCommune.length ? `${sansCommune.length} personne${sansCommune.length > 1 ? 's sont' : ' est'} sans commune au registre et ne peu${sansCommune.length > 1 ? 'vent' : 't'} pas être située${sansCommune.length > 1 ? 's' : ''} : c\'est la question à poser au prochain appel.` : ''
  ].filter(Boolean).join(' ');
}

function basculerMedSurPat(){ medSurCartePat = !medSurCartePat; rendre(); }

function plierCarte(idc){ cartoPliee[idc] = !cartoPliee[idc]; rendre(); }

/* Depuis une fiche du registre : la carte se déplie s'il le faut,
   remonte sous les yeux, se centre sur le cabinet et ouvre sa
   bulle. C'est le geste qu'on fait quand une pharmacie demande
   « et lui, il est où ? ». */
function situerMed(id){
  const idc = 'carte-medecins';
  if(cartoPliee[idc]){ cartoPliee[idc] = false; rendre(); setTimeout(() => situerMed(id), 500); return; }
  const carte = cartesVives[idc];
  const rep = carte && carte._reperes ? carte._reperes[id] : null;
  if(!rep){ toast("Ce cabinet n'est pas encore situé sur la carte."); return; }
  try{ carte.getContainer().scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
  carte.setView(rep.getLatLng(), 15);
  rep.openPopup();
}

const MED_ET = {'Volontaire':'e-cours', 'Sous conditions':'e-cours', 'Sollicité':'e-attente',
  'À solliciter':'e-lancer', 'Indisponible':'e-fini', 'Sans réponse':'e-attente'};

/* Un patient est effectivement flêché dès qu'un médecin lui est
   désigné : le rendez-vous, lui, se compte à part. */
const estOriente = o => !!String(o.medecin || '').trim();
const aRendezVous = o => !!o.rdvle || o.statut === 'Rendez-vous fixé' || o.statut === 'Patient vu';
/* Ce qui attend encore quelqu'un pour le prendre. */
const enAttenteMed = o => !estOriente(o) && o.statut !== 'Sans suite';

/* Le palier de l'onglet : deux modules, on clique sur l'un ou sur
   l'autre. Chacun affiche déjà les deux chiffres qui disent où il
   en est — on choisit en connaissance de cause, sans entrer. */
function vueOrientation(){
  if(moduleOri === 'soins') return vueContinuite();
  return vueModulesOri();
}

/* Le palier de l'onglet : une carte, qui dit ce que le module
   fait et où il en est. On y entre en connaissance de cause. */
function vueModulesOri(){
  const med = etat.medecins || [], ori = etat.orientes || [];
  const vivier = med.filter(m => MED_OK.indexOf(m.statut) >= 0);
  const attente = ori.filter(enAttenteMed).length;

  return `<h1>Patients évacués</h1>

  <div class="modules">
    <button class="module" onclick="allerModuleOri('soins')">
      <div class="titre-m">Orientation vers les médecins généralistes du territoire</div>
      <p class="sous-m">Des personnes évacuées des zones en feu de Gironde se présentent au comptoir des pharmacies et dans les structures de soins non programmés du territoire : ordonnances à renouveler après un départ précipité, suites d'inhalation de fumées, et pas de médecin traitant sur place. La CPTS Pau Béarn sonde les médecins généralistes, tient le vivier de ceux qui acceptent, informe les structures qui orientent et organise le fléchage.</p>
      <div class="chiffres">
        <div><strong>${vivier.length}</strong> médecins volontaires</div>
        <div><strong>${ori.length}</strong> patients signalés</div>
        ${attente ? `<div><strong style="color:var(--ambre)">${attente}</strong> sans médecin</div>` : ''}
      </div>
      <div class="entrer">Ouvrir le module →</div>
    </button>
  </div>`;
}

/* Le module lui-même. Il n'a ni titre ni chapô : ce qui vient
   d'être lu sur la carte n'a pas à être relu sous les feuillets,
   et sur un téléphone chaque paragraphe repoussé plus bas est un
   écran de défilement de plus avant la liste qu'on vient voir.
   Les compteurs sont descendus dans le feuillet qu'ils
   concernent, pour la même raison. */
function vueContinuite(){
  const med = etat.medecins || [], ori = etat.orientes || [], rel = etat.relais || [];
  const vivier = med.filter(m => MED_OK.indexOf(m.statut) >= 0);
  const diffusables = vivier.filter(m => m.diffusion === 'Oui');

  let h = `<button class="retour-m" onclick="allerModuleOri('')">‹ Patients évacués</button>

  <nav class="feuillets">
    <span class="k">Orientation vers les généralistes — 4 feuillets</span>
    <div class="rangee">
      <button class="${feuilletOri==='medecins'?'on':''}" onclick="allerFeuilletOri('medecins')">Médecins volontaires <span class="n">${med.length}</span></button>
      <button class="${feuilletOri==='agenda'?'on':''}" onclick="allerFeuilletOri('agenda')">Agenda des créneaux <span class="n">${creneauxOfferts().filter(s => s.d >= aujourdhui() && !occupantDe(s)).length}</span></button>
      <button class="${feuilletOri==='patients'?'on':''}" onclick="allerFeuilletOri('patients')">Patients signalés / orientés <span class="n">${ori.length}</span></button>
      <button class="${feuilletOri==='relais'?'on':''}" onclick="allerFeuilletOri('relais')">Structures qui orientent <span class="n">${rel.length}</span></button>
    </div>
  </nav>`;

  if(feuilletOri === 'agenda')   return h + feuilletAgenda();
  if(feuilletOri === 'patients' || feuilletOri === 'recueil')
                                 return h + feuilletPatients(ori, vivier, rel);
  if(feuilletOri === 'relais')   return h + feuilletRelais(rel, ori, diffusables.length);
  return h + feuilletMedecins(med, vivier, diffusables, ori);
}

/* Le module « Accueil patients évacués : hub santé » a été
   retiré de l'interface : l'écran n'était pas mûr et il chargeait
   l'onglet. Les lieux déjà recensés restent dans les données et
   au dossier de traçabilité — rien n'est perdu, et l'écran se
   rebâtira le moment venu. */

/* =========================================================
   L'AGENDA DES CRÉNEAUX

   Les créneaux de tous les médecins volontaires mis bout à
   bout, jour par jour. C'est la page à ouvrir quand une
   pharmacie appelle : on voit ce qui est libre, on y pose la
   personne, et le cockpit rend aussitôt le numéro et le
   courriel du médecin — parce qu'un créneau positionné qui
   n'est pas dit au médecin n'est pas un rendez-vous.

   Un créneau n'existe pas comme fiche : il se déduit de ce que
   le médecin a coché. Ce qui est enregistré, c'est le patient
   qu'on y pose — une seule source de vérité, celle du registre
   des patients.
   ========================================================= */
let filtreAgenda = 'libres';
let agendaPasse = false;
function filtrerAgenda(f){ filtreAgenda = f; rendre(); }
function basculerAgendaPasse(){ agendaPasse = !agendaPasse; rendre(); }

const PART_L = { matin:'matin', apresmidi:'après-midi' };
const heuresDuCreneau = (m, cle) =>
  (m.heures && Array.isArray(m.heures[cle])) ? m.heures[cle].filter(h => /^\d{1,2}:\d{2}$/.test(h)) : [];

/* Un créneau se désigne par le médecin, la demi-journée et
   l'heure — vide si le médecin n'en a pas précisé. */
const cleCreneau = s => s.m.id + '|' + s.d + ':' + s.p + '|' + (s.h || '');

/* « 09:30 » se dit « 9h30 », et « 10:00 » se dit « 10h ». */
const hFr = h => String(h || '').replace(/^0/, '').replace(':', 'h').replace(/h00$/, 'h');

function creneauxOfferts(){
  const l = [];
  (etat.medecins || []).filter(m => MED_OK.indexOf(m.statut) >= 0).forEach(m => {
    (Array.isArray(m.dispos) ? m.dispos : []).forEach(cle => {
      const d = String(cle).slice(0, 10), p = String(cle).slice(11);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !PART_L[p]) return;
      const hs = heuresDuCreneau(m, cle);
      if(hs.length) hs.forEach(h => l.push({m, d, p, h}));
      else l.push({m, d, p, h:''});
    });
  });
  return l.sort((a,b) => a.d.localeCompare(b.d)
    || (a.p === 'matin' ? 0 : 1) - (b.p === 'matin' ? 0 : 1)
    || (a.h || '99:99').localeCompare(b.h || '99:99')
    || nomMed(a.m).localeCompare(nomMed(b.m), 'fr'));
}

function creneauDeCle(cle){
  const [mid, quand, h] = String(cle).split('|');
  const m = (etat.medecins || []).find(x => x.id === mid);
  if(!m) return null;
  return { m, d: quand.slice(0, 10), p: quand.slice(11), h: h || '' };
}

/* Qui occupe ce créneau. On rattache par identifiant quand on
   l'a — le nom d'un médecin peut se corriger, son identifiant
   non. */
function occupantDe(s){
  return (etat.orientes || []).find(o =>
    (o.medecinId ? o.medecinId === s.m.id : o.medecin === nomMed(s.m))
    && o.rdvle === s.d && (o.rdvpart || '') === s.p && (o.rdvh || '') === s.h);
}

function libelleCreneau(s){
  const t = new Date(s.d + 'T12:00:00');
  const j = isNaN(t.getTime()) ? s.d
    : t.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  return j + ' ' + (s.h ? 'à ' + hFr(s.h) : '— ' + PART_L[s.p]);
}

function feuilletAgenda(){
  const tous = creneauxOfferts();
  const auj = aujourdhui();
  const visibles = agendaPasse ? tous : tous.filter(s => s.d >= auj);
  const passes = tous.length - tous.filter(s => s.d >= auj).length;
  const libres = visibles.filter(s => !occupantDe(s));
  const pris = visibles.filter(s => occupantDe(s));
  const aConfirmer = pris.filter(s => (occupantDe(s).confirme || 'À confirmer') === 'À confirmer').length;
  const attente = (etat.orientes || []).filter(enAttenteMed).length;

  let h = `<div class="note">Tous les créneaux proposés par les médecins volontaires, mis bout à bout. Quand une pharmacie appelle, c'est cette page qu'on ouvre : on repère un créneau libre, on y pose la personne, et le cockpit donne aussitôt <strong>le numéro et le courriel du médecin</strong> pour lui dire que c'est calé. Un médecin qui n'a coché qu'une demi-journée apparaît sans heure : elle se convient au téléphone.${attente ? ` <strong style="color:var(--ambre)">${attente}</strong> patient${attente>1?'s attendent':' attend'} encore un médecin.` : ''}${aConfirmer ? ` <strong style="color:var(--ambre)">${aConfirmer}</strong> créneau${aConfirmer>1?'x positionnés restent à confirmer':' positionné reste à confirmer'} avec le médecin.` : ''}</div>

  <div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n" style="color:var(--stable)">${libres.length}</div><div class="l">créneaux libres à venir</div></div>
    <div class="compteur"><div class="n">${pris.length}</div><div class="l">créneaux positionnés</div></div>
    ${aConfirmer ? `<div class="compteur"><div class="n" style="color:var(--ambre)">${aConfirmer}</div><div class="l">à confirmer avec le médecin</div></div>` : ''}
    ${attente ? `<div class="compteur"><div class="n" style="color:var(--ambre)">${attente}</div><div class="l">patients sans créneau</div></div>` : ''}
  </div>

  <div class="filtres">
    <button class="${filtreAgenda==='libres'?'on':''}" onclick="filtrerAgenda('libres')">Créneaux libres <span style="opacity:.6">${libres.length}</span></button>
    <button class="${filtreAgenda==='pris'?'on':''}" onclick="filtrerAgenda('pris')">Positionnés <span style="opacity:.6">${pris.length}</span></button>
    <button class="${filtreAgenda==='tout'?'on':''}" onclick="filtrerAgenda('tout')">Tout <span style="opacity:.6">${visibles.length}</span></button>
  </div>

  <div class="barre-h">
    <span class="cpt-h">${visibles.length} créneau${visibles.length>1?'x':''} au calendrier</span>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    ${passes ? `<button class="btn sec" onclick="basculerAgendaPasse()">${agendaPasse ? 'Masquer' : 'Afficher'} les ${passes} créneau${passes>1?'x':''} passé${passes>1?'s':''}</button>` : ''}
    <button class="btn" onclick="ouvrirRecueil()">Signaler un patient</button>
  </div>`;

  if(!tous.length){
    return h + `<div class="carte"><p class="vide">Aucun créneau proposé. L'agenda se remplit tout seul à mesure que les médecins répondent au formulaire en cochant leurs demi-journées — et leurs horaires. Un médecin saisi à la main n'y apparaît que si ses créneaux ont été cochés depuis sa fiche.</p></div>`;
  }

  const vus = filtreAgenda === 'libres' ? libres : filtreAgenda === 'pris' ? pris : visibles;
  if(!vus.length){
    return h + `<div class="carte"><p class="vide">${filtreAgenda === 'libres'
      ? "Plus aucun créneau libre à venir. Relancer les médecins volontaires, ou en solliciter de nouveaux."
      : "Aucun créneau positionné pour le moment."}</p></div>`;
  }

  let jour = null;
  vus.forEach(s => {
    if(s.d !== jour){
      jour = s.d;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === auj ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }
    const o = occupantDe(s);
    const cle = cleCreneau(s);
    const conf = o ? (o.confirme || 'À confirmer') : '';
    h += `<div class="cren ${o ? (conf === 'À confirmer' ? 'attente' : 'pris') : 'libre'}">
      <div class="q">${s.h ? esc(hFr(s.h)) : '—'}<span>${esc(PART_L[s.p])}</span></div>
      <div class="qui">
        <div class="nm">${esc(nomMed(s.m))}</div>
        <div class="s">${[s.m.structure, s.m.commune].filter(Boolean).map(esc).join(' · ') || 'Commune à préciser'}</div>
        ${o ? `<div class="pat">${esc(refPatient(o) || 'Patient')}${o.motif ? ' — ' + esc(o.motif) : ''}${o.relais ? ' · signalé par ' + esc(o.relais) : ''}</div>` : ''}
      </div>
      <div class="act">
        ${o
          ? `<span class="etiq ${conf === 'À confirmer' ? 'e-attente' : 'e-cours'}">${esc(conf)}</span>
             <button class="btn sec" onclick="ouvrirConfirmation('${cle}')">Prévenir le médecin</button>
             <button class="retirer" onclick="libererCreneau('${cle}')">Libérer</button>`
          : `<button class="btn" onclick="ouvrirPositionnement('${cle}')">Positionner un patient</button>`}
      </div>
    </div>`;
  });
  return h;
}

/* --- poser quelqu'un sur un créneau ---------------------- */
function ouvrirPositionnement(cle){
  const s = creneauDeCle(cle);
  if(!s) return toast("Ce créneau n'existe plus");
  const tous = (etat.orientes || []).filter(o => o.statut !== 'Sans suite');
  /* Ceux qui attendent d'abord : c'est pour eux qu'on cherche. */
  const l = tous.slice().sort((a,b) => (enAttenteMed(a) ? 0 : 1) - (enAttenteMed(b) ? 0 : 1)
    || ((a.date||'') + (a.heure||'')).localeCompare((b.date||'') + (b.heure||'')));

  document.getElementById('modale').innerHTML = `<h3>Positionner un patient</h3>
    <p style="color:var(--texte-2);margin:0 0 6px;font-size:13.5px">${esc(nomMed(s.m))}${s.m.commune ? ' — ' + esc(s.m.commune) : ''}</p>
    <p style="margin:0 0 14px;font-family:var(--display);font-weight:600">${esc(libelleCreneau(s))}</p>
    ${s.m.motifs ? `<div class="note" style="margin-bottom:12px">Ce médecin accepte : ${esc(s.m.motifs)}.${s.m.conditions ? ` Conditions posées : ${esc(s.m.conditions)}.` : ''}</div>` : ''}
    ${l.length
      ? `<div class="choix-pat">${l.map(o => `
          <button onclick="positionner('${cle}','${o.id}')">
            <span class="r">${esc(refPatient(o) || 'Patient')}${enAttenteMed(o) ? '' : `<span class="deja">déjà orienté</span>`}</span>
            <span class="d">${[o.motif, o.commune, o.relais, o.delai].filter(Boolean).map(esc).join(' · ') || 'Aucun détail'}</span>
          </button>`).join('')}</div>`
      : `<p class="vide">Aucun patient au registre. Recueillez d'abord la demande de la pharmacie.</p>`}
    <div class="actions">
      <button class="btn sec" onclick="fermer();ouvrirRecueil()">Signaler un nouveau patient</button>
      <button class="btn sec" onclick="fermer()">Annuler</button>
    </div>`;
  document.getElementById('rideau').classList.add('on');
}

async function positionner(cle, pid){
  const s = creneauDeCle(cle);
  const o = (etat.orientes || []).find(x => x.id === pid);
  if(!s || !o) return toast("Créneau ou patient introuvable");
  if(occupantDe(s)) return toast("Ce créneau vient d'être pris");

  o.medecin = nomMed(s.m);
  o.medecinId = s.m.id;
  o.horsVivier = false;
  /* Poser quelqu'un sur un créneau, c'est l'affecter : la trace
     est la même que depuis le feuillet des patients. */
  if(!o.orienteLe){
    o.orienteLe = aujourdhui();
    o.orienteH = maintenant();
    o.orientePar = moi === 'Anonyme' ? '' : moi;
  }
  o.rdvle = s.d; o.rdvpart = s.p; o.rdvh = s.h;
  o.confirme = 'À confirmer';
  if(!o.statut || o.statut === 'À orienter' || o.statut === 'Orienté') o.statut = 'Rendez-vous fixé';
  o.modifiePar = moi;
  await sauver();
  /* On enchaîne sur le contact du médecin sans laisser le choix
     de fermer : c'est le geste qui manque le plus souvent. */
  ouvrirConfirmation(cle);
  rendreFond();
}

/* Rafraîchit la page sous la fenêtre sans la refermer. */
function rendreFond(){
  const v = document.getElementById('vue');
  if(v && onglet === 'orientation'){ v.innerHTML = vueOrientation(); majPrintHead(); }
  rendreNav();
}

async function libererCreneau(cle){
  const s = creneauDeCle(cle); if(!s) return;
  const o = occupantDe(s); if(!o) return;
  o.rdvle = ''; o.rdvpart = ''; o.rdvh = ''; o.confirme = '';
  if(o.statut === 'Rendez-vous fixé') o.statut = 'Orienté';
  o.modifiePar = moi;
  await sauver(); rendre();
  toast(`Créneau libéré — ${esc(refPatient(o) || 'le patient')} reste orienté vers ${esc(o.medecin || 'ce médecin')}`);
}

/* --- prévenir le médecin --------------------------------
   L'exigence de la coordination : un créneau posé ne vaut rien
   tant que le médecin ne le sait pas. La fenêtre rend donc son
   numéro, son courriel, et le message tout écrit. */
function messageConfirmation(s, o){
  const quand = libelleCreneau(s);
  return `Bonjour Docteur ${s.m.nom || ''},

La CPTS Pau Béarn vous adresse une personne évacuée des zones incendiées de Gironde, sur le créneau que vous avez proposé : ${quand}.

Motif : ${o.motif || 'à préciser'}.
Patient : ${refPatient(o) || '—'}${o.relais ? ` — signalée par ${o.relais}` : ''}.

La personne, ou la structure qui la suit, prendra contact avec votre secrétariat. Merci de nous prévenir si ce créneau ne convient plus.

Bien cordialement,
${moi === 'Anonyme' ? 'La coordination' : moi} — CPTS Pau Béarn`;
}

function ouvrirConfirmation(cle){
  const s = creneauDeCle(cle);
  if(!s) return toast("Ce créneau n'existe plus");
  const o = occupantDe(s);
  if(!o) return toast("Ce créneau n'est pas positionné");

  const msg = messageConfirmation(s, o);
  const tel = String(s.m.tel || '').trim();
  const mail = String(s.m.mail || '').trim();
  const sujet = `CPTS Pau Béarn — patient adressé le ${frdateL(s.d)}${s.h ? ' à ' + hFr(s.h) : ''}`;
  const lienMail = mail
    ? `mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(msg)}`
    : '';

  document.getElementById('modale').innerHTML = `<h3>Créneau positionné — prévenir le médecin</h3>
    <p style="margin:0 0 14px;color:var(--texte-2);font-size:13.5px">${esc(refPatient(o) || 'Le patient')} est posé sur le créneau de <strong>${esc(nomMed(s.m))}</strong>, ${esc(libelleCreneau(s))}. Il reste à le lui dire : sans cela, le rendez-vous n'existe que dans le cockpit.</p>

    <div class="contact-med">
      <div class="nm">${esc(nomMed(s.m))}</div>
      <div class="s">${[s.m.structure, s.m.commune].filter(Boolean).map(esc).join(' · ') || ''}</div>
      ${tel || mail ? `<div class="voies">
        ${tel ? `<a class="voie tel" href="tel:${esc(tel.replace(/[^0-9+]/g,''))}"><span class="k">Téléphone</span>${esc(tel)}</a>` : ''}
        ${mail ? `<a class="voie mail" href="${esc(lienMail)}"><span class="k">Courriel</span>${esc(mail)}</a>` : ''}
        ${s.m.rdv ? `<span class="voie"><span class="k">Prise de rendez-vous</span>${esc(s.m.rdv)}</span>` : ''}
      </div>` : `<div class="alerte-med">Ce médecin n'a ni téléphone ni courriel au registre. Complétez sa fiche avant de pouvoir le prévenir — sinon ce créneau ne sert à rien.</div>`}
    </div>

    <label style="margin:14px 0 0"><span class="k">Message tout prêt — à adapter</span>
      <textarea id="msg-conf" style="min-height:190px">${esc(msg)}</textarea></label>

    <div class="actions">
      ${mail ? `<a class="btn" href="${esc(lienMail)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Écrire au médecin</a>` : ''}
      <button class="btn${mail ? ' sec' : ''}" onclick="copierMessageConf()">Copier le message</button>
      ${(o.confirme || 'À confirmer') === 'À confirmer'
        ? `<button class="btn sec" onclick="marquerConfirme('${o.id}')" style="margin-left:auto;color:var(--stable);border-color:#BEDCCE">C'est confirmé avec le médecin</button>`
        : `<span class="etiq e-cours" style="margin-left:auto">${esc(o.confirme)}</span>`}
      <button class="btn sec" onclick="fermer()">Fermer</button>
    </div>`;
  document.getElementById('rideau').classList.add('on');
}

function copierMessageConf(){
  const t = document.getElementById('msg-conf');
  if(!t) return;
  const fini = () => toast("Message copié — collez-le dans votre SMS ou votre courriel");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(fini, () => { t.select(); toast("Sélectionnez le message à la main"); });
  }else{
    t.select();
    try{ document.execCommand('copy'); fini(); }catch(e){ toast("Sélectionnez le message à la main"); }
  }
}

async function marquerConfirme(pid){
  const o = (etat.orientes || []).find(x => x.id === pid); if(!o) return;
  o.confirme = 'Confirmé avec le médecin';
  o.modifiePar = moi;
  await sauver(); fermer(); rendre();
  toast("Créneau confirmé avec le médecin");
}

/* --- recueillir un patient ------------------------------
   Ce feuillet se remplit pendant l'appel, pas après : une
   pharmacie au téléphone, quelqu'un devant elle, et trente
   secondes pour noter. Le formulaire est à même la page — pas
   de fenêtre à ouvrir — et il commence par la seule question
   qui change la suite : cette personne cherche-t-elle un
   médecin, ou en a-t-elle déjà trouvé un. On ne fait pas
   défiler à quelqu'un des champs qui ne le concernent pas. */
const cleRelais = s => String(s||'').trim().toLowerCase();

/* La référence qui circule dans le reste du cockpit — agenda,
   exports, main courante. Elle se compose de l'identité saisie,
   et retombe sur ce qui a été noté à la main pour les lignes
   d'avant. Un âge en chiffres seuls s'écrit « 62 ans ». */
function refPatient(o){
  const age = String(o.age || '').trim();
  const nom = [String(o.prenom||'').trim(), String(o.nom||'').trim()].filter(Boolean).join(' ');
  const a = age ? (/^\d+$/.test(age) ? age + ' ans' : age) : '';
  return [nom, a].filter(Boolean).join(', ') || String(o.ref || '').trim();
}
const nomDeclarant = o => [String(o.decPrenom||'').trim(), String(o.decNom||'').trim()]
  .filter(Boolean).join(' ') || String(o.interlocuteur||'').trim();

function choisirVoie(v){ voieRecueil = v; rendre(); window.scrollTo(0,0); }

/* Les pastilles de suggestion écrivent dans le champ libre qui
   les surmonte, sans repasser par un rendu complet : ce qui est
   déjà tapé plus bas dans le formulaire ne doit pas s'effacer
   parce qu'on a touché un motif. Retoucher la même pastille la
   désélectionne — c'est le geste attendu quand on s'est trompé. */
function choisirSugg(cible, btn){
  const el = document.getElementById(cible); if(!el) return;
  const val = btn.dataset.v || '';
  const meme = el.value.trim() === val;
  el.value = meme ? '' : val;
  Array.prototype.forEach.call(btn.parentNode.children,
    b => b.classList.toggle('on', b === btn && !meme));
}
/* `val` allume d'emblée la pastille qui correspond à ce qui est déjà
   dans le champ : en modification, on voit ce qui avait été choisi. */
const pastilles = (cible, liste, cls, val) => `<div class="sugg ${cls||''}">${liste.filter(Boolean)
  .map(x => {
    const c = [cls === 'urg' && x === 'Non urgent' ? 'calme' : '', x === val ? 'on' : ''].filter(Boolean).join(' ');
    return `<button type="button" data-v="${esc(x)}"${c ? ` class="${c}"` : ''} onclick="choisirSugg('${cible}',this)">${esc(x)}</button>`;
  }).join('')}</div>`;

function feuilletRecueil(rel, vivier){
  const h = `<div class="note protection">
    <strong>Ce registre porte le nom des personnes.</strong> Il faut pouvoir rappeler quelqu'un et le nommer au médecin qui le prend : c'est pourquoi l'identité est demandée. Elle ne sort pas du cockpit, aucun élément clinique n'y est noté au-delà du motif, et le registre <strong>s'anonymise d'un geste</strong> une fois la crise passée. Le formulaire n'est pas une régulation médicale : devant une urgence vitale, on appelle le 15.
    <div class="pp">
      <span><span class="k">Ce qu'on demande</span>Qui est la personne, ce dont elle a besoin, si c'est urgent, et qui la signale.</span>
      <span><span class="k">Ce qu'on rend</span>Le nom et le numéro d'un généraliste volontaire — la personne est rappelée si elle a donné son accord.</span>
    </div>
  </div>`;

  const alerteVivier = !vivier.length
    ? `<div class="note"><strong style="color:var(--ambre)">Aucun médecin volontaire n'est encore recensé.</strong> Vous pouvez recueillir les demandes — elles ne pourront pas être fléchées tant que le vivier est vide. Ouvrez le recensement depuis le feuillet <a href="#" onclick="allerFeuilletOri('medecins');return false;">Médecins volontaires</a>.</div>` : '';

  if(voieRecueil === 'choix') return h + `<button class="retour-f" onclick="choisirVoie('')">‹ Fermer le recueil — revenir à la liste</button>

  <div class="carte">
    <h2>De quoi cette personne a-t-elle besoin&nbsp;?</h2>
    <p class="sous-f" style="margin:0 0 16px">C'est la seule question à trancher avant de saisir : la suite du formulaire en découle.</p>
    <div class="voies">
      <button onclick="choisirVoie('consulter')">
        <span class="t">Elle a besoin de consulter</span>
        <span class="d">Pas de médecin ici, ou pas de rendez-vous. La CPTS lui en cherche un dans le vivier des généralistes volontaires.</span>
      </button>
      <button onclick="choisirVoie('oriente')">
        <span class="t">Elle est déjà orientée</span>
        <span class="d">Un médecin la prend déjà en charge. Rien n'est à chercher : on enregistre la situation pour savoir ce que le territoire a absorbé.</span>
      </button>
    </div>
  </div>

  ${alerteVivier}`;

  return h + (voieRecueil === 'oriente' ? formulaireDejaOriente(rel, vivier)
                                        : formulaireAConsulter(rel, vivier));
}

/* Le bloc du signalant, identique dans les deux voies : qui
   nous a dit ça. Il vient toujours après le patient — au
   téléphone, on note d'abord la personne dont il est question. */
function blocDeclarant(rel){
  /* Les structures déjà recensées comme orientant sont proposées
     en premier : ce sont elles qui appellent le plus souvent, et
     les retaper à l'identique créerait des doublons. */
  const rang = r => r.demarche === 'Oui' ? 0 : r.info && r.info !== 'À informer' ? 1 : 2;
  const connues = [...new Map((rel||[])
    .filter(r => String(r.structure||'').trim())
    .sort((a,b) => rang(a) - rang(b) || (a.structure||'').localeCompare(b.structure||'','fr'))
    .map(r => [cleRelais(r.structure), r])).values()];
  return `<div class="sous-t">Qui signale cette personne
    <span class="d">La structure n'est pas obligatoire : un proche ou le patient lui-même peuvent appeler. Les structures déjà recensées comme orientant sont proposées dès les premières lettres ; une structure inconnue entre d'elle-même au feuillet « Structures qui orientent ».</span></div>
  <div class="form">
    <label><span class="k">Prénom</span><input id="rc-dec-prenom" autocomplete="off"></label>
    <label><span class="k">Nom</span><input id="rc-dec-nom" autocomplete="off"></label>
    <label class="large"><span class="k">Profession</span>
      <input id="rc-dec-prof" list="rc-prof-l" placeholder="Pharmacien, infirmier, secrétaire…" autocomplete="off">
      <datalist id="rc-prof-l">${ORI_PROFESSIONS.map(p => `<option value="${esc(p)}"></option>`).join('')}</datalist></label>
    <label class="large"><span class="k">Structure — facultatif</span>
      <input id="rc-relais" list="rc-relais-l" placeholder="Pharmacie de la Paix, CMSI de Billère…" autocomplete="off">
      <datalist id="rc-relais-l">${connues.map(r =>
        `<option value="${esc(r.structure)}">${esc([r.type, r.commune].filter(Boolean).join(' · '))}</option>`).join('')}</datalist></label>
    <label><span class="k">Type de structure</span>
      <select id="rc-provenance">${ORI_PROVENANCES.map(x => `<option ${x==='Pharmacie'?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
  </div>`;
}

/* Qui saisit. Le nom de la session est déjà là — on n'a rien à
   taper —, mais il reste modifiable : au cockpit, il arrive qu'on
   saisisse pour quelqu'un d'autre, et c'est alors son nom qui doit
   rester attaché à la ligne. */
function blocSignature(id, libelle){
  const noms = nomsMissionnes();
  return `<div class="form" style="margin-top:14px">
    <label class="large"><span class="k">${esc(libelle)}</span>
      <input id="${id}" list="${id}-l" value="${esc(moi === 'Anonyme' ? '' : moi)}" placeholder="Prénom et nom" autocomplete="off">
      <datalist id="${id}-l">${noms.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></label>
  </div>`;
}

/* Le bloc du patient, tête des deux formulaires. Le numéro y est
   la seule chose qui permette de rappeler quelqu'un : sans lui,
   une fois le médecin trouvé, on n'a plus personne à joindre — il
   faut rattendre que la pharmacie rappelle. Il n'est pas
   obligatoire, parce qu'un signalement sans numéro vaut toujours
   mieux qu'un signalement perdu. */
function blocPatient(){
  return `<div class="sous-t">Le patient
    <span class="d">Le nom permet de le rappeler et de le nommer au médecin. Le numéro est ce par quoi on le joint une fois le médecin trouvé. L'adresse dit à quelle distance chercher.</span></div>
  <div class="form">
    <label><span class="k">Nom *</span><input id="rc-nom" autocomplete="off"></label>
    <label><span class="k">Prénom</span><input id="rc-prenom" autocomplete="off"></label>
    <label><span class="k">Âge</span><input id="rc-age" inputmode="numeric" placeholder="62"></label>
    <label><span class="k">Téléphone</span>
      <input id="rc-tel" type="tel" inputmode="tel" placeholder="06 12 34 56 78" autocomplete="off"></label>
    <label><span class="k">Commune</span><input id="rc-commune" placeholder="Pau, Billère…" autocomplete="off"></label>
    <label class="large"><span class="k">Adresse où il se trouve</span>
      <input id="rc-adresse" placeholder="Chez un proche, hébergement collectif, adresse complète…" autocomplete="off"></label>
  </div>`;
}

/* Voie 1 — la personne cherche un médecin. */
function formulaireAConsulter(rel, vivier){
  return `<button class="retour-f" onclick="choisirVoie('choix')">‹ Ce n'est pas ça — revenir au choix</button>

  <div class="carte">
    <h2>Patient à faire consulter</h2>
    <p class="sous-f" style="margin:0 0 4px">La demande entre au registre sans médecin : le fléchage se fait ensuite, depuis le feuillet des patients, quand un créneau se libère.</p>

    ${blocPatient()}

      <span class="d">Touchez un motif fréquent, ou écrivez le vôtre.</span></div>

        <select id="rc-situation">${ORI_SITUATIONS.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label><span class="k">Délai souhaitable</span>

    ${blocDeclarant(rel)}

    <div style="margin-top:18px"><label class="coche">
      <input type="checkbox" id="rc-accord">
      <span>Le patient est d'accord pour être contacté
        <span class="d">Sans cet accord, la demande est enregistrée mais aucune coordonnée ne circule : on remet le nom et le numéro du médecin au patient, à lui d'appeler.</span></span>
    </label></div>

    ${blocSignature('rc-par', 'Recueilli par')}

    <div class="actions">
      <button class="btn" onclick="enregistrerRecueil()">Enregistrer ce patient</button>
