/* =========================================================
   COLLECTE DE MATÉRIEL
   L'onglet ne s'ouvre plus sur une liste mais sur un palier de
   cinq cartes : le formulaire de dons en ligne, le matériel
   collecté, les points de collecte, les professionnels
   volontaires et les besoins exprimés. Chacune dit ce qu'elle
   contient et où elle en est ; on entre dans l'une, et on revient
   au palier par le lien du haut.
   ========================================================= */
let moduleMat = '';           /* '' = le palier */
/* Ne sert plus qu'à distinguer les deux feuillets du module
   « Points de collecte » : les lieux, et les points tenus. */
let feuilletMat = 'stockage';
let donOuvert = null;
let filtreDon = 'Tout';
let filtreRenfort = 'Tout';

const REPCL = {'Oui':'oui', 'Non':'non', 'À rappeler':'att', 'En attente':'att'};
const REPET = {'Oui':'e-cours', 'Non':'e-bloque', 'À rappeler':'e-attente', 'En attente':'e-lancer'};

/* Entité réceptrice par défaut du bordereau. Modifiable dans le
   document avant impression : le point de livraison peut changer
   au fil des consignes de l'ARS. */
const RECEVEUR = {
  nom: "Parc des Expositions de Bordeaux — centre d'accueil et de regroupement",
  adresse: "Cours Charles Bricaud, 33300 Bordeaux",
  qualite: "Centre d'accueil des personnes évacuées, tenu par la Croix-Rouge française, la réserve citoyenne de Bordeaux Métropole et les communes"
};

function allerModuleMat(m){ moduleMat = m; donOuvert = null; rendre(); window.scrollTo(0,0); }

/* Un lien profond venu d'ailleurs — d'un autre onglet, d'une
   fiche — vise un feuillet, pas une carte. On ouvre le module qui
   le contient, et on s'y positionne. */
const MODULE_DU_FEUILLET = {dons:'dons', formulaire:'formulaire', points:'points',
                            stockage:'points', renforts:'renforts', besoins:'besoins'};
function allerFeuilletMat(f){
  if(f === 'points' || f === 'stockage') feuilletMat = f;
  allerModuleMat(MODULE_DU_FEUILLET[f] || '');
}
function filtrerDon(r){ filtreDon = r; rendre(); }

/* Depuis la carte du formulaire : les dépôts à vérifier se
   regardent dans le registre, qui est un autre module. */
function verifierDepots(){ filtreDon = 'Formulaire'; allerModuleMat('dons'); }
function ouvrirDon(id){ donOuvert = (donOuvert === id) ? null : id; rendre(); }

/* --- Formulaire public de don ---------------------------
   don.html vit à côté du cockpit et écrit dans la même
   rubrique « dons » par une porte de dépôt sans code d'accès.
   Le copil ouvre et ferme cette porte d'ici. */
const FORMULAIRE = 'don-de-materiel.html';
function lienFormulaire(){
  try{ return new URL(FORMULAIRE, location.href).href; }
  catch(e){ return FORMULAIRE; }
}

/* --- Ouvrir un formulaire : pour de vrai, ou pour voir ---
   Le même bouton sert à deux gestes qui n'ont rien à voir :
   lancer officiellement un recensement, et jeter un œil à la page
   pour vérifier qu'elle tourne. Seul celui qui clique sait lequel
   des deux il fait — on le lui demande donc, et la main courante
   ne retient que le premier. Une ouverture d'essai n'y laisse
   aucune trace, ni en s'ouvrant ni en se refermant : l'état
   retient qu'elle était un essai pour ne pas consigner sa
   fermeture. */
function demanderOuverture(o){
  return new Promise(res => {
    repondreOuv = res;
    document.getElementById('modale').innerHTML = `<h3>${esc(o.titre)}</h3>
      <p style="color:var(--texte-2);margin:0 0 12px;font-size:13.5px">${o.portee}</p>
      <div class="note" style="margin:0 0 16px">Répondre <strong>oui</strong> consigne l'ouverture en main courante : le formulaire est officiellement ouvert et la CPTS s'engage sur ce qu'il annonce. Répondre <strong>non</strong> ouvre la même page sans rien consigner — pour vérifier à quoi elle ressemble, et la refermer ensuite.</div>
      <p style="margin:0 0 4px;font-weight:600">Est-ce une ouverture officielle ?</p>
      <div class="actions">
        <button class="btn" onclick="repondreOuverture('officiel')">Oui — ouvrir et consigner</button>
        <button class="btn sec" onclick="repondreOuverture('essai')">Non — je teste seulement</button>
        <button class="btn sec" onclick="repondreOuverture('')" style="margin-left:auto">Annuler</button>
      </div>`;
    document.getElementById('rideau').classList.add('on');
  });
}
function repondreOuverture(r){
  const res = repondreOuv; repondreOuv = null;
  fermer();
  if(res) res(r || null);
}

/* La bascule est la même pour les trois formulaires publics :
   on demande à l'ouverture, on ne redemande rien à la fermeture —
   ce qui s'était ouvert en essai se referme en silence. Renvoie
   null si on a renoncé, sinon ce qui vient d'être fait. */
async function basculerFormulairePublic(cfg){
  const s = etat[cfg.cle] = etat[cfg.cle] || {ouverte:false};
  if(!s.ouverte){
    const r = await demanderOuverture({titre:cfg.titre, portee:cfg.portee});
    if(!r) return null;
    s.ouverte = true;
    s.officielle = (r === 'officiel');
    if(s.officielle) cfg.consigner(true);
    return {ouvre:true, officielle:s.officielle};
  }
  /* Un formulaire ouvert avant que la question ne soit posée est
     tenu pour officiel : sa fermeture se consigne. */
  const officielle = s.officielle !== false;
  s.ouverte = false; s.officielle = false;
  if(officielle) cfg.consigner(false);
  return {ouvre:false, officielle};
}

/* Ce qu'on affiche sur la carte d'un formulaire ouvert en essai :
   ouvert pour de bon aux yeux de qui a le lien, mais sans trace
   nulle part. Le laisser ainsi sans le savoir serait le pire des
   deux états. */
function bandeauEssai(s){
  return (s && s.ouverte && s.officielle === false)
    ? `<div class="note" style="margin:0 0 10px">Ouverture d'essai : rien n'a été consigné en main courante. Le formulaire répond pourtant à qui a le lien — refermez-le après vérification, ou refermez puis rouvrez-le officiellement.</div>`
    : '';
}
const etiqOuv = (s, ouvert) => !s.ouverte ? `<span class="etiq e-bloque">Fermé</span>`
  : s.officielle === false ? `<span class="etiq e-attente">Ouvert — essai</span>`
  : `<span class="etiq e-cours">${ouvert}</span>`;

async function basculerCollecte(){
  const r = await basculerFormulairePublic({
    cle:'collecte',
    titre:"Ouvrir la collecte de matériel",
    portee:"Le formulaire de don devient accessible à toute personne qui en a le lien. La doctrine de la CPTS est de n'ouvrir aucune collecte tant qu'un besoin écrit et un lieu de réception nommé ne sont pas validés.",
    consigner: consignerCollecteEnCourante
  });
  if(!r) return;
  await sauver(); rendre();
  toast(r.ouvre
    ? (r.officielle ? "Collecte ouverte — l'ouverture est consignée en main courante"
                    : "Collecte ouverte pour essai — rien n'est consigné")
    : (r.officielle ? "Collecte fermée — la fermeture est consignée en main courante"
                    : "Essai terminé — la collecte est refermée, rien n'a été consigné"));
}

/* Règle du cockpit : ce qui part de la CPTS se consigne en main
   courante, en plus de sa rubrique métier. */
function consignerCollecteEnCourante(ouvre){
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(), date: aujourdhui(), heure: maintenant(), source: '',
    evenement: ouvre
      ? "Ouverture de la collecte de matériel : le formulaire de don en ligne est accessible à qui en a le lien."
        + ((etat.collecte && etat.collecte.besoins) ? "\nBesoins annoncés : " + etat.collecte.besoins : '')
      : "Fermeture de la collecte de matériel : le formulaire de don n'accepte plus de déclaration.",
    suite: ouvre
      ? "Diffuser le lien du formulaire aux professionnels du territoire, canal par canal, et consigner chaque diffusion ici. Vérifier chaque déclaration reçue et organiser l'enlèvement avec le lieu de stockage."
      : "Prévenir les donateurs déjà déclarés de la suite donnée à leur don, et arrêter le compte de ce qui a été réellement déposé.",
    qui: moi,
    auteur: moi, quand: ''
  });
}

function editerCollecte(){
  const c = etat.collecte || {};
  document.getElementById('modale').innerHTML = `<h3>Textes du formulaire public</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Ces deux textes s'affichent sur don.html. Le premier quand la collecte est fermée, le second en tête du formulaire quand elle est ouverte.</p>
    <label style="margin-bottom:12px"><span class="k">Message affiché collecte fermée</span>
      <textarea id="co-message" placeholder="Ex. Une collecte sera peut-être ouverte en fin de semaine.">${esc(c.message||'')}</textarea></label>
    <label style="margin-bottom:12px"><span class="k">Besoins annoncés collecte ouverte</span>
      <textarea id="co-besoins" placeholder="Ex. masques FFP2, compresses stériles, sérum physiologique.">${esc(c.besoins||'')}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerCollecte()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerCollecte(){
  etat.collecte = etat.collecte || {ouverte:false};
  etat.collecte.message = document.getElementById('co-message').value.trim();
  etat.collecte.besoins = document.getElementById('co-besoins').value.trim();
  await sauver(); fermer(); rendre(); toast("Textes du formulaire mis à jour");
}

function copierLien(){
  const l = lienFormulaire();
  const fini = () => toast("Lien copié — collez-le dans le message aux adhérents");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(l).then(fini, () => toast("Copie impossible — sélectionnez le lien à la main"));
  }else{
    const i = document.getElementById('lien-don');
    if(i){ i.select(); try{ document.execCommand('copy'); fini(); }catch(e){ toast("Sélectionnez le lien à la main"); } }
  }
}

function carteFormulaire(){
  const c = etat.collecte || {};
  const aVerifier = (etat.dons||[]).filter(x => x.source === 'formulaire' && x.aVerifier).length;
  return `<div class="carte formulaire ${c.ouverte?'ouverte':''}">
    <div class="ligne-f">
      <div>
        <h2 style="margin-bottom:2px">Formulaire de don en ligne</h2>
        <p class="sous-f">Le professionnel déclare son don et accepte les conditions du bordereau depuis son téléphone. La ligne arrive ici, il repart avec son récapitulatif en PDF. Plus rien à imprimer ni à renvoyer.</p>
      </div>
      ${etiqOuv(c, 'Ouvert aux dépôts')}
    </div>
    ${bandeauEssai(c)}
    ${c.ouverte
      ? `<div class="lien-f">
           <input id="lien-don" readonly value="${esc(lienFormulaire())}" onclick="this.select()">
           <button class="btn sec" onclick="copierLien()">Copier le lien</button>
         </div>
         <p class="sous-f" style="margin:9px 0 0">Ce lien est à diffuser aux adhérents. Toute personne qui l'a peut déposer une proposition ; le cockpit, lui, reste protégé par son code d'accès.</p>`
      : `<div class="note" style="margin:0">Tant que la collecte est fermée, le formulaire affiche aux professionnels que la CPTS ne sollicite aucun don et refuse tout dépôt. C'est la position à tenir tant que l'ARS n'a pas transmis de besoin écrit et de lieu de réception.</div>`}
    <div class="actions">
      <button class="btn${c.ouverte?' sec':''}" onclick="basculerCollecte()">${c.ouverte?'Fermer la collecte':'Ouvrir la collecte'}</button>
      <button class="btn sec" onclick="editerCollecte()">Textes affichés</button>
      ${c.ouverte ? `<a class="btn sec" href="${esc(lienFormulaire())}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Voir le formulaire</a>` : ''}
      ${aVerifier ? `<button class="btn sec" onclick="verifierDepots()" style="margin-left:auto;color:var(--braise);border-color:#E8C3B8">${aVerifier} dépôt${aVerifier>1?'s':''} à vérifier</button>` : ''}
    </div>
  </div>`;
}

function vueCollecte(){
  if(moduleMat === 'formulaire') return moduleFormulaireDons();
  if(moduleMat === 'dons')       return moduleDons();
  if(moduleMat === 'points')     return modulePointsCollecte();
  if(moduleMat === 'renforts')   return teteModuleMat('Professionnels volontaires') + feuilletRenforts();
  if(moduleMat === 'besoins')    return teteModuleMat('Besoins exprimés') + feuilletBesoins();
  return vueModulesMat();
}

/* Le haut de tout module : le retour au palier, puis le nom de la
   carte dans laquelle on vient d'entrer. Pas de chapô — ce qui
   vient d'être lu sur la carte n'a pas à être relu, et sur un
   téléphone chaque paragraphe est un écran de défilement de plus
   avant la liste qu'on vient voir. */
function teteModuleMat(titre){
  return `<button class="retour-m" onclick="allerModuleMat('')">‹ Collecte de matériel</button>
  <h1 style="margin-bottom:14px">${titre}</h1>`;
}

/* Le palier : cinq cartes, chacune avec les deux ou trois
   chiffres qui disent où elle en est. On choisit en connaissance
   de cause, sans avoir à entrer. */
function vueModulesMat(){
  const d = etat.dons || [], s = etat.stockage || [], v = etat.renforts || [];
  const c = etat.collecte || {};
  const oui = d.filter(x => x.reponse === 'Oui').length;
  const att = d.filter(x => x.reponse !== 'Oui' && x.reponse !== 'Non').length;
  const parFormulaire = d.filter(x => x.source === 'formulaire').length;
  const aVerifier = d.filter(x => x.source === 'formulaire' && x.aVerifier).length;
  const pts = etat.points || [];
  const unites = pointsClotures().reduce((t,p) => t + synthesePoint(p).unites, 0);
  const prets = v.filter(x => x.statut === 'Confirmé' || x.statut === 'Affecté').length;
  const roulants = v.filter(x => x.statut !== 'Indisponible' && x.statut !== 'Sans suite').filter(aVehicule).length;
  const bes = (etat.materiel || []).length;

  return `<h1>Collecte de matériel</h1>
  <p class="chapo">Ce que la CPTS Pau Béarn demande au territoire, ce qu'on lui a déclaré, et ce qui a été réellement déposé. Cinq entrées : le formulaire qui recueille les déclarations, le registre de ce qui a été collecté, les lieux où le réunir, les volontaires qui font tourner la collecte, et les besoins exprimés par les structures touchées.</p>

  <div class="modules">
    <button class="module" onclick="allerModuleMat('formulaire')">
      <div class="titre-m">Formulaire de dons en ligne</div>
      <p class="sous-m">La porte par laquelle les pharmacies, les infirmiers et les autres professionnels déclarent ce qu'ils peuvent donner, depuis leur téléphone. C'est ici qu'on ouvre et qu'on ferme la collecte, et qu'on récupère le lien à diffuser.</p>
      <div class="chiffres">
        <div><strong>${c.ouverte ? 'Ouverte' : 'Fermée'}</strong> collecte</div>
        <div><strong>${parFormulaire}</strong> déclarations reçues</div>
        ${aVerifier ? `<div><strong style="color:var(--ambre)">${aVerifier}</strong> à vérifier</div>` : ''}
      </div>
      <div class="entrer">Ouvrir la carte →</div>
    </button>

    <button class="module" onclick="allerModuleMat('dons')">
      <div class="titre-m">Matériel collecté</div>
      <p class="sous-m">Le registre de tous ceux qui ont répondu — par le formulaire, par un appel qu'on a mené ou par une réponse reportée à la main : qui donne quoi, en quelle quantité, avec quel bordereau et vers quel lieu de stockage. Filtrable, exportable en Excel comme en PDF.</p>
      <div class="chiffres">
        <div><strong>${d.length}</strong> lignes au registre</div>
        <div><strong style="color:var(--stable)">${oui}</strong> accords</div>
        ${att ? `<div><strong style="color:var(--ambre)">${att}</strong> sans réponse ferme</div>` : ''}
      </div>
      <div class="entrer">Ouvrir la carte →</div>
    </button>

    <button class="module" onclick="allerModuleMat('points')">
      <div class="titre-m">Points de collecte</div>
      <p class="sous-m">Les lieux où l'on réunit le matériel : ceux qui sont repérés pour le stocker — adresse, horaires, personne qui détient les clés — et les permanences réellement tenues, dépôt par dépôt, avec leur récapitulatif signé.</p>
      <div class="chiffres">
        <div><strong>${s.length}</strong> lieux de stockage</div>
        <div><strong>${pts.length}</strong> point${pts.length>1?'s':''} tenu${pts.length>1?'s':''}</div>
        <div><strong style="color:var(--stable)">${unites}</strong> unités collectées</div>
      </div>
      <div class="entrer">Ouvrir la carte →</div>
    </button>

    <button class="module" onclick="allerModuleMat('renforts')">
      <div class="titre-m">Professionnels volontaires</div>
      <p class="sous-m">Les mains dont la collecte a besoin : tenir la permanence, trier, conditionner, charger, transporter. Ce ne sont pas les soignants volontaires pour partir en zone — ceux-là se recensent dans « Appel au renfort ».</p>
      <div class="chiffres">
        <div><strong>${v.length}</strong> volontaires</div>
        <div><strong style="color:var(--stable)">${prets}</strong> confirmés ou affectés</div>
        ${roulants ? `<div><strong>${roulants}</strong> avec véhicule</div>` : ''}
      </div>
      <div class="entrer">Ouvrir la carte →</div>
    </button>

    <button class="module" onclick="allerModuleMat('besoins')">
      <div class="titre-m">Besoins exprimés</div>
      <p class="sous-m">Ce que les structures touchées ont demandé, noir sur blanc, et qui fonde la collecte. Rien ne se collecte au-delà de ce qui est écrit ici.</p>
      <div class="chiffres">
        <div><strong>${bes}</strong> besoin${bes>1?'s':''} consigné${bes>1?'s':''}</div>
      </div>
      <div class="entrer">Ouvrir la carte →</div>
    </button>
  </div>`;
}

/* Carte 1 — le formulaire, et rien d'autre : on l'ouvre, on le
   ferme, on copie le lien. Les déclarations qu'il rapporte se
   lisent dans le registre, qui est la carte suivante. */
function moduleFormulaireDons(){
  return teteModuleMat('Formulaire de dons en ligne')
    + carteFormulaire()
    + `<div class="note">Ouvrir la collecte crée une attente chez les professionnels du territoire : on ne l'ouvre qu'au moment de diffuser l'appel, et seulement une fois le besoin écrit et le lieu de réception connus. Ce qui arrive par ce formulaire se retrouve au registre, dans <a href="#" onclick="allerModuleMat('dons');return false;">Matériel collecté</a>.</div>`;
}

/* Carte 3 — les lieux : ceux qui peuvent stocker, et ceux où une
   permanence a été réellement tenue. */
function modulePointsCollecte(){
  const s = etat.stockage || [], pts = etat.points || [];
  if(feuilletMat !== 'points') feuilletMat = 'stockage';
  return teteModuleMat('Points de collecte')
    + `<nav class="feuillets">
    <span class="k">Points de collecte — 2 feuillets</span>
    <div class="rangee">
      <button class="${feuilletMat==='stockage'?'on':''}" onclick="allerFeuilletMat('stockage')">Lieux de stockage <span class="n">${s.length}</span></button>
      <button class="${feuilletMat==='points'?'on':''}" onclick="allerFeuilletMat('points')">Permanences tenues <span class="n">${pts.length}</span></button>
    </div>
  </nav>`
    + (feuilletMat === 'points' ? feuilletPoints() : feuilletStockage());
}

/* Carte 2 — le registre des donateurs. */
function moduleDons(){
  const d = etat.dons || [];
  const oui = d.filter(x => x.reponse === 'Oui').length;
  const non = d.filter(x => x.reponse === 'Non').length;
  const att = d.length - oui - non;
  const taux = (oui + non) ? Math.round(oui * 100 / (oui + non)) : 0;
  const pc = n => d.length ? (n * 100 / d.length) : 0;

  let h = teteModuleMat('Matériel collecté');
  h += carteDernierPoint();

  const parFormulaire = d.filter(x => x.source === 'formulaire').length;
  const parSaisie = d.filter(x => x.source === 'saisie').length;

  h += `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${d.length}</div><div class="l">structures contactées ou déclarées</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${oui}</div><div class="l">ont accepté de donner</div></div>
    <div class="compteur"><div class="n" style="color:var(--braise)">${non}</div><div class="l">ont refusé ou n'ont rien</div></div>
    <div class="compteur"><div class="n" style="color:var(--ambre)">${att}</div><div class="l">en attente ou à rappeler</div></div>
    <div class="compteur"><div class="n">${taux}&thinsp;%</div><div class="l">d'accord parmi les réponses obtenues</div></div>
    <div class="compteur"><div class="n">${d.filter(x=>x.reponse==='Oui'&&BORDEREAU_ACQUIS.indexOf(x.bordereau)>=0).length}</div><div class="l">bordereaux signés ou engagés en ligne</div></div>
    ${parFormulaire ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parFormulaire}</div><div class="l">reçus par le formulaire</div></div>` : ''}
    ${parSaisie ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parSaisie}</div><div class="l">réponses reportées à la main</div></div>` : ''}
  </div>`;

  if(d.length){
    h += `<div class="jauge">
      <i class="oui" style="width:${pc(oui)}%"></i>
      <i class="non" style="width:${pc(non)}%"></i>
      <i class="att" style="width:${pc(att)}%"></i>
    </div>
    <div class="jl">
      <span><i class="oui"></i>${oui} accord${oui>1?'s':''}</span>
      <span><i class="non"></i>${non} refus</span>
      <span><i class="att"></i>${att} sans réponse ferme</span>
    </div>`;
  }

  h += `<div class="barre-h">
    <span class="cpt-h">${d.length} ligne${d.length>1?'s':''} au registre</span>
    <button class="btn sec" onclick="exporterCSV('dons')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn sec" onclick="bordereau()">Bordereau de don officiel</button>
    <button class="btn sec" onclick="ouvrirAjout('dons','manuel')">Reporter une réponse</button>
    <button class="btn" onclick="ouvrirAjout('dons')">Consigner un appel</button>
  </div>`;

  const LIB_SRC = {Formulaire:'Reçus par formulaire', Saisie:'Reportés à la main'};
  const compte = r => r === 'Formulaire' ? parFormulaire
    : r === 'Saisie' ? parSaisie
    : d.filter(x => x.reponse === r).length;
  const reps = ['Tout','Oui','Non','En attente','À rappeler']
    .concat(parFormulaire ? ['Formulaire'] : [])
    .concat(parSaisie ? ['Saisie'] : []);
  if(d.length) h += `<div class="filtres">${reps.map(r =>
    `<button class="${filtreDon===r?'on':''}" onclick="filtrerDon('${r}')">${LIB_SRC[r] || esc(r)}${r!=='Tout'?` <span style="opacity:.6">${compte(r)}</span>`:''}</button>`).join('')}</div>`;

  let vus = filtreDon === 'Tout' ? [...d]
    : filtreDon === 'Formulaire' ? d.filter(x => x.source === 'formulaire')
    : filtreDon === 'Saisie' ? d.filter(x => x.source === 'saisie')
    : d.filter(x => x.reponse === filtreDon);
  vus.sort((a,b) => ((b.date||'')+' '+(b.heure||'')).localeCompare((a.date||'')+' '+(a.heure||'')));

  if(!vus.length){
    return h + `<div class="carte"><p class="vide">${d.length
      ? "Aucune ligne dans ce filtre."
      : "Registre vide. Il se remplit de deux façons : consigner un appel qu'on a mené, ou reporter une réponse arrivée autrement — une réponse au formulaire Google, un message reçu."}</p></div>`;
  }

  h += `<div class="dons">`;
  vus.forEach(o => {
    const cl = REPCL[o.reponse] || 'att';
    const ouvertx = donOuvert === o.id;
    h += `<div class="don ${cl}">
      <button class="tete" onclick="ouvrirDon('${o.id}')" aria-expanded="${ouvertx}">
        <span class="qd">${frdate(o.date)}<br>${esc(o.heure||'—')}</span>
        <span class="ident">
          <span class="n">${esc(o.structure)}${o.source === 'formulaire'
            ? `<span class="src-f">Formulaire</span>${o.aVerifier ? `<span class="src-f neuf">À vérifier</span>` : ''}`
            : o.source === 'saisie'
            ? `<span class="src-f saisie">Saisie à la main</span>`
            : ''}</span>
          <span class="s">${[o.type, o.commune, o.interlocuteur].filter(Boolean).map(esc).join(' · ') || '—'}</span>
        </span>
        <span class="par">${o.source === 'formulaire' ? 'Déclaré par'
            : o.source === 'saisie' ? 'Réponse de'
            : 'Appel mené par'}<br><b>${esc(o.source === 'formulaire' ? (o.interlocuteur || 'le donateur')
            : o.source === 'saisie' ? (o.interlocuteur || o.origine || 'le donateur')
            : (o.par || o.auteur || '—'))}</b></span>
        <span class="etiq ${REPET[o.reponse]||'e-lancer'}">${esc(o.reponse||'En attente')}</span>
        ${o.reponse === 'Oui'
          ? (o.materiel
              ? `<span class="mat">${esc(o.materiel)}${o.quantite?' — '+esc(o.quantite):''}</span>`
              : `<span class="manque">Nature du matériel à renseigner</span>`)
          : ''}
        <span class="chev">${ouvertx?'▲':'▼'}</span>
      </button>`;

    if(ouvertx) h += detailDon(o);
    h += `</div>`;
  });
  return h + `</div>`;
}

/* Panneau dépliant : la case « nature du matériel » n'apparaît
   que lorsque la structure a dit oui. */
function detailDon(o){
  const lieux = ['', ...(etat.stockage||[]).map(s => s.nom)];
  if(o.lieu && lieux.indexOf(o.lieu) === -1) lieux.push(o.lieu);
  const sel = (v, arr) => arr.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  let h = `<div class="detail">`;

  /* Ce que le donateur a déclaré lui-même n'est pas modifiable
     d'un clic : c'est la pièce qui fait foi. On l'affiche telle
     quelle, et la correction passe par « Modifier la fiche ». */
  if(o.source === 'formulaire'){
    const e = o.engagement || {};
    h += `<div class="declaration">
      <div class="dt">Déclaration reçue par le formulaire en ligne</div>
      <div class="dc">
        ${[['Adresse', o.adresse], ['Courriel', o.mail], ['Qualité du représentant', e.qualite],
           ['Disponible à partir de', o.dispo], ['Volume approximatif', o.quantite]]
          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Aucun élément complémentaire déclaré</span></div>`}
      </div>
      ${(o.lignes||[]).length ? `<table class="dl"><thead><tr><th>Désignation</th><th>Quantité</th><th>État</th><th>Observations</th></tr></thead>
        <tbody>${o.lignes.map(l => `<tr><td>${esc(l.designation||'')}</td><td>${esc(l.quantite||'')}</td><td>${esc(l.etat||'')}</td><td>${esc(l.obs||'')}</td></tr>`).join('')}</tbody></table>` : ''}
      ${o.note ? `<div class="dn"><span class="k">Précisions à l'enlèvement</span>${esc(o.note)}</div>` : ''}
      ${e.le ? `<div class="de">Conditions du bordereau acceptées le ${frdateL(e.le)} à ${esc(String(e.le).slice(11,16))} par ${esc(e.nom||'—')}${e.qualite?', '+esc(e.qualite):''}. Cette acceptation tient lieu de signature de l'entité donneuse.</div>` : ''}
    </div>`;
  }

  /* Une ligne reportée à la main n'engage pas la CPTS de la même
     façon qu'un appel : on rappelle d'où vient la réponse et qui
     l'a recopiée, sans quoi la ligne n'est plus vérifiable. */
  if(o.source === 'saisie'){
    h += `<div class="declaration">
      <div class="dt">Réponse reportée à la main au registre</div>
      <div class="dc">
        ${[['Provenance', o.origine], ['Personne qui a répondu', o.interlocuteur],
           ['Courriel', o.mail], ['Adresse', o.adresse]]
          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Provenance non précisée</span></div>`}
      </div>
      <div class="de">Reportée par ${esc(o.auteur || '—')}${o.quand ? ' le ' + frdateL(String(o.quand).slice(0,10)) : ''}. Cette ligne n'a pas fait l'objet d'un appel de la CPTS.</div>
    </div>`;
  }

  h += `<div class="form">
    <label><span class="k">Réponse à la collecte</span>
      <select onchange="majDon('${o.id}','reponse',this.value)">${sel(o.reponse||'En attente', ['En attente','Oui','Non','À rappeler'])}</select></label>
    <label><span class="k">Téléphone</span>

    <label><span class="k">Enlèvement</span>
      <select onchange="majDon('${o.id}','retrait',this.value)">${sel(o.retrait||'À organiser', ['À organiser','Planifié','Collecté','Remis au receveur','Sans objet'])}</select></label>
    <label><span class="k">Bordereau de don</span>
      <select onchange="majDon('${o.id}','bordereau',this.value)">${sel(o.bordereau||'Non', BORDEREAU_ETATS)}</select></label>`;
  }

  h += `<label class="large"><span class="k">Observation</span>
      <textarea onchange="majDon('${o.id}','note',this.value)">${esc(o.note||'')}</textarea></label>
  </div>`;

  const su = antechrono(o.suivi);
  h += `<div class="suivi">
    <span class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:7px">Relances et suites</span>
    ${su.length ? su.map(x => `<div class="e">
        <div class="q">${frdate(x.date)} ${esc(x.heure||'')} · ${esc(x.par||'—')}
          <button title="Supprimer" onclick="supprimerSuiviDon('${o.id}','${x.id}')">×</button></div>
        <div class="d">${esc(x.texte)}</div>
      </div>`).join('') : `<p class="vide" style="padding:0;font-size:13px">Aucune relance consignée.</p>`}
  </div>
  <div class="bas">
    ${o.aVerifier ? `<button class="btn" onclick="verifierDon('${o.id}')">Marquer comme vérifié</button>` : ''}
    <button class="btn sec" onclick="ouvrirSuiviDon('${o.id}')">Consigner une relance</button>
    ${o.reponse === 'Oui' ? `<button class="btn${o.aVerifier?' sec':''}" onclick="bordereau('${o.id}')">Éditer le bordereau${o.source==='formulaire'?' pré-rempli':' de don'}</button>` : ''}
    <button class="retirer" onclick="ouvrirEdition('dons','${o.id}')">Modifier la fiche</button>
    <button class="retirer sup" onclick="supprimer('dons','${o.id}')">Retirer</button>
  </div></div>`;
  return h;
}

async function majDon(id, champ, val){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  if(champ === 'reponse' && val === 'Oui' && !o.retrait) o.retrait = 'À organiser';
  await sauver(); rendre();
}

/* Un dépôt arrivé par le formulaire attend qu'un membre du copil
   l'ait lu : c'est ce qui distingue « reçu » de « pris en charge ». */
async function verifierDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  delete o.aVerifier;
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:aujourdhui(), heure:maintenant(), texte:"Déclaration en ligne vérifiée par la coordination.", par:moi});
  o.modifiePar = moi;
  await sauver(); rendre(); toast("Dépôt vérifié");
}

function ouvrirSuiviDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(o.structure)} — relance</h3><div class="form">
    <label><span class="k">Date</span><input type="date" id="sd-date" value="${aujourdhui()}"></label>
    <label><span class="k">Heure</span><input type="time" id="sd-heure" value="${maintenant()}"></label>
    <label class="large"><span class="k">Ce qui a été dit ou fait *</span><textarea id="sd-texte" placeholder="Rappel effectué, matériel préparé, enlèvement convenu…"></textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerSuiviDon('${o.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerSuiviDon(id){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  const g = k => document.getElementById('sd-'+k).value.trim();
  if(!g('texte')){ toast("Indiquez ce qui a été dit"); return; }
  o.suivi = o.suivi || [];
  o.suivi.unshift({id:uid(), date:g('date'), heure:g('heure'), texte:g('texte'), par:moi});
  o.modifiePar = moi;
  donOuvert = o.id;
  await sauver(); fermer(); rendre(); toast("Relance consignée");
}
async function supprimerSuiviDon(id, sid){
  const o = (etat.dons||[]).find(x => x.id === id); if(!o) return;
  o.suivi = (o.suivi||[]).filter(x => x.id !== sid);
  await sauver(); rendre(); toast("Relance supprimée");
}

/* ---------- volontaires de la collecte ------------------
   Une collecte tient sur des mains : quelqu'un pour tenir la
   permanence, quelqu'un pour trier, quelqu'un qui a un
   utilitaire. Ce feuillet les recense et dit qui fait quoi.
   Il ne recense pas les soignants volontaires pour partir en
   renfort : ceux-là relèvent de l'onglet Volontaires, où le
   cadre — assurance, statut, continuité des soins — n'est pas
   le même. */
const RENFORT_ORDRE = {'Affecté':0, 'Confirmé':1, 'Proposé':2, 'Indisponible':3, 'Sans suite':4};
const RENFORT_ETIQ  = {'Affecté':'e-cours', 'Confirmé':'e-cours', 'Proposé':'e-attente',
                       'Indisponible':'e-bloque', 'Sans suite':'e-fini'};

const listeTaches = o => String(o.taches || '').split(',').map(x => x.trim()).filter(Boolean);
const aVehicule = o => o.vehicule && o.vehicule !== 'Aucun';

function filtrerRenfort(i){
  filtreRenfort = i === -1 ? 'Tout' : i === -2 ? 'Véhicule' : TACHES[i];
  rendre();
}

async function majRenfort(id, champ, val){
  const o = (etat.renforts||[]).find(x => x.id === id); if(!o) return;
  o[champ] = val.trim ? val.trim() : val;
  o.modifiePar = moi;
  await sauver(); rendre();
}

/* Les tâches se cochent depuis la fiche : c'est ce qui change le
   plus souvent, au fil des disponibilités de chacun. Elles sont
   rangées dans un seul champ texte, lisible tel quel à l'export
   comme dans le dossier de traçabilité. */
async function basculerTache(id, i){
  const o = (etat.renforts||[]).find(x => x.id === id); if(!o) return;
  const t = TACHES[i], l = listeTaches(o), j = l.indexOf(t);
  if(j >= 0) l.splice(j, 1); else l.push(t);
  o.taches = TACHES.filter(x => l.indexOf(x) >= 0)
    .concat(l.filter(x => TACHES.indexOf(x) === -1)).join(', ');
  o.modifiePar = moi;
  await sauver(); rendre();
}

  vus.sort((a,b) => (RENFORT_ORDRE[a.statut] ?? 2) - (RENFORT_ORDRE[b.statut] ?? 2)
    || (a.nom||'').localeCompare(b.nom||'','fr'));

  if(!vus.length) return h + `<div class="carte"><p class="vide">Aucun volontaire dans ce filtre.</p></div>`;

  h += `<div class="stocks">`;
  vus.forEach(o => {
    const cl = (o.statut === 'Confirmé' || o.statut === 'Affecté') ? 'confirme'
      : (o.statut === 'Indisponible' || o.statut === 'Sans suite') ? 'ecarte' : '';
    const t = listeTaches(o);
    h += `<div class="stock ${cl}">

            `<option ${x===(o.statut||'Proposé')?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <div class="bl"><span class="k">Ce qu'il ou elle peut faire</span>

        ${o.mail ? `<a class="adr" href="mailto:${esc(o.mail)}">${esc(o.mail)}</a>` : ''}
      </div>
      <div style="display:flex;gap:7px">

/* =========================================================
   POINTS DE COLLECTE

   Une permanence tenue quelque part, un soir, par quelqu'un de
   nommé, et ce qui en est ressorti. C'est la pièce qui atteste
   de ce que la CPTS a réellement réuni — à distinguer du
   registre des donateurs, qui recense ce qui a été annoncé.

   Rien de ce qui est chiffré ici n'est saisi deux fois : les
   totaux, la synthèse par type de matériel et le nombre de
   déposants se recalculent depuis les lignes de dépôt. Le
   récapitulatif imprimable en sort tel quel, et le document
   signé sur place se joint au point comme pièce.
   ========================================================= */

const CAT_MAT = ['Dispositif médical', 'Consommable', 'Autre'];
const MAT_SUGGERES = ['Thermomètre','Hémoglucotest','Tensiomètre','Saturomètre','Stéthoscope',
                      'Masques FFP2','Gel hydroalcoolique'];
/* La désignation courante suffit à l'écran ; le document, lui,
   nomme le dispositif en toutes lettres. */
const MAT_PRECISION = {'Hémoglucotest':'lecteur de glycémie', 'Saturomètre':'oxymètre de pouls'};
/* Deux dispositifs de mesure ont été demandés sous ces deux noms
   par le site de Bordeaux : on range par défaut ce qui entre. */
const CAT_PAR_DEFAUT = {'Masques FFP2':'Consommable', 'Gel hydroalcoolique':'Consommable'};

const lignesPoint = p => Array.isArray(p.lignes) ? p.lignes : [];
const qte = l => { const n = parseFloat(String(l.quantite).replace(',','.')); return isFinite(n) ? n : 0; };
const nomMat = m => m + (MAT_PRECISION[m] ? ' (' + MAT_PRECISION[m] + ')' : '');

/* Une seule lecture des lignes, tout le monde s'en sert : les
   cartes, le document, la main courante et les exports. */
function synthesePoint(p){
  const lig = lignesPoint(p);
  const mats = new Map();
  const deps = new Map();
  lig.forEach(l => {
    const m = (l.materiel || '').trim(); if(!m) return;
    const cat = l.categorie || CAT_PAR_DEFAUT[m] || 'Dispositif médical';
    if(!mats.has(m)) mats.set(m, {materiel:m, categorie:cat, quantite:0, deposants:new Set()});
    const e = mats.get(m);
    e.quantite += qte(l);
    if(l.deposant) e.deposants.add(l.deposant.trim());
    const d = (l.deposant || '').trim();
    if(d && !deps.has(d)) deps.set(d, {deposant:d, qualite:l.qualite || '', lignes:[]});
    if(d) deps.get(d).lignes.push(l);
  });
  const parMat = [...mats.values()]
    .map(e => ({...e, deposants: e.deposants.size}))
    .sort((a,b) => (CAT_MAT.indexOf(a.categorie) - CAT_MAT.indexOf(b.categorie)) || (b.quantite - a.quantite));
  const parCat = CAT_MAT.map(c => ({
    categorie: c,
    quantite: parMat.filter(m => m.categorie === c).reduce((s,m) => s + m.quantite, 0),
    types: parMat.filter(m => m.categorie === c).length
  })).filter(c => c.types);
  return {
    lignes: lig.length,
    deposants: [...deps.values()],
    unites: parMat.reduce((s,m) => s + m.quantite, 0),
    parMat, parCat
  };
}

const pointsClotures = () => (etat.points||[]).filter(p => p.statut === 'Clôturé');
function pointsTries(){
  return [...(etat.points||[])].sort((a,b) =>
    ((b.date||'') + ' ' + (b.debut||'')).localeCompare((a.date||'') + ' ' + (a.debut||'')));
}

/* --- Pièces jointes -------------------------------------
   Le récapitulatif signé sur place, la photo d'un bordereau : le
   fichier part sur l'hébergement par une porte à part, et le
   point n'en garde que le nom. Il ne transite jamais par l'état
   partagé, que chaque poste relit en entier toutes les quinze
   secondes. */
const PIECE_MAX_MO = 4;
function lienPiece(idp){ return API + '?piece=' + encodeURIComponent(idp) + '&code=' + encodeURIComponent(codeAcces); }
const poids = o => o < 1024 ? o + ' o' : o < 1048576 ? Math.round(o/1024) + ' Ko' : (o/1048576).toFixed(1).replace('.',',') + ' Mo';

function choisirPiece(id){
  if(!modeServeur){ toast("Le serveur ne répond pas : une pièce ne peut être jointe que depuis le cockpit partagé"); return; }
  const i = document.getElementById('pj-' + id);
  if(i) i.click();
}
async function joindrePiece(id, input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  if(f.size > PIECE_MAX_MO * 1000000){ toast("Fichier trop lourd — " + PIECE_MAX_MO + " Mo au maximum"); return; }
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  toast("Envoi de « " + f.name + " »…");
  const lu = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => res('');
    r.readAsDataURL(f);
  });
  if(!lu){ toast("Fichier illisible"); return; }
  let r;
  try{
    r = await fetch(API + '?piece', {
      method: 'POST',
      headers: {'X-Code-Acces': codeAcces, 'Content-Type': 'application/json'},
      body: JSON.stringify({nom: f.name, donnees: lu, par: moi})
    });
  }catch(e){ toast("Serveur injoignable — la pièce n'a pas été envoyée"); return; }
  let d = null;
  try{ d = await r.json(); }catch(e){}
  if(!r.ok || !d || !d.id){ toast((d && d.erreur) || "Envoi impossible"); return; }
  p.pieces = Array.isArray(p.pieces) ? p.pieces : [];
  p.pieces.push({id:d.id, nom:d.nom, taille:d.taille, le:d.le, par:moi});
  p.modifiePar = moi;
  await sauver(); rendre();
  toast("« " + d.nom + " » joint au point de collecte");
}
async function retirerPiece(id, idp){
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  const pc = (p.pieces||[]).find(x => x.id === idp);
  if(!confirm("Retirer « " + ((pc && pc.nom) || 'cette pièce') + " » ? Le fichier est supprimé de l'hébergement.")) return;
  try{
    await fetch(API + '?piece=' + encodeURIComponent(idp), {
      method: 'POST',
      headers: {'X-Code-Acces': codeAcces, 'Content-Type': 'application/json'},
      body: JSON.stringify({supprimer: true})
    });
  }catch(e){}
  p.pieces = (p.pieces||[]).filter(x => x.id !== idp);
  p.modifiePar = moi;
  await sauver(); rendre(); toast("Pièce retirée");
}

/* --- Le feuillet ---------------------------------------- */
function feuilletPoints(){
  const pts = pointsTries();
  const clos = pointsClotures();
  const total = clos.reduce((s,p) => s + synthesePoint(p).unites, 0);
  const deposants = new Set();
  clos.forEach(p => synthesePoint(p).deposants.forEach(d => deposants.add(d.deposant.toLowerCase())));

  let h = `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${pts.length}</div><div class="l">point${pts.length>1?'s':''} de collecte tenu${pts.length>1?'s':''}</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${total}</div><div class="l">unités collectées, tous points confondus</div></div>
    <div class="compteur"><div class="n">${deposants.size}</div><div class="l">déposants distincts</div></div>
    <div class="compteur"><div class="n">${clos.length}</div><div class="l">point${clos.length>1?'s':''} clôturé${clos.length>1?'s':''}</div></div>
  </div>
  <div class="note">Un point de collecte se clôture par un <strong>récapitulatif</strong> : ce qui a été déposé, par qui, en quelles quantités, et à quelle heure la permanence a fermé. Les totaux ne se saisissent pas — ils se recalculent à partir des lignes de dépôt, pour qu'un chiffre annoncé ne puisse jamais diverger du détail qui le compose. Le <strong>document signé sur place</strong> se joint au point : il est conservé sur l'hébergement, à côté du cockpit, et suit la copie transmise au site destinataire.</div>
  <div class="barre-h">
    <span class="cpt-h">${pts.length} point${pts.length>1?'s':''} · ${total} unité${total>1?'s':''}</span>
    <button class="btn sec" onclick="exporterPoints()">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirPoint()">Ouvrir un point de collecte</button>
  </div>`;

  if(!pts.length) return h + `<div class="carte"><p class="vide">Aucun point de collecte enregistré. Ouvrez-en un dès que le lieu et le créneau sont arrêtés : les dépôts s'y consignent au fil de l'eau, et la clôture produit le récapitulatif.</p></div>`;

  h += `<div class="pcs">`;
  pts.forEach(p => {
    const s = synthesePoint(p);
    const clot = p.statut === 'Clôturé';
    h += `<div class="pc ${clot?'clos':''}">
      <div class="tete">
        <div class="id">
          <div class="n">${esc(p.lieu || 'Point de collecte')}</div>
          <div class="s">${[frdateL(p.date),
             (p.debut || p.fin) ? (esc(p.debut||'—') + ' – ' + esc(p.fin||'—')) : '',
             p.adresse ? esc(p.adresse) : ''].filter(Boolean).join(' · ')}</div>
        </div>
        <span class="etiq ${clot?'e-fini':'e-cours'}">${esc(p.statut || 'Ouvert')}</span>
      </div>
      <div class="chiffres">
        <div><div class="v">${s.lignes}</div><div class="l">lignes de dépôt</div></div>
        <div><div class="v">${s.deposants.length}</div><div class="l">déposants distincts</div></div>
        <div><div class="v">${s.unites}</div><div class="l">unités collectées</div></div>
        <div class="${p.colis?'':'manque'}"><div class="v">${esc(p.colis || '—')}</div><div class="l">colis / cartons</div></div>
        <div><div class="v">${esc(p.cloture || '—')}</div><div class="l">heure de clôture</div></div>
      </div>
      ${s.parMat.length ? `<div class="synth">${s.parMat.map(m =>
        `<span class="${m.categorie==='Dispositif médical'?'':'conso'}"><b>${m.quantite}</b> ${esc(m.materiel)}<span style="opacity:.6"> · ${m.deposants} dépos.</span></span>`).join('')}</div>` : ''}
      ${p.responsable ? `<div class="bl"><span class="k">Responsable sur place</span>${esc(p.responsable)}</div>` : `<div class="obs">Responsable sur place à nommer.</div>`}
      ${p.equipe ? `<div class="bl"><span class="k">Avec</span>${esc(p.equipe)}</div>` : ''}
      ${p.destination ? `<div class="bl"><span class="k">Destination</span>${esc(p.destination)}${p.acheminement ? ' — ' + esc(p.acheminement) : ''}</div>` : `<div class="obs">Destination du matériel à nommer : aucun enlèvement sans lieu de livraison.</div>`}
      ${p.observations ? `<div class="obs">${esc(p.observations)}</div>` : ''}
      ${(p.pieces||[]).length
        ? `<div class="pieces">${p.pieces.map(x => `<div class="piece">
             <a href="${esc(lienPiece(x.id))}" target="_blank" rel="noopener">${esc(x.nom)}</a>
             <span class="q">${esc(poids(x.taille||0))}${x.par ? ' · déposé par ' + esc(x.par) : ''}</span>
             <button onclick="retirerPiece('${p.id}','${x.id}')" title="Retirer la pièce">✕</button>
           </div>`).join('')}</div>`
        : `<div class="sanspiece">Aucune pièce jointe. Le récapitulatif signé sur place, ou sa photo, se joint ici : c'est lui qui fait foi auprès du site destinataire.</div>`}
      <input type="file" id="pj-${p.id}" style="display:none"
        accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.csv,.xlsx,.docx" onchange="joindrePiece('${p.id}', this)">
      <div class="actions">
        <button class="btn" onclick="recapPoint('${p.id}')">Récapitulatif</button>
        <button class="btn sec" onclick="choisirPiece('${p.id}')">Joindre une pièce</button>
        <button class="btn sec" onclick="ouvrirPoint('${p.id}')">Modifier ${clot ? '' : 'et consigner les dépôts'}</button>
        ${clot ? '' : `<button class="btn sec" onclick="cloturerPoint('${p.id}')">Clôturer</button>`}
        <button class="btn sec" onclick="supprimerPoint('${p.id}')" style="margin-left:auto">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

/* Rappel du dernier point clôturé en tête du registre des
   donateurs : c'est le résultat de la journée, il ne se cherche
   pas dans un feuillet. */
function carteDernierPoint(){
  const p = pointsTries().filter(x => x.statut === 'Clôturé')[0];
  if(!p) return '';
  const s = synthesePoint(p);
  return `<div class="carte" style="border-left:4px solid var(--stable)">
    <div class="ligne-f" style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px">
      <div style="flex:1;min-width:240px">
        <h2 style="margin-bottom:2px">${esc(p.lieu)} — clôturé${p.cloture ? ' à ' + esc(p.cloture) : ''}</h2>
        <p style="font-size:13px;color:var(--texte-2);margin:0"><strong>${s.unites} unités</strong> déposées par <strong>${s.deposants.length} déposants</strong> en ${s.lignes} lignes, le ${frdateL(p.date)}${p.destination ? ' — destination : ' + esc(p.destination) : ''}.</p>
      </div>
      <span class="etiq e-fini">Point clôturé</span>
    </div>
    <div class="actions" style="margin-top:0">
      <button class="btn sec" onclick="allerFeuilletMat('points')">Voir le point de collecte</button>
      <button class="btn sec" onclick="recapPoint('${p.id}')">Récapitulatif</button>
    </div>
  </div>`;
}

/* --- Saisie ---------------------------------------------
   Les lignes de dépôt se tiennent à part le temps de la saisie :
   elles ne rejoignent le point qu'à l'enregistrement. */
let lignesSaisie = [];

function ligneDepotHTML(l, i){
  return `<tr>
    <td><input value="${esc(l.deposant||'')}" placeholder="Nom ou structure" oninput="majLigneDepot(${i},'deposant',this.value)"></td>
    <td><input value="${esc(l.qualite||'')}" placeholder="Officine, professionnel…" oninput="majLigneDepot(${i},'qualite',this.value)"></td>
    <td><input list="mat-suggeres" value="${esc(l.materiel||'')}" placeholder="Désignation" oninput="majLigneDepot(${i},'materiel',this.value)"></td>
    <td><select onchange="majLigneDepot(${i},'categorie',this.value)">${CAT_MAT.map(c =>
      `<option ${c===(l.categorie||'Dispositif médical')?'selected':''}>${esc(c)}</option>`).join('')}</select></td>
    <td style="width:88px"><input type="number" min="0" step="1" value="${esc(l.quantite ?? '')}" oninput="majLigneDepot(${i},'quantite',this.value)"></td>
    <td class="sup"><button onclick="retirerLigneDepot(${i})" title="Retirer la ligne">✕</button></td>
  </tr>`;
}
function majLigneDepot(i, champ, v){
  if(!lignesSaisie[i]) return;
  lignesSaisie[i][champ] = champ === 'quantite' ? (v === '' ? '' : Number(v)) : v;
  /* La catégorie suit la désignation tant qu'on ne l'a pas
     forcée à la main : les consommables se rangent seuls. */
  if(champ === 'materiel' && CAT_PAR_DEFAUT[v.trim()]){
    lignesSaisie[i].categorie = CAT_PAR_DEFAUT[v.trim()];
    const s = document.querySelectorAll('#lignes-depot tbody tr')[i];
    if(s){ const sel = s.querySelector('select'); if(sel) sel.value = lignesSaisie[i].categorie; }
  }
  majTotalDepot();
}
function majTotalDepot(){
  const t = document.getElementById('total-depot');
  if(!t) return;
  const s = synthesePoint({lignes: lignesSaisie.filter(l => (l.materiel||'').trim())});
  t.textContent = s.lignes + ' ligne' + (s.lignes>1?'s':'') + ' · ' + s.deposants.length
    + ' déposant' + (s.deposants.length>1?'s':'') + ' · ' + s.unites + ' unité' + (s.unites>1?'s':'');
}
function redessinerLignesDepot(){
  const c = document.querySelector('#lignes-depot tbody');
  if(c) c.innerHTML = lignesSaisie.map(ligneDepotHTML).join('');
  majTotalDepot();
}
function ajouterLigneDepot(){
  const d = lignesSaisie.length ? lignesSaisie[lignesSaisie.length-1] : {};
  lignesSaisie.push({deposant:d.deposant||'', qualite:d.qualite||'', materiel:'', categorie:'Dispositif médical', quantite:1});
  redessinerLignesDepot();
  const tr = document.querySelectorAll('#lignes-depot tbody tr');
  const dernier = tr[tr.length-1];
  if(dernier){ const i = dernier.querySelectorAll('input')[2]; if(i) i.focus(); }
}
function retirerLigneDepot(i){ lignesSaisie.splice(i,1); redessinerLignesDepot(); }

  const m = document.getElementById('modale');
  m.classList.add('large');

  <datalist id="mat-suggeres">${MAT_SUGGERES.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
  <div class="form">
    <label class="large"><span class="k">Lieu *</span><input id="pt-lieu" value="${g('lieu')}" placeholder="Ex. Foire Expo — Parc des Expositions de Pau"></label>
    <label class="large"><span class="k">Adresse</span><input id="pt-adresse" value="${g('adresse')}" placeholder="Numéro, rue, commune"></label>
    <label><span class="k">Date *</span><input id="pt-date" type="date" value="${g('date', aujourdhui())}"></label>
    <label><span class="k">Statut</span><select id="pt-statut">${['Ouvert','Clôturé','Annulé'].map(x =>

    <label><span class="k">Ouverture</span><input id="pt-debut" type="time" value="${g('debut')}"></label>

    <label><span class="k">Heure de clôture effective</span><input id="pt-cloture" type="time" value="${g('cloture')}"></label>
    <label><span class="k">Colis / cartons</span><input id="pt-colis" value="${g('colis')}" placeholder="À compléter au conditionnement"></label>
    <label class="large"><span class="k">Responsable sur place</span><input id="pt-responsable" value="${g('responsable')}" placeholder="Nom et qualité"></label>
    <label class="large"><span class="k">Avec</span><input id="pt-equipe" value="${g('equipe')}" placeholder="Les autres personnes présentes et ce qu'elles y font"></label>
    <label class="large"><span class="k">Destination du matériel</span><input id="pt-destination" value="${g('destination', RECEVEUR.nom)}"></label>
    <label class="large"><span class="k">Acheminement</span><input id="pt-acheminement" value="${g('acheminement')}" placeholder="Ex. Acheminé le soir même, 27/07, après conditionnement."></label>
    <label class="large"><span class="k">Observations</span><textarea id="pt-observations" placeholder="Matériel refusé, dons annoncés non reçus, références hors liste, ce qui reste à préciser…">${g('observations')}</textarea></label>
  </div>
  <div style="margin-top:18px">
    <div class="barre-h" style="margin-bottom:6px">
      <span class="cpt-h" id="total-depot">—</span>

    </div>
    <div class="tw"><table class="lgd" id="lignes-depot">
      <thead><tr><th>Déposant</th><th>Qualité</th><th>Matériel</th><th>Catégorie</th><th>Quantité</th><th></th></tr></thead>
      <tbody>${lignesSaisie.map(ligneDepotHTML).join('')}</tbody>
    </table></div>
  </div>
  <div class="actions">
    <button class="btn" onclick="validerPoint(${p ? "'" + p.id + "'" : ''})">Enregistrer</button>

  document.getElementById('rideau').classList.add('on');

async function validerPoint(id){
  const g = c => (document.getElementById('pt-' + c) || {}).value || '';
  const lieu = g('lieu').trim();
  if(!lieu){ toast("Le lieu est obligatoire"); return; }
  const lignes = lignesSaisie
    .filter(l => (l.materiel||'').trim())
    .map(l => ({deposant:(l.deposant||'').trim(), qualite:(l.qualite||'').trim(),
                materiel:(l.materiel||'').trim(), categorie:l.categorie || 'Dispositif médical',
                quantite: l.quantite === '' ? 0 : Number(l.quantite)}));
  const champs = {
    lieu, adresse:g('adresse').trim(), date:g('date'), debut:g('debut'), fin:g('fin'),
    cloture:g('cloture'), statut:g('statut'), colis:g('colis').trim(),
    responsable:g('responsable').trim(), equipe:g('equipe').trim(),
    destination:g('destination').trim(), acheminement:g('acheminement').trim(),
    observations:g('observations').trim(), lignes
  };
  etat.points = etat.points || [];
  const o = id ? etat.points.find(x => x.id === id) : null;
  if(o){ Object.assign(o, champs); o.modifiePar = moi; }
  else etat.points.push(Object.assign({id:uid(), pieces:[], auteur:moi, quand:new Date().toISOString()}, champs));
  await sauver(); fermer(); rendre();
  toast(o ? "Point de collecte mis à jour" : "Point de collecte ouvert");
}

async function cloturerPoint(id){
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  const s = synthesePoint(p);
  if(!confirm("Clôturer « " + p.lieu + " » ?\n\n"
    + s.lignes + " lignes de dépôt, " + s.deposants.length + " déposants, " + s.unites + " unités.\n\n"
    + "La clôture se consigne en main courante — vérifiez que tous les dépôts sont saisis.")) return;
  p.statut = 'Clôturé';
  if(!p.cloture) p.cloture = p.fin || maintenant();
  p.modifiePar = moi;
  /* Une clôture est un fait de la journée : elle se consigne en
     main courante en même temps qu'ici, avec ses chiffres. */
  etat.courante = etat.courante || [];
  etat.courante.push({
    id: uid(), date: p.date || aujourdhui(), heure: p.cloture, source: '', qui: p.responsable || moi,
    evenement: "Clôture du point de collecte " + p.lieu
      + (p.debut || p.fin ? ", ouvert de " + (p.debut||'—') + " à " + (p.fin||'—') : '')
      + (p.responsable ? ", sous la responsabilité de " + p.responsable : '') + ". "
      + s.unites + " unités collectées auprès de " + s.deposants.length + " déposants distincts, en "
      + s.lignes + " lignes de dépôt"
      + (s.parMat.length ? " : " + s.parMat.map(m => m.quantite + ' ' + m.materiel.toLowerCase()).join(', ') : '') + ".",
    suite: "Détail ligne à ligne et récapitulatif imprimable dans « Collecte de matériel », feuillet « Points de collecte »."
      + (p.destination ? " Destination : " + p.destination + "." : " Destination du matériel à nommer.")
      + (p.colis ? '' : " Nombre de colis à compléter au conditionnement."),
    auteur: moi, quand: new Date().toISOString()
  });
  await sauver(); rendre();
  toast("Point clôturé et consigné en main courante");
}

async function supprimerPoint(id){
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  if(!confirm("Retirer « " + p.lieu + " » et ses " + lignesPoint(p).length + " lignes de dépôt ?")) return;
  noterRetrait(id);
  etat.points = (etat.points||[]).filter(x => x.id !== id);
  await sauver(); rendre(); toast("Point de collecte retiré");
}

function exporterPoints(){
  const rows = [['Point','Date','Créneau','Statut','N°','Déposant','Qualité','Matériel','Catégorie','Quantité'].map(csvVal)];
  pointsTries().forEach(p => {
    const creneau = (p.debut||'') + (p.fin ? ' – ' + p.fin : '');
    lignesPoint(p).forEach((l, i) => rows.push([p.lieu, p.date, creneau, p.statut,
      i+1, l.deposant, l.qualite, l.materiel, l.categorie, l.quantite].map(csvVal)));
  });
  telechargerCSV('Points de collecte', rows);
}

/* --- Le récapitulatif ------------------------------------
   Même document que celui rempli sur place : synthèse par type
   de matériel, détail par déposant, clôture. Il se recalcule à
   chaque ouverture — il ne peut donc pas être en retard sur les
   lignes saisies. */
function recapPoint(id){
  const p = (etat.points||[]).find(x => x.id === id); if(!p) return;
  const s = synthesePoint(p);
  const ligne = (l, v, ph) => `<div class="lg"><span class="e">${l}</span><span class="v" contenteditable="true" data-ph="${esc(ph||'')}">${esc(v||'')}</span></div>`;
  const ref = 'RC-2026-' + String(p.id).slice(-4).toUpperCase();

  let n = 0;
  const detail = s.deposants.map(d => {
    const total = d.lignes.reduce((t,l) => t + qte(l), 0);
    return d.lignes.map((l, i) => `<tr>
      <td style="text-align:center;color:var(--texte-2)">${++n}</td>
      ${i === 0 ? `<td rowspan="${d.lignes.length}"><b>${esc(d.deposant)}</b>${d.qualite ? `<div style="font-size:11px;color:var(--texte-2)">${esc(d.qualite)} · ${total} unité${total>1?'s':''}</div>` : ''}</td>` : ''}
      <td>${esc(l.materiel)}</td>
      <td style="text-align:right;font-weight:600">${qte(l)}</td>
    </tr>`).join('');
  }).join('');

  const synthese = s.parCat.map(c =>
    s.parMat.filter(m => m.categorie === c.categorie).map(m => `<tr>

/* =========================================================
   APPEL AU RENFORT
   Le recensement des professionnels de santé du territoire prêts
   à se déplacer — sur les zones touchées, dans les hubs de santé,
   ou auprès de la population accueillie ici.

   Même mécanique que la collecte de matériel : un formulaire
   public que le copil ouvre et ferme d'ici, un registre qui se
   remplit tout seul par ce formulaire, et la saisie à la main
   pour les réponses arrivées autrement.

   Ce qui change par rapport à la collecte : un volontaire n'est
   pas un carton. Tant que le type de renfort attendu n'est pas
   connu, on recense sans promettre, et on ne transmet aucun nom
   sans avoir regardé l'assurance, le statut et ce que devient sa
   patientèle pendant son absence.
   ========================================================= */
let volOuvert = null;
let filtreVol = 'Tout';

const VOL_CL  = {'Recensé':'att', 'Vérifié':'oui', 'Transmis':'oui', 'Affecté':'oui',
                 'Indisponible':'non', 'Sans suite':'non'};
const VOL_ET  = {'Recensé':'e-attente', 'Vérifié':'e-cours', 'Transmis':'e-cours',
                 'Affecté':'e-cours', 'Indisponible':'e-bloque', 'Sans suite':'e-fini'};
const VOL_MOB = ['Recensé','Vérifié','Transmis','Affecté'];

const FORMULAIRE_RENFORT = 'appel-au-renfort.html';
function lienRenfort(){
  try{ return new URL(FORMULAIRE_RENFORT, location.href).href; }
  catch(e){ return FORMULAIRE_RENFORT; }
}

const nomVol = o => [o.prenom, o.nom].filter(Boolean).join(' ').trim() || o.nom || '—';
const listeRenforts = o => String(o.renforts || '').split(',').map(x => x.trim()).filter(Boolean);
const loinVol = o => o.zone && o.zone.indexOf('Nouvelle-Aquitaine') >= 0;

function allerVol(id){ volOuvert = (volOuvert === id) ? null : id; rendre(); }
function filtrerVol(r){ filtreVol = r; rendre(); }

/* --- Ouverture et fermeture de l'appel -------------------
   Un appel au renfort qui part touche 210 professionnels d'un
   coup : une ouverture officielle se consigne en main courante au
   moment où on l'ouvre, sans attendre qu'on y repense. Une
   ouverture d'essai, elle, n'y laisse rien. */
async function basculerRenfort(){
  const r = await basculerFormulairePublic({
    cle:'renfort',
    titre:"Ouvrir l'appel au renfort",
    portee:"Le formulaire de recensement devient accessible à toute personne qui en a le lien. S'inscrire ne vaut ni affectation ni réquisition, et le formulaire le dit — mais la CPTS s'engage à rappeler ceux qui répondent.",
    consigner: consignerRenfortEnCourante
  });
  if(!r) return;
  await sauver(); rendre();
  toast(r.ouvre
    ? (r.officielle ? "Appel au renfort ouvert — l'ouverture est consignée en main courante"
                    : "Appel au renfort ouvert pour essai — rien n'est consigné")
    : (r.officielle ? "Appel au renfort fermé — la fermeture est consignée en main courante"
                    : "Essai terminé — l'appel est refermé, rien n'a été consigné"));
}

/* Règle du cockpit : ce qui part de la CPTS se consigne en main
   courante, en plus de sa rubrique métier. */
function consignerRenfortEnCourante(ouvre){
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(), date: aujourdhui(), heure: maintenant(), source: '',
    evenement: ouvre
      ? "Ouverture de l'appel au renfort : le formulaire de recensement des professionnels volontaires est accessible aux professionnels de santé du territoire."
        + ((etat.renfort && etat.renfort.cadre) ? "\nCadre annoncé : " + etat.renfort.cadre : '')
      : "Fermeture de l'appel au renfort : le formulaire de recensement n'accepte plus d'inscription.",
    suite: ouvre
      ? "Diffuser le lien du formulaire aux professionnels de santé du territoire, canal par canal, et consigner chaque diffusion ici. Rappeler chaque inscrit pour vérifier assurance, statut et continuité des soins avant toute transmission de nom."
      : "Prévenir les professionnels déjà inscrits de la suite donnée à leur inscription.",
    qui: moi,
    auteur: moi, quand: ''
  });
}

function editerRenfort(){
  const c = etat.renfort || {};
  document.getElementById('modale').innerHTML = `<h3>Textes du formulaire de recensement</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Ces deux textes s'affichent sur ${esc(FORMULAIRE_RENFORT)}. Le premier quand l'appel est fermé, le second en tête du formulaire quand il est ouvert.</p>
    <label style="margin-bottom:12px"><span class="k">Message affiché appel fermé</span>
      <textarea id="re-message" placeholder="Ex. Un appel au renfort sera peut-être lancé en fin de semaine.">${esc(c.message||'')}</textarea></label>
    <label style="margin-bottom:12px"><span class="k">Cadre annoncé appel ouvert</span>
      <textarea id="re-cadre" placeholder="Ce qu'on sait du renfort attendu — et ce qu'on ne sait pas encore.">${esc(c.cadre||'')}</textarea></label>
    <div class="actions"><button class="btn" onclick="validerRenfort()">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerRenfort(){
  etat.renfort = etat.renfort || {ouverte:false};
  etat.renfort.message = document.getElementById('re-message').value.trim();
  etat.renfort.cadre = document.getElementById('re-cadre').value.trim();
  await sauver(); fermer(); rendre(); toast("Textes du formulaire mis à jour");
}

function copierLienRenfort(){
  const l = lienRenfort();
  const fini = () => toast("Lien copié — collez-le dans le message aux professionnels");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(l).then(fini, () => toast("Copie impossible — sélectionnez le lien à la main"));
  }else{
    const i = document.getElementById('lien-renfort');
    if(i){ i.select(); try{ document.execCommand('copy'); fini(); }catch(e){ toast("Sélectionnez le lien à la main"); } }
  }
}

function carteFormulaireRenfort(){
  const c = etat.renfort || {};
  const aVerifier = (etat.volontaires||[]).filter(x => x.source === 'formulaire' && x.aVerifier).length;
  return `<div class="carte formulaire ${c.ouverte?'ouverte':''}">
    <div class="ligne-f">
      <div>
        <h2 style="margin-bottom:2px">Formulaire de recensement en ligne</h2>
        <p class="sous-f">Le professionnel se recense depuis son téléphone : qui il est, ce qu'il peut faire, quand et jusqu'où il peut se déplacer. La ligne arrive ici, il repart avec son récapitulatif. Rien à imprimer, rien à renvoyer.</p>
      </div>
      ${etiqOuv(c, 'Ouvert aux inscriptions')}
    </div>
    ${bandeauEssai(c)}
    ${c.ouverte
      ? `<div class="lien-f">
           <input id="lien-renfort" readonly value="${esc(lienRenfort())}" onclick="this.select()">
           <button class="btn sec" onclick="copierLienRenfort()">Copier le lien</button>
         </div>
         <p class="sous-f" style="margin:9px 0 0">Ce lien est à diffuser aux professionnels de santé du territoire. Toute personne qui l'a peut se recenser ; le cockpit, lui, reste protégé par son code d'accès.</p>`
      : `<div class="note" style="margin:0">Tant que l'appel est fermé, le formulaire affiche aux professionnels que la CPTS ne recense personne pour le moment. Un recensement ouvert crée une attente : on ne l'ouvre qu'au moment de diffuser l'appel.</div>`}
    <div class="actions">
      <button class="btn${c.ouverte?' sec':''}" onclick="basculerRenfort()">${c.ouverte?"Fermer l'appel au renfort":"Ouvrir l'appel au renfort"}</button>
      <button class="btn sec" onclick="editerRenfort()">Textes affichés</button>
      ${c.ouverte ? `<a class="btn sec" href="${esc(lienRenfort())}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Voir le formulaire</a>` : ''}
      ${aVerifier ? `<button class="btn sec" onclick="allerRegistreVol('Formulaire')" style="margin-left:auto;color:var(--braise);border-color:#E8C3B8">${aVerifier} inscription${aVerifier>1?'s':''} à vérifier</button>` : ''}
    </div>
  </div>`;
}

/* --- Le palier de l'onglet -------------------------------
   Deux choses n'ont rien à faire l'une sous l'autre : ouvrir le
   formulaire et diffuser son lien, c'est un geste de coordination
   qu'on fait une fois ; consulter le registre des professionnels
   recensés, c'est ce qu'on vient faire tous les jours. Chacune sa
   carte, chacune son écran. */
let moduleRen = '';           /* '' = le palier, 'formulaire', 'registre' */
function allerModuleRen(m){ moduleRen = m; volOuvert = null; filtreVol = 'Tout'; rendre(); window.scrollTo(0,0); }
function allerRegistreVol(f){ filtreVol = f; moduleRen = 'registre'; rendre(); window.scrollTo(0,0); }

function vueRenfort(){
  if(moduleRen === 'formulaire') return vueRenfortFormulaire();
  if(moduleRen === 'registre')   return vueRenfortRegistre();
  return vueModulesRenfort();
}

function vueModulesRenfort(){
  const c = etat.renfort || {};
  const v = etat.volontaires || [];
  const mobilisables = v.filter(x => VOL_MOB.indexOf(x.statut || 'Recensé') >= 0);
  const aVerifier = v.filter(x => x.source === 'formulaire' && x.aVerifier).length;
  const aVoir = mobilisables.filter(volAVerifier).length;

  return `<h1>Appel au renfort</h1>
  <p class="chapo">Le recensement des professionnels de santé du territoire prêts à venir en renfort : sur les zones touchées, dans les hubs de santé, ou auprès de la population accueillie ici. La CPTS Pau Béarn recense et vérifie ; l'affectation revient à l'ARS et aux structures qui accueillent.</p>

  <div class="modules">
    <button class="module" onclick="allerModuleRen('formulaire')">
      <div class="titre-m">Formulaire de recensement en ligne</div>
      <p class="sous-m">Le professionnel se recense depuis son téléphone : qui il est, ce qu'il peut faire, quand et jusqu'où il peut se déplacer. C'est ici qu'on ouvre l'appel aux inscriptions, qu'on récupère le lien à diffuser et qu'on règle les textes affichés aux professionnels.</p>
      <div class="chiffres">
        <div><strong style="color:${c.ouverte ? (c.officielle === false ? 'var(--ambre)' : 'var(--stable)') : 'inherit'}">${c.ouverte ? (c.officielle === false ? 'Essai' : 'Ouvert') : 'Fermé'}</strong> aux inscriptions</div>
        ${aVerifier ? `<div><strong style="color:var(--braise)">${aVerifier}</strong> inscription${aVerifier>1?'s':''} à vérifier</div>` : ''}
      </div>
      <div class="entrer">Ouvrir le module →</div>
    </button>
    <button class="module" onclick="allerModuleRen('registre')">
      <div class="titre-m">Recensement des professionnels de santé</div>
      <p class="sous-m">Le registre de ceux qui se sont déclarés : les inscriptions arrivées par le formulaire et celles recueillies au téléphone. On y vérifie assurance, continuité des soins et accord de transmission, on suit qui a été transmis, et on sort la liste en Excel ou en PDF.</p>
      <div class="chiffres">
        <div><strong>${v.length}</strong> professionnels recensés</div>
        <div><strong style="color:var(--stable)">${mobilisables.length}</strong> mobilisables</div>
        ${aVoir ? `<div><strong style="color:var(--ambre)">${aVoir}</strong> à vérifier</div>` : ''}
      </div>
      <div class="entrer">Ouvrir le module →</div>
    </button>
  </div>`;
}

function vueRenfortFormulaire(){
  return `<button class="retour-m" onclick="allerModuleRen('')">‹ Appel au renfort</button>`
    + carteFormulaireRenfort();
}

/* Ce qui reste à vérifier ne se compte que sur les personnes
   encore dans la course : un « sans suite » n'a plus rien à faire
   vérifier. */
const volAVerifier = x => (x.continuite || 'À vérifier') === 'À vérifier'
  || (x.assurance || 'À vérifier') === 'À vérifier';

function vueRenfortRegistre(){
  const v = etat.volontaires || [];
  const mobilisables = v.filter(x => VOL_MOB.indexOf(x.statut || 'Recensé') >= 0);
  const prets = v.filter(x => x.statut === 'Transmis' || x.statut === 'Affecté').length;
  const loin = mobilisables.filter(loinVol).length;
  const aVerifier = volAVerifier;
  const aVoir = mobilisables.filter(aVerifier).length;
  const professions = new Set(mobilisables.map(x => x.profession).filter(Boolean));

  let h = `<button class="retour-m" onclick="allerModuleRen('')">‹ Appel au renfort</button>`;

  const parFormulaire = v.filter(x => x.source === 'formulaire').length;
  const parSaisie = v.filter(x => x.source === 'saisie').length;

  h += `<div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${v.length}</div><div class="l">professionnels recensés</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${mobilisables.length}</div><div class="l">mobilisables à ce jour</div></div>
    <div class="compteur"><div class="n">${professions.size}</div><div class="l">professions représentées</div></div>
    <div class="compteur"><div class="n">${loin}</div><div class="l">peuvent partir sur les zones touchées</div></div>
    <div class="compteur"><div class="n" style="color:var(--stable)">${prets}</div><div class="l">transmis ou déjà affectés</div></div>
    ${aVoir ? `<div class="compteur"><div class="n" style="color:var(--ambre)">${aVoir}</div><div class="l">assurance ou continuité des soins à vérifier</div></div>` : ''}
    ${parFormulaire ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parFormulaire}</div><div class="l">inscrits par le formulaire</div></div>` : ''}
    ${parSaisie ? `<div class="compteur"><div class="n" style="color:var(--encre-2)">${parSaisie}</div><div class="l">réponses reportées à la main</div></div>` : ''}
  </div>`;

  h += `<div class="barre-h">
    <span class="cpt-h">${v.length} inscription${v.length>1?'s':''} au registre</span>
    <button class="btn sec" onclick="exporterCSV('volontaires')">Excel</button>
    <button class="btn sec" onclick="imprimer()">PDF</button>
    <button class="btn" onclick="ouvrirAjout('volontaires')">Recenser un professionnel</button>
  </div>`;

  if(!v.length){
    return h + `<div class="carte"><p class="vide">Aucun professionnel recensé. Le registre se remplit de deux façons : par le formulaire en ligne une fois l'appel ouvert, ou en recensant ici un par un ceux dont la réponse est arrivée autrement.</p></div>`;
  }

  const LIB_VOL = {Formulaire:'Inscrits par formulaire', Saisie:'Reportés à la main',
                   Loin:'Peuvent partir en zone', Verif:'À vérifier'};
  const compte = r => r === 'Formulaire' ? parFormulaire
    : r === 'Saisie' ? parSaisie
    : r === 'Loin' ? loin
    : r === 'Verif' ? aVoir
    : v.filter(x => (x.statut || 'Recensé') === r).length;
  const filtres = ['Tout'].concat(VOL_STATUTS.filter(s => compte(s)))
    .concat(loin ? ['Loin'] : []).concat(aVoir ? ['Verif'] : [])
    .concat(parFormulaire ? ['Formulaire'] : []).concat(parSaisie ? ['Saisie'] : []);
  h += `<div class="filtres">${filtres.map(r =>
    `<button class="${filtreVol===r?'on':''}" onclick="filtrerVol('${r}')">${LIB_VOL[r] || esc(r)}${r!=='Tout'?` <span style="opacity:.6">${compte(r)}</span>`:''}</button>`).join('')}</div>`;

  let vus = filtreVol === 'Tout' ? [...v]
    : filtreVol === 'Formulaire' ? v.filter(x => x.source === 'formulaire')
    : filtreVol === 'Saisie' ? v.filter(x => x.source === 'saisie')
    : filtreVol === 'Loin' ? v.filter(x => loinVol(x) && VOL_MOB.indexOf(x.statut||'Recensé') >= 0)
    : filtreVol === 'Verif' ? mobilisables.filter(aVerifier)
    : v.filter(x => (x.statut || 'Recensé') === filtreVol);
  vus.sort((a,b) => ((b.date||'')+' '+(b.heure||'')).localeCompare((a.date||'')+' '+(a.heure||'')));

  if(!vus.length) return h + `<div class="carte"><p class="vide">Aucun professionnel dans ce filtre.</p></div>`;

  h += `<div class="dons">`;
  vus.forEach(o => {
    const st = o.statut || 'Recensé';
    const ouvertx = volOuvert === o.id;
    const types = listeRenforts(o);
    h += `<div class="don ${VOL_CL[st] || 'att'}">
      <button class="tete" onclick="allerVol('${o.id}')" aria-expanded="${ouvertx}">
        <span class="qd">${frdate(o.date)}<br>${esc(o.heure||'—')}</span>
        <span class="ident">
          <span class="n">${esc(nomVol(o))}${o.source === 'formulaire'
            ? `<span class="src-f">Formulaire</span>${o.aVerifier ? `<span class="src-f neuf">À vérifier</span>` : ''}`
            : o.source === 'saisie' ? `<span class="src-f saisie">Saisie à la main</span>` : ''}</span>
          <span class="s">${[o.profession, o.exercice, o.commune].filter(Boolean).map(esc).join(' · ') || '—'}</span>
        </span>
        <span class="par">${o.dispo ? 'Disponible' : 'Disponibilités'}<br><b>${esc(o.dispo || 'à préciser')}</b></span>
        <span class="etiq ${VOL_ET[st] || 'e-attente'}">${esc(st)}</span>
        ${types.length
          ? `<span class="mat">${esc(types.slice(0,2).join(', '))}${types.length>2?' +'+(types.length-2):''}</span>`
          : `<span class="manque">Type de renfort à préciser</span>`}
        <span class="chev">${ouvertx?'▲':'▼'}</span>
      </button>`;
    if(ouvertx) h += detailVol(o);
    h += `</div>`;
  });
  return h + `</div>`;
}

/* Panneau dépliant. Ce que le professionnel a déclaré lui-même
   s'affiche tel quel : c'est la pièce qui fait foi. Ce que le
   copil constate au téléphone — assurance, continuité des soins,
   accord de transmission — se coche ici. */
function detailVol(o){

        ${[['Profession', o.profession], ["Mode d'exercice", o.exercice], ['N° RPPS ou ADELI', o.rpps],
           ['Cabinet ou structure', o.structure], ["Commune d'exercice", o.commune], ['Courriel', o.mail],
           ['Mobilisable à partir du', o.apartir ? frdateL(o.apartir) : ''],
           ["Durée mobilisable d'affilée", o.duree], ['Peut dormir sur place', o.nuit],

      ${o.engage ? `<div class="dn"><span class="k">Déjà engagé ailleurs</span>${esc(o.engage)}</div>` : ''}
      ${o.note ? `<div class="dn"><span class="k">Précisions</span>${esc(o.note)}</div>` : ''}
      ${e.le ? `<div class="de">Inscription déclarée le ${frdateL(String(e.le).slice(0,10))} à ${esc(String(e.le).slice(11,16))} par ${esc(nomVol(o))}. Le professionnel a reconnu que son inscription ne vaut ni affectation ni engagement${e.transmission ? ", et accepté que ses coordonnées soient transmises aux autorités sanitaires et aux structures d'accueil" : ''}.</div>` : ''}

    h += `<div class="declaration">
      <div class="dt">Réponse reportée à la main au registre</div>

          .filter(x => x[1]).map(x => `<div><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('')
          || `<div><span class="k">Provenance non précisée</span></div>`}
      </div>
      <div class="de">Reportée par ${esc(o.auteur || '—')}${o.quand ? ' le ' + frdateL(String(o.quand).slice(0,10)) : ''}. Cette ligne n'a pas fait l'objet d'un recensement direct par la CPTS.</div>
    </div>`;
  }

  h += `<div class="form">
    <label><span class="k">Statut</span>
      <select onchange="majVol('${o.id}','statut',this.value)">${sel(o.statut||'Recensé', VOL_STATUTS)}</select></label>
    <label><span class="k">Téléphone</span>
      ${o.tel ? `<a class="btn sec" style="display:flex;justify-content:center;text-decoration:none" href="tel:${esc(String(o.tel).replace(/[^0-9+]/g,''))}">Appeler ${esc(o.tel)}</a>`
              : `<input value="" placeholder="06 12 34 56 78" onchange="majVol('${o.id}','tel',this.value)">`}</label>
    <div class="large"><span class="k">Renfort envisagé — à cocher avec lui</span>
      <div class="taches">${RENFORTS_TYPES.map((x,i) =>
        `<button class="${t.indexOf(x)>=0?'on':''}" onclick="basculerRenfortType('${o.id}',${i})">${esc(x)}</button>`).join('')}</div>
      ${t.filter(x => RENFORTS_TYPES.indexOf(x) === -1).length
        ? `<div style="font-size:13px;margin-top:6px">${esc(t.filter(x => RENFORTS_TYPES.indexOf(x) === -1).join(', '))}</div>` : ''}</div>

    <label><span class="k">Continuité de sa patientèle assurée ?</span>
      <select onchange="majVol('${o.id}','continuite',this.value)">${sel(o.continuite||'À vérifier', ['À vérifier','Oui','Non','Sans objet'])}</select></label>

      <select onchange="majVol('${o.id}','assurance',this.value)">${sel(o.assurance||'À vérifier', ['À vérifier','Oui','Non'])}</select></label>

  const su = antechrono(o.suivi);

    <button class="retirer sup" onclick="supprimer('volontaires','${o.id}')">Retirer</button>
