function ouvrirAjout(k, mode){
  document.getElementById('modale').innerHTML = formulaire(k, null, mode);
  document.getElementById('rideau').classList.add('on');
}

/* Les champs retenus selon le mode de saisie : en saisie manuelle on
   ne demande pas qui a mené l'appel, puisqu'il n'y a pas eu d'appel.
   Un champ marqué « hors » n'est plus proposé à la frappe : il garde
   sa place dans la configuration pour le tableau et l'export, et se
   renseigne ailleurs — par le formulaire en ligne, le plus souvent.
   Ne pas l'afficher, c'est aussi ne jamais l'écraser : l'enregistrement
   ne relit que les champs visibles. */
function champsVisibles(cfg, mode){
  return cfg.f.filter(f => !f.hors && (mode === 'manuel' ? !f.appel : !f.manuel));
}

/* Les intertitres du formulaire ne sont pas des champs : ils n'ont ni
   colonne, ni valeur à enregistrer. */
const champsSaisie = l => l.filter(f => f.c);


function formulaire(k, o, mode){
  const cfg = CHAMPS[k];
  const ed = !!o;
  if(!mode && ed && o.source === 'saisie') mode = 'manuel';
  const man = mode === 'manuel';
  let h = `<h3>${esc(cfg.titre)} — ${ed ? 'modifier' : (man ? 'saisie manuelle' : 'nouvelle entrée')}</h3>`;
  if(man) h += `<p class="chapo" style="margin:-6px 0 14px">Pour reporter au registre une réponse obtenue autrement que par un appel de la CPTS — une réponse au formulaire en ligne, un message reçu. La ligne compte comme les autres ; elle porte la mention « saisie à la main » au lieu du nom de l'appelant.</p>`;
  h += `<div class="form">`;
  h += `<label><span class="k">Date</span><input type="date" id="f-${k}-date" value="${esc(ed ? (o.date||'') : aujourdhui())}"></label>`;
  champsVisibles(cfg, mode).forEach(f => {
    /* Un intertitre : il ne saisit rien, il découpe le formulaire en
       temps successifs — le même repère qu'au recueil d'un patient. */
    if(f.t === 'titre'){
      h += `<div class="sous-t">${esc(f.l)}${f.sous ? `<span class="d">${esc(f.sous)}</span>` : ''}</div>`;
      return;
    }
    const val = ed ? (o[f.c] ?? '') : (typeof f.d === 'function' ? f.d() : '');
    const id = `f-${k}-${f.c}`;
    const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
    h += `<label class="${f.large?'large':''}"><span class="k">${esc(man && f.lm ? f.lm : f.l)}${f.req?' *':''}</span>`;
    if(f.t === 'textarea') h += `<textarea id="${id}"${ph}>${esc(val)}</textarea>`;
    else if(f.t === 'select'){
      /* Certaines listes se construisent à la volée : les lieux de
         stockage déjà saisis, par exemple. */
      const opts = typeof f.o === 'function' ? f.o() : f.o;
      const liste = opts.indexOf(val) === -1 && val ? [val, ...opts] : opts;
      h += `<select id="${id}">${liste.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    }
    /* Un choix court se pose en pastilles plutôt qu'en liste
       déroulante : les réponses possibles se lisent sans ouvrir, et
       se donnent d'un doigt — les mêmes pastilles qu'au recueil d'un
       patient. Une option peut porter un libellé distinct de ce qui
       est enregistré : « Oui » à l'écran, « Volontaire » au registre,
       pour que le vocabulaire du cockpit et celui du formulaire en
       ligne restent le même. Une valeur déjà posée qui ne figure pas
       dans la liste — une réponse du formulaire en ligne, rédigée à
       sa façon — s'ajoute en tête plutôt que de disparaître à la
       première modification. */
    else if(f.t === 'choix'){
      const brut = typeof f.o === 'function' ? f.o() : f.o;
      const opts = brut.map(x => typeof x === 'string' ? {v:x, l:x} : x);
      const liste = val && !opts.some(x => x.v === val) ? [{v:val, l:val}, ...opts] : opts;
      h += `<input type="hidden" id="${id}" value="${esc(val)}">`
        +  `<div class="sugg">${liste.map(x =>
             `<button type="button" class="${x.v===val?'on':''}" data-v="${esc(x.v)}" onclick="choisirSugg('${id}',this)">${esc(x.l)}</button>`
           ).join('')}</div>`;
    }
    /* Désigner quelqu'un ne doit obliger ni à choisir dans une liste
       fermée, ni à tout retaper : le champ propose les personnes déjà
       recensées — équipe de crise, pilotes, suppléants, renforts — et
       accepte un nom qui n'y figure pas encore, qui rejoint alors la
       liste pour les saisies suivantes. */
    else if(f.t === 'personne'){
      const noms = nomsMissionnes();
      h += `<input type="text" id="${id}" list="${id}-l" value="${esc(val)}" autocomplete="off"${ph || ' placeholder="Prénom et nom"'}>`
        +  `<datalist id="${id}-l">${noms.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`;
    }
    else h += `<input type="${f.t}" id="${id}" value="${esc(val)}"${ph}>`;
    /* Un champ libre peut porter ses réponses les plus fréquentes en
       pastilles : on touche plutôt que de taper, sans que le champ
       cesse d'accepter n'importe quoi d'autre. */
    if(f.sugg) h += pastilles(id, typeof f.sugg === 'function' ? f.sugg() : f.sugg, '', val);
    if(f.aide) h += `<span class="aide">${esc(f.aide)}</span>`;
    h += `</label>`;
  });
  h += `</div><div class="actions"><button class="btn" onclick="enregistrer('${k}',${ed?`'${o.id}'`:'null'},'${mode||''}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  return h;
}

function ouvrirEdition(k, id){
  const o = (etat[k]||[]).find(x => x.id === id); if(!o) return;
  document.getElementById('modale').innerHTML = formulaire(k, o);
  document.getElementById('rideau').classList.add('on');
}

async function enregistrer(k, id, mode){
  const cfg = CHAMPS[k];
  const existant = id ? (etat[k]||[]).find(x => x.id === id) : null;
  const o = existant || {id:uid(), auteur:moi, quand:new Date().toISOString()};
  if(!existant && mode === 'manuel') o.source = 'saisie';
  let manque = null;
  const dEl = document.getElementById(`f-${k}-date`);
  o.date = dEl ? dEl.value : aujourdhui();
  /* Seuls les champs affichés sont relus : sinon un champ masqué par
     le mode de saisie serait effacé à chaque enregistrement. */
  champsSaisie(champsVisibles(cfg, mode || (o.source === 'saisie' ? 'manuel' : ''))).forEach(f => {
    const el = document.getElementById(`f-${k}-${f.c}`);
    const v = el ? el.value.trim() : '';
    if(f.req && !v && !manque) manque = f.l;
    o[f.c] = v;
  });
  if(manque){ toast(`Champ obligatoire : ${manque}`); return; }
  if(existant){
    o.modifiePar = moi;
  }else{
    /* Registre classé à la main : la nouvelle entrée passe devant
       toutes les autres plutôt que de se perdre au milieu. */
    if(estManuel(k)) o.rang = Math.min(...etat[k].map(x => typeof x.rang === 'number' ? x.rang : 0)) - 1;
    etat[k].unshift(o);
  }
  await sauver(); fermer(); rendre(); toast(existant ? "Modifié" : "Enregistré");
}

async function supprimer(k, id){
  noterRetrait(id);
  etat[k] = etat[k].filter(x => x.id !== id);
  await sauver(); rendre(); toast("Ligne supprimée");
}

/* Les registres de traçabilité se lisent du plus récent au plus ancien :
   ce qui vient d'arriver est la première chose qu'on doit voir en ouvrant
   la page, et on remonte le temps en descendant. Le tri se fait à
   l'affichage seulement — l'ordre de stockage n'est pas touché, et les
   lignes saisies sans heure se rangent en fin de journée. */
const CHRONO = ['ars','courante','terrain','materiel','appels','orientes'];

/* L'heure est ramenée à HH:MM avant d'être comparée : une entrée saisie
   « 9h05 » ou « 9:05 » doit se ranger avant 14:01, pas après. Une entrée
   sans heure se range en fin de journée, faute de mieux. */
function cleHeure(v){
  const m = String(v || '').match(/^\s*(\d{1,2})\s*[:hH.]\s*(\d{1,2})/);
  return m ? m[1].padStart(2,'0') + ':' + m[2].padStart(2,'0') : '';
}
function antechrono(lignes){
  const cle = o => (o.date || '') + ' ' + cleHeure(o.heure);
  return [...(lignes || [])].sort((a,b) => cle(b).localeCompare(cle(a)));
}

/* Le classement à la main l'emporte sur le tri par date dès qu'une
   entrée porte un rang. Le rang est posé sur la fiche elle-même, et
   non déduit de l'ordre du tableau : c'est ce qui lui permet de
   survivre à la fusion avec le serveur quand deux postes saisissent
   en même temps — un simple déplacement de ligne serait sinon repris
   par la version d'en face, qui ne l'aurait pas vu passer.
   Une entrée sans rang — celle qui vient d'arriver d'un autre poste,
   ou d'un amorçage — se place en tête, là où le plus récent se lit. */
function estManuel(k){ return (etat[k] || []).some(o => typeof o.rang === 'number'); }

function chrono(k, lignes){
  if(!CHRONO.includes(k)) return [...(lignes || [])];
  const l = antechrono(lignes);
  if(!estManuel(k)) return l;
  /* le tri est stable : à rang égal ou absent, l'ordre chronologique
     ci-dessus fait le départage */
  return l.sort((a,b) => (typeof a.rang === 'number' ? a.rang : -1) -
                         (typeof b.rang === 'number' ? b.rang : -1));
}

/* Numérote les entrées dans l'ordre où elles sont affichées à
   l'instant : bascule un registre en classement manuel sans que rien
   ne bouge sous les yeux de celle qui vient de cliquer. */
function assurerRangs(k){
  chrono(k, etat[k]).forEach((o, i) => { o.rang = i; });
}

async function deplacer(k, id, sens){
  assurerRangs(k);
  const l = chrono(k, etat[k]);
  const i = l.findIndex(o => o.id === id), j = i + sens;
  if(i < 0 || j < 0 || j >= l.length) return;
  const r = l[i].rang; l[i].rang = l[j].rang; l[j].rang = r;
  await sauver(); rendre();
}

async function retablirTri(k){
  (etat[k] || []).forEach(o => { delete o.rang; });
  await sauver(); rendre();
  toast("Tri par date et heure rétabli");
}

/* Le bandeau n'apparaît qu'une fois le registre passé en manuel :
   tant qu'on n'a rien déplacé, il n'y a rien à expliquer. */
function barreOrdre(k){
  if(!CHRONO.includes(k) || !estManuel(k)) return '';
  return `<div class="note ordre-manuel">
    <strong>Ordre manuel.</strong> Ces entrées sont classées à la main : le tri par date et heure ne s'applique plus, et une entrée nouvelle se place en tête.
    <button class="btn sec" onclick="retablirTri('${k}')">Revenir au tri par date et heure</button></div>`;
}

function tableau(k){
  const cfg = CHAMPS[k], lignes = chrono(k, etat[k]);
  if(!lignes.length) return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;
  const ent = cfg.cols.map(c => {
    if(c === 'date') return 'Date';
    if(c === 'auteur') return 'Saisi par';
    const f = cfg.f.find(x => x.c === c);
    return f ? f.l : c;
  });
  let h = `<div class="tw"><table><thead><tr>${ent.map(e=>`<th>${esc(e)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  lignes.forEach((l, i) => {
    h += '<tr>' + cfg.cols.map(c => {
      let v = l[c] ?? '';
      if(c === 'date' || c === 'rappel' || c === 'rdvle' || c === 'infoLe' || c === 'apartir'
         || c === 'verifieLe') v = frdate(v);
      if(typeof v === 'string' && /^https?:\/\//.test(v))
        return `<td><a href="${esc(v)}" target="_blank" rel="noopener">Ouvrir</a></td>`;
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + `<td class="act">${fleches(k, l.id, i, lignes.length)}<button title="Modifier" onclick="ouvrirEdition('${k}','${l.id}')">✎</button><button title="Supprimer" onclick="supprimer('${k}','${l.id}')">×</button></td></tr>`;
  });
  return h + '</tbody></table></div>';
}

/* Les flèches ne sont proposées que là où un ordre a un sens, et
   restent visibles en tri automatique : le premier déplacement fait
   lui-même basculer le registre en classement manuel, sans qu'il y
   ait de réglage à comprendre au préalable. */
function fleches(k, id, i, n){
  if(!CHRONO.includes(k) || n < 2) return '';
  return `<button title="Monter" onclick="deplacer('${k}','${id}',-1)"${i === 0 ? ' disabled' : ''}>↑</button>` +
         `<button title="Descendre" onclick="deplacer('${k}','${id}',1)"${i === n-1 ? ' disabled' : ''}>↓</button>`;
}

/* ---------------------------------------------------------
   Les registres de traçabilité se lisent comme un journal :
   une carte par entrée, regroupée par jour, plutôt qu'un
   tableau à dix colonnes qu'il faut faire défiler pour lire
   une phrase. Le tableau reste dans le dossier de traçabilité,
   où il sert à l'impression et à l'export.
   --------------------------------------------------------- */
const JOURNAL = {
  /* La provenance ne se lit pas au milieu des autres mentions : une
     entrée venue du dehors le dit en tête, à côté de l'heure, parce
     que c'est ce qui la distingue de tout ce que nous avons fait
     nous-mêmes — et parce que c'est elle qui la fait remonter dans
     « Remontées terrain ». */
  /* Pas de statut : une entrée de main courante ne se pilote pas,
     elle atteste. Ce qui reste à faire se dit dans la suite donnée,
     et ce qui se pilote a sa mission. Le liseré de la carte parle
     alors de provenance — c'est la seule chose qui distingue deux
     entrées entre elles. */
  courante: {
    marque:'mc', titre:'evenement', venu:'source', personne:'qui',
    blocs:[{c:'suite', l:"Suite donnée"}]
  },
  terrain: {
    titre:'sujet', etiq:['criticite','statut'],
    chips:[{c:'professionnel', l:"Professionnel"},{c:'profession', l:"Profession"},
           {c:'commune', l:"Commune"},{c:'transmis', l:"Transmis à"}],
    blocs:[{c:'action', l:"Action menée"}]
  },
  ars: {
    titre:'objet', etiq:['sens','statut'],
    chips:[{c:'canal', l:"Canal"},{c:'interlocuteur', l:"Interlocuteur"}],
    blocs:[{c:'demande', l:"Ce qui est demandé ou annoncé"},{c:'reponse', l:"Notre réponse ou action"},
           {c:'attendu', l:"Ce que ça implique pour la CPTS"}],
    lien:'lien', lienL:"Ouvrir le document"
  }
};

const ETIQ_REG = {
  'En cours':'e-cours', 'Clos':'e-fini', 'Terminé':'e-fini',
  'À suivre':'e-attente', 'À faire':'e-attente', 'En attente':'e-attente',
  "Reçu de l'ARS":'e-lancer', "Envoyé à l'ARS":'e-cours', 'À envoyer':'e-attente',
  'Faible':'e-fini', 'Moyenne':'e-attente', 'Élevée':'e-bloque',
  'À orienter':'e-attente', 'Orienté':'e-cours', 'Rendez-vous fixé':'e-cours',
  'Patient vu':'e-fini', 'Sans suite':'e-fini'
};

/* Le liseré de gauche donne l'état d'un coup d'œil, sans lire :
   rouge si la remontée est critique, ambre si ça attend, vert si
   c'est en cours, gris si c'est clos. */
function classeReg(o){
  if(o.criticite === 'Élevée') return 't-bloque';
  if(o.statut === 'En cours') return 't-cours';
  if(['À faire','En attente','À suivre'].includes(o.statut)) return 't-attente';
  if(['Clos','Terminé'].includes(o.statut)) return 't-fini';
  return '';
}

/* Les initiales d'un nom pour la pastille de signature. Deux
   lettres suffisent ; « Anne Latisnère et Eva Poulmarch » en donne
   AL, et l'on lit le nom entier juste à côté. */
function initialesDe(nom){
  const m = String(nom || '').trim().split(/[\s'’-]+/).filter(Boolean);
  return (m.slice(0,2).map(x => x[0]).join('') || '?').toUpperCase();
}

function frdateJour(d){
  if(!d) return "Date non précisée";
  const t = new Date(d + 'T12:00:00');
  if(isNaN(t.getTime())) return d;
  const s = t.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function journal(k){
  const cfg = JOURNAL[k], lignes = chrono(k, etat[k]);
  if(!lignes.length)
    return `<div class="carte"><p class="vide">Rien à afficher pour le moment. La première saisie ouvre le suivi.</p></div>`;

  /* Classé à la main, l'ordre ne suit plus les jours : les
     intertitres de journée n'ont plus rien à séparer, et chaque
     carte porte alors sa date entière. */
  const manuel = estManuel(k);
  let h = '', jour = null;
  lignes.forEach((o, i) => {
    if(!manuel && o.date !== jour){
      jour = o.date;
      h += `<div class="reg-jour"><span class="n">${esc(frdateJour(jour))}</span>` +
           (jour === aujourdhui() ? `<span class="auj">aujourd'hui</span>` : '') + `</div>`;
    }

    const quand = manuel ? [frdate(o.date), o.heure].filter(Boolean).join(' à ') : o.heure;

    const etiqs = (cfg.etiq || []).map(c => o[c]).filter(Boolean)
      .map(v => `<span class="etiq ${ETIQ_REG[v] || 'e-lancer'}">${esc(v)}</span>`).join('');

    const chips = (cfg.chips || []).filter(x => o[x.c])
      .map(x => `<span><span class="k">${esc(x.l)}</span>${esc(o[x.c])}</span>`).join('');

    const blocs = (cfg.blocs || []).filter(x => o[x.c])
      .map(x => `<div class="bloc"><span class="k">${esc(x.l)}</span><div class="v">${esc(o[x.c])}</div></div>`).join('');

    const lien = cfg.lien && o[cfg.lien]
      ? `<a class="lien" href="${esc(o[cfg.lien])}" target="_blank" rel="noopener">${esc(cfg.lienL || 'Ouvrir')} ↗</a>` : '';

    const pied = [o.auteur ? 'Saisi par ' + o.auteur : '', o.modifiePar ? 'Modifié par ' + o.modifiePar : '',
                  o.echeance ? 'Échéance ' + frdateL(o.echeance) : '']
      .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

    const venu = cfg.venu && String(o[cfg.venu]||'').trim()
      ? `<span class="venu"><span class="p">Venu du dehors</span>${esc(o[cfg.venu])}</span>` : '';

    /* Celle ou celui qui s'en est chargé se signe : ses initiales en
       pastille, son nom à côté. C'est la contrepartie du bandeau de
       provenance — l'entrée dit d'un coup d'œil si elle vient de nous
       ou du dehors. */
    const perso = cfg.personne && String(o[cfg.personne]||'').trim()
      ? `<span class="par"><span class="av">${esc(initialesDe(o[cfg.personne]))}</span>
           <span class="nn"><span class="k">Pris en charge par</span>${esc(o[cfg.personne])}</span></span>` : '';

    h += `<article class="ent-r ${cfg.marque || ''} ${classeReg(o)}${venu ? ' dehors' : ''}">
      <div class="haut">
        ${quand ? `<span class="hr">${esc(quand)}</span>` : ''}${etiqs}${venu}
        <span class="outils">
          ${fleches(k, o.id, i, lignes.length)}
          <button title="Modifier" onclick="ouvrirEdition('${k}','${o.id}')">✎</button>
          <button title="Supprimer" onclick="supprimer('${k}','${o.id}')">×</button>
        </span>
      </div>
      <div class="ti">${esc(o[cfg.titre]) || '—'}</div>
      ${perso}
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${blocs}${lien}
      ${pied ? `<div class="pied">${pied}</div>` : ''}
    </article>`;
  });
  return h;
}

/* =========================================================
   VUES
   ========================================================= */

  }

  h += `<h2 style="margin-top:26px">Missions en un coup d'œil</h2>`;
  etat.missions.forEach(m => {
    h += `<div class="mission"><div class="haut">
      <div class="titre">${esc(m.titre)}</div>
      <span class="etiq ${classeStatut(m.statut)}">${esc(m.statut)}</span></div>
      <div class="meta">
        <div><span class="k">Pilote</span>${esc(m.pilote) || '<em style="color:var(--braise)">à désigner</em>'}</div>
        <div><span class="k">Mandat ARS</span>${esc(m.mandat)}</div>
        <div><span class="k">Suppléant</span>${esc(m.suppleant) || '—'}</div>
      </div></div>`;
  });

  h += `<h2 style="margin-top:26px">Dernières entrées en main courante</h2><div class="carte">`;
  if(!derniers.length){
    h += `<p class="vide">Rien de consigné pour l'instant. <a href="#" onclick="aller('courante');return false;">Ouvrir la main courante</a></p>`;
  }else{
    h += `<ul class="fil">` + derniers.map(e =>
      `<li><div class="h">${frdate(e.date)} ${esc(e.heure||'')}</div>
       <div class="c"><div class="t">${esc(e.evenement)}</div>
       ${e.suite?`<div class="d">${esc(e.suite)}</div>`:''}
       <div class="s">${esc([e.qui ? 'Pris en charge par ' + e.qui : '', e.source ? 'source : ' + e.source : '',
              e.auteur ? 'saisi par ' + e.auteur : ''].filter(Boolean).join(' · ')) || '—'}</div></div></li>`).join('') + `</ul>`;
  }
  return h + `</div>`;
}

function classeStatut(s){
  return {'À lancer':'e-lancer','En cours':'e-cours','En attente':'e-attente','Terminé':'e-fini','Bloqué':'e-bloque'}[s] || 'e-lancer';
}

/* Les renforts d'une mission : des personnes positionnées auprès
   du pilote, chacune avec ce qu'elle prend en charge. */
function renfortsDe(m){ return Array.isArray(m.renforts) ? m.renforts : []; }

function organigramme(){
  const gens = new Map();
  const ajoute = (nom, m, role, mention) => {
    const n = (nom || '').trim();
    if(!n) return;
    const cle = cleP(n);
    if(!gens.has(cle)) gens.set(cle, {nom:n, pilote:[], appui:[]});
    gens.get(cle)[role].push({t:m.titre, esp:espaceDe(m), mid:m.id, mention:mention||''});
  };
  etat.missions.forEach(m => {
    ajoute(m.pilote, m, 'pilote');
    ajoute(m.suppleant, m, 'appui', 'Suppléant');
    renfortsDe(m).forEach(r => ajoute(r.nom, m, 'appui', r.role || 'Renfort'));
  });

  const liste = [...gens.values()].sort((a,b) =>
    b.pilote.length - a.pilote.length || a.nom.localeCompare(b.nom, 'fr'));
  const vacantes = etat.missions.filter(m => !(m.pilote || '').trim());

  if(!liste.length && !vacantes.length) return '';

  let h = `<div class="legende">
    <span><i style="background:var(--cobalt-clair)"></i> Pilote de la mission</span>
    <span><i style="background:#F4F6FA;border:1px solid var(--trait)"></i> En appui</span>
    <span><i style="background:var(--braise)"></i> Mission sans pilote</span>
  </div><div class="orga">`;

  liste.forEach(p => {
    const tot = p.pilote.length + p.appui.length;
    const c = coord(p.nom);
    const nEsc = esc(p.nom).replace(/'/g, "\\'");
    let contact = '';
    if(c.tel) contact += `<a href="tel:${esc(c.tel.replace(/\s/g,''))}">📞 ${esc(c.tel)}</a>`;
    if(c.mail) contact += `<a href="mailto:${esc(c.mail)}">✉️ ${esc(c.mail)}</a>`;
    if(!contact) contact = `<span class="abs">Aucun contact renseigné</span>`;
    h += `<div class="pers">
      <div class="qui">${p.pilote.length ? 'Pilote' : 'Appui'}</div>
      <div class="nom">${esc(p.nom)}</div>
      <div class="compte">${tot} mission${tot>1?'s':''}${p.pilote.length&&p.appui.length?` · ${p.pilote.length} pilotée${p.pilote.length>1?'s':''}, ${p.appui.length} en appui`:''}</div>
      <div class="coord">${contact}
        <button class="modif" onclick="editerContact('${nEsc}')">${c.tel||c.mail?'Modifier le contact':'Ajouter un contact'}</button>
      </div>
      ${p.pilote.map(o=>ligneMission(o.mid, 'Pilote') + blocRenforts(o.mid)).join('')}
      ${p.appui.map(o=>ligneMission(o.mid, o.mention || 'Appui')).join('')}
      <button class="confier" onclick="nouvelleMission('${nEsc}')">+ Confier une mission à ${esc(p.nom.split(' ')[0])}</button>
    </div>`;
  });

  if(vacantes.length){
    h += `<div class="pers vacant">
      <div class="qui">Personne n'est dessus</div>
      <div class="nom">À pourvoir</div>
      <div class="compte">${vacantes.length} mission${vacantes.length>1?'s':''} sans pilote désigné</div>
      ${vacantes.map(m=>`<div class="mrow">
        <button class="chip vac" onclick="voirFiche('${m.id}')"><span class="r">Sans pilote · fiche mission</span>${esc(m.titre)}</button>
        <button class="crayon-m" title="Modifier la mission" onclick="modifierMission('${m.id}')">✎</button></div>
        <button class="rplus" style="margin:0 0 10px 12px" onclick="modifierMission('${m.id}')">Désigner un pilote</button>`).join('')}
    </div>`;
  }

  /* Dernière carte de la grille : créer une mission sans quitter
     l'organigramme. Elle se range ensuite sur la carte du pilote. */
  h += `<button class="neuve" onclick="nouvelleMission('')">
    <span class="plus">+</span>
    <span class="t">Créer une mission</span>
    <span class="d">Un intitulé, un pilote. La carte se range toute seule dans l'organigramme.</span>
  </button>`;

  return h + `</div>`;
}

/* =========================================================
   RÉFÉRENTS DE LA GESTION DE CRISE

   L'équipe qui tient la crise, en tête de l'onglet : nom,
   profession, numéro. On les appelle, on ne les cherche pas.
   ========================================================= */
function blocReferents(){
  etat.referents = etat.referents || [];
  return `<h2 style="margin-top:0">Référents de la gestion de crise</h2>
    <div class="refs">` +
    etat.referents.map(r => `<div class="ref">
      <div class="nom">${esc(r.nom)}</div>
      ${r.profession ? `<div class="prof">${esc(r.profession)}</div>` : ''}
      ${r.tel ? `<a href="tel:${esc(String(r.tel).replace(/\s/g,''))}">📞 ${esc(r.tel)}</a>`
              : `<span class="abs">Numéro à renseigner</span>`}
      <div class="b">
        <button class="modif" onclick="editerReferent('${r.id}')">Modifier</button>
        <button class="rx" title="Retirer ce référent" onclick="retirerReferent('${r.id}')">×</button>
      </div></div>`).join('') +
    `<button class="ref neuf" onclick="editerReferent('')">
      <span class="plus">+</span><span class="t">Ajouter un référent</span></button></div>`;
}

function editerReferent(id){
  const r = id ? (etat.referents || []).find(x => x.id === id) : null;
  document.getElementById('modale').innerHTML = `<h3>${r ? 'Modifier le référent' : 'Ajouter un référent'}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Les personnes qui tiennent la gestion de crise pour la CPTS Pau Béarn.</p>
    <label style="margin-bottom:10px"><span class="k">Prénom et nom *</span>
      <input id="rf-r-nom" value="${esc(r ? r.nom : '')}" placeholder="Prénom et nom"></label>
    <label style="margin-bottom:10px"><span class="k">Profession et rôle</span>
      <input id="rf-r-prof" value="${esc(r ? r.profession : '')}" placeholder="Ex. infirmière — vice-présidente"></label>
    <label style="margin-bottom:10px"><span class="k">Téléphone</span>
      <input id="rf-r-tel" type="tel" value="${esc(r ? r.tel : '')}" placeholder="06 12 34 56 78"
        onkeydown="if(event.key==='Enter')validerReferent('${id}')"></label>
    <div class="actions"><button class="btn" onclick="validerReferent('${id}')">Enregistrer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('rf-r-nom'); if(i) i.focus(); }, 60);
}

async function validerReferent(id){
  const nom = document.getElementById('rf-r-nom').value.trim();
  if(!nom){ toast("Le nom est obligatoire"); return; }
  const v = {
    nom: nom,
    profession: document.getElementById('rf-r-prof').value.trim(),
    tel: document.getElementById('rf-r-tel').value.trim()
  };
  etat.referents = etat.referents || [];
  const r = id ? etat.referents.find(x => x.id === id) : null;
  if(r){ Object.assign(r, v); r.modifiePar = moi; }
  else etat.referents.push(Object.assign({id:uid()}, v, {auteur:moi, quand:new Date().toISOString()}));
  const issue = await sauver();
  fermer(); rendre();
  toast(issue === 'ok' ? "Référent enregistré et partagé avec le copil"
                       : "Référent conservé sur cet appareil — le serveur n'a pas répondu");
}

async function retirerReferent(id){
  const r = (etat.referents || []).find(x => x.id === id); if(!r) return;
  document.getElementById('modale').innerHTML = `<h3>Retirer ce référent&nbsp;?</h3>
    <p style="color:var(--texte-2)">${esc(r.nom)} ne figurera plus parmi les référents de la gestion de crise.</p>
    <div class="actions"><button class="btn" onclick="confirmerRetraitReferent('${id}')">Retirer</button>
      <button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function confirmerRetraitReferent(id){
  noterRetrait(id);
  etat.referents = (etat.referents || []).filter(x => x.id !== id);
  await sauver(); fermer(); rendre(); toast("Référent retiré");
}

/* La pastille ouvre la fiche mission, le crayon la modifie :
   deux boutons côte à côte, jamais l'un dans l'autre. */
function ligneMission(mid, role){
  const m = etat.missions.find(x => x.id === mid); if(!m) return '';
  return `<div class="mrow">
    <button class="chip${role === 'Pilote' ? '' : ' appui'}" onclick="voirFiche('${mid}')">
      <span class="r">${esc(role)} · fiche mission</span>${esc(m.titre)}</button>
    <button class="crayon-m" title="Modifier la mission" onclick="modifierMission('${mid}')">✎</button>
  </div>`;
}

/* Les renforts s'ajoutent là où on les cherche : sous la mission,
   sur la carte du pilote comme dans la répartition détaillée. */
function blocRenforts(mid){
  const m = etat.missions.find(x => x.id === mid);
  if(!m) return '';
  return `<div class="renforts">` +
    renfortsDe(m).map((r,i) => `<div class="rf">
      <div class="n">${esc(r.nom)}${r.role ? `<span class="q">${esc(r.role)}</span>` : ''}</div>
      <button class="rx" title="Retirer ce renfort" onclick="retirerRenfort('${mid}',${i})">×</button>
    </div>`).join('') +
    `<button class="rplus" onclick="ajouterRenfort('${mid}')">+ Ajouter un renfort</button></div>`;
}

function ajouterRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const noms = nomsMissionnes().filter(n => cleP(n) !== cleP(m.pilote));
  document.getElementById('modale').innerHTML = `<h3>Renfort sur « ${esc(m.titre)} »</h3>
    <p style="color:var(--texte-2);margin:0 0 14px">Une personne positionnée auprès de ${m.pilote ? esc(m.pilote) : 'la mission'}, avec ce qu'elle prend en charge. Elle apparaîtra dans l'organigramme, où son numéro pourra être renseigné.</p>
    ${noms.length ? `<p style="color:var(--texte-2);font-size:13px;margin:0 0 8px">Déjà dans le cockpit&nbsp;:</p>
      <div class="choixnom">${noms.map(n => `<button onclick="document.getElementById('rf-nom').value='${esc(n).replace(/'/g,"\\'")}'">${esc(n)}</button>`).join('')}</div>` : ''}
    <label><span class="k">Prénom et nom *</span><input id="rf-nom" placeholder="Prénom et nom"></label>
    <label style="margin-top:12px"><span class="k">Ce qu'il ou elle prend en charge</span>
      <input id="rf-role" placeholder="Ex. phoning auprès des pharmaciens" onkeydown="if(event.key==='Enter')validerRenfort('${mid}')"></label>
    <div class="actions"><button class="btn" onclick="validerRenfort('${mid}')">Ajouter</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('rf-nom'); if(i) i.focus(); }, 60);
}

async function validerRenfort(mid){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const nom = document.getElementById('rf-nom').value.trim();
  if(!nom){ toast("Le nom est obligatoire"); return; }
  m.renforts = renfortsDe(m).concat([{nom:nom, role:document.getElementById('rf-role').value.trim(), par:moi}]);
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Renfort ajouté");
}

async function retirerRenfort(mid, i){
  const m = etat.missions.find(x => x.id === mid); if(!m) return;
  const r = renfortsDe(m).slice();
  r.splice(i,1);
  m.renforts = r;
  m.modifiePar = moi;
  await sauver(); rendre();
}

  let h = `<h1>Missions et organigramme</h1>

      <div style="color:var(--texte-2);font-size:14px;margin-top:5px">${esc(m.detail)}</div>

          <input value="${esc(m.pilote)}" placeholder="à désigner" onchange="majMission('${m.id}','pilote',this.value)"></div>

        <div style="flex:1;min-width:160px"><span class="k">Mandat ARS</span>
          <input value="${esc(m.mandat)}" onchange="majMission('${m.id}','mandat',this.value)"></div>

function lignes(t){ return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean); }

  const f = m.fiche || {};
  const li = lignes(f.faire);
  document.getElementById('modale').innerHTML = `
    <h3>${esc(m.titre)}</h3>
    <div class="fiche">
      <h4>Pourquoi</h4><p>${esc(f.but) || 'À renseigner.'}</p>

      <h4>Pour qui</h4><p>${esc(f.pour) || '—'}</p>

function editerFiche(id){

  const opts = ONGLETS.filter(o => !['cockpit','missions'].includes(o.id))
    .map(o => `<option value="${o.id}" ${espaceDe(m)===o.id?'selected':''}>${o.nom}</option>`).join('');
  document.getElementById('modale').innerHTML = `
    <h3>Fiche mission</h3>
    <label style="margin-bottom:10px"><span class="k">Intitulé</span><input id="fi-titre" value="${esc(m.titre)}"></label>
    <label style="margin-bottom:10px"><span class="k">Pourquoi — une phrase</span><textarea id="fi-but" style="min-height:56px">${esc(f.but||'')}</textarea></label>
    <label style="margin-bottom:10px"><span class="k">Ce qu'il y a à faire — une action par ligne</span><textarea id="fi-faire">${esc(f.faire||'')}</textarea></label>

    <label style="margin-bottom:10px"><span class="k">Pour qui</span><input id="fi-pour" value="${esc(f.pour||'')}"></label>
    <label style="margin-bottom:10px"><span class="k">Ce qu'on ne fait pas</span><textarea id="fi-limite" style="min-height:56px">${esc(f.limite||'')}</textarea></label>

  document.getElementById('rideau').classList.add('on');
}

async function validerFiche(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  const g = k => document.getElementById('fi-'+k).value.trim();
  m.titre = g('titre') || m.titre;
  m.espace = g('espace');
  m.fiche = {but:g('but'), faire:g('faire'), avec:g('avec'), pour:g('pour'), limite:g('limite')};
  m.modifiePar = moi;
  await sauver(); fermer(); rendre(); toast("Fiche enregistrée");
}

/* Les noms déjà connus, proposés en un clic : on tape rarement
   deux fois le même nom, et une faute de frappe crée une carte
   en double dans l'organigramme. */
function choixPilote(champ, actuel, exclu){
  const noms = nomsMissionnes().filter(n => !exclu || cleP(n) !== cleP(exclu));
  if(!noms.length) return '';
  return `<div class="choixnom compact">` + noms.map(n =>
    `<button class="${cleP(n)===cleP(actuel)?'on':''}" onclick="document.getElementById('${champ}').value='${esc(n).replace(/'/g,"\\'")}'">${esc(n)}</button>`).join('') + `</div>`;
}

function nouvelleMission(pilote){
  pilote = pilote || '';
  const opts = ONGLETS.filter(o => !['cockpit','missions'].includes(o.id))
    .map(o => `<option value="${o.id}">${o.nom}</option>`).join('');
  document.getElementById('modale').innerHTML = `

    <label style="margin-bottom:10px"><input id="nm-pilote" value="${esc(pilote)}" placeholder="Prénom et nom, ou à désigner plus tard"></label>
    <label style="margin-bottom:10px"><span class="k">Mandat ARS</span><input id="nm-mandat" value="Non"></label>

}

/* Renommer, réaffecter, clore : tout ce qui se corrige au fil de
   l'eau sur une mission, sans descendre dans la répartition. */
function modifierMission(id){

async function validerModifMission(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;

  await sauver(); fermer(); rendre(); toast("Mission mise à jour");
}
async function validerMission(){
  const t = document.getElementById('nm-titre').value.trim();
  if(!t){ toast("L'intitulé est obligatoire"); return; }
  const p = document.getElementById('nm-pilote').value.trim();
  etat.missions.push({
    id:uid(), titre:t,

    statut:'À lancer', espace:document.getElementById('nm-espace').value,
    fiche:{but:'', faire:'', avec:'', pour:'', limite:''}, creePar:moi
  });

  toast(p ? `Mission confiée à ${p}` : "Mission créée — reste à désigner un pilote");

async function supprimerMission(id){
  const m = etat.missions.find(x => x.id === id); if(!m) return;
  document.getElementById('modale').innerHTML = `<h3>Supprimer cette mission&nbsp;?</h3>
    <p style="color:var(--texte-2)">« ${esc(m.titre)} » disparaîtra de l'organigramme. Les saisies déjà enregistrées dans son espace sont conservées.</p>
    <div class="actions"><button class="btn" onclick="confirmerSuppression('${id}')">Supprimer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function confirmerSuppression(id){
  noterRetrait(id);
  etat.missions = etat.missions.filter(x => x.id !== id);
  await sauver(); fermer(); rendre(); toast("Mission supprimée");
}

async function majMission(id, champ, val){
  const m = etat.missions.find(x => x.id === id);
  if(!m) return;
  m[champ] = val.trim();
  m.modifiePar = moi;
  await sauver();
  if(champ === 'statut' || champ === 'pilote' || champ === 'suppleant') rendre();
  else toast("Enregistré");
}

/* =========================================================
   SITUATION RÉGIONALE — le poste de veille

   La page ne fait plus qu'une chose : dire l'état de la région, et
   le tenir à jour. Deux objets, dans cet ordre :

   1. Les visios de crise de l'ARS — la source la plus dense dont
      dispose la CPTS. Elles ouvrent la page.
   2. Les points de situation — les feuillets qu'on maintient à
      jour : avancée des feux, qualité de l'air, situation
      sanitaire, consignes aux libéraux… C'est ce qui se lit au
      copil.

   Le carnet de canaux, le tour de veille et le fil des informations
   retenues ont été retirés : ils demandaient un parcours que
   personne n'a le temps de faire en crise. Le geste attendu tient
   désormais en un copier-coller dans le bon feuillet. Les données
   correspondantes restent dans l'état partagé, sans affichage.
   ========================================================= */
const SEUIL_POINT_H  = 12;  // au-delà, un point de situation est à rafraîchir
let brouillonPoint = null;
/* Le mode d'emploi reste ouvert tant qu'on ne l'a pas replié soi-même :
   c'est la première chose que voit qui prend la veille. */
let guideVeille = (() => { try{ return localStorage.getItem('cpts64_guide_veille') !== 'ferme'; }catch(e){ return true; } })();
function basculerGuide(){
  guideVeille = !guideVeille;
  try{ localStorage.setItem('cpts64_guide_veille', guideVeille ? 'ouvert' : 'ferme'); }catch(e){}
  rendre();
}

const horodate = () => aujourdhui() + ' ' + maintenant();
function heuresDepuis(q){
  if(!q) return Infinity;
  const t = new Date(q.slice(0,10) + 'T' + (q.slice(11,16) || '00:00') + ':00');
  return isNaN(t) ? Infinity : (Date.now() - t) / 36e5;
}
const rubriques = () => etat.rubriques || [];
const rubriqueDe = id => rubriques().find(r => r.id === id);
const nomPoint = id => { const r = rubriqueDe(id); return r ? r.nom : ''; };
/* Un point non réécrit depuis un demi-tour d'horloge est à
   rafraîchir : c'est ce qui donne sa liste de travail à qui prend
   la veille. Un point jamais écrit l'est toujours. */
const pointARafraichir = r => !r.maj || heuresDepuis(r.maj) >= SEUIL_POINT_H;
/* La dernière trace laissée sur cette page, quelle qu'en soit la
   nature : réécriture d'un point ou compte rendu de visio. C'est
   elle qui dit si ce qu'on lit ici est encore frais. */
function derniereActualisation(){
  let d = null;
  const retenir = (quand, par, quoi) => {
    const q = quandNormalise(quand);
    if(q && (!d || q > d.quand)) d = {quand:q, par: par || '', quoi};
  };
  rubriques().forEach(r => retenir(r.maj, r.par, 'Point « ' + r.nom + ' »'));
  (etat.visios||[]).forEach(v => retenir(v.quand, v.auteur, 'Compte rendu de la visio du ' + frdate(v.date)));
  return d;
}
/* Les points sont datés « AAAA-MM-JJ HH:MM », les visios en ISO :
   on ramène les deux à la même forme locale avant de les comparer. */
function quandNormalise(q){
  if(!q) return '';
  if(q.indexOf('T') === -1) return q;
  const t = new Date(q);
  if(isNaN(t)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
}
/* Qui tient la veille : le pilote de la mission rattachée à cet
   espace. Une seule source de vérité, dans Missions & organigramme. */
const missionVeille = () => (etat.missions||[]).find(m => espaceDe(m) === 'veille');

/* =========================================================
   LES VISIOS DE CRISE DE L'ARS

   L'ARS réunit ses partenaires en visioconférence à intervalle
   régulier et y déroule la situation de la région point par
   point. C'est, de loin, la source la plus dense dont dispose la
   CPTS : plutôt que de la laisser se diluer dans le fil des
   informations retenues, elle ouvre la situation régionale.

   La dernière séance s'affiche en entier, dépliée. Les
   précédentes se replient sous elle et se rouvrent d'un clic :
   on relit ce qui a été dit il y a deux jours sans quitter la
   page.
   ========================================================= */
let visioOuverte = null;
let pointsSaisie = [];

const visios = () => etat.visios || [];
const visiosTriees = () => [...visios()].sort((a,b) =>
  ((b.date||'') + ' ' + (b.heure||'')).localeCompare((a.date||'') + ' ' + (a.heure||'')));
const visioVide = v => !(v.points||[]).length && !v.consignes && !v.pourNous;

function ouvrirVisio(id){ visioOuverte = (visioOuverte === id) ? null : id; rendre(); }

function vueVisios(){
  const l = visiosTriees();
  const derniere = l[0];
  const avant = l.slice(1);
  const aConsigner = l.filter(visioVide).length;

  let h = `<div class="visios">
    <div class="tete-v">
      <div>
        <h2 style="margin:0 0 3px">Ce que l'ARS a dit à sa dernière visio</h2>
        <p class="sous-v">Les points de situation régionaux de l'ARS Nouvelle-Aquitaine, dans l'ordre où ils ont été abordés. C'est la source la plus complète dont dispose la CPTS : elle passe avant tout le reste.</p>
      </div>
      <button class="btn" onclick="ouvrirSaisieVisio()">Consigner une visio</button>
    </div>`;

  if(!l.length){
    return h + `<div class="carte" style="margin:0"><p class="vide">Aucune visio consignée. Dès la prochaine séance, notez-en les points ici : c'est ce que le reste de l'équipe lira en premier.</p></div></div>`;
  }

  if(aConsigner) h += `<div class="alerte-v">${aConsigner === 1
    ? "Une séance a eu lieu sans que son compte rendu soit consigné."
    : aConsigner + " séances ont eu lieu sans que leur compte rendu soit consigné."} Ce qui s'y est dit n'existe nulle part ailleurs dans le cockpit : à reprendre auprès de la personne qui y assistait, tant que c'est frais.</div>`;

  h += carteVisio(derniere, true);

  if(avant.length){
    h += `<div class="avant-v"><span class="k">Séances précédentes</span>`;
    avant.forEach(v => { h += carteVisio(v, visioOuverte === v.id); });
    h += `</div>`;
  }

  return h + `</div>`;
}

function carteVisio(v, deplie){
  const pts = v.points || [];
  const vide = visioVide(v);
  const quand = `${frdate(v.date)}${v.heure ? ' à ' + esc(v.heure) : ''}`;

  let h = `<div class="visio ${deplie ? 'ouverte' : ''} ${vide ? 'creuse' : ''}">
    <button class="tete" onclick="ouvrirVisio('${v.id}')" aria-expanded="${!!deplie}">
      <span class="q">${quand}</span>
      <span class="i">
        <span class="n">${esc(v.instance || "Visio de crise de l'ARS")}</span>
        <span class="s">${[v.represente ? 'CPTS représentée par ' + v.represente : '',
          vide ? 'compte rendu à consigner' : pts.length + ' point' + (pts.length > 1 ? 's' : '') + ' abordé' + (pts.length > 1 ? 's' : '')]
          .filter(Boolean).map(esc).join(' · ')}</span>
      </span>
      <span class="chev">${deplie ? '▲' : '▼'}</span>
    </button>`;

  if(deplie){
    h += `<div class="dedans">`;

    if(vide){
      h += `<div class="manque-v">${esc(v.manquant ||
        "Rien n'a été rapporté de cette séance. Ce qui s'y est dit n'existe nulle part ailleurs dans le cockpit.")}</div>`;
    }

    if(pts.length) h += `<ol class="pts-v">${pts.map(p => `<li>
      <div class="t">${esc(p.titre)}</div>
      <div class="d">${esc(p.texte).replace(/\n/g,'<br>')}</div>
    </li>`).join('')}</ol>`;

    if(v.consignes) h += `<div class="bloc-v consignes">
      <span class="k">Ce que l'ARS demande</span><div class="d">${esc(v.consignes).replace(/\n/g,'<br>')}</div></div>`;

    if(v.pourNous) h += `<div class="bloc-v pour-nous">
      <span class="k">Ce que ça change pour la CPTS Pau Béarn</span><div class="d">${esc(v.pourNous).replace(/\n/g,'<br>')}</div></div>`;

    if(v.prochaine) h += `<div class="bloc-v"><span class="k">Prochaine séance</span><div class="d">${esc(v.prochaine)}</div></div>`;

    h += `<div class="bas-v">
      <button class="btn${vide ? '' : ' sec'}" onclick="ouvrirSaisieVisio('${v.id}')">${vide ? 'Consigner le compte rendu' : 'Modifier'}</button>
      <button class="retirer sup" onclick="supprimerVisio('${v.id}')">Retirer</button>
    </div></div>`;
  }

  return h + `</div>`;
}

/* --- Saisie d'une séance -------------------------------
   Les points s'ajoutent un par un, dans l'ordre où ils ont été
   abordés : c'est la forme sous laquelle l'ARS les déroule, et
   celle sous laquelle on les relit. */
function ouvrirSaisieVisio(id){
  const v = id ? visios().find(x => x.id === id) : null;
  pointsSaisie = v ? JSON.parse(JSON.stringify(v.points || [])) : [];
  if(!pointsSaisie.length) pointsSaisie.push({titre:'', texte:''});
  const g = (c, d) => esc(v ? (v[c] ?? '') : (d ?? ''));
  const m = document.getElementById('modale');
  m.classList.add('large');
  m.innerHTML = `<h3>${v ? 'Compte rendu de la visio' : 'Consigner une visio de crise'}</h3>
  <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">Un point par sujet abordé, dans l'ordre de la séance. Le titre se lit seul dans la liste ; le texte porte ce qui a été dit. Rien ne remplace une phrase écrite le soir même.</p>
  <div class="form">
    <label><span class="k">Date *</span><input id="vs-date" type="date" value="${g('date', aujourdhui())}"></label>
    <label><span class="k">Heure</span><input id="vs-heure" type="time" value="${g('heure', '15:00')}"></label>
    <label class="large"><span class="k">Instance</span>
      <input id="vs-instance" value="${g('instance', "Visio de crise de l'ARS Nouvelle-Aquitaine")}"></label>
    <label class="large"><span class="k">CPTS représentée par</span>
      <input id="vs-represente" value="${g('represente', moi === 'Anonyme' ? '' : moi)}" placeholder="Qui y assistait pour la CPTS Pau Béarn"></label>
  </div>

  <div style="margin-top:18px">
    <div class="barre-h" style="margin-bottom:8px">
      <span class="cpt-h">Points abordés</span>
      <button class="btn sec" onclick="ajouterPointVisio()">Ajouter un point</button>
    </div>
    <div id="pts-saisie">${pointsSaisie.map(pointVisioHTML).join('')}</div>
  </div>

  <div class="form" style="margin-top:16px">
    <label class="large"><span class="k">Ce que l'ARS demande</span>
      <textarea id="vs-consignes" placeholder="Les consignes explicites sorties de la séance, celles qu'on peut citer.">${g('consignes')}</textarea></label>
    <label class="large"><span class="k">Ce que ça change pour la CPTS Pau Béarn</span>
      <textarea id="vs-pourNous" placeholder="Ce qu'il faut décider, lancer ou arrêter de notre côté à la suite de cette séance.">${g('pourNous')}</textarea></label>
    <label class="large"><span class="k">Prochaine séance</span>
      <input id="vs-prochaine" value="${g('prochaine')}" placeholder="Ex. demain 15h, même lien"></label>
  </div>

  <div style="margin-top:14px"><label class="coche">
    <input type="checkbox" id="vs-mc" ${v && !visioVide(v) ? '' : 'checked'}>
    <span>Consigner en main courante
      <span class="d">Coché par défaut : toute information recueillie se retrouve dans la main courante, en plus de sa rubrique.</span></span>
  </label></div>

  <div class="actions">
    <button class="btn" onclick="validerVisio(${v ? `'${v.id}'` : ''})">Enregistrer</button>
    <button class="btn sec" onclick="fermer()">Annuler</button>
  </div>`;
  document.getElementById('rideau').classList.add('on');
}

function pointVisioHTML(p, i){
  return `<div class="pt-saisie" data-i="${i}">
    <div class="num">Point ${i+1}
      <button type="button" onclick="retirerPointVisio(${i})" title="Retirer ce point">Retirer ×</button></div>
    <input id="ps-titre-${i}" value="${esc(p.titre||'')}" placeholder="Ex. Évolution des fronts, situation hospitalière, transports sanitaires…"
      onchange="majPointVisio(${i},'titre',this.value)">
    <textarea id="ps-texte-${i}" placeholder="Ce qui a été dit sur ce point."
      onchange="majPointVisio(${i},'texte',this.value)">${esc(p.texte||'')}</textarea>
  </div>`;
}

function majPointVisio(i, c, v){ if(pointsSaisie[i]) pointsSaisie[i][c] = v; }

/* Les champs ne se déclarent qu'au « change » : avant de
   redessiner la liste, on relit ce qui est à l'écran pour ne pas
   perdre une saisie en cours. */
function relirePointsVisio(){
  pointsSaisie.forEach((p, i) => {
    ['titre','texte'].forEach(c => {
      const e = document.getElementById(`ps-${c}-${i}`);
      if(e) p[c] = e.value;
    });
  });
}
function redessinerPointsVisio(){
  const z = document.getElementById('pts-saisie');
  if(z) z.innerHTML = pointsSaisie.map(pointVisioHTML).join('');
}
function ajouterPointVisio(){
  relirePointsVisio();
  pointsSaisie.push({titre:'', texte:''});
  redessinerPointsVisio();
  const e = document.getElementById(`ps-titre-${pointsSaisie.length - 1}`);
  if(e){ e.scrollIntoView({block:'center'}); e.focus(); }
}
function retirerPointVisio(i){
  relirePointsVisio();
  pointsSaisie.splice(i, 1);
  if(!pointsSaisie.length) pointsSaisie.push({titre:'', texte:''});
  redessinerPointsVisio();
}

async function validerVisio(id){
  relirePointsVisio();
  const g = c => (document.getElementById('vs-' + c) || {}).value || '';
  const date = g('date');
  if(!date){ toast("La date de la séance est obligatoire"); return; }

  /* Un point sans titre ni texte n'est qu'une ligne restée vide :
     on ne la garde pas. Un point titré sans texte se garde — c'est
     un sujet abordé dont on n'a pas retenu le détail. */
  const points = pointsSaisie
    .map(p => ({titre:(p.titre||'').trim(), texte:(p.texte||'').trim()}))
    .filter(p => p.titre || p.texte)
    .map(p => ({titre: p.titre || 'Point sans intitulé', texte: p.texte}));

  const champs = {
    date, heure:g('heure').trim(), instance:g('instance').trim(),
    represente:g('represente').trim(), points,
    consignes:g('consignes').trim(), pourNous:g('pourNous').trim(),
    prochaine:g('prochaine').trim()
  };

  etat.visios = etat.visios || [];
  const v = id ? etat.visios.find(x => x.id === id) : null;
  if(v){
    Object.assign(v, champs, {modifiePar: moi});
    /* Le rappel « compte rendu manquant » n'a plus lieu d'être une
       fois la séance renseignée. */
    if(points.length || champs.consignes || champs.pourNous) delete v.manquant;
  }else{
    etat.visios.push(Object.assign({id:uid(), auteur:moi, quand:new Date().toISOString()}, champs));
  }

  const mc = (document.getElementById('vs-mc') || {}).checked;
  if(mc) consignerVisioEnCourante(champs);

  /* Le point de situation « Points de situation de l'ARS » se
     réécrit à partir de la séance : c'est ce qui se lit au copil. */
  majPointARS(champs);

  visioOuverte = id || null;
  await sauver(); fermer(); rendre();
  toast(mc ? "Visio consignée, et reportée en main courante" : "Visio consignée");
}

function consignerVisioEnCourante(v){
  etat.courante = etat.courante || [];
  const corps = (v.points||[]).map(p => '· ' + p.titre + (p.texte ? ' : ' + p.texte : '')).join('\n');
  etat.courante.unshift({
    id: uid(), date: v.date, heure: v.heure || '', source: 'ARS Nouvelle-Aquitaine',
    evenement: (v.instance || "Visio de crise de l'ARS")
      + (v.represente ? ` — la CPTS Pau Béarn y était représentée par ${v.represente}` : '')
      + (corps ? '.\n' + corps : '.')
      + (v.consignes ? "\nCe que l'ARS demande : " + v.consignes : ''),
    suite: v.pourNous || "Compte rendu consigné dans « Situation régionale ». Reste à en tirer ce qui appelle une décision du copil.",
    qui: v.represente || moi,
    auteur: moi, quand: ''
  });
}

function majPointARS(v){
  const r = rubriqueDe('rb-ars');
  if(!r) return;
  const lignes = (v.points||[]).map(p => p.titre + (p.texte ? ' : ' + p.texte : ''));
  if(!lignes.length && !v.consignes) return;
  r.etat = `Au point du ${frdateL(v.date)}${v.heure ? ' à ' + v.heure : ''} :\n`
    + lignes.map(x => '— ' + x).join('\n')
    + (v.consignes ? `\n\nCe que l'ARS demande : ${v.consignes}` : '');
  r.maj = horodate();
  r.par = moi;
}

async function supprimerVisio(id){
  const v = visios().find(x => x.id === id);
  if(!v) return;
  if(!confirm(`Retirer le compte rendu de la séance du ${frdateL(v.date)} ?\n\nCe qui s'y est dit n'existe nulle part ailleurs dans le cockpit.`)) return;
  noterRetrait(id);
  etat.visios = visios().filter(x => x.id !== id);
  await sauver(); rendre(); toast("Séance retirée");
}

function vueVeille(){
  const m = missionVeille();
  const pilote = m && m.pilote ? m.pilote : '';
  const maj = derniereActualisation();
  const arafraichir = rubriques().filter(pointARafraichir);

  let h = `<h1>Situation régionale</h1>
  <p class="chapo">L'état de la région, tenu à jour par la CPTS Pau Béarn. Les visios de crise de l'ARS ouvrent la page : c'est la source la plus complète dont nous disposons. Viennent ensuite ${rubriques().length} points de situation, un par sujet, qu'il suffit de reprendre quand quelque chose bouge.</p>`;

  /* --- ce que l'ARS a dit à sa dernière visio --- */
  h += vueVisios();

  /* --- qui tient la page, et depuis quand elle n'a pas bougé --- */
  h += `<div class="poste ${pilote ? '' : 'vacant'}">
    <div class="qui">
      <span class="k">Veille tenue par</span>
      <div class="nom">${pilote ? esc(pilote) : 'Personne'}</div>
      <div class="depuis">${pilote
        ? `Mission « ${esc(m.titre)} »${m.suppleant ? ' · suppléance : ' + esc(m.suppleant) : ''}`
        : `Aucun pilote nommé sur la mission de veille — la page ne se tiendra pas toute seule. Cela se nomme dans <a href="#" onclick="aller('missions');return false;">Missions &amp; organigramme</a>.`}</div>
    </div>
    <div class="tours">
      <div class="tour-t ${!maj ? 'du' : (heuresDepuis(maj.quand) < SEUIL_POINT_H ? 'fait' : 'du')}">
        <div class="q">Dernière actualisation</div>
        <div class="v">${maj
          ? `<b>${frdate(maj.quand.slice(0,10))} à ${esc(maj.quand.slice(11,16))}</b><br>${esc(maj.quoi)}${maj.par ? ' · ' + esc(maj.par) : ''}`
          : `<b>Jamais</b><br>Rien n'a encore été écrit sur cette page`}</div>
      </div>
    </div>
  </div>`;

  /* --- le mode d'emploi, pour qui prend la page en cours de route --- */
  h += `<div class="repli guide">
    <button class="tete" onclick="basculerGuide()">
      <div>
        <div class="t">Tenir cette page : trois gestes</div>
        <div class="s">${guideVeille ? "À replier une fois la main prise" : "Déplier si vous prenez la veille pour la première fois"}</div>
      </div>
      <span class="chev">${guideVeille ? '▾' : '▸'}</span>
    </button>
    ${guideVeille ? `<div class="dedans"><ol class="gestes-g">
      <li><b>Consigner la visio de l'ARS.</b> Après chaque séance, « Consigner une visio » en haut de page : un point par sujet abordé, dans l'ordre. Le copier-coller de vos notes suffit. Une séance à laquelle on a assisté sans rien en rapporter reste signalée en rouge.</li>
      <li><b>Reprendre les points qui ont bougé.</b> Ouvrir le feuillet concerné, coller ce qu'on a trouvé — communiqué, compte rendu, mail — et enregistrer. Pas besoin de reformuler : mieux vaut le texte brut de la source qu'un résumé approximatif.</li>
      <li><b>Laisser le reste tranquille.</b> Un point qui n'a pas bougé depuis ${SEUIL_POINT_H} h passe en orange : c'est un rappel, pas un reproche. Rien ne part aux adhérents depuis cette page — la diffusion se décide au copil.</li>
    </ol>
    <p class="apres">Chaque enregistrement laisse sa trace en <a href="#" onclick="aller('courante');return false;">Main courante</a>. Les échanges avec l'ARS — mails, appels, questions posées — ont leur propre onglet, <a href="#" onclick="aller('ars');return false;">Échanges avec l'ARS</a>.</p>
    </div>` : ''}
  </div>`;

  /* --- les points de situation --- */
  h += vuePoints(arafraichir.length);

  return h;
}

/* Les feuillets de la situation régionale. Chacun porte ce qu'on
   sait à l'instant, ce qu'on y suit, et où on va le chercher :
   prendre la veille, c'est reprendre ceux qui ont vieilli. */
function vuePoints(nbRafraichir){
  const l = rubriques();
  let h = `<h2 style="margin-top:26px">Les points de situation
    <span class="cpt-h">${l.length} feuillet${l.length > 1 ? 's' : ''}${nbRafraichir ? ' · ' + nbRafraichir + ' à rafraîchir' : ' · tous à jour'}</span></h2>
  <p class="sous-h">C'est ce qui se lit au copil. Chaque point se réécrit à partir de ce que la veille a retenu — au présent, en quelques lignes.</p>
  <div class="points">`;

  h += l.map(r => {
    const vieux = pointARafraichir(r);
    return `<div class="pt ${r.etat ? '' : 'vierge'} ${vieux && r.etat ? 'vieux' : ''}">
      <div class="n">${esc(r.nom)}</div>
      <div class="e ${r.etat ? '' : 'rien'}">${r.etat
        ? esc(r.etat).replace(/\n/g,'<br>')
        : "Point encore vierge — rien n'y a été écrit depuis le début de la crise."}</div>
      <div class="q"><span class="k">Ce qu'on y suit</span>${esc(r.quoi)}</div>
      ${r.ou ? `<div class="q"><span class="k">Où on le trouve</span>${esc(r.ou)}</div>` : ''}
      <div class="meta">${r.maj
        ? `Mis à jour ${frdate(r.maj.slice(0,10))} à ${esc(r.maj.slice(11,16))}${r.par ? ' par ' + esc(r.par) : ''}${vieux ? ' · à rafraîchir' : ''}`
        : 'Jamais renseigné'}</div>
      <div class="b">
        <button class="maj" onclick="ouvrirPointSituation('${r.id}')">${r.etat ? 'Mettre à jour ce point' : 'Écrire le point'}</button>
      </div>
    </div>`;
  }).join('');

  return h + `</div>`;
}

/* ---------- les points de situation ---------- */
function ouvrirPointSituation(id){
  const r = rubriqueDe(id);
  if(!r) return;
  brouillonPoint = id;
  document.getElementById('modale').innerHTML = `<h3>${esc(r.nom)}</h3>
    <p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">${esc(r.quoi)}${r.ou ? ' <em>Où on le trouve : ' + esc(r.ou) + '</em>' : ''}</p>
    <div class="rappel">Le copier-coller fait l'affaire : collez le passage utile du communiqué, du compte rendu ou du mail. Mieux vaut le texte brut de la source qu'un résumé approximatif.</div>
    <div class="form">
      <label class="large"><span class="k">Ce qu'on sait à cet instant</span>
        <textarea id="p-etat" rows="9" placeholder="Ce qui est établi, ce qui a changé depuis hier, ce qui reste incertain. Dater ce qui est daté.">${esc(r.etat)}</textarea>
        <span class="aide">Ce texte remplace le précédent — la version d'avant reste tracée en main courante.</span></label>
    </div>
    <div style="margin-top:14px"><label class="coche">
      <input type="checkbox" id="p-mc" checked>
      <span>Consigner la mise à jour en main courante
        <span class="d">Coché par défaut : toute information recueillie se retrouve dans la main courante, en plus de sa rubrique.</span></span>
    </label></div>
    <div class="actions">
      <button class="btn" onclick="validerPointSituation()">Enregistrer le point</button>
      <button class="btn sec" onclick="fermer()">Annuler</button>
    </div>`;
  document.getElementById('rideau').classList.add('on');
  setTimeout(()=>{ const i = document.getElementById('p-etat'); if(i) i.focus(); }, 60);
}
async function validerPointSituation(){
  const r = rubriqueDe(brouillonPoint);
  if(!r) return;
  const v = document.getElementById('p-etat').value.trim();
  if(!v){ toast("Le point est vide"); document.getElementById('p-etat')?.focus(); return; }
  const mc = document.getElementById('p-mc').checked;
  if(v === r.etat){ fermer(); toast("Le point n'a pas changé"); return; }
  r.etat = v;
  r.maj = horodate();
  r.par = moi;
  if(mc) consignerPointEnCourante(r, '');
  await sauver(); fermer(); rendre();
  toast(mc ? "Point mis à jour, et consigné en main courante" : "Point mis à jour");
}
/* Même règle que pour le reste du cockpit : ce qui est écrit ici se
   retrouve dans la main courante, qui garde la trace de l'état
   précédent du point. */
function consignerPointEnCourante(r, motif){
  etat.courante = etat.courante || [];
  etat.courante.unshift({
    id: uid(),
    date: aujourdhui(),
    heure: maintenant(),
    source: '',
    evenement: "Point de situation — " + r.nom + (motif ? " (" + motif + ")" : '') + "\n" + r.etat,
    suite: "Situation régionale : le point « " + r.nom + " » a été repris. Il fait foi jusqu'à la prochaine mise à jour.",
    qui: moi,
    auteur: moi,
    quand: ''
  });
}

function evenements(){
  const e = [];
  const push = (o, type, titre, detail, qui) => {
    if(!titre) return;
    e.push({date:o.date||'', heure:o.heure||'', type, titre, detail:detail||'', qui:qui||o.auteur||''});
  };
  (etat.ars||[]).forEach(o => push(o,'ARS',o.objet,
    [o.sens,o.interlocuteur,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.courante||[]).forEach(o => push(o,'Consigné',o.evenement,
    [o.qui ? 'Pris en charge par ' + o.qui : '', o.source, o.suite].filter(Boolean).join(' · '), o.auteur));
  (etat.terrain||[]).forEach(o => push(o,'Terrain',o.sujet,
    [o.professionnel,o.profession,o.commune,o.criticite].filter(Boolean).join(' · '), o.auteur));
  (etat.cpts||[]).forEach(c => (c.appels||[]).forEach(a =>
    push(a,'Appel CPTS', c.nom, [a.qui, a.dit].filter(Boolean).join(' · '), a.par)));
  (etat.materiel||[]).forEach(o => push(o,'Matériel',o.nature,
    [o.demandeur,o.quantite,o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.dons||[]).forEach(o => {
    push(o,'Collecte', o.structure,
      [o.reponse ? 'Réponse : ' + o.reponse : '', o.commune, o.reponse==='Oui' ? o.materiel : '', o.interlocuteur]
        .filter(Boolean).join(' · '), o.par || o.auteur);
    (o.suivi||[]).forEach(s => push(s,'Collecte', o.structure + ' — relance', s.texte, s.par));
  });
  (etat.renforts||[]).forEach(o => push(o,'Collecte', o.nom + ' — volontaire pour la collecte',
    [o.taches, aVehicule(o) ? o.vehicule : '', o.dispo, o.statut].filter(Boolean).join(' · '), o.auteur));
  (etat.volontaires||[]).forEach(o => {
    push(o,'Renfort', nomVol(o) + ' — volontaire au renfort',
      [o.profession, o.commune, o.renforts, o.dispo, o.zone, o.statut].filter(Boolean).join(' · '),
      o.par || o.auteur);
    (o.suivi||[]).forEach(s => push(s,'Renfort', nomVol(o) + ' — appel', s.texte, s.par));
  });
  (etat.medecins||[]).forEach(o => push(o,'Évacués', nomMed(o) + ' — médecin généraliste sondé',
    [o.statut, o.commune, o.motifs, o.capacite].filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.orientes||[]).forEach(o => push(o,'Évacués', (refPatient(o) || 'Patient') + ' — demande d\'orientation',
    [o.provenance, o.relais, o.motif, o.medecin ? 'orienté vers ' + o.medecin : '', o.statut]
      .filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.relais||[]).forEach(o => push(o,'Évacués', o.structure + ' — structure relais',
    [o.type, o.commune, o.info].filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.lieux||[]).forEach(o => push(o,'Évacués', o.lieu + " — lieu d'accueil",
    [o.type, o.commune, o.dispo, o.soins, o.places ? o.places + ' places' : '']
      .filter(Boolean).join(' · '), o.par || o.auteur));
  (etat.veille||[]).forEach(o => push(o,'Veille',o.titre, [o.source,o.resume].filter(Boolean).join(' · '), o.auteur));
  (etat.visios||[]).forEach(o => push(o,'Visio ARS',
    (o.instance || "Visio de crise de l'ARS") + (visioVide(o) ? ' — compte rendu non consigné' : ''),
    (o.points||[]).map(p => p.titre).join(' · ') || o.manquant || '',
    o.represente || o.auteur));
  return e.sort((a,b) => ((b.date+' '+(b.heure||'00:00')).localeCompare(a.date+' '+(a.heure||'00:00'))));
}

const COUL = {'ARS':'e-attente','Consigné':'e-lancer','Terrain':'e-bloque','Appel CPTS':'e-lancer','Matériel':'e-attente','Collecte':'e-cours','Renfort':'e-cours','Évacués':'e-cours','Visio ARS':'e-attente','Veille':'e-fini'};

function vueFil(){
  let ev = evenements();
  const types = ['Tout', ...new Set(ev.map(x => x.type))];
  if(filtreFil !== 'Tout') ev = ev.filter(x => x.type === filtreFil);

  let h = `<h1>Fil d'actualité</h1>
  <p class="chapo">Tout ce que la CPTS Pau Béarn a mené, tracé, communiqué ou reçu depuis le début de sa mobilisation, du plus récent au plus ancien. C'est la page à ouvrir quand on reprend la main après une absence.</p>
  <div class="filtres">${types.map(t=>`<button class="${filtreFil===t?'on':''}" onclick="filtrerFil('${t}')">${esc(t)}</button>`).join('')}</div>`;

  if(!ev.length) return h + `<div class="carte"><p class="vide">Rien n'a encore été enregistré. Le fil se construit à partir de toutes les autres pages.</p></div>`;

  let jour = '';
  h += `<div class="carte"><ul class="fil">`;
  ev.forEach(x => {
    if(x.date !== jour){
      jour = x.date;
      h += `<li style="border-bottom:0;padding-bottom:2px"><div class="h"></div><div class="c"><div class="s" style="font-weight:600;color:var(--encre)">${frdate(x.date)}</div></div></li>`;
    }
    h += `<li><div class="h">${esc(x.heure||'—')}</div><div class="c">
      <div><span class="etiq ${COUL[x.type]||'e-lancer'}">${esc(x.type)}</span></div>
      <div class="t" style="margin-top:5px">${esc(x.titre)}</div>
      ${x.detail?`<div class="d">${esc(x.detail)}</div>`:''}
      ${x.qui?`<div class="s">${esc(x.qui)}</div>`:''}
    </div></li>`;
  });
  return h + `</ul></div>`;
}
function filtrerFil(t){ filtreFil = t; rendre(); }

function vueAppels(){
  const l = etat.cpts || [];
  const ordre = {"Zone de feu":0, "Proche":1, "Hors zone":2};
  const tri = [...l].sort((a,b) => (ordre[a.priorite]??3) - (ordre[b.priorite]??3) || a.nom.localeCompare(b.nom,'fr'));
  const faits = l.filter(x => x.appels && x.appels.length).length;
  const nbApp = l.reduce((a,x) => a + ((x.appels||[]).length), 0);

  let h = `<h1>Contact avec les CPTS</h1>
  <p class="chapo">Les CPTS des zones touchées, classées par proximité du feu. On prend des nouvelles et on identifie des besoins réels, pas pour placer du matériel. Chaque échange se consigne, même quand la réponse est « rien ».</p>
  <div class="compteurs" style="margin-bottom:16px">
    <div class="compteur"><div class="n">${l.length}</div><div class="l">CPTS répertoriées</div></div>
    <div class="compteur"><div class="n">${faits}</div><div class="l">déjà contactées</div></div>
    <div class="compteur"><div class="n">${nbApp}</div><div class="l">appels consignés</div></div>
  </div>
  <div class="note">Les coordonnées proviennent d'annuaires publics et ne sont pas toutes à jour. Les noms des coordinatrices et des présidents ne sont pas publiés : le plus rapide est de les obtenir auprès de Claire (Agora Lib), puis de les renseigner ici.</div>
  <div class="barre-h"><button class="btn sec" onclick="exporterAppels()">Excel</button><button class="btn sec" onclick="imprimer()">PDF</button><button class="btn" onclick="ouvrirCpts()">Ajouter une CPTS</button></div>
  <div class="cptsl">`;

  tri.forEach(c => {
    const cl = c.priorite === 'Zone de feu' ? 'feu' : c.priorite === 'Proche' ? 'proche' : '';
    const app = antechrono(c.appels);
    h += `<div class="cptsc ${cl} ${app.length?'fait':''}">
      <div><div class="nom">${esc(c.nom)}</div><div class="terr">${esc(c.territoire)}</div></div>
      <div class="rangee">
        <span class="etiq ${c.priorite==='Zone de feu'?'e-bloque':c.priorite==='Proche'?'e-attente':'e-lancer'}">${esc(c.priorite)}</span>
        ${c.contact?`<span class="terr">Contact : ${esc(c.contact)}</span>`:''}
      </div>
      ${c.note?`<div class="obs">${esc(c.note)}</div>`:''}
      <div class="rangee">
        ${c.tel?`<a class="tel" href="tel:${esc(c.tel.replace(/[^0-9+]/g,''))}">Appeler ${esc(c.tel)}${c.telLibelle?`<small>${esc(c.telLibelle)}</small>`:''}</a>`:`<button class="btn sec" style="flex:1;min-width:150px;min-height:44px" onclick="ouvrirTel('${c.id}')">Ajouter le numéro</button>`}
        ${c.tel2?`<a class="tel second" href="tel:${esc(c.tel2.replace(/[^0-9+]/g,''))}">Appeler ${esc(c.tel2)}${c.tel2Libelle?`<small>${esc(c.tel2Libelle)}</small>`:''}</a>`:''}
        <button class="corriger" onclick="ouvrirTel('${c.id}')">Corriger le numéro</button>
      </div>
      ${c.telMaj?`<div class="telmaj">Numéro corrigé le ${frdate(c.telMaj.date)} par ${esc(c.telMaj.par||'—')}${c.telMaj.source?` · ${esc(c.telMaj.source)}`:''}</div>`:''}
      <div class="rangee">
        <select onchange="majCpts('${c.id}','statut',this.value)">
          ${['À appeler','Appelée','Sans réponse','À rappeler','Sans objet'].map(x=>`<option ${x===c.statut?'selected':''}>${x}</option>`).join('')}
        </select>
      </div>
      <div class="journal">
        ${app.length ? app.map(a => `<div class="app">
            <div class="q">${frdate(a.date)} ${esc(a.heure||'')} · ${esc(a.par||'—')}
              <button onclick="supprimerAppel('${c.id}','${a.id}')" title="Supprimer">×</button></div>
            ${a.qui?`<div class="s">Interlocuteur : ${esc(a.qui)}</div>`:''}
            <div class="d">${esc(a.dit)}</div>
            ${a.suite?`<div class="s">Suite : ${esc(a.suite)}</div>`:''}
          </div>`).join('') : `<p class="vide">Aucun appel consigné.</p>`}
      </div>
      <div class="rangee">
        <button class="btn" style="flex:1;min-width:150px" onclick="ouvrirAppel('${c.id}')">Consigner un appel</button>
        <button class="retirer" onclick="ouvrirCpts('${c.id}')">Modifier</button>
        <button class="retirer" onclick="supprimerCpts('${c.id}')">Retirer</button>
      </div>
    </div>`;
  });
  return h + `</div>`;
}

async function majCpts(id, champ, val){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  c[champ] = val; c.modifiePar = moi;
  await sauver(); rendre();
}

function ouvrirAppel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  document.getElementById('modale').innerHTML = `<h3>${esc(c.nom)} — consigner un appel</h3><div class="form">
    <label><span class="k">Date</span><input type="date" id="ap-date" value="${aujourdhui()}"></label>
    <label><span class="k">Heure</span><input type="time" id="ap-heure" value="${maintenant()}"></label>
    <label class="large"><span class="k">Interlocuteur joint</span><input id="ap-qui" placeholder="Nom, fonction"></label>
    <label class="large"><span class="k">Ce qui a été dit *</span><textarea id="ap-dit" placeholder="Situation sur place, besoins exprimés, réponse obtenue…"></textarea></label>
    <label class="large"><span class="k">Suite à donner</span><textarea id="ap-suite" placeholder="Rappeler le…, transmettre à…, rien"></textarea></label>
  </div><div class="actions"><button class="btn" onclick="validerAppel('${c.id}')">Enregistrer</button><button class="btn sec" onclick="fermer()">Annuler</button></div>`;
  document.getElementById('rideau').classList.add('on');
}
async function validerAppel(id){
  const c = (etat.cpts||[]).find(x => x.id === id); if(!c) return;
  const g = k => document.getElementById('ap-'+k).value.trim();
  if(!g('dit')){ toast("Indiquez ce qui a été dit"); return; }
  c.appels = c.appels || [];
  c.appels.unshift({id:uid(), date:g('date'), heure:g('heure'), qui:g('qui'), dit:g('dit'), suite:g('suite'), par:moi});
  if(c.statut === 'À appeler') c.statut = 'Appelée';
  await sauver(); fermer(); rendre(); toast("Appel consigné");
}
async function supprimerAppel(cid, aid){
  const c = (etat.cpts||[]).find(x => x.id === cid); if(!c) return;
  c.appels = (c.appels||[]).filter(a => a.id !== aid);
  await sauver(); rendre(); toast("Appel supprimé");
}

/* Correction rapide des coordonnées : les annuaires publics sont souvent

async function validerTel(id){
