<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Accueil des patients évacués — CPTS Pau Béarn</title>
<meta name="description" content="Se déclarer volontaire pour recevoir en consultation les personnes évacuées des zones incendiées, auprès de la CPTS Pau Béarn.">
<meta name="theme-color" content="#062B63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#062B63;
  --encre-2:#0B4FA8;
  --cobalt-clair:#E8F0FB;
  --surface:#F3F6FB;
  --carte:#FFFFFF;
  --trait:#D8E1EF;
  --texte:#122238;
  --texte-2:#5A6B84;
  --ambre:#E8A33D;
  --braise:#C2482F;
  --stable:#2F7D62;
  --display:'Archivo',system-ui,sans-serif;
  --corps:'Source Sans 3',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--corps);background:var(--surface);color:var(--texte);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

.bandeau{background:var(--encre);color:#fff;padding:20px 22px}
.bandeau .in{max-width:880px;margin:0 auto}
.bandeau .nom{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em}
.bandeau .sous{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FA3D4;margin-top:6px}

.page{max-width:880px;margin:0 auto;padding:26px 22px 60px}
h1{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-.01em;margin:0 0 6px}
.chapo{color:var(--texte-2);margin:0 0 22px;max-width:66ch}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:13px;padding:22px 24px;
  margin-bottom:15px;box-shadow:0 1px 2px rgba(9,35,71,.04),0 6px 18px -12px rgba(9,35,71,.14)}
/* Le numéro de section dans une pastille : le formulaire se lit
   comme une suite d'étapes, pas comme un mur de champs. */
h2{font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.005em;margin:0 0 5px;
  display:flex;align-items:center;gap:11px;color:var(--encre)}
h2 .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--encre);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.sous-h{font-size:13.5px;color:var(--texte-2);margin:0 0 17px;line-height:1.45}

.form{display:grid;gap:15px}
@media(min-width:720px){.form{grid-template-columns:1fr 1fr}.form .large{grid-column:1/-1}}
label{display:block}
label .k{font-size:13px;font-weight:600;color:var(--encre);display:block;margin-bottom:5px;letter-spacing:-.002em}
label .k i{font-style:normal;color:var(--braise);font-weight:400}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #E1E9F4;border-radius:9px;
  background:#FCFDFF;transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:#A6B3C6}
textarea{min-height:78px;resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:#C6D5EA}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--encre-2);background:#fff;
  box-shadow:0 0 0 3px rgba(11,79,168,.13)}
input.faux,textarea.faux,select.faux{border-color:var(--braise);background:#FDF4F2}
input.faux:focus,textarea.faux:focus{box-shadow:0 0 0 3px rgba(194,72,47,.15)}
.aide{font-size:12.5px;color:var(--texte-2);margin-top:5px;line-height:1.4}

/* La question de la fin — devenir médecin traitant — se pose sur
   un fond différent : elle ne conditionne rien de ce qui précède,
   et doit se voir comme une question à part. */
.carte.apres{background:#FDF9F1;border-color:#EDDFC4}
.carte.apres h2 .num{background:#B07C22}
.carte.apres select{background:#fff;border-color:#E6D6B6}
.carte.apres select:focus{border-color:#B07C22;box-shadow:0 0 0 3px rgba(176,124,34,.15)}
.leurre{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* Les types de renfort : des cases à cocher rangées en colonnes,
   assez grandes pour être cochées d'un doigt. */
.choix{display:grid;gap:9px;grid-template-columns:1fr}
@media(min-width:720px){.choix{grid-template-columns:1fr 1fr}}
.choix .c{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--trait);border-radius:8px;cursor:pointer;background:#fff}
.choix .c:hover{border-color:var(--encre-2)}
.choix .c input{width:19px;height:19px;flex:0 0 19px;margin:1px 0 0;accent-color:var(--encre-2)}
.choix .c span{font-size:14px;line-height:1.4}

/* Les motifs ne se cochent plus un par un : la liste se lit, et
   une seule case la couvre. Six cases à cocher pour dire oui à
   ce qui relève de la médecine générale, c'était six fois trop. */
.motifs{margin:0;padding:0;list-style:none;display:grid;gap:7px}
@media(min-width:720px){.motifs{grid-template-columns:1fr 1fr}}
.motifs li{position:relative;padding-left:24px;font-size:14px;line-height:1.4}
.motifs li::before{content:"";position:absolute;left:7px;top:8px;width:5px;height:5px;border-radius:50%;
  background:var(--encre-2)}
.coche.coche-forte{background:var(--cobalt-clair);border-color:#C3D6F0}
.coche.coche-forte span{font-weight:600;color:var(--encre)}
.coche.coche-forte:hover{border-color:var(--encre-2)}

.cond{background:var(--cobalt-clair);border-radius:10px;padding:15px 17px;margin-bottom:15px}
.cond ol{margin:0;padding-left:19px;font-size:13.5px}
.cond li{margin-bottom:6px;text-align:justify}
.coche{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid #E1E9F4;border-radius:10px;margin-bottom:9px;cursor:pointer;background:#fff;transition:border-color .12s}
.coche:hover{border-color:var(--encre-2)}
.coche.faux{border-color:var(--braise);background:#FDF4F2}
.coche input{width:20px;height:20px;flex:0 0 20px;margin:1px 0 0;accent-color:var(--encre-2)}
.coche span{font-size:14.5px;line-height:1.45}

.btn{background:var(--encre);color:#fff;border:0;border-radius:9px;padding:13px 24px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;min-height:48px;
  box-shadow:0 2px 10px -4px rgba(6,43,99,.5);transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--encre-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--encre);border:1.5px solid #E1E9F4;box-shadow:none}
.btn.sec:hover{border-color:var(--encre)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}

/* ---------- téléphone ----------
   C'est le cas d'usage principal : le professionnel se recense
   depuis son cabinet, entre deux patients, sur son téléphone.
   Champs à 16 px — en dessous, iOS zoome sur le champ actif et
   la page part de travers — et cibles tactiles confortables. */
@media(max-width:640px){
  .page{padding:20px 15px 48px}
  h1{font-size:23px}
  .carte{padding:16px 15px;border-radius:9px}
  input,select,textarea{font-size:16px;padding:12px 13px;border-radius:7px}
  textarea{min-height:88px}
  select{min-height:48px}
  .coche,.choix .c{padding:13px 14px;gap:13px}
  .coche input,.choix .c input{width:24px;height:24px;flex:0 0 24px}
  .coche span,.choix .c span{font-size:14.5px}
  .btn{width:100%;padding:14px 20px;min-height:52px}
  .actions{flex-direction:column;align-items:stretch;gap:12px}
  .actions .aide{text-align:center}
  .cond ol{padding-left:17px}
  .cond li{text-align:left}
  .acte ol li,.acte .ctx,.acte .cachet,.note{text-align:left}
}

.alerte{border-radius:10px;padding:13px 16px;font-size:14px;margin-bottom:16px;line-height:1.5}
.alerte.rouge{background:#FDF0EC;border:1px solid #E8C3B8;color:#8C2F1B}
.alerte.ambre{background:#FCF3E4;border:1px solid #E9D3A6;color:#8A5D12}
.alerte.bleue{background:var(--cobalt-clair);border:1px solid #C3D6F0;color:var(--encre)}
.note{font-size:12.5px;color:var(--texte-2);margin-top:26px;padding-top:14px;border-top:1px solid var(--trait);text-align:justify}

/* ---------- récapitulatif remis au professionnel ---------- */
.acte{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:26px;color:#101820;font-size:13.5px;line-height:1.5}
.acte .ent{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--encre);padding-bottom:9px;margin-bottom:16px}
.acte .ent .org{font-family:var(--display);font-weight:700;font-size:15px;color:var(--encre)}
.acte .ent .sub{font-size:11px;color:var(--texte-2);margin-top:2px}
.acte .ent .d{text-align:right}
.acte .ent .ref{font-family:var(--mono);font-size:11.5px;color:var(--encre)}
.acte .ttl{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;color:var(--encre);text-transform:uppercase}
.acte .ss{font-size:12.5px;color:var(--texte-2);margin:3px 0 14px}
.acte .ctx{font-size:12.5px;background:var(--cobalt-clair);border-left:3px solid var(--encre-2);border-radius:0 6px 6px 0;padding:11px 13px;margin-bottom:16px;text-align:justify}
.acte h3{font-family:var(--display);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--encre-2);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--trait)}
.acte .l{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.acte .l .e{flex:0 0 185px;font-size:12px;color:var(--texte-2)}
.acte .l .v{flex:1;border-bottom:1px dotted #B9C4D4;min-height:19px;padding:0 3px}
.acte ul{margin:4px 0 0;padding-left:20px;font-size:12.5px}
.acte ol{margin:0;padding-left:20px;font-size:12.5px}
.acte ol li,.acte ul li{margin-bottom:5px;text-align:justify}
.acte .cachet{border:1px solid var(--stable);background:#F1F8F5;border-radius:7px;padding:11px 13px;font-size:12.5px;margin-top:10px}
.acte .cachet b{color:#1E5C46}
.acte .pied{font-size:11px;color:var(--texte-2);border-top:1px solid var(--trait);margin-top:16px;padding-top:8px;text-align:justify}
@media(max-width:640px){.acte{padding:17px 15px}.acte .l{flex-direction:column;gap:2px}.acte .l .e{flex:none}}

.recu{background:#F1F8F5;border:1px solid #BEDCCE;border-radius:10px;padding:20px 22px;margin-bottom:18px}
.recu .t{font-family:var(--display);font-weight:700;font-size:20px;color:#1E5C46;margin-bottom:6px}
.recu .r{font-family:var(--mono);font-size:13px;color:var(--encre);margin-top:10px}

/* ---------- le calendrier des créneaux ----------
   Le cœur du formulaire. Un médecin entre deux patients ne
   rédige pas ses disponibilités : il les coche. Trois semaines,
   deux demi-journées par jour, une case par demi-journée. Les
   jours passés restent visibles mais éteints — on ne fait pas
   disparaître des colonnes sous les yeux de quelqu'un. */
.agenda{display:flex;flex-direction:column;gap:14px}
.sem{border:1.5px solid #E1E9F4;border-radius:11px;overflow:hidden;background:#fff}
.sem-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--trait)}
.sem-t .n{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--encre)}
.sem-t .a{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sem-t .a button{background:#fff;border:1.5px solid #E1E9F4;border-radius:7px;
  padding:6px 11px;font-size:12px;color:var(--encre-2);cursor:pointer;min-height:34px;font-weight:600}
.sem-t .a button:hover{border-color:var(--encre-2)}
.grille{display:grid;grid-template-columns:52px repeat(7,1fr);gap:3px;padding:9px}
.grille .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texte-2);display:flex;align-items:center}
.grille .jr{text-align:center;font-size:11px;color:var(--texte-2);line-height:1.25;padding-bottom:2px}
.grille .jr b{display:block;font-size:14px;color:var(--texte);font-weight:600}
.grille .jr.we{color:#9AA8BC}
.grille .jr.auj b{color:var(--encre-2)}
.cr{border:1.5px solid #E4EBF5;border-radius:8px;background:#fff;min-height:42px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;padding:0;
  transition:background .1s,border-color .1s}
.cr:hover{border-color:var(--encre-2);background:var(--cobalt-clair)}
.cr.on{background:var(--encre-2);border-color:var(--encre-2);color:#fff}
.cr.we{background:#FBFCFE}
.cr.we.on{background:var(--encre-2)}
.cr[disabled]{cursor:default;background:repeating-linear-gradient(135deg,#F7F9FC,#F7F9FC 4px,#EEF2F8 4px,#EEF2F8 8px);border-color:#E9EEF6}
.cr[disabled]:hover{border-color:#E9EEF6}
.cr:focus-visible{outline:2px solid var(--ambre);outline-offset:1px}
/* Le total, sous les trois semaines. */
.recap-cr{margin-top:14px;background:var(--cobalt-clair);border-radius:9px;padding:12px 14px;font-size:13.5px}
.recap-cr .t{font-weight:600;color:var(--encre)}
.recap-cr.vide{background:#FCF3E4;color:#8A5D12}
/* Les horaires d'une demi-journée cochée : des puces qu'on
   appuie, pas un champ qu'on remplit. Elles s'ouvrent dans la
   semaine même, juste sous sa grille — cocher mercredi matin et
   devoir descendre en bas de page pour en préciser l'heure, ce
   n'est pas tenable au téléphone. */
.dj-liste{border-top:1px dashed var(--trait);padding:11px 9px 9px;background:#FBFCFE}
.dj-liste:empty{display:none}
.dj-aide{font-size:12.5px;color:var(--texte-2);margin:0 0 10px;padding:0 2px}
.dj{background:#fff;border:1px solid var(--trait);border-radius:9px;padding:11px 12px;margin-bottom:8px}
.dj:last-child{margin-bottom:0}
.dj-t{font-size:13.5px;margin-bottom:8px}
.dj-t b{font-family:var(--display);font-weight:700;color:var(--encre)}
.dj-n{display:block;font-size:12px;color:var(--texte-2);margin-top:2px}
.dj-n.mis{color:var(--encre-2);font-weight:600}
.chh{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ch{border:1.5px solid #E4EBF5;border-radius:16px;background:#fff;padding:7px 13px;font-size:13px;
  font-family:var(--mono);cursor:pointer;color:var(--texte-2);min-height:36px;transition:all .1s}
.ch:hover{border-color:var(--encre-2);color:var(--encre-2)}
.ch.on{background:var(--encre-2);border-color:var(--encre-2);color:#fff}
.ch-autre{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--texte-2);
  border:1px dashed var(--trait);border-radius:14px;padding:3px 6px 3px 11px;cursor:pointer;width:auto}
.ch-autre input{width:auto;min-width:112px;padding:4px 6px;border-radius:10px;font-size:13px}
@media(max-width:640px){
  .ch{min-height:40px;padding:8px 13px;font-size:14px}
  .ch-autre{width:100%;justify-content:space-between}
  .ch-autre input{font-size:16px}
}
@media(max-width:640px){
  .grille{grid-template-columns:38px repeat(7,1fr);gap:2px;padding:7px}
  .grille .lab{font-size:8.5px;letter-spacing:.02em}
  .grille .jr{font-size:10px}
  .grille .jr b{font-size:13px}
  .cr{min-height:44px;border-radius:5px}
  .sem-t .a{margin-left:0;width:100%}
  .sem-t .a button{flex:1;min-width:0}
}

/* La question « acceptez-vous ? » commande tout le reste : ce
   qui suit ne s'affiche que si la réponse est oui. */
.oupas{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:640px){.oupas{grid-template-columns:1fr}}
.oupas label{display:flex;gap:12px;align-items:flex-start;padding:16px 17px;border:1.5px solid #E1E9F4;
  border-radius:11px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.oupas label:hover{border-color:var(--encre-2)}
.oupas label.sel{border-color:var(--encre-2);background:var(--cobalt-clair);box-shadow:inset 0 0 0 1px var(--encre-2)}
.oupas input{width:20px;height:20px;flex:0 0 20px;margin:1px 0 0;accent-color:var(--encre-2)}
.oupas .t{font-family:var(--display);font-weight:600;font-size:15px;display:block}
.oupas .s{font-size:12.5px;color:var(--texte-2);display:block;margin-top:2px}
body.refus .si-oui{display:none}

@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt}
  .bandeau,.actions,.recu,.no-print{display:none!important}
  .page{padding:0;max-width:none}
  .acte{border:0;padding:0;font-size:10pt;line-height:1.42}
  .acte .ttl{font-size:16pt}
  .acte .ctx,.acte .cachet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .acte ol,.acte ul,.acte .cachet{break-inside:avoid}
  .acte h3{break-after:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bandeau"><div class="in">
  <div class="nom">CPTS Pau Béarn</div>
  <div class="sous">Communauté professionnelle territoriale de santé — Pau et Béarn</div>
</div></div>

<main class="page" id="page">
  <p class="chapo">Chargement…</p>
</main>

<script>
/* =========================================================
   RECENSEMENT DES GÉNÉRALISTES — CPTS Pau Béarn

   Des personnes évacuées des zones incendiées de Gironde se
   présentent au comptoir des pharmacies et dans les structures
   de soins non programmés du territoire : ordonnances à
   renouveler après un départ précipité, suites d'inhalation de
   fumées. Elles n'ont pas de médecin traitant ici.

   Ce formulaire demande une seule chose au généraliste :
   accepte-t-il d'en recevoir, et quand. Le « quand » se coche
   sur un calendrier de trois semaines plutôt qu'il ne se
   rédige — c'est la différence entre une réponse en trente
   secondes et une réponse jamais donnée.

   Cette page n'a pas le code d'accès du cockpit : elle ne parle
   qu'à la porte de recensement d'api.php, qui n'accepte qu'un
   ajout et ne renvoie rien de l'état partagé.
   ========================================================= */
const API = 'api.php?consultations=1';

/* Ces listes doublent celles du cockpit (index.html) : toute
   modification là-bas doit être reportée ici. */
const MOTIFS = ["Renouvellement d'ordonnance interrompue",
  "Suites d'inhalation de fumées",
  "Suivi d'une pathologie chronique le temps du séjour",
  "Situation aiguë sans gravité",
  "Certificat, document administratif de santé",
  "Toute demande relevant de la médecine générale"];

/* Les horaires proposés d'un appui, une fois la demi-journée
   cochée. Ce sont des propositions : le médecin peut en ajouter
   d'autres, ou n'en donner aucun — la demi-journée vaut alors
   créneau à elle seule, et la coordination appellera pour caler
   l'heure. */
const HEURES_MATIN = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00'];
const HEURES_APREM = ['14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00'];
const heuresDe = part => part === 'matin' ? HEURES_MATIN : HEURES_APREM;

const SEMAINES = 3;
const JOURS_C = ['L','M','M','J','V','S','D'];
const JOURS_L = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const JOURS_A = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août',
  'septembre','octobre','novembre','décembre'];

let envoiEnCours = false;
let contexte = { ouverte: false, message: '', cadre: '' };
let accepte = null;                 /* null tant que rien n'est coché */
const creneaux = new Set();         /* « 2026-07-29:matin » */
const heures = {};                  /* { « 2026-07-29:matin »: ['09:30','10:00'] } */
let semaines = [];                  /* les trois semaines affichées */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => (document.getElementById(id)?.value || '').trim();
const frdate = d => d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const frheure = d => d ? new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

/* Le calendrier part du lundi de la semaine en cours : un
   médecin qui répond un jeudi doit pouvoir proposer le vendredi
   sans changer de semaine. Les jours déjà passés restent à
   l'écran, éteints. */
function construireSemaines(){
  const auj = new Date(); auj.setHours(0,0,0,0);
  const lundi = new Date(auj);
  lundi.setDate(auj.getDate() - ((auj.getDay() + 6) % 7));
  semaines = [];
  for(let s = 0; s < SEMAINES; s++){
    const jours = [];
    for(let j = 0; j < 7; j++){
      const d = new Date(lundi);
      d.setDate(lundi.getDate() + s * 7 + j);
      jours.push({ cle: iso(d), num: d.getDate(), jour: j,
        passe: d < auj, auj: d.getTime() === auj.getTime(), date: d });
    }
    semaines.push({ jours, debut: jours[0] });
  }
}

  try{
    const r = await fetch('api.php?consultations=etat', {headers:{'Accept':'application/json'}});

  contexte.ouverte ? formulaire() : ferme();
}

/* Une semaine du calendrier : l'en-tête des sept jours, puis la
   rangée des matins et celle des après-midis. */
function blocSemaine(s, i){
  const d = s.debut.date;
  const titre = 'Semaine du ' + d.getDate() + (d.getDate() === 1 ? 'er' : '') + ' ' + MOIS[d.getMonth()];
  const cellules = part => s.jours.map(j => {
    const cle = j.cle + ':' + part;
    const we = j.jour >= 5 ? ' we' : '';
    const lib = JOURS_L[j.jour] + ' ' + j.num + ' ' + MOIS[j.date.getMonth()] +
                ', ' + (part === 'matin' ? 'matin' : 'après-midi');
    return j.passe
      ? `<button type="button" class="cr${we}" disabled aria-label="${esc(lib)} — jour passé"></button>`
      : `<button type="button" class="cr${we}" id="c-${cle}" role="checkbox" aria-checked="false"
           aria-label="${esc(lib)}" onclick="basculer('${cle}')">✓</button>`;
  }).join('');

  return `<div class="sem">
    <div class="sem-t">
      <span class="n">${esc(titre)}</span>
      <span class="a">
        <button type="button" onclick="remplir(${i},'matin')">Tous les matins</button>
        <button type="button" onclick="remplir(${i},'apresmidi')">Tous les après-midis</button>
        <button type="button" onclick="viderSemaine(${i})">Effacer</button>
      </span>
    </div>
    <div class="grille">
      <div class="lab"></div>
      ${s.jours.map(j => `<div class="jr${j.jour>=5?' we':''}${j.auj?' auj':''}">${JOURS_C[j.jour]}<b>${j.num}</b></div>`).join('')}
      <div class="lab">Matin</div>
      ${cellules('matin')}
      <div class="lab">A.-m.</div>
      ${cellules('apresmidi')}
    </div>
    <div class="dj-liste" id="djl-${i}">${listeSemaine(i)}</div>
  </div>`;
}

/* Les demi-journées cochées de cette semaine-là, avec leurs
   horaires, juste sous sa grille. */
function clesDeSemaine(i){
  const rang = x => x.split(':')[1] === 'matin' ? 0 : 1;
  return semaines[i].jours.flatMap(j => ['matin','apresmidi'].map(p => j.cle + ':' + p))
    .filter(c => creneaux.has(c))
    .sort((a,b) => a.slice(0,10).localeCompare(b.slice(0,10)) || rang(a) - rang(b));
}

function listeSemaine(i){
  const cles = clesDeSemaine(i);
  if(!cles.length) return '';
  return `<p class="dj-aide">Vous pouvez préciser vos horaires exacts, d'un appui. C'est facultatif :
    sans horaire, la coordination vous appellera pour le caler.</p>` + cles.map(ligneDemiJournee).join('');
}

function majSemaine(i){
  const e = document.getElementById('djl-' + i);
  if(e) e.innerHTML = listeSemaine(i);
}

/* À quelle semaine affichée appartient cette demi-journée. */
function semaineDe(cle){
  const d = cle.slice(0, 10);
  return semaines.findIndex(s => s.jours.some(j => j.cle === d));
}

function marquerCase(cle){
  const b = document.getElementById('c-' + cle);
  if(!b) return;
  const on = creneaux.has(cle);
  b.classList.toggle('on', on);
  b.setAttribute('aria-checked', on ? 'true' : 'false');
}

function basculer(cle){
  if(creneaux.has(cle)){ creneaux.delete(cle); delete heures[cle]; }
  else creneaux.add(cle);
  marquerCase(cle);
  majSemaine(semaineDe(cle));
  majTotal();
}

/* --- les horaires d'une demi-journée --------------------
   Cocher « mardi matin » suffit à répondre. Mais un médecin qui
   sait déjà qu'il peut prendre quelqu'un à 9h30 et à 10h le dit
   ici, d'un appui : la coordination place alors la personne sans
   avoir à rappeler pour caler l'heure. */
function heuresTriees(cle){
  return (heures[cle] || []).slice().sort();
}
function basculerHeure(cle, h){
  const l = heures[cle] || (heures[cle] = []);
  const i = l.indexOf(h);
  i >= 0 ? l.splice(i, 1) : l.push(h);
  redessinerJour(cle);
}
function ajouterHeure(cle, h){
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(h || '')) return;
  const l = heures[cle] || (heures[cle] = []);
  if(l.indexOf(h) === -1) l.push(h);
  redessinerJour(cle);
}
function toutesLesHeures(cle){
  const part = cle.split(':')[1];
  const l = heuresTriees(cle);
  const std = heuresDe(part);
  /* Un horaire saisi à la main qui ne figure pas dans la liste
     proposée doit tout de même apparaître, à sa place. */
  return [...new Set(std.concat(l))].sort();
}
function redessinerJour(cle){
  const e = document.getElementById('dj-' + cle);
  if(e) e.outerHTML = ligneDemiJournee(cle);
  majTotal();
}

function libelleJour(cle){
  const [d, p] = cle.split(':');
  const t = new Date(d + 'T12:00:00');
  return { jour: JOURS_A[(t.getDay() + 6) % 7] + ' ' + String(t.getDate()).padStart(2,'0')
             + '/' + String(t.getMonth()+1).padStart(2,'0'),
           part: p === 'apresmidi' ? 'après-midi' : 'matin' };
}

function ligneDemiJournee(cle){
  const l = libelleJour(cle);
  const prises = heuresTriees(cle);
  return `<div class="dj" id="dj-${cle}">
    <div class="dj-t"><b>${esc(l.jour)}</b> · ${esc(l.part)}
      <span class="dj-n${prises.length ? ' mis' : ''}">${prises.length
        ? prises.length + ' horaire' + (prises.length>1?'s':'') + ' : ' + prises.map(h => h.replace(':','h')).join(', ')
        : 'horaire à caler par téléphone — ou choisissez ci-dessous'}</span></div>
    <div class="chh">
      ${toutesLesHeures(cle).map(h => `<button type="button" class="ch${prises.indexOf(h)>=0?' on':''}"
        aria-pressed="${prises.indexOf(h)>=0}" onclick="basculerHeure('${cle}','${h}')">${esc(h)}</button>`).join('')}
      <label class="ch-autre">Autre
        <input type="time" aria-label="Ajouter un autre horaire pour ${esc(l.jour)} ${esc(l.part)}"
          onchange="ajouterHeure('${cle}', this.value); this.value=''"></label>
    </div>
  </div>`;
}

/* Le total, sous les trois semaines : ce qu'on a dit en un coup
   d'œil, sans avoir à remonter. */
function majTotal(){
  const z = document.getElementById('recap-cr');
  if(!z) return;
  const n = creneaux.size;
  const h = [...creneaux].reduce((s, c) => s + heuresTriees(c).length, 0);
  z.innerHTML = n
    ? `<div class="recap-cr"><span class="t">${n} demi-journée${n>1?'s':''} cochée${n>1?'s':''}${
        h ? ', dont ' + h + ' horaire' + (h>1?'s':'') + ' précisé' + (h>1?'s':'') : ''}.</span>
        ${h ? ' La coordination pourra vous adresser quelqu\'un directement sur ces horaires.'
            : ' Elle vous appellera pour convenir de l\'heure.'}</div>`
    : `<div class="recap-cr vide">Aucune demi-journée cochée pour le moment. Si aucune ne convient,
        décrivez vos disponibilités en clair juste en dessous — la coordination s'en accommodera.</div>`;
}

/* « Tous les matins » coche les cinq jours ouvrés de la semaine.
   Un deuxième appui les décoche : c'est le même geste, il doit
   pouvoir se défaire. */
function remplir(i, part){
  const ouvres = semaines[i].jours.filter(j => !j.passe && j.jour < 5);
  const cles = ouvres.map(j => j.cle + ':' + part);
  const tous = cles.length > 0 && cles.every(c => creneaux.has(c));
  cles.forEach(c => {
    if(tous){ creneaux.delete(c); delete heures[c]; } else creneaux.add(c);
    marquerCase(c);
  });
  majSemaine(i); majTotal();
}

function viderSemaine(i){
  semaines[i].jours.forEach(j => ['matin','apresmidi'].forEach(p => {
    const c = j.cle + ':' + p;
    if(creneaux.delete(c)){ delete heures[c]; marquerCase(c); }
  }));
  majSemaine(i); majTotal();
}

/* Ce qu'on a coché, relu en clair. Sans ce rappel, on ne sait
   plus ce qu'on a dit trois écrans plus bas. */
function creneauxLisibles(){
  const par = new Map();
  /* Le matin d'abord : trié à la lettre, « apresmidi » passerait
     devant, et le médecin relirait ses créneaux à l'envers. */
  const rang = x => x.split(':')[1] === 'matin' ? 0 : 1;
  [...creneaux].sort((a,b) => a.slice(0,10).localeCompare(b.slice(0,10)) || rang(a) - rang(b))
    .forEach(x => {
      const [d, p] = x.split(':');
      if(!par.has(d)) par.set(d, []);
      par.get(d).push(p === 'apresmidi' ? 'après-midi' : 'matin');
    });
  return [...par.entries()].map(([d, parts]) => {
    const t = new Date(d + 'T12:00:00');
    const j = JOURS_A[(t.getDay() + 6) % 7];
    const q = parts.map(p => {
      const cle = d + ':' + (p === 'après-midi' ? 'apresmidi' : 'matin');
      const h = heuresTriees(cle);
      return p + (h.length ? ' (' + h.join(', ') + ')' : '');
    });
    return j + ' ' + String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0')
      + ' ' + q.join(' et ');
  });
}



/* La réponse à la question 2 commande l'affichage : dire non

}

    mail:        val('f-mail'),
    structure:   val('f-structure'),
    adresse:     val('f-adresse'),
    commune:     val('f-commune'),
    accepte:     accepte === true,
    motifs:      accepte ? motifsAcceptes() : [],
    dispos:      accepte ? [...creneaux].sort() : [],
    heures:      accepte ? Object.fromEntries([...creneaux]
                   .map(c => [c, heuresTriees(c)]).filter(x => x[1].length)) : {},
    precisions:  accepte ? val('f-precisions') : '',
    rdv:         accepte ? val('f-rdv') : '',
    mt:          accepte ? val('f-mt') : '',
    diffusion:   accepte ? !!document.getElementById('c-diffusion')?.checked : false,
    note:        '',
    site:        val('f-site'),
    conditions:  document.getElementById('c-conditions').checked
  };

  const manques = [];
  let premier = null;
  const exiger = (id, rempli, quoi) => {
    marquer(id, !rempli);
    if(!rempli){ manques.push(quoi); premier = premier || id; }
  };
  exiger('f-nom',     donnees.nom,     'votre nom');
  exiger('f-prenom',  donnees.prenom,  'votre prénom');
  exiger('f-tel',     donnees.tel,     'un téléphone');
  exiger('f-adresse', donnees.adresse, "l'adresse de votre cabinet");

  if(accepte === null){
    manques.push('votre réponse à la question « acceptez-vous ? »');
    premier = premier || 'ou-oui';
  }

  document.getElementById('c-conditions-l').classList.toggle('faux', !donnees.conditions);
  if(!donnees.conditions){
    manques.push('votre acceptation du cadre');
    premier = premier || 'c-conditions-l';
  }

  const z = document.getElementById('erreur');
  if(manques.length){
    z.innerHTML = `<div class="alerte rouge" style="margin:14px 0 0">Il manque ${manques.join(', ')
      .replace(/,([^,]*)$/, ' et$1')}.</div>`;
    const e = premier && document.getElementById(premier);
    if(e && e.scrollIntoView) e.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  /* Accepter sans cocher un seul créneau ni rien écrire laisse la
     coordination sans prise : on le signale une fois, puis on
     laisse passer si la personne insiste. */
  if(accepte && !donnees.dispos.length && !donnees.precisions && !z.dataset.relance){
    z.dataset.relance = '1';
    z.innerHTML = `<div class="alerte ambre" style="margin:14px 0 0">Vous n'avez coché aucune demi-journée
      et rien précisé sur vos disponibilités. La coordination vous rappellera pour en convenir. Appuyez à
      nouveau sur « Valider ma réponse » pour envoyer tel quel.</div>`;
    return;
  }
  z.innerHTML = '';

  const b = document.getElementById('valider');
  const libelle = b.textContent;
  envoiEnCours = true; b.disabled = true; b.textContent = 'Transmission…';

  let r, c;
  try{
    r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(donnees)
    });
    c = await r.json();
  }catch(e){
    envoiEnCours = false; b.disabled = false; b.textContent = libelle;
    z.innerHTML = `<div class="alerte rouge" style="margin:14px 0 0">La transmission a échoué. Votre saisie
      est toujours à l'écran : réessayez dans un instant.</div>`;
    return;
  }

  if(!r.ok || !c || !c.ok){
    envoiEnCours = false; b.disabled = false; b.textContent = libelle;
    z.innerHTML = `<div class="alerte rouge" style="margin:14px 0 0">${esc((c && c.erreur) ||
      "La transmission a échoué.")} Votre saisie est conservée à l'écran.</div>`;
    return;
  }

  recapitulatif(donnees, c.ref, c.le || new Date().toISOString());
}

/* --- Le récapitulatif remis au médecin ------------------- */
function recapitulatif(d, ref, quand){
  const l = (e, v) => `<div class="l"><span class="e">${e}</span><span class="v">${esc(v||'—')}</span></div>`;
  const nom = [d.prenom, d.nom].filter(Boolean).join(' ');
  const cren = creneauxLisibles();

  afficher(`<div class="recu no-print">
    <div class="t">${d.accepte ? 'Votre réponse est enregistrée.' : 'Votre réponse est enregistrée.'}</div>
    <p style="margin:0">${d.accepte
      ? `La coordination de la CPTS Pau Béarn vous rappellera au ${esc(d.tel)} pour confirmer vos créneaux
         avant de vous adresser qui que ce soit. Vous n'avez rien d'autre à faire.`
      : `Votre refus est consigné : vous ne serez pas rappelé pour ce dispositif. Merci d'avoir pris le
         temps de répondre — un « non » évite qu'on vous sollicite une deuxième fois.`}</p>
    <div class="r">Référence de votre réponse : <strong>${esc(ref)}</strong></div>
  </div>

  <div class="actions no-print" style="margin:0 0 18px">
    <button type="button" class="btn" onclick="window.print()">Enregistrer mon récapitulatif en PDF</button>
    <span class="aide" style="margin:0">Choisissez ensuite « Enregistrer au format PDF ».
      Sur iPhone, l'aperçu s'ouvre : appuyez sur le bouton de partage pour l'enregistrer ou l'envoyer.</span>
  </div>

  <div class="acte">
    <div class="ent">
      <div class="g">
        <div class="org">CPTS Pau Béarn</div>
        <div class="sub">Communauté professionnelle territoriale de santé — Pau et Béarn</div>
      </div>
      <div class="d">
        <div class="ref">Réf. ${esc(ref)}</div>
        <div class="sub">Établi le ${frdate(quand)}</div>
      </div>
    </div>

    <h1 class="ttl">Accueil des personnes évacuées</h1>
    <div class="ss">Récapitulatif de la réponse au recensement des médecins généralistes — exemplaire du praticien</div>

    <div class="ctx"><b>Cadre du recensement.</b> Le présent récapitulatif est établi dans le cadre du plan
    blanc régional et du dispositif ORSAN AMAVI activés par l'ARS Nouvelle-Aquitaine à la suite des feux de
    forêt de Gironde et des Landes de juillet 2026. Des personnes évacuées, revenues sur le territoire ou
    relogées en Béarn, se trouvent sans médecin traitant pour le renouvellement de leurs traitements et le
    suivi des suites d'inhalation de fumées. La CPTS Pau Béarn intervient au seul titre de la coordination :
    elle recense les médecins généralistes acceptant d'en recevoir et oriente les personnes vers eux. Ce
    document constate une déclaration de disponibilité. Il ne vaut ni engagement contractuel, ni obligation
    de recevoir, ni transfert de patientèle.</div>

    <h3>1 · Médecin déclarant</h3>
    ${l('Nom et prénom', nom)}
    ${l('N° RPPS', d.rpps)}
    ${l('Cabinet, maison ou centre de santé', d.structure)}
    ${l('Adresse du cabinet', d.adresse)}
    ${l('Commune', d.commune)}
    ${l('Téléphone', d.tel)}
    ${l('Courriel', d.mail)}

    <h3>2 · Réponse au recensement</h3>
    ${l('Accepte de recevoir des personnes évacuées', d.accepte ? 'Oui' : 'Non')}

    ${d.accepte ? `
    <h3>3 · Ce qui est accepté</h3>
    ${d.motifs.length
      ? `<ul>${d.motifs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
      : `<div style="font-size:12.5px;color:#5A6B84">Les motifs proposés n'ont pas été acceptés — à préciser lors du rappel de la coordination.</div>`}

    <h3>4 · Créneaux déclarés</h3>
    ${cren.length
      ? `<ul>${cren.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
      : `<div style="font-size:12.5px;color:#5A6B84">Aucune demi-journée cochée.</div>`}
    ${d.precisions ? l('Autres précisions', d.precisions) : ''}

    <h3>5 · Prise de rendez-vous</h3>
    ${l('Ligne directe, secrétariat ou lien', d.rdv)}
    ${l('Médecin traitant si le séjour se prolonge', d.mt)}
    ` : ''}

    <h3>${d.accepte ? '6' : '3'} · Ce à quoi cette déclaration engage — et n'engage pas</h3>
    <ol>
      <li>La déclaration vaut disponibilité annoncée. Elle ne vaut ni engagement contractuel, ni obligation
      de recevoir, ni transfert de patientèle, et ne crée aucune obligation à la charge du médecin déclarant.</li>
      <li>Seuls les motifs cochés sont adressés, dans la limite du nombre de patients indiqué. La
      coordination de la CPTS Pau Béarn rappelle le médecin avant de lui adresser un patient.</li>
      <li>Le patient reste libre du choix de son médecin. Le médecin reste libre de refuser une demande, à
      tout moment et sans justification.</li>
      <li>Aucune donnée de santé nominative de patient ne transite par les outils de la CPTS Pau Béarn :
      celle-ci oriente vers un médecin, elle ne transmet pas de dossier médical.</li>
      <li>Les coordonnées recueillies ne sont utilisées qu'aux fins d'organiser l'accès aux soins des
      personnes évacuées. Leur rectification ou leur suppression peut être demandée à tout moment auprès de
      la coordination de la CPTS Pau Béarn.</li>
    </ol>

    <h3>${d.accepte ? '7' : '4'} · Déclaration</h3>
    <div class="cachet"><b>Déclaration recueillie par voie électronique</b> le ${frdate(quand)} à
      ${frheure(quand)}, par ${esc(nom)}, médecin généraliste, qui a déclaré avoir pris connaissance du
      cadre ci-dessus et répondre dans ces conditions.
      ${d.accepte
        ? (d.diffusion
          ? " Le médecin a accepté que son nom, l'adresse de son cabinet et ses coordonnées de prise de rendez-vous soient communiqués aux pharmacies et aux structures de soins non programmés du territoire, aux seules fins d'orienter ces patients."
          : " Le médecin n'a pas accepté la communication de ses coordonnées aux pharmacies et aux structures : aucune orientation ne se fera sans un appel préalable de la coordination.")
        : " Le médecin a indiqué ne pas pouvoir recevoir de personnes évacuées dans la période actuelle."}
      Aucune signature manuscrite n'est requise.</div>

    <div class="pied">Document remis au médecin pour ses archives. Un exemplaire identique est conservé par
    la CPTS Pau Béarn au titre de la traçabilité de sa mobilisation. Coordination du recensement :
    CPTS Pau Béarn.</div>
  </div>

  <div class="actions no-print">
    <button type="button" class="btn sec" onclick="location.reload()">Répondre pour un autre médecin</button>
  </div>`);
}

demarrer();
</script>
</body>
</html>
